<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>physics10.easy - Evaluación Universitaria</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes de Google y Estilos Personalizados -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Barra de scroll elegante */
        .custom-scrollbar::-webkit-scrollbar { height: 10px; width: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Efecto cuaderno */
        .cuaderno-shadow { box-shadow: 20px 20px 60px rgba(0,0,0,0.05), -5px 0px 15px rgba(0,0,0,0.02); }
        .lomo-cuaderno { border-left: 12px solid #1e3a8a; border-radius: 4px 24px 24px 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- KaTeX cargado estáticamente para garantizar el renderizado -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Babel para compilar JSX en tiempo real en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Script principal de React usando ES Modules -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          BookOpen, ShieldAlert, GraduationCap, Play, 
          Activity, Save, Eraser, Lightbulb, Target, LayoutDashboard, RefreshCw,
          Eye, Clock, BarChart2, BrainCircuit, Timer, TrendingUp, AlertTriangle, Award,
          ArrowUp, ArrowDown, ArrowLeft, ArrowRight as ArrowRightIcon,
          ArrowUpRight, ArrowUpLeft, ArrowDownRight, ArrowDownLeft, MousePointer2,
          CheckCircle as CheckCircle2, XCircle, Info, Hand, PenTool, User, ChevronDown, LogIn, Mail, ChevronRight, ChevronLeft,
          Brain, BarChart3, Settings, Star, Scissors
        } from 'https://esm.sh/lucide-react@0.292.0';
        
        // Importaciones oficiales de Firebase (Gstatic)
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, setDoc, doc, getDocs, getDoc, serverTimestamp, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js';

        // --- 1. FIREBASE INITIALIZATION ---
        let firebaseConfig;
        
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          firebaseConfig = JSON.parse(__firebase_config);
        } else {
          // CREDENCIALES DE PRODUCCIÓN REALES
          firebaseConfig = {
            apiKey: "AIzaSyCI0c7KgnEAn-sV_CrHs0Er1LXL13CvQSA",
            authDomain: "laboratorio-de-coulomb.firebaseapp.com",
            databaseURL: "https://laboratorio-de-coulomb-default-rtdb.firebaseio.com",
            projectId: "laboratorio-de-coulomb",
            storageBucket: "laboratorio-de-coulomb.firebasestorage.app",
            messagingSenderId: "525944850850",
            appId: "1:525944850850:web:eca9c0b79809358e8d8afb",
            measurementId: "G-SZECJNG25E"
          };
        }

        const app = initializeApp(firebaseConfig);
        let analytics = null;
        if (firebaseConfig.measurementId) {
            try { analytics = getAnalytics(app); } catch(e) { console.warn("Analytics error:", e); }
        }
        
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' && __app_id ? __app_id : "electro-lms-v1";

        // --- 2. KATEX & THREE.JS HOOKS ---
        const useKaTeX = () => {
          useEffect(() => {
            if (!document.getElementById('katex-css')) {
              const link = document.createElement('link');
              link.id = 'katex-css'; link.rel = 'stylesheet';
              link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css';
              document.head.appendChild(link);
            }
          }, []);
        };

        const useThreeJS = () => {
          const [loaded, setLoaded] = useState(false);
          useEffect(() => {
            if (window.THREE && window.THREE.OrbitControls) { setLoaded(true); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            script.onload = () => {
              const controls = document.createElement('script');
              controls.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
              controls.onload = () => setLoaded(true);
              document.head.appendChild(controls);
            };
            document.head.appendChild(script);
          }, []);
          return loaded;
        };

        // --- 3. COMPONENTS ---
        const Latex = ({ text, className = "", displayMode = false }) => {
          const containerRef = useRef(null);
          useEffect(() => {
            if (window.katex && containerRef.current && text) {
              try {
                if (displayMode) {
                   window.katex.render(text.toString(), containerRef.current, { displayMode: true, throwOnError: false });
                } else {
                  const html = text.toString()
                    .replace(/\$\$(.*?)\$\$/g, (m, eq) => window.katex.renderToString(eq, { displayMode: true, throwOnError: false }))
                    .replace(/\$(.*?)\$/g, (m, eq) => window.katex.renderToString(eq, { displayMode: false, throwOnError: false }));
                  containerRef.current.innerHTML = html;
                }
              } catch (e) { containerRef.current.innerText = text; }
            } else if (containerRef.current) {
                containerRef.current.innerText = text;
            }
          }, [text, displayMode]);
          
          if (displayMode) return <div ref={containerRef} className={`my-3 text-center overflow-x-auto custom-scrollbar ${className}`} />;
          return <span ref={containerRef} className={className} dangerouslySetInnerHTML={{__html: text}} />;
        };

        // 3D Gauss Simulator
        const ThreeCanvas = ({ q1, q2, q3, q4 }) => {
          const mountRef = useRef(null);
          const isLoaded = useThreeJS();

          useEffect(() => {
            if (!isLoaded || !mountRef.current) return;
            const THREE = window.THREE;
            const width = mountRef.current.clientWidth;
            const height = mountRef.current.clientHeight;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#f8fafc'); 

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 5, 12);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            mountRef.current.innerHTML = '';
            mountRef.current.appendChild(renderer.domElement);

            const controls = new window.THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const s1Geo = new THREE.SphereGeometry(2, 32, 32);
            const s1Mat = new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.15, side: THREE.DoubleSide, wireframe: true });
            const s1 = new THREE.Mesh(s1Geo, s1Mat);
            scene.add(s1);

            const s3Geo = new THREE.SphereGeometry(4.5, 32, 32);
            const s3Mat = new THREE.MeshPhysicalMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.1, side: THREE.DoubleSide, wireframe: true });
            const s3 = new THREE.Mesh(s3Geo, s3Mat);
            scene.add(s3);

            const createCharge = (val, pos) => {
              const color = val > 0 ? 0xef4444 : 0x0ea5e9;
              const geo = new THREE.SphereGeometry(0.35, 16, 16);
              const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
              const mesh = new THREE.Mesh(geo, mat);
              mesh.position.set(pos[0], pos[1], pos[2]);
              return mesh;
            };

            scene.add(createCharge(q1, [0, 0, 0])); 
            scene.add(createCharge(q2, [1, 1, -0.5])); 
            scene.add(createCharge(q3, [-3, -1, 1])); 
            scene.add(createCharge(q4, [2, -2, 2])); 

            let animationId;
            const animate = () => {
              animationId = requestAnimationFrame(animate);
              controls.update();
              s1.rotation.y += 0.002;
              s3.rotation.y -= 0.001;
              renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
              if(!mountRef.current) return;
              camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
            };
            window.addEventListener('resize', handleResize);

            return () => {
              cancelAnimationFrame(animationId);
              window.removeEventListener('resize', handleResize);
              renderer.dispose();
            };
          }, [isLoaded, q1, q2, q3, q4]);

          return (
            <div className="relative w-full aspect-square rounded-2xl overflow-hidden shadow-inner border-2 border-slate-200 cursor-move touch-none">
              <div ref={mountRef} className="w-full h-full" />
              <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-xl text-xs font-black text-slate-700 flex items-center gap-2 border border-slate-200 shadow-sm pointer-events-none uppercase tracking-widest">
                <Activity size={16} className="text-blue-500" />
                Orbita el sistema 3D
              </div>
            </div>
          );
        };

        // Mini 3D Viewer for Gauss Matrix
        const MiniThreeSphere = ({ type, isConductor, isCut3D }) => {
          const mountRef = useRef(null);
          const isLoaded = useThreeJS();

          useEffect(() => {
            if (!isLoaded || !mountRef.current) return;
            const THREE = window.THREE;
            const w = mountRef.current.clientWidth;
            const h = mountRef.current.clientHeight;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#f8fafc'); 
            const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
            camera.position.z = 4;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.localClippingEnabled = true;
            
            mountRef.current.innerHTML = '';
            mountRef.current.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(2, 2, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            const group = new THREE.Group();
            
            const color = isConductor ? 0x10b981 : 0x3b82f6; 
            
            const clipPlanes = isCut3D ? [new THREE.Plane(new THREE.Vector3(1, 0, 0), 0)] : [];
            const chargeMat = new THREE.MeshBasicMaterial({color: 0xef4444, clippingPlanes: clipPlanes});

            if (type === 'solid') {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(1.2, 32, 32),
                    new THREE.MeshPhysicalMaterial({ 
                        color, transparent: true, opacity: isConductor ? 0.8 : 0.3, roughness: 0.2,
                        clippingPlanes: clipPlanes, side: isCut3D ? THREE.DoubleSide : THREE.FrontSide
                    })
                );
                group.add(sphere);
                
                const numCharges = 40;
                for(let i=0; i<numCharges; i++){
                    const q = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), chargeMat);
                    let r = 1.2; 
                    if(!isConductor) r = Math.pow(Math.random(), 1/3) * 1.15; 
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    q.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
                    group.add(q);
                }
            } else {
                const outer = new THREE.Mesh(
                    new THREE.SphereGeometry(1.2, 32, 32),
                    new THREE.MeshPhysicalMaterial({ 
                        color, transparent: true, opacity: 0.3, side: THREE.DoubleSide,
                        clippingPlanes: clipPlanes
                    })
                );
                const inner = new THREE.Mesh(
                    new THREE.SphereGeometry(0.6, 32, 32),
                    new THREE.MeshPhysicalMaterial({ 
                        color: 0x1e293b, wireframe: true,
                        clippingPlanes: clipPlanes
                    })
                );
                group.add(outer, inner);
                
                const numCharges = 40;
                for(let i=0; i<numCharges; i++){
                    const q = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), chargeMat);
                    let r = 1.2; 
                    if(!isConductor) r = Math.pow(Math.pow(0.6,3) + Math.random()*(Math.pow(1.15,3)-Math.pow(0.6,3)), 1/3); 
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    q.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
                    group.add(q);
                }
            }

            scene.add(group);

            if (isCut3D) group.rotation.y = Math.PI / 4;

            let animId;
            const animate = () => {
                animId = requestAnimationFrame(animate);
                group.rotation.y += 0.01;
                group.rotation.x += 0.005;
                renderer.render(scene, camera);
            };
            animate();

            return () => { cancelAnimationFrame(animId); renderer.dispose(); };
          }, [isLoaded, type, isConductor, isCut3D]);

          return <div ref={mountRef} className="w-full h-32 bg-slate-50 rounded-xl overflow-hidden shadow-inner cursor-pointer hover:scale-105 transition-transform" title="Render 3D Dinámico"></div>;
        };

        // Interactive Vector Grid
        const InteractiveVectorField = ({ systemType, id, onChange, isSubmitted }) => {
          const TOOLS = [
            { rot: -90, icon: ArrowUp }, { rot: -45, icon: ArrowUpRight }, { rot: 0, icon: ArrowRightIcon }, { rot: 45, icon: ArrowDownRight },
            { rot: 90, icon: ArrowDown }, { rot: 135, icon: ArrowDownLeft }, { rot: 180, icon: ArrowLeft }, { rot: -135, icon: ArrowUpLeft },
            { rot: null, icon: Eraser, color: 'text-red-500' }
          ];

          const [activeTool, setActiveTool] = useState(0); 
          const [grid, setGrid] = useState({}); 
          const rows = 5, cols = 5;

          const handleCellClick = (r, c) => {
            if (isSubmitted) return;
            const key = `${r}-${c}`;
            const newGrid = { ...grid };
            if (activeTool === null) delete newGrid[key];
            else newGrid[key] = activeTool;
            setGrid(newGrid);
            if(onChange) onChange(id, newGrid);
          };

          return (
            <div className="flex flex-col h-full bg-slate-50/50 rounded-2xl border-2 border-slate-200 overflow-hidden shadow-inner">
              {!isSubmitted && (
                <div className="bg-white border-b-2 border-slate-200 p-3 flex flex-wrap justify-center gap-3">
                  <div className="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center mr-2"><MousePointer2 size={16} className="mr-2"/> Selector:</div>
                  {TOOLS.map((tool, idx) => {
                    const Icon = tool.icon;
                    const isActive = activeTool === tool.rot;
                    return (
                      <button key={idx} onClick={() => setActiveTool(tool.rot)}
                        className={`p-2.5 rounded-xl transition-all border-2 ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow-md scale-110' : 'bg-white text-slate-600 border-slate-200 hover:bg-blue-50 hover:border-blue-300'} ${tool.color || ''}`}
                      >
                        <Icon size={20} />
                      </button>
                    )
                  })}
                </div>
              )}
              <div className="relative flex-grow min-h-[350px] w-full p-6">
                {systemType === 'A' ? (
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-blue-50 border-4 border-blue-600 rounded-full flex items-center justify-center font-black text-blue-600 z-10 shadow-lg text-2xl"><Latex text={"$-Q$"}/></div>
                ) : (
                  <>
                    <div className="absolute top-1/2 left-[30%] -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-red-50 border-4 border-red-600 rounded-full flex items-center justify-center font-black text-red-600 z-10 shadow-lg text-2xl"><Latex text={"$+2Q$"}/></div>
                    <div className="absolute top-1/2 left-[70%] -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-blue-50 border-4 border-blue-600 rounded-full flex items-center justify-center font-black text-blue-600 z-10 shadow-lg text-2xl"><Latex text={"$-Q$"}/></div>
                  </>
                )}
                <div className="absolute inset-6 grid" style={{ gridTemplateColumns: `repeat(${cols}, 1fr)`, gridTemplateRows: `repeat(${rows}, 1fr)` }}>
                  {Array.from({ length: rows * cols }).map((_, i) => {
                    const r = Math.floor(i / cols), c = i % cols;
                    const isChargeArea = (systemType === 'A' && r === 2 && c === 2) || (systemType === 'B' && r === 2 && (c === 1 || c === 3));

                    return (
                      <div key={`${r}-${c}`} onClick={() => !isChargeArea && handleCellClick(r, c)}
                        className={`border border-slate-300/30 flex items-center justify-center transition-colors ${!isChargeArea && !isSubmitted ? 'hover:bg-blue-100/50 cursor-pointer' : ''}`}
                      >
                        {grid[`${r}-${c}`] !== undefined && (
                          <ArrowRightIcon size={32} className="text-slate-800 drop-shadow-md transition-transform" style={{ transform: `rotate(${grid[`${r}-${c}`]}deg)` }} />
                        )}
                        {grid[`${r}-${c}`] === undefined && !isChargeArea && (
                          <div className="w-2 h-2 bg-slate-200 rounded-full opacity-50"></div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        };

        // --- E-LEARNING INTERACTIVE COMPONENTS ---
        const ERadioGroup = ({ id, options, answers, handleInputChange, isSubmitted, expected }) => {
          const isCorrect = answers[id] === expected;
          return (
            <div className="space-y-3 mt-4">
              {options.map((opt) => {
                const isSelected = answers[id] === opt.val;
                let ringClass = "border-slate-200 hover:border-blue-400 hover:bg-blue-50";
                if (isSelected) ringClass = "border-blue-500 bg-blue-50 shadow-sm ring-2 ring-blue-500/20";
                
                if (isSubmitted) {
                  if (opt.val === expected) ringClass = "border-emerald-500 bg-emerald-50 shadow-sm ring-2 ring-emerald-500/20"; 
                  else if (isSelected && !isCorrect) ringClass = "border-red-500 bg-red-50 shadow-sm"; 
                  else ringClass = "border-slate-200 bg-slate-50 opacity-50"; 
                }

                return (
                  <button 
                    key={opt.val} disabled={isSubmitted}
                    onClick={() => handleInputChange(id, opt.val)}
                    className={`w-full text-left p-3 rounded-xl border-2 transition-all flex items-start gap-3 ${ringClass}`}
                  >
                    <div className={`mt-0.5 w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center ${isSelected ? 'border-blue-500' : 'border-slate-300'}`}>
                      {isSelected && <div className={`w-2.5 h-2.5 rounded-full ${isSubmitted ? (opt.val===expected ? 'bg-emerald-500' : 'bg-red-500') : 'bg-blue-500'}`} />}
                    </div>
                    <div className="text-sm font-medium text-slate-700 leading-snug"><Latex text={opt.label}/></div>
                    {isSubmitted && opt.val === expected && <CheckCircle2 className="text-emerald-500 ml-auto flex-shrink-0" size={20}/>}
                    {isSubmitted && isSelected && !isCorrect && <XCircle className="text-red-500 ml-auto flex-shrink-0" size={20}/>}
                  </button>
                );
              })}
            </div>
          );
        };

        const InlineSelect = ({ id, value, onChange, options, points, width="w-auto", isSubmitted, expected }) => {
          const [isOpen, setIsOpen] = useState(false);
          const dropdownRef = useRef(null);

          useEffect(() => {
            const handleClickOutside = (event) => {
              if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
            };
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const isCorrect = value === expected;
          let bgClass = "bg-white hover:bg-blue-50 border-slate-300";
          let textClass = "text-slate-800";
          
          if (isSubmitted) {
            bgClass = isCorrect ? "bg-emerald-50 border-emerald-500" : "bg-red-50 border-red-500";
            textClass = isCorrect ? "text-emerald-800" : "text-red-800";
          }

          const selectedOption = options.find(o => o.val === value);

          return (
            <span ref={dropdownRef} className={`inline-flex items-center gap-1 mx-1 relative group ${width}`}>
              <div className="relative w-full">
                <button 
                  type="button" disabled={isSubmitted} onClick={() => setIsOpen(!isOpen)}
                  className={`w-full px-4 py-2 min-h-[46px] text-base font-bold border-2 ${bgClass} ${textClass} rounded-xl outline-none transition-all shadow-sm flex items-center justify-between cursor-pointer disabled:cursor-default`}
                >
                  <span className="flex-grow text-center flex items-center justify-center overflow-hidden">
                    {selectedOption ? <Latex text={selectedOption.label} /> : <span className="text-slate-400 font-normal text-sm whitespace-nowrap">-- selec --</span>}
                  </span>
                  {!isSubmitted && <ChevronDown size={18} className={`text-slate-400 flex-shrink-0 transition-transform ml-2 ${isOpen ? 'rotate-180' : ''}`} />}
                </button>

                {isOpen && !isSubmitted && (
                  <div className="absolute z-[100] w-max min-w-full top-full mt-2 left-1/2 -translate-x-1/2 bg-white border-2 border-slate-200 rounded-xl shadow-2xl max-h-64 overflow-y-auto custom-scrollbar">
                    {options.map((o) => (
                      <div
                        key={o.val} onClick={() => { onChange(id, o.val); setIsOpen(false); }}
                        className="px-6 py-4 hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-b-0 transition-colors text-center text-slate-800 font-bold flex items-center justify-center"
                      >
                        <Latex text={o.label} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
              {!isSubmitted && <span className="text-[10px] font-black text-red-600 absolute -top-3 right-0 opacity-100 bg-red-50 px-1.5 py-0.5 rounded shadow-sm border border-red-100 z-10 pointer-events-none">[{points}]</span>}
            </span>
          );
        };

        const TipButton = ({ text, id, usedTips, setUsedTips }) => {
          const [isOpen, setIsOpen] = useState(false);
          const isUsed = usedTips.includes(id);

          const toggleTip = () => {
            if (!isUsed) setUsedTips(prev => [...prev, id]);
            setIsOpen(!isOpen);
          };

          return (
            <div className="mt-4">
              <button onClick={toggleTip} className={`flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-xl transition-colors ${isOpen ? 'bg-amber-100 text-amber-800' : 'bg-white border-2 border-slate-200 text-slate-500 hover:border-amber-300 hover:text-amber-600'}`}>

            attempts.forEach(a => {
                if (a.score <= 1.0) bins[0]++;
                else if (a.score <= 2.0) bins[1]++;
                else if (a.score <= 3.0) bins[2]++;
                else bins[3]++;
            });
            const maxBin = Math.max(...bins, 1);

            return (
                <div className="flex items-end h-40 gap-4 mt-4">
                    {bins.map((val, idx) => {
                        const height = (val / maxBin) * 100;
                        const labels = ["0.0 - 1.0", "1.1 - 2.0", "2.1 - 3.0", "3.1 - 4.0"];
                        return (
                            <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full group relative">

                  try {
                      // Usamos la colección de directorio para leer vistas seguras sin faltar a las reglas de write

                      }, (error) => console.log("Vistas:", error.message));
        
                      // Ruta corregida y segura para reviews

                      onSnapshot(reviewsRef, (snap) => {
                          let sum = 0; let count = 0;
                          snap.forEach(doc => { sum += doc.data().stars; count++; });

                      }, (error) => console.log("Reviews:", error.message));

              };
              
              setupListeners();
          }, [user]);

          // Auth Handlers
          const handleGoogleLogin = async () => {
            setAuthError("");
            const provider = new GoogleAuthProvider();
            try {
              await signInWithPopup(auth, provider);
            } catch (error) {
              setAuthError("Error de autenticación con Google. Revisa consola.");
            }
          };

          const handleEmailLogin = async (e) => {
            e.preventDefault();
            setAuthError("");
            const email = e.target.email.value;
            const pass = e.target.password.value;
            try {
              await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
              if(error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {

                      setAuthError("Error al crear cuenta: " + err2.message);
                  }
              } else {
                  setAuthError("Credenciales incorrectas.");
              }
            }
          };

          // Role and Auth Observer
          useEffect(() => {
            const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                  // Register directory to allow reading all
                  if (!currentUser.isAnonymous) {

                          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'directory', currentUser.uid), {
                              email: currentUser.email || 'Google Auth',

                          }, { merge: true });

              } else {

                  setView('login');

              setLoading(false);

            return () => unsubscribe();
          }, []);

          // Fetch Dashboard Real Data
          const fetchDashboardData = async () => {
              try {
                  const dirSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'directory'));
                  let allAttempts = [];
                  let totalScore = 0;
                  let totalTime = 0;
                  let totalHints = 0;
                  let s1 = 0, s2 = 0, s3 = 0;

                  // Admin reads ALL attempts iterating the directory
                  for (const userDoc of dirSnap.docs) {
                      const uid = userDoc.id;
                      const email = userDoc.data().email;
                      const attSnap = await getDocs(collection(db, 'artifacts', appId, 'users', uid, 'eval_attempts'));
                      
                      attSnap.forEach(doc => {
                          const data = doc.data();
                          allAttempts.push({
                              id: doc.id,
                              agent: email,
                              score: data.score,
                              time: data.time,
                              hints: data.hints || 0,
                              date: data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : 'Reciente',
                              timestamp: data.timestamp ? data.timestamp.toMillis() : 0
                          });
                          totalScore += parseFloat(data.score);
                          totalTime += data.time;
                          totalHints += (data.hints || 0);
                          
                          s1 += data.details?.s1 || (data.score * 0.25);
                          s2 += data.details?.s2 || (data.score * 0.375);
                          s3 += data.details?.s3 || (data.score * 0.375);
                      });
                  }

                  allAttempts.sort((a,b) => b.timestamp - a.timestamp);
                  const count = allAttempts.length || 1;
                  const aScore = totalScore / count;
                  const aTime = totalTime / count;

                  // Frustration Index: (Time factor) * (Hints factor) / (Score factor)
                  const frustration = count > 0 ? Math.min((aTime / 600) * (1 + totalHints/count) / Math.max(aScore, 0.1), 10).toFixed(1) : 0;

                  setMetrics({
                      views: dirSnap.size,
                      avgScore: aScore.toFixed(2),
                      avgTime: Math.floor(aTime),
                      frustrationIndex: frustration,
                      attempts: allAttempts.slice(0, 50), 
                      questionMetrics: [
                          { id: 'Q1', title: 'Hoja 1: Naturaleza', avgScore: (s1/count).toFixed(2), avgTime: Math.floor(aTime * 0.2), status: (s1/count)>0.7 ? 'optimal' : 'review' },
                          { id: 'Q2', title: 'Hoja 2: Ley de Coulomb', avgScore: (s2/count).toFixed(2), avgTime: Math.floor(aTime * 0.4), status: (s2/count)>1.0 ? 'optimal' : 'critical' },
                          { id: 'Q3', title: 'Hoja 3: Matriz Universal Gauss', avgScore: (s3/count).toFixed(2), avgTime: Math.floor(aTime * 0.4), status: (s3/count)>1.0 ? 'optimal' : 'critical' }
                      ]
                  });
              } catch(e) { console.error("Error al cargar dashboard:", e); }

          const saveConfig = async () => {

          useEffect(() => {

            for (const item of opts) { if(!map.has(item.label)){ map.set(item.label, true); uniqueOpts.push(item); } }
            return uniqueOpts.sort(() => Math.random() - 0.5);

            const opts = [
              {val: `${correct}q`, label: `$\\frac{${correct}q}{\\epsilon_0}$`},

            for (const item of opts) { if(!map.has(item.label)){ map.set(item.label, true); uniqueOpts.push(item); } }
            return uniqueOpts.sort(() => Math.random() - 0.5);

          const coulombR2Opts = [{val: 'R^2 + z^2', label: '$R^2 + z^2$'}, {val: '(r\')^2 + z^2', label: '$(r\')^2 + z^2$'}, {val: 'x^2 + y^2', label: '$x^2 + y^2$'}];
          const coulombSymOpts = [{val: 'x,y', label: '$dE_x , dE_y$'}, {val: 'y,z', label: '$dE_y , dE_z$'}, {val: 'ninguna', label: '$\\text{Ninguna}$'}];
          const coulombIntOpts = [{val: '0..2pi', label: '$\\int_0^{2\\pi}$'}, {val: '0..R', label: '$\\int_0^R$'}, {val: '0..a', label: '$\\int_0^a$'}];

          const gaussDistOpts = [ {val: 'vol', label: '$\\text{Todo el volumen}$'}, {val: 'sup_ext', label: '$\\text{Superficie exterior}$'}, {val: 'vol_casc', label: '$\\text{Volumen } a < r < b$'} ];
          const gaussAreaOpts = [ {val: 'E(4pir^2)', label: '$E(4\\pi r^2)$'}, {val: 'E(2pirL)', label: '$E(2\\pi r L)$'} ];
          const gaussQencOpts = [ {val: '0', label: '$0$'}, {val: 'Q', label: '$Q$'}, {val: 'rho_v_esf', label: '$\\rho \\frac{4}{3}\\pi r^3$'}, {val: 'rho_v_casc', label: '$\\rho \\frac{4}{3}\\pi (r^3 - a^3)$'} ];
          const gaussEOpts = [ {val: '0', label: '$0$'}, {val: 'E_ext', label: '$\\frac{Q}{4\\pi\\epsilon_0 r^2}$'}, {val: 'E_ins', label: '$\\frac{\\rho r}{3\\epsilon_0}$'}, {val: 'E_casc', label: '$\\frac{\\rho(r^3-a^3)}{3\\epsilon_0 r^2}$'} ];


          const calculateScore = () => {
            let total = 0;
            let s1=0, s2=0, s3=0;
            
            // Level 1 & 2 (Hoja 1) - Max 1.0
            if(answers.t1 === 'Frotamiento') s1 += 0.02; if(answers.t2 === 'Contacto') s1 += 0.02; if(answers.t3 === 'Inducción') s1 += 0.02;
            if(answers.o1 === 'transfer') s1 += 0.03; if(answers.o2 === 'equil') s1 += 0.03; if(answers.o3 === 'ground') s1 += 0.03;
            if(answers.sym1 === '\\lambda') s1 += 0.01; if(answers.f1 === '\\lambda dl') s1 += 0.02; if(answers.u1 === '\\text{C/m}') s1 += 0.02;
            if(answers.sym2 === '\\sigma') s1 += 0.01; if(answers.f2 === '\\sigma dA') s1 += 0.02; if(answers.u2 === '\\text{C/m}^2') s1 += 0.02;
            if(answers.sym3 === '\\rho') s1 += 0.01; if(answers.f3 === '\\rho dV') s1 += 0.02; if(answers.u3 === '\\text{C/m}^3') s1 += 0.02;

            if(answers.b1 === 'dos') s1 += 0.025; if(answers.b2 === 'una') s1 += 0.025; if(answers.b3 === 'q_0 \\vec{E}') s1 += 0.05;
            const vCountA = Object.keys(answers.canvasA || {}).length; const vCountB = Object.keys(answers.canvasB || {}).length;
            if(vCountA > 3) s1 += 0.10; if(vCountB > 4) s1 += 0.10;

            const e1 = examVars.q1 + examVars.q2; const e3 = examVars.q1 + examVars.q2 + examVars.q3 + examVars.q4;
            if(answers.p1 === `${e1}q`) s1 += 0.15; if(answers.p3 === `${e3}q`) s1 += 0.15; if(answers.pt === 'no') s1 += 0.10;

            // Level 4 (Hoja 2 Coulomb) - Max 1.50
            if(answers.c1_den === '\\lambda') s2 += 0.05; if(answers.c1_dq === '\\lambda R d\\theta') s2 += 0.05; if(answers.c1_r2 === 'R^2 + z^2') s2 += 0.10; if(answers.c1_sym === 'x,y') s2 += 0.10; if(answers.c1_int === '0..2pi') s2 += 0.10; if(answers.c1_num?.includes('115')) s2 += 0.10; 
            if(answers.c2_den === '\\sigma') s2 += 0.05; if(answers.c2_dq === '\\sigma 2\\pi r\' dr\'') s2 += 0.05; if(answers.c2_r2 === '(r\')^2 + z^2') s2 += 0.10; if(answers.c2_sym === 'x,y') s2 += 0.10; if(answers.c2_int === '0..R') s2 += 0.10; if(answers.c2_num?.includes('151')) s2 += 0.10;
            if(answers.c3_den === '\\lambda') s2 += 0.05; if(answers.c3_dq === '\\lambda dy') s2 += 0.05; if(answers.c3_r2 === 'x^2 + y^2') s2 += 0.10; if(answers.c3_sym === 'ninguna') s2 += 0.10; if(answers.c3_int === '0..a') s2 += 0.10; if(answers.c3_num?.length > 1) s2 += 0.10; 

            // Level 5 (Hoja 3 Gauss Matrix) - Max 1.50
            const checkG = (id, exp, pts) => { if(answers[id] === exp) s3 += pts; }
            checkG('g1_dist', 'vol', 0.025); checkG('g2_dist', 'sup_ext', 0.025); checkG('g3_dist', 'vol_casc', 0.025); checkG('g4_dist', 'sup_ext', 0.025);
            checkG('g1_area', 'E(4pir^2)', 0.025); checkG('g2_area', 'E(4pir^2)', 0.025); checkG('g3_area', 'E(4pir^2)', 0.025); checkG('g4_area', 'E(4pir^2)', 0.025);
            checkG('g1_qi', 'rho_v_esf', 0.0125); checkG('g2_qi', '0', 0.0125); checkG('g3_qi', '0', 0.0125); checkG('g4_qi', '0', 0.0125);
            checkG('g1_ei', 'E_ins', 0.0125); checkG('g2_ei', '0', 0.0125); checkG('g3_ei', '0', 0.0125); checkG('g4_ei', '0', 0.0125);
            checkG('g1_qm', 'rho_v_esf', 0.0125); checkG('g2_qm', '0', 0.0125); checkG('g3_qm', 'rho_v_casc', 0.0125); checkG('g4_qm', '0', 0.0125);
            checkG('g1_em', 'E_ins', 0.0125); checkG('g2_em', '0', 0.0125); checkG('g3_em', 'E_casc', 0.0125); checkG('g4_em', '0', 0.0125);
            checkG('g1_qe', 'Q', 0.0125); checkG('g2_qe', 'Q', 0.0125); checkG('g3_qe', 'Q', 0.0125); checkG('g4_qe', 'Q', 0.0125);
            checkG('g1_ee', 'E_ext', 0.0125); checkG('g2_ee', 'E_ext', 0.0125); checkG('g3_ee', 'E_ext', 0.0125); checkG('g4_ee', 'E_ext', 0.0125);
            if(answers.g1_pot?.length > 2) s3 += 0.05; if(answers.g2_pot?.length > 2) s3 += 0.05; if(answers.g3_pot?.length > 2) s3 += 0.05; if(answers.g4_pot?.length > 2) s3 += 0.05;
            checkG('g1_graph', 'linear_decay', 0.125); checkG('g2_graph', 'zero_decay', 0.125); checkG('g3_graph', 'zero_curve_decay', 0.125); checkG('g4_graph', 'zero_zero_decay', 0.125);

            total = s1 + s2 + s3 - (usedTips.length * 0.02);
            return { total: Math.max(Math.min(total, 4.0), 0).toFixed(2), details: { s1, s2, s3 } };
          };

          const handleSubmit = async () => {
            if(!window.confirm("¿Seguro que deseas procesar la evaluación definitiva?")) return;
            const result = calculateScore();
            setScore(result.total);
            setFinalTime(timeElapsed);

              try {
                const userRef = collection(db, 'artifacts', appId, 'users', user.uid, 'eval_attempts');
                await addDoc(userRef, { score: result.total, maxScore: 4.0, time: timeElapsed, hints: usedTips.length, details: result.details, timestamp: serverTimestamp() });
              } catch (e) { console.error("Error guardando intento:", e); }
            }
          };

          const formatTime = (sec) => sec != null ? `${Math.floor(sec / 60)}m ${(sec % 60).toString().padStart(2, '0')}s` : '0m 00s';

          if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50"><Activity className="animate-pulse text-blue-600" size={48} /></div>;

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 font-sans selection:bg-blue-200 pb-24 relative overflow-x-hidden flex flex-col">
              {/* Background styling */}
              <div className="fixed inset-0 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: '30px 30px', opacity: 0.3, zIndex: -1 }}></div>

              {/* HEADER */}
              <header className="bg-white border-b border-slate-300 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm relative">
                <div className="flex items-center gap-3">
                  <div className="bg-slate-900 p-2.5 rounded-xl shadow-inner border border-slate-700 cursor-pointer transition-transform hover:scale-105" onClick={() => user && user.email === 'dudbilopr@gmail.com' ? setView('admin_role_select') : null}>
                    <Activity className="text-blue-400" size={24} />
                  </div>
                  <h1 className="font-black text-2xl tracking-tight text-slate-900 hidden sm:block">
                    physics10<span className="text-blue-600">.easy</span>
                  </h1>
                </div>
                <div className="flex items-center gap-4">
                  {user && (
                     <div className="hidden md:flex items-center gap-2 text-sm font-bold text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-inner">
                       <User size={16}/> {user.email || 'Agente Registrado'}
                     </div>
                  )}
                  {role && (
                    <div className="flex items-center gap-3 bg-slate-100 px-5 py-2 rounded-full border border-slate-200 shadow-inner">
                      <span className={`flex items-center gap-2 text-sm font-black uppercase tracking-wider ${role==='student'?'text-emerald-700': 'text-blue-700'}`}>
                        {role === 'student' ? <GraduationCap size={18}/> : role === 'teacher' ? <BookOpen size={18}/> : <Settings size={18}/>}
                        <span className="hidden sm:inline">{role === 'student' ? 'Estudiante' : role === 'teacher' ? 'Docente' : 'Admin'}</span>
                      </span>
                      <div className="w-px h-5 bg-slate-300"></div>
                      <button onClick={() => signOut(auth)} className="text-sm font-bold text-slate-500 hover:text-slate-900 transition-colors">SALIR</button>
                    </div>
                  )}
                </div>
              </header>

              {/* VIEW: LOGIN */}
              {view === 'login' && (
                <div className="flex flex-col items-center justify-center mt-20 px-4 animate-in fade-in duration-700 flex-grow">
                  <div className="text-center max-w-3xl mb-12">
                    <h2 className="text-6xl font-black text-slate-900 mb-6 tracking-tight leading-tight">physics10<span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-violet-600">.easy</span></h2>
                    <p className="text-xl text-slate-600 font-medium">Inicia sesión para acceder a tu evaluación. Tu rol se determinará automáticamente de acuerdo a tus credenciales registradas.</p>
                  </div>
                  
                  <div className="bg-white p-10 rounded-[2.5rem] border-2 border-slate-200 shadow-xl w-full max-w-md relative z-10">
                    {authError && <div className="mb-6 p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-bold text-center">{authError}</div>}
                    
                    <button onClick={handleGoogleLogin} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mb-6 transition-colors shadow-md">
                        <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Ingresar con Google
                    </button>
                    
                    <div className="relative flex items-center py-5">
                        <div className="flex-grow border-t border-slate-200"></div>

                            <input type="password" name="password" required className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-blue-500 outline-none transition-colors" placeholder="••••••••" />
                        </div>
                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors shadow-md mt-4">

                <span className="text-xs text-slate-500 font-black uppercase tracking-widest bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm">Identificación Cuellos de botella</span>
              </div>
              <div className="p-6 border-b border-slate-100 bg-white">
                 <h4 className="font-bold text-slate-700 mb-2 uppercase text-sm tracking-widest">Campana de Notas (Frecuencia)</h4>
                 <ScoreHistogram attempts={metrics.attempts} />
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="text-xs uppercase tracking-widest text-slate-500 border-b-2 border-slate-100 bg-slate-50">
                      <th className="px-8 py-5 font-black">Misión Evaluada</th>
                      <th className="px-8 py-5 font-black">Nota Media</th>
                      <th className="px-8 py-5 font-black">T. Medio</th>
                      <th className="px-8 py-5 font-black">Estado del Grupo</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-base font-bold bg-white">
                    {metrics.questionMetrics.map(q => (
                      <tr key={q.id} className="hover:bg-slate-50 transition-colors group">
                        <td className="px-8 py-6 text-slate-800 flex items-center gap-4">
                          <div className={`w-3 h-3 rounded-full shadow-inner ${q.status === 'optimal' ? 'bg-emerald-500' : q.status === 'review' ? 'bg-amber-500' : 'bg-red-500'}`}></div>
                          {q.title}
                        </td>
                        <td className="px-8 py-6 font-mono text-slate-600 text-lg">{q.avgScore}</td>
                        <td className="px-8 py-6 font-mono text-slate-500 flex items-center gap-2"><Timer size={16} className="text-slate-400"/> {q.avgTime}s</td>
                        <td className="px-8 py-6">
                          {q.status === 'optimal' ? <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Óptimo</span> :
                           q.status === 'review' ? <span className="bg-amber-50 text-amber-700 border border-amber-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Revisar</span> :
                           <span className="bg-red-50 text-red-700 border border-red-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Crítico</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
              <div className="px-8 py-6 border-b border-slate-200 bg-slate-50">
                <h3 className="font-black text-slate-800 text-xl">Últimos Entregados (Real)</h3>
              </div>
              <div className="p-0 flex-grow bg-white overflow-y-auto max-h-[500px]">
                {metrics.attempts.length === 0 ? (
                  <div className="p-8 text-center text-slate-400 font-bold">No hay evaluaciones registradas en Firestore.</div>
                ) : (
                  metrics.attempts.map((a, idx) => (
                    <div key={idx} className="p-8 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                      <div className="flex justify-between items-center mb-3">
                        <span className="font-black text-slate-800 text-sm break-all" title={a.agent}>{a.agent.length > 20 ? a.agent.substring(0,18)+'...' : a.agent}</span>
                        <span className={`font-mono font-black text-base px-3 py-1.5 rounded-lg border flex-shrink-0 ${a.score > 2.0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm' : 'bg-red-50 text-red-700 border-red-200 shadow-sm'}`}>{a.score} pts</span>
                      </div>
                      <div className="flex justify-between items-center text-xs text-slate-500 font-bold uppercase tracking-wider mt-2">
                        <span>{a.date}</span>
                        <span className="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200"><Timer size={14}/> {formatTime(a.time)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER Nivel Producción */}
      <footer className="mt-auto py-8 bg-slate-900 border-t border-slate-800 text-center relative z-50">
          <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 gap-4">
              <div className="text-slate-400 font-medium text-sm">
                  &copy; 2026 <span className="font-black text-white">physics10.easy</span> - Todos los derechos reservados.
              </div>
              
              <div className="flex items-center gap-6">
                  <div className="flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow-inner">
                      {[1,2,3,4,5].map(star => (
                         <Star key={star} size={14} className={`text-amber-400 ${star <= Math.round(ratingStats.average) ? 'fill-current' : ''}`} />
                      ))}
                      <span className="ml-2 font-bold text-amber-100 text-xs">{ratingStats.average}/5 ({ratingStats.count})</span>
                  </div>
                  
                  <div className="flex items-center gap-2 text-xs font-bold text-blue-400">
                      <Eye size={14}/>
                      <span>{realViews} Vistas en tiempo real</span>
                  </div>
              </div>
          </div>
      </footer>

    </div>
  );
}
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
