<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness10.easy - Alto Rendimiento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Core */
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 1.25rem;
        }

        .glass-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            color: #38bdf8;
        }

        .glass-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            color: #fff;
        }

        .glass-btn-danger {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #f43f5e;
        }
        .glass-btn-danger:hover {
            background: rgba(244, 63, 94, 0.25);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
            color: #fff;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }

        /* Sidebar Transition */
        #sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 1024px) {
            .sidebar-closed { transform: translateX(0); width: 5rem; }
            .sidebar-closed .sidebar-text { display: none; }
            .sidebar-closed .logo-text { display: none; }
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .timer-glow { text-shadow: 0 0 20px rgba(56, 189, 248, 0.8); }
        .timer-penalty { text-shadow: 0 0 20px rgba(244, 63, 94, 0.8); color: #f43f5e; }
    </style>
</head>
<body class="antialiased">

    <!-- Modal System Overlay -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm">
        <div id="modal-content" class="glass-panel p-6 max-w-md w-full mx-4 transform transition-all scale-95 opacity-0">
            <h3 id="modal-title" class="text-xl font-bold text-white mb-2"></h3>
            <div id="modal-body" class="text-gray-300 mb-6 text-sm"></div>

        </div>
    </div>

    <!-- App Root -->
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Auth View -->
        <div id="auth-view" class="w-full h-full flex items-center justify-center p-4">
            <div class="glass-panel p-8 max-w-md w-full relative animate-fade-in">
                <div class="text-center mb-8">
                    <i class="fa-solid fa-dumbbell text-4xl text-sky-400 mb-3"></i>
                    <h1 class="text-3xl font-bold tracking-wider text-white">Fitness10<span class="text-sky-400 font-light">.easy</span></h1>
                    <p class="text-gray-400 text-sm mt-2">Ciencia del Deporte & Nutrición</p>
                </div>

                <div class="space-y-4">
                    <input type="email" id="auth-email" placeholder="Correo Electrónico" class="w-full px-4 py-3 rounded-xl glass-input">
                    <input type="password" id="auth-password" placeholder="Contraseña" class="w-full px-4 py-3 rounded-xl glass-input">
                    
                    <button onclick="appManager.loginEmail()" class="w-full py-3 rounded-xl glass-btn font-semibold text-white flex justify-center items-center gap-2">
                        <i class="fa-solid fa-envelope"></i> Ingresar / Registrarse
                    </button>
                    
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-gray-600"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-500 text-sm">O</span>
                        <div class="flex-grow border-t border-gray-600"></div>
                    </div>

                    <button onclick="appManager.loginGoogle()" class="w-full py-3 rounded-xl bg-white text-gray-900 font-semibold hover:bg-gray-100 transition shadow-lg flex justify-center items-center gap-2">

                    </button>
                </div>
            </div>
        </div>

        <!-- Main App Layout -->
        <div id="main-layout" class="hidden w-full h-full flex">
            <!-- Sidebar -->
            <aside id="sidebar" class="glass w-64 h-full flex flex-col absolute lg:relative z-40">
                <div class="p-4 flex items-center justify-between border-b border-gray-700/50">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bolt text-sky-400 text-xl"></i>
                        <span class="logo-text font-bold text-lg tracking-wide">Fit10<span class="text-sky-400 font-light">.easy</span></span>
                    </div>
                    <button onclick="appManager.toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white">
                        <i class="fa-solid fa-times text-xl"></i>
                    </button>
                </div>

                <div class="p-4 border-b border-gray-700/50 flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-sky-400 to-blue-600 flex items-center justify-center text-xl font-bold shadow-lg mb-2" id="user-avatar-initial"></div>
                    <p id="user-name-display" class="sidebar-text font-medium text-sm text-center truncate w-full"></p>
                    <span id="user-role-badge" class="sidebar-text text-xs px-2 py-1 rounded-full bg-slate-800 text-sky-300 mt-1"></span>
                </div>

                <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
                    <button onclick="appManager.navigate('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-chart-pie w-5"></i> <span class="sidebar-text text-sm">Dashboard</span>
                    </button>
                    <button onclick="appManager.navigate('profile')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-user-astronaut w-5"></i> <span class="sidebar-text text-sm">Onboarding & Perfil</span>
                    </button>
                    <button onclick="appManager.navigate('anthropometry')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-ruler-combined w-5"></i> <span class="sidebar-text text-sm">Antropometría</span>
                    </button>
                    <button onclick="appManager.navigate('nutrition')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-apple-whole w-5"></i> <span class="sidebar-text text-sm">Nutrición Avanzada</span>
                    </button>
                    <button onclick="appManager.navigate('training')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-dumbbell w-5"></i> <span class="sidebar-text text-sm">Alto Rendimiento</span>
                    </button>
                    <button onclick="appManager.navigate('analytics')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-chart-line w-5"></i> <span class="sidebar-text text-sm">Historial & Sueño</span>
                    </button>
                    <button onclick="appManager.navigate('clinical')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn">
                        <i class="fa-solid fa-stethoscope w-5"></i> <span class="sidebar-text text-sm">Clínica & Ciencia</span>
                    </button>

                    <button id="admin-nav-btn" onclick="appManager.navigate('admin')" class="hidden w-full flex items-center gap-3 px-4 py-3 rounded-xl text-purple-400 hover:bg-purple-900/20 transition-colors nav-btn">
                        <i class="fa-solid fa-crown w-5"></i> <span class="sidebar-text text-sm">Admin Zone</span>
                    </button>
                </nav>

                <div class="p-4 border-t border-gray-700/50">
                    <button onclick="appManager.logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-red-900/20 hover:text-red-400 transition-colors">
                        <i class="fa-solid fa-sign-out-alt w-5"></i> <span class="sidebar-text text-sm">Cerrar Sesión</span>
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <div class="flex-1 flex flex-col h-full relative">
                <!-- Top Header Mobile -->
                <header class="lg:hidden glass p-4 flex items-center justify-between sticky top-0 z-30">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-sky-400"></i>
                        <span class="font-bold text-lg">Fit10<span class="text-sky-400 font-light">.easy</span></span>
                    </div>
                    <button onclick="appManager.toggleSidebar()" class="text-white p-2 glass-btn rounded-lg">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </header>

                <!-- Dynamic Views Container -->
                <main id="view-container" class="flex-1 overflow-y-auto p-4 lg:p-8 pb-24"></main>

                <!-- Footer -->
                <footer class="glass absolute bottom-0 w-full p-3 text-center flex flex-col sm:flex-row justify-between items-center text-xs text-gray-400 z-20">
                    <p>&copy; 2026 Fitness10.easy. Todos los derechos reservados.</p>
                    <div class="flex gap-4 mt-2 sm:mt-0 justify-center">
                        <a href="https://wa.me/573000000000?text=Hola,%20vengo%20de%20Fitness10.easy.%20Necesito%20tutoría%20o%20soporte%20con%20la%20app" target="_blank" class="flex items-center gap-2 text-green-500 hover:text-green-400 transition-colors">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Soporte / Tutoría
                        </a>
                        <a href="#" onclick="window.open('https://paypal.me/','_blank')" class="flex items-center gap-2 hover:text-sky-400 transition-colors">
                            <i class="fa-brands fa-paypal text-lg"></i> Invítame un café
                        </a>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase y Variables Globales
        const firebaseConfig = {
            apiKey: "AIzaSyCI0c7KgnEAn-sV_CrHs0Er1LXL13CvQSA",
            authDomain: "laboratorio-de-coulomb.firebaseapp.com",
            databaseURL: "https://laboratorio-de-coulomb-default-rtdb.firebaseio.com",
            projectId: "laboratorio-de-coulomb",
            storageBucket: "laboratorio-de-coulomb.firebasestorage.app",
            messagingSenderId: "525944850850",
            appId: "1:525944850850:web:eca9c0b79809358e8d8afb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = 'dudbilopr@gmail.com';
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'fitness10-prod';

        // Estado Global
        const state = {
            user: null,
            profile: {},
            antropo: {},
            nutrition: { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 } },
            exercises: [],
            health: {}, 
            activeDate: new Date().toISOString().split('T')[0], 
            activeWorkoutDate: new Date().toISOString().split('T')[0],
            dailyWorkout: null,
            unsubNutri: null, 
            unsubWorkout: null,
            unsubscribers: []
        };

        // --- SISTEMA DE MODALES (Sustituto de alert/confirm) ---
        const ModalSystem = {
            show: (title, message, type = 'info', onConfirm = null) => {
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-body').innerHTML = message;
                
                let actionsHTML = '';
                if (type === 'confirm') {
                    actionsHTML = `
                        <button id="modal-cancel" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white transition">Cancelar</button>
                        <button id="modal-ok" class="px-4 py-2 rounded-lg glass-btn text-white">Confirmar</button>
                    `;
                } else {
                    actionsHTML = `<button id="modal-ok" class="px-4 py-2 rounded-lg glass-btn text-white">Aceptar</button>`;
                }
                
                document.getElementById('modal-actions').innerHTML = actionsHTML;
                container.classList.remove('hidden');
                
                // Animar entrada
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);

                const close = () => {
                    content.classList.remove('scale-100', 'opacity-100');
                    content.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => container.classList.add('hidden'), 200);
                };

                document.getElementById('modal-ok').onclick = () => {
                    close();
                    if(onConfirm) onConfirm();
                };
                if(document.getElementById('modal-cancel')) {
                    document.getElementById('modal-cancel').onclick = close;
                }
            },
            alert: (msg) => ModalSystem.show('Notificación', msg, 'info'),
            confirm: (msg, callback) => ModalSystem.show('Confirmación', msg, 'confirm', callback)
        };
        window.CustomAlert = ModalSystem.alert;

        // --- GESTOR PRINCIPAL (Expose to window for inline onclicks) ---
        window.appManager = {
            loginGoogle: async () => {
                try {
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(auth, provider);
                } catch (e) { 
                    ModalSystem.alert("Error en login con Google: Es posible que el navegador bloquee las ventanas emergentes por seguridad. Intenta con Correo/Contraseña.<br><br><span class='text-xs text-red-400'>" + e.message + "</span>"); 
                }
            },
            loginEmail: async () => {
                const email = document.getElementById('auth-email').value;
                const pass = document.getElementById('auth-password').value;
                if(!email || !pass) return ModalSystem.alert("Ingresa correo y contraseña.");
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch (e) {
                    if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
                        ModalSystem.confirm("Usuario no encontrado. ¿Deseas registrarte con estos datos?", async () => {
                            try {
                                await createUserWithEmailAndPassword(auth, email, pass);
                            } catch (err) { ModalSystem.alert("Error al registrar: " + err.message); }
                        });
                    } else {
                        ModalSystem.alert("Error: " + e.message);
                    }
                }
            },
            logout: () => {
                ModalSystem.confirm("¿Seguro que deseas salir?", () => signOut(auth));
            },
            toggleSidebar: () => {
                document.getElementById('sidebar').classList.toggle('sidebar-closed');
            },
            navigate: (viewId) => {
                renderView(viewId);
            },
            subscribeNutrition: (dateStr) => {
                if(!state.user) return;
                if(state.unsubNutri) state.unsubNutri(); // Limpiar el listener anterior
                const nutriRef = doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'nutrition', dateStr);
                state.unsubNutri = onSnapshot(nutriRef, (docSnap) => {
                    if(docSnap.exists()) {
                        state.nutrition = docSnap.data();
                        if(!state.nutrition.supplements) state.nutrition.supplements = { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 };
                    } else {
                        state.nutrition = { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 }};
                    }
                    if(currentViewId === 'nutrition') renderView('nutrition'); // Refresh si está en la vista
                });
            },
            subscribeWorkout: (dateStr) => {
                if(!state.user) return;
                if(state.unsubWorkout) state.unsubWorkout();
                const workoutRef = doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', dateStr);
                state.unsubWorkout = onSnapshot(workoutRef, (snap) => {
                    state.dailyWorkout = snap.exists() ? snap.data() : null;
                    if(currentViewId === 'training') renderView('training');
                    if(currentViewId === 'dashboard') renderView('dashboard');
                });
            },
            // Generadores de Helpers de UI
            saveIndicator: (id) => {
                const el = document.getElementById(id);
                if(el) {
                    el.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Guardado';
                    setTimeout(() => el.innerHTML = '', 2000);
                }
            }
        };

        // --- LÓGICA DE AUTENTICACIÓN ---
        onAuthStateChanged(auth, async (user) => {
            state.user = user;
            if (user) {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-layout').classList.remove('hidden');
                
                // Configurar UI de usuario
                const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                document.getElementById('user-avatar-initial').innerText = initial;
                document.getElementById('user-name-display').innerText = user.displayName || user.email;
                
                const isAdmin = user.email === ADMIN_EMAIL;
                document.getElementById('user-role-badge').innerText = isAdmin ? 'Admin Supremo' : 'Atleta / Usuario';
                
                if (isAdmin) document.getElementById('admin-nav-btn').classList.remove('hidden');
                
                // Cargar datos y listeners
                loadUserData();
                renderView('dashboard');
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('main-layout').classList.add('hidden');
                clearListeners();
            }
        });

        function clearListeners() {
            state.unsubscribers.forEach(unsub => unsub());
            state.unsubscribers = [];
        }

        // --- CARGA Y SINCRONIZACIÓN DE DATOS (Firestore) ---
        async function loadUserData() {
            if(!state.user) return;
            const uid = state.user.uid;
            
            // 1. Perfil y Onboarding (Ruta Segura)
            const profileRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'profile', 'data');
            const unsubProfile = onSnapshot(profileRef, (docSnap) => {
                if(docSnap.exists()) {
                    state.profile = docSnap.data();
                    calculateTimeMetrics();
                } else {
                    // Inicializar si no existe
                    setDoc(profileRef, {
                        createdAt: new Date().toISOString(),
                        cycleDays: 13,
                        startDate: new Date().toISOString().split('T')[0],
                        role: state.user.email === ADMIN_EMAIL ? 'admin' : 'student'
                    });
                }
            }, (err) => console.error("Error perfil", err));
            
            // 2. Antropometría
            const antropoRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'antropometria', 'latest');
            const unsubAntropo = onSnapshot(antropoRef, (docSnap) => {
                if(docSnap.exists()) state.antropo = docSnap.data();
            });

            // 3. Nutrición Diaria (Dinámica)
            appManager.subscribeNutrition(state.activeDate);

            // 4. Entrenamiento Diario (Dinámico)
            appManager.subscribeWorkout(state.activeWorkoutDate);

            // 5. Ejercicios Personalizados
            const exercisesRef = collection(db, 'artifacts', APP_ID, 'users', uid, 'exercises');
            const unsubExercises = onSnapshot(exercisesRef, (snap) => {
                state.exercises = snap.docs.map(d => ({id: d.id, ...d.data()}));
            });

            // 6. Control Clínico (Salud global)
            const healthRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'health', 'data');
            const unsubHealth = onSnapshot(healthRef, (docSnap) => {
                if(docSnap.exists()) state.health = docSnap.data();
            });

            state.unsubscribers.push(
                unsubProfile, unsubAntropo, unsubExercises, unsubHealth, 
                () => { if(state.unsubNutri) state.unsubNutri(); },
                () => { if(state.unsubWorkout) state.unsubWorkout(); }
            );
        }

        function calculateTimeMetrics() {
            if(!state.profile.startDate) return;
            const start = new Date(state.profile.startDate);
            const now = new Date();
            const diffTime = now.getTime() - start.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1; // Día 1 es el mismo día de inicio
            state.profile.currentDay = diffDays > 0 ? diffDays : 1;
        }

        // --- MOTOR DE VISTAS (SPA) ---
        let currentViewId = '';
        function renderView(viewId) {
            currentViewId = viewId;
            const container = document.getElementById('view-container');
            container.innerHTML = ''; // Limpiar
            container.classList.add('animate-fade-in');
            
            // Re-trigger animation
            container.style.animation = 'none';
            container.offsetHeight; /* trigger reflow */
            container.style.animation = null; 

            switch(viewId) {
                case 'dashboard': container.innerHTML = buildDashboard(); break;
                case 'profile': container.innerHTML = buildProfile(); initProfileListeners(); break;
                case 'anthropometry': container.innerHTML = buildAntropo(); initAntropoListeners(); break;
                case 'nutrition': container.innerHTML = buildNutrition(); break;
                case 'training': container.innerHTML = buildTraining(); break;
                case 'analytics': container.innerHTML = buildAnalytics(); initAnalyticsListeners(); break;
                case 'clinical': container.innerHTML = buildClinical(); break;
                case 'admin': 
                    if(state.user.email === ADMIN_EMAIL) container.innerHTML = buildAdmin(); 
                    else container.innerHTML = '<p class="text-red-500">Acceso Denegado</p>';
                    break;
            }
        }

        // ==========================================
        // VISTA 1: DASHBOARD
        // ==========================================
        function buildDashboard() {
            const currentDayNum = state.profile.currentDay || 1;

        function calcularMacros() {
            if(!state.nutrition || !state.nutrition.meals) return {k:0, p:0, c:0, f:0};
            return state.nutrition.meals.reduce((acc, m) => {
                acc.k += Number(m.kcal)||0; acc.p += Number(m.prot)||0; acc.c += Number(m.carb)||0; acc.f += Number(m.fat)||0;
                return acc;
            }, {k:0, p:0, c:0, f:0});
        }

        function calcularCaloriasTotales() {
            return calcularMacros().k;
        }

        }

        function initAntropoListeners() {
            const calculateAll = () => {
                const getVal = (id) => parseFloat(document.getElementById(`ant-${id}`)?.value) || 0;
                
                // 1. Obtención de Variables Básicas y Perfil
                const weight = getVal('peso_actual') || 70;
                const height = getVal('estatura') || 170;
                const heightM = height / 100;
                
                const p = state.profile || {};
                const gender = p.gender || 'M';
                let age = 30;
                if(p.dob) age = Math.floor((new Date() - new Date(p.dob).getTime()) / 3.15576e+10);
                const activityLevel = parseFloat(p.activityLevel) || 1.2;

                // 2. Fórmulas de Grasa Corporal (BF%)
                let bf = 0;
                let formulaUsed = "Base de Perfil";
                let dbDensity = 0;

                // Pliegues
                const pl_pe = getVal('pl_pectoral');
                const pl_ax = getVal('pl_axilar');
                const pl_tr = getVal('pl_tricipital');
                const pl_bi = getVal('pl_bicipital');
                const pl_sb = getVal('pl_subescapular');
                const pl_si = getVal('pl_suprailiaco');
                const pl_se = getVal('pl_supraespinal'); // a veces se usa suprailíaco como proxy si no está
                const pl_ab = getVal('pl_abdominal');
                const pl_mu = getVal('pl_muslo');
                const pl_pa = getVal('pl_pantorrilla');

                const sum7 = pl_pe + pl_ax + pl_tr + pl_sb + pl_ab + pl_si + pl_mu;
                const sum4 = pl_tr + pl_bi + pl_sb + pl_si; // Durnin
                const sum3 = gender === 'M' ? (pl_pe + pl_ab + pl_mu) : (pl_tr + pl_si + pl_mu);

                if (sum7 > 0 && pl_pe > 0 && pl_ab > 0) {
                    // Jackson & Pollock 7
                    if (gender === 'M') {
                        dbDensity = 1.112 - (0.00043499 * sum7) + (0.00000055 * Math.pow(sum7, 2)) - (0.00028826 * age);
                    } else {
                        dbDensity = 1.097 - (0.00046971 * sum7) + (0.00000056 * Math.pow(sum7, 2)) - (0.00012828 * age);
                    }
                    bf = (4.95 / dbDensity - 4.50) * 100;
                    formulaUsed = "Jackson-Pollock 7 pliegues (Siri)";
                } else if (sum3 > 0) {
                    // Jackson & Pollock 3
                    if (gender === 'M') {
                        dbDensity = 1.10938 - (0.0008267 * sum3) + (0.0000016 * Math.pow(sum3, 2)) - (0.0002574 * age);
                    } else {
                        dbDensity = 1.0994921 - (0.0009929 * sum3) + (0.0000023 * Math.pow(sum3, 2)) - (0.0001392 * age);
                    }
                    bf = (4.95 / dbDensity - 4.50) * 100;
                    formulaUsed = "Jackson-Pollock 3 pliegues (Siri)";
                } else if (sum4 > 0) {
                    // Durnin-Womersley
                    let c = 0, m = 0;
                    const logSum4 = Math.log10(sum4);
                    if(gender === 'M') {
                        if(age<30) { c=1.1620; m=0.0630; } else if(age<40) { c=1.1422; m=0.0544; } else { c=1.1620; m=0.0700; }
                    } else {
                        if(age<30) { c=1.1549; m=0.0678; } else if(age<40) { c=1.1423; m=0.0632; } else { c=1.1333; m=0.0612; }
                    }
                    dbDensity = c - (m * logSum4);
                    bf = (4.95 / dbDensity - 4.50) * 100;
                    formulaUsed = "Durnin-Womersley 4 pliegues";
                } else {
                    // Default Fallback
                    bf = gender === 'M' ? 15 : 25;
                }
                
                // Limitar BF a rangos reales
                bf = Math.max(3, Math.min(60, bf));

                // 3. Masas Corporales
                const fatMass = weight * (bf / 100);
                const ffm = weight - fatMass; // Fat-Free Mass
                // Estimación de SMM (Skeletal Muscle Mass) aprox 50% de FFM
                const smm = ffm * 0.5;

                // 4. Índices de Salud y Metabólicos
                const bmi = weight / (heightM * heightM);
                
                // WHtR (Waist to Height Ratio)
                const waist = getVal('per_cintura');
                const hip = getVal('per_cadera');
                const whtr = waist && height ? (waist / height) : 0;
                
                // BAI (Body Adiposity Index)
                const bai = hip && heightM ? (hip / Math.pow(heightM, 1.5)) - 18 : 0;
                
                // ICC
                const icc = waist && hip ? waist / hip : 0;

                // TMB y GET
                const bmr = 370 + (21.6 * ffm); // Katch-McArdle is best when FFM is known
                const tdee = bmr * activityLevel;
                const neat = tdee - bmr; // Aproximación TEF + NEAT + EAT

                // 5. Índices Musculares (FFMI)
                const ffmi = ffm / (heightM * heightM);
                const normalizedFfmi = ffmi + 6.1 * (1.8 - heightM); // Normalized for height variance

                let ffmiDesc = "";
                if(gender === 'M') {
                    if(normalizedFfmi < 18) ffmiDesc = "Bajo promedio muscular";
                    else if(normalizedFfmi < 20) ffmiDesc = "Promedio. Buen punto de inicio.";
                    else if(normalizedFfmi < 22) ffmiDesc = "Avanzado. Buena hipertrofia.";
                    else if(normalizedFfmi <= 25) ffmiDesc = "Excelente. Límite natural genético.";
                    else ffmiDesc = "Élite / Sospecha exógena (>25).";
                } else {
                    if(normalizedFfmi < 15) ffmiDesc = "Bajo promedio";
                    else if(normalizedFfmi < 17) ffmiDesc = "Promedio fitness";
                    else if(normalizedFfmi <= 21) ffmiDesc = "Límite natural femenino";
                    else ffmiDesc = "Élite (>21)";
                }

                // 6. Somatotipo (Heath-Carter modificado o exacto)
                let endo = 0, meso = 0, ecto = 0;
                let somatotypeText = "Faltan datos de pliegues/estatura";
                
                // Endomorfia (Usa Tricipital, Subescapular, Supraespinal)
                const sumEndo = (pl_tr + pl_sb + (pl_se || pl_si)) * (170.18 / height);
                if (sumEndo > 0) {
                    endo = -0.7182 + 0.1451 * sumEndo - 0.00068 * Math.pow(sumEndo, 2) + 0.0000014 * Math.pow(sumEndo, 3);
                }

                // Ectomorfia (HWR)
                const hwr = height / Math.cbrt(weight);
                if (hwr >= 40.75) ecto = 0.732 * hwr - 28.58;
                else if (hwr > 38.25 && hwr < 40.75) ecto = 0.463 * hwr - 17.63;
                else ecto = 0.1;

                // Mesomorfia
                let dia_hum = getVal('dia_humero');
                let dia_fem = getVal('dia_femur');
                let per_bra_con = getVal('per_brazo_con');
                let per_pan = getVal('per_pantorrilla');
                
                // Si no hay diámetros, estimar con perímetros (muñeca y tobillo/pantorrilla proxy)
                if(!dia_hum && getVal('per_muneca')) dia_hum = getVal('per_muneca') * 0.38; // Aproximación ruda
                if(!dia_fem && getVal('per_pantorrilla')) dia_fem = getVal('per_pantorrilla') * 0.28;

                if (dia_hum && dia_fem && per_bra_con && per_pan && pl_tr && pl_pa) {
                    const corr_arm = per_bra_con - (pl_tr / 10);
                    const corr_calf = per_pan - (pl_pa / 10);
                    meso = 0.858 * dia_hum + 0.601 * dia_fem + 0.188 * corr_arm + 0.161 * corr_calf - 0.131 * height + 4.5;
                }

                // Cleanup bounds
                endo = Math.max(0.1, endo); meso = Math.max(0.1, meso); ecto = Math.max(0.1, ecto);
                
                if (endo > 0 && meso > 0 && ecto > 0) {
                    if (endo > meso && endo > ecto) somatotypeText = "Endomorfo Predominante";
                    else if (meso > endo && meso > ecto) somatotypeText = "Mesomorfo Predominante";
                    else if (ecto > endo && ecto > meso) somatotypeText = "Ectomorfo Predominante";
                    else somatotypeText = "Somatotipo Central / Equilibrado";
                }

                // 7. Relación Torso/Pierna
                const thorax = getVal('per_torax_rel') || getVal('per_torax_exp');
                const thigh = getVal('per_muslo');
                const propor = thorax && thigh ? (thorax / thigh).toFixed(2) : '0.00';

                // 8. Motor de Predicciones
                const targetBf = parseFloat(p.targetBf) || 12;
                const targetWeight = parseFloat(p.targetWeight) || weight;
                
                const targetFatMass = targetWeight * (targetBf / 100);
                const fatToLose = fatMass - targetFatMass;
                const targetFFM = targetWeight - targetFatMass;
                const muscleToGain = targetFFM - ffm;

                // Asumimos pérdida de grasa segura max 0.5kg/semana o ganancia max 0.2kg/semana
                let weeksFat = fatToLose > 0 ? fatToLose / 0.5 : 0;
                let weeksMusc = muscleToGain > 0 ? muscleToGain / 0.2 : 0;
                let estimatedWeeks = Math.max(weeksFat, weeksMusc);
                
                // Render a Pantalla
                document.getElementById('res-bf').innerHTML = `${bf.toFixed(1)}<span class="text-sm">%</span>`;
                document.getElementById('res-bf-formula').innerText = `Fórmula: ${formulaUsed}`;
                document.getElementById('res-fm').innerText = `${fatMass.toFixed(1)} kg`;
                document.getElementById('res-ffm').innerText = `${ffm.toFixed(1)} kg`;
                document.getElementById('res-smm').innerText = `${smm.toFixed(1)} kg`;

                document.getElementById('res-bmr').innerText = `${Math.round(bmr)} kcal`;
                document.getElementById('res-tdee').innerText = `${Math.round(tdee)} kcal`;
                document.getElementById('res-neat').innerText = `${Math.round(neat)} kcal extras`;

                document.getElementById('res-bmi').innerText = bmi ? bmi.toFixed(1) : '0.0';
                document.getElementById('res-whtr').innerText = whtr ? whtr.toFixed(2) : '0.0';
                document.getElementById('res-icc').innerText = icc ? icc.toFixed(2) : '0.0';
                document.getElementById('res-bai').innerText = bai ? bai.toFixed(1) : '0.0';

                document.getElementById('res-ffmi').innerText = normalizedFfmi ? normalizedFfmi.toFixed(1) : '0.0';
                document.getElementById('res-ffmi-desc').innerText = ffmiDesc;

                document.getElementById('som-endo').innerText = endo.toFixed(1);
                document.getElementById('som-meso').innerText = meso.toFixed(1);
                document.getElementById('som-ecto').innerText = ecto.toFixed(1);
                document.getElementById('res-somatotype-text').innerText = somatotypeText;
                document.getElementById('res-propor').innerText = propor;

                document.getElementById('pred-fat-loss').innerHTML = fatToLose > 0 ? `${fatToLose.toFixed(1)} kg <i class="fa-solid fa-arrow-down text-green-400 text-sm"></i>` : 'En objetivo';
                document.getElementById('pred-musc-gain').innerHTML = muscleToGain > 0 ? `${muscleToGain.toFixed(1)} kg <i class="fa-solid fa-arrow-up text-purple-400 text-sm"></i>` : 'En objetivo';
                document.getElementById('pred-time').innerText = estimatedWeeks > 0 ? `${Math.ceil(estimatedWeeks)} Semanas` : 'Objetivo Cumplido';

                // --- ALERTAS DE SALUD INTELIGENTES ---
                let alertsHtml = '';
                if(whtr > 0.5) alertsHtml += `<div class="bg-red-900/30 border border-red-500/50 p-3 rounded-lg flex items-center gap-3"><i class="fa-solid fa-triangle-exclamation text-red-500 text-2xl"></i><div><p class="text-sm font-bold text-red-400">Riesgo Cardiometabólico (WHtR > 0.5)</p><p class="text-xs text-gray-300">Tu índice cintura/altura indica acumulación de grasa visceral. Prioridad absoluta: Déficit calórico moderado.</p></div></div>`;
                if(icc > (gender==='M'?0.9:0.85)) alertsHtml += `<div class="bg-orange-900/30 border border-orange-500/50 p-3 rounded-lg flex items-center gap-3"><i class="fa-solid fa-heart-crack text-orange-500 text-2xl"></i><div><p class="text-sm font-bold text-orange-400">ICC Elevado</p><p class="text-xs text-gray-300">Riesgo coronario incrementado. Disminuye grasas saturadas y aumenta cardio LISS.</p></div></div>`;
                if(bf < (gender==='M'?6:14)) alertsHtml += `<div class="bg-blue-900/30 border border-blue-500/50 p-3 rounded-lg flex items-center gap-3"><i class="fa-solid fa-snowflake text-blue-500 text-2xl"></i><div><p class="text-sm font-bold text-blue-400">Alerta Hormonal (Grasa Crítica)</p><p class="text-xs text-gray-300">Niveles de grasa extremadamente bajos. Riesgo de desplome de testosterona/estrógenos y letargia. Sugerimos dieta normocalórica o superávit.</p></div></div>`;
                if(normalizedFfmi > 25 && gender === 'M') alertsHtml += `<div class="bg-purple-900/30 border border-purple-500/50 p-3 rounded-lg flex items-center gap-3"><i class="fa-solid fa-syringe text-purple-500 text-2xl"></i><div><p class="text-sm font-bold text-purple-400">FFMI > 25 (Límite Fisiológico)</p><p class="text-xs text-gray-300">Has superado el límite natural genético estimado o los cálculos de pliegues tienen un error.</p></div></div>`;
                
                if(alertsHtml === '') alertsHtml = `<div class="bg-green-900/20 border border-green-500/30 p-3 rounded-lg flex items-center gap-3"><i class="fa-solid fa-shield-check text-green-500 text-2xl"></i><div><p class="text-sm font-bold text-green-400">Marcadores Óptimos</p><p class="text-xs text-gray-300">Tus proporciones y niveles de grasa no muestran alertas de riesgo inmediato a la salud.</p></div></div>`;
                
                document.getElementById('ai-alerts-container').innerHTML = alertsHtml;

                // Guardar global para Firestore
                window._tempAntropoCalc = { calc_bf: bf, calc_lbm: ffm, calc_bmr: bmr, calc_tdee: tdee, calc_ffmi: normalizedFfmi, somatotype: somatotypeText };
            };

            // Listeners para auto-calcular
            document.querySelectorAll('input[id^="ant-"]').forEach(input => {
                input.addEventListener('input', calculateAll);
            });
            setTimeout(calculateAll, 200); // init calc

            document.getElementById('btn-save-antropo').onclick = async () => {
                if(!state.user) return;
                const data = { updatedAt: new Date().toISOString() };
                document.querySelectorAll('input[id^="ant-"]').forEach(input => {
                    const key = input.id.replace('ant-', '');
                    data[key] = parseFloat(input.value) || 0;
                });
                
                if(window._tempAntropoCalc) Object.assign(data, window._tempAntropoCalc);
                
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'antropometria', 'latest'), data);
                    state.antropo = data; // actualizar estado local
                    appManager.saveIndicator('save-status-antropo');
                } catch(e) { ModalSystem.alert("Error guardando: " + e.message); }
            };
        }

        // ==========================================
        // VISTA 4: NUTRICIÓN AVANZADA (Edit y Navegación)
        // ==========================================
        window.nutriManager = {
            changeDate: (ev) => {
                state.activeDate = ev.target.value;
                appManager.subscribeNutrition(state.activeDate);
            },
            copyYesterday: async () => {
                if(!state.user) return;
                // Parse exact date array to avoid timezone bug shifting days
                const [y, m, d] = state.activeDate.split('-');
                const current = new Date(y, m - 1, d);
                current.setDate(current.getDate() - 1);
                
                const yesterdayStr = current.getFullYear() + '-' + String(current.getMonth()+1).padStart(2,'0') + '-' + String(current.getDate()).padStart(2,'0');
                
                try {
                    const snap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'nutrition', yesterdayStr));
                    if(snap.exists() && snap.data().meals && snap.data().meals.length > 0) {
                        const data = snap.data();
                        // Clonamos los ingredientes generando un ID nuevo y quitando el "checked"
                        state.nutrition.meals = data.meals.map(meal => ({
                            ...meal, 
                            checked: false, 
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 5)
                        }));
                        await nutriManager.save();
                        ModalSystem.alert("Se han copiado los alimentos de ayer (" + yesterdayStr + ") a la fecha actual (" + state.activeDate + ").");
                    } else {
                        ModalSystem.alert("No hay comidas registradas en el día anterior (" + yesterdayStr + ").");
                    }
                } catch(e) { ModalSystem.alert("Error al copiar: " + e.message); }
            },
            addWater: async (amount) => {
                state.nutrition.water = Math.max(0, (state.nutrition.water || 0) + amount);
                await nutriManager.save();
                renderView('nutrition');
            },
            addCoffee: async (amount) => {
                state.nutrition.coffee = Math.max(0, (state.nutrition.coffee || 0) + amount);
                await nutriManager.save();
                renderView('nutrition');
            },
            addSupplement: async (type, amount) => {
                if(!state.nutrition.supplements) state.nutrition.supplements = {};
                state.nutrition.supplements[type] = Math.max(0, (state.nutrition.supplements[type] || 0) + amount);
                await nutriManager.save();
                renderView('nutrition');
            },
            save: async () => {
                if(!state.user) return;
                try {

                            ModalSystem.alert(`<i class="fa-solid fa-check-circle text-green-400 text-2xl"></i><br><b>${originalName}</b> está PERMITIDO. No aporta calorías significativas ni afecta picos de insulina.`);

        function buildNutrition() {
            const n = state.nutrition;

            const renderMealItem = (m) => `

            const createSupplementRow = (key, label, step=1, unit="g") => `
                <div class="flex justify-between items-center py-1 border-b border-gray-700/50 last:border-0">

                    <div class="flex items-center gap-2">
                        <button onclick="nutriManager.addSupplement('${key}', -${step})" class="px-2 bg-gray-700 rounded text-xs hover:bg-gray-600">-</button>
                        <span class="w-10 text-center text-sm font-bold text-purple-400">${s[key] || 0}${unit}</span>
                        <button onclick="nutriManager.addSupplement('${key}', ${step})" class="px-2 bg-gray-700 rounded text-xs hover:bg-gray-600">+</button>
                    </div>
                </div>
            `;

            return `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-700/50 pb-4">
                        <h2 class="text-3xl font-bold text-white">Diario Nutricional Detallado</h2>
                        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                            <div class="flex items-center gap-2 bg-gray-800/80 px-3 py-2 rounded-lg border border-sky-500/30 flex-1 sm:flex-none">
                                <i class="fa-regular fa-calendar text-sky-400"></i>
                                <input type="date" id="nutri-date-picker" value="${state.activeDate}" onchange="nutriManager.changeDate(event)" class="bg-transparent text-white font-bold focus:outline-none cursor-pointer text-sm w-full">
                            </div>
                            <button onclick="nutriManager.copyYesterday()" class="glass-btn px-3 py-2 rounded-lg flex items-center gap-2 text-xs border-sky-500" title="Copiar comidas de ayer">
                                <i class="fa-solid fa-copy"></i> Copiar Ayer
                            </button>
                            <button onclick="nutriManager.showAddMeal()" class="glass-btn px-4 py-2 rounded-lg flex items-center gap-2 border-sky-500 bg-sky-900/20 text-white flex-1 sm:flex-none justify-center">
                                <i class="fa-solid fa-plus"></i> Añadir Ingrediente
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- Lista de Comidas -->
                        <div class="lg:col-span-2 glass-panel p-6">
                            <h3 class="text-lg font-bold text-sky-400 mb-4 border-b border-gray-700 pb-2">Plan de Alimentación de Hoy</h3>
                            ${meals.length === 0 ? '<p class="text-gray-500 text-center py-4">Agrega ingredientes uno a uno con sus detalles de macronutrientes.</p>' : ''}
                            ${meals.map(renderMealItem).join('')}
                        </div>

                        <!-- Panel de Ciencia (Derecha) -->
                        <div class="space-y-6">
                            
                            <!-- Cero Tolerancia -->
                            <div class="glass-panel p-6 border border-red-500/30 bg-red-900/10">
                                <h3 class="text-lg font-bold text-red-500 mb-3"><i class="fa-solid fa-triangle-exclamation"></i> Reglas Cero Tolerancia</h3>
                                <ul class="list-disc pl-5 text-sm text-gray-300 space-y-2">
                                    <li><b class="text-white">Cero Alcohol:</b> Inhibe por completo la lipólisis (quema de grasa) y deprime el SNC.</li>
                                    <li><b class="text-white">Cero Azúcar Líquido:</b> Jugos, gaseosas, tés azucarados. Generan picos masivos de insulina sin aportar saciedad.</li>
                                    <li><b class="text-white">Cero Fritos en Aceite Sumergido:</b> Grasas trans oxidativas que destruyen el perfil lipídico y aportan calorías vacías extremas.</li>
                                </ul>
                            </div>

                            <!-- Ayuno -->
                            <div class="glass-panel p-6 border border-blue-500/20">
                                <h3 class="text-lg font-bold text-blue-400 mb-2"><i class="fa-solid fa-stopwatch-20"></i> Protocolo de Ayuno Intermitente</h3>
                                <p class="text-xs text-gray-300 mb-4 leading-relaxed">El ayuno (ej. 16:8) no es mágico para perder peso, pero <b>optimiza brutalmente la sensibilidad a la insulina</b> y promueve la autofagia (reciclaje celular).</p>
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 mb-1">Estado del Ayuno Hoy</label>
                                    <select id="clin-fasting" class="w-full p-2 rounded glass-input text-sm">
                                        <option value="none">Sin ayuno / Dieta estándar</option>

                                        <option value="16:8">16:8 (Fase de Oxidación de Grasa)</option>

                                    </select>
                                </div>

                            <!-- Monitores -->

                                <h3 class="text-sm font-bold text-blue-400 mb-2"><i class="fa-solid fa-glass-water"></i> Vasos de Agua (250ml)</h3>
                                <div class="flex justify-center items-center gap-4">
                                    <button onclick="nutriManager.addWater(-1)" class="w-8 h-8 rounded-full bg-gray-700 hover:bg-gray-600">-</button>
                                    <span class="text-3xl font-bold">${n.water || 0}</span>
                                    <button onclick="nutriManager.addWater(1)" class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-500">+</button>
                                </div>
                            </div>

                            <div class="glass-panel p-4 text-center">

                                <div class="flex justify-center items-center gap-4">
                                    <button onclick="nutriManager.addCoffee(-1)" class="w-8 h-8 rounded-full bg-gray-700 hover:bg-gray-600">-</button>
                                    <span class="text-3xl font-bold">${n.coffee || 0}</span>
                                    <button onclick="nutriManager.addCoffee(1)" class="w-8 h-8 rounded-full bg-amber-700 hover:bg-amber-600">+</button>
                                </div>
                            </div>

                            <div class="glass-panel p-4">
                                <h3 class="text-sm font-bold text-purple-400 mb-2 text-center"><i class="fa-solid fa-capsules"></i> Suplementos (Dosis)</h3>
                                ${createSupplementRow('protein', 'Proteína en Polvo', 5, 'g')}
                                ${createSupplementRow('creatine', 'Creatina Monohidrato', 1, 'g')}
                                ${createSupplementRow('magnesium', 'Magnesio', 100, 'mg')}
                                ${createSupplementRow('zinc', 'Zinc / ZMA', 5, 'mg')}
                                ${createSupplementRow('omega3', 'Omega 3', 1, 'cap')}
                            </div>

                            <button onclick="nutriManager.checkBeverage()" class="w-full glass-btn px-4 py-3 rounded-lg flex justify-center items-center gap-2 font-bold text-white border-sky-500">
                                <i class="fa-solid fa-magnifying-glass"></i> Verificador de Bebidas
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // VISTA 5: ENTRENAMIENTO DE ALTO RENDIMIENTO (Edit y Calorías)
        // ==========================================
        window.workoutManager = {
            timerInterval: null,
            timeElapsed: 0,
            isResting: false,
            restTarget: 90, // seconds
            currentExerciseIndex: 0,
            activeExercises: [], // Se llenará dinámicamente al armar la sesión
            
            changeDate: (ev) => {
                state.activeWorkoutDate = ev.target.value;
                appManager.subscribeWorkout(state.activeWorkoutDate);
            },

            editDailyWorkout: () => {
                if(state.dailyWorkout && state.dailyWorkout.exercises) {
                    // 1. Cargamos los datos haciendo una copia profunda para no mutar el estado original accidentalmente
                    workoutManager.activeExercises = JSON.parse(JSON.stringify(state.dailyWorkout.exercises));
                    workoutManager.timeElapsed = state.dailyWorkout.duration || 0;
                    workoutManager.currentExerciseIndex = 0;
                    
                    // 2. Forzamos el re-render de la vista para que el DOM vuelva a crear los IDs 'workout-dashboard' y 'workout-active'
                    renderView('training');
                    
                    // 3. Ahora sí podemos ocultar el dashboard y mostrar la interfaz de entrenamiento activo
                    document.getElementById('workout-dashboard').classList.add('hidden');
                    document.getElementById('workout-active').classList.remove('hidden');
                    
                    // 4. Iniciamos el cronómetro y renderizamos la primera tabla de series
                    workoutManager.startTimer();
                    renderActiveExercise();
                }
            },

            showExerciseEditor: () => {
                const html = `
                    <div class="space-y-3 text-left">
                        <input type="text" id="ex-name" placeholder="Nombre (Ej. Press Banca Inclinado)" class="w-full p-2 rounded glass-input border-purple-500/30">
                        <input type="text" id="ex-link" placeholder="Link YouTube/Video (Opcional)" class="w-full p-2 rounded glass-input text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="ex-muscle" class="w-full p-2 rounded glass-input text-sm">
                                <option value="Pecho">Pecho</option>
                                <option value="Espalda">Espalda</option>
                                <option value="Cuádriceps">Cuádriceps</option>
                                <option value="Isquios/Glúteo">Isquios / Glúteo</option>
                                <option value="Hombros">Hombros</option>
                                <option value="Brazos">Brazos</option>
                                <option value="Core">Core</option>
                            </select>
                            <select id="ex-type" class="w-full p-2 rounded glass-input text-sm">
                                <option value="Compuesto">Compuesto (Multiarticular)</option>
                                <option value="Aislado">Aislado (Analítico)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="ex-focus" class="w-full p-2 rounded glass-input text-sm">
                                <option value="Hipertrofia">Enfoque: Hipertrofia</option>
                                <option value="Fuerza">Enfoque: Fuerza (1-5 RM)</option>
                                <option value="Resistencia">Enfoque: Resistencia</option>
                            </select>
                            <input type="text" id="ex-equip" placeholder="Equipo (Barra, Polea...)" class="w-full p-2 rounded glass-input text-sm">
                        </div>
                        <textarea id="ex-desc" placeholder="Descripción / Tempo (Ej. 3-0-1-0) / Tips Biomecánicos" class="w-full p-2 rounded glass-input text-sm h-16"></textarea>
                    </div>
                `;
                ModalSystem.show("Gestor de Ejercicios: Crear Nuevo", html, 'confirm', async () => {
                    if(!state.user) return;
                    const ex = {
                        name: document.getElementById('ex-name').value,
                        link: document.getElementById('ex-link').value,
                        muscle: document.getElementById('ex-muscle').value,
                        type: document.getElementById('ex-type').value,
                        focus: document.getElementById('ex-focus').value,
                        equip: document.getElementById('ex-equip').value,
                        desc: document.getElementById('ex-desc').value,
                        createdAt: new Date().toISOString()
                    };
                    if(!ex.name) return ModalSystem.alert("El nombre es obligatorio.");
                    try {
                        await addDoc(collection(db, 'artifacts', APP_ID, 'users', state.user.uid, 'exercises'), ex);
                        ModalSystem.alert("Ejercicio añadido a tu librería personal.");
                        renderView('training');
                    } catch(e) { ModalSystem.alert("Error guardando ejercicio: " + e.message); }
                });
            },

            addExerciseToWorkout: () => {
                if(!state.exercises || state.exercises.length === 0) return ModalSystem.alert("Primero debes crear ejercicios usando el 'Gestor de Ejercicios' en la parte superior.");
                let options = state.exercises.map(e => `<option value="${e.id}">${e.name} (${e.muscle})</option>`).join('');
                const html = `
                    <div class="text-left space-y-2">
                        <label class="text-sm text-gray-400">Selecciona de tu librería:</label>
                        <select id="select-active-ex" class="w-full p-2 rounded glass-input">${options}</select>
                    </div>
                `;
                ModalSystem.show("Agregar a la sesión de Hoy", html, 'confirm', () => {
                    const id = document.getElementById('select-active-ex').value;
                    const ex = state.exercises.find(e => e.id === id);
                    if(ex) {
                        workoutManager.activeExercises.push({...ex, sets: [{weight:0, reps:0, rir:2, done:false}]});
                        renderView('training');
                    }
                });
            },

            startWorkout: () => {
                if(workoutManager.activeExercises.length === 0) {
                    return ModalSystem.alert("Agrega al menos un ejercicio a la sesión antes de iniciar.");
                }
                document.getElementById('workout-dashboard').classList.add('hidden');
                document.getElementById('workout-active').classList.remove('hidden');
                workoutManager.timeElapsed = 0;
                workoutManager.currentExerciseIndex = 0;
                workoutManager.startTimer();
                renderActiveExercise();
            },
            
            startTimer: () => {
                if(workoutManager.timerInterval) clearInterval(workoutManager.timerInterval);
                workoutManager.timerInterval = setInterval(() => {
                    workoutManager.timeElapsed++;
                    workoutManager.updateTimerUI();
                }, 1000);
            },

            updateTimerUI: () => {
                const el = document.getElementById('active-timer');
                if(!el) return clearInterval(workoutManager.timerInterval);
                
                let mins = Math.floor(workoutManager.timeElapsed / 60);
                let secs = workoutManager.timeElapsed % 60;
                el.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                if(workoutManager.isResting) {
                    if(workoutManager.timeElapsed > workoutManager.restTarget) {
                        el.classList.add('timer-penalty');
                        document.getElementById('timer-status').innerText = "¡PENALIZACIÓN! (Exceso)";
                    } else {
                        el.classList.remove('timer-penalty');
                        document.getElementById('timer-status').innerText = `Descanso activo (Obj: ${workoutManager.restTarget}s)`;
                    }
                } else {
                    el.classList.remove('timer-penalty');
                    document.getElementById('timer-status').innerText = "Tiempo de Trabajo";
                }
            },

            toggleRest: () => {
                workoutManager.isResting = !workoutManager.isResting;
                workoutManager.timeElapsed = 0; // Reset for rest or work
                document.getElementById('btn-toggle-rest').innerHTML = workoutManager.isResting ? 
                    '<i class="fa-solid fa-dumbbell"></i> Terminar Descanso' : 
                    '<i class="fa-solid fa-stopwatch"></i> Iniciar Descanso';
                workoutManager.updateTimerUI();
            },

            addSetToCurrent: () => {
                const ex = workoutManager.activeExercises[workoutManager.currentExerciseIndex];
                ex.sets.push({weight:0, reps:0, rir:2, done:false});
                renderActiveExercise();
            },

            toggleSetDone: (idx) => {
                const ex = workoutManager.activeExercises[workoutManager.currentExerciseIndex];
                ex.sets[idx].done = !ex.sets[idx].done;
                if(ex.sets[idx].done) {
                    // Guardar los valores tipeados en los inputs al confirmar
                    ex.sets[idx].weight = document.getElementById(`set-w-${idx}`).value;
                    ex.sets[idx].reps = document.getElementById(`set-r-${idx}`).value;
                    ex.sets[idx].rir = document.getElementById(`set-rir-${idx}`).value;
                }
                renderActiveExercise();
            },
            
            nextExercise: () => {
                if(workoutManager.currentExerciseIndex < workoutManager.activeExercises.length - 1) {
                    workoutManager.currentExerciseIndex++;
                    renderActiveExercise();
                } else {
                    ModalSystem.alert("Estás en el último ejercicio.");
                }
            },
            
            prevExercise: () => {
                if(workoutManager.currentExerciseIndex > 0) {
                    workoutManager.currentExerciseIndex--;
                    renderActiveExercise();
                }
            },

            contingency: (type) => {
                if(type === 'fail') ModalSystem.alert("Fallo muscular registrado. ¡Esa es la señal de hipertrofia! Asegúrate de anotar el peso para calcular tu próximo aumento progresivo.");
                if(type === 'home') ModalSystem.alert("Activando Modo Casa: Reemplaza con Flexiones al fallo, Sentadillas Búlgaras y Dominadas en puerta.");
            },
            
            finishWorkout: async () => {
                clearInterval(workoutManager.timerInterval);
                if(state.user) {
                    try {
                        const bw = state.antropo.peso_actual || 70;
                        const cals = 4.5 * bw * (workoutManager.timeElapsed / 3600); // METS * Kg * Hrs
                        
                        await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', state.activeWorkoutDate), {
                            date: state.activeWorkoutDate,
                            duration: workoutManager.timeElapsed,

        // ==========================================
        // VISTA HISTORIAL & SUEÑO (ANALYTICS)
        // ==========================================
        window.historyManager = {
            chartInstance: null,
            fetchDate: async () => {
                if(!state.user) return;
                const dateStr = document.getElementById('hist-date').value;
                const uid = state.user.uid;
                
                try {
                    // Fetch Analytics/Sleep
                    const anSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily', dateStr));
                    const anData = anSnap.exists() ? anSnap.data() : { sleep: '', deepSleep: '', workSchedule: '', trainTime: '' };
                    document.getElementById('hist-sleep').value = anData.sleep || '';
                    document.getElementById('hist-deepsleep').value = anData.deepSleep || '';
                    document.getElementById('hist-work').value = anData.workSchedule || '';
                    document.getElementById('hist-train').value = anData.trainTime || '';

                    // Fetch Nutrition History
                    const nuSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'nutrition', dateStr));
                    const nuData = nuSnap.exists() ? nuSnap.data() : null;
                    if(nuData && nuData.meals && nuData.meals.length > 0) {
                        const macros = nuData.meals.reduce((acc, m) => {
                            acc.k += Number(m.kcal)||0; acc.p += Number(m.prot)||0; acc.c += Number(m.carb)||0; acc.f += Number(m.fat)||0;
                            return acc;
                        }, {k:0, p:0, c:0, f:0});
                        document.getElementById('hist-nutri-result').innerHTML = `
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center text-sm bg-gray-800/50 p-3 rounded border border-gray-700">
                                <div><p class="text-orange-400 font-bold">${macros.k} kcal</p><p class="text-xs text-gray-500">Total</p></div>
                                <div><p class="text-blue-400 font-bold">${macros.p.toFixed(1)} g</p><p class="text-xs text-gray-500">Proteína</p></div>
                                <div><p class="text-green-400 font-bold">${macros.c.toFixed(1)} g</p><p class="text-xs text-gray-500">Carbs</p></div>
                                <div><p class="text-yellow-400 font-bold">${macros.f.toFixed(1)} g</p><p class="text-xs text-gray-500">Grasas</p></div>
                            </div>
                        `;
                    } else {
                        document.getElementById('hist-nutri-result').innerHTML = '<div class="text-sm text-gray-500 py-2">Sin registros nutricionales.</div>';
                    }

                    // Fetch Workout History
                    const woSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'workouts_daily', dateStr));
                    const woData = woSnap.exists() ? woSnap.data() : null;
                    if(woData && woData.completed) {
                        document.getElementById('hist-train-result').innerHTML = `
                            <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                                <p class="text-sm text-white font-bold mb-1"><i class="fa-solid fa-circle-check text-green-400"></i> Sesión Completada</p>
                                <p class="text-xs text-gray-400">Duración: ${Math.floor(woData.duration/60)} min | Quemadas: <b class="text-orange-400">${(woData.burnedCalories||0).toFixed(0)} kcal</b></p>
                            </div>
                        `;
                    } else {
                        document.getElementById('hist-train-result').innerHTML = '<div class="text-sm text-gray-500 py-2">Sin actividad física registrada.</div>';
                    }
                    
                } catch(e) { console.error("Error fetching history", e); }
            },
            saveDay: async () => {
                if(!state.user) return;
                const dateStr = document.getElementById('hist-date').value;
                const data = {
                    sleep: document.getElementById('hist-sleep').value,
                    deepSleep: document.getElementById('hist-deepsleep').value,
                    workSchedule: document.getElementById('hist-work').value,
                    trainTime: document.getElementById('hist-train').value,
                    updatedAt: new Date().toISOString()
                };
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'analytics_daily', dateStr), data);
                    appManager.saveIndicator('save-status-hist');
                    // Actualizar las gráficas después de guardar
                    window.historyManager.loadWeeklyTrends();
                } catch(e) { ModalSystem.alert("Error guardando datos: " + e.message); }
            },
            loadWeeklyTrends: async () => {
                if(!state.user) return;
                const uid = state.user.uid;
                const labels = [];
                const sleepData = [];
                const kcalData = [];
                let totalSleep = 0, totalKcal = 0, daysWithData = 0;

                // Generar los últimos 7 días
                for(let i=6; i>=0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dStr = d.toISOString().split('T')[0];
                    labels.push(d.toLocaleDateString('es-ES', {weekday: 'short', day: 'numeric'}));

                    try {
                        const [anSnap, nuSnap] = await Promise.all([
                            getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily', dStr)),
                            getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'nutrition', dStr))
                        ]);

                        let sleep = 0, kcal = 0;
                        if(anSnap.exists() && anSnap.data().sleep) {
                            sleep = parseFloat(anSnap.data().sleep);
                        }
                        sleepData.push(sleep);
                        if(sleep > 0) { totalSleep += sleep; daysWithData++; }

                        if(nuSnap.exists() && nuSnap.data().meals) {
                            kcal = nuSnap.data().meals.reduce((acc, m) => acc + (Number(m.kcal)||0), 0);
                        }
                        kcalData.push(kcal);
                        if(kcal > 0) totalKcal += kcal;

                    } catch(e) {
                        sleepData.push(0); kcalData.push(0);
                    }
                }

                // Renderizar Promedios
                const avgSleep = daysWithData > 0 ? (totalSleep/daysWithData).toFixed(1) : '0.0';
                const avgKcal = daysWithData > 0 ? Math.round(totalKcal/daysWithData) : 0;
                
                const elSleep = document.getElementById('trend-avg-sleep');
                const elKcal = document.getElementById('trend-avg-kcal');
                if(elSleep) elSleep.innerText = avgSleep + ' hrs';
                if(elKcal) elKcal.innerText = avgKcal + ' kcal';

                // Renderizar Gráfica
                const ctx = document.getElementById('weekly-chart');
                if(!ctx) return;
                
                if(window.historyManager.chartInstance) {
                    window.historyManager.chartInstance.destroy();
                }

                window.historyManager.chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Consumo Calórico (kcal)',
                                data: kcalData,
                                backgroundColor: 'rgba(56, 189, 248, 0.5)',
                                borderColor: 'rgba(56, 189, 248, 1)',
                                borderWidth: 1,
                                borderRadius: 4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Horas de Sueño (hrs)',
                                data: sleepData,
                                type: 'line',
                                borderColor: 'rgba(168, 85, 247, 1)',
                                backgroundColor: 'rgba(168, 85, 247, 0.2)',
                                borderWidth: 3,
                                pointBackgroundColor: 'rgba(168, 85, 247, 1)',
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        color: '#94a3b8',
                        scales: {
                            y: { type: 'linear', display: true, position: 'left', title: {display: true, text: 'Calorías (Kcal)', color: '#38bdf8'}, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y1: { type: 'linear', display: true, position: 'right', title: {display: true, text: 'Horas de Sueño', color: '#a855f7'}, grid: { drawOnChartArea: false } },
                            x: { grid: { display: false } }
                        },
                        plugins: {
                            legend: { labels: { color: '#e2e8f0', usePointStyle: true } },
                            tooltip: { mode: 'index', intersect: false }
                        }
                    }
                });
            }
        };

                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'health', 'data'), data, {merge:true});

        // ==========================================
        // VISTA 6: ADMIN ZONE (Solo dudbilopr@gmail.com)
        // ==========================================
        window.adminManager = {
            processFDCFile: (event) => {
                const file = event.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if(!data.FoundationFoods) throw new Error("JSON Inválido. Falta FoundationFoods.");
                        
                        document.getElementById('admin-log').innerHTML = `Procesando ${data.FoundationFoods.length} alimentos...<br>`;
                        
                        // Limitado para evitar sobrecarga en navegador. En prod usar cloud functions o batch de 500
                        const batch = writeBatch(db);
                        let count = 0;
                        for(const food of data.FoundationFoods.slice(0, 100)) { // Limite de muestra
                            const ref = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'food_db'));
                            batch.set(ref, {
                                desc: food.description,
                                category: food.foodCategory?.description || 'N/A',
                                kcal: food.foodNutrients.find(n => n.nutrient.name.includes("Energy"))?.amount || 0,
                                protein: food.foodNutrients.find(n => n.nutrient.name.includes("Protein"))?.amount || 0
                            });
                            count++;
                        }
                        await batch.commit();
                        document.getElementById('admin-log').innerHTML += `<span class="text-green-400">Éxito: ${count} alimentos guardados en public/data/food_db.</span>`;
                    } catch(err) {
                        document.getElementById('admin-log').innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
                    }
                };
                reader.readAsText(file);
            }
        };

                        <p class="text-sm text-gray-400 mb-4">Sube el archivo JSON de FoundationFoods. Se extraerán solo descripción, categoría, kcal y proteínas para optimizar la carga a Firestore (<span class="font-mono text-xs">/public/data/food_db</span>).</p>
