<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness10.easy - Alto Rendimiento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #020617, #0f172a, #1e293b); background-attachment: fixed; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1.25rem; }
        
        /* Botones de Acción (Toolbar) */
        .btn-group-item { padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: 500; color: #cbd5e1; background-color: rgba(30, 41, 59, 0.8); border: 1px solid rgba(71, 85, 105, 0.5); transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.375rem; cursor:pointer;}
        .btn-group-item:hover { background-color: rgba(51, 65, 85, 1); color: #38bdf8; }
        .btn-primary { background: linear-gradient(to right, #0ea5e9, #2563eb); color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.39); transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5); }
        .btn-warning { background: linear-gradient(to right, #f59e0b, #d97706); color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.39); transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer; }
        .btn-warning:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }

        /* Botones Glass Genéricos */
        .glass-btn { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); backdrop-filter: blur(4px); transition: all 0.3s ease; color: #38bdf8; cursor: pointer; }
        .glass-btn:hover { background: rgba(56, 189, 248, 0.25); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); transform: translateY(-2px); color: #fff; }
        .glass-btn-danger { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #f43f5e; cursor: pointer; }
        .glass-btn-danger:hover { background: rgba(244, 63, 94, 0.25); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); color: #fff; }
        
        /* Inputs */
        .glass-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(71, 85, 105, 0.5); color: #f8fafc; transition: all 0.3s ease; border-radius: 0.5rem; width: 100%; padding: 0.5rem; font-size: 0.875rem; }
        .glass-input:focus { outline: none; border-color: #38bdf8; background: rgba(30, 41, 59, 0.8); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .input-label { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 600; margin-bottom: 0.25rem; }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; } 
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }

        /* Ocultar Scrollbar en menú móvil para limpieza visual */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } 
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .timer-glow { text-shadow: 0 0 20px rgba(56, 189, 248, 0.8); } 
        .timer-penalty { text-shadow: 0 0 20px rgba(244, 63, 94, 0.8); color: #f43f5e; }
    </style>
</head>
<body class="antialiased">

    <!-- Modal System Overlay -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm p-4">
        <div id="modal-content" class="glass-panel p-6 max-w-2xl w-full transform transition-all scale-95 opacity-0 flex flex-col max-h-[90vh]">
            <h3 id="modal-title" class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2"></h3>
            <div id="modal-body" class="text-gray-300 mb-6 text-sm overflow-y-auto pr-2 flex-1"></div>
            <div id="modal-actions" class="flex justify-end gap-3 border-t border-gray-700 pt-4 mt-auto"></div>
        </div>
    </div>

    <!-- App Root -->
    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- Auth View -->
        <div id="auth-view" class="w-full h-full flex items-center justify-center p-4">
            <div class="glass-panel p-8 max-w-md w-full relative animate-fade-in">
                <div class="text-center mb-8">
                    <i class="fa-solid fa-dumbbell text-4xl text-sky-400 mb-3"></i>
                    <h1 class="text-3xl font-bold tracking-wider text-white">Fitness10<span class="text-sky-400 font-light">.easy</span></h1>
                    <p class="text-gray-400 text-sm mt-2">Data & Ciencias del Deporte</p>
                </div>
                <div class="space-y-4">
                    <input type="email" id="auth-email" placeholder="Correo Electrónico" class="w-full px-4 py-3 rounded-xl glass-input">
                    <input type="password" id="auth-password" placeholder="Contraseña" class="w-full px-4 py-3 rounded-xl glass-input">
                    <button onclick="appManager.loginEmail()" class="w-full py-3 rounded-xl glass-btn font-semibold text-white flex justify-center items-center gap-2"><i class="fa-solid fa-envelope"></i> Ingresar / Registrarse</button>
                    <div class="relative flex items-center py-2"><div class="flex-grow border-t border-gray-600"></div><span class="flex-shrink-0 mx-4 text-gray-500 text-sm">O</span><div class="flex-grow border-t border-gray-600"></div></div>
                    <button onclick="appManager.loginGoogle()" class="w-full py-3 rounded-xl bg-white text-gray-900 font-semibold hover:bg-gray-100 transition shadow-lg flex justify-center items-center gap-2"><i class="fa-brands fa-google text-red-500"></i> Continuar con Google</button>
                </div>
            </div>
        </div>

        <!-- Main App Layout -->
        <div id="main-layout" class="hidden w-full h-full flex flex-col lg:flex-row pb-[72px] lg:pb-0">
            
            <!-- Sidebar / Mobile Bottom Nav -->
            <aside id="sidebar" class="glass fixed bottom-0 left-0 w-full h-[72px] lg:relative lg:w-64 lg:h-full flex flex-row lg:flex-col z-50 no-scrollbar overflow-x-auto lg:overflow-y-auto items-center lg:items-stretch px-2 lg:px-0 border-t border-gray-700/50 lg:border-t-0 lg:border-r border-gray-700/50 snap-x">
                
                <!-- Desktop Logo -->
                <div class="hidden lg:flex p-4 items-center justify-between border-b border-gray-700/50">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bolt text-sky-400 text-xl"></i><span class="logo-text font-bold text-lg tracking-wide">Fit10<span class="text-sky-400 font-light">.easy</span></span></div>
                </div>
                
                <!-- Desktop Avatar -->
                <div class="hidden lg:flex p-4 border-b border-gray-700/50 flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-sky-400 to-blue-600 flex items-center justify-center text-xl font-bold shadow-lg mb-2" id="user-avatar-initial"></div>
                    <p id="user-name-display" class="sidebar-text font-medium text-sm text-center truncate w-full"></p>
                    <span id="user-role-badge" class="sidebar-text text-xs px-2 py-1 rounded-full bg-slate-800 text-sky-300 mt-1"></span>
                </div>
                
                <!-- Navigation Items -->
                <nav class="flex-1 flex flex-row lg:flex-col items-center lg:items-stretch gap-3 lg:gap-1 py-0 lg:py-4 px-2 lg:px-2 h-full lg:h-auto w-max lg:w-auto mx-auto lg:mx-0">
                    <button onclick="appManager.navigate('dashboard')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Dashboard">
                        <i class="fa-solid fa-chart-pie text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Data Dashboard</span>
                    </button>
                    <button onclick="appManager.navigate('profile')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Perfil">
                        <i class="fa-solid fa-user-astronaut text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Onboarding & Perfil</span>
                    </button>
                    <button onclick="appManager.navigate('anthropometry')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Antropometría">
                        <i class="fa-solid fa-ruler-combined text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Antropometría PRO</span>
                    </button>
                    <button onclick="appManager.navigate('nutrition')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Nutrición">
                        <i class="fa-solid fa-apple-whole text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Nutrición Avanzada</span>
                    </button>
                    <button onclick="appManager.navigate('training')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Entrenamiento">
                        <i class="fa-solid fa-dumbbell text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Alto Rendimiento</span>
                    </button>
                    <button onclick="appManager.navigate('analytics')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Analítica">
                        <i class="fa-solid fa-chart-line text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Historial & Analítica</span>
                    </button>
                    <button onclick="appManager.navigate('clinical')" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors snap-center" title="Clínica">
                        <i class="fa-solid fa-stethoscope text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Clínica & Ciencia</span>
                    </button>
                    
                    <button id="trainer-nav-btn" onclick="appManager.navigate('trainer')" class="hidden w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-yellow-400 hover:bg-yellow-900/20 transition-colors snap-center" title="Trainer Zone">
                        <i class="fa-solid fa-chalkboard-user text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Trainer Zone</span>
                    </button>
                    <button id="admin-nav-btn" onclick="appManager.navigate('admin')" class="hidden w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-purple-400 hover:bg-purple-900/20 transition-colors snap-center" title="Admin">
                        <i class="fa-solid fa-crown text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Admin Setup</span>
                    </button>
                </nav>

                <!-- Logout Button -->
                <div class="p-0 lg:p-4 border-l border-gray-700/50 lg:border-l-0 lg:border-t pl-2 lg:pl-0 ml-2 lg:ml-0 h-full lg:h-auto flex items-center lg:items-stretch flex-shrink-0 snap-center">
                    <button onclick="appManager.logout()" class="w-12 h-12 lg:w-full lg:h-auto flex-shrink-0 flex items-center justify-center lg:justify-start gap-0 lg:gap-3 lg:px-4 lg:py-3 rounded-full lg:rounded-xl text-red-400 hover:bg-red-900/20 transition-colors" title="Salir">
                        <i class="fa-solid fa-sign-out-alt text-xl lg:text-base w-5 text-center"></i> <span class="hidden lg:inline text-sm">Cerrar Sesión</span>
                    </button>
                </div>
            </aside>

            <!-- Contenedor Principal Central -->
            <div class="flex-1 flex flex-col h-full relative overflow-hidden">
                <!-- Top Header Mobile (Minimalista) -->
                <header class="lg:hidden glass p-4 flex items-center justify-center sticky top-0 z-30 shadow-sm">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-sky-400"></i><span class="font-bold text-lg text-white tracking-widest">Fit10<span class="text-sky-400 font-light">.easy</span></span></div>
                </header>
                
                <main id="view-container" class="flex-1 overflow-y-auto p-4 lg:p-8"></main>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, onSnapshot, addDoc, updateDoc, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = { 
            apiKey: "AIzaSyCI0c7KgnEAn-sV_CrHs0Er1LXL13CvQSA", authDomain: "laboratorio-de-coulomb.firebaseapp.com", 
            databaseURL: "https://laboratorio-de-coulomb-default-rtdb.firebaseio.com", projectId: "laboratorio-de-coulomb", 
            storageBucket: "laboratorio-de-coulomb.firebasestorage.app", messagingSenderId: "525944850850", 
            appId: "1:525944850850:web:eca9c0b79809358e8d8afb" 
        };
        const app = initializeApp(firebaseConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        // Manejador del resultado de la redirección segura
        getRedirectResult(auth).catch((error) => {
            console.error("Error en redirección de Google:", error);
            window.ModalSystem.alert("Error de autenticación con Google: " + error.message);
        });
        
        const ADMIN_EMAIL = 'dudbilopr@gmail.com'; 
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'fitness10-prod';

        // ESTADO GLOBAL
        const state = { 
            user: null, profile: {}, antropo: {}, health: {},
            nutrition: { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 } }, 
            exercises: [], routines: [], directory: [], globalCatalog: [],
            activeDate: new Date().toISOString().split('T')[0], 
            activeWorkoutDate: new Date().toISOString().split('T')[0], 
            dailyWorkout: null, unsubNutri: null, unsubWorkout: null, unsubscribers: [] 
        };

        // --- OBJETOS GLOBALES (MANAGERS) ---
        // Definimos todos los gestores globalmente para evitar errores "ReferenceError"

        window.ModalSystem = {
            show: (title, message, type = 'info', onConfirm = null) => {
                const container = document.getElementById('modal-container'), content = document.getElementById('modal-content');
                document.getElementById('modal-title').innerHTML = title; 
                document.getElementById('modal-body').innerHTML = message;
                document.getElementById('modal-actions').innerHTML = type === 'confirm' 
                    ? `<button id="modal-cancel" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white transition">Cancelar</button><button id="modal-ok" class="btn-primary">Confirmar</button>` 
                    : `<button id="modal-ok" class="btn-primary">Aceptar</button>`;
                container.classList.remove('hidden');
                setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
                
                const close = () => { content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0'); setTimeout(() => container.classList.add('hidden'), 200); };
                document.getElementById('modal-ok').onclick = () => { close(); if(onConfirm) onConfirm(); };
                if(document.getElementById('modal-cancel')) document.getElementById('modal-cancel').onclick = close;
            },
            alert: (msg) => ModalSystem.show('Notificación', msg, 'info'), 
            confirm: (msg, callback) => ModalSystem.show('Confirmación', msg, 'confirm', callback)
        };
        window.CustomAlert = window.ModalSystem.alert;

        // --- GESTOR PRINCIPAL ---
        window.appManager = {
            loginGoogle: async () => { 
                try { 
                    const provider = new GoogleAuthProvider();
                    // Usamos signInWithRedirect para cumplir con normativas de seguridad COOP
                    await signInWithRedirect(auth, provider); 
                } catch (e) { 
                    window.ModalSystem.alert("Error de redirección: "+e.message); 
                } 
            },
            loginEmail: async () => { 
                const e = document.getElementById('auth-email').value, p = document.getElementById('auth-password').value; 
                if(!e || !p) return window.ModalSystem.alert("Ingresa datos."); 
                try { await signInWithEmailAndPassword(auth, e, p); } 
                catch (err) { 
                    if(err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') 
                        window.ModalSystem.confirm("¿Registrar usuario nuevo?", async () => { try { await createUserWithEmailAndPassword(auth, e, p); } catch (ex) { window.ModalSystem.alert(ex.message); } }); 
                    else window.ModalSystem.alert(err.message); 
                } 
            },
            logout: () => window.ModalSystem.confirm("¿Cerrar sesión?", () => signOut(auth)), 
            toggleSidebar: () => document.getElementById('sidebar').classList.toggle('sidebar-closed'), 
            navigate: (id) => renderView(id),
            subscribeNutrition: (dStr) => { 
                if(!state.user) return; 
                if(state.unsubNutri) state.unsubNutri(); 
                state.unsubNutri = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'nutrition', dStr), (snap) => { 
                    state.nutrition = snap.exists() ? snap.data() : { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 }}; 
                    if(!state.nutrition.supplements) state.nutrition.supplements = { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 }; 
                    const isModalOpen = !document.getElementById('modal-container').classList.contains('hidden');
                    if(currentViewId === 'nutrition' && !isModalOpen) renderView('nutrition'); 
                }); 
            },
            subscribeWorkout: (dStr) => { 
                if(!state.user) return; 
                if(state.unsubWorkout) state.unsubWorkout(); 
                state.unsubWorkout = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', dStr), (snap) => { 
                    state.dailyWorkout = snap.exists() ? snap.data() : null; 
                    if(state.dailyWorkout && !state.dailyWorkout.completed && window.workoutManager.activeExercises.length === 0 && !window.workoutManager.isEditing) {
                        window.workoutManager.activeExercises = state.dailyWorkout.exercises || []; 
                        window.workoutManager.timeElapsed = state.dailyWorkout.duration || 0;
                    }
                    const activeView = document.getElementById('workout-active');
                    const isWorkoutActive = activeView && !activeView.classList.contains('hidden');
                    const isModalOpen = !document.getElementById('modal-container').classList.contains('hidden');
                    if(currentViewId === 'training' && !isWorkoutActive && !isModalOpen) renderView('training'); 
                    else if (currentViewId === 'dashboard') renderView('dashboard');
                }); 
            },
            saveIndicator: (id) => { const el = document.getElementById(id); if(el) { el.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Guardado'; setTimeout(() => el.innerHTML = '', 2000); } },
            exportAllData: async () => {
                if(!state.user) return;
                window.ModalSystem.alert("<i class='fa-solid fa-spinner fa-spin'></i> Recopilando y estructurando Big Data...");
                try {
                    const uid = state.user.uid;
                    const [workoutsSnap, nutritionSnap, analyticsSnap] = await Promise.all([
                        getDocs(collection(db, 'artifacts', APP_ID, 'users', uid, 'workouts_daily')),
                        getDocs(collection(db, 'artifacts', APP_ID, 'users', uid, 'nutrition')),
                        getDocs(collection(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily'))
                    ]);

                    const fullData = {
                        metadata: { exportDate: new Date().toISOString(), app: "Fitness10.easy - Science", userEmail: state.user.email },
                        profileSettings: state.profile, antropometriaISAK: state.antropo, clinicalHealth: state.health,
                        customExercises: state.exercises, savedRoutines: state.routines,
                        workoutsHistory: workoutsSnap.docs.map(d => ({dateId: d.id, ...d.data()})),
                        nutritionHistory: nutritionSnap.docs.map(d => ({dateId: d.id, ...d.data()})),
                        analyticsSleepHistory: analyticsSnap.docs.map(d => ({dateId: d.id, ...d.data()}))
                    };

                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
                    const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", `Fitness10_BigData_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(dl); dl.click(); dl.remove();
                } catch(e) { window.ModalSystem.alert("Error exportando Big Data: " + e.message); }
            }
        };

        window.dashboardManager = {
            loadWeeklyData: async () => {
                if(!state.user) return;
                const uid = state.user.uid;
                let totalVol = 0, totalActKcal = 0, totalInKcal = 0, daysWithFood = 0, totalSleep = 0, sleepDays = 0;
                
                for(let i=0; i<7; i++) {
                    const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().split('T')[0];
                    try {
                        const [wSnap, nSnap, aSnap] = await Promise.all([ getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'workouts_daily', ds)), getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'nutrition', ds)), getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily', ds)) ]);
                        if(wSnap.exists() && wSnap.data().completed) { totalActKcal += (wSnap.data().burnedCalories || 0); if(wSnap.data().exercises) wSnap.data().exercises.forEach(ex => { ex.sets.forEach(s => { if(s.done) totalVol += (Number(s.weight) * Number(s.reps)); }); }); }
                        if(nSnap.exists() && nSnap.data().meals && nSnap.data().meals.length > 0) { daysWithFood++; totalInKcal += nSnap.data().meals.reduce((a,m)=>a+(Number(m.kcal)||0), 0); }
                        if(aSnap.exists() && aSnap.data().sleep) { totalSleep += parseFloat(aSnap.data().sleep); sleepDays++; }
                    } catch(e){}
                }
                
                const tdee = parseFloat(state.antropo.calc_tdee) || 2000;
                const avgInKcal = daysWithFood > 0 ? totalInKcal / daysWithFood : 0;
                const effectiveDays = daysWithFood > 0 ? daysWithFood : 1; 
                const weekDeficit = (tdee * effectiveDays) + totalActKcal - totalInKcal; 
                
                const elVol = document.getElementById('dash-wk-vol'); if(elVol) elVol.innerText = totalVol.toLocaleString() + ' kg';
                const elKcal = document.getElementById('dash-wk-act-kcal'); if(elKcal) elKcal.innerText = totalActKcal.toFixed(0) + ' kcal';
                const elAvg = document.getElementById('dash-wk-avg-kcal'); if(elAvg) elAvg.innerText = avgInKcal.toFixed(0) + ' kcal/d';
                const elSleep = document.getElementById('dash-wk-sleep'); if(elSleep) elSleep.innerText = sleepDays > 0 ? (totalSleep/sleepDays).toFixed(1) + ' hrs/d' : '0 hrs';
                
                const elBal = document.getElementById('dash-wk-balance');
                if(elBal) {
                    if(daysWithFood === 0) elBal.innerHTML = '<span class="text-gray-500 text-xs">Faltan registros alimenticios</span>';
                    else if(weekDeficit > 0) elBal.innerHTML = `<span class="text-green-400">-${weekDeficit.toFixed(0)} kcal (Déficit)</span>`;
                    else elBal.innerHTML = `<span class="text-red-400">+${Math.abs(weekDeficit).toFixed(0)} kcal (Superávit)</span>`;
                }

                const elProj = document.getElementById('dash-wk-proj');
                if(elProj) {
                    if(daysWithFood === 0) elProj.innerText = "Registra comidas de hoy para proyectar tu curva termodinámica.";
                    else if(weekDeficit > 0) elProj.innerHTML = `↓ Pérdida est. de <b class="text-green-400">${(weekDeficit/7000).toFixed(2)} kg</b> de grasa/líquido.`;
                    else elProj.innerHTML = `↑ Ganancia est. de <b class="text-purple-400">${(Math.abs(weekDeficit)/7000).toFixed(2)} kg</b> de masa corporal.`;
                }
            }

                        <div><label class="input-label">Descripción / Biomecánica / Tempo</label><textarea id="ex-desc" placeholder="Ej. Tempo 3-0-1-0. Bajar controlado." class="w-full p-2 glass-input text-sm h-20">${ex.desc}</textarea></div>
                    </div>
                `;
                window.ModalSystem.show(isEdit ? "Editar Ejercicio" : "Crear Ejercicio", html, 'confirm', async () => {
                    if(!state.user) return; const n = document.getElementById('ex-n').value; if(!n) return window.ModalSystem.alert("El nombre es obligatorio.");
                    const exData = { name: n, link: document.getElementById('ex-link').value, muscle: document.getElementById('ex-m').value, type: document.getElementById('ex-t').value, focus: document.getElementById('ex-f').value, equip: document.getElementById('ex-eq').value, desc: document.getElementById('ex-desc').value, updatedAt: new Date().toISOString() };
                    try { if(isEdit) { await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'exercises', ex.id), exData, {merge:true}); window.ModalSystem.alert("Actualizado exitosamente."); } else { exData.createdAt = new Date().toISOString(); await addDoc(collection(db, 'artifacts', APP_ID, 'users', state.user.uid, 'exercises'), exData); window.ModalSystem.alert("Guardado en tu librería personal."); } window.workoutManager.showLibraryManager(); } catch(e) { window.ModalSystem.alert("Error: " + e.message); }
                });
            },

            showLibraryManager: () => { 
                const html = state.exercises.map(e => `
                    <div class="flex justify-between items-center p-3 border-b border-gray-700 text-sm bg-gray-800/30 rounded mb-1 shadow-sm">
                        <div class="flex-1">
                            <p class="font-bold text-sky-400">${e.name}</p>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <span class="bg-gray-700 px-1.5 py-0.5 rounded text-[9px] text-white">${e.muscle}</span>
                                <span class="bg-purple-900/50 px-1.5 py-0.5 rounded text-[9px] text-purple-300 border border-purple-500/30">${e.equip || 'Sin eq.'}</span>
                            </div>
                        </div>
                        <div class="flex gap-2 ml-2 border-l border-gray-700 pl-3">
                            <button onclick="workoutManager.editMasterExercise('${e.id}')" class="text-yellow-400 p-2 hover:text-yellow-300 transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="workoutManager.deleteFromLib('${e.id}')" class="text-red-400 p-2 hover:text-red-300 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join(''); 
                window.ModalSystem.show("Gestionar Librería de Ejercicios", `<div class="max-h-[60vh] overflow-y-auto pr-2">${html || '<div class="text-center py-6 border border-dashed border-gray-600 rounded-lg text-gray-500"><i class="fa-solid fa-book-open text-2xl mb-2"></i><p>Tu librería está vacía.</p></div>'}</div>`, "info"); 
            },
            editMasterExercise: (id) => { const ex = state.exercises.find(e => e.id === id); if(ex) window.workoutManager.showExerciseEditor(ex); },
            deleteFromLib: async (id) => { await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'exercises', id)); window.workoutManager.showLibraryManager(); renderView('training'); },
            
            addExerciseToWorkout: () => { 
                if(!state.exercises.length) return window.ModalSystem.alert("Librería local vacía. Usa el Catálogo o Crea Ejercicios."); 
                const opts = state.exercises.map(e => `<option value="${e.id}">${e.name} (${e.muscle})</option>`).join(''); 
                window.ModalSystem.show("Agregar a Sesión de Hoy", `<label class="input-label">Seleccionar Ejercicio</label><select id="sel-ex" class="w-full p-2 glass-input">${opts}</select>`, 'confirm', () => { const ex = state.exercises.find(e => e.id===document.getElementById('sel-ex').value); if(ex){ window.workoutManager.activeExercises.push({...ex, sets:[{weight:0,reps:0,rir:2,done:false}]}); window.workoutManager.saveQueue(); renderView('training'); } }); 
            },

            removeExercise: (index) => { window.workoutManager.activeExercises.splice(index, 1); window.workoutManager.saveQueue(); renderView('training'); },
            
            showRoutinesManager: () => {
                if(!state.user) return;
                const rHtml = state.routines && state.routines.length > 0 ? state.routines.map(r => `
                    <div class="flex justify-between items-center bg-gray-800 p-3 rounded-lg mb-2 border border-gray-700 shadow-sm">
                        <div class="flex-1">
                            <span class="text-sm font-bold text-sky-400 block">${r.name}</span>
                            <span class="text-[10px] text-gray-400">${r.exercises.length} ejercicios guardados</span>
                        </div>
                        <div class="flex gap-2 border-l border-gray-700 pl-3 ml-2 flex-shrink-0">
                            <button onclick="workoutManager.editRoutine('${r.id}')" class="text-yellow-400 p-2 hover:text-yellow-300 transition" title="Editar Grupo"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="workoutManager.loadRoutine('${r.id}')" class="text-sky-400 p-2 hover:text-sky-300 transition" title="Cargar a Sesión"><i class="fa-solid fa-download"></i></button>
                            <button onclick="workoutManager.deleteRoutine('${r.id}')" class="text-red-400 p-2 hover:text-red-300 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join('') : '<p class="text-xs text-gray-500 text-center py-4 border border-dashed border-gray-700 rounded-lg">No tienes grupos guardados.</p>';
                
                const html = `
                    <div class="space-y-6">
                        <div class="bg-gray-800/50 p-5 rounded-xl border border-sky-500/20">
                            <p class="text-xs text-sky-300 mb-2 font-bold uppercase tracking-widest"><i class="fa-solid fa-floppy-disk"></i> Guardar Cola Actual</p>
                            <p class="text-[10px] text-gray-400 mb-3 leading-relaxed">Esto convertirá los ejercicios en el planificador en un Grupo (Plantilla) reutilizable.</p>
                            <div class="flex gap-2">
                                <input type="text" id="rt-name" placeholder="Nombre (Ej. Día 1 Pecho)" class="flex-1 p-2 text-sm glass-input font-bold border-sky-500/30">
                                <button onclick="workoutManager.saveCurrentAsRoutine()" class="btn-primary text-xs shadow-none px-4">Guardar</button>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Tus Grupos Locales</h4>
                            <div class="max-h-64 overflow-y-auto pr-2">${rHtml}</div>
                        </div>
                    </div>
                `;
                window.ModalSystem.show("Grupos de Entrenamiento", html, 'info');
                setTimeout(()=>{ if(window.workoutManager.editingRoutineId){ const r = state.routines.find(x=>x.id===window.workoutManager.editingRoutineId); if(r) document.getElementById('rt-name').value = r.name; } }, 100);
            },

            editRoutine: (id) => { const r = state.routines.find(x=>x.id===id); if(r) { window.workoutManager.activeExercises = JSON.parse(JSON.stringify(r.exercises)); window.workoutManager.editingRoutineId = id; window.workoutManager.saveQueue(); renderView('training'); window.workoutManager.showRoutinesManager(); } },
            saveCurrentAsRoutine: async () => { const name = document.getElementById('rt-name').value; if(!name || window.workoutManager.activeExercises.length === 0) return window.ModalSystem.alert("Ingresa un nombre y asegúrate de tener ejercicios en cola."); try { const cleanEx = window.workoutManager.activeExercises.map(ex => ({...ex, sets: [{weight:0, reps:0, rir:2, done:false}]})); if(window.workoutManager.editingRoutineId) { await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines', window.workoutManager.editingRoutineId), { name: name, exercises: cleanEx, updatedAt: new Date().toISOString() }, {merge:true}); window.workoutManager.editingRoutineId = null; } else { await addDoc(collection(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines'), { name: name, exercises: cleanEx, createdAt: new Date().toISOString() }); } window.ModalSystem.alert("Grupo guardado correctamente."); window.workoutManager.showRoutinesManager(); } catch(e) {} },
            loadRoutine: (id) => { const r = state.routines.find(x => x.id === id); if(r) { window.workoutManager.activeExercises = JSON.parse(JSON.stringify(r.exercises)); window.workoutManager.saveQueue(); renderView('training'); window.ModalSystem.alert("Grupo cargado a la cola de hoy."); } },
            deleteRoutine: async (id) => { try { await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines', id)); window.workoutManager.showRoutinesManager(); } catch(e) {} },
            
            startWorkout: () => { 
                if(!window.workoutManager.activeExercises.length) return window.ModalSystem.alert("Agrega ejercicios a la cola."); 
                if(!window.workoutManager.isEditing) { window.workoutManager.timeElapsed = 0; window.workoutManager.currentExerciseIndex = 0; if(!window.workoutManager.startTime) window.workoutManager.startTime = new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}); } 
                document.getElementById('workout-dashboard').classList.add('hidden'); document.getElementById('workout-active').classList.remove('hidden'); 
                window.workoutManager.startTimer(); renderActiveExercise(); 
            },

            startTimer: () => { if(window.workoutManager.timerInterval) clearInterval(window.workoutManager.timerInterval); window.workoutManager.timerInterval = setInterval(()=>{ window.workoutManager.timeElapsed++; window.workoutManager.updateTimerUI(); if(window.workoutManager.timeElapsed % 10 === 0) window.workoutManager.saveQueue(); }, 1000); },

            updateTimerUI: () => { const el = document.getElementById('active-timer'); if(!el) return clearInterval(window.workoutManager.timerInterval); const m = Math.floor(window.workoutManager.timeElapsed/60), s = window.workoutManager.timeElapsed%60; el.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(window.workoutManager.isResting){ if(window.workoutManager.timeElapsed>window.workoutManager.restTarget){ el.classList.add('timer-penalty'); document.getElementById('timer-status').innerText="¡PENALIZACIÓN!"; } else { el.classList.remove('timer-penalty'); document.getElementById('timer-status').innerText="Descanso"; } } else { el.classList.remove('timer-penalty'); document.getElementById('timer-status').innerText="Trabajo"; } },

            toggleRest: () => { window.workoutManager.isResting = !window.workoutManager.isResting; window.workoutManager.timeElapsed=0; document.getElementById('btn-toggle-rest').innerHTML = window.workoutManager.isResting ? '<i class="fa-solid fa-dumbbell"></i> Volver a Trabajo' : '<i class="fa-solid fa-stopwatch"></i> Iniciar Descanso'; window.workoutManager.updateTimerUI(); },
            addSetToCurrent: () => { window.workoutManager.activeExercises[window.workoutManager.currentExerciseIndex].sets.push({weight:0,reps:0,rir:2,done:false}); window.workoutManager.saveQueue(); renderActiveExercise(); },
            updateSet: (i, field, val) => { window.workoutManager.activeExercises[window.workoutManager.currentExerciseIndex].sets[i][field] = Number(val); window.workoutManager.saveQueue(); renderActiveExercise(); },
            updateSetRir: (i, val) => { window.workoutManager.activeExercises[window.workoutManager.currentExerciseIndex].sets[i].rir = Number(val); window.workoutManager.saveQueue(); renderActiveExercise(); },
            toggleSetDone: (i) => { const ex = window.workoutManager.activeExercises[window.workoutManager.currentExerciseIndex]; ex.sets[i].done = !ex.sets[i].done; ex.sets[i].weight = document.getElementById(`set-w-${i}`).value; ex.sets[i].reps = document.getElementById(`set-r-${i}`).value; window.workoutManager.saveQueue(); renderActiveExercise(); },
            nextExercise: () => { if(window.workoutManager.currentExerciseIndex < window.workoutManager.activeExercises.length-1){ window.workoutManager.currentExerciseIndex++; renderActiveExercise(); } },
            prevExercise: () => { if(window.workoutManager.currentExerciseIndex > 0){ window.workoutManager.currentExerciseIndex--; renderActiveExercise(); } },
            contingency: (t) => { if(t==='fail') window.ModalSystem.alert("Fallo muscular anotado en bitácora."); },
            
            finishWorkout: async () => { 
                clearInterval(window.workoutManager.timerInterval); 
                if(state.user){ 
                    try { 
                        let tVol = 0, tSet = 0; 
                        window.workoutManager.activeExercises.forEach(ex => { ex.sets.forEach(s => { if(Number(s.weight) > 0 || Number(s.reps) > 0) s.done = true; if(s.done) { tVol += (Number(s.weight) * Number(s.reps)); tSet++; } }); }); 
                        const bw = state.antropo.peso_actual || 70; let aSec = window.workoutManager.timeElapsed; 
                        if(aSec < 60 && tSet > 0) aSec = tSet * 120; 
                        const aHrs = aSec / 3600; const cTotal = (3.5 * bw * aHrs) + (tVol * 0.06); 
                        const endTime = !window.workoutManager.isEditing ? new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}) : (state.dailyWorkout?.endTime || '');
                        await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', state.activeWorkoutDate), { date: state.activeWorkoutDate, duration: aSec, startTime: window.workoutManager.startTime || state.dailyWorkout?.startTime || '', endTime: endTime, exercises: window.workoutManager.activeExercises, burnedCalories: cTotal, completed: true }); 
                        window.ModalSystem.alert(`¡Entrenamiento guardado!<br><br>Volumen Movido: <b class="text-purple-400">${tVol} kg</b><br>Quemadas: <b class="text-orange-400">${cTotal.toFixed(0)} kcal</b><br><span class="text-[10px] text-gray-500">(Fórmula Híbrida: Tiempo + Carga Mecánica)</span>`); 
                    } catch(e){} 
                } 
                window.workoutManager.activeExercises = []; window.workoutManager.isEditing = false; renderView('training'); 
            }
        };

        function renderActiveExercise() {
            const ex = window.workoutManager.activeExercises[window.workoutManager.currentExerciseIndex]; if(!ex) return;
            let exVol = 0, best1RM = 0, maxW = 0, totalR = 0, minRIR = 10; 
            ex.sets.forEach(s => { const w = Number(s.weight), r = Number(s.reps), rir = Number(s.rir); if(w>0 && r>0 && s.done) { exVol += (w * r); totalR += r; if(w > maxW) maxW = w; if(rir < minRIR) minRIR = rir; const c1RM = w * (1 + (r / 30)); if(c1RM > best1RM) best1RM = c1RM; } });
            
            document.getElementById('active-sets-container').innerHTML = `
                <div class="mb-4 space-y-2">
                    <div class="flex flex-wrap justify-center gap-2"><span class="bg-gray-800 text-[10px] text-white font-bold px-2 py-1 rounded border border-gray-600"><i class="fa-solid fa-child-reaching text-sky-400 mr-1"></i> ${ex.muscle}</span><span class="bg-gray-800 text-[10px] text-white font-bold px-2 py-1 rounded border border-gray-600"><i class="fa-solid fa-gears text-purple-400 mr-1"></i> ${ex.type}</span><span class="bg-gray-800 text-[10px] text-white font-bold px-2 py-1 rounded border border-gray-600"><i class="fa-solid fa-bullseye text-green-400 mr-1"></i> ${ex.focus || 'N/A'}</span><span class="bg-gray-800 text-[10px] text-white font-bold px-2 py-1 rounded border border-gray-600"><i class="fa-solid fa-dumbbell text-yellow-400 mr-1"></i> ${ex.equip || 'N/A'}</span></div>
                    ${ex.desc ? `<div class="bg-sky-900/10 border-l-2 border-sky-500 p-2 rounded text-[11px] text-gray-300 italic">"${ex.desc}"</div>` : ''}
                    ${ex.link ? `<a href="${ex.link}" target="_blank" class="block w-full text-center bg-red-900/20 border border-red-500/30 text-red-400 hover:bg-red-900/40 hover:text-red-300 transition py-2 rounded-lg text-xs font-bold shadow-sm"><i class="fa-brands fa-youtube text-base mr-1"></i> Ver Video de Ejecución</a>` : ''}
                </div>
                <div class="grid grid-cols-4 gap-2 mb-4 bg-gray-800/40 p-3 rounded-xl border border-sky-500/20 shadow-sm">
                    <div class="text-center"><p class="text-[9px] text-gray-400 uppercase tracking-widest">Volumen</p><p class="text-base font-bold text-sky-400">${exVol}<span class="text-[9px] font-normal">kg</span></p></div>
                    <div class="text-center border-l border-gray-700/50"><p class="text-[9px] text-gray-400 uppercase tracking-widest">Reps</p><p class="text-base font-bold text-white">${totalR}</p></div>
                    <div class="text-center border-l border-gray-700/50"><p class="text-[9px] text-gray-400 uppercase tracking-widest">Peso Máx</p><p class="text-base font-bold text-green-400">${maxW}<span class="text-[9px] font-normal">kg</span></p></div>
                    <div class="text-center border-l border-gray-700/50"><p class="text-[9px] text-gray-400 uppercase tracking-widest">1RM Est.</p><p class="text-base font-bold text-purple-400">${best1RM.toFixed(1)}<span class="text-[9px] font-normal">kg</span></p></div>
                </div>
                <div class="w-full overflow-x-auto pb-2">
                    <table class="w-full text-left text-sm min-w-[350px]">
                        <thead class="bg-gray-800/50"><tr class="text-gray-400 text-xs uppercase tracking-wider border-b border-gray-700"><th class="py-2 pl-3">Set</th><th>Kg</th><th>Reps</th><th class="text-center">RIR</th><th class="text-center pr-3">Check</th></tr></thead>
                        <tbody class="divide-y divide-gray-800/50">${ex.sets.map((s,i)=>`<tr class="transition-all ${s.done?'bg-green-900/10 opacity-75':'hover:bg-gray-800/30'}"><td class="py-3 pl-3 font-bold text-gray-400">${i+1}</td><td><input type="number" id="set-w-${i}" value="${s.weight}" onchange="workoutManager.updateSet(${i}, 'weight', this.value)" class="w-14 p-1.5 text-xs glass-input text-center rounded-lg bg-gray-900 border border-gray-600 focus:border-sky-400"></td><td><input type="number" id="set-r-${i}" value="${s.reps}" onchange="workoutManager.updateSet(${i}, 'reps', this.value)" class="w-14 p-1.5 text-xs glass-input text-center rounded-lg bg-gray-900 border border-gray-600 focus:border-sky-400"></td><td class="text-center"><select id="set-rir-${i}" onchange="workoutManager.updateSetRir(${i}, this.value)" class="w-14 p-1.5 text-[10px] sm:text-xs glass-input text-center rounded-lg bg-gray-900 border border-gray-600 focus:border-sky-400" ${s.done?'disabled':''}><option value="2" ${s.rir==2?'selected':''}>2</option><option value="1" ${s.rir==1?'selected':''}>1</option><option value="0" ${s.rir==0?'selected':''}>0</option></select></td><td class="text-center pr-3"><button onclick="workoutManager.toggleSetDone(${i})" class="text-3xl ${s.done?'text-green-500 drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]':'text-gray-600'} hover:scale-110 transition-transform"><i class="fa-solid fa-circle-check"></i></button></td></tr>`).join('')}</tbody>
                    </table>
                </div>
                <div class="mt-4 flex justify-between items-center"><button onclick="workoutManager.contingency('fail')" class="text-red-400 text-xs font-bold hover:text-red-300 transition bg-red-900/10 px-3 py-1.5 rounded-lg border border-red-500/20"><i class="fa-solid fa-triangle-exclamation"></i> Registrar Fallo</button><button onclick="workoutManager.addSetToCurrent()" class="text-sky-400 text-xs font-bold hover:text-white transition bg-sky-900/20 px-3 py-1.5 rounded-lg border border-sky-500/30"><i class="fa-solid fa-plus"></i> Añadir Serie</button></div>
            `;
            document.getElementById('active-ex-name').innerText = ex.name; document.getElementById('ex-counter-display').innerText = `${window.workoutManager.currentExerciseIndex+1} / ${window.workoutManager.activeExercises.length}`;
        }

        function buildTraining() {
            const isTrainer = state.profile?.role === 'admin' || state.profile?.role === 'teacher';
            const h = window.workoutManager.activeExercises.length > 0;
            const w = state.dailyWorkout;

            if(w && w.completed && !h && !window.workoutManager.isEditing) {
                return `
                    <div class="max-w-6xl mx-auto space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-gray-700/50 pb-4">

                            <input type="date" value="${state.activeWorkoutDate}" onchange="workoutManager.changeDate(event)" class="p-2 glass-input rounded text-sm font-bold border-purple-500/50 w-full sm:w-auto">
                        </div>
                        <div class="glass-panel p-6 text-center border border-green-500/30 bg-green-900/10">

                            <h3 class="text-xl font-bold text-white mb-2">Sesión Completada</h3>
                            <p class="text-gray-300">Duración Est.: ${Math.floor((w.duration||0)/60)} min | Calorías Activas: <b class="text-orange-400 text-xl">${(w.burnedCalories||0).toFixed(0)} kcal</b></p>
                            
                            <div class="flex justify-center gap-4 text-sm mt-4 bg-gray-900/50 p-3 rounded-lg border border-gray-700 w-full max-w-sm mx-auto">
                                <div class="text-left w-full"><label class="text-[10px] text-gray-400 block mb-1">Hora Inicio</label><input type="time" value="${w.startTime||''}" onchange="workoutManager.updateTime('startTime', this.value)" class="glass-input rounded p-1.5 text-xs border border-gray-600 w-full"></div>
                                <div class="text-left w-full"><label class="text-[10px] text-gray-400 block mb-1">Hora Fin</label><input type="time" value="${w.endTime||''}" onchange="workoutManager.updateTime('endTime', this.value)" class="glass-input rounded p-1.5 text-xs border border-gray-600 w-full"></div>
                            </div>

                            <div class="mt-6 flex flex-wrap gap-4 justify-center">
                                <button onclick="workoutManager.downloadJSON()" class="glass-btn px-6 py-2 rounded-lg font-bold border-blue-500 text-blue-400"><i class="fa-solid fa-file-arrow-down"></i> Bajar Sesión JSON</button>
                                <button onclick="workoutManager.editDailyWorkout()" class="glass-btn px-6 py-2 rounded-lg font-bold border-yellow-500 text-yellow-400"><i class="fa-solid fa-pen"></i> Editar Sesión</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="max-w-6xl mx-auto h-full flex flex-col">
                    <div id="workout-dashboard" class="space-y-6">
                        
                        <div class="flex flex-col md:flex-row gap-3 items-start md:items-center justify-between bg-gray-800/40 p-4 rounded-xl border border-gray-700 shadow-sm">
                            <div class="flex items-center gap-2 w-full md:w-auto">
                                <input type="date" value="${state.activeWorkoutDate}" onchange="workoutManager.changeDate(event)" class="bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-sky-500 focus:border-sky-500 block w-full p-2" title="Fecha de Sesión">
                            </div>
                            
                            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-center md:justify-end items-center">
                                <div class="inline-flex rounded-lg shadow-sm bg-gray-900 border border-gray-700 p-0.5" role="group">
                                    <button onclick="workoutManager.showCatalog()" class="btn-group-item rounded-s-md" title="Ver Rutinas Globales"><i class="fa-solid fa-earth-americas"></i> <span class="hidden sm:inline">Catálogo</span></button>
                                    <button onclick="workoutManager.showRoutinesManager()" class="btn-group-item border-l-0 border-r-0 text-purple-400" title="Tus Grupos"><i class="fa-solid fa-list-ul"></i> <span class="hidden sm:inline">Grupos</span></button>
                                    <button onclick="workoutManager.showLibraryManager()" class="btn-group-item border-l-0 border-r-0 text-green-400" title="Gestionar Librería"><i class="fa-solid fa-book-open"></i> <span class="hidden sm:inline">Librería</span></button>

        window.historyManager = {
            chartInstance: null,
            fetchDate: async () => {

                try {
                    const anS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily', ds));

                    document.getElementById('hist-sleep').value = ad.sleep||''; document.getElementById('hist-deepsleep').value = ad.deepSleep||''; document.getElementById('hist-work').value = ad.workSchedule||''; document.getElementById('hist-train').value = ad.trainTime||'';

                    const nuS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'nutrition', ds));
                    if(nuS.exists() && nuS.data().meals && nuS.data().meals.length>0) {
                        const m = nuS.data().meals.reduce((a,x)=>{a.k+=Number(x.kcal)||0;a.p+=Number(x.prot)||0;a.c+=Number(x.carb)||0;a.f+=Number(x.fat)||0;return a;},{k:0,p:0,c:0,f:0});
                        document.getElementById('hist-nutri-result').innerHTML = `<div class="bg-gray-800/50 p-3 rounded-lg border border-gray-700 text-xs text-center grid grid-cols-4 shadow-inner"><span class="text-orange-400 font-bold flex flex-col"><span class="text-base">${m.k}</span><span class="text-[9px] text-gray-500 uppercase tracking-widest">Kcal</span></span><span class="text-blue-400 font-bold flex flex-col"><span class="text-base">${m.p.toFixed(0)}</span><span class="text-[9px] text-gray-500 uppercase tracking-widest">Prot</span></span><span class="text-green-400 font-bold flex flex-col"><span class="text-base">${m.c.toFixed(0)}</span><span class="text-[9px] text-gray-500 uppercase tracking-widest">Carb</span></span><span class="text-yellow-400 font-bold flex flex-col"><span class="text-base">${m.f.toFixed(0)}</span><span class="text-[9px] text-gray-500 uppercase tracking-widest">Grasa</span></span></div>`;
                    } else document.getElementById('hist-nutri-result').innerHTML = '<div class="text-xs text-gray-500 p-3 bg-gray-900/50 rounded-lg text-center border border-dashed border-gray-700">Sin datos</div>';

                    const woS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'workouts_daily', ds));
                    if(woS.exists() && woS.data().completed) document.getElementById('hist-train-result').innerHTML = `<div class="bg-gray-800/50 p-3 rounded-lg border border-gray-700 text-xs flex justify-between items-center shadow-inner"><span class="text-green-400 font-bold text-sm"><i class="fa-solid fa-circle-check mr-1"></i> Completado</span> <span class="bg-orange-900/30 text-orange-400 px-2 py-1 rounded border border-orange-500/30"><b>${(woS.data().burnedCalories||0).toFixed(0)}</b> kcal</span></div>`;
                    else document.getElementById('hist-train-result').innerHTML = '<div class="text-xs text-gray-500 p-3 bg-gray-900/50 rounded-lg text-center border border-dashed border-gray-700">Sin datos</div>';
                } catch(e){}
            },
            saveDay: async () => { if(state.user) { try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'analytics_daily', document.getElementById('hist-date').value), { sleep: document.getElementById('hist-sleep').value, deepSleep: document.getElementById('hist-deepsleep').value, workSchedule: document.getElementById('hist-work').value, trainTime: document.getElementById('hist-train').value, updatedAt: new Date().toISOString() }); appManager.saveIndicator('save-status-hist'); window.historyManager.loadWeeklyTrends(); } catch(e){} } },
            loadWeeklyTrends: async () => {
                if(!state.user) return; const u=state.user.uid; let l=[], sD=[], kD=[], tS=0, tK=0, dC=0;
                for(let i=6; i>=0; i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().split('T')[0]; l.push(d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})); try { const [aS, nS] = await Promise.all([getDoc(doc(db, 'artifacts', APP_ID, 'users', u, 'analytics_daily', ds)), getDoc(doc(db, 'artifacts', APP_ID, 'users', u, 'nutrition', ds))]); let sl=0, kc=0; if(aS.exists()&&aS.data().sleep){ sl=parseFloat(aS.data().sleep); sD.push(sl); tS+=sl; dC++; } else sD.push(0); if(nS.exists()&&nS.data().meals){ kc=nS.data().meals.reduce((a,x)=>a+(Number(x.kcal)||0),0); kD.push(kc); tK+=kc; } else kD.push(0); } catch(e){sD.push(0);kD.push(0);} }
                
                const avgSleep = dC>0 ? (tS/dC).toFixed(1) : 0;
                const avgKcal = dC>0 ? Math.round(tK/dC) : 0;
                
                const eS=document.getElementById('trend-avg-sleep'), eK=document.getElementById('trend-avg-kcal'); 
                if(eS) eS.innerText= avgSleep + 'h'; 
                if(eK) eK.innerText= avgKcal + 'k';
                
                const ctx=document.getElementById('weekly-chart'); if(!ctx) return; if(window.historyManager.chartInstance) window.historyManager.chartInstance.destroy();
                window.historyManager.chartInstance = new Chart(ctx, { type: 'bar', data: { labels: l, datasets: [{label:'Kcal', data:kD, backgroundColor:'#38bdf8', yAxisID:'y'},{label:'Sueño', data:sD, type:'line', borderColor:'#a855f7', yAxisID:'y1'}] }, options: { responsive:true, maintainAspectRatio:false } });

                // IA INSIGHTS
                const tdee = state.antropo?.calc_tdee || 2000;
                const diff = avgKcal - tdee;
                let recHtml = `<ul class="space-y-3 text-sm text-gray-300">`;
                
                if(avgSleep === 0) recHtml += `<li><i class="fa-solid fa-circle-info text-gray-500"></i> No has registrado horas de sueño en los últimos días.</li>`;
                else if(avgSleep < 7) recHtml += `<li class="bg-red-900/20 p-2 rounded border border-red-500/30"><i class="fa-solid fa-triangle-exclamation text-red-400"></i> <b class="text-white">Alerta de Recuperación:</b> ${avgSleep}h de sueño promedio es insuficiente. Estás comprometiendo la síntesis proteica y elevando el cortisol.</li>`;
                else recHtml += `<li class="bg-green-900/20 p-2 rounded border border-green-500/30"><i class="fa-solid fa-check text-green-400"></i> <b class="text-white">Entorno Anabólico Óptimo:</b> Tu sueño promedio (${avgSleep}h) está maximizando la segregación de HGH nocturna.</li>`;

                if(avgKcal > 0) {
                    if(diff > 300) recHtml += `<li class="bg-purple-900/20 p-2 rounded border border-purple-500/30"><i class="fa-solid fa-arrow-trend-up text-purple-400"></i> <b class="text-white">Superávit Activo:</b> Ingieres ~${Math.round(diff)} kcal por encima de tu GET. Estás en fase de construcción de volumen.</li>`;
                    else if(diff < -300) recHtml += `<li class="bg-sky-900/20 p-2 rounded border border-sky-500/30"><i class="fa-solid fa-arrow-trend-down text-sky-400"></i> <b class="text-white">Déficit Estricto:</b> Estás ~${Math.round(Math.abs(diff))} kcal por debajo de tu GET. Mantén el consumo de proteína alto para proteger la masa magra.</li>`;
                    else recHtml += `<li class="bg-yellow-900/20 p-2 rounded border border-yellow-500/30"><i class="fa-solid fa-scale-balanced text-yellow-400"></i> <b class="text-white">Mantenimiento:</b> Tu ingesta calórica es casi idéntica a tu gasto energético total.</li>`;
                } else {
                    recHtml += `<li><i class="fa-solid fa-circle-info text-gray-500"></i> Registra tus comidas en "Nutrición Avanzada" para obtener proyecciones termodinámicas.</li>`;
                }
                recHtml += `</ul>`;
                document.getElementById('analytics-insights').innerHTML = recHtml;
            }
        };

        function buildAnalytics() { 
            return `

        function buildClinical() { const h = state.health || {}; return `<div class="max-w-6xl mx-auto space-y-6"><div class="flex justify-between items-center border-b border-gray-700/50 pb-4"><h2 class="text-3xl font-bold text-white">Clínica & Ciencia</h2><button onclick="clinicalManager.save()" class="btn-primary bg-gradient-to-r from-red-500 to-red-700 shadow-red-500/30"><i class="fa-solid fa-save"></i> Guardar Archivo</button></div><span id="save-status-clin"></span><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="glass-panel p-6 border-t-4 border-red-500/80"><h3 class="font-bold text-red-400 text-xl mb-4"><i class="fa-solid fa-vial-virus"></i> Hemáticos y Endocrinos</h3><div class="mb-4"><label class="input-label">Fecha del Examen Lab</label><input type="date" id="clin-labdate" value="${h.labDate||''}" class="w-full p-2 glass-input mb-2 bg-gray-900"></div><div class="grid grid-cols-2 gap-4"><div><label class="input-label">Glucosa (mg/dL)</label><input type="number" id="clin-glucose" value="${h.glucose||''}" class="w-full p-2 glass-input bg-gray-900"></div><div><label class="input-label">Cortisol (ug/dL)</label><input type="number" id="clin-cortisol" value="${h.cortisol||''}" class="w-full p-2 glass-input bg-gray-900"></div><div class="col-span-2"><label class="input-label text-purple-400">Testosterona Total (ng/dL)</label><input type="number" id="clin-testo" value="${h.testo||''}" class="w-full p-2 glass-input font-bold text-purple-300 border-purple-500/30 bg-purple-900/10"></div><div><label class="input-label">Colesterol LDL (Malo)</label><input type="number" id="clin-ldl" value="${h.ldl||''}" class="w-full p-2 glass-input bg-gray-900"></div><div><label class="input-label">Colesterol HDL (Bueno)</label><input type="number" id="clin-hdl" value="${h.hdl||''}" class="w-full p-2 glass-input bg-gray-900"></div></div></div><div class="space-y-6"><div class="glass-panel p-6 border-t-4 border-green-500/80"><h3 class="font-bold text-green-400 text-xl mb-2"><i class="fa-solid fa-bugs"></i> Desparasitación</h3><p class="text-xs text-gray-400 mb-4 leading-relaxed">Fundamental al menos 1 vez al año para máxima absorción (Ej. Albendazol + Secnidazol).</p><label class="input-label">Fecha Última Purga</label><input type="date" id="clin-purge" value="${h.purgeDate||''}" class="w-full p-2 glass-input bg-gray-900"></div><div class="glass-panel p-6 border-t-4 border-blue-500/80"><h3 class="font-bold text-blue-400 text-xl mb-2"><i class="fa-solid fa-stopwatch-20"></i> Ayuno Intermitente</h3><p class="text-xs text-gray-400 mb-4 leading-relaxed">Protocolo táctico para optimizar sensibilidad a la insulina y autofagia celular.</p><label class="input-label">Estado Actual</label><select id="clin-fasting" class="w-full p-2 glass-input text-sm bg-gray-900"><option value="none" ${h.fastingState==='none'?'selected':''}>Sin ayuno (Dieta estándar)</option><option value="12:12" ${h.fastingState==='12:12'?'selected':''}>12:12 (Mantenimiento)</option><option value="16:8" ${h.fastingState==='16:8'?'selected':''}>16:8 (Corte/Definición)</option></select></div></div></div><div class="glass-panel p-6 bg-red-900/10 border border-red-500/30 mt-6 shadow-inner"><h3 class="text-xl font-bold text-red-500 mb-2"><i class="fa-solid fa-triangle-exclamation"></i> Reglas Cero Tolerancia</h3><ul class="list-disc pl-6 text-sm text-gray-300 mt-2 space-y-2"><li><b class="text-white">Cero Alcohol:</b> Inhibe casi por completo la oxidación de grasa y deprime el SNC.</li><li><b class="text-white">Cero Azúcar Líquido:</b> Gaseosas normales o jugos generan picos de insulina sin saciedad.</li><li><b class="text-white">Cero Fritos en Aceite:</b> Grasas trans que destruyen el perfil lipídico y aportan calorías vacías.</li></ul></div></div>`; }

        window.adminManager = { processFDCFile: (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async (ev) => { try { const d = JSON.parse(ev.target.result); document.getElementById('admin-log').innerHTML = `Procesando...`; const b = writeBatch(db); let c = 0; for(const x of d.FoundationFoods.slice(0, 100)) { b.set(doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'food_db')), { desc: x.description, category: x.foodCategory?.description||'N/A', kcal: x.foodNutrients.find(n=>n.nutrient.name.includes("Energy"))?.amount||0, protein: x.foodNutrients.find(n=>n.nutrient.name.includes("Protein"))?.amount||0 }); c++; } await b.commit(); document.getElementById('admin-log').innerHTML += `<br><span class="text-green-400">${c} subidos.</span>`; } catch(err){ document.getElementById('admin-log').innerHTML = `<span class="text-red-400">${err.message}</span>`; } }; r.readAsText(f); } };
        function buildAdmin() { return `<div class="max-w-4xl mx-auto space-y-6"><h2 class="text-3xl font-bold text-purple-400 border-b border-gray-700/50 pb-4">Admin Setup</h2><div class="glass-panel p-6"><h3 class="text-xl font-bold text-white mb-4">Carga FDC</h3><input type="file" id="fdc-file" accept=".json" class="hidden" onchange="adminManager.processFDCFile(event)"><label for="fdc-file" class="btn-primary cursor-pointer">Subir JSON FDC</label><div id="admin-log" class="mt-4 p-4 bg-black/50 text-xs text-gray-300 rounded">Esperando...</div></div></div>`; }
    </script>
