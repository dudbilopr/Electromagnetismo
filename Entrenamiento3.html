    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #020617, #0f172a, #1e293b); background-attachment: fixed; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1.25rem; }
        .glass-btn { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); backdrop-filter: blur(4px); transition: all 0.3s ease; color: #38bdf8; }
        .glass-btn:hover { background: rgba(56, 189, 248, 0.25); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); transform: translateY(-2px); color: #fff; }
        .glass-btn-danger { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #f43f5e; }
        .glass-btn-danger:hover { background: rgba(244, 63, 94, 0.25); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); color: #fff; }
        .glass-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; transition: all 0.3s ease; }
        .glass-input:focus { outline: none; border-color: #38bdf8; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); } 
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }
        #sidebar { transition: transform 0.3s ease-in-out; } 
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 1024px) { .sidebar-closed { transform: translateX(0); width: 5rem; } .sidebar-closed .sidebar-text, .sidebar-closed .logo-text { display: none; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } 
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .timer-glow { text-shadow: 0 0 20px rgba(56, 189, 248, 0.8); } 
        .timer-penalty { text-shadow: 0 0 20px rgba(244, 63, 94, 0.8); color: #f43f5e; }
    </style>
</head>
<body class="antialiased">

    <!-- Modal System -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm">
        <div id="modal-content" class="glass-panel p-6 max-w-md w-full mx-4 transform transition-all scale-95 opacity-0">

    <!-- App Root -->
    <div id="app" class="flex h-screen overflow-hidden">

        <div id="auth-view" class="w-full h-full flex items-center justify-center p-4">

                    <button onclick="appManager.loginEmail()" class="w-full py-3 rounded-xl glass-btn font-semibold text-white flex justify-center items-center gap-2"><i class="fa-solid fa-envelope"></i> Ingresar / Registrarse</button>
                    <div class="relative flex items-center py-2"><div class="flex-grow border-t border-gray-600"></div><span class="flex-shrink-0 mx-4 text-gray-500 text-sm">O</span><div class="flex-grow border-t border-gray-600"></div></div>
                    <button onclick="appManager.loginGoogle()" class="w-full py-3 rounded-xl bg-white text-gray-900 font-semibold hover:bg-gray-100 transition shadow-lg flex justify-center items-center gap-2"><i class="fa-brands fa-google text-red-500"></i> Continuar con Google</button>
                </div>

        <!-- Main App Layout -->
        <div id="main-layout" class="hidden w-full h-full flex">
            <!-- Sidebar -->
            <aside id="sidebar" class="glass w-64 h-full flex flex-col absolute lg:relative z-40">
                <div class="p-4 flex items-center justify-between border-b border-gray-700/50">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bolt text-sky-400 text-xl"></i><span class="logo-text font-bold text-lg tracking-wide">Fit10<span class="text-sky-400 font-light">.easy</span></span></div>
                    <button onclick="appManager.toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
                </div>
                <div class="p-4 border-b border-gray-700/50 flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-sky-400 to-blue-600 flex items-center justify-center text-xl font-bold shadow-lg mb-2" id="user-avatar-initial"></div>
                    <p id="user-name-display" class="sidebar-text font-medium text-sm text-center truncate w-full"></p>
                    <span id="user-role-badge" class="sidebar-text text-xs px-2 py-1 rounded-full bg-slate-800 text-sky-300 mt-1"></span>
                </div>
                <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
                    <button onclick="appManager.navigate('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-chart-pie w-5"></i> <span class="sidebar-text text-sm">Dashboard</span></button>
                    <button onclick="appManager.navigate('profile')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-user-astronaut w-5"></i> <span class="sidebar-text text-sm">Onboarding & Perfil</span></button>
                    <button onclick="appManager.navigate('anthropometry')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-ruler-combined w-5"></i> <span class="sidebar-text text-sm">Antropometría</span></button>
                    <button onclick="appManager.navigate('nutrition')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-apple-whole w-5"></i> <span class="sidebar-text text-sm">Nutrición Avanzada</span></button>
                    <button onclick="appManager.navigate('training')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-dumbbell w-5"></i> <span class="sidebar-text text-sm">Alto Rendimiento</span></button>
                    <button onclick="appManager.navigate('analytics')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-chart-line w-5"></i> <span class="sidebar-text text-sm">Historial & Sueño</span></button>
                    <button onclick="appManager.navigate('clinical')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-slate-800/50 hover:text-sky-400 transition-colors nav-btn"><i class="fa-solid fa-stethoscope w-5"></i> <span class="sidebar-text text-sm">Clínica & Ciencia</span></button>
                    
                    <button id="admin-nav-btn" onclick="appManager.navigate('admin')" class="hidden w-full flex items-center gap-3 px-4 py-3 rounded-xl text-purple-400 hover:bg-purple-900/20 transition-colors nav-btn"><i class="fa-solid fa-crown w-5"></i> <span class="sidebar-text text-sm">Admin Zone</span></button>
                </nav>
                <div class="p-4 border-t border-gray-700/50"><button onclick="appManager.logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-red-900/20 hover:text-red-400 transition-colors"><i class="fa-solid fa-sign-out-alt w-5"></i> <span class="sidebar-text text-sm">Cerrar Sesión</span></button></div>
            </aside>

            <div class="flex-1 flex flex-col h-full relative">
                <header class="lg:hidden glass p-4 flex items-center justify-between sticky top-0 z-30"><div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-sky-400"></i><span class="font-bold text-lg">Fit10<span class="text-sky-400 font-light">.easy</span></span></div><button onclick="appManager.toggleSidebar()" class="text-white p-2 glass-btn rounded-lg"><i class="fa-solid fa-bars"></i></button></header>
                <main id="view-container" class="flex-1 overflow-y-auto p-4 lg:p-8 pb-24"></main>
                <footer class="glass absolute bottom-0 w-full p-3 text-center flex flex-col sm:flex-row justify-between items-center text-xs text-gray-400 z-20"><p>&copy; 2026 Fitness10.easy. Todos los derechos reservados.</p><div class="flex gap-4 mt-2 sm:mt-0 justify-center"><a href="https://wa.me/573000000000?text=Hola" target="_blank" class="flex items-center gap-2 text-green-500 hover:text-green-400 transition-colors"><i class="fa-brands fa-whatsapp text-lg"></i> Soporte / Tutoría</a><a href="#" onclick="window.open('https://paypal.me/','_blank')" class="flex items-center gap-2 hover:text-sky-400 transition-colors"><i class="fa-brands fa-paypal text-lg"></i> Invítame un café</a></div></footer>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, updateDoc, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCI0c7KgnEAn-sV_CrHs0Er1LXL13CvQSA", authDomain: "laboratorio-de-coulomb.firebaseapp.com", databaseURL: "https://laboratorio-de-coulomb-default-rtdb.firebaseio.com", projectId: "laboratorio-de-coulomb", storageBucket: "laboratorio-de-coulomb.firebasestorage.app", messagingSenderId: "525944850850", appId: "1:525944850850:web:eca9c0b79809358e8d8afb" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const ADMIN_EMAIL = 'dudbilopr@gmail.com'; const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'fitness10-prod';

        const state = { 
            user: null, profile: {}, antropo: {}, 
            nutrition: { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 } }, 
            exercises: [], routines: [], health: {}, directory: [], globalCatalog: [],
            activeDate: new Date().toISOString().split('T')[0], 
            activeWorkoutDate: new Date().toISOString().split('T')[0], 
            dailyWorkout: null, unsubNutri: null, unsubWorkout: null, unsubscribers: [] 
        };

        const ModalSystem = {
            show: (title, message, type = 'info', onConfirm = null) => {
                const container = document.getElementById('modal-container'), content = document.getElementById('modal-content');
                document.getElementById('modal-title').innerHTML = title; document.getElementById('modal-body').innerHTML = message;
                document.getElementById('modal-actions').innerHTML = type === 'confirm' ? `<button id="modal-cancel" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white transition">Cancelar</button><button id="modal-ok" class="px-4 py-2 rounded-lg glass-btn text-white">Confirmar</button>` : `<button id="modal-ok" class="px-4 py-2 rounded-lg glass-btn text-white">Aceptar</button>`;
                container.classList.remove('hidden');
                setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
                const close = () => { content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0'); setTimeout(() => container.classList.add('hidden'), 200); };
                document.getElementById('modal-ok').onclick = () => { close(); if(onConfirm) onConfirm(); };
                if(document.getElementById('modal-cancel')) document.getElementById('modal-cancel').onclick = close;
            },
            alert: (msg) => ModalSystem.show('Notificación', msg, 'info'), confirm: (msg, callback) => ModalSystem.show('Confirmación', msg, 'confirm', callback)
        };
        window.CustomAlert = ModalSystem.alert;

        window.appManager = {
            loginGoogle: async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { ModalSystem.alert("Error login: "+e.message); } },
            loginEmail: async () => { const e = document.getElementById('auth-email').value, p = document.getElementById('auth-password').value; if(!e || !p) return ModalSystem.alert("Ingresa datos."); try { await signInWithEmailAndPassword(auth, e, p); } catch (err) { if(err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') ModalSystem.confirm("¿Registrar usuario?", async () => { try { await createUserWithEmailAndPassword(auth, e, p); } catch (ex) { ModalSystem.alert(ex.message); } }); else ModalSystem.alert(err.message); } },
            logout: () => ModalSystem.confirm("¿Salir?", () => signOut(auth)), toggleSidebar: () => document.getElementById('sidebar').classList.toggle('sidebar-closed'), navigate: (id) => renderView(id),
            
            subscribeNutrition: (dStr) => { 
                if(!state.user) return; if(state.unsubNutri) state.unsubNutri(); 
                state.unsubNutri = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'nutrition', dStr), (snap) => { 
                    state.nutrition = snap.exists() ? snap.data() : { meals: [], water: 0, coffee: 0, supplements: { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 }}; 
                    if(!state.nutrition.supplements) state.nutrition.supplements = { protein: 0, creatine: 0, magnesium: 0, zinc: 0, omega3: 0 }; 
                    if(currentViewId === 'nutrition') renderView('nutrition'); 
                }); 
            },
            subscribeWorkout: (dStr) => { 
                if(!state.user) return; if(state.unsubWorkout) state.unsubWorkout(); 
                state.unsubWorkout = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', dStr), (snap) => { 
                    state.dailyWorkout = snap.exists() ? snap.data() : null; 
                    // Auto-cargar la cola si no está completada, no estamos editando y la cola está vacía
                    if(state.dailyWorkout && !state.dailyWorkout.completed && workoutManager.activeExercises.length === 0 && !workoutManager.isEditing) {
                        workoutManager.activeExercises = state.dailyWorkout.exercises || [];
                        workoutManager.timeElapsed = state.dailyWorkout.duration || 0;
                    }
                    if(currentViewId === 'training' || currentViewId === 'dashboard') renderView(currentViewId); 
                }); 
            },
            saveIndicator: (id) => { const el = document.getElementById(id); if(el) { el.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Guardado'; setTimeout(() => el.innerHTML = '', 2000); } }
        };

        onAuthStateChanged(auth, async (user) => {
            state.user = user;
            if (user) {
                document.getElementById('auth-view').classList.add('hidden'); document.getElementById('main-layout').classList.remove('hidden');
                document.getElementById('user-avatar-initial').innerText = user.email ? user.email.charAt(0).toUpperCase() : 'U'; document.getElementById('user-name-display').innerText = user.displayName || user.email;
                if (user.email === ADMIN_EMAIL) document.getElementById('admin-nav-btn').classList.remove('hidden');
                loadUserData(); renderView('dashboard');
            } else { document.getElementById('auth-view').classList.remove('hidden'); document.getElementById('main-layout').classList.add('hidden'); state.unsubscribers.forEach(u => u()); state.unsubscribers = []; }
        });

        async function loadUserData() {
            if(!state.user) return; const uid = state.user.uid;
            state.unsubscribers.push(
                onSnapshot(doc(db, 'artifacts', APP_ID, 'users', uid, 'profile', 'data'), snap => { 
                    if(snap.exists()){ 
                        state.profile=snap.data(); calculateTimeMetrics(); 
                        const roleName = state.profile.role === 'admin' ? 'Admin Supremo' : (state.profile.role === 'teacher' ? 'Docente' : 'Estudiante');
                        document.getElementById('user-role-badge').innerText = roleName;
                        if(state.profile.role === 'admin' || state.user.email === ADMIN_EMAIL) {
                            document.getElementById('admin-nav-btn').classList.remove('hidden');
                        }
                    } else {
                        const initRole = state.user.email === ADMIN_EMAIL ? 'admin' : 'student';
                        setDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'profile', 'data'), {createdAt: new Date().toISOString(), cycleDays: 13, startDate: new Date().toISOString().split('T')[0], role: initRole}); 
                    }
                }),
                onSnapshot(doc(db, 'artifacts', APP_ID, 'users', uid, 'antropometria', 'latest'), snap => { if(snap.exists()) state.antropo=snap.data(); }),
                onSnapshot(collection(db, 'artifacts', APP_ID, 'users', uid, 'exercises'), snap => { state.exercises = snap.docs.map(d => ({id: d.id, ...d.data()})); }),
                onSnapshot(collection(db, 'artifacts', APP_ID, 'users', uid, 'routines'), snap => { state.routines = snap.docs.map(d => ({id: d.id, ...d.data()})); }),
                onSnapshot(doc(db, 'artifacts', APP_ID, 'users', uid, 'health', 'data'), snap => { if(snap.exists()) state.health=snap.data(); }),
                () => { if(state.unsubNutri) state.unsubNutri(); }, () => { if(state.unsubWorkout) state.unsubWorkout(); }
            );
            appManager.subscribeNutrition(state.activeDate); appManager.subscribeWorkout(state.activeWorkoutDate);
        }

        function calculateTimeMetrics() { if(!state.profile.startDate) return; const d = Math.floor((new Date().getTime() - new Date(state.profile.startDate).getTime()) / 86400000) + 1; state.profile.currentDay = d > 0 ? d : 1; }

        let currentViewId = '';
        function renderView(viewId) {
            currentViewId = viewId; const container = document.getElementById('view-container'); container.innerHTML = ''; container.classList.add('animate-fade-in'); container.style.animation='none'; container.offsetHeight; container.style.animation=null;
            switch(viewId) { case 'dashboard': container.innerHTML = buildDashboard(); break; case 'profile': container.innerHTML = buildProfile(); initProfileListeners(); break; case 'anthropometry': container.innerHTML = buildAntropo(); initAntropoListeners(); break; case 'nutrition': container.innerHTML = buildNutrition(); break; case 'training': container.innerHTML = buildTraining(); break; case 'analytics': container.innerHTML = buildAnalytics(); initAnalyticsListeners(); break; case 'clinical': container.innerHTML = buildClinical(); break; case 'admin': container.innerHTML = state.user.email===ADMIN_EMAIL ? buildAdmin() : '<p class="text-red-500">Denegado</p>'; break; }
        }

        function calcularMacros() { if(!state.nutrition || !state.nutrition.meals) return {k:0,p:0,c:0,f:0}; return state.nutrition.meals.reduce((a,m)=>{a.k+=Number(m.kcal)||0;a.p+=Number(m.prot)||0;a.c+=Number(m.carb)||0;a.f+=Number(m.fat)||0;return a;},{k:0,p:0,c:0,f:0}); }

        // ==========================================
        // VISTA 1: DASHBOARD
        // ==========================================
        function buildDashboard() {
            const p = state.profile, a = state.antropo, bw = a.peso_actual||70, bf = parseFloat(a.calc_bf)||(p.gender==='F'?25:15), lbm = parseFloat(a.calc_lbm)||(bw*(1-bf/100)), tdee = parseFloat(a.calc_tdee)||2000, somato = a.somatotype||"Desconocido", dNum = p.currentDay||1, m = calcularMacros(), w = state.dailyWorkout, bc = w ? (w.burnedCalories||0) : 0, msg = dNum>1 ? `"Día ${dNum}: El progreso exige consistencia."` : `"Día 1: Rompe el estado de reposo."`;
            return `<div class="space-y-6"><div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-700/50 pb-4"><div><h2 class="text-3xl font-bold text-white">Centro de Control</h2><p class="text-sky-400 font-semibold tracking-wide uppercase text-sm mt-1">Día ${dNum} de ${p.cycleDays||13} - Fase de Ejecución</p></div><div class="flex gap-2">${bc>0 ? `<div class="bg-red-900/30 px-4 py-2 rounded-xl border border-red-500/30 text-center"><p class="text-red-400 font-bold leading-none">${bc.toFixed(0)} kcal</p><p class="text-[10px] text-gray-400">Activas Quemadas</p></div>` : ''}<button onclick="appManager.navigate('training')" class="glass-btn px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2"><i class="fa-solid fa-play"></i> Iniciar Entrenamiento Hoy</button></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6"><div class="glass-panel p-6 border-l-4 border-l-sky-500"><h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Directriz Diaria</h3><p class="text-lg text-white italic">${msg}</p><div class="mt-4 pt-4 border-t border-gray-700"><h4 class="text-sm font-bold text-purple-400 mb-1"><i class="fa-solid fa-stethoscope"></i> Diagnóstico IA</h4><p class="text-xs text-gray-300 mb-2">GET: <b class="text-orange-400">${Math.round(tdee)} kcal</b>. Somatotipo: <b class="text-sky-400">${somato}</b></p></div></div><div class="glass-panel p-6 bg-slate-800/80"><h3 class="text-sm font-bold text-green-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-power-off"></i> Guía (Routine.start)</h3><ul class="text-sm text-gray-300 space-y-3"><li><b class="text-white">1. Mañana:</b> Peso y sueño en <a onclick="appManager.navigate('analytics')" class="text-sky-400 underline cursor-pointer">Historial</a>.</li><li><b class="text-white">2. Día:</b> Registra agua, macros y suplementos en Nutrición.</li><li><b class="text-white">3. Noche:</b> Guarda sesiones para la analítica.</li></ul></div></div                         const nE = d.map(ex=>({id:ex.id||Date.now().toString()+Math.random().toString(36).substr(2,5), name:ex.name||'Ej', muscle:ex.muscle||'Varios', type:ex.type||'Compuesto', focus:ex.focus||'Hipertrofia', equip:ex.equip||'', desc:ex.desc||'', sets:Array.isArray(ex.sets)?ex.sets.map(s=>({weight:Number(s.weight)||0, reps:Number(s.reps)||0, rir:Number(s.rir)||2, done:!!s.done})):[{weight:0,reps:0,rir:2,done:false}]}));

                        ModalSystem.alert(`Cargados ${nE.length} ejercicios.`);

                    } catch(err){ ModalSystem.alert("Error: "+err.message); }

                }

            publishToCatalog: () => {

                ModalSystem.show("Publicar Rutina Global", `<input type="text" id="cat-rout-name" placeholder="Nombre (Ej. Pierna Avanzado)" class="w-full p-2 glass-input">`, 'confirm', async () => {
                    const name = document.getElementById('cat-rout-name').value; if(!name) return;
                    try {
                        const cleanEx = workoutManager.activeExercises.map(ex => ({...ex, sets: [{weight:0,reps:0,rir:2,done:false}]}));
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'courses'), { type: 'routine', name: name, author: state.user.email, exercises: cleanEx, createdAt: new Date().toISOString() });
                        ModalSystem.alert("Rutina publicada para todos los alumnos.");
                    } catch(e) {}
                });
            },

            showExerciseEditor: () => ModalSystem.show("Librería Local", `<div class="space-y-2"><input type="text" id="ex-n" placeholder="Nombre" class="w-full p-2 glass-input"><select id="ex-m" class="w-full p-2 glass-input"><option>Pecho</option><option>Espalda</option><option>Piernas</option><option>Hombros</option><option>Brazos</option><option>Core</option></select><select id="ex-t" class="w-full p-2 glass-input"><option>Compuesto</option><option>Aislado</option></select></div>`, 'confirm', async () => { if(state.user){ const n = document.getElementById('ex-n').value; if(n) try { await addDoc(collection(db, 'artifacts', APP_ID, 'users', state.user.uid, 'exercises'), { name: n, muscle: document.getElementById('ex-m').value, type: document.getElementById('ex-t').value, createdAt: new Date().toISOString() }); renderView('training'); } catch(e){} } }),
            
            addExerciseToWorkout: () => { 
                if(!state.exercises.length) return ModalSystem.alert("Librería local vacía. Usa el Catálogo o Crea Ejercicios."); 
                const opts = state.exercises.map(e => `<option value="${e.id}">${e.name} (${e.muscle})</option>`).join(''); 
                ModalSystem.show("Agregar a Sesión", `<select id="sel-ex" class="w-full p-2 glass-input">${opts}</select>`, 'confirm', () => { 
                    const ex = state.exercises.find(e => e.id===document.getElementById('sel-ex').value);

                        workoutManager.saveQueue(); 
                        renderView('training'); 
                    } 
                }); 
            },

            removeExercise: (index) => { 
                workoutManager.activeExercises.splice(index, 1); 
                workoutManager.saveQueue(); 
                renderView('training'); 
            },
            
            showRoutinesManager: () => {
                if(!state.user) return;
                const rHtml = state.routines && state.routines.length > 0 ? state.routines.map(r => `
                    <div class="flex justify-between items-center bg-gray-800 p-2 rounded mb-2 border border-gray-700">
                        <span class="text-sm font-bold text-sky-400">${r.name} <span class="text-[10px] text-gray-500">(${r.exercises.length} ej.)</span></span>
                        <div class="flex gap-2">
                            <button onclick="workoutManager.editRoutine('${r.id}')" class="text-xs bg-yellow-900/50 text-yellow-400 px-2 py-1 rounded" title="Editar Contenido"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="workoutManager.loadRoutine('${r.id}')" class="text-xs bg-sky-900/50 text-sky-300 px-2 py-1 rounded"><i class="fa-solid fa-download"></i></button>
                            <button onclick="workoutManager.deleteRoutine('${r.id}')" class="text-xs bg-red-900/50 text-red-400 px-2 py-1 rounded"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join('') : '<p class="text-xs text-gray-500">No tienes grupos guardados.</p>';
                
                const html = `
                    <div class="space-y-4">
                        <div class="bg-gray-800/50 p-4 rounded border border-gray-700">
                            <p class="text-xs text-gray-400 mb-2">Guardar los ejercicios de la cola actual como Grupo:</p>
                            <div class="flex gap-2">
                                <input type="text" id="rt-name" placeholder="Ej. Día 1 Pecho" class="flex-1 p-2 text-sm glass-input rounded">
                                <button onclick="workoutManager.saveCurrentAsRoutine()" class="glass-btn px-3 py-1 rounded text-sm font-bold">Guardar</button>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-white mb-2">Tus Grupos Locales</h4>
                            <div class="max-h-40 overflow-y-auto pr-2">${rHtml}</div>
                        </div>
                    </div>
                `;
                ModalSystem.show("Grupos / Rutinas", html, 'info');
                
                // Si estaba editando una rutina, pre-llenar el nombre
                setTimeout(()=>{ 
                    if(workoutManager.editingRoutineId){ 
                        const r = state.routines.find(x=>x.id===workoutManager.editingRoutineId); 
                        if(r) document.getElementById('rt-name').value = r.name; 
                    } 
                }, 100);
            },

            editRoutine: (id) => { 
                const r = state.routines.find(x=>x.id===id); 
                if(r) { 
                    workoutManager.activeExercises = JSON.parse(JSON.stringify(r.exercises)); 
                    workoutManager.editingRoutineId = id; 
                    workoutManager.saveQueue(); 
                    renderView('training'); 
                    workoutManager.showRoutinesManager(); 
                } 
            },

            saveCurrentAsRoutine: async () => { 
                const name = document.getElementById('rt-name').value; 
                if(!name || workoutManager.activeExercises.length === 0) return; 
                try { 
                    const cleanEx = workoutManager.activeExercises.map(ex => ({...ex, sets: [{weight:0, reps:0, rir:2, done:false}]})); 
                    if(workoutManager.editingRoutineId) { 
                        await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines', workoutManager.editingRoutineId), { name: name, exercises: cleanEx, updatedAt: new Date().toISOString() }, {merge:true}); 
                        workoutManager.editingRoutineId = null; 
                    } else { 
                        await addDoc(collection(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines'), { name: name, exercises: cleanEx, createdAt: new Date().toISOString() }); 
                    } 
                    ModalSystem.alert("Grupo guardado correctamente."); 
                    workoutManager.showRoutinesManager(); 
                } catch(e) {} 
            },

            loadRoutine: (id) => { 
                const r = state.routines.find(x => x.id === id); 
                if(r) { 
                    workoutManager.activeExercises = JSON.parse(JSON.stringify(r.exercises)); 
                    workoutManager.saveQueue(); 
                    renderView('training'); 
                    ModalSystem.alert("Grupo cargado a la cola de hoy."); 
                } 
            },

            deleteRoutine: async (id) => { 
                try { 
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'routines', id)); 
                    workoutManager.showRoutinesManager(); 
                } catch(e) {} 
            },
            
            startWorkout: () => { 
                if(!workoutManager.activeExercises.length) return ModalSystem.alert("Agrega ejercicios."); 
                document.getElementById('workout-dashboard').classList.add('hidden'); 
                document.getElementById('workout-active').classList.remove('hidden'); 
                if(!workoutManager.isEditing) { 
                    workoutManager.timeElapsed=0; 
                    workoutManager.currentExerciseIndex=0; 
                } 
                workoutManager.startTimer(); 
                renderActiveExercise(); 
            },

            startTimer: () => { 
                if(workoutManager.timerInterval) clearInterval(workoutManager.timerInterval); 
                workoutManager.timerInterval = setInterval(()=>{ 
                    workoutManager.timeElapsed++; 
                    workoutManager.updateTimerUI(); 
                    if(workoutManager.timeElapsed % 10 === 0) workoutManager.saveQueue(); // Auto save every 10s
                }, 1000); 
            },

            updateTimerUI: () => { 
                const el = document.getElementById('active-timer'); 
                if(!el) return clearInterval(workoutManager.timerInterval); 
                const m = Math.floor(workoutManager.timeElapsed/60), s = workoutManager.timeElapsed%60; 
                el.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; 
                if(workoutManager.isResting){ 
                    if(workoutManager.timeElapsed>workoutManager.restTarget){ 
                        el.classList.add('timer-penalty'); 
                        document.getElementById('timer-status').innerText="¡PENALIZACIÓN!"; 
                    } else { 
                        el.classList.remove('timer-penalty'); 
                        document.getElementById('timer-status').innerText="Descanso"; 
                    } 
                } else { 
                    el.classList.remove('timer-penalty'); 
                    document.getElementById('timer-status').innerText="Trabajo"; 
                } 
            },

            toggleRest: () => { 
                workoutManager.isResting = !workoutManager.isResting; 
                workoutManager.timeElapsed=0; 
                document.getElementById('btn-toggle-rest').innerText = workoutManager.isResting ? 'Terminar Descanso' : 'Descanso'; 
                workoutManager.updateTimerUI(); 
            },

            addSetToCurrent: () => { 
                workoutManager.activeExercises[workoutManager.currentExerciseIndex].sets.push({weight:0,reps:0,rir:2,done:false}); 
                workoutManager.saveQueue(); 
                renderActiveExercise(); 
            },

            updateSet: (i, field, val) => { 
                workoutManager.activeExercises[workoutManager.currentExerciseIndex].sets[i][field] = Number(val); 
                workoutManager.saveQueue(); 
                renderActiveExercise(); 
            },

            toggleSetDone: (i) => { 
                const ex = workoutManager.activeExercises[workoutManager.currentExerciseIndex]; 
                ex.sets[i].done = !ex.sets[i].done; 
                ex.sets[i].weight = document.getElementById(`set-w-${i}`).value; 
                ex.sets[i].reps = document.getElementById(`set-r-${i}`).value; 
                workoutManager.saveQueue(); 
                renderActiveExercise(); 
            },

            nextExercise: () => { 
                if(workoutManager.currentExerciseIndex < workoutManager.activeExercises.length-1){ 
                    workoutManager.currentExerciseIndex++; 
                    renderActiveExercise(); 
                } 
            },

            prevExercise: () => { 
                if(workoutManager.currentExerciseIndex > 0){ 
                    workoutManager.currentExerciseIndex--; 
                    renderActiveExercise(); 
                } 
            },

            contingency: (t) => { if(t==='fail') ModalSystem.alert("Fallo registrado."); },
            
            finishWorkout: async () => { 
                clearInterval(workoutManager.timerInterval); 
                if(state.user){ 
                    try { 
                        let tVol = 0, tSet = 0; 
                        workoutManager.activeExercises.forEach(ex => { 
                            ex.sets.forEach(s => { 
                                // Auto-detectar si se ingresaron datos y no se marcó el check (Entrada Post-entreno manual)
                                if(Number(s.weight) > 0 || Number(s.reps) > 0) s.done = true;
                                if(s.done) { 
                                    tVol += (Number(s.weight) * Number(s.reps)); 
                                    tSet++; 
                                } 
                            }); 
                        }); 
                        
                        const bw = state.antropo.peso_actual || 70; 
                        let aSec = workoutManager.timeElapsed; 
                        // Estimación si es manual: 2 mins por cada serie completada
                        if(aSec < 60 && tSet > 0) aSec = tSet * 120; 
                        
                        const aHrs = aSec / 3600; 
                        const cTotal = (3.5 * bw * aHrs) + (tVol * 0.06); 
                        
                        await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'workouts_daily', state.activeWorkoutDate), { 
                            date: state.activeWorkoutDate, duration: aSec, exercises: workoutManager.activeExercises, burnedCalories: cTotal, completed: true 
                        }); 
                        
                        ModalSystem.alert(`¡Entrenamiento guardado!<br><br>Volumen Movido: <b class="text-purple-400">${tVol} kg</b><br>Quemadas: <b class="text-orange-400">${cTotal.toFixed(0)} kcal</b><br><span class="text-[10px] text-gray-500">(Fórmula: Tiempo Activo + Carga Mecánica)</span>`); 
                    } catch(e){} 
                } 
                workoutManager.activeExercises = []; 
                workoutManager.isEditing = false; 
                renderView('training'); 
            }
        };

        function renderActiveExercise() {
            const ex = workoutManager.activeExercises[workoutManager.currentExerciseIndex]; if(!ex) return;
            let exVol = 0, best1RM = 0; 
            ex.sets.forEach(s => { 
                const w = Number(s.weight), r = Number(s.reps); 
                if(w>0 && r>0) { 
                    exVol += (w * r); 
                    const c1RM = w * (1 + (r / 30)); 
                    if(c1RM > best1RM) best1RM = c1RM; 
                } 
            });
            
            document.getElementById('active-sets-container').innerHTML = `
                <div class="flex justify-around mb-4 bg-gray-800/40 p-3 rounded-lg border border-sky-500/20">
                    <div class="text-center">
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest">Volumen Total</p>
                        <p class="text-lg font-bold text-sky-400">${exVol} <span class="text-xs font-normal">kg</span></p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest">1RM Estimado</p>
                        <p class="text-lg font-bold text-purple-400">${best1RM.toFixed(1)} <span class="text-xs font-normal">kg</span></p>
                    </div>
                </div>
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-700"><th>Set</th><th>Kg</th><th>Reps</th><th class="text-right">Done</th></tr>
                    </thead>
                    <tbody>
                        ${ex.sets.map((s,i)=>`
                            <tr class="border-b border-gray-800 py-2 ${s.done?'opacity-50':''}">
                                <td class="py-3 font-bold">${i+1}</td>
                                <td><input type="number" id="set-w-${i}" value="${s.weight}" onchange="workoutManager.updateSet(${i}, 'weight', this.value)" class="w-16 p-1 glass-input text-center rounded bg-gray-900 border border-gray-600"></td>
                                <td><input type="number" id="set-r-${i}" value="${s.reps}" onchange="workoutManager.updateSet(${i}, 'reps', this.value)" class="w-16 p-1 glass-input text-center rounded bg-gray-900 border border-gray-600"></td>
                                <td class="text-right"><button onclick="workoutManager.toggleSetDone(${i})" class="text-3xl ${s.done?'text-green-500':'text-gray-600'} hover:scale-110 transition"><i class="fa-solid fa-circle-check"></i></button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="mt-4"><button onclick="workoutManager.addSetToCurrent()" class="glass-btn px-3 py-1 rounded text-xs font-bold">+ Añadir Serie</button></div>
            `;
            document.getElementById('active-ex-name').innerText = ex.name; 
            document.getElementById('ex-counter-display').innerText = `Ej. ${workoutManager.currentExerciseIndex+1} / ${workoutManager.activeExercises.length}`;
        }
        window.renderActiveExercise = renderActiveExercise;

                                <button onclick="workoutManager.editDailyWorkout()" class="glass-btn px-6 py-2 rounded-lg font-bold border-yellow-500 text-yellow-400"><i class="fa-solid fa-pen"></i> Editar Sesión</button>

                                <button onclick="workoutManager.showJSONExample()" class="glass-btn px-3 py-2 rounded text-xs border-indigo-500 text-indigo-400" title="Ver estructura JSON"><i class="fa-solid fa-code"></i> Ej.</button>
                                <input type="file" id="workout-json-file" accept=".json" class="hidden" onchange="workoutManager.uploadJSON(event)">
                                <label for="workout-json-file" class="glass-btn p-2 rounded px-3 text-xs text-purple-400 bg-purple-900/20 border-purple-500/50 cursor-pointer flex items-center gap-2" title="Cargar JSON">
                                    <i class="fa-solid fa-file-import"></i> JSON
                                </label>
                                <button onclick="workoutManager.downloadJSON()" class="glass-btn px-3 py-2 rounded text-xs border-blue-500 text-blue-400" title="Exportar Día"><i class="fa-solid fa-file-arrow-down"></i> Bajar</button>
                                
                                <button onclick="workoutManager.showExerciseEditor()" class="glass-btn p-2 rounded text-xs"><i class="fa-solid fa-plus"></i> Ej.</button>
                            </div>
                        </div>
                        
                        <div class="glass-panel p-6 text-center flex-1">
                            <h3 class="text-xl font-bold mb-4 text-sky-400"><i class="fa-solid fa-bolt drop-shadow-[0_0_15px_rgba(56,189,248,0.5)]"></i> Cola de Hoy</h3>

                                ${workoutManager.activeExercises.map((e,i)=>`

                    </div>

                    <div id="workout-active" class="hidden flex-1 flex flex-col space-y-4">
                        <div class="glass-panel p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <h3 class="text-xl font-bold text-sky-400 text-center md:text-left flex-1" id="active-ex-name">--</h3>
                            <div class="text-center px-6">
                                <div id="active-timer" class="text-4xl font-mono font-bold text-white tracking-widest">00:00</div>
                                <p id="timer-status" class="text-[10px] text-sky-300 uppercase tracking-widest">Trabajo</p>
                            </div>
                            <button id="btn-toggle-rest" onclick="workoutManager.toggleRest()" class="glass-btn px-6 py-3 rounded-xl bg-slate-800 font-bold flex-1 max-w-[200px]">Descanso</button>
                        </div>
                        
                        <div class="glass-panel p-4 flex-1 overflow-y-auto" id="active-sets-container"></div>
                        
                        <div class="glass-panel p-4 flex flex-col sm:flex-row justify-between gap-4">
                            <div class="flex items-center justify-center gap-4">
                                <button onclick="workoutManager.prevExercise()" class="glass-btn w-12 h-12 rounded-full text-xl"><i class="fa-solid fa-chevron-left"></i></button>
                                <span id="ex-counter-display" class="text-sm font-bold text-gray-300"></span>
                                <button onclick="workoutManager.nextExercise()" class="glass-btn w-12 h-12 rounded-full text-xl"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                            <button onclick="workoutManager.finishWorkout()" class="glass-btn px-8 py-3 rounded-xl font-bold bg-green-600/30 border-green-500 text-white shadow-lg w-full sm:w-auto"><i class="fa-solid fa-check"></i> Terminar Sesión</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // VISTA HISTORIAL, CLÍNICA Y ADMIN
        // ==========================================
        window.historyManager = {
            chartInstance: null,
            fetchDate: async () => {
                if(!state.user) return; const uid = state.user.uid, ds = document.getElementById('hist-date').value;
                try {
                    const anS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'analytics_daily', ds));
                    const ad = anS.exists() ? anS.data() : { sleep: '', deepSleep: '', workSchedule: '', trainTime: '' };
                    document.getElementById('hist-sleep').value = ad.sleep||''; document.getElementById('hist-deepsleep').value = ad.deepSleep||''; document.getElementById('hist-work').value = ad.workSchedule||''; document.getElementById('hist-train').value = ad.trainTime||'';

                    const nuS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'nutrition', ds));
                    if(nuS.exists() && nuS.data().meals && nuS.data().meals.length>0) {
                        const m = nuS.data().meals.reduce((a,x)=>{a.k+=Number(x.kcal)||0;a.p+=Number(x.prot)||0;a.c+=Number(x.carb)||0;a.f+=Number(x.fat)||0;return a;},{k:0,p:0,c:0,f:0});
                        document.getElementById('hist-nutri-result').innerHTML = `<div class="bg-gray-800/50 p-2 rounded text-xs text-center grid grid-cols-4"><span class="text-orange-400 font-bold">${m.k}k</span><span class="text-blue-400 font-bold">${m.p.toFixed(0)}P</span><span class="text-green-400 font-bold">${m.c.toFixed(0)}C</span><span class="text-yellow-400 font-bold">${m.f.toFixed(0)}G</span></div>`;
                    } else document.getElementById('hist-nutri-result').innerHTML = '<div class="text-xs text-gray-500">Sin datos</div>';

                    const woS = await getDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'workouts_daily', ds));
                    if(woS.exists() && woS.data().completed) document.getElementById('hist-train-result').innerHTML = `<div class="bg-gray-800/50 p-2 rounded text-xs"><span class="text-green-400"><i class="fa-solid fa-check"></i> Completado</span> (${(woS.data().burnedCalories||0).toFixed(0)} kcal)</div>`;
                    else document.getElementById('hist-train-result').innerHTML = '<div class="text-xs text-gray-500">Sin datos</div>';
                } catch(e){}
            },
            saveDay: async () => { if(state.user) { try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'analytics_daily', document.getElementById('hist-date').value), { sleep: document.getElementById('hist-sleep').value, deepSleep: document.getElementById('hist-deepsleep').value, workSchedule: document.getElementById('hist-work').value, trainTime: document.getElementById('hist-train').value, updatedAt: new Date().toISOString() }); appManager.saveIndicator('save-status-hist'); window.historyManager.loadWeeklyTrends(); } catch(e){} } },
            loadWeeklyTrends: async () => {
                if(!state.user) return; const u=state.user.uid; let l=[], sD=[], kD=[], tS=0, tK=0, dC=0;
                for(let i=6; i>=0; i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().split('T')[0]; l.push(d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})); try { const [aS, nS] = await Promise.all([getDoc(doc(db, 'artifacts', APP_ID, 'users', u, 'analytics_daily', ds)), getDoc(doc(db, 'artifacts', APP_ID, 'users', u, 'nutrition', ds))]); let sl=0, kc=0; if(aS.exists()&&aS.data().sleep){ sl=parseFloat(aS.data().sleep); sD.push(sl); tS+=sl; dC++; } else sD.push(0); if(nS.exists()&&nS.data().meals){ kc=nS.data().meals.reduce((a,x)=>a+(Number(x.kcal)||0),0); kD.push(kc); tK+=kc; } else kD.push(0); } catch(e){sD.push(0);kD.push(0);} }
                const eS=document.getElementById('trend-avg-sleep'), eK=document.getElementById('trend-avg-kcal'); if(eS) eS.innerText=(dC>0?(tS/dC).toFixed(1):'0')+'h'; if(eK) eK.innerText=(dC>0?Math.round(tK/dC):0)+'k';
                const ctx=document.getElementById('weekly-chart'); if(!ctx) return; if(window.historyManager.chartInstance) window.historyManager.chartInstance.destroy();
                window.historyManager.chartInstance = new Chart(ctx, { type: 'bar', data: { labels: l, datasets: [{label:'Kcal', data:kD, backgroundColor:'#38bdf8', yAxisID:'y'},{label:'Sueño', data:sD, type:'line', borderColor:'#a855f7', yAxisID:'y1'}] }, options: { responsive:true, maintainAspectRatio:false } });
            }
        };

        function buildAnalytics() { return `<div class="max-w-4xl mx-auto space-y-6"><div class="flex justify-between items-center"><h2 class="text-3xl font-bold text-white">Historial</h2><button onclick="historyManager.saveDay()" class="glass-btn px-4 py-2 rounded-lg flex items-center gap-2"><i class="fa-solid fa-save"></i> Guardar</button></div><span id="save-status-hist" class="text-sm"></span><div class="glass-panel p-4 flex gap-4 items-center"><label class="text-sm text-sky-400">Fecha:</label><input type="date" id="hist-date" value="${new Date().toISOString().split('T')[0]}" class="p-2 rounded glass-input font-bold border-sky-500/50"></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="glass-panel p-6 space-y-4"><h3 class="font-bold text-purple-400">Sueño</h3><div><label class="text-xs text-gray-400">Total (hrs)</label><input type="number" step="0.1" id="hist-sleep" class="w-full p-2 glass-input"></div><div><label class="text-xs text-gray-400">Profundo (hrs)</label><input type="number" step="0.1" id="hist-deepsleep" class="w-full p-2 glass-input"></div></div><div class="glass-panel p-6 space-y-4"><h3 class="font-bold text-blue-400">Horarios</h3><div><label class="text-xs text-gray-400">Trabajo</label><input type="text" id="hist-work" class="w-full p-2 glass-input"></div><div><label class="text-xs text-gray-400">Entreno</label><input type="text" id="hist-train" class="w-full p-2 glass-input"></div></div></div><div class="glass-panel p-6"><h3 class="font-bold text-white mb-4">Resumen Diario</h3><div class="grid grid-cols-2 gap-4"><div><p class="text-orange-400 text-sm mb-1">Nutrición</p><div id="hist-nutri-result"></div></div><div><p class="text-sky-400 text-sm mb-1">Entrenamiento</p><div id="hist-train-result"></div></div></div></div><div class="glass-panel p-6"><h3 class="font-bold text-white mb-4">Tendencias (7 Días)</h3><div class="flex gap-4 mb-4"><div class="bg-gray-800/50 p-2 rounded text-center flex-1"><p class="text-xs text-gray-400">Sueño Avg</p><p class="font-bold text-purple-400" id="trend-avg-sleep">--</p></div><div class="bg-gray-800/50 p-2 rounded text-center flex-1"><p class="text-xs text-gray-400">Kcal Avg</p><p class="font-bold text-sky-400" id="trend-avg-kcal">--</p></div></div><div class="h-64"><canvas id="weekly-chart"></canvas></div></div></div>`; }
        function initAnalyticsListeners() { document.getElementById('hist-date').addEventListener('change', window.historyManager.fetchDate); window.historyManager.fetchDate(); window.historyManager.loadWeeklyTrends(); }

        window.clinicalManager = { save: async () => { if(state.user) { try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', state.user.uid, 'health', 'data'), { labDate: document.getElementById('clin-labdate').value, glucose: document.getElementById('clin-glucose').value, cortisol: document.getElementById('clin-cortisol').value, testo: document.getElementById('clin-testo').value, ldl: document.getElementById('clin-ldl').value, hdl: document.getElementById('clin-hdl').value, purgeDate: document.getElementById('clin-purge').value, fastingState: document.getElementById('clin-fasting').value, updatedAt: new Date().toISOString() }, {merge:true}); appManager.saveIndicator('save-status-clin'); } catch(e){} } } };
        function buildClinical() { const h = state.health || {}; return `<div class="max-w-6xl mx-auto space-y-6"><div class="flex justify-between items-center"><h2 class="text-3xl font-bold text-white">Clínica & Ciencia</h2><button onclick="clinicalManager.save()" class="glass-btn px-4 py-2 rounded text-red-400 border-red-500/50">Guardar</button></div><span id="save-status-clin"></span><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="glass-panel p-6 border-red-500/20"><h3 class="font-bold text-red-400 mb-4">Hemáticos</h3><input type="date" id="clin-labdate" value="${h.labDate||''}" class="w-full p-2 glass-input mb-2"><div class="grid grid-cols-2 gap-2 text-xs"><div>Glucosa<input type="number" id="clin-glucose" value="${h.glucose||''}" class="w-full p-1 glass-input"></div><div>Cortisol<input type="number" id="clin-cortisol" value="${h.cortisol||''}" class="w-full p-1 glass-input"></div><div class="col-span-2">Testosterona<input type="number" id="clin-testo" value="${h.testo||''}" class="w-full p-1 glass-input border-purple-500/30"></div><div>LDL<input type="number" id="clin-ldl" value="${h.ldl||''}" class="w-full p-1 glass-input"></div><div>HDL<input type="number" id="clin-hdl" value="${h.hdl||''}" class="w-full p-1 glass-input"></div></div></div><div class="space-y-6"><div class="glass-panel p-6 border-green-500/20"><h3 class="font-bold text-green-400 mb-2">Desparasitación</h3><input type="date" id="clin-purge" value="${h.purgeDate||''}" class="w-full p-2 glass-input"></div><div class="glass-panel p-6 border-blue-500/20"><h3 class="font-bold text-blue-400 mb-2">Ayuno Intermitente</h3><select id="clin-fasting" class="w-full p-2 glass-input text-sm"><option value="none" ${h.fastingState==='none'?'selected':''}>Sin ayuno</option><option value="12:12" ${h.fastingState==='12:12'?'selected':''}>12:12</option><option value="16:8" ${h.fastingState==='16:8'?'selected':''}>16:8</option></select></div></div></div><div class="glass-panel p-6 bg-red-900/10 border-red-500/30 mt-6"><h3 class="text-lg font-bold text-red-500">Reglas Cero Tolerancia</h3><ul class="list-disc pl-5 text-sm text-gray-300 mt-2"><li>Cero Alcohol: Inhibe oxidación de grasa.</li><li>Cero Azúcar Líquido: Gaseosas normales o jugos.</li><li>Cero Fritos: Destruye perfil lipídico.</li></ul></div></div>`; }

        window.adminManager = { processFDCFile: (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async (ev) => { try { const d = JSON.parse(ev.target.result); document.getElementById('admin-log').innerHTML = `Procesando...`; const b = writeBatch(db); let c = 0; for(const x of d.FoundationFoods.slice(0, 100)) { b.set(doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'food_db')), { desc: x.description, category: x.foodCategory?.description||'N/A', kcal: x.foodNutrients.find(n=>n.nutrient.name.includes("Energy"))?.amount||0, protein: x.foodNutrients.find(n=>n.nutrient.name.includes("Protein"))?.amount||0 }); c++; } await b.commit(); document.getElementById('admin-log').innerHTML += `<br><span class="text-green-400">${c} subidos.</span>`; } catch(err){ document.getElementById('admin-log').innerHTML = `<span class="text-red-400">${err.message}</span>`; } }; r.readAsText(f); } };
        function buildAdmin() { return `<div class="max-w-4xl mx-auto space-y-6"><h2 class="text-3xl font-bold text-purple-400">Admin</h2><div class="glass-panel p-6"><h3 class="text-xl font-bold text-white mb-4">Carga FDC</h3><input type="file" id="fdc-file" accept=".json" class="hidden" onchange="adminManager.processFDCFile(event)"><label for="fdc-file" class="glass-btn px-6 py-3 rounded-xl cursor-pointer">Subir JSON</label><div id="admin-log" class="mt-4 p-4 bg-black/50 text-xs text-gray-300">Esperando...</div></div></div>`; }
    </script>
</body>
</html>
