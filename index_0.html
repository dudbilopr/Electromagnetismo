        /* ==========================================
           5. FLUJO DE E-COMMERCE & APROBACIÓN MANUAL
        ========================================== */
        const CheckoutModal = ({ course, onBack, user, openAuth }) => {
            const [coupon, setCoupon] = useState('');
            const [discount, setDiscount] = useState(0);
            const [loading, setLoading] = useState(false);
            const [success, setSuccess] = useState(false);

            if (!course) return null;

            const applyCoupon = () => {
                if(coupon.toUpperCase() === 'PHYSICS10') setDiscount(10);
                else alert('Cupón inválido');
            };

            const finalPrice = Math.max(0, course.price - discount).toFixed(2);

            const handleEnroll = async () => {
                if(!user) return openAuth();
                setLoading(true);
                
                try {
                    // Si el curso es gratis, aprobar automáticamente (Modificación Regla 6)
                    const autoStatus = course.price === 0 ? 'Aprobado' : 'Pendiente';

                    // Crear registro en DB
                    const enrollRef = ref(db, `enrollments/${user.uid}/${course.id}`);
                    await set(enrollRef, {
                        courseId: course.id,
                        title: course.title,
                        status: autoStatus, 
                        date: new Date().toISOString(),
                        pricePaid: finalPrice,
                        progress: 0
                    });
                    
                    setSuccess(true);
                } catch(e) {
                    alert("Error en la matrícula: " + e.message);
                }
                setLoading(false);
            };

            if (success) {
                return (
                    <div className="max-w-2xl mx-auto py-20 px-4 text-center">
                        <div className="bg-white p-12 rounded-2xl shadow-premium border border-slate-100 flex flex-col items-center">

                            <h2 className="text-3xl font-bold mb-4">¡Matrícula Exitosa!</h2>
                            <p className="text-slate-600 mb-8 text-lg">
                                Tu estado actual es <strong className="text-green-600 uppercase bg-green-100 px-2 py-1 rounded">{course.price === 0 ? 'Aprobado' : 'Pendiente'}</strong>. <br/><br/>
                                {course.price === 0 ? '¡Ya puedes acceder al curso completo desde tu dashboard!' : 'El Administrador Técnico verificará tu solicitud o comprobante de pago para otorgar el acceso final.'}
                            </p>
                            <Button onClick={onBack}>Ir al Dashboard</Button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto py-12 px-4 grid grid-cols-1 md:grid-cols-2 gap-12">
                    {/* Course Info */}
                    <div>
                        <button onClick={onBack} className="text-slate-500 hover:text-brand-accent mb-6 flex items-center gap-1 font-semibold"><ChevronRight className="rotate-180" size={18}/> Volver</button>
                        <h1 className="text-4xl font-extrabold mb-4">{course.title}</h1>
                        <p className="text-lg text-slate-600 mb-8">{course.description}</p>
                        
                        <h3 className="font-bold text-xl mb-4 border-b pb-2">Temario Detallado</h3>
                        <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">

                                <div key={i} className="bg-white p-4 rounded-xl border shadow-sm">
                                    <h4 className="font-bold flex items-center gap-2 text-brand-accent"><FolderIcon /> {mod.titulo}</h4>
                                    <ul className="mt-3 space-y-2 ml-6 text-sm text-slate-600">
                                        {mod.lecciones?.map((l, j) => (
                                            <li key={j} className="flex items-start gap-2">
                                                <FileText size={16} className="flex-shrink-0 mt-0.5"/> 
                                                <span>{l.titulo}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Checkout Box */}
                    <div>
                        <div className="bg-white p-8 rounded-2xl shadow-premium border border-slate-100 sticky top-24">

                            <div className="flex justify-between items-center mb-4 text-lg">
                                <span>Precio Original</span>
                                <span className="font-semibold">${course.price}</span>
                            </div>
                            {discount > 0 && (
                                <div className="flex justify-between items-center mb-4 text-lg text-brand-success">
                                    <span>Descuento Aplicado</span>
                                    <span className="font-semibold">-${discount}</span>
                                </div>
                            )}
                            <div className="flex justify-between items-center py-4 border-t border-b border-slate-200 mb-6">
                                <span className="text-xl font-bold">Total a Pagar</span>
                                <span className="text-3xl font-extrabold text-brand-accent">${finalPrice}</span>
                            </div>
                            
                            <div className="flex gap-2 mb-8">
                                <div className="relative flex-grow">
                                    <Tag className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18}/>
                                    <input 
                                        type="text" 
                                        placeholder="Código de cupón" 
                                        className="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-brand-accent"

        const FolderIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>;

        /* ==========================================

                    {/* Cursos Matriculados */}
                    <div className="lg:col-span-3">
                        <h2 className="text-3xl font-extrabold mb-6">Mis Cursos</h2>
                        <div className="space-y-6">
                            {enrollments.length === 0 ? (
                                <div className="bg-white p-12 text-center rounded-2xl border shadow-sm">
                                    <BookOpen size={48} className="mx-auto text-slate-300 mb-4"/>

                                </div>
                            ) : enrollments.map((enr, i) => (
                                <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center gap-6">

                                        <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=400&q=80" className="w-full h-full object-cover opacity-50"/>
                                    </div>
                                    <div className="flex-grow w-full">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="text-xl font-bold">{enr.title}</h3>
                                            {enr.status === 'Pendiente' ? (
                                                <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><Lock size={12}/> Pendiente Aprobación</span>
                                            ) : (
                                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><CheckCircle size={12}/> Aprobado</span>
                                            )}
                                        </div>
                                        <div className="w-full bg-slate-100 h-2 rounded-full mb-2 overflow-hidden">
                                            <div className="bg-brand-accent h-full" style={{width: `${enr.progress}%`}}></div>
                                        </div>
                                        <p className="text-sm text-slate-500 mb-4">Progreso: {enr.progress}%</p>
                                        
                                        <div className="flex gap-3">
                                            {enr.status === 'Aprobado' ? (
                                                <>
                                                    <Button onClick={() => onPlay(cursoCompletoElectro)} className="py-2 text-sm">Ir al Curso <Play size={16}/></Button>
                                                    {enr.progress >= 90 && (
                                                        <Button onClick={() => setReviewCourse(enr)} variant="outline" className="py-2 text-sm"><Star size={16}/> Dejar Reseña</Button>
                                                    )}

                                            ) : (
                                                <Button disabled variant="secondary" className="py-2 text-sm opacity-50 cursor-not-allowed">Acceso Bloqueado</Button>
                                            )}

                        </div>
                    </div>
                    {reviewCourse && <ReviewModal course={reviewCourse} onClose={() => setReviewCourse(null)} user={user} />}
                </div>
            );
        };

        // Sistema Multicriterio Gráfico
        const ReviewModal = ({ course, onClose, user }) => {
            const [ratings, setRatings] = useState({ clar: 0, util: 0, sop: 0 });
            const [comment, setComment] = useState('');
            const [submitted, setSubmitted] = useState(false);

            const StarRating = ({ value, onChange }) => (
                <div className="flex gap-1">
                    {[1,2,3,4,5].map(s => (
                        <Star key={s} size={24} className={`cursor-pointer transition-colors ${s <= value ? 'fill-yellow-400 text-yellow-400' : 'text-slate-300'}`} onClick={() => onChange(s)} />
                    ))}
                </div>
            );

            const submit = () => {
                if(!ratings.clar || !ratings.util || !ratings.sop || !comment) return alert('Completa todos los campos');
                const refRev = ref(db, `reviews/${course.courseId}/${user.uid}`);
                set(refRev, { ratings, comment, date: new Date().toISOString() });
                setSubmitted(true);
                setTimeout(onClose, 2000);
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex justify-center items-center p-4">
                    <div className="bg-white rounded-3xl p-8 max-w-lg w-full relative shadow-2xl">
                        <button onClick={onClose} className="absolute top-4 right-4 p-2 bg-slate-100 rounded-full hover:bg-slate-200"><X size={20}/></button>
                        
                        {submitted ? (
                            <div className="text-center py-10">
                                <CheckCircle size={64} className="text-brand-success mx-auto mb-4"/>
                                <h3 className="text-2xl font-bold">¡Gracias por tu valoración!</h3>
                            </div>
                        ) : (
                            <>
                                <h2 className="text-2xl font-bold mb-2">Valorar Curso</h2>
                                <p className="text-slate-500 mb-8">{course.title}</p>
                                
                                <div className="space-y-6 mb-8">
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-slate-700">1. Claridad de Explicación</span>
                                        <StarRating value={ratings.clar} onChange={(v) => setRatings({...ratings, clar: v})} />
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-slate-700">2. Utilidad Práctica</span>
                                        <StarRating value={ratings.util} onChange={(v) => setRatings({...ratings, util: v})} />
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-slate-700">3. Calidad del Soporte</span>

                                    value={comment} onChange={e => setComment(e.target.value)}
                                ></textarea>
                                
                                <Button onClick={submit} className="w-full py-3">Publicar Reseña</Button>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        /* ==========================================
           7. VISOR TIPO MOODLE & REGLAS DE PROGRESO
        ========================================== */
        const CourseViewer = ({ course, user, onBack }) => {
            // Extraer la primera lección por defecto
            const defaultLesson = course.modulos[0]?.lecciones[0]?.sublecciones ? course.modulos[0].lecciones[0].sublecciones[0] : course.modulos[0]?.lecciones[0];
            const [activeLesson, setActiveLesson] = useState(defaultLesson);
            const [drawerOpen, setDrawerOpen] = useState(true);
            const [completedLessons, setCompletedLessons] = useState({});
            const [activeSubIndex, setActiveSubIndex] = useState(0);

            useEffect(() => {
                setActiveSubIndex(0); // Reiniciar el índice de multi-recursos al cambiar de lección
            }, [activeLesson]);

            const markCompleted = (id) => {
                const newComp = {...completedLessons, [id]: true};
                setCompletedLessons(newComp);
                
                // Calcular progreso basado en los módulos completados (Simplificado)
                let count = 0;
                let total = 0;
                course.modulos?.forEach(m => {
                    m.lecciones?.forEach(l => {
                        if(l.tipo === 'grupo'){
                            l.sublecciones?.forEach(s => { total++; if(newComp[s.id]) count++; });
                        } else {
                            total++;
                            if(newComp[l.id]) count++;
                        }
                    })
                });
                const perc = Math.round((count / total) * 100) || 10;
                
                const refP = ref(db, `enrollments/${user.uid}/${course.id}`);
                update(refP, { progress: perc });
            };

            const renderLessonContent = () => {
                if (!activeLesson) return null;
                
                if (activeLesson.tipo === 'multivideo') {
                    const videoIds = activeLesson.recurso.split('|');
                    return (
                        <div className="flex w-full h-full flex-col md:flex-row">
                            <iframe src={`https://www.youtube.com/embed/${videoIds[activeSubIndex]}`} className="w-full h-full border-none flex-grow" allowFullScreen></iframe>
                            <div className="w-full md:w-64 bg-slate-800 p-4 overflow-y-auto flex-shrink-0 md:border-l border-white/10 flex md:block gap-2 overflow-x-auto md:overflow-x-hidden">
                                <h4 className="font-bold mb-4 hidden md:block">Playlist Interactiva</h4>
                                {videoIds.map((id, idx) => (
                                    <div key={idx} onClick={() => setActiveSubIndex(idx)} className={`p-2 mb-2 cursor-pointer rounded flex-shrink-0 w-32 md:w-auto transition-colors ${activeSubIndex === idx ? 'bg-brand-accent' : 'bg-slate-700 hover:bg-slate-600'}`}>
                                        <img src={`https://img.youtube.com/vi/${id}/mqdefault.jpg`} className="w-full rounded mb-1"/>
                                        <span className="text-xs font-semibold">Parte {idx + 1}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                } else if (activeLesson.tipo === 'multipresentacion') {
                    const urls = activeLesson.recurso.split('|');
                    return (
                        <div className="flex w-full h-full flex-col md:flex-row">
                            <iframe src={urls[activeSubIndex]} className="w-full h-full border-none flex-grow bg-white" allowFullScreen></iframe>
                            <div className="w-full md:w-64 bg-slate-800 p-4 overflow-y-auto flex-shrink-0 md:border-l border-white/10 flex md:block gap-2 overflow-x-auto">
                                <h4 className="font-bold mb-4 hidden md:block">Documentos</h4>
                                {urls.map((url, idx) => (
                                    <div key={idx} onClick={() => setActiveSubIndex(idx)} className={`p-3 mb-2 cursor-pointer rounded flex items-center gap-2 flex-shrink-0 md:w-auto transition-colors ${activeSubIndex === idx ? 'bg-brand-accent' : 'bg-slate-700 hover:bg-slate-600'}`}>
                                        <FileText size={16}/>
                                        <span className="text-xs">Documento {idx + 1}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                } else if (activeLesson.tipo === 'enlaces') {
                    return (
                        <div className="w-full h-full overflow-y-auto p-4 md:p-8 bg-slate-50 text-slate-900 absolute inset-0">
                            <h2 className="text-3xl font-bold mb-6">{activeLesson.titulo}</h2>
                            <p className="text-slate-600 mb-8">{activeLesson.descripcion}</p>
                            {activeLesson.secciones?.map((sec, i) => (
                                <div key={i} className="mb-8">
                                    <h3 className="text-xl font-bold mb-4 border-b pb-2">{sec.tituloSeccion}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {sec.links.map((link, j) => (
                                            <a key={j} href={link.url} target="_blank" rel="noreferrer" className="bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition border border-slate-200 block">
                                                <h4 className="font-bold text-brand-accent mb-2 flex items-center gap-2"><ExternalLink size={16} className="flex-shrink-0"/> <span className="truncate">{link.titulo}</span></h4>
                                                <p className="text-sm text-slate-600 line-clamp-2">{link.descripcion}</p>
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                } else if (activeLesson.tipo === 'simulador' || activeLesson.tipo === 'ejercicio' || activeLesson.tipo === 'video') {
                    const src = activeLesson.tipo === 'video' ? `https://www.youtube.com/embed/${activeLesson.recurso}` : activeLesson.recurso;
                    return <iframe src={src} className="w-full h-full border-none bg-white" allowFullScreen></iframe>;
                } else if (activeLesson.tipo === 'quiz') {
                    return (
                        <div className="w-full h-full flex flex-col items-center justify-center p-8 bg-slate-900 text-center overflow-y-auto">
                            <CheckSquare size={64} className="mb-6 text-brand-accent"/>
                            <h2 className="text-3xl font-bold mb-4">{activeLesson.titulo}</h2>
                            <p className="text-slate-400 mb-8 max-w-xl">{activeLesson.descripcion || 'Abre el cuestionario para validar tus conocimientos y registrar el progreso final de este módulo.'}</p>
                            
                            {activeLesson.recurso && (
                                <Button onClick={() => window.open(activeLesson.recurso, '_blank')} className="py-4 px-8 text-lg mb-6">
                                    Realizar Evaluación Externa <ExternalLink size={20} className="ml-2"/>
                                </Button>
                            )}
                            
                            <Button onClick={() => markCompleted(activeLesson.id)} variant="success">
                                {completedLessons[activeLesson.id] ? '✓ Módulo Superado' : 'Marcar como Aprobado'}
                            </Button>
                        </div>
                    );
                }
                
                return <div className="p-8">Recurso interactivo. <a href={activeLesson.recurso} target="_blank" rel="noreferrer" className="text-brand-accent underline">Abrir en nueva pestaña</a></div>;
            };

            return (
                <div className="flex h-[calc(100vh-64px)] overflow-hidden bg-slate-900 text-white relative">
                    
                    {/* Contenido Principal */}
                    <div className="flex-grow flex flex-col relative transition-all duration-300">
                        {/* Header Visor */}
                        <div className="bg-black/40 p-4 flex justify-between items-center border-b border-white/10">
                            <button onClick={onBack} className="flex items-center gap-2 hover:text-brand-accent transition"><ChevronRight className="rotate-180"/> Salir</button>
                            <h2 className="font-bold hidden md:block text-slate-200">{course.title}</h2>
                            <div className="flex items-center gap-3">
                                {activeLesson?.llmLink && (
                                    <a href={activeLesson.llmLink} target="_blank" rel="noreferrer" className="hidden sm:flex bg-purple-600/20 text-purple-400 border border-purple-500/30 px-3 py-1.5 rounded hover:bg-purple-600/40 transition text-sm items-center gap-2 font-semibold">
                                        <Award size={16}/> Notebook LM
                                    </a>
                                )}
                                <button onClick={() => setDrawerOpen(!drawerOpen)} className="bg-brand-accent p-2 rounded hover:bg-blue-600 transition flex items-center gap-2 font-bold shadow-lg">
                                    <Menu size={20}/> <span className="hidden sm:inline">Temario</span>
                                </button>
                            </div>
                        </div>

                        {/* Reproductor / Visor (Ocupa todo el espacio) */}
                        <div className="flex-grow flex flex-col relative overflow-hidden bg-black">
                            {renderLessonContent()}
                        </div>
                    </div>

                    {/* Drawer Lateral Derecho */}
                    <div className={`w-80 bg-brand-premium border-l border-white/10 flex flex-col flex-shrink-0 drawer-transition absolute right-0 top-0 h-full z-20 ${drawerOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="p-4 border-b border-white/10 flex justify-between items-center bg-black/20">
                            <h3 className="font-bold uppercase tracking-wider text-sm text-slate-400">Contenido</h3>
                            <button onClick={() => setDrawerOpen(false)} className="hover:text-white text-slate-500"><X size={20}/></button>
                        </div>
                        <div className="overflow-y-auto flex-grow custom-scrollbar">
                            {course.modulos?.map((mod, i) => (
                                <div key={i} className="border-b border-white/5">
                                    <div className="p-3 bg-white/5 font-bold flex justify-between items-center text-xs text-slate-300 uppercase tracking-wide">
                                        {mod.titulo}
                                    </div>
                                    <div className="flex flex-col">
                                        {mod.lecciones?.map((l, j) => {
                                            if (l.tipo === 'grupo') {
                                                return (
                                                    <div key={j} className="border-l-2 border-brand-accent/30 ml-2 my-1">
                                                        <div className="px-4 py-2 text-xs font-bold text-brand-accent flex items-center gap-2"><FolderIcon/> {l.titulo}</div>
                                                        {l.sublecciones?.map((sub, k) => (
                                                            <button key={k} onClick={() => setActiveLesson(sub)} className={`w-full py-3 px-4 pl-6 text-left transition-all flex gap-3 items-start ${activeLesson?.id === sub.id ? 'bg-white/10 text-white font-semibold' : 'hover:bg-white/5 text-slate-400'}`}>
                                                                <div className="mt-1 flex-shrink-0">
                                                                    {completedLessons[sub.id] ? <CheckCircle size={14} className="text-brand-success"/> : <File size={14}/>}
                                                                </div>
                                                                <span className="text-sm leading-tight">{sub.titulo}</span>
                                                            </button>
                                                        ))}
                                                    </div>
                                                );
                                            }
                                            return (
                                                <button key={j} onClick={() => setActiveLesson(l)} className={`w-full p-4 text-left border-l-4 transition-all flex gap-3 items-start ${activeLesson?.id === l.id ? 'border-brand-accent bg-white/10 text-white font-semibold' : 'border-transparent hover:bg-white/5 text-slate-400'}`}>
                                                    <div className="mt-1 flex-shrink-0">
                                                        {completedLessons[l.id] ? <CheckCircle size={16} className="text-brand-success"/> : l.tipo === 'multivideo' ? <Video size={16}/> : l.tipo === 'quiz' ? <CheckSquare size={16}/> : <File size={16}/>}
                                                    </div>
                                                    <span className="text-sm leading-tight">{l.titulo}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        /* ==========================================
           8. PANEL DE ADMINISTRADOR & MATRÍCULAS
        ========================================== */
        const AdminPanel = () => {
            const [pendings, setPendings] = useState([]);

            useEffect(() => {
                const refP = ref(db, 'enrollments');
                onValue(refP, snap => {
                    const list = [];
                    if(snap.exists()){
                        const users = snap.val();
                        Object.keys(users).forEach(uid => {
                            const courses = users[uid];
                            Object.keys(courses).forEach(cid => {
                                if(courses[cid].status === 'Pendiente') {
                                    list.push({...courses[cid], uid, cid});
                                }
                            });
                        });
                    }
                    setPendings(list);
                });
            }, []);

            const approve = (uid, cid) => {
                update(ref(db, `enrollments/${uid}/${cid}`), { status: 'Aprobado' });
            };

            return (
                <div className="max-w-7xl mx-auto py-12 px-4">
                    <h2 className="text-4xl font-extrabold mb-8 flex items-center gap-4"><Settings className="text-purple-600"/> Panel Técnico</h2>
                    
                    <div className="bg-white rounded-2xl shadow-premium border border-slate-100 p-8">
                        <h3 className="text-2xl font-bold mb-6 border-b pb-4">Aprobación Manual de Pagos (Regla 6)</h3>
                        {pendings.length === 0 ? (
                            <p className="text-slate-500">No hay matrículas pendientes de verificación.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-500">
                                            <th className="p-4 border-b">ID Usuario</th>
                                            <th className="p-4 border-b">Curso</th>
                                            <th className="p-4 border-b">Precio Pagado</th>
                                            <th className="p-4 border-b">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {pendings.map((p, i) => (
                                            <tr key={i} className="hover:bg-slate-50 transition">
                                                <td className="p-4 border-b text-xs font-mono">{p.uid}</td>
                                                <td className="p-4 border-b font-semibold">{p.title}</td>
                                                <td className="p-4 border-b text-brand-success font-bold">${p.pricePaid}</td>
                                                <td className="p-4 border-b">
                                                    <Button onClick={() => approve(p.uid, p.cid)} variant="success" className="py-1 px-3 text-sm">Aprobar Acceso</Button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* ==========================================
           9. MODAL AUTH Y CHATBOT
        ========================================== */
        const AuthModal = ({ onClose }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [pass, setPass] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if(isLogin) await signInWithEmailAndPassword(auth, email, pass);
                    else await createUserWithEmailAndPassword(auth, email, pass);
                    onClose();
                } catch(error) {
                    alert("Error: " + error.message);
                }
            };

            const handleGoogle = async () => {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                    onClose();
                } catch(error) {
                    alert("Error con Google Auth: " + error.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex justify-center items-center p-4">
                    <div className="bg-white rounded-2xl p-8 max-w-sm w-full relative shadow-2xl">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-black"><X/></button>
                        <h2 className="text-2xl font-bold mb-6 text-center">{isLogin ? 'Iniciar Sesión' : 'Crear Cuenta'}</h2>
                        <form onSubmit={handleSubmit} className="space-y-4 mb-4">
                            <div>
                                <label className="block text-sm font-semibold mb-1">Correo Electrónico</label>
                                <input type="email" required className="w-full border p-3 rounded-lg focus:outline-brand-accent bg-slate-50" value={email} onChange={e=>setEmail(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold mb-1">Contraseña</label>
                                <input type="password" required minLength="6" className="w-full border p-3 rounded-lg focus:outline-brand-accent bg-slate-50" value={pass} onChange={e=>setPass(e.target.value)} />
                            </div>
                            <Button className="w-full py-3">{isLogin ? 'Entrar' : 'Registrarse'}</Button>
                        </form>
                        
                        <div className="relative flex py-2 items-center">
                            <div className="flex-grow border-t border-slate-200"></div>
                            <span className="flex-shrink-0 mx-4 text-slate-400 text-sm">o continuar con</span>
                            <div className="flex-grow border-t border-slate-200"></div>
                        </div>

                        <button onClick={handleGoogle} className="w-full mt-2 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5" />
                            Google
                        </button>

                        <p className="text-center mt-6 text-sm text-slate-600">
                            {isLogin ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?'}
                            <button onClick={() => setIsLogin(!isLogin)} className="text-brand-accent font-bold ml-1 hover:underline">
                                {isLogin ? 'Regístrate' : 'Inicia Sesión'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        const ChatbotWidget = () => {
            const [open, setOpen] = useState(false);
            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
                    {open && (
                        <div className="w-80 h-96 bg-white rounded-2xl shadow-premium border border-slate-200 mb-4 flex flex-col overflow-hidden">
                            <div className="bg-brand-premium text-white p-4 font-bold flex justify-between items-center">
                                <span>Asistente IA Educativo</span>
                                <button onClick={() => setOpen(false)}><X size={18}/></button>
                            </div>
                            <div className="flex-grow bg-slate-50 p-4 flex flex-col gap-2 overflow-y-auto text-sm">
                                <div className="bg-white p-3 rounded-xl shadow-sm self-start max-w-[85%] border border-slate-100">
                                    ¡Hola! Soy tu asistente pedagógico alimentado por el modelo generativo global. ¿En qué concepto físico te puedo ayudar hoy?
                                </div>
                            </div>
                            <div className="p-3 border-t bg-white">
                                <input type="text" placeholder="Escribe tu duda..." className="w-full bg-slate-100 p-2 rounded-lg text-sm outline-none" disabled />
                            </div>
                        </div>
                    )}
                    <button onClick={() => setOpen(!open)} className="bg-brand-accent text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform flex items-center justify-center">
                        <MessageSquare size={28} />
                    </button>
                </div>
            );
        };

        // Render Principal
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
