                                    <h1 className="text-3xl sm:text-4xl font-bold text-white mb-2">{course.title}</h1>
                                </div>
                            </div>

                            <div className="p-8 md:p-12 grid md:grid-cols-3 gap-12">
                                <div className="md:col-span-2 space-y-8">
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-900 mb-4">Descripción del Curso</h3>
                                        <p className="text-slate-600 leading-relaxed text-lg">{course.description}</p>
                                    </div>
                                    
                                    {course.data && (
                                        <div>
                                            <h3 className="text-2xl font-bold text-slate-900 mb-6">Temario Detallado (Módulos)</h3>
                                            <div className="space-y-4">
                                                {course.data.modulos.map((mod, i) => (
                                                    <div key={i} className="border border-slate-200 rounded-xl p-5 hover:border-brand-300 transition-colors">
                                                        <h4 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                                            <CheckCircle className="w-5 h-5 text-brand-500" /> {mod.titulo}
                                                        </h4>
                                                        <p className="text-sm text-slate-500 mt-2 ml-7">{mod.lecciones.length} recursos incluidos</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="md:col-span-1">
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 sticky top-24 shadow-md">
                                        <div className="text-3xl font-bold text-slate-900 mb-2">
                                            {course.price === 0 ? 'GRATIS' : `$${course.price}`}
                                        </div>
                                        <ul className="space-y-4 mb-8 text-slate-600 mt-6">
                                            <li className="flex items-center"><Clock className="w-5 h-5 mr-3 text-brand-500" /> Acceso de por vida</li>
                                            <li className="flex items-center"><GraduationCap className="w-5 h-5 mr-3 text-brand-500" /> Certificado al finalizar</li>
                                            <li className="flex items-center"><Activity className="w-5 h-5 mr-3 text-brand-500" /> Simuladores reales</li>
                                        </ul>
                                        <Button onClick={() => setShowCheckout(true)} className="w-full text-lg shadow-brand-500/30">
                                            Matricularme Ahora
                                        </Button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Checkout Modal */}
                    {showCheckout && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl relative">
                                <button onClick={() => setShowCheckout(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <X className="w-6 h-6" />
                                </button>
                                <h2 className="text-2xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                                    <Lock className="w-6 h-6 text-brand-500" /> Checkout Seguro
                                </h2>
                                
                                <div className="bg-slate-50 p-4 rounded-xl mb-6">
                                    <p className="font-semibold text-slate-800">{course.title}</p>
                                    <div className="flex justify-between items-center mt-2 border-t border-slate-200 pt-2">
                                        <span className="text-slate-600">Precio:</span>
                                        <span className={discount > 0 ? "line-through text-slate-400" : "font-bold"}>${course.price}</span>
                                    </div>
                                    {discount > 0 && (
                                        <div className="flex justify-between items-center mt-1 text-green-600 font-bold">
                                            <span>Descuento aplicado:</span>
                                            <span>${finalPrice.toFixed(2)}</span>
                                        </div>
                                    )}
                                </div>

                                {course.price > 0 && (
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-slate-700 mb-2">Cupón de Descuento</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={coupon} 
                                                onChange={e => setCoupon(e.target.value)}
                                                className="flex-grow rounded-lg border-slate-300 border px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none"
                                                placeholder="Ej. PROMO50"
                                            />
                                            <Button variant="secondary" onClick={() => {
                                                if(coupon === 'PROMO50') setDiscount(0.5);
                                                else alert("Cupón inválido");
                                            }}>Aplicar</Button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm mb-8 flex gap-3">
                                    <HelpCircle className="w-5 h-5 flex-shrink-0" />
                                    <p>
                                        {course.price > 0 ? 
                                        "Al hacer clic en Confirmar, tu solicitud quedará en estado PENDIENTE. El administrador verificará el pago." : 
                                        "Este curso es gratuito. El acceso será inmediato tras la confirmación."}
                                    </p>
                                </div>

                                <Button onClick={handleEnroll} className="w-full">
                                    Confirmar Matrícula
                                </Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- NUEVO COMPONENTE: QUIZ NATIVO ---
        const NativeQuiz = ({ lesson, onPass, isCompleted }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => {
                setAnswers({});
                setSubmitted(false);
                setScore(0);
            }, [lesson.id]);

            const handleSubmit = () => {
                let correct = 0;
                lesson.preguntas?.forEach((q, i) => {
                    if (answers[i] === q.correcta) correct++;
                });
                const pct = lesson.preguntas?.length ? (correct / lesson.preguntas.length) * 100 : 0;
                setScore(pct);
                setSubmitted(true);
                if (pct >= 80 && !isCompleted) {
                    onPass();
                }
            };

            if (!lesson.preguntas || lesson.preguntas.length === 0) {
                return <div className="p-8 text-center text-slate-500 bg-slate-50 rounded-xl">Este quiz aún no tiene preguntas configuradas.</div>;
            }

            return (
                <div className="bg-white rounded-xl p-8 border border-slate-200 shadow-sm max-w-4xl mx-auto">
                    <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2"><HelpCircle className="text-brand-500 w-8 h-8"/> {lesson.titulo}</h3>
                    <div className="space-y-8">
                        {lesson.preguntas.map((q, i) => (
                            <div key={i} className="p-6 bg-slate-50 rounded-xl border border-slate-100">
                                <p className="font-bold text-slate-800 mb-4 text-lg">{i+1}. {q.pregunta}</p>
                                <div className="space-y-3">
                                    {q.opciones.map((opt, oIdx) => (
                                        <label key={oIdx} className={`flex items-center gap-3 p-4 rounded-lg border cursor-pointer transition-colors ${answers[i] === oIdx ? 'border-brand-500 bg-brand-50 shadow-sm' : 'border-slate-200 hover:bg-white bg-white'} ${submitted && answers[i] === oIdx && q.correcta !== oIdx ? 'border-red-500 bg-red-50' : ''} ${submitted && q.correcta === oIdx ? 'border-green-500 bg-green-50 ring-2 ring-green-200' : ''}`}>
                                            <input type="radio" disabled={submitted} name={`q-${i}`} checked={answers[i] === oIdx} onChange={() => setAnswers({...answers, [i]: oIdx})} className="w-5 h-5 text-brand-600 focus:ring-brand-500" />
                                            <span className={`${submitted && q.correcta === oIdx ? 'font-bold text-green-700' : 'text-slate-700'}`}>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 pt-6 border-t border-slate-200 flex items-center justify-between flex-wrap gap-4">
                        {submitted ? (
                            <div className={`px-6 py-4 rounded-xl font-bold flex-grow text-center ${score >= 80 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                Tu puntuación: {score.toFixed(0)}% — {score >= 80 ? '¡Aprobado! Progreso guardado.' : 'Necesitas un mínimo de 80% para aprobar.'}
                            </div>
                        ) : (
                            <p className="text-sm text-slate-500 flex-grow font-medium bg-slate-50 p-4 rounded-xl">Por favor, responde a todas las preguntas antes de enviar.</p>
                        )}
                        {!submitted ? (
                            <Button onClick={handleSubmit} disabled={Object.keys(answers).length < lesson.preguntas?.length} className="w-full sm:w-auto">
                                Enviar y Calificar
                            </Button>
                        ) : (
                            score < 80 && <Button variant="outline" onClick={() => { setSubmitted(false); setAnswers({}); }} className="w-full sm:w-auto">Reintentar Quiz</Button>
                        )}
                    </div>
                </div>
            );
        };
        // ------------------------------------

        const CoursePlayer = ({ course, setView }) => {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeLesson, setActiveLesson] = useState(null);
            
            // Lógica de LocalStorage para progreso
            const [progress, setProgress] = useState(() => {
                const saved = localStorage.getItem(`progreso_${course.id}`);
                return saved ? JSON.parse(saved) : {};
            }); 
            
            const [timer, setTimer] = useState(0);
            const [activePartIndex, setActivePartIndex] = useState(0); // Para multivideo/multipresentacion

            // Estado para Menús Colapsables (Acordeón)
            const [openModules, setOpenModules] = useState({ 0: true }); // Módulo 0 abierto por defecto
            const [openGroups, setOpenGroups] = useState({});

            // --- NUEVO: Extractor Inteligente de YouTube (Evita el Error 153) ---
            const extractYouTubeId = (url) => {
                if (!url) return '';
                let cleanUrl = url.trim();
                // Si ya es un ID de 11 caracteres
                if (/^[a-zA-Z0-9_-]{11}$/.test(cleanUrl)) return cleanUrl;
                // Extraer de URL completa
                const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = cleanUrl.match(regExp);
                if (match && match[2].length === 11) return match[2];
                // Fallback por si trae basura pegada (ej: ID&t=10s)
                return cleanUrl.split('&')[0].split('?')[0];
            };

            useEffect(() => {
                if (course && course.data && course.data.modulos[0].lecciones[0]) {
                    setActiveLesson(course.data.modulos[0].lecciones[0]);
                }
            }, [course]);

            useEffect(() => {
                setActivePartIndex(0); // Resetear parte al cambiar de lección
                if (!activeLesson || progress[activeLesson.id]) return;
                setTimer(0);
                const interval = setInterval(() => {
                    setTimer(prev => prev + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, [activeLesson]);

            const markAsCompleted = () => {
                if (timer < 5 && activeLesson.tipo !== 'quiz') {
                    alert("Debes estudiar el material un poco más de tiempo antes de marcarlo como completado.");
                    return;
                }
                const newProgress = {...progress, [activeLesson.id]: true};
                setProgress(newProgress);
                localStorage.setItem(`progreso_${course.id}`, JSON.stringify(newProgress));
                
                // HOOK PARA FIREBASE (Futuro)
                if (window.guardarProgresoNube) window.guardarProgresoNube(activeLesson.id);
            };

            const toggleModule = (index) => setOpenModules(prev => ({...prev, [index]: !prev[index]}));
            const toggleGroup = (id) => setOpenGroups(prev => ({...prev, [id]: !prev[id]}));

            const renderResource = () => {
                if (!activeLesson) return <div className="p-12 text-center text-slate-500">Selecciona una lección del panel derecho.</div>;

                const resolveUrl = (path) => {
                    if (!path) return '';
                    if (path.startsWith('http')) return path;
                    if (path.startsWith('./')) return `https://dudbilopr.github.io/Electromagnetismo/${path.substring(2)}`;
                    return `https://dudbilopr.github.io/Electromagnetismo/${path}`;
                };

                switch (activeLesson.tipo) {
                    case 'multivideo':
                        // Modificado para soportar ID::Titulo
                        const videoParts = activeLesson.recurso.split('|').filter(Boolean).map(part => {
                            const [urlOrId, title] = part.split('::');
                            return { id: extractYouTubeId(urlOrId), title: title || '' };
                        }).filter(v => v.id); // Filtrar vacíos

                        if (videoParts.length === 0) return <div className="p-8 text-center text-slate-500">No hay videos configurados válidos.</div>;

                        const activeVideo = videoParts[activePartIndex] || videoParts[0];

                        return (
                            <div className="space-y-6">
                                <div className="aspect-video bg-black rounded-xl overflow-hidden shadow-xl relative">
                                    <iframe 
                                        className="w-full h-full absolute inset-0" 
                                        src={`https://www.youtube.com/embed/${activeVideo.id}?rel=0`} 
                                        title={activeVideo.title || "Video"} 
                                        frameBorder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowFullScreen>
                                    </iframe>
                                </div>
                                {videoParts.length > 1 && (
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <h4 className="font-bold text-slate-800 mb-3 text-sm uppercase">Lista de Reproducción ({videoParts.length} Partes)</h4>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                            {videoParts.map((part, idx) => (
                                                <button 
                                                    key={idx} onClick={() => setActivePartIndex(idx)}
                                                    className={`relative rounded-lg overflow-hidden border-2 transition-all group flex flex-col text-left ${activePartIndex === idx ? 'border-brand-500 shadow-glow' : 'border-slate-200 hover:border-slate-400'}`}>
                                                    <div className="w-full aspect-video relative bg-slate-100 shrink-0">
                                                        <img src={`https://img.youtube.com/vi/${part.id}/mqdefault.jpg`} className={`w-full h-full object-cover transition-opacity ${activePartIndex === idx ? 'opacity-100' : 'opacity-80 group-hover:opacity-100'}`} alt={part.title || `Parte ${idx+1}`} />
                                                        <div className={`absolute inset-0 flex items-center justify-center transition-colors ${activePartIndex === idx ? 'bg-brand-900/20' : 'bg-black/40 group-hover:bg-black/20'}`}>
                                                            <Play className={`w-8 h-8 ${activePartIndex === idx ? 'text-brand-500 drop-shadow-md' : 'text-white'}`} />
                                                        </div>
                                                    </div>
                                                    <div className="bg-slate-900 text-white text-xs py-2 px-3 font-semibold truncate w-full" title={part.title || `Parte ${idx + 1}`}>
                                                        {part.title || `Parte ${idx + 1}`}
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    case 'multipresentacion':
                        const docs = activeLesson.recurso.split('|');
                        const targetDoc = resolveUrl(docs[activePartIndex]);
                        return (
                            <div className="space-y-4">
                                <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
                                    {docs.map((_, idx) => (
                                        <Button key={idx} variant={activePartIndex === idx ? 'primary' : 'outline'} onClick={() => setActivePartIndex(idx)} className="text-sm px-4 py-2 shrink-0">
                                            Documento {idx + 1}
                                        </Button>
                                    ))}
                                    <a href={targetDoc} target="_blank" rel="noopener noreferrer" className="ml-auto inline-flex items-center text-sm text-brand-600 hover:underline">
                                        Abrir Completo <ChevronRight className="w-4 h-4 ml-1" />
                                    </a>
                                </div>
                                <div className="w-full h-[600px] bg-slate-100 rounded-xl shadow-inner border border-slate-200 overflow-hidden relative">
                                    <iframe src={targetDoc} className="w-full h-full absolute inset-0" title={`Documento ${activePartIndex+1}`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                            </div>
                        );
                    case 'texto':
                        return (
                            <div className="bg-white rounded-xl p-8 sm:p-12 border border-slate-200 shadow-sm max-w-4xl mx-auto">
                                <h3 className="text-3xl font-bold text-slate-800 mb-8 flex items-center gap-3 border-b border-slate-100 pb-4"><FileText className="text-brand-500 w-8 h-8"/> {activeLesson.titulo}</h3>
                                <div className="prose max-w-none text-slate-700 whitespace-pre-wrap leading-relaxed text-lg font-serif">
                                    {activeLesson.contenidoText}
                                </div>
                            </div>
                        );
                    case 'quiz_nativo':
                        return <NativeQuiz lesson={activeLesson} onPass={() => markAsCompleted()} isCompleted={progress[activeLesson.id]} />;
                    case 'simulador':
                    case 'ejercicio':
                    case 'quiz':
                        const targetUrl = resolveUrl(activeLesson.recurso.split('|')[0]);
                        return (
                            <div className="space-y-4">
                                <div className="bg-white rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center border border-slate-200 shadow-sm gap-4">
                                    <div>
                                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                            <Activity className="w-5 h-5 text-brand-500" /> {activeLesson.titulo}
                                        </h3>
                                        <a href={targetUrl} target="_blank" rel="noopener noreferrer" className="text-sm text-brand-600 hover:underline flex items-center mt-1">
                                            Abrir en pestaña nueva <ChevronRight className="w-4 h-4 ml-1" />
                                        </a>
                                    </div>
                                    {activeLesson.tipo === 'quiz' && (
                                        <Button onClick={() => { alert("Quiz Aprobado!"); markAsCompleted(); }} variant="secondary" className="text-sm px-4 py-2 shrink-0">
                                            Simular Aprobación
                                        </Button>
                                    )}
                                </div>
                                <div className="w-full h-[70vh] min-h-[500px] bg-slate-100 rounded-xl shadow-inner border border-slate-200 overflow-hidden relative">
                                    <iframe src={targetUrl} className="w-full h-full absolute inset-0" title={activeLesson.titulo} frameBorder="0" allowFullScreen></iframe>
                                </div>
                            </div>
                        );
                    case 'enlaces':
                        return (
                            <div className="bg-white rounded-xl p-8 border border-slate-200 shadow-sm">
                                <div className="text-center mb-8">
                                    <FileText className="w-16 h-16 text-brand-400 mx-auto mb-4" />
                                    <h3 className="text-2xl font-bold text-slate-700 mb-2">{activeLesson.titulo}</h3>
                                    <p className="text-slate-500">{activeLesson.descripcion}</p>
                                </div>
                                <div className="space-y-8 text-left">
                                    {activeLesson.secciones?.map((sec, idx) => (
                                        <div key={idx}>
                                            <h4 className="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2 mb-4">{sec.tituloSeccion}</h4>
                                            <div className="grid sm:grid-cols-2 gap-4">
                                                {sec.links.map((link, lIdx) => (
                                                    <a key={lIdx} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-start gap-3 p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:shadow-md transition-all group bg-slate-50 hover:bg-white">
                                                        <div className="w-10 h-10 bg-brand-100 rounded-lg flex items-center justify-center shrink-0 group-hover:bg-brand-500 group-hover:text-white transition-colors">
                                                            <FileText className="w-5 h-5 text-brand-600 group-hover:text-white" />
                                                        </div>
                                                        <div>
                                                            <h5 className="font-bold text-slate-800 text-sm mb-1 group-hover:text-brand-600 transition-colors">{link.titulo}</h5>
                                                            <p className="text-xs text-slate-500 leading-relaxed">{link.descripcion}</p>
                                                        </div>
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    default:
                        return <div className="p-8">Contenido interactivo: {activeLesson.titulo}</div>;
                }
            };

            // Cálculo total de progreso
            let totalLessons = 0;
            let completedCount = 0;
            if (course && course.data) {
                course.data.modulos.forEach(mod => {
                    mod.lecciones.forEach(l => {
                        if (l.tipo === 'grupo') {
                            l.sublecciones.forEach(sub => { totalLessons++; if(progress[sub.id]) completedCount++; });
                        } else {
                            totalLessons++; if(progress[l.id]) completedCount++;
                        }
                    });
                });
            }
            const progressPercentage = totalLessons === 0 ? 0 : Math.round((completedCount / totalLessons) * 100);

            if (!course || !course.data) return <div className="p-24 text-center">Datos del curso no disponibles.</div>;

            return (
                <div className="flex h-screen bg-white pt-16">
                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-white shrink-0 shadow-sm z-10">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('dashboard')} className="text-slate-500 hover:text-brand-600 transition-colors">
                                    <ChevronLeft className="w-6 h-6" />
                                </button>
                                <div>
                                    <h1 className="font-bold text-lg text-slate-800 truncate">{course.title}</h1>
                                    <div className="flex items-center gap-2 mt-1">
                                        <div className="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                                            <div className="h-full bg-brand-500" style={{width: `${progressPercentage}%`}}></div>
                                        </div>
                                        <span className="text-xs font-bold text-slate-500">{progressPercentage}%</span>
                                    </div>
                                </div>
                            </div>
                            <Button variant="outline" className="hidden sm:flex text-sm py-2 px-4" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                {sidebarOpen ? 'Ocultar Temario' : 'Ver Temario'}
                            </Button>
                        </header>
                        
                        <div className="flex-1 overflow-auto p-4 sm:p-8 bg-slate-50 relative">
                            <div className="max-w-4xl mx-auto">
                                <div className="mb-6">
                                    <h2 className="text-3xl font-bold text-slate-900 mb-2">{activeLesson?.titulo}</h2>
                                    {activeLesson?.descripcion && <p className="text-slate-600">{activeLesson.descripcion}</p>}
                                </div>
                                
                                {renderResource()}

                                {activeLesson?.tipo !== 'quiz_nativo' && activeLesson?.tipo !== 'quiz' && (
                                    <div className="mt-8 flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div>
                                            <p className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Estado de la Lección</p>
                                            <p className="text-slate-800 font-bold flex items-center gap-2">
                                                {progress[activeLesson?.id] ? <CheckCircle className="text-green-500 w-6 h-6"/> : <Clock className="text-amber-500 w-6 h-6"/>}
                                                {progress[activeLesson?.id] ? 'Completada Exitosamente' : `En curso... (${timer}s)`}
                                            </p>
                                        </div>
                                        {!progress[activeLesson?.id] && (
                                            <Button onClick={markAsCompleted} className={timer < 5 ? 'opacity-50 cursor-not-allowed' : ''} variant={timer < 5 ? 'secondary' : 'primary'}>
                                                Marcar como Completado
                                            </Button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Right Drawer (Moodle-like structure) */}
                    <div className={`${sidebarOpen ? 'w-80' : 'w-0'} shrink-0 bg-white border-l border-slate-200 transition-all duration-300 overflow-y-auto shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.05)]`}>
                        <div className="p-6">
                            <h3 className="font-bold text-lg text-slate-900 mb-6 flex items-center gap-2"><BookOpen className="w-5 h-5 text-brand-500"/> Contenido</h3>
                            <div className="space-y-4">
                                {course.data.modulos.map((mod, i) => (

        const Dashboard = ({ enrollments, setView, currentUser, setCurrentCourse, courses, addReview }) => {
            // Estado para el formulario de reseñas
            const [ratings, setRatings] = useState({ q1: 0, q2: 0, q3: 0 });
            const [comment, setComment] = useState('');

            const handleReviewSubmit = (e) => {
                e.preventDefault();
                if (ratings.q1 === 0 || ratings.q2 === 0 || ratings.q3 === 0) {
                    alert("Por favor, califica las tres preguntas con estrellas antes de enviar.");
                    return;
                }
                const avgRating = (ratings.q1 + ratings.q2 + ratings.q3) / 3;
                addReview({
                    id: Date.now(),
                    user: currentUser.name || currentUser.email.split('@')[0],
                    rating: avgRating,
                    text: comment,
                    date: new Date().toISOString()
                });
                
                alert("Reseña enviada con éxito. ¡Aparecerá en la página principal!");
                // Resetear formulario
                setRatings({ q1: 0, q2: 0, q3: 0 });
                setComment('');

            return (
                <div className="pt-24 pb-16 min-h-screen bg-slate-50">

                                <Button onClick={() => setView('catalog')}>Ir al Catálogo</Button>
                            </div>

                                                        <span className="px-4 py-2 bg-amber-500 text-white font-bold rounded-lg flex items-center gap-2 shadow-lg">
                                                            <Clock className="w-5 h-5"/> Pendiente de Aprobación
                                                        </span>
                                                    </div>

                                                        disabled={!isApproved}

                                                        {isApproved ? 'Ir al Curso' : 'Acceso Bloqueado'}

                                                </div>
                                            </div>
                                        </Card>

                                })}

                        {/* REVIEWS SYSTEM PARA APROBADOS */}

                                    <Star className="w-6 h-6 text-yellow-400 fill-current" /> Deja tu Reseña Profesional
                                </h2>
                                <p className="text-slate-600 mb-6">Como estudiante aprobado, tu opinión construye nuestra reputación.</p>
                                <form className="space-y-6 max-w-2xl" onSubmit={handleReviewSubmit}>
                                    {[
                                        { id: 'q1', label: '1) Claridad del contenido' },
                                        { id: 'q2', label: '2) Utilidad práctica de los simuladores' },
                                        { id: 'q3', label: '3) Calidad del soporte técnico' }
                                    ].map(q => (
                                        <div key={q.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-4 rounded-lg">
                                            <span className="font-semibold text-slate-700 mb-2 sm:mb-0">{q.label}</span>
                                            <div className="flex text-slate-300">
                                                {[1,2,3,4,5].map(star => (
                                                    <Star

                                                        className={`w-8 h-8 cursor-pointer transition-colors ${ratings[q.id] >= star ? 'text-yellow-400 fill-current' : 'text-slate-300 hover:text-yellow-200'}`}

                                            rows="4" 
                                            placeholder="¿Cómo te ha servido este escudo legal?"

                                </form>
                            </div>

        const AdminPanel = ({ enrollments, setEnrollments, courses, setCourses }) => {

            const [showCourseModal, setShowCourseModal] = useState(false);
            const [editingCourse, setEditingCourse] = useState(null);

            // Estado para el Constructor Visual del Currículo
            const [curriculum, setCurriculum] = useState([]);
            
            // Cargar datos al editar
            useEffect(() => {
                if (editingCourse && editingCourse.data && editingCourse.data.modulos) {
                    setCurriculum(editingCourse.data.modulos);
                } else {
                    setCurriculum([]);
                }
            }, [editingCourse]);

            const addModule = () => {
                setCurriculum([...curriculum, { titulo: 'Nuevo Módulo', lecciones: [] }]);
            };

            const updateModuleTitle = (index, value) => {
                const newCurr = [...curriculum];
                newCurr[index].titulo = value;
                setCurriculum(newCurr);
            };

            const deleteModule = (index) => {
                setCurriculum(curriculum.filter((_, i) => i !== index));
            };

            const addLesson = (modIndex) => {
                const newCurr = [...curriculum];
                newCurr[modIndex].lecciones.push({
                    id: `l-${Date.now()}`,
                    titulo: 'Nueva Lección',
                    tipo: 'multivideo',
                    recurso: '',
                    descripcion: ''
                });
                setCurriculum(newCurr);
            };

            const updateLesson = (modIndex, lessIndex, field, value) => {
                const newCurr = [...curriculum];
                newCurr[modIndex].lecciones[lessIndex][field] = value;
                setCurriculum(newCurr);
            };

            const deleteLesson = (modIndex, lessIndex) => {
                const newCurr = [...curriculum];
                newCurr[modIndex].lecciones = newCurr[modIndex].lecciones.filter((_, i) => i !== lessIndex);
                setCurriculum(newCurr);
            };

            // --- Lógica para Nombres Personalizados de Multivideo ---
            const getVideosArray = (recursoStr) => {
                if (!recursoStr) return [];
                return recursoStr.split('|').filter(Boolean).map(v => {
                    const [id, title] = v.split('::');
                    return { id: id || '', title: title || '' };
                });
            };

            const updateVideoPart = (mIdx, lIdx, vIdx, field, value) => {
                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                if(!videos[vIdx]) videos[vIdx] = {id: '', title: ''};
                videos[vIdx][field] = value;
                const newRecurso = videos.map(v => `${v.id}::${v.title}`).join('|');
                updateLesson(mIdx, lIdx, 'recurso', newRecurso);
            };

            const addVideoPart = (mIdx, lIdx) => {
                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                videos.push({id: '', title: ''});
                const newRecurso = videos.map(v => `${v.id}::${v.title}`).join('|');
                updateLesson(mIdx, lIdx, 'recurso', newRecurso);
            };

            const removeVideoPart = (mIdx, lIdx, vIdx) => {
                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                videos.splice(vIdx, 1);
                const newRecurso = videos.map(v => `${v.id}::${v.title}`).join('|');
                updateLesson(mIdx, lIdx, 'recurso', newRecurso);
            };

            // --- Lógica del Builder de Quizzes Nativos ---
            const addQuestion = (mIdx, lIdx) => {
                const newCurr = [...curriculum];
                if (!newCurr[mIdx].lecciones[lIdx].preguntas) newCurr[mIdx].lecciones[lIdx].preguntas = [];
                newCurr[mIdx].lecciones[lIdx].preguntas.push({ pregunta: '', opciones: [''], correcta: 0 });
                setCurriculum(newCurr);
            };

            const updateQuestion = (mIdx, lIdx, qIdx, field, value) => {
                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas[qIdx][field] = value;
                setCurriculum(newCurr);
            };

            const removeQuestion = (mIdx, lIdx, qIdx) => {
                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas = newCurr[mIdx].lecciones[lIdx].preguntas.filter((_, i) => i !== qIdx);
                setCurriculum(newCurr);
            };

            const addOption = (mIdx, lIdx, qIdx) => {
                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].opciones.push('');
                setCurriculum(newCurr);
            };

            const updateOption = (mIdx, lIdx, qIdx, oIdx, value) => {
                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].opciones[oIdx] = value;
                setCurriculum(newCurr);
            };

            const removeOption = (mIdx, lIdx, qIdx, oIdx) => {
                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].opciones = newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].opciones.filter((_, i) => i !== oIdx);
                // Asegurar que el índice de respuesta correcta siga siendo válido
                if (newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].correcta >= oIdx && newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].correcta > 0) {
                    newCurr[mIdx].lecciones[lIdx].preguntas[qIdx].correcta -= 1;
                }
                setCurriculum(newCurr);
            };
            // ----------------------------------------------

            const handleApprove = (index) => {
                const updated = [...enrollments];
                updated[index].status = 'Aprobado';
                setEnrollments(updated);

                    setEnrollments(updated);

            const handleSaveCourse = (e) => {

                const formData = new FormData(e.target);

                    id: editingCourse ? editingCourse.id : `c${Date.now()}`,
                    title: formData.get('title'),
                    type: formData.get('type'),
                    price: parseFloat(formData.get('price')),
                    image: formData.get('image'),
                    description: formData.get('description'),
                    data: { modulos: curriculum }

                if (editingCourse) {
                    setCourses(courses.map(c => c.id === editingCourse.id ? newCourse : c));

                                    <p className="text-slate-600">Gestión técnica y de contenido</p>
                                </div>
                            </div>
                            <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200">
                                <button onClick={() => setActiveTab('enrollments')} className={`px-4 py-2 rounded-md font-semibold text-sm transition-colors ${activeTab === 'enrollments' ? 'bg-brand-50 text-brand-700' : 'text-slate-500 hover:text-slate-800'}`}>Matrículas</button>

                            </div>
                        </div>

                        {activeTab === 'enrollments' && (
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden">

                                </div>
                                <div className="p-0 overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600 text-sm uppercase tracking-wider">
                                                <th className="p-4 font-semibold">Usuario</th>
                                                <th className="p-4 font-semibold">Curso</th>
                                                <th className="p-4 font-semibold">Fecha</th>
                                                <th className="p-4 font-semibold">Estado</th>
                                                <th className="p-4 font-semibold text-right">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {enrollments.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">No hay matrículas en el sistema.</td></tr>}
                                            {enrollments.map((enr, i) => {
                                                const cTitle = courses.find(c => c.id === enr.courseId)?.title || enr.courseId;
                                                return (
                                                    <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                        <td className="p-4 font-medium text-slate-900">{enr.userId}</td>
                                                        <td className="p-4 text-slate-600">{cTitle}</td>

                                                                {enr.status}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-right space-x-2">
                                                            {enr.status === 'Pendiente' && (
                                                                <Button variant="outline" className="px-3 py-1 text-xs border-green-500 text-green-600 hover:bg-green-50" onClick={() => handleApprove(i)}>
                                                                    Aprobar
                                                                </Button>
                                                            )}
                                                            <Button variant="danger" className="px-3 py-1 text-xs" onClick={() => handleDeleteEnrollment(i)}>
                                                                Eliminar
                                                            </Button>
                                                        </td>
                                                    </tr>
                                                )
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'courses' && (
                            <div className="space-y-6">
                                <div className="flex justify-end">
                                    <Button onClick={() => { setEditingCourse(null); setShowCourseModal(true); }} className="shadow-brand-500/30">
                                        + Añadir Nuevo Curso
                                    </Button>
                                </div>
                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {courses.map(course => (
                                        <Card key={course.id} className="flex flex-col">
                                            <div className="relative h-40">
                                                <img src={course.image} className="w-full h-full object-cover" alt={course.title} />
                                                <div className="absolute top-2 right-2 flex gap-2">

                                                        Editar
                                                    </button>
                                                    <button onClick={() => handleDeleteCourse(course.id)} className="bg-red-500/90 p-2 rounded-md shadow hover:bg-red-600 text-white">
                                                        <X className="w-5 h-5" />
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="p-5 flex-grow">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="font-bold text-slate-900">{course.title}</h3>
                                                    <span className="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600">{course.type}</span>
                                                </div>
                                                <p className="text-sm text-slate-500 line-clamp-2 mb-4">{course.description}</p>
                                                <p className="font-bold text-brand-600">${course.price}</p>
                                            </div>
                                        </Card>

                    {/* Curso Modal (Añadir / Editar) */}

                                </div>
                                
                                <form onSubmit={handleSaveCourse} className="p-6 overflow-y-auto flex-grow space-y-6">

                                            <label className="text-sm font-bold text-slate-700">Título del Curso</label>
                                            <input name="title" defaultValue={editingCourse?.title} required className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" />
                                        </div>

                                                    <label className="font-semibold text-slate-700">Rol en la Plataforma</label>
                                                    <select name="role" defaultValue={currentUser.role || (currentUser.email === ADMIN_EMAIL ? 'admin' : 'student')} 
                                                        onChange={(e) => {
                                                            if(e.target.value === 'admin') {
                                                                setCurrentUser({...currentUser, email: ADMIN_EMAIL, role: 'admin'});
                                                                alert('Rol cambiado a Administrador. Tu correo ahora es ' + ADMIN_EMAIL);
                                                            } else if (e.target.value === 'teacher') {
                                                                setCurrentUser({...currentUser, email: 'profesor@demo.com', role: 'teacher'});
                                                                alert('Rol cambiado a Docente.');
                                                            } else {
                                                                setCurrentUser({...currentUser, email: 'estudiante@demo.com', role: 'student'});
                                                                alert('Rol cambiado a Estudiante.');
                                                            }
                                                        }}
                                                        className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50">
                                                        <option value="student">Estudiante</option>
                                                        <option value="teacher">Docente</option>
                                                        <option value="admin">Administrador Técnico</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="space-y-2">
                                                <label className="font-semibold text-slate-700">Biografía / Título Profesional</label>
                                                <input name="bio" defaultValue={currentUser.bio || ''} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej. Ingeniero en Electrónica" />
                                            </div>

                                            <div className="border-t border-slate-200 pt-6">
                                                <h3 className="text-lg font-bold text-slate-800 mb-4">Redes Sociales</h3>
                                                <div className="grid sm:grid-cols-2 gap-6">
                                                    <div className="space-y-2">
                                                        <label className="font-semibold text-slate-700 text-sm">LinkedIn URL</label>
                                                        <input name="linkedin" type="url" defaultValue={currentUser.linkedin || ''} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="https://linkedin.com/in/..." />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="font-semibold text-slate-700 text-sm">Facebook URL</label>
                                                        <input name="facebook" type="url" defaultValue={currentUser.facebook || ''} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="https://facebook.com/..." />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="font-semibold text-slate-700 text-sm">Instagram URL</label>
                                                        <input name="instagram" type="url" defaultValue={currentUser.instagram || ''} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="https://instagram.com/..." />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="font-semibold text-slate-700 text-sm">TikTok URL</label>
                                                        <input name="tiktok" type="url" defaultValue={currentUser.tiktok || ''} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="https://tiktok.com/@..." />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-6 border-t border-slate-200 flex justify-end">
                                                <Button type="submit" className="px-8">Guardar Cambios</Button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {view !== 'player' && <Footer />}
                    <ChatbotWidget />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
