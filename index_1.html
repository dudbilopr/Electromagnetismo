        const CourseDetailView = ({ course, setView, currentUser, setShowAuthModal, reviews }) => {
            const [showCheckout, setShowCheckout] = useState(false);
            const [loading, setLoading] = useState(false);
            const [coupon, setCoupon] = useState('');
            const [discount, setDiscount] = useState(0);

            const finalPrice = Math.max(0, course.price * (1 - discount));
            
            // Calificaciones específicas del curso
            const courseReviews = reviews.filter(r => r.type === 'course' && r.courseId === course.id);
            const avgRating = courseReviews.length > 0 ? (courseReviews.reduce((a,c)=>a+c.rating,0)/courseReviews.length).toFixed(1) : 0;

            const validateCoupon = async () => {
                if(!coupon.trim()) return;
                try {
                    const snap = await getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'coupons', coupon.toUpperCase().trim()));
                    if(snap.exists()) {
                        setDiscount(snap.data().discount);
                        alert(`¡Cupón aplicado! Descuento de ${snap.data().discount * 100}%`);
                    } else {
                        alert("Cupón inválido o inactivo.");
                        setDiscount(0);
                    }
                } catch(e) { console.error(e); }
            };

            const handleEnroll = async () => {
                if (!currentUser) {
                    setShowCheckout(false);
                    setShowAuthModal(true);
                    return;
                }
                setLoading(true);
                try {
                    const status = (course.price === 0 || finalPrice === 0) ? 'Aprobado' : 'Pendiente';
                    
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'enrollments', course.id), {
                        courseId: course.id,
                        status: status,
                        pricePaid: finalPrice,
                        date: new Date().toISOString()
                    });
                    
                    alert(status === 'Pendiente' ? "Matrícula en PENDIENTE. El administrador verificará tu pago." : "Matrícula APROBADA. ¡Bienvenido!");
                    setShowCheckout(false);
                    setView('dashboard');
                } catch(e) {
                    alert("Error al procesar: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            // Para el video destacado en la descripción
            const renderMedia = () => {
                const isVideo = course.image && (course.image.includes('youtube.com') || course.image.includes('youtu.be'));
                if (isVideo) {
                    return <iframe src={`https://www.youtube.com/embed/${extractYouTubeId(course.image)}`} className="w-full aspect-video rounded-2xl shadow-lg border border-slate-200" allowFullScreen></iframe>;
                }
                return <img src={course.image} className="w-full aspect-video object-cover rounded-2xl shadow-lg border border-slate-200" alt="Curso" />;
            };

            return (
                <div className="min-h-screen bg-[#F8FAFC]">
                    {/* Header Dark */}
                    <div className="bg-slate-900 pt-28 pb-32 px-4 sm:px-6 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80')] opacity-10 mix-blend-overlay"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
                        <div className="max-w-6xl mx-auto relative z-10 flex flex-col items-start">
                            <button onClick={() => setView('catalog')} className="flex items-center text-slate-400 hover:text-white font-bold mb-6 transition-colors">
                                <ChevronLeft className="w-5 h-5 mr-1" /> Volver al catálogo
                            </button>
                            <span className="bg-brand-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest mb-4">
                                {course.type.toUpperCase()}
                            </span>
                            <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight max-w-4xl leading-tight">
                                {course.title}
                            </h1>
                            {courseReviews.length > 0 && (
                                <div className="flex items-center gap-2 mt-4 text-yellow-400">
                                    <Star className="w-5 h-5 fill-current"/>
                                    <span className="font-bold text-white text-lg">{avgRating}</span>
                                    <span className="text-slate-400 text-sm">({courseReviews.length} valoraciones del curso)</span>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 -mt-20 relative z-20 pb-24">
                        <div className="grid lg:grid-cols-3 gap-8 items-start">
                            {/* Left Content */}
                            <div className="lg:col-span-2 space-y-10">
                                <div className="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-100">
                                    <h3 className="text-2xl font-extrabold text-slate-900 mb-6 flex items-center gap-3">
                                        <BookOpen className="w-7 h-7 text-brand-600" /> Descripción
                                    </h3>
                                    <div className="mb-8">{renderMedia()}</div>
                                    <p className="text-slate-600 leading-relaxed text-lg font-medium">
                                        {course.description}
                                    </p>
                                </div>

                                {course.data && course.data.modulos && (
                                    <div className="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-100">
                                        <h3 className="text-2xl font-extrabold text-slate-900 mb-6 flex items-center gap-3">
                                            <Folder className="w-7 h-7 text-brand-600" /> Temario del Curso
                                        </h3>
                                        <div className="space-y-4">
                                            {course.data.modulos.map((mod, i) => (
                                                <div key={i} className="border border-slate-200 rounded-2xl p-5 hover:border-brand-300 transition-colors bg-slate-50 flex items-start gap-4">
                                                    <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-brand-600 shadow-sm shrink-0 border border-slate-100">
                                                        {i+1}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-slate-900 text-lg mb-1">{mod.titulo}</h4>
                                                        <p className="text-sm text-slate-500 font-medium">{mod.lecciones.length} Recursos y/o Evaluaciones</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Right Floating Card */}
                            <div className="lg:col-span-1 sticky top-24">
                                <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] text-center">
                                    <p className="text-slate-500 font-bold uppercase tracking-widest text-xs mb-3">INVERSIÓN</p>
                                    <div className={`text-5xl font-extrabold tracking-tighter mb-8 ${course.price === 0 ? 'text-brand-600' : 'text-slate-900'}`}>
                                        {course.price === 0 ? 'GRATIS' : `$${course.price}`}
                                    </div>
                                    <Button onClick={() => setShowCheckout(true)} className="w-full text-lg py-4 shadow-brand-500/40 hover:scale-100 hover:-translate-y-1">
                                        Matricularme Ahora
                                    </Button>
                                    
                                    <div className="mt-8 text-left border-t border-slate-100 pt-6">
                                        <ul className="space-y-4 text-slate-600 font-medium text-sm">
                                            <li className="flex items-center gap-3"><Clock className="w-5 h-5 text-brand-500" /> Acceso vitalicio garantizado</li>
                                            <li className="flex items-center gap-3"><GraduationCap className="w-5 h-5 text-brand-500" /> Certificado de validación</li>
                                            <li className="flex items-center gap-3"><Activity className="w-5 h-5 text-brand-500" /> Simuladores interactivos</li>
                                            <li className="flex items-center gap-3"><Users className="w-5 h-5 text-brand-500" /> Foro de comunidad privado</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Checkout Modal */}
                    {showCheckout && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl relative border border-slate-200">
                                <button onClick={() => setShowCheckout(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-2"><X className="w-5 h-5" /></button>
                                <h2 className="text-2xl font-bold text-slate-900 mb-6 text-center">Checkout Seguro</h2>
                                
                                <div className="bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-100">
                                    <p className="font-bold text-slate-800 text-lg leading-tight mb-4">{course.title}</p>
                                    <div className="flex justify-between items-center mt-3 border-t border-slate-200 pt-4">
                                        <span className="text-slate-500 font-bold">Total a Pagar:</span>
                                        <span className="text-3xl font-extrabold text-brand-600">${finalPrice.toFixed(2)}</span>
                                    </div>
                                </div>

                                {course.price > 0 && (
                                    <div className="mb-6 flex gap-2">
                                        <input 
                                            type="text" value={coupon} onChange={e => setCoupon(e.target.value.toUpperCase())}
                                            placeholder="Código de Descuento" 
                                            className="flex-1 px-4 py-3 border border-slate-300 rounded-xl outline-none focus:border-brand-500 font-bold text-slate-700 uppercase shadow-inner"
                                        />
                                        <Button onClick={validateCoupon} variant="secondary" className="px-5 py-3">Aplicar</Button>
                                    </div>
                                )}

                                <Button onClick={handleEnroll} disabled={loading} className="w-full text-lg py-4 shadow-brand-500/30">
                                    {loading ? 'Procesando...' : 'Confirmar Matrícula'}
                                </Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NativeQuiz = ({ lesson, onPass, isCompleted }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => { setAnswers({}); setSubmitted(false); setScore(0); }, [lesson.id]);

            const handleSubmit = () => {
                let correct = 0;
                lesson.preguntas?.forEach((q, i) => { if (answers[i] === q.correcta) correct++; });
                const pct = lesson.preguntas?.length ? (correct / lesson.preguntas.length) * 100 : 0;
                setScore(pct);
                setSubmitted(true);
                if (pct >= 80 && !isCompleted) onPass();
            };

            if (!lesson.preguntas?.length) return <div className="p-12 text-center text-slate-500 bg-slate-50 rounded-2xl">Sin preguntas configuradas.</div>;

            return (
                <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                    <h3 className="text-3xl font-extrabold text-slate-900 mb-8"><HelpCircle className="text-brand-500 inline w-8 h-8"/> {lesson.titulo}</h3>
                    <div className="space-y-8">
                        {lesson.preguntas.map((q, i) => (
                            <div key={i} className="p-6 bg-slate-50 rounded-xl border border-slate-100">
                                <p className="font-bold text-slate-900 mb-4">{i+1}. {q.pregunta}</p>
                                <div className="space-y-3">
                                    {q.opciones.map((opt, oIdx) => (
                                        <label key={oIdx} className="flex items-center gap-3 p-4 rounded-lg bg-white border border-slate-200 cursor-pointer">
                                            <input type="radio" disabled={submitted} name={`q-${i}`} checked={answers[i] === oIdx} onChange={() => setAnswers({...answers, [i]: oIdx})} className="w-5 h-5 text-brand-600 focus:ring-brand-500" />
                                            <span>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8">
                        {!submitted ? <Button onClick={handleSubmit} className="w-full py-4 text-lg">Enviar y Calificar</Button> : (
                            <div className={`p-4 rounded-xl font-bold text-center ${score >= 80 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>Puntaje: {score.toFixed(0)}%</div>
                        )}
                    </div>
                </div>
            );
        };

        // --- CHAT ESPECÍFICO POR CURSO ---
        const CourseChatWidget = ({ currentUser, courseId, courseTitle }) => {
            const [open, setOpen] = useState(false);
            const [msg, setMsg] = useState('');
            const [messages, setMessages] = useState([]);
            const scrollRef = useRef(null);

            useEffect(() => {
                if(!courseId) return;
                const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', `chat_${courseId}`), snap => {
                    const msgs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.timestamp - b.timestamp);
                    setMessages(msgs);
                });
                return () => unsub();
            }, [courseId]);

            useEffect(() => {
                if(open && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages, open]);

            const sendMsg = async (e) => {
                e.preventDefault();
                if(!msg.trim() || !currentUser) return;
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', `chat_${courseId}`), {
                        text: msg,
                        uid: currentUser.uid,
                        userName: currentUser.name || currentUser.email.split('@')[0],
                        photoURL: currentUser.photoURL || null,
                        timestamp: Date.now()
                    });
                    setMsg('');
                } catch(err) { console.error("Error enviando mensaje: ", err); }
            };

            return (
                <div className="fixed bottom-6 right-6 z-50">
                    {open && (
                        <div className="bg-white w-80 sm:w-96 h-[500px] rounded-3xl shadow-2xl border border-slate-200 flex flex-col mb-4 overflow-hidden animate-in slide-in-from-bottom-5">
                            <div className="bg-slate-900 p-4 text-white flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center">
                                        <Users className="w-5 h-5"/>
                                    </div>
                                    <div className="max-w-[180px] sm:max-w-[220px]">
                                        <span className="font-bold block truncate">Foro del Curso</span>
                                        <span className="text-[10px] text-brand-300 uppercase truncate block" title={courseTitle}>{courseTitle}</span>
                                    </div>
                                </div>
                                <button onClick={() => setOpen(false)}><X className="w-5 h-5"/></button>
                            </div>
                            <div className="flex-1 p-4 bg-slate-50 overflow-y-auto space-y-4" ref={scrollRef}>
                                {messages.length === 0 ? (
                                    <p className="text-center text-slate-400 text-sm mt-4">Foro vacío. ¡Escribe el primer mensaje a tus compañeros!</p>
                                ) : (
                                    messages.map(m => {
                                        const isMe = m.uid === currentUser?.uid;
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <div className={`flex items-end gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'}`}>
                                                    <div className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden shrink-0 shadow-sm border border-white">
                                                        {m.photoURL ? <img src={m.photoURL} className="w-full h-full object-cover" /> : <User className="w-3 h-3 text-slate-500" />}
                                                    </div>
                                                    <div>
                                                        <span className={`text-[10px] font-bold text-slate-400 mb-1 px-1 block ${isMe ? 'text-right' : 'text-left'}`}>{m.userName}</span>
                                                        <div className={`px-4 py-2 rounded-2xl max-w-[200px] sm:max-w-[250px] text-sm font-medium shadow-sm ${isMe ? 'bg-brand-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none'}`}>
                                                            {m.text}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                            <div className="p-4 bg-white border-t border-slate-100">
                                <form className="flex gap-2" onSubmit={sendMsg}>
                                    <input type="text" value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Discute con tu clase..." className="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium" />
                                    <button type="submit" className="bg-slate-900 text-white p-3 rounded-xl hover:bg-brand-600 transition-colors"><Send className="w-4 h-4"/></button>
                                </form>
                            </div>
                        </div>
                    )}
                    <button onClick={() => setOpen(!open)} className="w-auto h-14 px-5 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-premium hover:scale-105 transition-all ml-auto gap-3">
                        {open ? <X className="w-5 h-5"/> : <Users className="w-5 h-5" />}
                        <span className="font-bold hidden sm:inline">{open ? 'Cerrar Foro' : 'Foro del Curso'}</span>
                    </button>
                </div>
            );
        };

        const CoursePlayer = ({ course, setView, currentUser }) => {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeLesson, setActiveLesson] = useState(null);
            const [progress, setProgress] = useState({}); 
            const [timer, setTimer] = useState(0);
            const [activePartIndex, setActivePartIndex] = useState(0);
            const [openModules, setOpenModules] = useState({ 0: true });
            const [openGroups, setOpenGroups] = useState({});

            useEffect(() => {
                if (currentUser && course) {
                    const progRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id);
                    getDoc(progRef).then(snap => {
                        if(snap.exists()) setProgress(snap.data());
                    });
                }
            }, [currentUser, course]);

            useEffect(() => {
                if (course?.data?.modulos[0]?.lecciones[0]) {
                    setActiveLesson(course.data.modulos[0].lecciones[0]);
                }
            }, [course]);

            useEffect(() => {
                setActivePartIndex(0); 
                if (!activeLesson || progress[activeLesson.id]) return;
                setTimer(0);
                const interval = setInterval(() => setTimer(prev => prev + 1), 1000);
                return () => clearInterval(interval);
            }, [activeLesson, progress]);

            const markAsCompleted = async () => {
                if (timer < 5 && activeLesson.tipo !== 'quiz') {
                    alert("Debes estudiar el material al menos 5 segundos antes de completarlo.");
                    return;
                }
                const newProgress = {...progress, [activeLesson.id]: true};
                setProgress(newProgress);
                
                if(currentUser) {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id), newProgress, {merge: true});
                }
            };

            const toggleModule = (index) => setOpenModules(prev => ({...prev, [index]: !prev[index]}));
            const toggleGroup = (id) => setOpenGroups(prev => ({...prev, [id]: !prev[id]}));

            const renderResource = () => {
                if (!activeLesson) return null;
                const resolveUrl = (path) => path.startsWith('http') ? path : `https://dudbilopr.github.io/Electromagnetismo/${path.replace('./','')}`;

                switch (activeLesson.tipo) {
                    case 'multivideo':
                        const videoParts = activeLesson.recurso.split('|').filter(Boolean).map(p => {
                            const [id, t] = p.split('::'); return { id: extractYouTubeId(id), title: t||'' };
                        }).filter(v => v.id);
                        if (videoParts.length === 0) return <div>Sin videos configurados.</div>;
                        const v = videoParts[activePartIndex] || videoParts[0];

                        return (
                            <div className="space-y-6">
                                <div className="aspect-video bg-black rounded-xl overflow-hidden relative shadow-2xl">
                                    <iframe className="w-full h-full absolute inset-0" src={`https://www.youtube.com/embed/${v.id}?rel=0`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                                {videoParts.length > 1 && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-white p-4 rounded-xl border border-slate-200">
                                        {videoParts.map((p, i) => (
                                            <button key={i} onClick={() => setActivePartIndex(i)} className={`border-2 rounded-lg text-sm font-bold p-2 text-left truncate ${activePartIndex === i ? 'border-brand-500 bg-brand-50 text-brand-700' : 'border-slate-200 bg-white hover:border-slate-400'}`}>
                                                Parte {i+1}: {p.title}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    case 'multipresentacion':
                        const docs = activeLesson.recurso.split('|').filter(Boolean);
                        return (
                            <div className="w-full h-[75vh] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-xl">
                                <iframe src={resolveUrl(docs[activePartIndex])} className="w-full h-full" frameBorder="0" allowFullScreen></iframe>
                            </div>
                        );
                    case 'simulador':
                    case 'quiz':
                    case 'ejercicio':
                        return (
                            <div className="w-full h-[80vh] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-xl">
                                <iframe src={resolveUrl(activeLesson.recurso.split('|')[0])} className="w-full h-full bg-white" frameBorder="0" allowFullScreen></iframe>
                            </div>
                        );
                    case 'quiz_nativo':
                        return <NativeQuiz lesson={activeLesson} onPass={markAsCompleted} isCompleted={progress[activeLesson.id]} />;
                    case 'enlaces':
                        return (
                            <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-xl max-w-4xl mx-auto space-y-12">
                                <div className="text-center mb-12 border-b border-slate-100 pb-10">
                                    <div className="w-20 h-20 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-6 transform rotate-3">
                                        <LinkIcon className="w-10 h-10" />
                                    </div>
                                    <h3 className="text-3xl font-extrabold text-slate-900 mb-4">{activeLesson.titulo}</h3>
                                    <p className="text-lg text-slate-600 max-w-2xl mx-auto">{activeLesson.descripcion}</p>
                                </div>
                                {(activeLesson.secciones || []).map((sec, idx) => (
                                    <div key={idx}>
                                        <h4 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2"><Folder className="w-6 h-6 text-slate-400" /> {sec.tituloSeccion}</h4>
                                        <div className="grid sm:grid-cols-2 gap-4">
                                            {(sec.links || []).map((link, lIdx) => (
                                                <a key={lIdx} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-start gap-4 p-5 rounded-2xl border border-slate-200 hover:border-brand-500 hover:shadow-lg transition-all group bg-slate-50 hover:bg-white hover:-translate-y-1">
                                                    <div className="w-12 h-12 bg-white border border-slate-200 rounded-xl flex items-center justify-center shrink-0 group-hover:bg-brand-500 group-hover:border-brand-500 transition-colors shadow-sm">
                                                        <LinkIcon className="w-5 h-5 text-slate-500 group-hover:text-white" />
                                                    </div>
                                                    <div>
                                                        <h5 className="font-bold text-slate-900 text-sm mb-1.5 group-hover:text-brand-600 transition-colors leading-tight">{link.titulo}</h5>
                                                        <p className="text-xs text-slate-500 leading-relaxed font-medium line-clamp-2">{link.descripcion}</p>
                                                    </div>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        );
                    case 'texto':
                        return (
                            <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                                <h3 className="text-3xl font-extrabold text-slate-900 mb-8 border-b border-slate-100 pb-4">{activeLesson.titulo}</h3>
                                <div className="prose max-w-none text-slate-700 whitespace-pre-wrap leading-relaxed text-lg font-serif">
                                    {activeLesson.contenidoText}
                                </div>
                            </div>
                        );
                    default:
                        return <div>Recurso interactivo disponible.</div>;
                }
            };

            const pct = getCourseProgressPct(course?.data, progress);

            return (
                <div className="flex h-screen bg-slate-100 pt-[72px]">
                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-white shadow-sm z-10">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('dashboard')} className="text-slate-500 hover:text-brand-600"><ChevronLeft className="w-6 h-6" /></button>
                                <div>
                                    <h1 className="font-bold text-slate-900">{course.title}</h1>
                                    <p className="text-xs text-brand-600 font-bold">{pct}% completado</p>
                                </div>
                            </div>
                            <Button variant="outline" className="hidden sm:flex py-2 px-4" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                {sidebarOpen ? 'Ocultar Temario' : 'Ver Temario'}
                            </Button>
                        </header>
                        <div className="flex-1 overflow-auto p-4 sm:p-8 bg-slate-50">
                            <div className="max-w-[1400px] mx-auto pb-24">
                                <h2 className="text-3xl font-extrabold mb-6 text-slate-900">{activeLesson?.titulo}</h2>
                                {renderResource()}
                                {activeLesson?.tipo !== 'quiz_nativo' && activeLesson?.tipo !== 'quiz' && (
                                    <div className="mt-8 flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="font-bold text-slate-800">{progress[activeLesson?.id] ? 'Completado' : `En estudio... (${timer}s)`}</p>
                                        {!progress[activeLesson?.id] && (
                                            <Button onClick={markAsCompleted} disabled={timer < 5} className="px-6 py-3">Marcar como Completado</Button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className={`${sidebarOpen ? 'w-[350px]' : 'w-0'} bg-white border-l border-slate-200 overflow-y-auto transition-all duration-300`}>
                        <div className="p-6">
                            <h3 className="font-extrabold text-xl mb-6">Contenido</h3>
                            <div className="space-y-3">
                                {course?.data?.modulos.map((mod, i) => (
                                    <div key={i} className="border border-slate-200 rounded-xl overflow-hidden">
                                        <button onClick={() => toggleModule(i)} className="w-full p-4 bg-slate-50 font-bold text-left text-sm flex justify-between">
                                            {mod.titulo} <ChevronRight className={`w-4 h-4 transition-transform ${openModules[i] ? 'rotate-90' : ''}`} />
                                        </button>
                                        {openModules[i] && (
                                            <div className="p-2 space-y-1">
                                                {mod.lecciones.map((lesson, j) => {
                                                    if (lesson.tipo === 'grupo') {
                                                        const isOpen = openGroups[lesson.titulo];
                                                        return (
                                                            <div key={j} className="mb-2">
                                                                <button onClick={() => toggleGroup(lesson.titulo)} className="w-full px-3 py-2 text-sm font-semibold flex justify-between text-slate-700 bg-slate-100 rounded-md">
                                                                    {lesson.titulo} <ChevronRight className={`w-3 h-3 ${isOpen ? 'rotate-90' : ''}`} />
                                                                </button>
                                                                {isOpen && (
                                                                    <div className="pl-4 mt-1 space-y-1">
                                                                        {lesson.sublecciones.map(sub => (
                                                                            <button key={sub.id} onClick={() => setActiveLesson(sub)} className={`w-full text-left px-3 py-2 rounded-md text-sm flex justify-between ${activeLesson?.id === sub.id ? 'bg-brand-50 text-brand-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                                                                <span className="truncate pr-2">{sub.titulo}</span>
                                                                                {progress[sub.id] && <CheckCircle className="w-4 h-4 text-green-500 shrink-0"/>}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    }
                                                    return (
                                                        <button key={lesson.id} onClick={() => setActiveLesson(lesson)} className={`w-full text-left px-3 py-2.5 rounded-md text-sm flex justify-between ${activeLesson?.id === lesson.id ? 'bg-brand-50 text-brand-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                                            <span className="truncate pr-2">{lesson.titulo}</span> {progress[lesson.id] && <CheckCircle className="w-4 h-4 text-green-500 shrink-0"/>}
                                                        </button>
                                                    )
                                                })}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    {/* Chat del Curso (Privado a matriculados) */}
                    <CourseChatWidget currentUser={currentUser} courseId={course.id} courseTitle={course.title} />
                </div>
            );
        };

        const Dashboard = ({ myEnrollments, setView, currentUser, setCurrentCourse, courses, privateChats }) => {
            const [activeTab, setActiveTab] = useState('courses'); // courses, inbox, reviews
            const [comment, setComment] = useState('');
            const [ratings, setRatings] = useState({ q1: 0, q2: 0, q3: 0 });
            
            // INBOX State
            const [replyMsg, setReplyMsg] = useState('');
            const [selectedUser, setSelectedUser] = useState(null);

            const handlePlatformReviewSubmit = async (e) => {
                e.preventDefault();
                if (ratings.q1 === 0 || ratings.q2 === 0 || ratings.q3 === 0) return alert("Por favor, califica los 3 criterios antes de enviar.");
                const avgRating = (ratings.q1 + ratings.q2 + ratings.q3) / 3;
                
                try {
                    await addDoc(getPublicRef('reviews'), {
                        type: 'platform',
                        user: currentUser.name || currentUser.email.split('@')[0],
                        photoURL: currentUser.photoURL || null,
                        rating: avgRating,
                        text: comment,
                        date: new Date().toISOString()
                    });
                    alert("Reseña de la Plataforma publicada con éxito.");
                    setRatings({q1:0,q2:0,q3:0}); setComment('');
                } catch(err) { alert("Error: "+err.message); }
            };

            const handleCourseReviewSubmit = async (courseId, e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const cRat = { q1: parseInt(fd.get('q1')), q2: parseInt(fd.get('q2')), q3: parseInt(fd.get('q3')) };
                const text = fd.get('text');
                if (cRat.q1 === 0 || cRat.q2 === 0 || cRat.q3 === 0) return alert("Califica los 3 criterios.");
                const avgRating = (cRat.q1 + cRat.q2 + cRat.q3) / 3;
                try {
                    await addDoc(getPublicRef('reviews'), {
                        type: 'course',
                        courseId: courseId,
                        user: currentUser.name || currentUser.email.split('@')[0],
                        photoURL: currentUser.photoURL || null,
                        rating: avgRating,
                        text: text,
                        date: new Date().toISOString()
                    });
                    alert("Reseña del Curso publicada con éxito.");
                    e.target.reset();
                } catch(err) { alert("Error: "+err.message); }
            };

            const sendDirectMessage = async (e) => {
                e.preventDefault();
                if(!replyMsg.trim() || !selectedUser) return;
                try {
                    // Guardamos en un chat global simulando DMs
                    await addDoc(getPublicRef('chat_direct'), {
                        text: replyMsg,
                        senderId: currentUser.uid,
                        senderName: currentUser.name || currentUser.email.split('@')[0],
                        senderPhoto: currentUser.photoURL || null,
                        receiverId: selectedUser.id,
                        receiverName: selectedUser.name,
                        timestamp: Date.now()
                    });
                    setReplyMsg('');
                } catch(err) { console.error(err); }
            };

            // Filtrar mensajes que me pertenecen
            const myDMs = privateChats.filter(m => m.senderId === currentUser.uid || m.receiverId === currentUser.uid);
            
            // Extraer usuarios con los que chateé
            let contactsMap = {};
            myDMs.forEach(m => {
                const otherId = m.senderId === currentUser.uid ? m.receiverId : m.senderId;
                const otherName = m.senderId === currentUser.uid ? m.receiverName : m.senderName;
                const otherPhoto = m.senderId === currentUser.uid ? m.receiverPhoto : m.senderPhoto;
                if(!contactsMap[otherId]) contactsMap[otherId] = { id: otherId, name: otherName, photo: otherPhoto, lastMsg: m };
                else if(m.timestamp > contactsMap[otherId].lastMsg.timestamp) contactsMap[otherId].lastMsg = m;
            });
            const contacts = Object.values(contactsMap).sort((a,b)=>b.lastMsg.timestamp - a.lastMsg.timestamp);

            const approvedCount = myEnrollments.filter(e => e.status === 'Aprobado').length;

            return (
                <div className="pt-24 pb-16 min-h-screen bg-slate-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        {/* Cabecera Dashboard */}
                        <div className="bg-slate-900 rounded-3xl p-8 mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center text-white shadow-xl relative overflow-hidden">
                            <div className="absolute right-0 top-0 w-64 h-64 bg-brand-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                            
                            <div className="relative z-10 flex items-center gap-6 mb-6 sm:mb-0">
                                <div className="w-20 h-20 bg-brand-600 rounded-full flex items-center justify-center text-2xl font-bold shadow-lg border-2 border-slate-700 overflow-hidden shrink-0">
                                    {currentUser.photoURL ? <img src={currentUser.photoURL} className="w-full h-full object-cover" /> : (currentUser.name ? currentUser.name.charAt(0).toUpperCase() : <User className="w-8 h-8"/>)}
                                </div>
                                <div>
                                    <h1 className="text-3xl font-extrabold mb-1">Bienvenido, {currentUser.name || currentUser.email}</h1>
                                    <p className="text-slate-400">Área de trabajo personal.</p>
                                </div>
                            </div>

                            <div className="relative z-10 flex gap-3">
                                {(currentUser.role === 'admin' || currentUser.role === 'teacher') && (
                                    <Button variant="primary" onClick={() => setView('admin')} className="shadow-none bg-brand-600 hover:bg-brand-500"><Shield className="w-4 h-4 mr-2"/> Gestión {currentUser.role === 'teacher' ? 'Docente' : 'Admin'}</Button>
                                )}
                                <Button variant="outline" onClick={() => setView('profile')} className="border-white/20 text-white hover:bg-white hover:text-slate-900 shadow-none">
                                    <User className="w-4 h-4 mr-2" /> Editar Perfil
                                </Button>
                            </div>
                        </div>

                        {/* Redes y Links del Perfil (Si existen) */}
                        {(currentUser.scholar || currentUser.researchgate || currentUser.orcid || currentUser.linkedin || currentUser.github) && (
                            <div className="mb-8 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap gap-3 items-center">
                                <span className="font-bold text-slate-500 text-xs uppercase tracking-wider mr-2">Redes Indexadas:</span>
                                {currentUser.orcid && <a href={currentUser.orcid} target="_blank" className="px-3 py-1 bg-green-50 text-green-700 text-xs font-bold rounded hover:bg-green-100 transition-colors">ORCID</a>}
                                {currentUser.scholar && <a href={currentUser.scholar} target="_blank" className="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded hover:bg-blue-100 transition-colors">Google Scholar</a>}
                                {currentUser.researchgate && <a href={currentUser.researchgate} target="_blank" className="px-3 py-1 bg-teal-50 text-teal-700 text-xs font-bold rounded hover:bg-teal-100 transition-colors">ResearchGate</a>}
                                {currentUser.github && <a href={currentUser.github} target="_blank" className="px-3 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded hover:bg-slate-200 transition-colors">GitHub</a>}
                                {currentUser.linkedin && <a href={currentUser.linkedin} target="_blank" className="px-3 py-1 bg-blue-50 text-[#0A66C2] text-xs font-bold rounded hover:bg-blue-100 transition-colors">LinkedIn</a>}
                            </div>
                        )}

                        {/* Pestañas de Navegación del Dashboard */}
                        <div className="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-8 w-fit mx-auto sm:mx-0">
                            <button onClick={()=>setActiveTab('courses')} className={`px-5 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${activeTab==='courses' ? 'bg-brand-50 text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}><BookOpen className="w-4 h-4"/> Mis Rutas</button>
                            <button onClick={()=>setActiveTab('inbox')} className={`px-5 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${activeTab==='inbox' ? 'bg-brand-50 text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}><Mail className="w-4 h-4"/> Bandeja de Mensajes</button>
                            {approvedCount > 0 && <button onClick={()=>setActiveTab('reviews')} className={`px-5 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${activeTab==='reviews' ? 'bg-brand-50 text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}><Star className="w-4 h-4"/> Evaluar Plataforma</button>}
                        </div>

                        {/* --- TAB MIS CURSOS --- */}
                        {activeTab === 'courses' && (
                            <div>
                                {myEnrollments.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm">
                                        <BookOpen className="w-16 h-16 text-slate-200 mx-auto mb-4" />
                                        <h3 className="text-2xl font-bold text-slate-800 mb-2">No tienes matrículas activas</h3>
                                        <p className="text-slate-500 mb-6">Explora el catálogo y potencia tu carrera.</p>
                                        <Button onClick={() => setView('catalog')} className="px-8">Ir al Catálogo</Button>
                                    </div>
                                ) : (
                                    <div className="grid md:grid-cols-2 gap-8">
                                        {myEnrollments.map((enr, i) => {
                                            const course = courses.find(c => c.id === enr.courseId);
                                            if(!course) return null;
                                            const isApproved = enr.status === 'Aprobado';
                                            return (
                                                <div key={i} className="flex flex-col bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                                                    <div className="h-48 relative overflow-hidden group">
                                                        <img src={course.image} className="w-full h-full object-cover transition-transform group-hover:scale-105" />
                                                        {!isApproved && <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm"><span className="text-amber-400 font-bold bg-white/10 px-4 py-2 rounded-lg border border-amber-400/30">En Verificación</span></div>}
                                                    </div>
                                                    <div className="p-6 flex-grow flex flex-col">
                                                        <h3 className="text-xl font-bold text-slate-900 mb-4">{course.title}</h3>
                                                        <div className="flex gap-2 mt-auto">
                                                            <Button disabled={!isApproved} onClick={() => { setCurrentCourse(course); setView('player'); }} className="flex-grow py-3">
                                                                {isApproved ? 'Ingresar al Entorno' : 'Bloqueado'}
                                                            </Button>
                                                            {isApproved && (
                                                                <button onClick={() => {
                                                                    setActiveTab('inbox');
                                                                    // Autoseleccionar admin por defecto si no tenemos al autor real o enviar a doc general
                                                                    setSelectedUser({id: course.authorId, name: 'Docente del Curso'});
                                                                }} className="bg-slate-100 text-slate-600 px-4 rounded-lg hover:bg-brand-50 hover:text-brand-600 border border-slate-200 flex items-center justify-center font-bold text-sm transition-colors" title="Contactar Docente">
                                                                    <Mail className="w-5 h-5"/>
                                                                </button>
                                                            )}
                                                        </div>
                                                        {/* Calificación Interna de Este Curso (Si está aprobado) */}
                                                        {isApproved && (
                                                            <div className="mt-4 pt-4 border-t border-slate-100">
                                                                <details className="group">
                                                                    <summary className="text-sm font-bold text-slate-500 hover:text-brand-600 cursor-pointer list-none flex items-center justify-between">
                                                                        <span>Calificar este curso a nivel docente</span>
                                                                        <ChevronRight className="w-4 h-4 transform group-open:rotate-90 transition-transform" />
                                                                    </summary>
                                                                    <form onSubmit={(e) => handleCourseReviewSubmit(course.id, e)} className="mt-4 space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                                        <div className="grid grid-cols-3 gap-2">
                                                                            <div>
                                                                                <label className="text-[10px] font-bold text-slate-500 uppercase">1. Claridad</label>
                                                                                <input name="q1" type="number" min="1" max="5" required className="w-full p-1.5 text-xs border rounded" placeholder="1-5" />
                                                                            </div>
                                                                            <div>
                                                                                <label className="text-[10px] font-bold text-slate-500 uppercase">2. Simuladores</label>
                                                                                <input name="q2" type="number" min="1" max="5" required className="w-full p-1.5 text-xs border rounded" placeholder="1-5" />
                                                                            </div>
                                                                            <div>
                                                                                <label className="text-[10px] font-bold text-slate-500 uppercase">3. Soporte</label>
                                                                                <input name="q3" type="number" min="1" max="5" required className="w-full p-1.5 text-xs border rounded" placeholder="1-5" />
                                                                            </div>
                                                                        </div>
                                                                        <textarea name="text" required placeholder="Opinión del docente y material..." className="w-full p-2 text-xs border rounded resize-none" rows="2"></textarea>
                                                                        <Button type="submit" variant="secondary" className="w-full py-2 text-xs">Enviar Calificación Local</Button>
                                                                    </form>
                                                                </details>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* --- TAB BANDEJA DE MENSAJES PRIVADOS --- */}
                        {activeTab === 'inbox' && (
                            <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 flex h-[600px]">
                                {/* Contact List */}
                                <div className="w-1/3 border-r border-slate-200 bg-slate-50 flex flex-col">
                                    <div className="p-4 border-b border-slate-200">
                                        <h3 className="font-bold text-slate-800">Mensajes Directos</h3>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-2 space-y-1">
                                        {contacts.map(c => (
                                            <button key={c.id} onClick={() => setSelectedUser(c)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-colors ${selectedUser?.id === c.id ? 'bg-white shadow-sm border border-slate-200' : 'hover:bg-slate-100 border border-transparent'}`}>
                                                <div className="w-10 h-10 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center font-bold text-lg overflow-hidden shrink-0">
                                                    {c.photo ? <img src={c.photo} className="w-full h-full object-cover" /> : c.name.charAt(0).toUpperCase()}
                                                </div>
                                                <div className="text-left flex-1 min-w-0">
                                                    <p className="font-bold text-sm text-slate-900 truncate">{c.name}</p>
                                                    <p className="text-xs text-slate-500 truncate">{c.lastMsg.text}</p>
                                                </div>
                                            </button>
                                        ))}
                                        {contacts.length === 0 && <p className="text-xs text-slate-400 text-center p-4">No hay conversaciones previas. Si eres estudiante, usa el botón "Contactar" en tu curso.</p>}
                                    </div>
                                </div>
                                {/* Chat Area */}
                                <div className="flex-1 flex flex-col bg-white">
                                    {selectedUser ? (
                                        <>
                                            <div className="p-4 border-b border-slate-200 bg-white flex items-center gap-3 shadow-sm z-10">
                                                <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center overflow-hidden">
                                                    {selectedUser.photo ? <img src={selectedUser.photo} className="w-full h-full object-cover" /> : <User className="w-5 h-5 text-slate-400" />}
                                                </div>
                                                <h3 className="font-bold text-slate-900">{selectedUser.name}</h3>
                                            </div>
                                            <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/50">
                                                {myDMs.filter(m => m.senderId === selectedUser.id || m.receiverId === selectedUser.id).map(m => {
                                                    const isMe = m.senderId === currentUser.uid;
                                                    return (
                                                        <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                            <div className={`px-5 py-3 rounded-2xl max-w-[70%] text-sm shadow-sm ${isMe ? 'bg-brand-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none font-medium'}`}>
                                                                {m.text}
                                                            </div>
                                                            <span className="text-[10px] font-bold text-slate-400 mt-1 px-1">{new Date(m.timestamp).toLocaleTimeString()}</span>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                            <div className="p-4 bg-white border-t border-slate-200">
                                                <form className="flex gap-2" onSubmit={sendDirectMessage}>
                                                    <input type="text" value={replyMsg} onChange={e=>setReplyMsg(e.target.value)} placeholder="Escribe un mensaje al docente/estudiante..." className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium" />
                                                    <button type="submit" className="bg-slate-900 text-white px-5 rounded-xl hover:bg-brand-600 transition-colors font-bold"><Send className="w-5 h-5"/></button>
                                                </form>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                                            <Mail className="w-16 h-16 mb-4 text-slate-200" />
                                            <p className="font-bold">Selecciona una conversación</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- TAB EVALUACIÓN DE PLATAFORMA --- */}
                        {activeTab === 'reviews' && approvedCount > 0 && (
                            <div className="bg-white p-8 sm:p-12 rounded-3xl shadow-xl border border-slate-200 max-w-4xl mx-auto">
                                <h2 className="text-3xl font-extrabold text-slate-900 mb-4 flex items-center gap-3">
                                    <Star className="w-8 h-8 text-yellow-400 fill-current" /> Evaluación Global de la Plataforma
                                </h2>
                                <p className="text-lg text-slate-600 mb-8 font-medium">Ayúdanos a validar physics10.easy. Esta reseña se mostrará públicamente en la página principal.</p>
                                <form onSubmit={handlePlatformReviewSubmit} className="space-y-6">
                                    <div className="space-y-3 bg-slate-50 p-6 md:p-8 rounded-2xl border border-slate-100">
                                        {[
                                            { id: 'q1', label: '1. ¿Consideras rigurosa la metodología didáctica?' },
                                            { id: 'q2', label: '2. ¿Los simuladores fueron vitales para tu aprendizaje?' },
                                            { id: 'q3', label: '3. ¿La plataforma es intuitiva y libre de errores?' }
                                        ].map(q => (
                                            <div key={q.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                <span className="font-bold text-slate-700 text-sm mb-3 sm:mb-0 w-2/3">{q.label}</span>
                                                <div className="flex bg-slate-50 px-2 py-1 rounded-lg">
                                                    {[1,2,3,4,5].map(s => <Star key={s} onClick={() => setRatings({...ratings, [q.id]: s})} className={`w-8 h-8 cursor-pointer transition-transform hover:scale-110 ${ratings[q.id] >= s ? 'text-yellow-400 fill-current drop-shadow-sm' : 'text-slate-300 hover:text-yellow-200'}`} />)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">

        // ==========================================
        // APP PRINCIPAL Y RUTEO

        const App = () => {
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null); 
            
            // Estado Global Sincronizado
            const [courses, setCourses] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [chatMessages, setChatMessages] = useState([]); // Array de General + Privados
            const [privateChats, setPrivateChats] = useState([]); 
            
            // Estado Privado
            const [myEnrollments, setMyEnrollments] = useState([]);
            
            const [currentCourse, setCurrentCourse] = useState(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);

            // Escuchar Estado de Autenticación
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const isSystemAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                        
                        await setDoc(getDirectoryRef(user.uid), { email: user.email, name: user.displayName || user.email.split('@')[0], uid: user.uid, photoURL: user.photoURL || null }, { merge: true });
                        
                        const profSnap = await getDoc(getProfileRef(user.uid));
                        let profData = { name: user.displayName || user.email.split('@')[0], role: isSystemAdmin ? 'admin' : 'student', photoURL: user.photoURL || null };
                        
                        if(profSnap.exists()) profData = { ...profData, ...profSnap.data() };
                        
                        if (isSystemAdmin && profData.role !== 'admin') {
                            profData.role = 'admin';
                            await setDoc(getProfileRef(user.uid), {role: 'admin'}, { merge: true });
                            await setDoc(getDirectoryRef(user.uid), {role: 'admin'}, { merge: true });
                        }

                        setCurrentUser({ uid: user.uid, email: user.email, ...profData });
                        
                        onSnapshot(getPrivateRef(user.uid, 'enrollments'), (snap) => {
                            setMyEnrollments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        });

                    } else {
                        setCurrentUser(null);
                        setMyEnrollments([]);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Escuchar Datos Públicos
            useEffect(() => {
                const unsubCourses = onSnapshot(getPublicRef('courses'), snap => {
                    setCourses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubReviews = onSnapshot(getPublicRef('reviews'), snap => {
                    setReviews(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubChatGeneral = onSnapshot(getPublicRef('chat_general'), snap => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.timestamp-b.timestamp);
                    setChatMessages(msgs);
                });
                const unsubPrivateChat = onSnapshot(getPublicRef('chat_direct'), snap => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.timestamp-b.timestamp);
                    setPrivateChats(msgs);
                });
                return () => { unsubCourses(); unsubReviews(); unsubChatGeneral(); unsubPrivateChat(); };
            }, []);

            const logout = async () => {
                await signOut(auth);
                setView('home');
                setMenuOpen(false);
            };

            const handleProfileUpdate = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                try {
