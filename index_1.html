            if (!url) return '';
            let cleanUrl = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(cleanUrl)) return cleanUrl;
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;

            if (match && match[2].length === 11) return match[2];

        const NativeQuiz = ({ lesson, onPass, isCompleted }) => {
            const [answers, setAnswers] = useState({});

            useEffect(() => { setAnswers({}); setSubmitted(false); setScore(0); }, [lesson.id]);

            const handleSubmit = () => {
                let correct = 0;
                lesson.preguntas?.forEach((q, i) => { if (answers[i] === q.correcta) correct++; });
                const pct = lesson.preguntas?.length ? (correct / lesson.preguntas.length) * 100 : 0;
                setScore(pct);
                setSubmitted(true);
                if (pct >= 80 && !isCompleted) onPass();
            };

            if (!lesson.preguntas?.length) return <div className="p-12 text-center text-slate-500 bg-slate-50 rounded-2xl">Sin preguntas configuradas.</div>;

            return (
                <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                    <h3 className="text-3xl font-extrabold text-slate-900 mb-8"><HelpCircle className="text-brand-500 inline w-8 h-8"/> {lesson.titulo}</h3>
                    <div className="space-y-8">

                            <div key={i} className="p-6 bg-slate-50 rounded-xl border border-slate-100">

                                <div className="space-y-3">
                                    {q.opciones.map((opt, oIdx) => (
                                        <label key={oIdx} className="flex items-center gap-3 p-4 rounded-lg bg-white border border-slate-200 cursor-pointer">
                                            <input type="radio" disabled={submitted} name={`q-${i}`} checked={answers[i] === oIdx} onChange={() => setAnswers({...answers, [i]: oIdx})} className="w-5 h-5 text-brand-600 focus:ring-brand-500" />
                                            <span>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8">
                        {!submitted ? <Button onClick={handleSubmit} className="w-full py-4 text-lg">Enviar y Calificar</Button> : (
                            <div className={`p-4 rounded-xl font-bold text-center ${score >= 80 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>Puntaje: {score.toFixed(0)}%</div>
                        )}

            );
        };

        const CoursePlayer = ({ course, setView, currentUser }) => {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeLesson, setActiveLesson] = useState(null);
            const [progress, setProgress] = useState({}); 
            const [timer, setTimer] = useState(0);
            const [activePartIndex, setActivePartIndex] = useState(0);
            const [openModules, setOpenModules] = useState({ 0: true });
            const [openGroups, setOpenGroups] = useState({});

            useEffect(() => {
                if (currentUser && course) {
                    const progRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id);
                    getDoc(progRef).then(snap => {
                        if(snap.exists()) setProgress(snap.data());
                    });
                }
            }, [currentUser, course]);

            useEffect(() => {
                if (course?.data?.modulos[0]?.lecciones[0]) {
                    setActiveLesson(course.data.modulos[0].lecciones[0]);
                }
            }, [course]);

            useEffect(() => {
                setActivePartIndex(0); 
                if (!activeLesson || progress[activeLesson.id]) return;
                setTimer(0);
                const interval = setInterval(() => setTimer(prev => prev + 1), 1000);
                return () => clearInterval(interval);
            }, [activeLesson, progress]);

            const markAsCompleted = async () => {
                if (timer < 5 && activeLesson.tipo !== 'quiz') {
                    alert("Debes estudiar el material al menos 5 segundos antes de completarlo.");
                    return;
                }
                const newProgress = {...progress, [activeLesson.id]: true};
                setProgress(newProgress);
                
                if(currentUser) {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id), newProgress, {merge: true});
                }
            };

            const toggleModule = (index) => setOpenModules(prev => ({...prev, [index]: !prev[index]}));
            const toggleGroup = (id) => setOpenGroups(prev => ({...prev, [id]: !prev[id]}));

            const renderResource = () => {
                if (!activeLesson) return null;
                const resolveUrl = (path) => path.startsWith('http') ? path : `https://dudbilopr.github.io/Electromagnetismo/${path.replace('./','')}`;

                switch (activeLesson.tipo) {
                    case 'multivideo':
                        const videoParts = activeLesson.recurso.split('|').filter(Boolean).map(p => {
                            const [id, t] = p.split('::'); return { id: extractYouTubeId(id), title: t||'' };
                        }).filter(v => v.id);
                        if (videoParts.length === 0) return <div>Sin videos configurados.</div>;
                        const v = videoParts[activePartIndex] || videoParts[0];

                        return (
                            <div className="space-y-6">
                                <div className="aspect-video bg-black rounded-xl overflow-hidden relative shadow-2xl">
                                    <iframe className="w-full h-full absolute inset-0" src={`https://www.youtube.com/embed/${v.id}?rel=0`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                                {videoParts.length > 1 && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-white p-4 rounded-xl border border-slate-200">
                                        {videoParts.map((p, i) => (
                                            <button key={i} onClick={() => setActivePartIndex(i)} className={`border-2 rounded-lg text-sm font-bold p-2 text-left truncate ${activePartIndex === i ? 'border-brand-500 bg-brand-50 text-brand-700' : 'border-slate-200 bg-white hover:border-slate-400'}`}>
                                                Parte {i+1}: {p.title}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    case 'multipresentacion':
                        const docs = activeLesson.recurso.split('|').filter(Boolean);
                        return (
                            <div className="w-full h-[75vh] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-xl">
                                <iframe src={resolveUrl(docs[activePartIndex])} className="w-full h-full" frameBorder="0" allowFullScreen></iframe>

        const AdminPanel = ({ courses, setCourses }) => {
            const [activeTab, setActiveTab] = useState('courses'); // courses, enrollments, users, coupons
            const [showCourseModal, setShowCourseModal] = useState(false);
            const [editingCourse, setEditingCourse] = useState(null);

            // Estados Administrativos
            const [allEnrollments, setAllEnrollments] = useState([]);
            const [directory, setDirectory] = useState([]);
            const [coupons, setCoupons] = useState([]);

            // Estado Manual Enrollment
            const [enrollForm, setEnrollForm] = useState({ uid: '', courseId: '' });
            
            // Estado Cupones
            const [couponForm, setCouponForm] = useState({ code: '', discount: '' });

            // Estado Builder
            const [curriculum, setCurriculum] = useState([]);

            // Cargar datos pesados (Matrículas y Directorio)
            useEffect(() => {
                if (activeTab === 'enrollments' || activeTab === 'users') {
                    const loadDirAndEnrolls = async () => {
                        const dirSnap = await getDocs(getPublicRef('directory'));
                        const dirData = dirSnap.docs.map(d => ({id: d.id, ...d.data()}));
                        setDirectory(dirData);

                        if(activeTab === 'enrollments') {
                            let all = [];
                            for(const userDoc of dirData) {
                                const enrSnap = await getDocs(getPrivateRef(userDoc.id, 'enrollments'));
                                enrSnap.forEach(e => all.push({ uid: userDoc.id, userName: userDoc.name, id: e.id, ...e.data() }));

                            setAllEnrollments(all);
                        }
                    };
                    loadDirAndEnrolls();
                }
                
                if (activeTab === 'coupons') {
                    const unsubCoup = onSnapshot(getPublicRef('coupons'), snap => {
                        setCoupons(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    return () => unsubCoup();
                }
            }, [activeTab]);

            // --- CURSOS Y BUILDER ---
            useEffect(() => {
                if (editingCourse && editingCourse.data && editingCourse.data.modulos) {
                    setCurriculum(editingCourse.data.modulos);
                } else {
                    setCurriculum([]);
                }
            }, [editingCourse]);

            const handleSaveCourse = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                const newCourse = {
                    id: editingCourse ? editingCourse.id : `c${Date.now()}`,
                    title: formData.get('title'),
                    type: formData.get('type'),
                    price: parseFloat(formData.get('price')),
                    image: formData.get('image'),
                    description: formData.get('description'),
                    data: { modulos: curriculum }
                };

                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'courses', newCourse.id), newCourse);
                    alert("Curso guardado exitosamente en la base de datos.");
                    setShowCourseModal(false);
                    setEditingCourse(null);
                } catch(err) {
                    alert("Error guardando curso: " + err.message);
                }
            };

            const handleDeleteCourse = async (id) => {
                if(confirm('¿Eliminar de Firebase permanentemente? Esta acción es irreversible.')) {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'courses', id));
                }
            };

            // Lógica Builder (Compacta)
            const addModule = () => setCurriculum([...curriculum, { titulo: 'Nuevo Módulo', lecciones: [] }]);
            const updateModuleTitle = (index, value) => { const newCurr = [...curriculum]; newCurr[index].titulo = value; setCurriculum(newCurr); };
            const deleteModule = (index) => setCurriculum(curriculum.filter((_, i) => i !== index));
            const addLesson = (modIndex) => { const newCurr = [...curriculum]; newCurr[modIndex].lecciones.push({ id: `l-${Date.now()}`, titulo: 'Nueva Lección', tipo: 'multivideo', recurso: '', descripcion: '' }); setCurriculum(newCurr); };
            const updateLesson = (modIndex, lessIndex, field, value) => { const newCurr = [...curriculum]; newCurr[modIndex].lecciones[lessIndex][field] = value; setCurriculum(newCurr); };
            const deleteLesson = (modIndex, lessIndex) => { const newCurr = [...curriculum]; newCurr[modIndex].lecciones = newCurr[modIndex].lecciones.filter((_, i) => i !== lessIndex); setCurriculum(newCurr); };
            
            const getVideosArray = (recursoStr) => {
                if (!recursoStr) return [];
                return recursoStr.split('|').filter(Boolean).map(v => {
                    const [id, title] = v.split('::'); return { id: id || '', title: title || '' };
                });
            };
            const updateVideoPart = (mIdx, lIdx, vIdx, field, value) => {
                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                if(!videos[vIdx]) videos[vIdx] = {id: '', title: ''};
                videos[vIdx][field] = value;
                updateLesson(mIdx, lIdx, 'recurso', videos.map(v => `${v.id}::${v.title}`).join('|'));

                                                                    <div className="sm:col-span-2">
                                                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Título de Lección</label>
                                                                        <input value={less.titulo} onChange={(e) => updateLesson(mIdx, lIdx, 'titulo', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg font-bold text-slate-800 focus:border-brand-500 outline-none bg-slate-50" />
                                                                    </div>
                                                                    <div className="sm:col-span-1">
                                                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Tipo Recurso</label>
                                                                        <select value={less.tipo} onChange={(e) => updateLesson(mIdx, lIdx, 'tipo', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg font-bold text-slate-700 bg-slate-50 outline-none">
                                                                            <option value="multivideo">Video/YouTube</option>
                                                                            <option value="multipresentacion">Documentos / PDFs</option>
                                                                            <option value="simulador">Simulador / Embed</option>
                                                                            <option value="texto">Texto Enriquecido</option>
                                                                            <option value="quiz_nativo">Quiz Nativo Interactivo</option>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="bg-slate-50/50 rounded-xl border border-slate-100 p-4">
                                                                    {['multipresentacion', 'simulador'].includes(less.tipo) && (
                                                                        <div>
                                                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1"><LinkIcon className="w-3 h-3"/> Enlace al Recurso (URL o Github)</label>
                                                                            <input value={less.recurso || ''} onChange={(e) => updateLesson(mIdx, lIdx, 'recurso', e.target.value)} className="w-full p-3 border border-slate-200 rounded-lg font-mono text-sm text-brand-700 outline-none bg-white shadow-inner" />
                                                                        </div>
                                                                    )}

                                                                    {less.tipo === 'multivideo' && (
                                                                        <div className="space-y-3">
                                                                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                                                <span className="font-bold text-slate-800 text-xs uppercase flex items-center gap-1"><Youtube className="w-4 h-4 text-red-500"/> Lista Reproducción</span>
                                                                                <Button type="button" variant="outline" onClick={() => addVideoPart(mIdx, lIdx)} className="py-1 px-3 text-xs bg-white">+ Añadir Fragmento</Button>
                                                                            </div>
                                                                            {getVideosArray(less.recurso).map((v, vIdx) => (
                                                                                <div key={vIdx} className="flex flex-col sm:flex-row gap-2 bg-white p-2 rounded-lg border border-slate-200 shadow-sm relative">
                                                                                    <div className="w-6 text-center text-xs font-bold text-slate-400 hidden sm:block mt-2">{vIdx + 1}</div>
                                                                                    <input value={v.id} onChange={e => updateVideoPart(mIdx, lIdx, vIdx, 'id', e.target.value)} placeholder="ID Video (Ej: dQw4w9WgXcQ)" className="flex-1 text-xs p-2 border border-slate-200 rounded outline-none font-mono" />
                                                                                    <input value={v.title} onChange={e => updateVideoPart(mIdx, lIdx, vIdx, 'title', e.target.value)} placeholder="Título fragmento" className="flex-1 text-xs p-2 border border-slate-200 rounded outline-none font-semibold text-slate-700" />
                                                                                    <button type="button" onClick={() => removeVideoPart(mIdx, lIdx, vIdx)} className="p-2 text-slate-400 hover:text-red-500 rounded"><X className="w-4 h-4"/></button>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    )}

                                                                    {less.tipo === 'texto' && (
                                                                        <textarea value={less.contenidoText || ''} onChange={(e) => updateLesson(mIdx, lIdx, 'contenidoText', e.target.value)} className="w-full p-4 border border-slate-200 rounded-xl text-sm outline-none bg-white font-serif leading-relaxed" placeholder="Contenido de lectura..." rows="5" />
                                                                    )}

                                                                    {less.tipo === 'quiz_nativo' && (
                                                                        <div className="space-y-4">
                                                                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                                                <span className="font-extrabold text-slate-800 text-xs uppercase flex items-center gap-1"><HelpCircle className="w-4 h-4 text-brand-500"/> Preguntas</span>
                                                                                <Button type="button" variant="outline" onClick={() => addQuestion(mIdx, lIdx)} className="py-1 px-3 text-xs bg-white">+ Añadir Pregunta</Button>
                                                                            </div>
                                                                            {(less.preguntas || []).map((q, qIdx) => (
                                                                                <div key={qIdx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative space-y-3">
                                                                                    <button type="button" onClick={() => removeQuestion(mIdx, lIdx, qIdx)} className="absolute top-2 right-2 text-slate-400 hover:text-red-500"><X className="w-4 h-4"/></button>
                                                                                    <input value={q.pregunta || ''} onChange={(e) => updateQuestion(mIdx, lIdx, qIdx, 'pregunta', e.target.value)} placeholder="Enunciado" className="w-11/12 text-sm font-bold p-2 border border-slate-200 rounded-lg outline-none bg-slate-50" />
                                                                                    
                                                                                    <div className="pl-3 border-l-2 border-brand-100 space-y-2">
                                                                                        {(q.opciones || []).map((opt, oIdx) => (
                                                                                            <div key={oIdx} className={`flex items-center gap-2 p-1.5 rounded-lg border ${q.correcta === oIdx ? 'border-green-400 bg-green-50' : 'border-slate-100'}`}>
                                                                                                <input type="radio" name={`r-${mIdx}-${lIdx}-${qIdx}`} checked={q.correcta === oIdx} onChange={() => updateQuestion(mIdx, lIdx, qIdx, 'correcta', oIdx)} className="w-4 h-4 text-green-600" />
                                                                                                <input value={opt} onChange={(e) => updateOption(mIdx, lIdx, qIdx, oIdx, e.target.value)} className="flex-grow text-sm p-1 border border-transparent rounded bg-transparent outline-none font-medium" />
                                                                                                <button type="button" onClick={() => removeOption(mIdx, lIdx, qIdx, oIdx)} className="text-red-300 hover:text-red-500 p-1"><X className="w-4 h-4"/></button>
                                                                                            </div>
                                                                                        ))}
                                                                                        <button type="button" onClick={() => addOption(mIdx, lIdx, qIdx)} className="text-xs text-brand-600 font-bold bg-brand-50 px-3 py-1.5 rounded mt-1">+ Opción</button>
                                                                                    </div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        ))}
                                                        
                                                        <Button type="button" variant="outline" onClick={() => addLesson(mIdx)} className="py-2 text-sm w-full mt-2 border-dashed bg-transparent border-slate-300 text-slate-500 hover:border-solid hover:text-brand-600">
                                                            + Incorporar Lección al Módulo
                                                        </Button>
                                                    </div>
                                                </div>
                                            ))}
                                            {curriculum.length === 0 && (
                                                <div className="text-center p-12 border-2 border-dashed border-slate-300 rounded-2xl text-slate-500 font-bold">
                                                    El currículo está vacío. Comienza añadiendo un módulo.
                                                </div>
                                            )}
                                        </div>
                                    </section>

                                    {/* Action Footer Fixed */}
                                    <div className="sticky bottom-0 bg-white py-4 border-t border-slate-200 mt-8 flex justify-end gap-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                                        <Button type="button" variant="outline" onClick={() => setShowCourseModal(false)} className="px-8 bg-white">Cancelar</Button>
                                        <Button type="submit" className="px-10 shadow-brand-500/30 text-lg">Guardar en Firebase</Button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // APP PRINCIPAL Y RUTEO
        // ==========================================
        const App = () => {
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null); 
            
            // Estado Global Sincronizado
            const [courses, setCourses] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [chatMessages, setChatMessages] = useState([]);
            
            // Estado Privado
            const [myEnrollments, setMyEnrollments] = useState([]);
            
            const [currentCourse, setCurrentCourse] = useState(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);

            // Escuchar Estado de Autenticación
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const isSystemAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                        
                        // Actualiza directorio público para listar a todos en el panel admin
                        await setDoc(getDirectoryRef(user.uid), { email: user.email, name: user.displayName || user.email.split('@')[0], uid: user.uid }, { merge: true });
                        
                        // Cargar perfil
                        const profSnap = await getDoc(getProfileRef(user.uid));
                        let profData = { name: user.displayName || user.email.split('@')[0], role: isSystemAdmin ? 'admin' : 'student' };
                        
                        if(profSnap.exists()) profData = { ...profData, ...profSnap.data() };
                        
                        // Forzado de Rol Administrador Maestro
                        if (isSystemAdmin && profData.role !== 'admin') {
                            profData.role = 'admin';
                            await setDoc(getProfileRef(user.uid), {role: 'admin'}, { merge: true });
                            await setDoc(getDirectoryRef(user.uid), {role: 'admin'}, { merge: true });
                        }

                        setCurrentUser({ uid: user.uid, email: user.email, ...profData });
                        
                        // Escuchar matrículas personales
                        onSnapshot(getPrivateRef(user.uid, 'enrollments'), (snap) => {
                            setMyEnrollments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        });

                    } else {
                        setCurrentUser(null);
                        setMyEnrollments([]);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Escuchar Datos Públicos
            useEffect(() => {
                const unsubCourses = onSnapshot(getPublicRef('courses'), snap => {
                    setCourses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubReviews = onSnapshot(getPublicRef('reviews'), snap => {
                    setReviews(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubChat = onSnapshot(getPublicRef('chat_general'), snap => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    msgs.sort((a, b) => a.timestamp - b.timestamp);
                    setChatMessages(msgs);
                });
                return () => { unsubCourses(); unsubReviews(); unsubChat(); };
            }, []);

            const logout = async () => {
                await signOut(auth);
                setView('home');
                setMenuOpen(false);
            };

            const handleProfileUpdate = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                try {
                    const updates = {
                        name: fd.get('name'), bio: fd.get('bio'), linkedin: fd.get('linkedin'),
                        orcid: fd.get('orcid'), scholar: fd.get('scholar'), researchgate: fd.get('researchgate'),
                        github: fd.get('github'), twitter: fd.get('twitter'), instagram: fd.get('instagram'), 
                        youtube: fd.get('youtube'), tiktok: fd.get('tiktok')
                    };
                    await setDoc(getProfileRef(currentUser.uid), updates, { merge: true });
                    await updateDoc(getDirectoryRef(currentUser.uid), { name: fd.get('name') });
                    setCurrentUser({...currentUser, ...updates});
                    alert("Redes y perfil guardados permanentemente en Firestore.");
                    setView('dashboard');
                } catch(err) { alert("Error: " + err.message); }
            };

            const Navbar = () => (
                <nav className="fixed top-0 w-full bg-white/90 backdrop-blur-md z-40 border-b border-slate-200 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-[70px] items-center">
                        <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setView('home')}>
                            <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center transform group-hover:-rotate-6 transition-transform shadow-md"><span className="text-white font-extrabold text-xl font-serif">P</span></div>
                            <span className="font-extrabold text-2xl tracking-tight text-slate-900 hidden sm:block">physics10<span className="text-brand-600">.easy</span></span>
                        </div>
                        <div className="hidden md:flex items-center space-x-8">
                            <button onClick={() => setView('catalog')} className="text-slate-600 font-bold hover:text-brand-600 transition-colors uppercase tracking-wider text-sm">Catálogo</button>
                            {currentUser ? (
                                <>
                                    <button onClick={() => setView('dashboard')} className="text-slate-600 font-bold hover:text-brand-600 flex items-center gap-2 transition-colors uppercase tracking-wider text-sm"><User className="w-4 h-4"/> Workspace</button>
                                    {currentUser.role === 'admin' && (
                                        <button onClick={() => setView('admin')} className="text-white bg-slate-900 font-bold hover:bg-brand-600 flex items-center gap-2 px-4 py-2 rounded-lg shadow-sm transition-colors uppercase tracking-wider text-xs"><Shield className="w-4 h-4"/> Admin</button>
                                    )}
                                    <div className="flex items-center gap-4 border-l-2 border-slate-100 pl-6">
                                        <div className="flex flex-col text-right">
                                            <span className="text-sm font-bold text-slate-900">{currentUser.name}</span>
                                            <span className={`text-[10px] font-extrabold uppercase tracking-widest ${currentUser.role==='admin'?'text-red-500':'text-brand-500'}`}>{currentUser.role}</span>
                                        </div>
                                        <button onClick={logout} title="Cerrar Sesión" className="w-10 h-10 flex items-center justify-center border border-slate-200 rounded-full bg-slate-50 text-slate-400 hover:text-red-500 hover:border-red-200 transition-colors"><LogOut className="w-4 h-4"/></button>
                                    </div>
                                </>
                            ) : (
                                <Button variant="primary" onClick={() => setShowAuthModal(true)} className="px-8 py-2.5 shadow-md">Ingresar al Portal</Button>
                            )}
                        </div>
                        <div className="md:hidden flex items-center">
                            <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 text-slate-600 bg-slate-100 rounded-lg">{menuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}</button>
                        </div>
                    </div>
                </nav>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar />
                    <main className="flex-grow">
                        {view === 'home' && (
                            <>
                                <HeroSection setView={setView} />
                                <CeoSection />
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                                <ReviewsSection reviews={reviews} />
                            </>
                        )}
                        {view === 'catalog' && (
                            <div className="pt-20 pb-16 min-h-screen bg-slate-50">
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                            </div>
                        )}
                        {view === 'courseDetail' && (
                            <CourseDetailView course={currentCourse} setView={setView} currentUser={currentUser} setShowAuthModal={setShowAuthModal} />
                        )}
                        {view === 'dashboard' && currentUser && (
                            <Dashboard myEnrollments={myEnrollments} setView={setView} currentUser={currentUser} setCurrentCourse={setCurrentCourse} courses={courses} />
                        )}
                        {view === 'player' && currentCourse && currentUser && (
                            <CoursePlayer course={currentCourse} setView={setView} currentUser={currentUser} />
                        )}
                        {view === 'admin' && currentUser?.role === 'admin' && (
                            <AdminPanel courses={courses} />
                        )}
                        {view === 'profile' && currentUser && (
                            <div className="pt-24 pb-16 min-h-screen bg-slate-50">
                                <div className="max-w-4xl mx-auto px-4 sm:px-6">
                                    <button onClick={() => setView('dashboard')} className="flex items-center text-slate-500 hover:text-brand-600 mb-8 font-bold transition-colors"><ChevronLeft className="w-5 h-5 mr-1" /> Volver al Workspace</button>
                                    
                                    <div className="bg-white rounded-3xl shadow-2xl p-8 md:p-12 border border-slate-200 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-64 h-64 bg-brand-500/10 rounded-full mix-blend-multiply filter blur-3xl opacity-70 transform translate-x-1/2 -translate-y-1/2"></div>
                                        
                                        <div className="flex items-center gap-6 mb-10 border-b border-slate-100 pb-8 relative z-10">
                                            <div className="w-24 h-24 bg-slate-900 text-white rounded-3xl flex items-center justify-center text-4xl font-bold shadow-xl transform rotate-3">
                                                {currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U'}
                                            </div>
                                            <div>
                                                <h1 className="text-4xl font-extrabold text-slate-900 tracking-tight">Mi Perfil</h1>
                                                <p className="text-slate-500 font-bold mt-1 text-sm bg-slate-100 px-3 py-1 inline-block rounded-full">{currentUser.email}</p>
                                            </div>
                                        </div>

                                        <form onSubmit={handleProfileUpdate} className="space-y-12 relative z-10">
                                            {/* Datos Personales */}
                                            <section>
                                                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><User className="w-5 h-5 text-brand-500"/> Información Básica</h3>
                                                <div className="grid sm:grid-cols-2 gap-6">
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Nombre Público</label>
                                                        <input name="name" defaultValue={currentUser.name} className="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none font-bold text-slate-900 shadow-sm" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Cargo / Biografía Corta</label>
                                                        <input name="bio" defaultValue={currentUser.bio} className="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none font-medium text-slate-700 shadow-sm" placeholder="Ej. Investigador en Física Aplicada" />
                                                    </div>
                                                </div>
                                            </section>

                                            {/* Identidad Científica */}
                                            <section>
                                                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><BookOpen className="w-5 h-5 text-brand-500"/> Identidad Científica / Académica</h3>
                                                <div className="grid sm:grid-cols-3 gap-6">
                                                    <div>
                                                        <label className="text-xs font-bold text-green-600 uppercase tracking-wider mb-2 block">ORCID (URL)</label>
                                                        <input name="orcid" type="url" defaultValue={currentUser.orcid} placeholder="https://orcid.org/..." className="w-full p-3 border border-slate-200 bg-slate-50 rounded-xl focus:ring-2 focus:ring-green-500 outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 block">Google Scholar</label>
                                                        <input name="scholar" type="url" defaultValue={currentUser.scholar} placeholder="https://scholar.google.com/..." className="w-full p-3 border border-slate-200 bg-slate-50 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-teal-600 uppercase tracking-wider mb-2 block">ResearchGate</label>
                                                        <input name="researchgate" type="url" defaultValue={currentUser.researchgate} placeholder="https://researchgate.net/..." className="w-full p-3 border border-slate-200 bg-slate-50 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-mono text-xs" />
                                                    </div>
                                                </div>
                                            </section>

                                            {/* Redes Profesionales y Sociales */}
                                            <section>
                                                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><Network className="w-5 h-5 text-brand-500"/> Presencia Digital</h3>
                                                <div className="grid sm:grid-cols-2 gap-6">
                                                    <div>
                                                        <label className="text-xs font-bold text-[#0A66C2] uppercase tracking-wider mb-2 block">LinkedIn</label>
                                                        <input name="linkedin" type="url" defaultValue={currentUser.linkedin} placeholder="https://linkedin.com/in/..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0A66C2] outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 block">GitHub</label>
                                                        <input name="github" type="url" defaultValue={currentUser.github} placeholder="https://github.com/..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-[#1DA1F2] uppercase tracking-wider mb-2 block">Twitter / X</label>
                                                        <input name="twitter" type="url" defaultValue={currentUser.twitter} placeholder="https://twitter.com/..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#1DA1F2] outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-[#FF0000] uppercase tracking-wider mb-2 block">YouTube</label>
                                                        <input name="youtube" type="url" defaultValue={currentUser.youtube} placeholder="https://youtube.com/..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#FF0000] outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-[#E1306C] uppercase tracking-wider mb-2 block">Instagram</label>
                                                        <input name="instagram" type="url" defaultValue={currentUser.instagram} placeholder="https://instagram.com/..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#E1306C] outline-none font-mono text-xs" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2 block">TikTok</label>
                                                        <input name="tiktok" type="url" defaultValue={currentUser.tiktok} placeholder="https://tiktok.com/@..." className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-900 outline-none font-mono text-xs" />
                                                    </div>
                                                </div>
                                            </section>

                                            <div className="pt-8 border-t border-slate-200 flex justify-end">
                                                <Button type="submit" className="px-10 py-4 shadow-brand-500/40 text-lg w-full sm:w-auto">Actualizar e Indexar Perfil</Button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {view !== 'player' && (
                        <footer className="bg-slate-950 text-slate-400 py-16 border-t border-slate-900">
                            <div className="max-w-7xl mx-auto px-4 text-center">
                                <span className="font-bold text-3xl text-white mb-4 block">physics10<span className="text-brand-500">.easy</span></span>
                                <p className="font-medium max-w-md mx-auto">Tecnología LMS modular integrada al ecosistema Firebase de Google. Ciencia y código puro.</p>
                            </div>
                        </footer>
                    )}
                    
                    <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} />
                    <GroupChatWidget currentUser={currentUser} messages={chatMessages} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
