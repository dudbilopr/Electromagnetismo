        const ReviewsSection = ({ reviews = [] }) => {

            return (

                            <h2 className="text-4xl font-extrabold text-slate-900 mb-6 tracking-tight">Calidad Validada por Estudiantes</h2>
                        </div>
                        {total === 0 ? (

        const CourseDetailView = ({ course, setView, currentUser, setShowAuthModal }) => {
            const [showCheckout, setShowCheckout] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleEnroll = async () => {
                if (!currentUser) {
                    setShowCheckout(false);
                    setShowAuthModal(true);
                    return;
                }
                setLoading(true);
                try {
                    const status = course.price === 0 ? 'Aprobado' : 'Pendiente';
                    // Escribimos en colección privada del usuario (permiso otorgado en reglas)
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'enrollments', course.id), {
                        courseId: course.id,
                        status: status,
                        date: new Date().toISOString()
                    });
                    alert(status === 'Pendiente' ? "Matrícula en PENDIENTE. El administrador verificará tu pago." : "Matrícula APROBADA. ¡Bienvenido!");
                    setShowCheckout(false);

                        <div className="bg-white rounded-[2rem] shadow-2xl overflow-hidden mb-12 border border-slate-200">

                                    <h1 className="text-4xl sm:text-5xl font-extrabold text-white mb-4 tracking-tight leading-tight">{course.title}</h1>
                                </div>
                            </div>
                            <div className="p-8 md:p-12 grid lg:grid-cols-3 gap-16">
                                <div className="lg:col-span-2 space-y-12">
                                    <section>
                                        <h3 className="text-2xl font-extrabold text-slate-900 mb-6 flex items-center gap-3"><BookOpen className="w-7 h-7 text-brand-500" /> Descripción</h3>
                                        <p className="text-slate-600 leading-relaxed text-lg">{course.description}</p>
                                    </section>
                                </div>
                                <div className="lg:col-span-1">
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 sticky top-28 shadow-xl">
                                        <div className="text-center border-b border-slate-100 pb-8 mb-8">
                                            <p className="text-slate-500 font-bold uppercase tracking-wider text-sm mb-2">Inversión</p>
                                            <div className="text-5xl font-extrabold text-slate-900 tracking-tight">
                                                {course.price === 0 ? <span className="text-brand-600">GRATIS</span> : `$${course.price}`}
                                            </div>
                                        </div>
                                        <Button onClick={() => setShowCheckout(true)} className="w-full text-lg py-4 shadow-brand-500/30">Matricularme Ahora</Button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {showCheckout && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl relative border border-slate-200">
                                <button onClick={() => setShowCheckout(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-2"><X className="w-5 h-5" /></button>
                                <h2 className="text-2xl font-bold text-slate-900 mb-6 text-center">Checkout Seguro</h2>
                                <Button onClick={handleEnroll} disabled={loading} className="w-full text-lg py-4">{loading ? 'Procesando...' : 'Confirmar Matrícula'}</Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NativeQuiz = ({ lesson, onPass, isCompleted }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => { setAnswers({}); setSubmitted(false); setScore(0); }, [lesson.id]);

            const handleSubmit = () => {
                let correct = 0;
                lesson.preguntas?.forEach((q, i) => { if (answers[i] === q.correcta) correct++; });
                const pct = lesson.preguntas?.length ? (correct / lesson.preguntas.length) * 100 : 0;
                setScore(pct);
                setSubmitted(true);
                if (pct >= 80 && !isCompleted) onPass();
            };

            if (!lesson.preguntas?.length) return <div className="p-12 text-center text-slate-500 bg-slate-50 rounded-2xl">Sin preguntas.</div>;

            return (
                <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                    <h3 className="text-3xl font-extrabold text-slate-900 mb-8"><HelpCircle className="text-brand-500 inline w-8 h-8"/> {lesson.titulo}</h3>
                    <div className="space-y-8">
                        {lesson.preguntas.map((q, i) => (
                            <div key={i} className="p-6 bg-slate-50 rounded-xl border border-slate-100">
                                <p className="font-bold text-slate-900 mb-4">{i+1}. {q.pregunta}</p>
                                <div className="space-y-3">
                                    {q.opciones.map((opt, oIdx) => (
                                        <label key={oIdx} className="flex items-center gap-3 p-4 rounded-lg bg-white border border-slate-200 cursor-pointer">
                                            <input type="radio" disabled={submitted} name={`q-${i}`} checked={answers[i] === oIdx} onChange={() => setAnswers({...answers, [i]: oIdx})} className="w-5 h-5 text-brand-600 focus:ring-brand-500" />
                                            <span>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8">
                        {!submitted ? <Button onClick={handleSubmit} className="w-full py-4 text-lg">Enviar</Button> : (
                            <div className={`p-4 rounded-xl font-bold text-center ${score >= 80 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>Puntaje: {score.toFixed(0)}%</div>
                        )}
                    </div>
                </div>
            );
        };

        const CoursePlayer = ({ course, setView, currentUser }) => {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeLesson, setActiveLesson] = useState(null);
            const [progress, setProgress] = useState({}); 
            const [timer, setTimer] = useState(0);
            const [activePartIndex, setActivePartIndex] = useState(0);
            const [openModules, setOpenModules] = useState({ 0: true });
            const [openGroups, setOpenGroups] = useState({});

            // Cargar progreso de Firestore en lugar de LocalStorage
            useEffect(() => {
                if (currentUser && course) {
                    const progRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id);
                    getDoc(progRef).then(snap => {
                        if(snap.exists()) setProgress(snap.data());
                    });
                }
            }, [currentUser, course]);

            useEffect(() => {
                if (course?.data?.modulos[0]?.lecciones[0]) {
                    setActiveLesson(course.data.modulos[0].lecciones[0]);
                }
            }, [course]);

            useEffect(() => {
                setActivePartIndex(0); 
                if (!activeLesson || progress[activeLesson.id]) return;
                setTimer(0);
                const interval = setInterval(() => setTimer(prev => prev + 1), 1000);
                return () => clearInterval(interval);
            }, [activeLesson, progress]);

            const markAsCompleted = async () => {
                if (timer < 5 && activeLesson.tipo !== 'quiz') {
                    alert("Debes estudiar el material al menos 5 segundos antes de completarlo.");
                    return;
                }
                const newProgress = {...progress, [activeLesson.id]: true};
                setProgress(newProgress);
                
                // Guardar progreso en Firestore privado
                if(currentUser) {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'progress', course.id), newProgress, {merge: true});
                }
            };

            const toggleModule = (index) => setOpenModules(prev => ({...prev, [index]: !prev[index]}));
            const toggleGroup = (id) => setOpenGroups(prev => ({...prev, [id]: !prev[id]}));

            const renderResource = () => {
                if (!activeLesson) return null;
                const resolveUrl = (path) => path.startsWith('http') ? path : `https://dudbilopr.github.io/Electromagnetismo/${path.replace('./','')}`;

                switch (activeLesson.tipo) {
                    case 'multivideo':
                        const videoParts = activeLesson.recurso.split('|').filter(Boolean).map(p => {
                            const [id, t] = p.split('::'); return { id: extractYouTubeId(id), title: t||'' };
                        }).filter(v => v.id);
                        if (videoParts.length === 0) return <div>Sin videos configurados.</div>;
                        const v = videoParts[activePartIndex] || videoParts[0];

                        return (
                            <div className="space-y-6">
                                <div className="aspect-video bg-black rounded-xl overflow-hidden relative">
                                    <iframe className="w-full h-full absolute inset-0" src={`https://www.youtube.com/embed/${v.id}?rel=0`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                                {videoParts.length > 1 && (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        {videoParts.map((p, i) => (
                                            <button key={i} onClick={() => setActivePartIndex(i)} className={`border-2 rounded-lg text-sm font-bold p-2 ${activePartIndex === i ? 'border-brand-500 bg-brand-50' : 'border-slate-200 bg-white'}`}>
                                                Parte {i+1}: {p.title}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    case 'multipresentacion':
                        const docs = activeLesson.recurso.split('|').filter(Boolean);
                        return (
                            <div className="w-full h-[75vh] bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
                                <iframe src={resolveUrl(docs[activePartIndex])} className="w-full h-full" frameBorder="0" allowFullScreen></iframe>
                            </div>
                        );
                    case 'simulador':
                    case 'quiz':
                        return (
                            <div className="w-full h-[80vh] bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
                                <iframe src={resolveUrl(activeLesson.recurso.split('|')[0])} className="w-full h-full bg-white" frameBorder="0" allowFullScreen></iframe>
                            </div>
                        );
                    case 'quiz_nativo':
                        return <NativeQuiz lesson={activeLesson} onPass={markAsCompleted} isCompleted={progress[activeLesson.id]} />;
                    default:
                        return <div>Recurso interactivo disponible.</div>;
                }
            };

            let totalLessons = 0; let completedCount = 0;
            if (course?.data) {
                course.data.modulos.forEach(mod => mod.lecciones.forEach(l => {
                    if (l.tipo === 'grupo') { l.sublecciones.forEach(sub => { totalLessons++; if(progress[sub.id]) completedCount++; }); }
                    else { totalLessons++; if(progress[l.id]) completedCount++; }
                }));
            }
            const pct = totalLessons === 0 ? 0 : Math.round((completedCount / totalLessons) * 100);

            return (
                <div className="flex h-screen bg-slate-100 pt-[72px]">
                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-white">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('dashboard')} className="text-slate-500 hover:text-brand-600"><ChevronLeft className="w-6 h-6" /></button>
                                <div>
                                    <h1 className="font-bold text-slate-900">{course.title}</h1>
                                    <p className="text-xs text-brand-600 font-bold">{pct}% completado</p>
                                </div>
                            </div>
                            <Button variant="outline" className="hidden sm:flex py-2 px-4" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                {sidebarOpen ? 'Ocultar Temario' : 'Ver Temario'}
                            </Button>
                        </header>
                        <div className="flex-1 overflow-auto p-4 sm:p-8 bg-slate-50">
                            <div className="max-w-[1400px] mx-auto">
                                <h2 className="text-3xl font-extrabold mb-6 text-slate-900">{activeLesson?.titulo}</h2>
                                {renderResource()}
                                {activeLesson?.tipo !== 'quiz_nativo' && activeLesson?.tipo !== 'quiz' && (
                                    <div className="mt-8 flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="font-bold text-slate-800">{progress[activeLesson?.id] ? 'Completado' : `En estudio... (${timer}s)`}</p>
                                        {!progress[activeLesson?.id] && (
                                            <Button onClick={markAsCompleted} disabled={timer < 5} className="px-6 py-3">Marcar como Completado</Button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className={`${sidebarOpen ? 'w-[350px]' : 'w-0'} bg-white border-l border-slate-200 overflow-y-auto transition-all duration-300`}>
                        <div className="p-6">
                            <h3 className="font-extrabold text-xl mb-6">Contenido</h3>
                            <div className="space-y-3">
                                {course?.data?.modulos.map((mod, i) => (
                                    <div key={i} className="border border-slate-200 rounded-xl overflow-hidden">
                                        <button onClick={() => toggleModule(i)} className="w-full p-4 bg-slate-50 font-bold text-left text-sm flex justify-between">
                                            {mod.titulo} <ChevronRight className={`w-4 h-4 transition-transform ${openModules[i] ? 'rotate-90' : ''}`} />
                                        </button>
                                        {openModules[i] && (
                                            <div className="p-2 space-y-1">
                                                {mod.lecciones.map((lesson, j) => {
                                                    if (lesson.tipo === 'grupo') {
                                                        const isOpen = openGroups[lesson.titulo];
                                                        return (
                                                            <div key={j} className="mb-2">
                                                                <button onClick={() => toggleGroup(lesson.titulo)} className="w-full px-3 py-2 text-sm font-semibold flex justify-between text-slate-700 bg-slate-100 rounded-md">
                                                                    {lesson.titulo} <ChevronRight className={`w-3 h-3 ${isOpen ? 'rotate-90' : ''}`} />
                                                                </button>
                                                                {isOpen && (
                                                                    <div className="pl-4 mt-1 space-y-1">
                                                                        {lesson.sublecciones.map(sub => (
                                                                            <button key={sub.id} onClick={() => setActiveLesson(sub)} className={`w-full text-left px-3 py-2 rounded-md text-sm flex justify-between ${activeLesson?.id === sub.id ? 'bg-brand-50 text-brand-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                                                                {sub.titulo} {progress[sub.id] && <CheckCircle className="w-4 h-4 text-green-500"/>}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    }
                                                    return (
                                                        <button key={lesson.id} onClick={() => setActiveLesson(lesson)} className={`w-full text-left px-3 py-2.5 rounded-md text-sm flex justify-between ${activeLesson?.id === lesson.id ? 'bg-brand-50 text-brand-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                                            <span className="truncate pr-2">{lesson.titulo}</span> {progress[lesson.id] && <CheckCircle className="w-4 h-4 text-green-500"/>}
                                                        </button>
                                                    )
                                                })}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ myEnrollments, setView, currentUser, setCurrentCourse, courses }) => {
            const [comment, setComment] = useState('');
            const [ratings, setRatings] = useState({ q1: 0, q2: 0, q3: 0 });

            const handleReviewSubmit = async (e) => {
                e.preventDefault();
                if (ratings.q1 === 0) return alert("Califica antes de enviar.");
                const avgRating = (ratings.q1 + ratings.q2 + ratings.q3) / 3;
                
                try {
                    await addDoc(getPublicRef('reviews'), {
                        user: currentUser.name || currentUser.email.split('@')[0],
                        rating: avgRating,
                        text: comment,
                        date: new Date().toISOString()
                    });
                    alert("Reseña publicada.");
                    setRatings({q1:0,q2:0,q3:0}); setComment('');
                } catch(err) { alert("Error: "+err.message); }
            };

            const approvedCount = myEnrollments.filter(e => e.status === 'Aprobado').length;

            return (
                <div className="pt-24 pb-16 min-h-screen bg-slate-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="bg-slate-900 rounded-3xl p-8 mb-12 flex justify-between items-center text-white">
                            <div>
                                <h1 className="text-3xl font-extrabold mb-2">Bienvenido, {currentUser.name || currentUser.email}</h1>
                                <p className="text-slate-400">Área de trabajo personal.</p>
                            </div>
                            <Button variant="outline" onClick={() => setView('profile')} className="border-white/20 text-white hover:bg-white hover:text-slate-900">
                                Mi Perfil
                            </Button>
                        </div>

                        <h2 className="text-2xl font-extrabold text-slate-900 mb-8"><BookOpen className="inline w-6 h-6 text-brand-500"/> Mis Rutas</h2>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {myEnrollments.map((enr, i) => {
                                const course = courses.find(c => c.id === enr.courseId);
                                if(!course) return null;
                                const isApproved = enr.status === 'Aprobado';
                                return (
                                    <Card key={i} className={`flex flex-col relative ${!isApproved ? 'opacity-80' : ''}`}>
                                        <div className="h-48 relative overflow-hidden">
                                            <img src={course.image} className="w-full h-full object-cover" />
                                            {!isApproved && <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm"><span className="text-amber-400 font-bold bg-white/10 px-4 py-2 rounded-lg">En Verificación</span></div>}
                                        </div>
                                        <div className="p-6 flex-grow flex flex-col">
                                            <h3 className="text-xl font-bold text-slate-900 mb-4">{course.title}</h3>
                                            <Button disabled={!isApproved} onClick={() => { setCurrentCourse(course); setView('player'); }} className="mt-auto w-full py-3">
                                                {isApproved ? 'Ingresar al Entorno' : 'Bloqueado'}
                                            </Button>
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>

                        {approvedCount > 0 && (
                            <div className="mt-16 bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
                                <h2 className="text-2xl font-extrabold text-slate-900 mb-6"><Star className="inline w-6 h-6 text-yellow-400 fill-current" /> Publicar Reseña</h2>
                                <form onSubmit={handleReviewSubmit} className="space-y-6 max-w-2xl">
                                    <div className="bg-slate-50 p-4 rounded-xl flex items-center justify-between">
                                        <span className="font-bold text-slate-700">Calificación General</span>
                                        <div className="flex">
                                            {[1,2,3,4,5].map(s => <Star key={s} onClick={() => setRatings({...ratings, q1: s, q2: s, q3: s})} className={`w-8 h-8 cursor-pointer ${ratings.q1 >= s ? 'text-yellow-400 fill-current' : 'text-slate-300'}`} />)}
                                        </div>
                                    </div>
                                    <textarea value={comment} onChange={e => setComment(e.target.value)} required rows="4" className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none font-medium" placeholder="Escribe tu opinión aquí..."></textarea>
                                    <Button type="submit" className="w-full py-4">Publicar</Button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- FORO GLOBAL / GRUPO CHAT ---
        const GroupChatWidget = ({ currentUser, messages }) => {
            const [open, setOpen] = useState(false);
            const [msg, setMsg] = useState('');
            const scrollRef = useRef(null);

            useEffect(() => {
                if(open && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages, open]);

            const sendMsg = async (e) => {
                e.preventDefault();
                if(!msg.trim() || !currentUser) return;
                try {
                    await addDoc(getPublicRef('chat_general'), {
                        text: msg,
                        uid: currentUser.uid,
                        userName: currentUser.name || currentUser.email.split('@')[0],
                        timestamp: Date.now()
                    });
                    setMsg('');
                } catch(err) { console.error("Error enviando mensaje: ", err); }
            };

            return (
                <div className="fixed bottom-6 right-6 z-50">
                    {open && (
                        <div className="bg-white w-80 sm:w-96 h-[500px] rounded-3xl shadow-2xl border border-slate-200 flex flex-col mb-4 overflow-hidden animate-in slide-in-from-bottom-5">
                            <div className="bg-slate-900 p-5 text-white flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center">
                                        <MessageCircle className="w-5 h-5"/>
                                    </div>
                                    <div>
                                        <span className="font-bold block">Foro Comunidad</span>
                                        <span className="text-[10px] text-brand-300 uppercase">Chat Global en Vivo</span>
                                    </div>
                                </div>
                                <button onClick={() => setOpen(false)}><X className="w-5 h-5"/></button>
                            </div>
                            <div className="flex-1 p-4 bg-slate-50 overflow-y-auto space-y-4" ref={scrollRef}>
                                {messages.length === 0 ? (
                                    <p className="text-center text-slate-400 text-sm mt-4">Sé el primero en saludar.</p>
                                ) : (
                                    messages.map(m => {
                                        const isMe = m.uid === currentUser?.uid;
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <span className="text-[10px] font-bold text-slate-400 mb-1 px-1">{m.userName}</span>
                                                <div className={`px-4 py-2 rounded-2xl max-w-[85%] text-sm font-medium shadow-sm ${isMe ? 'bg-brand-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none'}`}>
                                                    {m.text}
                                                </div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                            <div className="p-4 bg-white border-t border-slate-100">
                                {currentUser ? (
                                    <form className="flex gap-2" onSubmit={sendMsg}>
                                        <input type="text" value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Escribe un mensaje..." className="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" />
                                        <button type="submit" className="bg-slate-900 text-white p-3 rounded-xl hover:bg-brand-600 transition-colors"><Send className="w-4 h-4"/></button>
                                    </form>
                                ) : (
                                    <p className="text-center text-xs text-red-500 font-bold">Inicia sesión para participar en el foro.</p>
                                )}
                            </div>
                        </div>
                    )}
                    <button onClick={() => setOpen(!open)} className="w-16 h-16 rounded-full bg-brand-600 text-white flex items-center justify-center shadow-premium hover:scale-110 ml-auto border-2 border-brand-400">
                        {open ? <X className="w-8 h-8"/> : <MessageCircle className="w-8 h-8" />}
                    </button>
                </div>
            );
        };

        const AdminPanel = ({ allEnrollments, courses, setCourses }) => {
            const [activeTab, setActiveTab] = useState('courses'); 

            // Cursos Demos a BD real
            const handleInitDatabase = async () => {
                if(confirm("¿Inyectar cursos por defecto en Firebase?")) {
                    for(const c of INITIAL_COURSES) {
                        await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'courses', c.id), c);
                    }
                    alert("Cursos inyectados correctamente.");
                }
            };

            const handleApprove = async (uid, enrId) => {
                try {
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'enrollments', enrId), { status: 'Aprobado' });
                } catch(e) { alert("Error: " + e.message); }
            };

            const handleDeleteCourse = async (id) => {
                if(confirm('¿Eliminar de Firebase permanentemente?')) {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'courses', id));
                }
            };

            return (
                <div className="pt-24 pb-16 min-h-screen bg-slate-100">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-extrabold text-slate-900 flex items-center gap-3"><Shield className="text-brand-600 w-10 h-10"/> Centro de Comando Admin</h1>
                            <div className="bg-white rounded-lg p-1 shadow-sm border border-slate-200 flex">
                                <button onClick={() => setActiveTab('courses')} className={`px-4 py-2 font-bold text-sm rounded-md ${activeTab==='courses' ? 'bg-slate-100 text-slate-900' : 'text-slate-500'}`}>Cursos</button>
                                <button onClick={() => setActiveTab('enrollments')} className={`px-4 py-2 font-bold text-sm rounded-md ${activeTab==='enrollments' ? 'bg-slate-100 text-slate-900' : 'text-slate-500'}`}>Matrículas (Auditoría)</button>
                            </div>
                        </div>

                        {activeTab === 'courses' && (
                            <div className="space-y-6">
                                {courses.length === 0 && (
                                    <div className="bg-amber-50 border border-amber-200 p-8 rounded-3xl text-center">
                                        <h3 className="text-xl font-bold text-amber-800 mb-4">La base de datos de cursos está vacía</h3>
                                        <Button onClick={handleInitDatabase} className="shadow-lg">Inicializar Cursos Demo</Button>
                                    </div>
                                )}
                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {courses.map(course => (
                                        <Card key={course.id}>
                                            <div className="relative h-40">
                                                <img src={course.image} className="w-full h-full object-cover" alt="" />
                                                <button onClick={() => handleDeleteCourse(course.id)} className="absolute top-2 right-2 bg-red-500 p-2 rounded-lg text-white"><X className="w-4 h-4" /></button>
                                            </div>
                                            <div className="p-5">
                                                <h3 className="font-bold text-slate-900 mb-2 truncate">{course.title}</h3>
                                                <p className="font-bold text-brand-600">${course.price}</p>
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'enrollments' && (
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-500 text-sm font-bold border-b border-slate-200">
                                            <th className="p-4">Estudiante (UID)</th>
                                            <th className="p-4">ID Curso</th>
                                            <th className="p-4">Estado</th>
                                            <th className="p-4 text-right">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {allEnrollments.map((enr, i) => (
                                            <tr key={i} className="hover:bg-slate-50">
                                                <td className="p-4 font-mono text-xs text-slate-600">{enr.uid}</td>
                                                <td className="p-4 font-bold text-slate-800">{enr.courseId}</td>
                                                <td className="p-4"><span className={`px-3 py-1 text-xs font-bold rounded-full ${enr.status==='Aprobado'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}>{enr.status}</span></td>
                                                <td className="p-4 text-right">
                                                    {enr.status === 'Pendiente' && <Button onClick={() => handleApprove(enr.uid, enr.id)} className="px-3 py-1 text-xs">Aprobar Pago</Button>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // APP PRINCIPAL
        // ==========================================
        const App = () => {
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null); 
            
            // Estado Global Sincronizado con Firestore
            const [courses, setCourses] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [chatMessages, setChatMessages] = useState([]);
            
            // Estado Privado
            const [myEnrollments, setMyEnrollments] = useState([]);
            const [adminAllEnrollments, setAdminAllEnrollments] = useState([]);
            
            const [currentCourse, setCurrentCourse] = useState(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);

            // 1. Escuchar Estado de Autenticación
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const isSystemAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                        
                        // Actualiza directorio público para que Admin lo vea
                        await setDoc(getDirectoryRef(user.uid), { email: user.email, name: user.displayName || user.email.split('@')[0], uid: user.uid }, { merge: true });
                        
                        // Perfil de Firestore
                        const profSnap = await getDoc(getProfileRef(user.uid));
                        let profData = { name: user.displayName || user.email.split('@')[0], role: isSystemAdmin ? 'admin' : 'student' };
                        if(profSnap.exists()) profData = { ...profData, ...profSnap.data() };
                        else await setDoc(getProfileRef(user.uid), profData);
                        
                        setCurrentUser({ uid: user.uid, email: user.email, ...profData });
                        
                        // Escuchar matrículas personales
                        onSnapshot(getPrivateRef(user.uid, 'enrollments'), (snap) => {
                            setMyEnrollments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        });

                    } else {
                        setCurrentUser(null);
                        setMyEnrollments([]);
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Escuchar Datos Públicos Globales
            useEffect(() => {
                const unsubCourses = onSnapshot(getPublicRef('courses'), snap => {
                    setCourses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubReviews = onSnapshot(getPublicRef('reviews'), snap => {
                    setReviews(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubChat = onSnapshot(getPublicRef('chat_general'), snap => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    msgs.sort((a, b) => a.timestamp - b.timestamp); // Orden local para evitar error de índice
                    setChatMessages(msgs);
                });
                return () => { unsubCourses(); unsubReviews(); unsubChat(); };
            }, []);

            // 3. Admin: Cargar todas las matrículas para auditar (Escaneo de directorio)
            useEffect(() => {
                if(currentUser?.role === 'admin' && view === 'admin') {
                    const loadAll = async () => {
                        const dirSnap = await getDocs(getPublicRef('directory'));
                        let all = [];
                        for(const doc of dirSnap.docs) {
                            const uid = doc.id;
                            const enrSnap = await getDocs(getPrivateRef(uid, 'enrollments'));
                            enrSnap.forEach(e => all.push({ uid, id: e.id, ...e.data() }));
                        }
                        setAdminAllEnrollments(all);
                    };
                    loadAll();
                }
            }, [currentUser, view]);

            const logout = async () => {
                await signOut(auth);
                setView('home');
                setMenuOpen(false);
            };

            const handleProfileUpdate = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                try {
                    await updateDoc(getProfileRef(currentUser.uid), {
                        name: formData.get('name'),
                        bio: formData.get('bio'),
                        linkedin: formData.get('linkedin')
                    });
                    // También actualiza directorio
                    await updateDoc(getDirectoryRef(currentUser.uid), { name: formData.get('name') });
                    alert("Perfil guardado permanentemente en Firestore.");
                } catch(err) { alert("Error: " + err.message); }
            };

            const Navbar = () => (
                <nav className="fixed top-0 w-full bg-white/90 backdrop-blur-md z-40 border-b border-slate-200 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center"><span className="text-white font-bold text-lg">P</span></div>
                            <span className="font-bold text-xl text-slate-900">physics10<span className="text-brand-600">.easy</span></span>
                        </div>
                        <div className="hidden md:flex items-center space-x-8">
                            <button onClick={() => setView('catalog')} className="text-slate-600 font-bold hover:text-brand-600">Catálogo</button>
                            {currentUser ? (
                                <>
                                    <button onClick={() => setView('dashboard')} className="text-slate-600 font-bold hover:text-brand-600 flex items-center gap-1"><User className="w-4 h-4"/> Workspace</button>
                                    {currentUser.role === 'admin' && (
                                        <button onClick={() => setView('admin')} className="text-red-600 font-bold hover:text-red-700 flex items-center gap-1"><Shield className="w-4 h-4"/> Admin Panel</button>
                                    )}
                                    <div className="flex items-center gap-4 border-l border-slate-200 pl-4">
                                        <span className="text-sm font-bold text-slate-800 bg-slate-100 px-3 py-1 rounded-full">{currentUser.name}</span>
                                        <button onClick={logout} className="text-sm text-red-500 font-bold hover:text-red-700">Salir</button>
                                    </div>
                                </>
                            ) : (
                                <Button variant="primary" onClick={() => setShowAuthModal(true)} className="px-6 py-2 shadow-md">Ingresar al Portal</Button>
                            )}
                        </div>
                    </div>
                </nav>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar />
                    <main className="flex-grow">
                        {view === 'home' && (
                            <>
                                <HeroSection setView={setView} />
                                <CeoSection />
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                                <ReviewsSection reviews={reviews} />
                            </>
                        )}
                        {view === 'catalog' && (
                            <div className="pt-24 pb-16 min-h-screen bg-slate-50">
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                            </div>
                        )}
                        {view === 'courseDetail' && (
                            <CourseDetailView course={currentCourse} setView={setView} currentUser={currentUser} setShowAuthModal={setShowAuthModal} />
                        )}
                        {view === 'dashboard' && currentUser && (
                            <Dashboard myEnrollments={myEnrollments} setView={setView} currentUser={currentUser} setCurrentCourse={setCurrentCourse} courses={courses} />
                        )}
                        {view === 'player' && currentCourse && currentUser && (
                            <CoursePlayer course={currentCourse} setView={setView} currentUser={currentUser} />
                        )}
                        {view === 'admin' && currentUser?.role === 'admin' && (
                            <AdminPanel allEnrollments={adminAllEnrollments} courses={courses} />
                        )}
                        {view === 'profile' && currentUser && (
                            <div className="pt-24 pb-16 min-h-screen bg-slate-50">
                                <div className="max-w-3xl mx-auto px-4 sm:px-6">
                                    <button onClick={() => setView('dashboard')} className="flex items-center text-slate-500 hover:text-brand-600 mb-8 font-bold"><ChevronLeft className="w-5 h-5 mr-1" /> Volver</button>
                                    <div className="bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-slate-100">
                                        <h1 className="text-3xl font-extrabold text-slate-900 mb-2">Mi Perfil</h1>
                                        <p className="text-slate-500 font-bold mb-8">Base de Datos Firestore: Activa</p>
                                        <form onSubmit={handleProfileUpdate} className="space-y-6">
                                            <div>
                                                <label className="font-bold text-slate-700">Nombre Público</label>
                                                <input name="name" defaultValue={currentUser.name} className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none font-bold" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700">Cargo / Biografía</label>
                                                <input name="bio" defaultValue={currentUser.bio} className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700">LinkedIn URL</label>
                                                <input name="linkedin" defaultValue={currentUser.linkedin} className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none font-mono text-sm" />
                                            </div>
                                            <Button type="submit" className="w-full py-4 text-lg">Actualizar Perfil Real</Button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {view !== 'player' && (
                        <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 text-center">
                            <span className="font-bold text-2xl text-white mb-2 block">physics10<span className="text-brand-500">.easy</span></span>
                            <p>Plataforma EdTech conectada 100% a Firebase Realtime.</p>
                        </footer>
                    )}
                    
                    <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} />
                    <GroupChatWidget currentUser={currentUser} messages={chatMessages} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
