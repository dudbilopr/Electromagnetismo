                                        {course.price > 0 ? 
                                        "Al confirmar, tu solicitud quedará PENDIENTE. Envía el comprobante al WhatsApp para habilitar tu acceso." : 
                                        "Este curso es gratuito. El acceso será inmediato tras la confirmación."}
                                    </p>
                                </div>

                                <Button onClick={handleEnroll} className="w-full text-lg py-4">
                                    Confirmar Matrícula
                                </Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENTE QUIZ NATIVO ---
        const NativeQuiz = ({ lesson, onPass, isCompleted }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => {
                setAnswers({});
                setSubmitted(false);
                setScore(0);
            }, [lesson.id]);

            const handleSubmit = () => {
                let correct = 0;
                lesson.preguntas?.forEach((q, i) => {
                    if (answers[i] === q.correcta) correct++;
                });
                const pct = lesson.preguntas?.length ? (correct / lesson.preguntas.length) * 100 : 0;
                setScore(pct);
                setSubmitted(true);
                if (pct >= 80 && !isCompleted) onPass();
            };

            if (!lesson.preguntas || lesson.preguntas.length === 0) {
                return <div className="p-12 text-center text-slate-500 bg-slate-50 rounded-2xl border border-slate-200">Este quiz aún no tiene preguntas configuradas por el docente.</div>;
            }

            return (
                <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                    <h3 className="text-3xl font-extrabold text-slate-900 mb-8 flex items-center gap-3 border-b border-slate-100 pb-6">
                        <HelpCircle className="text-brand-500 w-10 h-10"/> {lesson.titulo}
                    </h3>
                    <div className="space-y-10">
                        {lesson.preguntas.map((q, i) => (
                            <div key={i} className="p-8 bg-slate-50 rounded-2xl border border-slate-100 relative">
                                <span className="absolute -top-4 -left-4 w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold shadow-lg">{i+1}</span>
                                <p className="font-bold text-slate-900 mb-6 text-xl pl-4">{q.pregunta}</p>
                                <div className="space-y-4">
                                    {q.opciones.map((opt, oIdx) => (
                                        <label key={oIdx} className={`flex items-center gap-4 p-5 rounded-xl border-2 cursor-pointer transition-all ${answers[i] === oIdx ? 'border-brand-500 bg-brand-50 shadow-md' : 'border-slate-200 hover:border-slate-300 bg-white'} ${submitted && answers[i] === oIdx && q.correcta !== oIdx ? 'border-red-500 bg-red-50' : ''} ${submitted && q.correcta === oIdx ? 'border-green-500 bg-green-50 ring-4 ring-green-100' : ''}`}>
                                            <input type="radio" disabled={submitted} name={`q-${i}`} checked={answers[i] === oIdx} onChange={() => setAnswers({...answers, [i]: oIdx})} className="w-6 h-6 text-brand-600 focus:ring-brand-500 accent-brand-600" />
                                            <span className={`text-lg font-medium ${submitted && q.correcta === oIdx ? 'text-green-800 font-bold' : 'text-slate-700'}`}>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-12 pt-8 border-t border-slate-200 flex flex-col items-center gap-6">
                        {submitted ? (
                            <div className={`w-full p-6 rounded-2xl font-bold text-center text-lg shadow-sm border ${score >= 80 ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                Tu puntuación final: {score.toFixed(0)}% <br/>
                                <span className="text-sm font-medium mt-2 block">{score >= 80 ? '¡Aprobado! Tu progreso ha sido guardado.' : 'Necesitas un mínimo de 80% para aprobar. Repasa la teoría.'}</span>
                            </div>
                        ) : (
                            <p className="text-slate-500 font-medium text-center bg-slate-100 px-6 py-3 rounded-full">Responde a todas las preguntas para habilitar el envío.</p>
                        )}
                        {!submitted ? (
                            <Button onClick={handleSubmit} disabled={Object.keys(answers).length < lesson.preguntas?.length} className="w-full max-w-md py-4 text-lg">
                                Enviar Respuestas y Calificar
                            </Button>
                        ) : (
                            score < 80 && <Button variant="outline" onClick={() => { setSubmitted(false); setAnswers({}); }} className="w-full max-w-md py-4">Reintentar Evaluación</Button>
                        )}
                    </div>
                </div>
            );
        };

        const CoursePlayer = ({ course, setView, currentUser }) => {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeLesson, setActiveLesson] = useState(null);
            
            // Progreso en LocalStorage (En prod: Firestore)
            const [progress, setProgress] = useState(() => {
                const saved = localStorage.getItem(`progreso_${currentUser.uid}_${course.id}`);
                return saved ? JSON.parse(saved) : {};
            }); 
            
            const [timer, setTimer] = useState(0);
            const [activePartIndex, setActivePartIndex] = useState(0);

            // Acordeón Sidebar
            const [openModules, setOpenModules] = useState({ 0: true }); 
            const [openGroups, setOpenGroups] = useState({});

            // Extractor YouTube Avanzado (Maneja ID::Titulo)
            const getVideosData = (recursoStr) => {
                if (!recursoStr) return [];
                return recursoStr.split('|').filter(Boolean).map(part => {
                    const [urlOrId, title] = part.split('::');
                    return { id: extractYouTubeId(urlOrId), title: title || 'Video Interactivo' };
                }).filter(v => v.id);
            };

            useEffect(() => {
                if (course && course.data && course.data.modulos[0] && course.data.modulos[0].lecciones[0]) {
                    setActiveLesson(course.data.modulos[0].lecciones[0]);
                }
            }, [course]);

            useEffect(() => {
                setActivePartIndex(0); 
                if (!activeLesson || progress[activeLesson.id]) return;
                setTimer(0);
                const interval = setInterval(() => {
                    setTimer(prev => prev + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, [activeLesson]);

            const markAsCompleted = () => {
                const REQUIRED_TIME = 10; // Segundos mínimos para simular estudio real
                if (timer < REQUIRED_TIME && activeLesson.tipo !== 'quiz') {
                    alert(`Debes estudiar este material al menos ${REQUIRED_TIME} segundos antes de completarlo.`);
                    return;
                }
                const newProgress = {...progress, [activeLesson.id]: true};
                setProgress(newProgress);
                localStorage.setItem(`progreso_${currentUser.uid}_${course.id}`, JSON.stringify(newProgress));
            };

            const toggleModule = (index) => setOpenModules(prev => ({...prev, [index]: !prev[index]}));
            const toggleGroup = (id) => setOpenGroups(prev => ({...prev, [id]: !prev[id]}));

            const renderResource = () => {
                if (!activeLesson) return null;

                switch (activeLesson.tipo) {
                    case 'multivideo':
                        const videos = getVideosData(activeLesson.recurso);
                        if (videos.length === 0) return <div className="p-8 text-center text-slate-500 bg-slate-100 rounded-2xl">No hay videos válidos configurados.</div>;
                        const activeVideo = videos[activePartIndex] || videos[0];

                        return (
                            <div className="space-y-8">
                                <div className="aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl relative border border-slate-800 group">
                                    <iframe 
                                        className="w-full h-full absolute inset-0" 
                                        src={`https://www.youtube.com/embed/${activeVideo.id}?rel=0&modestbranding=1&showinfo=0`} 
                                        title={activeVideo.title} 
                                        frameBorder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowFullScreen>
                                    </iframe>
                                </div>
                                
                                {videos.length > 1 && (
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                        <h4 className="font-extrabold text-slate-900 mb-6 flex items-center gap-2">
                                            <Video className="w-5 h-5 text-brand-500" /> Lista de Reproducción de la Lección
                                        </h4>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                            {videos.map((part, idx) => (
                                                <button 
                                                    key={idx} onClick={() => setActivePartIndex(idx)}
                                                    className={`relative rounded-xl overflow-hidden border-2 transition-all group flex flex-col text-left ${activePartIndex === idx ? 'border-brand-500 shadow-[0_0_15px_rgba(20,184,166,0.2)]' : 'border-slate-200 hover:border-slate-400'}`}>
                                                    <div className="w-full aspect-video relative bg-slate-900 shrink-0">
                                                        <img src={`https://img.youtube.com/vi/${part.id}/mqdefault.jpg`} className={`w-full h-full object-cover transition-opacity duration-300 ${activePartIndex === idx ? 'opacity-100' : 'opacity-60 group-hover:opacity-100'}`} alt={part.title} />
                                                        <div className={`absolute inset-0 flex items-center justify-center transition-colors ${activePartIndex === idx ? 'bg-brand-900/30' : 'bg-black/50 group-hover:bg-black/20'}`}>
                                                            <Play className={`w-8 h-8 transition-transform ${activePartIndex === idx ? 'text-brand-500 scale-110 drop-shadow-lg' : 'text-white'}`} />
                                                        </div>
                                                    </div>
                                                    <div className="bg-white p-3">
                                                        <p className={`text-xs font-bold uppercase tracking-wider mb-1 ${activePartIndex === idx ? 'text-brand-600' : 'text-slate-400'}`}>Parte {idx+1}</p>
                                                        <p className="text-sm font-bold text-slate-900 truncate" title={part.title}>{part.title}</p>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    case 'multipresentacion':
                        const docs = activeLesson.recurso.split('|').filter(Boolean);
                        const targetDoc = resolveResourceUrl(docs[activePartIndex]);
                        return (
                            <div className="space-y-6">
                                <div className="flex flex-wrap gap-3 mb-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                                    {docs.map((_, idx) => (
                                        <Button key={idx} variant={activePartIndex === idx ? 'primary' : 'outline'} onClick={() => setActivePartIndex(idx)} className="text-sm px-5 py-2">
                                            Documento {idx + 1}
                                        </Button>
                                    ))}
                                    <a href={targetDoc} target="_blank" rel="noopener noreferrer" className="ml-auto inline-flex items-center text-sm font-bold text-brand-600 hover:text-brand-800 bg-brand-50 px-5 py-2 rounded-lg transition-colors">
                                        Abrir en Pantalla Completa <ChevronRight className="w-4 h-4 ml-1" />
                                    </a>
                                </div>
                                <div className="w-full h-[75vh] min-h-[600px] bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 overflow-hidden relative">
                                    <iframe src={targetDoc} className="w-full h-full absolute inset-0" title={`Documento ${activePartIndex+1}`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                            </div>
                        );
                    case 'texto':
                        return (
                            <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                                <h3 className="text-3xl font-extrabold text-slate-900 mb-8 flex items-center gap-3 border-b border-slate-100 pb-6"><FileText className="text-brand-500 w-10 h-10"/> {activeLesson.titulo}</h3>
                                <div className="prose prose-lg max-w-none prose-slate prose-headings:font-bold prose-a:text-brand-600 whitespace-pre-wrap leading-relaxed font-serif">
                                    {activeLesson.contenidoText}
                                </div>
                            </div>
                        );
                    case 'quiz_nativo':
                        return <NativeQuiz lesson={activeLesson} onPass={() => markAsCompleted()} isCompleted={progress[activeLesson.id]} />;
                    case 'simulador':
                    case 'ejercicio':
                    case 'quiz':
                        const externalUrl = resolveResourceUrl(activeLesson.recurso.split('|')[0]);
                        return (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center border border-slate-200 shadow-sm gap-6">
                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-brand-100 text-brand-600 rounded-xl flex items-center justify-center shrink-0">
                                            {activeLesson.tipo === 'simulador' ? <Activity className="w-6 h-6"/> : <HelpCircle className="w-6 h-6"/>}
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-extrabold text-slate-900 mb-1">{activeLesson.titulo}</h3>
                                            <a href={externalUrl} target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-brand-600 hover:text-brand-800 flex items-center group">
                                                Lanzar en ventana independiente <ChevronRight className="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" />
                                            </a>
                                        </div>
                                    </div>
                                    {activeLesson.tipo === 'quiz' && (
                                        <Button onClick={() => { alert("Validación externa completada."); markAsCompleted(); }} variant="secondary" className="shrink-0 px-8">
                                            Validar Aprobación
                                        </Button>
                                    )}
                                </div>
                                <div className="w-full h-[80vh] min-h-[600px] bg-slate-900 rounded-3xl shadow-2xl border-4 border-slate-800 overflow-hidden relative group">
                                    <iframe src={externalUrl} className="w-full h-full absolute inset-0 bg-white" title={activeLesson.titulo} frameBorder="0" allowFullScreen></iframe>
                                    <div className="absolute top-4 right-4 bg-black/50 backdrop-blur text-white text-xs px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-2 pointer-events-none">
                                        <Lock className="w-3 h-3"/> Entorno Seguro
                                    </div>
                                </div>
                            </div>
                        );
                    case 'enlaces':
                        return (
                            <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-xl max-w-4xl mx-auto">
                                <div className="text-center mb-12 border-b border-slate-100 pb-10">
                                    <div className="w-20 h-20 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-6 transform rotate-3">
                                        <LinkIcon className="w-10 h-10" />
                                    </div>
                                    <h3 className="text-3xl font-extrabold text-slate-900 mb-4">{activeLesson.titulo}</h3>
                                    <p className="text-lg text-slate-600 max-w-2xl mx-auto">{activeLesson.descripcion}</p>
                                </div>
                                <div className="space-y-12">
                                    {(activeLesson.secciones || []).map((sec, idx) => (
                                        <div key={idx}>
                                            <h4 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                                                <Folder className="w-6 h-6 text-slate-400" /> {sec.tituloSeccion}
                                            </h4>
                                            <div className="grid sm:grid-cols-2 gap-4">
                                                {(sec.links || []).map((link, lIdx) => (
                                                    <a key={lIdx} href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-start gap-4 p-5 rounded-2xl border border-slate-200 hover:border-brand-500 hover:shadow-lg transition-all group bg-slate-50 hover:bg-white hover:-translate-y-1">
                                                        <div className="w-12 h-12 bg-white border border-slate-200 rounded-xl flex items-center justify-center shrink-0 group-hover:bg-brand-500 group-hover:border-brand-500 transition-colors shadow-sm">
                                                            <LinkIcon className="w-5 h-5 text-slate-500 group-hover:text-white" />
                                                        </div>
                                                        <div>
                                                            <h5 className="font-bold text-slate-900 text-sm mb-1.5 group-hover:text-brand-600 transition-colors leading-tight">{link.titulo}</h5>
                                                            <p className="text-xs text-slate-500 leading-relaxed font-medium line-clamp-2">{link.descripcion}</p>
                                                        </div>
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    default:
                        return <div className="p-12 text-center text-slate-500 bg-slate-100 rounded-2xl">Tipo de recurso desconocido.</div>;
                }
            };

            // Cálculo total de progreso
            let totalLessons = 0;
            let completedCount = 0;
            if (course && course.data) {
                course.data.modulos.forEach(mod => {
                    mod.lecciones.forEach(l => {
                        if (l.tipo === 'grupo') {
                            l.sublecciones.forEach(sub => { totalLessons++; if(progress[sub.id]) completedCount++; });
                        } else {
                            totalLessons++; if(progress[l.id]) completedCount++;
                        }
                    });
                });
            }
            const progressPercentage = totalLessons === 0 ? 0 : Math.round((completedCount / totalLessons) * 100);

            if (!course || !course.data) return <div className="p-24 text-center font-bold text-2xl text-slate-400">Datos del curso corruptos.</div>;

            return (
                <div className="flex h-screen bg-slate-100 pt-[72px]">
                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Header del Reproductor */}
                        <header className="h-20 border-b border-slate-200 flex items-center justify-between px-6 sm:px-10 bg-white shrink-0 shadow-sm z-10 relative">
                            <div className="absolute bottom-0 left-0 h-1 bg-brand-500 transition-all duration-500" style={{width: `${progressPercentage}%`}}></div>
                            
                            <div className="flex items-center gap-6">
                                <button onClick={() => setView('dashboard')} className="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-brand-50 hover:text-brand-600 hover:border-brand-200 transition-all">
                                    <ChevronLeft className="w-6 h-6" />
                                </button>
                                <div>
                                    <h1 className="font-extrabold text-xl text-slate-900 truncate max-w-[200px] sm:max-w-md md:max-w-xl">{course.title}</h1>
                                    <p className="text-sm font-bold text-slate-500 mt-0.5">Tu progreso: <span className="text-brand-600">{progressPercentage}% completado</span></p>
                                </div>
                            </div>
                            <Button variant="outline" className="hidden sm:flex" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                {sidebarOpen ? 'Ocultar Temario' : 'Ver Temario'} <Menu className="w-4 h-4 ml-2"/>
                            </Button>
                        </header>
                        
                        <div className="flex-1 overflow-auto p-4 sm:p-8 lg:p-12 relative">
                            <div className="max-w-[1400px] mx-auto">
                                <div className="mb-8">
                                    <h2 className="text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">{activeLesson?.titulo}</h2>
                                    {activeLesson?.descripcion && <p className="text-lg text-slate-600 font-medium">{activeLesson.descripcion}</p>}
                                </div>
                                
                                {renderResource()}

                                {activeLesson?.tipo !== 'quiz_nativo' && activeLesson?.tipo !== 'quiz' && (
                                    <div className="mt-12 flex flex-col sm:flex-row justify-between items-center bg-white p-8 rounded-3xl shadow-lg border border-slate-200 gap-6">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center shrink-0 ${progress[activeLesson?.id] ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`}>
                                                {progress[activeLesson?.id] ? <CheckCircle className="w-8 h-8"/> : <Clock className="w-8 h-8"/>}
                                            </div>
                                            <div>
                                                <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-1">Estado del Recurso</p>
                                                <p className="text-xl text-slate-900 font-extrabold">
                                                    {progress[activeLesson?.id] ? 'Completada Exitosamente' : `En estudio... (${timer}s)`}
                                                </p>
                                            </div>
                                        </div>
                                        {!progress[activeLesson?.id] && (
                                            <Button onClick={markAsCompleted} className={`px-8 py-4 text-lg ${timer < 10 ? 'opacity-50 cursor-not-allowed' : ''}`} variant={timer < 10 ? 'secondary' : 'primary'}>
                                                Marcar como Completado
                                            </Button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Sidebar Drawer (Temario) */}
                    <div className={`${sidebarOpen ? 'w-[380px]' : 'w-0'} shrink-0 bg-white border-l border-slate-200 transition-all duration-300 overflow-y-auto shadow-2xl relative z-20`}>
                        <div className="p-6">
                            <h3 className="font-extrabold text-xl text-slate-900 mb-6 flex items-center gap-3"><BookOpen className="w-6 h-6 text-brand-500"/> Contenido del Curso</h3>
                            <div className="space-y-4">
                                {course.data.modulos.map((mod, i) => (
                                    <div key={i} className="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm">
                                        <button 
                                            onClick={() => toggleModule(i)}
                                            className="w-full px-5 py-4 bg-slate-50 hover:bg-slate-100 text-left flex justify-between items-center transition-colors border-b border-slate-100">
                                            <span className="font-extrabold text-slate-900 text-sm truncate pr-4 leading-snug">{mod.titulo}</span>
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 transition-colors ${openModules[i] ? 'bg-brand-100 text-brand-600' : 'bg-white border border-slate-200 text-slate-400'}`}>
                                                <ChevronRight className={`w-4 h-4 transition-transform ${openModules[i] ? 'rotate-90' : ''}`} />
                                            </div>
                                        </button>
                                        
                                        {openModules[i] && (
                                            <div className="p-3 space-y-1.5 bg-white">
                                                {mod.lecciones.map((lesson, j) => {
                                                    if (lesson.tipo === 'grupo') {
                                                        const isGroupOpen = openGroups[lesson.titulo];
                                                        return (
                                                            <div key={j} className="mb-2 bg-slate-50 rounded-xl border border-slate-200 overflow-hidden">
                                                                <button onClick={() => toggleGroup(lesson.titulo)} className="w-full px-4 py-3 text-sm font-bold text-slate-700 bg-white flex justify-between items-center hover:bg-slate-50">
                                                                    <span className="truncate flex items-center gap-2"><Folder className="w-4 h-4 text-brand-500"/> {lesson.titulo}</span>
                                                                    <ChevronRight className={`w-4 h-4 text-slate-400 transition-transform ${isGroupOpen ? 'rotate-90' : ''}`} />
                                                                </button>
                                                                {isGroupOpen && (
                                                                    <div className="p-2 space-y-1 bg-slate-50">
                                                                        {lesson.sublecciones.map(sub => (
                                                                            <button 
                                                                                key={sub.id} 
                                                                                onClick={() => setActiveLesson(sub)}
                                                                                className={`w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-between group ${activeLesson?.id === sub.id ? 'bg-brand-500 text-white shadow-md' : 'text-slate-600 hover:bg-white border border-transparent hover:border-slate-200'}`}
                                                                            >
                                                                                <span className="truncate pr-2 flex items-center gap-2">
                                                                                    <div className={`w-1.5 h-1.5 rounded-full ${activeLesson?.id === sub.id ? 'bg-white' : 'bg-slate-300'}`}></div>
                                                                                    {sub.titulo}
                                                                                </span>
                                                                                {progress[sub.id] && <CheckCircle className={`w-4 h-4 shrink-0 ${activeLesson?.id === sub.id ? 'text-white' : 'text-green-500'}`} />}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    }
                                                    return (
                                                        <button 
                                                            key={lesson.id} 
                                                            onClick={() => setActiveLesson(lesson)}

                    return { id: id || '', title: title || '' };
                });

                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                if(!videos[vIdx]) videos[vIdx] = {id: '', title: ''};
                videos[vIdx][field] = value;
                updateLesson(mIdx, lIdx, 'recurso', videos.map(v => `${v.id}::${v.title}`).join('|'));
            };
            const addVideoPart = (mIdx, lIdx) => {
                const videos = getVideosArray(curriculum[mIdx].lecciones[lIdx].recurso);
                videos.push({id: '', title: ''});
                updateLesson(mIdx, lIdx, 'recurso', videos.map(v => `${v.id}::${v.title}`).join('|'));

                const newCurr = [...curriculum];
                newCurr[mIdx].lecciones[lIdx].preguntas[qIdx][field] = value;

                                        <button onClick={() => setView('dashboard')} className="text-sm font-bold text-slate-500 hover:text-brand-600 uppercase tracking-widest transition-colors flex items-center gap-2"><User className="w-4 h-4"/> Workspace</button>
                                        {currentUser.role === 'admin' && (
                                            <button onClick={() => setView('admin')} className="text-sm font-bold text-white bg-slate-900 hover:bg-brand-600 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-sm">
                                                <Shield className="w-4 h-4"/> Master Admin
                                            </button>
                                        )}
                                        <div className="flex items-center gap-4 border-l-2 border-slate-100 pl-6">
                                            <div className="flex flex-col text-right">
                                                <span className="text-sm font-bold text-slate-900">{currentUser.name}</span>
                                                <span className="text-[10px] font-bold text-brand-500 uppercase tracking-widest">{currentUser.role}</span>
                                            </div>
                                            <button onClick={logout} title="Cerrar Sesión" className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 border border-slate-200 text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                                                <LogOut className="w-4 h-4"/>
                                            </button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex gap-4 items-center">
                                        <button onClick={() => setShowAuthModal(true)} className="text-sm font-bold text-slate-700 hover:text-brand-600 transition-colors">Ingresar</button>
                                        <Button variant="primary" onClick={() => setShowAuthModal(true)} className="px-6 py-2.5 text-sm shadow-md">Comenzar Ahora</Button>
                                    </div>
                                )}
                            </div>

                            <div className="md:hidden flex items-center">
                                <button onClick={() => setMenuOpen(!menuOpen)} className="w-12 h-12 flex items-center justify-center bg-slate-50 text-slate-600 rounded-xl border border-slate-200">
                                    {menuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Menú Móvil */}
                    {menuOpen && (
                        <div className="md:hidden bg-white border-b border-slate-200 p-6 space-y-6 shadow-2xl absolute w-full z-50 animate-in slide-in-from-top-2">
                            <button onClick={() => { setView('catalog'); setMenuOpen(false); }} className="block w-full text-left font-bold text-xl text-slate-900 py-2 border-b border-slate-100">Explorar Catálogo</button>
                            {currentUser ? (
                                <div className="space-y-4 pt-2">
                                    <div className="flex items-center gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                        <div className="w-12 h-12 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center font-bold text-xl">{currentUser.name.charAt(0)}</div>
                                        <div>
                                            <p className="font-bold text-slate-900">{currentUser.email}</p>
                                            <p className="text-xs font-bold text-brand-500 uppercase tracking-widest">{currentUser.role}</p>
                                        </div>
                                    </div>
                                    <Button variant="secondary" onClick={() => { setView('dashboard'); setMenuOpen(false); }} className="w-full py-4 text-lg justify-start"><User className="w-5 h-5 mr-3"/> Mi Workspace</Button>
                                    {currentUser.role === 'admin' && (
                                        <Button variant="outline" onClick={() => { setView('admin'); setMenuOpen(false); }} className="w-full py-4 text-lg justify-start border-slate-900 text-slate-900"><Shield className="w-5 h-5 mr-3"/> Panel de Administración</Button>
                                    )}
                                    <Button variant="danger" onClick={logout} className="w-full py-4 text-lg justify-start"><LogOut className="w-5 h-5 mr-3"/> Cerrar Sesión Segura</Button>
                                </div>
                            ) : (
                                <div className="space-y-4 pt-4">
                                    <Button variant="outline" onClick={() => { setShowAuthModal(true); setMenuOpen(false); }} className="w-full py-4 text-lg">Ya tengo cuenta</Button>
                                    <Button variant="primary" onClick={() => { setShowAuthModal(true); setMenuOpen(false); }} className="w-full py-4 text-lg">Crear Cuenta Nueva</Button>
                                </div>
                            )}
                        </div>
                    )}
                </nav>
            );

            const Footer = () => (
                <footer className="bg-slate-950 text-slate-400 py-16 md:py-24 border-t border-slate-900 relative overflow-hidden">
                    <div className="absolute bottom-0 left-0 w-full h-[500px] bg-gradient-to-t from-brand-900/10 to-transparent pointer-events-none"></div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid md:grid-cols-4 gap-12 relative z-10">
                        <div className="col-span-1 md:col-span-2">
                            <div className="flex items-center gap-3 mb-6 opacity-50 grayscale hover:grayscale-0 hover:opacity-100 transition-all">
                                <div className="w-8 h-8 bg-white rounded-lg flex items-center justify-center">
                                    <span className="text-slate-900 font-extrabold text-lg font-serif">P</span>
                                </div>
                                <span className="font-extrabold text-2xl text-white">physics10.easy</span>
                            </div>
                            <p className="mb-8 max-w-sm font-medium leading-relaxed">Elevando los estándares de la educación técnica. Tecnología, simulación y datos para formar profesionales críticos.</p>
                            
                            <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" rel="noreferrer" className="inline-flex items-center px-6 py-3 bg-[#25D366] hover:bg-[#128C7E] text-white rounded-xl font-bold transition-transform hover:-translate-y-1 shadow-lg shadow-green-900/50 group">
                                <MessageCircle className="w-5 h-5 mr-2" /> Soporte Vía WhatsApp
                            </a>
                        </div>
                        <div>
                            <h4 className="text-white font-extrabold mb-6 uppercase text-xs tracking-widest">Legal & Privacidad</h4>
                            <ul className="space-y-4 text-sm font-medium">
                                <li><a href="#" className="hover:text-brand-400 transition-colors flex items-center gap-2"><ChevronRight className="w-3 h-3"/> Términos de Servicio</a></li>
                                <li><a href="#" className="hover:text-brand-400 transition-colors flex items-center gap-2"><ChevronRight className="w-3 h-3"/> Política de Datos (Habeas Data)</a></li>
                                <li><a href="#" className="hover:text-brand-400 transition-colors flex items-center gap-2"><ChevronRight className="w-3 h-3"/> Contratos Estudiantiles</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-extrabold mb-6 uppercase text-xs tracking-widest">Ecosistema</h4>
                            <div className="flex gap-4">
                                <a href="https://github.com/dudbilopr" target="_blank" rel="noreferrer" className="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-brand-500 hover:text-white hover:border-brand-500 transition-all"><Github className="w-5 h-5"/></a>
                                <a href="https://www.linkedin.com/in/dudbilopr" target="_blank" rel="noreferrer" className="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-[#0A66C2] hover:text-white hover:border-[#0A66C2] transition-all"><svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
                            </div>
                        </div>
                    </div>
                    
                    {/* Espacio futuro: Certificaciones Blockchain */}
                    {/* <div id="certificaciones-blockchain" className="max-w-7xl mx-auto px-4 mt-16 pt-8 border-t border-slate-900/50 text-center opacity-40">
                        <Shield className="w-6 h-6 mx-auto mb-2 text-slate-600" />
                        <h3 className="text-slate-500 font-bold text-sm uppercase tracking-widest mb-2">Módulo Web3 en Desarrollo</h3>
                        <p className="text-xs">Validación criptográfica de certificados en red Polygon.</p>
                    </div> 
                    */}
                </footer>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">
                    <Navbar />
                    
                    <main className="flex-grow">
                        {view === 'home' && (
                            <div className="animate-in fade-in duration-700">
                                <HeroSection setView={setView} />
                                <CeoSection />
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                                <PodcastNewsSection />
                                <ReviewsSection reviews={reviews} />
                            </div>
                        )}
                        {view === 'catalog' && (
                            <div className="pt-24 pb-16 min-h-screen bg-slate-50 animate-in fade-in">
                                <CourseCatalog courses={courses} setView={setView} setCurrentCourse={setCurrentCourse} />
                            </div>
                        )}
                        {view === 'courseDetail' && (
                            <div className="animate-in slide-in-from-bottom-10">
                                <CourseDetailView course={currentCourse} setView={setView} currentUser={currentUser} setEnrollments={setEnrollments} setShowAuthModal={setShowAuthModal} />
                            </div>
                        )}
                        {view === 'dashboard' && currentUser && (
                            <div className="animate-in fade-in">
                                <Dashboard enrollments={enrollments.filter(e => e.userId === currentUser.uid)} setView={setView} currentUser={currentUser} setCurrentCourse={setCurrentCourse} courses={courses} addReview={(r) => setReviews([...reviews, r])} onLogout={logout} />
                            </div>
                        )}
                        {view === 'player' && currentCourse && currentUser && (
                            <div className="animate-in fade-in">
                                <CoursePlayer course={currentCourse} setView={setView} currentUser={currentUser} />
                            </div>
                        )}
                        {view === 'admin' && currentUser?.role === 'admin' && (
                            <div className="animate-in fade-in">
                                <AdminPanel enrollments={enrollments} setEnrollments={setEnrollments} courses={courses} setCourses={setCourses} />
                            </div>
                        )}
                    </main>

                    {view !== 'player' && <Footer />}
                    
                    <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} onLogin={handleLogin} />
                    <ChatbotWidget />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
