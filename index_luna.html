<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexQuest: Simulador de Procesos Disciplinarios</title>
    
    <!-- Tailwind CSS (CDN para desarrollo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX para Fórmulas Matemáticas/Lógicas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Importmap para React, Lucide, Recharts y Firebase -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "recharts": "https://esm.sh/recharts@2.12.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hotspot-pulse { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 
                                70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 
                                100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .katex { font-size: 1.1em !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Scale, BrainCircuit, ShieldAlert, CheckCircle, XCircle, HelpCircle, Lock, LayoutDashboard, ChevronRight, Play, AlertTriangle, TrendingUp, Activity, FileText, Copy, Info } from 'lucide-react';
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, BarChart, Bar, ResponsiveContainer } from 'recharts';
        
        // --- FIREBASE INIT ---
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, writeBatch, doc } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk",
            authDomain: "lunaexplica-60035.firebaseapp.com",
            databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com",
            projectId: "lunaexplica-60035",
            storageBucket: "lunaexplica-60035.firebasestorage.app",
            messagingSenderId: "550469014323",
            appId: "1:550469014323:web:be79e10f33abc619432446",
            measurementId: "G-583N74HNVW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const APP_ID = 'lexquest-disciplinario';
        const COLLECTION_PATH = `artifacts/${APP_ID}/public/data/telemetry`;

        // --- BANCO DE PREGUNTAS (Resumido para estabilidad) ---
        const QUESTION_BANK = [
            {
                id: "q1_reading",
                type: "adaptive_radio",
                level: 1,
                difficulty: 0.3,
                expectedTime: 60,
                title: "Análisis Crítico de Jurisprudencia",
                context: "El funcionario X, omitió verificar pólizas. La defensa alega 'descuido menor'.",
                question: "¿Cómo se clasifica esta conducta?",
                options: [
                    { id: "A", text: "Falta leve.", isCorrect: false, feedback: "Incorrecto." },
                    { id: "B", text: "Falta gravísima a título de culpa gravísima.", isCorrect: true, feedback: "¡Correcto! Desatención elemental." }
                ],
                tip: "Grados de culpa: Dolo, Culpa Gravísima, Culpa Grave."
            },
            {
                id: "q2_dragdrop",
                type: "sequence_sorter",
                level: 2,
                difficulty: 0.5,
                expectedTime: 90,
                title: "Arquitectura del Proceso",
                context: "Ordena las etapas procesales.",
                question: "Arrastra y ordena las etapas.",
                items: [
                    { id: "step1", content: "Indagación Previa" },
                    { id: "step2", content: "Apertura de Investigación" },
                    { id: "step3", content: "Formulación de Cargos" }
                ],
                tip: "La indagación siempre precede a los cargos."
            }
        ];

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [studentInfo, setStudentInfo] = useState({ name: '', email: '' });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null });
            const [feedback, setFeedback] = useState(null);
            
            const currentQ = QUESTION_BANK[currentQIndex];

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } catch (e) {
                                await signInAnonymously(auth).catch(() => {});
                            }
                        } else {
                            await signInAnonymously(auth).catch(() => {});
                        }
                    } catch (err) { console.warn("Modo identificación visual activo."); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u || { uid: 'guest_user' }));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const qRef = collection(db, COLLECTION_PATH);
                const unsubscribe = onSnapshot(qRef, (snap) => {
                    setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.warn("Firestore solo lectura local."));
                return () => unsubscribe();
            }, []);

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    setStudentInfo({ name: result.user.displayName, email: result.user.email });
                    setUser(result.user);
                    setView('intro');
                } catch (error) {
                    console.error("Auth Error Detail:", error.code, error.message);
                    if (error.code === 'auth/unauthorized-domain') {
                        setAuthError(`DOMINIO NO AUTORIZADO: Agrega "${window.location.hostname}" en Firebase > Auth > Configuración > Dominios autorizados.`);
                    } else if (error.code === 'auth/operation-not-allowed') {
                        setAuthError("GOOGLE NO ACTIVADO: Ve a Firebase Console > Authentication > Sign-in method y ACTIVA el proveedor Google con un correo de soporte.");
                    } else if (error.code === 'auth/popup-closed-by-user') {
                        setAuthError("Ventana cerrada. Inténtalo de nuevo o usa el registro manual.");
                    } else {
                        setAuthError(`Error: ${error.message}. Usa el registro manual abajo.`);
                    }
                }
            };

            const submitAnswer = async (isCorrect) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const logEntry = {
                    studentName: studentInfo.name,
                    studentEmail: studentInfo.email,
                    questionId: currentQ.id,
                    isCorrect,
                    timeSpent,
                    timestamp: serverTimestamp()
                };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) {}

                setScore(prev => prev + (isCorrect ? 100 : 0));
                setTimeout(() => {
                    setFeedback(null);
                    if (currentQIndex < QUESTION_BANK.length - 1) {
                        setCurrentQIndex(prev => prev + 1);
                        setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { setView('results'); }
                }, 2000);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 p-4 font-sans">
                    <div className="max-w-xl mx-auto mt-10">
                        {view === 'login' && (
                            <div className="glass-panel rounded-2xl p-8 shadow-2xl animate-fade-in border-t-4 border-t-blue-500">
                                <Scale className="w-12 h-12 text-blue-500 mx-auto mb-4" />
                                <h1 className="text-2xl font-bold text-center mb-6 font-serif">LexQuest Login</h1>
                                
                                {authError && (
                                    <div className="bg-red-900/30 border border-red-500/50 text-red-200 p-4 rounded-lg mb-6 text-xs leading-relaxed">
                                        <div className="flex items-center font-bold mb-1 text-red-400">
                                            <AlertTriangle className="w-4 h-4 mr-2" /> ACCIÓN REQUERIDA
                                        </div>
                                        {authError}
                                        {authError.includes("DOMINIO") && (
                                            <button 
                                                onClick={() => { navigator.clipboard.writeText(window.location.hostname); alert("Copiado!"); }}
                                                className="mt-2 w-full py-1 bg-red-800/50 rounded flex items-center justify-center hover:bg-red-800">
                                                <Copy className="w-3 h-3 mr-2" /> Copiar Dominio
                                            </button>
                                        )}
                                    </div>
                                )}

                                <button onClick={handleGoogleLogin} className="w-full mb-6 py-3 bg-white text-slate-900 font-bold rounded-lg flex justify-center items-center shadow-md hover:bg-slate-100 transition-colors">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5 mr-3" alt="G" />
                                    Continuar con Google
                                </button>

                                <div className="flex items-center mb-6 text-xs text-slate-500">
                                    <div className="flex-grow border-t border-slate-700"></div>
                                    <span className="px-3 uppercase">Plan B: Registro Manual</span>
                                    <div className="flex-grow border-t border-slate-700"></div>
                                </div>

                                <div className="space-y-4">
                                    <input type="text" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-blue-500" placeholder="Nombre completo" />
                                    <input type="email" value={studentInfo.email} onChange={e => setStudentInfo({...studentInfo, email: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm outline-none focus:border-blue-500" placeholder="Correo institucional" />
                                    <button onClick={() => setView('intro')} disabled={!studentInfo.name || !studentInfo.email} className="w-full py-3 bg-blue-600 disabled:opacity-50 text-white font-bold rounded-lg hover:bg-blue-500 transition-colors">Ingresar Manualmente</button>
                                </div>
                            </div>
                        )}

                        {view === 'intro' && (
                            <div className="glass-panel rounded-2xl p-10 text-center animate-fade-in">
                                <ShieldAlert className="w-16 h-16 text-blue-500 mx-auto mb-4" />
                                <h1 className="text-3xl font-bold mb-4 font-serif">Simulador Procesal</h1>
                                <p className="text-slate-400 mb-8">Bienvenido, {studentInfo.name}. Iniciando evaluación adaptativa.</p>
                                <button onClick={() => { setView('assessment'); setSessionData({startTime: Date.now(), currentQStartTime: Date.now()}); }} className="px-10 py-4 bg-blue-600 rounded-full font-bold shadow-lg hover:bg-blue-500 transition-all">Iniciar Expediente</button>
                            </div>
                        )}

                        {view === 'assessment' && (
                            <div className="animate-fade-in">
                                <div className="glass-panel rounded-2xl p-8 border-l-4 border-blue-500">
                                    <h2 className="text-xl font-bold mb-4">{currentQ.title}</h2>
                                    <p className="text-slate-300 mb-6 text-sm italic">{currentQ.context}</p>
                                    <div className="space-y-3">
                                        {currentQ.options?.map(opt => (
                                            <button key={opt.id} onClick={() => { setFeedback({isCorrect: opt.isCorrect, text: opt.feedback}); submitAnswer(opt.isCorrect); }} disabled={feedback}
                                                className={`w-full text-left p-4 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-700 transition-colors ${feedback && opt.isCorrect ? 'border-emerald-500 bg-emerald-900/20' : ''}`}>
                                                {opt.text}
                                            </button>
                                        ))}
                                    </div>
                                    {feedback && (
                                        <div className={`mt-6 p-4 rounded-lg flex items-center space-x-3 ${feedback.isCorrect ? 'bg-emerald-900/30 text-emerald-400' : 'bg-red-900/30 text-red-400'}`}>
                                            {feedback.isCorrect ? <CheckCircle /> : <XCircle />}
                                            <span className="text-sm">{feedback.text}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'results' && (
                            <div className="glass-panel rounded-2xl p-10 text-center animate-fade-in">
                                <CheckCircle className="w-20 h-20 text-emerald-500 mx-auto mb-4" />
                                <h1 className="text-3xl font-bold mb-2">Evaluación Finalizada</h1>
                                <p className="text-4xl font-bold text-blue-400 mb-6">{score} pts</p>
                                <button onClick={() => window.location.reload()} className="px-6 py-2 bg-slate-700 rounded text-sm hover:bg-slate-600">Reiniciar</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
