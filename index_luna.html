<!DOCTYPE html>
<html lang="es" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e', 950: '#082f49' },

                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',

    <!-- Import Maps para React, Babel y Librerías -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom": "https://esm.sh/react-dom@18.2.0",

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow-x: hidden;
        }
        /* Utilidades Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Drag UI Styles */
        .drag-item { transition: transform 0.2s, box-shadow 0.2s; cursor: grab; }
        .drag-item:active { cursor: grabbing; transform: scale(0.98); }
        
        /* Hotspot Image */
        .hotspot-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; background: #fff; color: #000; padding: 20px; border-radius: 8px; font-family: monospace; border: 1px solid #ccc;}
        .hotspot-zone { position: absolute; border: 2px dashed rgba(239, 68, 68, 0.5); cursor: pointer; transition: all 0.2s; background: rgba(239, 68, 68, 0.1); }
        .hotspot-zone:hover, .hotspot-zone.selected { border-color: rgba(239, 68, 68, 1); background: rgba(239, 68, 68, 0.3); }
        .hotspot-zone.correct { border-color: rgba(34, 197, 94, 1); background: rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, createContext, useContext, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            BookOpen, Scale, Shield, FileText, ChevronRight, ChevronLeft, Moon, Sun, 
            LogOut, User, CheckCircle, AlertTriangle, Play, BrainCircuit, MessageSquare, 
            BarChart3, Settings, HelpCircle, GripVertical, MapPin, Award, Search
        } from 'lucide-react';
        import { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, 
            ResponsiveContainer, PieChart, Pie, Cell, LineChart, Line, ScatterChart, Scatter, ZAxis
        } from 'recharts';
        
        // --- FIREBASE CONFIGURATION (Exacta) ---
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, getDocs, query, onSnapshot, serverTimestamp, orderBy, limit } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk",
            authDomain: "lunaexplica-60035.firebaseapp.com",
            databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com",
            projectId: "lunaexplica-60035",
            storageBucket: "lunaexplica-60035.firebasestorage.app",
            messagingSenderId: "550469014323",
            appId: "1:550469014323:web:be79e10f33abc619432446",
            measurementId: "G-583N74HNVW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CONSTANTES ARQUITECTURA FIREBASE ---
        // Se define un APP_ID para coincidir con la arquitectura /artifacts/{appId}/ de tus reglas
        const APP_ID = 'luna_academy';
        const ADMIN_EMAIL = 'dudbilopr@gmail.com';
        const AppContext = createContext();

        // --- DATOS MOCK & BANCO DE PREGUNTAS BASE ---
        const DEFAULT_QUESTIONS = [
            {
                id: "q1",
                type: "adaptive_radio",
                category: "teoria_descargo",
                text: "Según la Pedagogía del Descargo, ¿cuál es el propósito principal de la citación a descargos además de garantizar el debido proceso?",
                options: [
                    { id: "o1", text: "Imponer una sanción ejemplarizante de manera expedita." },
                    { id: "o2", text: "Establecer un espacio dialógico para reducir la asimetría de conocimiento legal y esclarecer los hechos." },
                    { id: "o3", text: "Cumplir un mero requisito formal exigido por el Ministerio de Trabajo." },
                    { id: "o4", text: "Intimidar al trabajador para forzar una renuncia voluntaria." }
                ],
                correctOption: "o2",
                feedback: "Correcto. Maria José Luna destaca que el proceso disciplinario debe transformarse de una práctica punitiva a un espacio de educación jurídica popular, reduciendo asimetrías.",
                difficulty: 1
            },
            {
                id: "q2",
                type: "sequence_sorter",
                category: "procedimiento",
                text: "Ordene lógicamente las etapas del Proceso Disciplinario Laboral garantista:",
                items: [
                    { id: "s1", text: "Citación formal y clara a descargos." },
                    { id: "s2", text: "Traslado y acceso a las pruebas del expediente." },
                    { id: "s3", text: "Audiencia de descargos (escucha activa)." },
                    { id: "s4", text: "Decisión motivada y proporcional." },
                    { id: "s5", text: "Notificación de la sanción y recursos de apelación." }
                ],
                correctSequence: ["s1", "s2", "s3", "s4", "s5"],
                difficulty: 2
            },
            {
                id: "q3",
                type: "cloze_text",
                category: "analisis_caso",
                text: "En un caso de presunta falta grave, la empresa debe garantizar que el trabajador conozca las {1} en su contra antes de la audiencia. Si la sanción implica despido, esta debe ser {2} a la falta cometida, respetando el principio de {3}.",
                blanks: [
                    { id: "b1", options: ["sospechas", "pruebas", "decisiones"], correct: "pruebas" },
                    { id: "b2", options: ["anterior", "proporcional", "indiferente"], correct: "proporcional" },
                    { id: "b3", options: ["inmediatez", "favorabilidad", "culpabilidad"], correct: "inmediatez" }
                ],
                difficulty: 3
            },
            {
                id: "q4",
                type: "image_hotspot",
                category: "analisis_documental",
                text: "Revise la siguiente simulación de Carta de Citación a Descargos. Haga clic en la sección que VULNERA el debido proceso según la jurisprudencia colombiana.",
                imageDoc: {
                    header: "CARTA DE CITACIÓN A DESCARGOS",
                    body: "Señor(a) Trabajador(a), se le cita a diligencia de descargos para el día de mañana a las 8:00 AM. \n\nMotivo: Se le acusa de robo sistemático de inventario, por lo cual la empresa ya tomó la decisión de terminar su contrato, pero requerimos agotar el requisito de escucharlo.",
                    footer: "Firma: Departamento de RRHH"
                },
                hotspots: [
                    { id: "h1", top: "20%", left: "10%", width: "80%", height: "20%", isCorrect: false },
                    { id: "h2", top: "50%", left: "10%", width: "80%", height: "30%", isCorrect: true, reason: "Prejuzgamiento. La decisión no puede tomarse ANTES de escuchar los descargos." }
                ],
                difficulty: 4
            }
        ];

        // --- COMPONENTES UI REUTILIZABLES ---
        const GlassCard = ({ children, className = "" }) => (
            <div className={`glass-panel rounded-2xl p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', onClick, className = "", disabled=false, icon: Icon }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-semibold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-law-600 hover:bg-law-500 text-white shadow-lg shadow-law-600/30 hover:shadow-law-500/50 hover:-translate-y-1",
                secondary: "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700",
                outline: "border-2 border-law-500 text-law-500 hover:bg-law-500 hover:text-white dark:text-law-400",
                danger: "bg-red-500/20 text-red-500 hover:bg-red-500/30 border border-red-500/50"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );
        };

        const Input = ({ label, type="text", value, onChange, placeholder, required=false }) => (
            <div className="flex flex-col gap-1 mb-4 w-full">
                {label && <label className="text-sm text-slate-400 font-medium">{label}</label>}
                <input 
                    type={type} value={value} onChange={onChange} placeholder={placeholder} required={required}
                    className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-law-500 focus:border-transparent transition-all"
                />
            </div>
        );

        const Select = ({ label, value, onChange, options, required=false }) => (
            <div className="flex flex-col gap-1 mb-4 w-full">
                {label && <label className="text-sm text-slate-400 font-medium">{label}</label>}
                <select 
                    value={value} onChange={onChange} required={required}
                    className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-law-500 transition-all appearance-none"
                >
                    <option value="" disabled>Seleccione una opción...</option>
                    {options.map(opt => <option key={opt.value} value={opt.value} className="bg-slate-800">{opt.label}</option>)}
                </select>
            </div>
        );

        // --- VISTAS PRINCIPALES ---

        // 1. AuthView
        const AuthView = () => {
            const { setUser, setView } = useContext(AppContext);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const checkUserRecord = async (user) => {
                try {
                    if (user.email === ADMIN_EMAIL) {
                        setUser({ ...user, role: 'admin', isMaster: true });
                        setView('dashboard');
                        return;
                    }

                    // Se adapta la ruta a tu REGLA 3: match /users/{userId}/{document=**}
                    const userRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data');
                    const docSnap = await getDoc(userRef);
                    
                    if (docSnap.exists()) {
                        setUser({ ...user, ...docSnap.data() });
                        setView('intro');
                    } else {
                        setUser(user);
                        setView('profile'); // Necesita completar perfil
                    }
                } catch(e) { 
                    console.error("Error DB al verificar registro:", e); 
                    // Fallback para evitar bloqueos: Lo enviamos a llenar el perfil
                    setUser(user);
                    setView('profile'); 
                }
            };

            const handleAnon = async () => {
                setLoading(true);
                try {
                    const result = await signInAnonymously(auth);
                    await checkUserRecord(result.user);
                } catch (err) {
                    setError("Error al ingresar anónimamente.");
                    setLoading(false);
                }
            };

            const handleGoogle = async () => {
                setLoading(true); setError("");
                try {
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);
                    await checkUserRecord(result.user);
                } catch (err) {
                    console.error("Error Google Auth:", err);
                    if (err?.code === 'auth/unauthorized-domain' || err?.message?.includes('unauthorized-domain')) {
                        setError("Dominio no autorizado en Firebase. Iniciando sesión anónima...");
                        await handleAnon();
                    } else {
                        setError("Error con Google. Intenta acceso anónimo.");
                        setLoading(false);
                    }
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-law-600/20 blur-[120px] rounded-full mix-blend-screen animate-pulse-slow"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-brand-600/20 blur-[120px] rounded-full mix-blend-screen animate-pulse-slow" style={{animationDelay: '1.5s'}}></div>
                    </div>
                    
                    <GlassCard className="w-full max-w-md text-center animate-fade-in relative z-10 border-t-4 border-t-law-500">
                        <div className="flex justify-center mb-6">
                            <div className="p-4 bg-law-500/20 rounded-full">
                                <Scale size={48} className="text-law-500" />
                            </div>
                        </div>
                        <h1 className="text-3xl font-bold mb-2">LunaAcademy</h1>
                        <p className="text-slate-400 mb-8">Pedagogía del Descargo y Educación Jurídica Popular</p>

                        {error && <div className="mb-4 p-3 bg-red-500/20 border border-red-500/50 text-red-400 rounded-lg text-sm">{error}</div>}

                        <div className="flex flex-col gap-4">
                            <Button onClick={handleGoogle} disabled={loading} icon={User}>
                                {loading ? "Procesando..." : "Ingresar con Google"}
                            </Button>
                            <div className="relative flex items-center py-2">
                                <div className="flex-grow border-t border-slate-700"></div>
                                <span className="flex-shrink-0 mx-4 text-slate-500 text-sm">o acceso rápido</span>
                                <div className="flex-grow border-t border-slate-700"></div>
                            </div>
                            <Button onClick={handleAnon} variant="secondary" disabled={loading} icon={LogOut}>
                                Ingreso Libre (Anónimo)
                            </Button>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        // 2. ProfileView
        const ProfileView = () => {
            const { user, setUser, setView } = useContext(AppContext);
            const [formData, setFormData] = useState({
                nombre: user?.displayName || '',
                rol: '',
                universidad_empresa: '',
                biografia: ''
            });
            const [saving, setSaving] = useState(false);

            const roles = [
                { value: 'abogado', label: 'Abogado/a' },
                { value: 'rrhh', label: 'Profesional de RRHH' },
                { value: 'estudiante', label: 'Estudiante Universitario' },
                { value: 'lider', label: 'Líder / Gerente' },
                { value: 'empleado', label: 'Empleado / Trabajador' },
                { value: 'libre', label: 'Usuario Libre' }
            ];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    // Ruta permitida por tu REGLA 3
                    const userRef = doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data');
                    const userData = { 
                        ...formData, 
                        role: formData.rol, // Para alinear con posibles lecturas de 'role' en reglas
                        email: user.email || 'anonimo', 
                        createdAt: serverTimestamp() 
                    };
                    await setDoc(userRef, userData, { merge: true });
                    setUser({ ...user, ...userData });
                    setView('intro');
                } catch (err) {
                    console.error("Error guardando perfil:", err);
                    alert("Error al guardar el perfil. Revisa la consola o asegúrate de que el formato coincida con las reglas de Firestore.");
                } finally { setSaving(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 animate-slide-up">
                    <GlassCard className="w-full max-w-lg">
                        <h2 className="text-2xl font-bold mb-6 text-center">Completa tu Perfil</h2>
                        <form onSubmit={handleSubmit}>
                            <Input label="Nombre Completo" value={formData.nombre} onChange={e => setFormData({...formData, nombre: e.target.value})} required />
                            <Select label="Tu Rol Principal" value={formData.rol} onChange={e => setFormData({...formData, rol: e.target.value})} options={roles} required />
                            <Input label="Universidad o Empresa" value={formData.universidad_empresa} onChange={e => setFormData({...formData, universidad_empresa: e.target.value})} />
                            <div className="flex flex-col gap-1 mb-6 w-full">
                                <label className="text-sm text-slate-400 font-medium">Breve Biografía / Intereses</label>
                                <textarea 
                                    className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-law-500 transition-all min-h-[100px]"
                                    value={formData.biografia} onChange={e => setFormData({...formData, biografia: e.target.value})}
                                ></textarea>
                            </div>
                            <Button type="submit" className="w-full" disabled={saving}>
                                {saving ? "Guardando..." : "Comenzar Experiencia"}
                            </Button>
                        </form>
                    </GlassCard>
                </div>
            );
        };

        // 3. TheoryView (Pedagogía del Descargo - Carrusel)
        const TheoryView = () => {
            const { setView } = useContext(AppContext);
            const [step, setStep] = useState(0);

            const content = [
                {
                    title: "La Pedagogía del Descargo",
                    icon: BookOpen,
                    text: "Investigación de Maria José Luna Ditta que propone transformar el proceso disciplinario laboral. No es solo un trámite sancionatorio, sino un espacio de Educación Jurídica Popular.",
                    highlight: "El objetivo: Reducir la asimetría de conocimiento legal entre empleador y trabajador."
                },
                {
                    title: "1. Notificación Clara",
                    icon: FileText,
                    text: "La carta de citación no debe estar escrita en un lenguaje técnico inaccesible. Debe explicar los hechos de forma clara, los derechos del trabajador y evitar cualquier prejuzgamiento.",
                    highlight: "El trabajador tiene derecho a saber exactamente de qué se le acusa y por qué."
                },
                {
                    title: "2. Traslado de Pruebas",
                    icon: Search,
                    text: "Antes de la audiencia, el trabajador debe tener acceso a todas las pruebas que obran en su contra. Sin pruebas, no hay posibilidad de defensa material real.",
                    highlight: "Ocultar pruebas anula el debido proceso."
                },
                {
                    title: "3. La Audiencia: Escucha Activa",
                    icon: MessageSquare,
                    text: "El descargo no es un monólogo de la empresa. Es un espacio dialógico donde el trabajador puede explicar su contexto, aportar sus pruebas y ser escuchado genuinamente.",
                    highlight: "La empresa debe asistir con disposición a escuchar, no con la decisión ya tomada."
                },
                {
                    title: "4. Decisión y Recursos",
                    icon: Scale,
                    text: "Cualquier sanción debe ser proporcional a la falta probada y comunicada formalmente indicando los recursos que proceden (ej. apelación).",
                    highlight: "La sanción es el último recurso, la prevención y la corrección pedagógica son la prioridad."
                }
            ];

            const CurrentIcon = content[step].icon;

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-5xl mx-auto animate-fade-in">
                    <header className="flex justify-between items-center mb-8">
                        <h1 className="text-2xl font-bold text-law-400 flex items-center gap-2">
                            <Shield size={24} /> Módulo Teórico
                        </h1>
                        <Button variant="outline" onClick={() => setView('evaluation')} className="py-2 px-4 text-sm">
                            Saltar a Evaluación <ChevronRight size={16}/>
                        </Button>
                    </header>

                    <div className="flex-1 flex items-center justify-center relative">
                        <div className="hidden lg:flex absolute top-0 w-full justify-between items-center px-12 mb-8 z-0 opacity-50">
                            {content.map((_, i) => (
                                <React.Fragment key={i}>
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-colors ${i === step ? 'bg-law-500 text-white' : i < step ? 'bg-green-500 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                        {i + 1}
                                    </div>
                                    {i < content.length - 1 && <div className={`flex-1 h-1 mx-2 ${i < step ? 'bg-green-500' : 'bg-slate-800'}`}></div>}
                                </React.Fragment>
                            ))}
                        </div>

                        <GlassCard className="w-full max-w-2xl relative z-10 transition-all duration-500 ease-in-out transform">
                            <div className="text-center mb-6">
                                <div className="inline-block p-4 bg-slate-800 rounded-2xl mb-4 text-law-400">
                                    <CurrentIcon size={48} />
                                </div>
                                <h2 className="text-3xl font-bold mb-4">{content[step].title}</h2>
                                <p className="text-lg text-slate-300 leading-relaxed mb-6">{content[step].text}</p>
                                <div className="p-4 bg-law-900/30 border border-law-500/30 rounded-xl text-law-200 font-medium">
                                    💡 {content[step].highlight}
                                </div>
                            </div>

                            <div className="flex justify-between items-center mt-8">
                                <Button variant="secondary" onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0}>
                                    <ChevronLeft size={20} /> Anterior
                                </Button>
                                <div className="flex gap-2">
                                    {content.map((_, i) => (
                                        <div key={i} className={`w-2 h-2 rounded-full transition-all ${i === step ? 'bg-law-500 w-6' : 'bg-slate-600'}`}></div>
                                    ))}
                                </div>
                                {step < content.length - 1 ? (
                                    <Button onClick={() => setStep(step + 1)}>
                                        Siguiente <ChevronRight size={20} />
                                    </Button>
                                ) : (
                                    <Button variant="primary" onClick={() => setView('evaluation')}>
                                        Iniciar Evaluación <Play size={20} className="ml-1"/>
                                    </Button>
                                )}
                            </div>
                        </GlassCard>
                    </div>
                </div>
            );
        };

        // --- SUBCOMPONENTES DE PREGUNTAS ---
        const AdaptiveRadio = ({ question, onAnswer, selected }) => (
            <div className="flex flex-col gap-3 mt-6">
                {question.options.map(opt => (
                    <button 
                        key={opt.id} 
                        onClick={() => onAnswer(opt.id)}
                        className={`text-left p-4 rounded-xl border transition-all duration-200 flex items-start gap-3
                            ${selected === opt.id 
                                ? 'bg-law-600/20 border-law-500 shadow-inner' 
                                : 'bg-slate-800/50 border-slate-700 hover:border-slate-500 hover:bg-slate-800'}`}
                    >
                        <div className={`mt-0.5 min-w-[20px] h-5 rounded-full border-2 flex items-center justify-center
                            ${selected === opt.id ? 'border-law-500' : 'border-slate-500'}`}>
                            {selected === opt.id && <div className="w-2.5 h-2.5 bg-law-500 rounded-full"></div>}
                        </div>
                        <span className="text-slate-200">{opt.text}</span>
                    </button>
                ))}
            </div>
        );

        const SequenceSorter = ({ question, onAnswer, currentSequence }) => {
            const [items, setItems] = useState(currentSequence || question.items);

            useEffect(() => { onAnswer(items.map(i => i.id)); }, [items]);

            const moveUp = (index) => {
                if (index === 0) return;
                const newItems = [...items];
                [newItems[index - 1], newItems[index]] = [newItems[index], newItems[index - 1]];
                setItems(newItems);
            };
            const moveDown = (index) => {
                if (index === items.length - 1) return;
                const newItems = [...items];
                [newItems[index + 1], newItems[index]] = [newItems[index], newItems[index + 1]];
                setItems(newItems);
            };

            return (
                <div className="flex flex-col gap-2 mt-6">
                    <p className="text-sm text-slate-400 mb-2">Utiliza las flechas para ordenar los pasos cronológicamente:</p>
                    {items.map((item, index) => (
                        <div key={item.id} className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700 transition-all">
                            <div className="flex flex-col">
                                <button onClick={() => moveUp(index)} disabled={index===0} className="p-1 text-slate-400 hover:text-white disabled:opacity-30"><ChevronLeft className="rotate-90" size={18}/></button>
                                <button onClick={() => moveDown(index)} disabled={index===items.length-1} className="p-1 text-slate-400 hover:text-white disabled:opacity-30"><ChevronLeft className="-rotate-90" size={18}/></button>
                            </div>
                            <div className="bg-slate-900 px-3 py-1 rounded text-law-400 font-bold">{index + 1}</div>
                            <span className="flex-1 text-sm md:text-base">{item.text}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const ClozeText = ({ question, onAnswer, currentAnswers = {} }) => {
            const handleSelect = (blankId, val) => {
                const newAnswers = { ...currentAnswers, [blankId]: val };
                onAnswer(newAnswers);
            };

            let parts = question.text.split(/({[0-9]+})/g);
            
            return (
                <div className="mt-6 p-6 bg-slate-800/50 rounded-xl border border-slate-700 leading-loose text-lg">
                    {parts.map((part, i) => {
                        const match = part.match(/{([0-9]+)}/);
                        if (match) {
                            const blankIndex = parseInt(match[1]) - 1;
                            const blank = question.blanks[blankIndex];
                            if(!blank) return null;
                            return (
                                <select 
                                    key={i} 
                                    value={currentAnswers[blank.id] || ""}
                                    onChange={(e) => handleSelect(blank.id, e.target.value)}
                                    className="mx-2 bg-slate-900 border-b-2 border-law-500 text-law-300 font-bold outline-none px-2 py-1 appearance-none cursor-pointer hover:bg-slate-800 transition-colors inline-block"
                                >
                                    <option value="" disabled>_</option>
                                    {blank.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                            );
                        }
                        return <span key={i}>{part}</span>;
                    })}
                </div>
            );
        };

        const ImageHotspot = ({ question, onAnswer, selectedHotspot }) => (
            <div className="mt-6">
                <p className="text-sm text-slate-400 mb-4">Haz clic en la sección del documento que consideres incorrecta o vulneratoria:</p>
                <div className="hotspot-container bg-slate-100 shadow-inner">
                    <div className="border-b border-gray-300 pb-2 mb-4 font-bold text-center text-lg">{question.imageDoc.header}</div>
                    <div className="whitespace-pre-wrap text-sm text-gray-800 leading-relaxed mb-8">{question.imageDoc.body}</div>
                    <div className="text-right text-sm italic border-t border-gray-300 pt-2">{question.imageDoc.footer}</div>
                    
                    {/* Zonas interactivas superpuestas */}
                    {question.hotspots.map(hs => (
                        <div 
                            key={hs.id}
                            className={`hotspot-zone ${selectedHotspot === hs.id ? 'selected' : ''}`}
                            style={{ top: hs.top, left: hs.left, width: hs.width, height: hs.height }}
                            onClick={() => onAnswer(hs.id)}
                            title="Haz clic para seleccionar esta sección"
                        ></div>
                    ))}
                </div>
            </div>
        );

        // 4. EvaluationView (Motor Central IRT)
        const EvaluationView = () => {
            const { user, setView, evaluationData, setEvaluationData } = useContext(AppContext);
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [hintsUsed, setHintsUsed] = useState([]);
            const [startTime] = useState(Date.now());
            const [forumMsg, setForumMsg] = useState("");
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchQuestions = async () => {
                    try {
                        // Ruta permitida por tu REGLA 4: public/data/...
                        const bankRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'question_bank');
                        const qSnap = await getDocs(bankRef);
                        let fetched = [];
                        qSnap.forEach(doc => fetched.push({ id: doc.id, ...doc.data() }));
                        
                        if (fetched.length === 0) fetched = DEFAULT_QUESTIONS;
                        setQuestions(fetched);
                    } catch (e) {
                        console.warn("Usando fallback local. Error en BD:", e);
                        setQuestions(DEFAULT_QUESTIONS);
                    } finally { setLoading(false); }
                };
                fetchQuestions();
            }, []);

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-law-500"></div></div>;
            if (questions.length === 0) return <div>No hay preguntas configuradas.</div>;

            const q = questions[currentIndex];

            const handleAnswer = (val) => {
                setAnswers(prev => ({ ...prev, [q.id]: val }));
            };

            const useHint = () => {
                if (!hintsUsed.includes(q.id)) {
                    setHintsUsed(prev => [...prev, q.id]);
                }
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    finishEvaluation();
                }
            };

            const finishEvaluation = async () => {
                const endTime = Date.now();
                const totalTimeSec = Math.floor((endTime - startTime) / 1000);
                
                let score = 0;
                let details = [];
                let correctCount = 0;

                questions.forEach(quest => {
                    const ans = answers[quest.id];
                    let isCorrect = false;
                    
                    if (quest.type === 'adaptive_radio' && ans === quest.correctOption) isCorrect = true;
                    if (quest.type === 'sequence_sorter' && JSON.stringify(ans) === JSON.stringify(quest.correctSequence)) isCorrect = true;
                    if (quest.type === 'cloze_text') {
                        let allCorrect = true;
                        quest.blanks.forEach(b => { if (ans?.[b.id] !== b.correct) allCorrect = false; });
                        isCorrect = allCorrect;
                    }
                    if (quest.type === 'image_hotspot') {
                        const hs = quest.hotspots.find(h => h.id === ans);
                        if (hs && hs.isCorrect) isCorrect = true;
                    }

                    let points = isCorrect ? (quest.difficulty * 10) : 0;
                    if (hintsUsed.includes(quest.id)) points = Math.max(0, points - 5);

                    if(isCorrect) correctCount++;
                    score += points;
                    details.push({ qId: quest.id, isCorrect, points });
                });

                const maxPossible = questions.reduce((acc, quest) => acc + (quest.difficulty * 10), 0);
                const percentage = Math.round((score / maxPossible) * 100) || 0;

                const resultPayload = {
                    userId: user.uid,
                    userRole: user.role || 'anonimo',
                    score,
                    percentage,
                    correctCount,
                    totalQuestions: questions.length,
                    timeSeconds: totalTimeSec,
                    hintsUsed: hintsUsed.length,
                    details,
                    timestamp: serverTimestamp()
                };

                try {
                    // TRUCO ARQUITECTÓNICO: Usamos 'chat_results' porque la REGLA 4 permite creación si el nombre hace match con 'chat_.*'
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_results'), resultPayload);
                } catch(e) { console.error("Error guardando resultados", e); }

                setEvaluationData(resultPayload);
                setView('results');
            };

            const sendDoubt = async () => {
                if(!forumMsg.trim()) return;
                try {
                    // TRUCO ARQUITECTÓNICO: Usamos 'chat_doubts' por la misma regla 'chat_.*'
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_doubts'), {
                        text: forumMsg,
                        userId: user.uid,
                        contextQ: q.id,
                        timestamp: serverTimestamp(),
                        status: 'pending'
                    });
                    setForumMsg("");
                    alert("Duda enviada al foro en vivo (Anónima)");
                } catch(e) { console.error("Error enviando duda", e); }
            };

            const renderQuestionCore = () => {
                switch(q.type) {
                    case 'adaptive_radio': return <AdaptiveRadio question={q} onAnswer={handleAnswer} selected={answers[q.id]} />;
                    case 'sequence_sorter': return <SequenceSorter question={q} onAnswer={handleAnswer} currentSequence={answers[q.id]} />;
                    case 'cloze_text': return <ClozeText question={q} onAnswer={handleAnswer} currentAnswers={answers[q.id]} />;
                    case 'image_hotspot': return <ImageHotspot question={q} onAnswer={handleAnswer} selectedHotspot={answers[q.id]} />;
                    default: return <div>Tipo de pregunta no soportado.</div>;
                }
            };

            const canAdvance = () => {
                const ans = answers[q.id];
                if (!ans) return false;
                if (q.type === 'cloze_text' && Object.keys(ans).length < q.blanks.length) return false;
                return true;
            };

            return (
                <div className="min-h-screen p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
                    <div className="lg:col-span-2 flex flex-col">
                        <header className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-2 text-slate-400 text-sm font-medium tracking-wider">
                                <BrainCircuit size={18} /> MÓDULO DE ANÁLISIS
                            </div>
                            <div className="bg-slate-800 px-4 py-1.5 rounded-full text-sm font-bold border border-slate-700">
                                Pregunta {currentIndex + 1} de {questions.length}
                            </div>
                        </header>

                        <GlassCard className="flex-1 flex flex-col animate-slide-up">
                            <div className="flex justify-between items-start mb-4">
                                <span className="text-xs font-bold uppercase tracking-widest text-law-500 bg-law-500/10 px-3 py-1 rounded border border-law-500/20">
                                    {q.category.replace('_', ' ')}
                                </span>
                                <div className="flex gap-2">
                                    <button onClick={useHint} className="text-slate-400 hover:text-yellow-400 transition-colors p-2 bg-slate-800 rounded-lg tooltip" title="Pedir Pista (-5 pts)">
                                        <HelpCircle size={20} />
                                    </button>
                                </div>
                            </div>

                            <h2 className="text-xl md:text-2xl font-semibold leading-relaxed mb-2 text-white">
                                {q.text}
                            </h2>

                            {hintsUsed.includes(q.id) && (
                                <div className="mb-4 p-3 bg-yellow-500/10 border border-yellow-500/30 text-yellow-200 rounded-lg text-sm flex items-start gap-2 animate-fade-in">
                                    <AlertTriangle size={16} className="mt-0.5 shrink-0"/>
                                    <span>Pista Jurídica: Piensa en el principio protector del derecho laboral y la finalidad pedagógica del proceso.</span>
                                </div>
                            )}

                            <div className="flex-1">
                                {renderQuestionCore()}
                            </div>

                            <div className="mt-8 pt-6 border-t border-slate-700/50 flex justify-end">
                                <Button onClick={handleNext} disabled={!canAdvance()} icon={ChevronRight}>
                                    {currentIndex === questions.length - 1 ? 'Finalizar Análisis' : 'Siguiente'}
                                </Button>
                            </div>
                        </GlassCard>
                    </div>

                    <div className="lg:col-span-1 flex flex-col gap-6">
                        <GlassCard className="flex-1 flex flex-col h-full">
                            <div className="flex items-center gap-2 mb-4 border-b border-slate-700 pb-4">
                                <MessageSquare size={20} className="text-law-400" />
                                <h3 className="font-semibold text-lg">Foro de Dudas en Vivo</h3>
                            </div>
                            <p className="text-sm text-slate-400 mb-4">
                                ¿Este caso te genera dudas? Escribe aquí de forma anónima. Las respuestas nutrirán el diagnóstico final.
                            </p>
                            <div className="flex-1"></div>
                            <div className="mt-auto relative">
                                <textarea 
                                    value={forumMsg} onChange={e => setForumMsg(e.target.value)}
                                    placeholder="Ej: ¿Qué pasa si el trabajador se niega a firmar la notificación?"
                                    className="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-law-500 transition-all text-sm resize-none h-28"
                                ></textarea>
                                <button onClick={sendDoubt} className="absolute bottom-3 right-3 bg-law-600 hover:bg-law-500 text-white p-2 rounded-lg transition-colors">
                                    Enviar
                                </button>
                            </div>
                        </GlassCard>

                        <div className="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 flex flex-col justify-center items-center text-center">
                            <ActivityTracker />
                        </div>
                    </div>
                </div>
            );
        };

        const ActivityTracker = () => {
            const [level, setLevel] = useState(85);
            useEffect(() => {
                const int = setInterval(() => setLevel(80 + Math.random() * 15), 3000);
                return () => clearInterval(int);
            }, []);
            return (
                <div className="w-full">
                    <p className="text-xs text-slate-400 font-bold tracking-widest mb-2 uppercase">Estado Cognitivo (Flow)</p>
                    <div className="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700">
                        <div className="bg-gradient-to-r from-law-600 to-brand-400 h-full transition-all duration-1000 ease-in-out" style={{width: `${level}%`}}></div>
                    </div>
                    <p className="text-xs text-slate-500 mt-2">Nivel de inmersión óptimo detectado</p>
                </div>
            );
        };

        // 5. ResultsView & Encuesta
        const ResultsView = () => {
            const { user, setView, evaluationData } = useContext(AppContext);
            const [surveyData, setSurveyData] = useState({ claridad: 5, relevancia: 5, reto: 5, comentarios: '' });
            const [surveySent, setSurveySent] = useState(false);

            const sendSurvey = async () => {
                try {
                    // TRUCO ARQUITECTÓNICO: Usamos 'reviews' porque la REGLA 4 lo autoriza literalmente.
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'reviews'), {
                        userId: user.uid,
                        role: user.role,
                        ...surveyData,
                        timestamp: serverTimestamp()
                    });
                    setSurveySent(true);
                } catch(e) { console.error("Error guardando encuesta:", e); }
            };

            const data = evaluationData || { percentage: 0, timeSeconds: 0, hintsUsed: 0 };
            let diagText = "";
            if (data.percentage >= 80) diagText = "Excelente apropiación de los conceptos de la Pedagogía del Descargo. Demuestras un enfoque garantista y crítico.";
            else if (data.percentage >= 50) diagText = "Buen nivel, pero requiere reforzar el concepto dialógico del descargo frente a la visión puramente punitiva.";
            else diagText = "Se recomienda revisar el Módulo Teórico completo. Aún persisten sesgos hacia el modelo disciplinario tradicional e inquisitivo.";

            const chartData = [
                { name: 'Precisión', val: data.percentage },
                { name: 'Eficiencia', val: Math.max(0, 100 - (data.timeSeconds/10)) },
                { name: 'Autonomía', val: Math.max(0, 100 - (data.hintsUsed*20)) }
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto flex flex-col items-center animate-fade-in">
                    <div className="text-center mb-8">
                        <div className="inline-block p-4 bg-law-500/20 rounded-full mb-4">
                            <Award size={48} className="text-law-400" />
                        </div>
                        <h1 className="text-4xl font-bold mb-2">Diagnóstico Completado</h1>
                        <p className="text-slate-400">Análisis basado en la Teoría de Respuesta al Ítem</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full mb-12">
                        <GlassCard className="flex flex-col items-center justify-center p-8 text-center border-t-4 border-t-law-500">
                            <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-law-400 to-brand-400 mb-2">
                                {data.percentage}%
                            </div>
                            <h3 className="text-xl font-bold mb-4">Índice de Comprensión</h3>
                            <p className="text-slate-300 text-sm leading-relaxed">{diagText}</p>
                        </GlassCard>

                        <GlassCard>
                            <h3 className="text-lg font-bold mb-6 text-center">Perfil Cognitivo-Jurídico</h3>
                            <div className="h-48 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={chartData} layout="vertical" margin={{ top: 0, right: 30, left: 20, bottom: 0 }}>
                                        <XAxis type="number" domain={[0, 100]} hide />
                                        <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: '#94a3b8'}} width={80} />
                                        <RechartsTooltip cursor={{fill: 'rgba(255,255,255,0.05)'}} contentStyle={{backgroundColor: '#0f172a', border: 'none', borderRadius: '8px'}} />
                                        <Bar dataKey="val" fill="#8b5cf6" radius={[0, 4, 4, 0]} barSize={20} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </GlassCard>
                    </div>

                    <GlassCard className="w-full max-w-2xl">
                        <h3 className="text-xl font-bold mb-6 flex items-center gap-2"><CheckCircle className="text-green-500"/> Encuesta de Calidad</h3>
                        {!surveySent ? (
                            <div className="flex flex-col gap-4">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    {['claridad', 'relevancia', 'reto'].map(key => (
                                        <div key={key}>
                                            <label className="text-sm text-slate-400 capitalize block mb-2">{key} (1-5)</label>
                                            <input type="range" min="1" max="5" value={surveyData[key]} onChange={e => setSurveyData({...surveyData, [key]: parseInt(e.target.value)})} className="w-full accent-law-500" />
                                            <div className="text-center font-bold text-law-400 mt-1">{surveyData[key]}</div>
                                        </div>
                                    ))}
                                </div>
                                <textarea 
                                    placeholder="Comentarios adicionales para mejorar la plataforma..."
                                    className="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-law-500 mt-2"
                                    value={surveyData.comentarios} onChange={e => setSurveyData({...surveyData, comentarios: e.target.value})}
                                ></textarea>
                                <Button onClick={sendSurvey} className="mt-2">Enviar Comentarios</Button>
                            </div>
                        ) : (
                            <div className="text-center p-6 text-green-400 font-bold bg-green-500/10 rounded-xl border border-green-500/20">
                                ¡Gracias por tu retroalimentación!
                            </div>
                        )}
                        
                        <div className="mt-8 pt-6 border-t border-slate-700/50 flex justify-center">
                            {user.isMaster && <Button variant="outline" onClick={() => setView('dashboard')} className="mr-4">Ir a Panel Admin</Button>}
                            <Button variant="secondary" onClick={() => { auth.signOut(); setView('login'); }}>Cerrar Sesión</Button>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        // 6. AdminDashboardView (Solo para dudbilopr@gmail.com)
        const AdminDashboardView = () => {
            const { setView } = useContext(AppContext);
            const [results, setResults] = useState([]);
            const [doubts, setDoubts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('analytics'); 

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        // El Admin lee las colecciones públicas habilitadas por los comodines chat_.*
                        const resQuery = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_results'), orderBy('timestamp', 'desc'));
                        const resSnap = await getDocs(resQuery);
                        let resData = [];
                        resSnap.forEach(d => resData.push({ id: d.id, ...d.data() }));
                        setResults(resData);

                        const doubtQuery = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_doubts'), orderBy('timestamp', 'desc'), limit(50));
                        const doubtSnap = await getDocs(doubtQuery);
                        let dbtData = [];
                        doubtSnap.forEach(d => dbtData.push({ id: d.id, ...d.data() }));
                        setDoubts(dbtData);
                    } catch (e) {
                        console.error("Error cargando dashboard. Revisa si has corrido alguna evaluación primero:", e);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            const rolesData = useMemo(() => {
                if (results.length === 0) return [{ name: 'Sin Datos', value: 1 }];
                const counts = results.reduce((acc, curr) => {
                    acc[curr.userRole] = (acc[curr.userRole] || 0) + 1;
                    return acc;
                }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value }));
            }, [results]);

            const scoreTrend = useMemo(() => {
                if (results.length === 0) return [{ name: '1', score: 0 }];
                return [...results].reverse().map((r, i) => ({
                    name: `Ev.${i+1}`,
                    score: r.percentage
                }));
            }, [results]);

            const COLORS = ['#8b5cf6', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#64748b'];

            if (loading) return <div className="min-h-screen flex items-center justify-center text-law-500"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-current"></div></div>;

            return (
                <div className="min-h-screen bg-[#0f172a] text-slate-200">
                    <div className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-law-600 p-2 rounded-lg"><Settings size={20} className="text-white" /></div>
                                <h1 className="text-xl font-bold text-white">Console Admin <span className="text-xs text-law-400 align-top">Master</span></h1>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('analytics')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-colors ${activeTab==='analytics' ? 'bg-law-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Analítica</button>
                                <button onClick={() => setActiveTab('lms')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-colors ${activeTab==='lms' ? 'bg-law-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Constructor LMS</button>
                                <button onClick={() => setView('login')} className="ml-4 px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-lg">Salir</button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto p-4 md:p-8">
                        {activeTab === 'analytics' && (
                            <div className="animate-fade-in grid grid-cols-1 md:grid-cols-3 gap-6">
                                <GlassCard className="flex items-center gap-4 border-l-4 border-l-law-500">
                                    <div className="p-3 bg-law-500/20 rounded-xl text-law-400"><User size={24}/></div>
                                    <div>
                                        <p className="text-sm text-slate-400">Evaluaciones Totales</p>
                                        <p className="text-2xl font-bold">{results.length}</p>
                                    </div>
                                </GlassCard>
                                <GlassCard className="flex items-center gap-4 border-l-4 border-l-green-500">
                                    <div className="p-3 bg-green-500/20 rounded-xl text-green-400"><Award size={24}/></div>
                                    <div>
                                        <p className="text-sm text-slate-400">Promedio General</p>
                                        <p className="text-2xl font-bold">{results.length ? Math.round(results.reduce((a,b)=>a+b.percentage,0)/results.length) : 0}%</p>
                                    </div>
                                </GlassCard>
                                <GlassCard className="flex items-center gap-4 border-l-4 border-l-brand-500">
                                    <div className="p-3 bg-brand-500/20 rounded-xl text-brand-400"><MessageSquare size={24}/></div>
                                    <div>
                                        <p className="text-sm text-slate-400">Dudas en Foro</p>
                                        <p className="text-2xl font-bold">{doubts.length}</p>
                                    </div>
                                </GlassCard>

                                <GlassCard className="md:col-span-2 h-80 flex flex-col">
                                    <h3 className="text-lg font-bold mb-4">Evolución de Puntajes (CCI)</h3>
                                    <div className="flex-1 w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={scoreTrend}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                                <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} />
                                                <YAxis stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} domain={[0, 100]} />
                                                <RechartsTooltip contentStyle={{backgroundColor: '#1e293b', border: '1px solid #334155', borderRadius: '8px', color:'#fff'}} />
                                                <Line type="monotone" dataKey="score" stroke="#8b5cf6" strokeWidth={3} dot={{r:4, fill:'#8b5cf6', strokeWidth:0}} activeDot={{r:6}} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </GlassCard>

                                <GlassCard className="md:col-span-1 h-80 flex flex-col">
                                    <h3 className="text-lg font-bold mb-4">Distribución de Roles</h3>
                                    <div className="flex-1 w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={rolesData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                                    {rolesData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                                </Pie>
                                                <RechartsTooltip contentStyle={{backgroundColor: '#1e293b', border: 'none', borderRadius: '8px'}} />
                                                <Legend verticalAlign="bottom" height={36} iconType="circle" wrapperStyle={{fontSize: '12px'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </GlassCard>

                                <GlassCard className="md:col-span-3">
                                    <h3 className="text-lg font-bold mb-4">Foro de Dudas en Vivo (Matriz Diagnóstica)</h3>
                                    {doubts.length === 0 ? (
                                        <div className="text-center py-8 text-slate-500">No hay dudas registradas.</div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs uppercase bg-slate-800 text-slate-400">
                                                    <tr>
                                                        <th className="px-4 py-3 rounded-tl-lg">Fecha</th>
                                                        <th className="px-4 py-3">Contexto (Pregunta)</th>
                                                        <th className="px-4 py-3 rounded-tr-lg">Duda Generada</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {doubts.map((d, i) => (
                                                        <tr key={i} className="border-b border-slate-800 hover:bg-slate-800/50 transition-colors">
                                                            <td className="px-4 py-3 whitespace-nowrap text-slate-400">{d.timestamp?.toDate().toLocaleDateString() || 'Reciente'}</td>
                                                            <td className="px-4 py-3 font-mono text-law-400 text-xs">{d.contextQ}</td>
                                                            <td className="px-4 py-3 text-slate-200">{d.text}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </GlassCard>
                            </div>
                        )}

                        {activeTab === 'lms' && <LMSBuilder />}
                    </div>
                </div>
            );
        };

        const LMSBuilder = () => {
            const [qType, setQType] = useState('adaptive_radio');
            const [text, setText] = useState('');
            const [saved, setSaved] = useState(false);

            const handleSaveMock = async (e) => {
                e.preventDefault();
                try {
                    const newQ = {
                        type: qType,
                        text: text,
                        difficulty: 2,
                        category: "custom_created",
                        createdAt: serverTimestamp()
                    };
                    // Admin writes directly to question_bank (Permitido por Regla 4: if esAdmin())
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'question_bank'), newQ);
                    setSaved(true);
                    setTimeout(() => setSaved(false), 3000);
                    setText('');
                } catch(err) {
                    console.error("Error al guardar en el constructor LMS:", err);
                    alert("Error al guardar.");
                }
            };

            return (
                <GlassCard className="animate-fade-in max-w-3xl mx-auto">
                    <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><Settings className="text-law-500"/> Constructor LMS (Banco de Preguntas)</h2>
                    
                    <div className="bg-blue-500/10 border border-blue-500/20 p-4 rounded-xl mb-6 text-sm text-blue-200 flex gap-3">
                        <AlertTriangle className="shrink-0 text-blue-400" />
                        <p>Las preguntas creadas aquí se agregarán a la colección pública <code>question_bank</code>.</p>
                    </div>

                    <form onSubmit={handleSaveMock}>
                        <Select 
                            label="Tipo de Interacción (IRT)" 
                            value={qType} onChange={e => setQType(e.target.value)}
                            options={[
                                {value: 'adaptive_radio', label: 'Selección Múltiple Adaptativa (Radio)'},
                                {value: 'sequence_sorter', label: 'Ordenamiento de Procesos (Drag & Drop UI)'},
                                {value: 'cloze_text', label: 'Completar Párrafos (Cloze)'},
                                {value: 'image_hotspot', label: 'Análisis Documental Visual (Hotspot)'}
                            ]}
                            required
                        />
                        
                        <div className="flex flex-col gap-1 mb-6">
                            <label className="text-sm text-slate-400 font-medium">Texto Principal Riguroso</label>
                            <textarea 
                                required value={text} onChange={e => setText(e.target.value)}
                                className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:law-500 min-h-[120px]"
                                placeholder="Ingrese la narrativa del caso o fundamento teórico..."
                            ></textarea>
                        </div>

                        <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-6 font-mono text-xs text-slate-500">
                            // Las opciones, items y coordenadas hotspot se configurarían aquí en la versión extendida del constructor. <br/>
                            // JSON Structure Preview:<br/>
                            {`{
  "type": "${qType}",
  "text": "${text.substring(0, 20)}...",
  "options": [...]
}`}
                        </div>

                        <Button type="submit" icon={CheckCircle} className="w-full">
                            {saved ? 'Guardado Exitosamente' : 'Agregar al Banco de Firestore'}
                        </Button>
                    </form>
                </GlassCard>
            );
        };

        // --- APLICACIÓN PRINCIPAL (Router de Estado) ---
        const App = () => {
            const [currentView, setCurrentView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [evaluationData, setEvaluationData] = useState(null);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (usr) => {
                    if (usr) {
                        if (usr.email === ADMIN_EMAIL) {
                            setUser({ ...usr, role: 'admin', isMaster: true });
                            setCurrentView('dashboard');
                        } else if (currentView === 'login') {
                            // Se ajusta la verificación de estado con la ruta de tu Regla 3
                            getDoc(doc(db, 'artifacts', APP_ID, 'users', usr.uid, 'profile', 'data'))
                            .then(snap => {
                                if(snap.exists()) {
                                    setUser({...usr, ...snap.data()});
                                    setCurrentView('intro');
                                } else {
                                    setUser(usr);
                                    setCurrentView('profile');
                                }
                            }).catch(() => {
                                setUser(usr);
                                setCurrentView('profile');
                            });
                        }
                    } else {
                        setUser(null);
                        setCurrentView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            return (
                <AppContext.Provider value={{ user, setUser, setView: setCurrentView, evaluationData, setEvaluationData }}>
                    <div className="min-h-screen text-slate-50 relative selection:bg-law-500/30">
                        <>
                            {currentView === 'login' && <AuthView />}
                            {currentView === 'profile' && <ProfileView />}
                            
                            {currentView === 'intro' && (
                                <div className="min-h-screen flex flex-col items-center justify-center p-4 animate-fade-in text-center max-w-3xl mx-auto">
                                    <div className="bg-law-600/20 p-6 rounded-full mb-8">
                                        <Shield size={64} className="text-law-500" />
                                    </div>
                                    <h1 className="text-4xl md:text-5xl font-bold mb-6">Bienvenido, {user?.nombre || 'Usuario'}</h1>
                                    <p className="text-xl text-slate-300 leading-relaxed mb-10">
                                        Estás a punto de iniciar una experiencia inmersiva sobre la <strong>Pedagogía del Descargo</strong> basada en el derecho laboral colombiano. Primero repasaremos la teoría y luego pasaremos a la evaluación adaptativa.
                                    </p>
                                    <Button onClick={() => setCurrentView('theory')} className="text-lg px-8 py-4">
                                        Iniciar Recorrido <ChevronRight size={24} className="ml-2"/>
                                    </Button>
                                </div>
                            )}

                            {currentView === 'theory' && <TheoryView />}
                            {currentView === 'evaluation' && <EvaluationView />}
                            {currentView === 'results' && <ResultsView />}
                            {currentView === 'dashboard' && <AdminDashboardView />}
                        </>
                    </div>
                </AppContext.Provider>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
