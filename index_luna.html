        // --- BANCO DE PREGUNTAS BASE (AMPLIADO CON CLOZE TEXT Y TEMÁTICAS) ---
        const QUESTION_BANK = [

                    { id: "C", text: "Es una etapa obligatoria antes de negociar la renuncia de un empleado.", isCorrect: false, feedback: "Incorrecto. Su fin no es coaccionar la renuncia, sino investigar hechos." }

                blanks: [

            {

                    { id: "B", text: "Las reglas establecidas exclusivamente en el contrato verbal.", isCorrect: false, feedback: "Incompleto. Se requieren documentos formales que tipifiquen las faltas." },

            {

                level: 3,

                expectedTime: 90,
                title: "Análisis del Proceso (Pasos)",
                context: "Eres el encargado de Recursos Humanos. Ha llegado el reporte de una falta grave.",
                question: "Arrastra y ordena cronológicamente los pasos obligatorios para ejecutar un proceso disciplinario legal.",
                items: [
                    { id: "s1", content: "Recepción de informe, queja o hallazgo." },
                    { id: "s2", content: "Citación formal a diligencia de descargos (indicando hechos y pruebas)." },
                    { id: "s3", content: "Diligencia de descargos (escuchar al empleado y recibir sus pruebas)." },
                    { id: "s4", content: "Evaluación objetiva de pruebas y descargos." },
                    { id: "s5", content: "Notificación de la decisión (Sanción o Archivo) con posibilidad de recursos." }
                ],
                tip: "Primero te enteras, luego llamas, luego escuchas, luego piensas, y al final decides."
            },
            {
                id: "q7_corte_constitucional",
                theme: "Jurisprudencia",
                type: "adaptive_radio",
                level: 4,
                difficulty: 0.75,
                expectedTime: 75,
                title: "El Debido Proceso (Sentencia C-593/14)",
                context: "Un gerente sorprende a un operario durmiendo en su turno. Enojado, redacta un memorando inmediato que dice: 'Queda usted suspendido por 8 días por falta grave. Firme el recibido'.",
                question: "Según la Corte Constitucional de Colombia (ej. Sentencia C-593/14), ¿cuál es el error insubsanable de este actuar?",
                options: [
                    { id: "A", text: "La suspensión máxima permitida por ley para la primera vez es de 5 días, no de 8.", isCorrect: false, feedback: "Incorrecto. La ley permite hasta 8 días la primera vez (Art. 112 CST), el error es otro de fondo." },
                    { id: "B", text: "Impuso la sanción 'de plano', omitiendo el derecho de defensa, la citación a descargos y la controversia probatoria.", isCorrect: true, feedback: "¡Excelente! La jurisprudencia colombiana prohíbe las sanciones automáticas o 'de plano'. Siempre debe haber un proceso previo." },
                    { id: "C", text: "El memorando no fue avalado previamente por el Ministerio del Trabajo.", isCorrect: false, feedback: "El Ministerio no avala sanciones disciplinarias rutinarias del reglamento." }
                ],
                tip: "Por más evidente que sea la falta (en flagrancia), el derecho a defenderse es irrenunciable."
            },
            {
                id: "q8_inmediatez",
                theme: "Jurisprudencia",
                type: "adaptive_radio",
                level: 5,
                difficulty: 0.8,
                expectedTime: 80,
                title: "Principio de Inmediatez (SU-449/2020)",
                context: "El 15 de enero, Auditoría descubre con pruebas en video que un cajero hurtó dinero. Sin embargo, Recursos Humanos decide esperar hasta el 20 de agosto del mismo año para citarlo a descargos, argumentando 'alta carga laboral'.",
                question: "¿Qué ocurre jurídicamente con este proceso disciplinario bajo la ley laboral colombiana?",
                options: [
                    { id: "A", text: "Es totalmente válido, ya que las faltas laborales graves prescriben a los 3 años en Colombia.", isCorrect: false, feedback: "Confundes la prescripción de derechos laborales (salarios) con la facultad sancionatoria." },
                    { id: "B", text: "Se invalida por violar el 'Principio de Inmediatez'. El empleador perdonó tácitamente la falta al dejar pasar un tiempo irrazonable.", isCorrect: true, feedback: "¡Correcto! Debe existir una relación de cercanía temporal entre el conocimiento de la falta y el inicio del proceso (Corte Suprema y Constitucional)." },
                    { id: "C", text: "Se debe pagar una indemnización al empleado, pero la sanción o despido se mantiene firme.", isCorrect: false, feedback: "Si se viola la inmediatez, el despido se torna injusto, obligando a indemnizar y/o reintegrar." }
                ],
                tip: "Si el empleador no actúa pronto tras conocer la falta, la ley asume que 'condonó' o perdonó la conducta."
            },
            {
                id: "q9_pruebas_ilicitas",
                theme: "Pruebas",
                type: "adaptive_radio",
                level: 6,
                difficulty: 0.85,
                expectedTime: 85,
                title: "Pruebas Ilícitas y Privacidad",
                context: "Para probar que una ejecutiva de cuentas está filtrando clientes a la competencia, el área de TI instala un software espía e intercepta las conversaciones de su WhatsApp personal sin orden judicial.",
                question: "¿Es válida esta prueba para sustentar un despido con justa causa en diligencia de descargos?",
                options: [
                    { id: "A", text: "Sí, siempre y cuando el Reglamento Interno advierta que la empresa puede vigilar las comunicaciones para proteger su patrimonio.", isCorrect: false, feedback: "Un reglamento interno jamás puede estar por encima de la Constitución Nacional." },
                    { id: "B", text: "Sí, porque el derecho de la empresa a la libre competencia y a evitar fraudes prima sobre la privacidad del empleado infractor.", isCorrect: false, feedback: "Falso. Los derechos fundamentales no se suspenden por la subordinación laboral." },
                    { id: "C", text: "No. Constituye una prueba ilícita obtenida con violación al derecho fundamental a la intimidad (Art. 15 Constitución), haciendo nulo el proceso.", isCorrect: true, feedback: "¡Preciso! Toda prueba obtenida violando derechos fundamentales es nula de pleno derecho e inutilizable procesalmente." }
                ],
                tip: "En Colombia (Art. 29 CN), es nula de pleno derecho la prueba obtenida con violación del debido proceso y la intimidad."
            },
            {
                id: "q4_sanciones",
                theme: "Sanciones",
                type: "image_hotspot",
                level: 8,
                difficulty: 0.7,
                expectedTime: 70,
                title: "Auditoría de Sanciones",
                imageUrl: "https://images.unsplash.com/photo-1555374018-1c4fa4782202?auto=format&fit=crop&q=80&w=800",
                context: "Revisando el Reglamento Interno de una empresa, encuentras la tabla de sanciones.",
                question: "Haz clic en la sanción que es ILEGAL según el Art. 112 del Código Sustantivo del Trabajo (Colombia).",
                hotspots: [
                    { id: "h1", x: 25, y: 35, isCorrect: false, text: "Llamado de atención verbal con copia a la hoja de vida." },
                    { id: "h2", x: 65, y: 70, isCorrect: true, text: "Suspensión del contrato por 45 días en la primera llegada tarde." },
                    { id: "h3", x: 75, y: 15, isCorrect: false, text: "Multa equivalente a la 5ta parte de un día por retraso." }
                ],
                tip: "Las leyes laborales prohíben suspensiones mayores a 8 días por la primera vez que se comete una falta."
            }
        ];

        // --- COMPONENTE PRINCIPAL APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading'); 
            const [studentInfo, setStudentInfo] = useState({ 
                name: '', email: '', role: '', experience: '', 
                bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false 
            });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [dbQuestions, setDbQuestions] = useState([]); // Preguntas desde Firebase
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null, tipsUsed: 0, answers: [] });
            const [feedback, setFeedback] = useState(null);
            
            // Estado de la nueva encuesta
            const [surveyData, setSurveyData] = useState({ clarity: 0, relevance: 0, difficultyLevel: 0, comments: '', submitted: false });
            
            // Estado para Admin
            const [adminAuth, setAdminAuth] = useState({ isChecking: false, password: '', error: '' });

            // El banco activo será el de la base de datos si existe, si no el local.
            const activeQuestionBank = dbQuestions.length > 0 ? dbQuestions : QUESTION_BANK;
            const currentQ = activeQuestionBank[currentQIndex];

            // 1. AUTO-LOGIN Y AUTENTICACIÓN
            useEffect(() => {
                const savedProfile = localStorage.getItem('lexQuest_userProfile');
                if (savedProfile) {
                    setStudentInfo(JSON.parse(savedProfile));
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); } 
                            catch (e) { await signInAnonymously(auth).catch(() => {}); }
                        } else {
                            await signInAnonymously(auth).catch(() => {});
                        }
                    } catch (err) { console.warn("Modo fallback activo."); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) {
                        setUser(u || { uid: 'local_user' });
                        if (JSON.parse(savedProfile).role || JSON.parse(savedProfile).learningGoal) {
                            setView('intro');
                        } else {
                            setView('profile');
                        }
                    } else {
                        setUser(u || { uid: 'guest_user' });
                        setView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Escucha de Telemetría y Preguntas DB
            useEffect(() => {
                // Fetch Logs
                const qLogs = collection(db, COLLECTION_PATH);
                const unsubLogs = onSnapshot(qLogs, (snap) => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                
                // Fetch Questions from Database
                const fetchQuestions = async () => {
                    try {
                        const snap = await getDocs(collection(db, QUESTIONS_PATH));
                        if (!snap.empty) {
                            setDbQuestions(snap.docs.map(doc => doc.data()));
                        }
                    } catch(e) { console.warn("Usando banco de preguntas local."); }
                };
                fetchQuestions();

                return () => unsubLogs();
            }, []);

            // --- MANEJADORES DE EVENTOS ---
            const handleManualLogin = () => {
                localStorage.setItem('lexQuest_userProfile', JSON.stringify(studentInfo));
                setView('profile');
            };

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    const newInfo = { ...studentInfo, name: result.user.displayName, email: result.user.email };
                    setStudentInfo(newInfo);
                    localStorage.setItem('lexQuest_userProfile', JSON.stringify(newInfo));
                    setUser(result.user);
                    setView('profile');
                } catch (error) {
                    if (error.code === 'auth/unauthorized-domain') {
                        setAuthError(`DOMINIO NO AUTORIZADO: Copia el dominio actual y autorízalo en Firebase.`);
                    } else if (error.code !== 'auth/popup-closed-by-user') {
                        setAuthError(`Error: ${error.message}. Usa el registro manual.`);
                    }
                }
            };

            const saveProfile = () => {
                localStorage.setItem('lexQuest_userProfile', JSON.stringify(studentInfo));
                setView('intro');
            };

            const submitSurvey = async () => {
                try {
                    await addDoc(collection(db, SURVEYS_PATH), {
                        ...surveyData,
                        studentName: studentInfo.name,
                        studentRole: studentInfo.role,
                        score: score,
                        timestamp: serverTimestamp()
                    });
                    setSurveyData({...surveyData, submitted: true});
                } catch (e) {
                    setSurveyData({...surveyData, submitted: true}); // Simular éxito si bloquea FB
                }
            };

            const handleAdminLogin = () => {
                if(adminAuth.password === 'admin123') {
                    setView('dashboard');
                    setAdminAuth({isChecking: false, password: '', error: ''});
                } else {
                    setAdminAuth({...adminAuth, error: 'Contraseña incorrecta'});
                }
            };

            // MOTOR ADAPTATIVO IRT
            const submitAnswer = async (isCorrect, usedTip = false) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e) / t_e) + (usedTip ? 0.5 : 0);
                const pointsEarned = isCorrect ? (100 * currentQ.difficulty) - (usedTip ? 15 : 0) : 0;
                const finalPoints = Math.max(0, pointsEarned);

                // Cálculo neurocognitivo básico
                let neuroState = "Normal";
                if(timeSpent < (t_e * 0.3) && !isCorrect) neuroState = "Impulsividad";
                else if (timeSpent > (t_e * 1.5) && isCorrect) neuroState = "Duda / Hesitación";
                else if (timeSpent > (t_e * 1.5) && !isCorrect) neuroState = "Sobrecarga Cognitiva";
                else if (timeSpent <= t_e && isCorrect) neuroState = "Estado de Flujo";

                const answerData = {
                    qId: currentQ.id,
                    title: currentQ.title,
                    isCorrect,
                    timeSpent,
                    points: finalPoints,
                    difficulty: currentQ.difficulty,
                    neuroState
                };

                const logEntry = {
                    studentName: studentInfo.name || 'Anónimo',
                    studentRole: studentInfo.role || 'Estudiante Libre',
                    questionId: currentQ.id,
                    theme: currentQ.theme || "General",
                    isCorrect,
                    timeSpent,
                    expectedTime: t_e,
                    usedTip,
                    frustrationIndex: frustration,
                    neuroState,
                    points: finalPoints,
                    timestamp: serverTimestamp()
                };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) { console.warn("Guardado local."); }

                setScore(prev => prev + finalPoints);
                setSessionData(prev => ({ 
                    ...prev, 
                    tipsUsed: prev.tipsUsed + (usedTip ? 1 : 0),
                    answers: [...prev.answers, answerData]
                }));

                // Feedback visual en vivo
                setFeedback({ isCorrect, timeSpent, expectedTime: t_e, neuroState });

                setTimeout(() => {
                    setFeedback(null);
                    const answeredCount = sessionData.answers.length + 1;
                    
                    if (answeredCount < activeQuestionBank.length) {
                        // LOGICA ADAPTATIVA: Buscar preguntas no respondidas y seleccionar aleatoriamente la más cercana al nivel adaptado.
                        let nextQIndex = currentQIndex + 1;
                        const unasked = activeQuestionBank.map((q, i) => ({q, i})).filter(item => !sessionData.answers.some(a => a.qId === item.q.id) && item.q.id !== currentQ.id);

                        if (unasked.length > 0) {
                            let targetDiff = currentQ.difficulty + (isCorrect ? 0.15 : -0.15);
                            // Barajar ligeramente para evitar secuencias rígidas antes de ordenar por dificultad
                            unasked.sort(() => Math.random() - 0.5); 
                            unasked.sort((a, b) => Math.abs(a.q.difficulty - targetDiff) - Math.abs(b.q.difficulty - targetDiff));
                            nextQIndex = unasked[0].i;
                        }

                        setCurrentQIndex(nextQIndex);
                        setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { 
                        setView('results'); 
                    }
                }, 4000); 
            };

            const logout = () => {
                localStorage.removeItem('lexQuest_userProfile');
                setStudentInfo({ name: '', email: '', role: '', experience: '', bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false });
                auth.signOut();
                setView('login');
            };

            // --- COMPONENTES INTERACTIVOS DE EVALUACIÓN ---

            const ProgressBar = () => {
                const progress = (sessionData.answers.length / activeQuestionBank.length) * 100;
                return (
                    <div className="w-full bg-slate-700 rounded-full h-3 mb-6 overflow-hidden border border-slate-600">
                        <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                    </div>
                );
            };

            const AdaptiveRadio = () => {
                const [selected, setSelected] = useState(null);
                const [tipRevealed, setTipRevealed] = useState(false);
                
                // Mezcla aleatoria de opciones al montar la pregunta
                const shuffledOptions = useMemo(() => [...currentQ.options].sort(() => Math.random() - 0.5), [currentQ.id]);

                const handleCheck = () => {
                    const option = shuffledOptions.find(o => o.id === selected);
                    setFeedback({ isCorrect: option.isCorrect, text: option.feedback });
                    submitAnswer(option.isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 italic mb-4 p-4 border-l-4 border-blue-500 bg-slate-800/50">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="space-y-3">
                            {shuffledOptions.map(opt => (
                                <div key={opt.id} onClick={() => !feedback && setSelected(opt.id)}
                                     className={`p-4 rounded-lg border cursor-pointer transition-all flex items-start ${selected === opt.id ? 'border-blue-400 bg-blue-900/30 shadow-[0_0_15px_rgba(59,130,246,0.3)]' : 'border-slate-600 bg-slate-800 hover:bg-slate-700'} ${feedback ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                    <div className={`w-6 h-6 rounded-full border-2 mr-4 flex-shrink-0 flex items-center justify-center ${selected === opt.id ? 'border-blue-400' : 'border-slate-500'}`}>
                                        {selected === opt.id && <div className="w-3 h-3 bg-blue-400 rounded-full"></div>}
                                    </div>
                                    <span className="text-slate-200 leading-relaxed">{opt.text}</span>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                            {!tipRevealed ? (
                                <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Consultar Pista Jurídica (-15 pts)</button>
                            ) : (<p className="text-sm text-yellow-400 bg-yellow-900/20 p-3 rounded-lg border border-yellow-700/50 flex items-center"><Info className="w-5 h-5 mr-2 flex-shrink-0"/> {currentQ.tip}</p>)}
                            <button onClick={handleCheck} disabled={!selected || feedback} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold disabled:opacity-50 transition-colors shadow-lg">Validar Análisis</button>
                        </div>
                    </div>
                );
            };

            const SequenceSorter = () => {
                const [items, setItems] = useState([...currentQ.items].sort(() => Math.random() - 0.5));
                const [tipRevealed, setTipRevealed] = useState(false);
                const moveItem = (index, dir) => {
                    const newItems = [...items];
                    if (dir === -1 && index > 0) [newItems[index], newItems[index-1]] = [newItems[index-1], newItems[index]];
                    else if (dir === 1 && index < items.length - 1) [newItems[index], newItems[index+1]] = [newItems[index+1], newItems[index]];
                    setItems(newItems);
                };
                const handleCheck = () => {
                    const isCorrect = items.every((item, idx) => item.id === currentQ.items[idx].id);
                    setFeedback({ isCorrect, text: isCorrect ? "Secuencia procesal garantista perfecta." : "Violación al debido proceso. El orden en que ejerces las acciones es vital para no viciar el proceso." });
                    submitAnswer(isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 mb-4 bg-slate-800/50 p-4 border-l-4 border-indigo-500 italic">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="space-y-3 bg-slate-900/50 p-5 rounded-xl border border-slate-700">
                            {items.map((item, idx) => (
                                <div key={item.id} className="flex items-center p-3 bg-slate-800 rounded-lg border border-slate-600 shadow-sm cursor-move">
                                    <div className="font-bold text-slate-500 mr-4 w-6 text-center">{idx + 1}</div>
                                    <span className="font-medium flex-grow text-slate-200">{item.content}</span>
                                    <div className="flex space-x-2">
                                        <button onClick={() => moveItem(idx, -1)} disabled={idx === 0 || feedback} className="p-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30 transition-colors">▲</button>
                                        <button onClick={() => moveItem(idx, 1)} disabled={idx === items.length - 1 || feedback} className="p-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30 transition-colors">▼</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                             {!tipRevealed ? <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Consultar Jurisprudencia (-15 pts)</button> : <p className="text-sm text-yellow-400 bg-yellow-900/20 p-3 rounded-lg flex items-center"><Info className="w-5 h-5 mr-2 flex-shrink-0"/>{currentQ.tip}</p>}
                            <button onClick={handleCheck} disabled={feedback} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold disabled:opacity-50 shadow-lg">Sellar Expediente</button>
                        </div>
                    </div>
                );
            };

            const ClozeText = () => {
                const [answers, setAnswers] = useState({});
                const [tipRevealed, setTipRevealed] = useState(false);
                const handleSelect = (blankId, val) => setAnswers(prev => ({...prev, [blankId]: val}));
                const handleCheck = () => {
                    let allCorrect = true;
                    currentQ.blanks.forEach(b => { if (answers[b.id] !== b.answer) allCorrect = false; });
                    setFeedback({ isCorrect: allCorrect, text: allCorrect ? "Integración conceptual perfecta." : "Existen errores de concordancia legal en los conceptos seleccionados." });
                    submitAnswer(allCorrect, tipRevealed);
                };

                const renderText = () => {
                    let parts = currentQ.codeTemplate.split(/(\[HUECO_\d+\])/g);
                    return parts.map((part, i) => {
                        const match = part.match(/\[(HUECO_\d+)\]/);
                        if (match) {
                            const blank = currentQ.blanks.find(b => b.id === match[1]);
                            return (
                                <select key={i} value={answers[blank.id] || ""} onChange={(e) => handleSelect(blank.id, e.target.value)} disabled={feedback !== null}
                                    className="mx-2 bg-slate-800 text-blue-300 border-b-2 border-blue-500 px-2 py-1 outline-none text-base font-bold appearance-none cursor-pointer hover:bg-slate-700 transition-colors">
                                    <option value="" disabled>___ Seleccionar ___</option>
                                    {blank.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                            );
                        }
                        return <span key={i} className="leading-loose text-lg">{part}</span>;
                    });
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 bg-slate-800/50 p-4 border-l-4 border-indigo-500 italic">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="bg-slate-900 border border-slate-700 rounded-xl p-6 text-slate-200">
                            {renderText()}
                        </div>
                        <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                            {!tipRevealed ? <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Pista (-15 pts)</button> : <span className="text-sm text-yellow-400 flex items-center"><Info className="w-5 h-5 mr-2"/>{currentQ.tip}</span>}
                            <button onClick={handleCheck} disabled={Object.keys(answers).length < currentQ.blanks.length || feedback} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold disabled:opacity-50 shadow-lg">Completar Documento</button>
                        </div>
                    </div>
                );
            };

            const ImageHotspot = () => {
                const [tipRevealed, setTipRevealed] = useState(false);
                const handleHotspotClick = (hotspot) => {
                    if (feedback) return;
                    setFeedback({ isCorrect: hotspot.isCorrect, text: hotspot.isCorrect ? "¡Hallazgo correcto! Identificaste una sanción desproporcionada que contraviene el Código Sustantivo del Trabajo." : "Error de auditoría. Esa sanción es válida dentro de ciertos parámetros laborales." });
                    submitAnswer(hotspot.isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 bg-slate-800/50 p-4 border-l-4 border-blue-500 italic">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="relative border-4 border-slate-700 rounded-xl overflow-hidden bg-slate-800 h-96 flex items-center justify-center shadow-inner">
                            <img src={currentQ.imageUrl} alt="Reglamento" className="object-cover w-full h-full opacity-30 grayscale blur-[1px]" />
                            <div className="absolute inset-0 p-8 flex flex-col justify-between font-serif text-slate-800 text-sm" style={{background: 'rgba(250,250,245,0.92)'}}>
                                <div className="text-center font-bold border-b-2 border-slate-800 pb-4 mb-4 text-lg tracking-widest">REGLAMENTO INTERNO DE TRABAJO<br/><span className="text-sm font-normal">Capítulo: Régimen Sancionatorio</span></div>
                                <div className="space-y-6 flex-grow">
                                    <p className="font-semibold text-red-800">TABLA DE SANCIONES APLICABLES:</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 50.</strong> Faltas leves (Ej. Retraso de 10 min):<br/> - Llamado de atención escrito con copia al expediente.</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 51.</strong> Retraso reiterado (Tercera vez):<br/> - Multa equivalente a la 5ta parte de un día de salario.</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 52.</strong> Faltas graves (Ej. Ausencia injustificada 1 día):<br/> - Suspensión del contrato de trabajo por 45 días hábiles.</p>
                                </div>
                            </div>
                            {currentQ.hotspots.map(h => (
                                <button key={h.id} onClick={() => handleHotspotClick(h)} style={{ left: `${h.x}%`, top: `${h.y}%` }}
                                    className={`absolute w-12 h-12 -ml-6 -mt-6 rounded-full border-2 border-blue-600 bg-blue-500/30 hotspot-pulse hover:bg-blue-500/60 transition-colors z-10 ${feedback ? 'pointer-events-none opacity-0' : ''}`}
                                />
                            ))}
                        </div>
                        <div className="flex justify-between items-center pt-4">
                            {!tipRevealed && !feedback && <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Consultar CST (-15 pts)</button>}
                            {tipRevealed && !feedback && <p className="text-sm text-yellow-400 bg-yellow-900/20 p-2 rounded flex items-center"><Info className="w-5 h-5 mr-2"/>{currentQ.tip}</p>}
                        </div>
                    </div>
                );
            };

            const renderCurrentInteraction = () => {
                if(!currentQ) return <div className="text-center p-10"><Activity className="animate-spin mx-auto w-10 h-10"/></div>;
                switch(currentQ.type) {
                    case 'adaptive_radio': return <AdaptiveRadio />;
                    case 'sequence_sorter': return <SequenceSorter />;
                    case 'image_hotspot': return <ImageHotspot />;
                    case 'cloze_text': return <ClozeText />;
                    default: return <div>Interacción en Construcción</div>;
                }
            };

            // --- PANEL ESTADÍSTICO DETALLADO Y NEUROCOGNITIVO (ADMIN) ---
            const DashboardView = () => {
                const calculateMetrics = () => {
                    const metrics = {};
                    let neuroCounts = { "Impulsividad": 0, "Duda / Hesitación": 0, "Sobrecarga Cognitiva": 0, "Estado de Flujo": 0, "Normal": 0 };
                    
                    activeQuestionBank.forEach(q => {
                        const qLogs = logs.filter(l => l.questionId === q.id);
                        const Nt = qLogs.length;
                        if (Nt === 0) return;
                        const Nc = qLogs.filter(l => l.isCorrect).length;
                        const p = parseFloat((Nc / Nt).toFixed(2));
                        const D = parseFloat(((p > 0.5) ? (p * 0.8) : (p * 1.2)).toFixed(2));
                        const avgFrust = parseFloat((qLogs.reduce((acc, curr) => acc + curr.frustrationIndex, 0) / Nt).toFixed(2));
                        
                        qLogs.forEach(l => { if(l.neuroState && neuroCounts[l.neuroState] !== undefined) neuroCounts[l.neuroState]++; });

                        let diagnostico = "";
                        if (p < 0.3) diagnostico = "Muy difícil / Confusa";
                        else if (p > 0.8) diagnostico = "Muy fácil / Consolidación";
                        else if (D > 0.4) diagnostico = "Excelente discriminación";
                        else diagnostico = "Discriminación estándar";

                        metrics[q.id] = { id: q.id, title: q.title, theme: q.theme, p, D, If: avgFrust, Nt, diagnostico };
                    });
                    
                    const neuroData = Object.keys(neuroCounts).filter(k => k !== "Normal" && neuroCounts[k] > 0).map(k => ({ name: k, value: neuroCounts[k] }));
                    return { itemMetrics: Object.values(metrics), neuroData };
                };
                
                const { itemMetrics, neuroData } = calculateMetrics();
                const COLORS = ['#ef4444', '#f59e0b', '#8b5cf6', '#10b981'];

                // NUEVO: Generador de datos para Curva Característica del Ítem (CCI)
                const generateCCIData = () => {
                    const data = [];
                    for (let theta = -3; theta <= 3; theta += 0.5) {
                        // Usando la función logística del modelo 2PL: P(θ) = 1 / (1 + e^(-a(θ - b)))
                        data.push({
                            theta,
                            'Ítem Fácil (b=-1.5, a=1.2)': parseFloat((1 / (1 + Math.exp(-1.2 * (theta - (-1.5))))).toFixed(3)),
                            'Ítem Medio (b=0, a=1.0)': parseFloat((1 / (1 + Math.exp(-1.0 * (theta - 0)))).toFixed(3)),
                            'Ítem Difícil (b=1.5, a=1.5)': parseFloat((1 / (1 + Math.exp(-1.5 * (theta - 1.5)))).toFixed(3))
                        });
                    }
                    return data;
                };
                const cciData = generateCCIData();

                const syncQuestionsToDB = async () => {
                    if(confirm("¿Sincronizar Banco de Preguntas Local hacia la Base de Datos Firebase? Esto permite aleatoriedad desde la nube.")) {
                        const batch = writeBatch(db);
                        QUESTION_BANK.forEach(q => {
                            const docRef = doc(collection(db, QUESTIONS_PATH), q.id);
                            batch.set(docRef, q);
                        });
                        try { await batch.commit(); alert("Sincronización completada exitosamente."); } 
                        catch(e) { alert("Error al sincronizar: " + e.message); }
                    }
                };

                return (
                    <div className="max-w-7xl mx-auto space-y-8 text-slate-200 animate-fade-in pb-10">
                        <div className="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                            <div>
                                <h1 className="text-3xl font-bold font-serif text-white flex items-center"><Brain className="w-8 h-8 mr-3 text-indigo-400"/> Portal de Administración y Neuroanalítica</h1>
                                <p className="text-slate-400 mt-1">Dashboard integral para medir el desempeño cognitivo y estadístico de los estudiantes.</p>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button onClick={syncQuestionsToDB} className="px-4 py-2 bg-indigo-600/20 text-indigo-300 border border-indigo-500/50 rounded hover:bg-indigo-600/40 text-sm flex items-center transition-colors"><Database className="w-4 h-4 mr-2"/> Sincronizar JSON a DB</button>
                                <button onClick={() => setView('intro')} className="px-4 py-2 bg-slate-800 border border-slate-600 rounded hover:bg-slate-700 text-sm flex items-center"><ChevronRight className="w-4 h-4 mr-1 rotate-180"/> Salir</button>
                            </div>
                        </div>

                        {logs.length > 0 ? (
                            <div className="space-y-8">
                                {/* SECCIÓN NEUROCOGNITIVA */}
                                <h2 className="text-2xl font-bold text-white border-l-4 border-purple-500 pl-3">Perfilamiento Neurocognitivo</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="glass-panel p-6 rounded-xl col-span-1">
                                        <h3 className="text-lg font-bold mb-4 text-white">Estados Mentales Registrados</h3>
                                        <p className="text-xs text-slate-400 mb-2">Clasificación basada en cruce de Tiempo de Respuesta vs Efectividad.</p>
                                        <div className="h-64 flex justify-center">
                                            {neuroData.length > 0 ? (
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={neuroData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                                            {neuroData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                                        </Pie>
                                                        <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: 'none', borderRadius: '8px' }} />
                                                        <Legend verticalAlign="bottom" height={36}/>
                                                    </PieChart>
                                                </ResponsiveContainer>
                                            ) : <div className="flex items-center justify-center h-full text-slate-500">Métricas en construcción...</div>}
                                        </div>
                                    </div>
                                    <div className="glass-panel p-6 rounded-xl col-span-2">
                                        <h3 className="text-lg font-bold mb-4 text-white">Análisis de Frustración por Tema</h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={itemMetrics}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis dataKey="theme" stroke="#94a3b8" fontSize={11} tick={{fill: '#94a3b8'}} />
                                                    <YAxis stroke="#94a3b8" />
                                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569' }} />
                                                    <Bar dataKey="If" fill="#ef4444" name="Índice de Frustración (If)" radius={[4, 4, 0, 0]} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                {/* SECCIÓN IRT CLÁSICA */}
                                <h2 className="text-2xl font-bold text-white border-l-4 border-blue-500 pl-3 mt-10">Teoría de Respuesta al Ítem (IRT)</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="glass-panel p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 text-white">Dificultad vs Pregunta</h3>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={itemMetrics} layout="vertical" margin={{ left: 20 }}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis type="number" domain={[0, 1]} stroke="#94a3b8" />
                                                    <YAxis dataKey="title" type="category" stroke="#94a3b8" fontSize={10} width={120} />
                                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569' }} />
                                                    <Bar dataKey="p" fill="#3b82f6" name="Dificultad (p)" radius={[0, 4, 4, 0]} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 text-white">Mapa de Discriminación ($D$)</h3>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis type="number" dataKey="p" name="Dificultad" domain={[0, 1]} stroke="#94a3b8" />
                                                    <YAxis type="number" dataKey="D" name="Discriminación" domain={[0, 1]} stroke="#94a3b8" />
                                                    <Tooltip cursor={{strokeDasharray: '3 3'}} contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569' }} />
                                                    <Scatter name="Ítems" data={itemMetrics} fill="#a855f7" />
                                                </ScatterChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                {/* NUEVO: FUNDAMENTOS TEÓRICOS Y CCI (AGREGADO SIN BORRAR NADA) */}
                                <h2 className="text-2xl font-bold text-white border-l-4 border-emerald-500 pl-3 mt-10">Análisis Científico de Respuesta al Ítem (Modelos IRT)</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="glass-panel p-6 rounded-xl col-span-1 lg:col-span-2">
                                        <h3 className="text-lg font-bold mb-2 text-white flex items-center"><TrendingUp className="w-5 h-5 mr-2 text-emerald-400"/> Curvas Características del Ítem (CCI)</h3>
                                        <p className="text-xs text-slate-400 mb-6">Modelo logístico 2PL: Probabilidad de acierto $P(\theta)$ en función del rasgo latente o habilidad del estudiante ($\theta$).</p>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={cciData} margin={{ top: 5, right: 20, bottom: 5, left: 0 }}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis dataKey="theta" stroke="#94a3b8" name="Habilidad (θ)" tickFormatter={(val) => `θ=${val}`} />
                                                    <YAxis stroke="#94a3b8" domain={[0, 1]} name="Probabilidad P(θ)" />
                                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569', color: '#fff' }} />
                                                    <Legend wrapperStyle={{ fontSize: '12px', paddingTop: '10px' }} />
                                                    <Line type="monotone" dataKey="Ítem Fácil (b=-1.5, a=1.2)" stroke="#10b981" strokeWidth={3} dot={false} />
                                                    <Line type="monotone" dataKey="Ítem Medio (b=0, a=1.0)" stroke="#3b82f6" strokeWidth={3} dot={false} />
                                                    <Line type="monotone" dataKey="Ítem Difícil (b=1.5, a=1.5)" stroke="#ef4444" strokeWidth={3} dot={false} />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-6 rounded-xl flex flex-col justify-center">
                                        <h3 className="text-lg font-bold mb-4 text-white flex items-center"><BookOpen className="w-5 h-5 mr-2 text-emerald-400"/> Fundamento Académico</h3>
                                        <div className="space-y-4 text-sm text-slate-300 overflow-y-auto pr-2" style={{ maxHeight: '280px' }}>
                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                                                <strong className="text-emerald-400 block mb-1">Georg Rasch (1960)</strong>
                                                <p className="text-xs">Autor del Modelo de 1 Parámetro (1PL). Determinó que la probabilidad de éxito depende de la diferencia entre la habilidad del sujeto ($\theta$) y la dificultad del ítem ($b$).</p>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                                                <strong className="text-blue-400 block mb-1">F. Lord (1952) / A. Birnbaum (1968)</strong>
                                                <p className="text-xs">Expandieron la teoría a modelos 2PL y 3PL introduciendo el parámetro de discriminación ($a$) (pendiente de la curva) y la pseudo-adivinación ($c$) para opciones múltiples.</p>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                                                <strong className="text-purple-400 block mb-1">Hambleton & Swaminathan (1985)</strong>

            if (view === 'loading') return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-blue-500"><Scale className="w-12 h-12 animate-pulse" /></div>;

            // --- CÁLCULO DE RECOMENDACIÓN FINAL ---
            const getStudyRecommendation = () => {
                const totalPoints = activeQuestionBank.reduce((acc, q) => acc + (100 * q.difficulty), 0);
                const percentage = (score / totalPoints) * 100;

                if (percentage >= 85) return { text: "Excelente criterio jurídico. Tienes un perfil avanzado en derecho laboral disciplinario.", class: "text-emerald-400" };
                if (percentage >= 60) return { text: "Buen desempeño, pero recomendamos repasar la jurisprudencia de la Corte Constitucional y conceptos de Acoso Laboral.", class: "text-yellow-400" };
                return { text: "Necesitas profundizar en el debido proceso. Te recomendamos aplicar el 'Método de Estudio de Casos Reales' y leer el Código Sustantivo del Trabajo (Arts. 111 a 115).", class: "text-red-400" };
            };

                            </div>

                                            <input type="url" value={studentInfo.socialLink} onChange={e => setStudentInfo({...studentInfo, socialLink: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-indigo-500" placeholder="https://twitter.com/..." />

                                        Guardar Perfil y Continuar <ChevronRight className="w-5 h-5 ml-2" />
                                    </button>
                                </div>
                            </div>

                                </div>
                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl border-t-4 border-t-blue-500 relative">
                                    {renderCurrentInteraction()}
                                    
                                    {feedback && (

                                </div>
                            </div>

                        {/* 5. RESULTADOS, ANÁLISIS POR PREGUNTA Y ENCUESTA MEJORADA */}
                        {view === 'results' && (

                                                    <td className="px-4 py-4 font-medium text-white">{ans.title}</td>
                                                    <td className="px-4 py-4 text-center">
                                                        {ans.isCorrect ? <span className="text-emerald-400 flex items-center justify-center font-bold"><CheckCircle className="w-4 h-4 mr-1"/> Correcto</span> : <span className="text-red-400 flex items-center justify-center font-bold"><XCircle className="w-4 h-4 mr-1"/> Incorrecto</span>}
                                                    </td>
                                                    <td className="px-4 py-4 text-center font-mono">{ans.timeSpent}s</td>
                                                    <td className="px-4 py-4 text-center text-indigo-300">{ans.neuroState}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* ENCUESTA DE SATISFACCIÓN MULTIDIMENSIONAL */}
                                {!surveyData.submitted ? (
                                    <div className="glass-panel rounded-3xl p-10 bg-slate-800/60 border border-slate-600">
                                        <h3 className="text-2xl font-bold text-white mb-2 text-center">Encuesta de Calidad Pedagógica</h3>
                                        <p className="text-sm text-slate-400 mb-8 text-center">Ayúdanos a mejorar evaluando las siguientes dimensiones de tu experiencia de aprendizaje.</p>
                                        
                                        <div className="space-y-6 max-w-2xl mx-auto">
                                            {/* Claridad */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                                                <div className="mb-2 sm:mb-0">
                                                    <div className="font-bold text-white">Claridad de los Casos</div>
                                                    <div className="text-xs text-slate-400">¿Las preguntas y el contexto fueron fáciles de entender?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`clarity-${star}`} onClick={() => setSurveyData({...surveyData, clarity: star})} className={`p-1 focus:outline-none transition-transform hover:scale-110 ${surveyData.clarity >= star ? 'text-yellow-400' : 'text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Relevancia */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                                                <div className="mb-2 sm:mb-0">
                                                    <div className="font-bold text-white">Relevancia Laboral</div>
                                                    <div className="text-xs text-slate-400">¿Sientes que lo aprendido es aplicable en un entorno real?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`rel-${star}`} onClick={() => setSurveyData({...surveyData, relevance: star})} className={`p-1 focus:outline-none transition-transform hover:scale-110 ${surveyData.relevance >= star ? 'text-yellow-400' : 'text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Dificultad Percibida */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                                                <div className="mb-2 sm:mb-0">
                                                    <div className="font-bold text-white">Reto Cognitivo</div>
                                                    <div className="text-xs text-slate-400">¿Qué tan exigente sentiste la evaluación adaptativa?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`diff-${star}`} onClick={() => setSurveyData({...surveyData, difficultyLevel: star})} className={`p-1 focus:outline-none transition-transform hover:scale-110 ${surveyData.difficultyLevel >= star ? 'text-red-400' : 'text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Comentarios */}
                                            <div className="pt-2">
                                                <label className="block text-sm font-bold text-white mb-2">Comentarios o Sugerencias (Opcional)</label>
                                                <textarea value={surveyData.comments} onChange={e => setSurveyData({...surveyData, comments: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 outline-none focus:border-indigo-500 h-24 resize-none" placeholder="Cuéntanos qué te gustó más o qué podríamos mejorar..."></textarea>
                                            </div>

                                            <button onClick={submitSurvey} disabled={!surveyData.clarity || !surveyData.relevance || !surveyData.difficultyLevel} className="w-full py-4 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-500 transition-colors shadow-lg">
                                                Enviar Evaluación
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-panel rounded-3xl p-10 text-center bg-slate-800/40 border border-emerald-500/30">
                                        <CheckCircle className="w-12 h-12 text-emerald-400 mx-auto mb-4"/>
                                        <h3 className="text-2xl font-bold text-white mb-2">¡Gracias por tu feedback!</h3>
                                        <p className="text-slate-400">Tus respuestas nos ayudan a mejorar el modelo de aprendizaje de LunaAcademy.</p>
                                    </div>
                                )}

                                <div className="text-center pb-10 mt-6">
                                    <button onClick={() => window.location.reload()} className="px-10 py-4 bg-slate-700 hover:bg-slate-600 rounded-full text-white font-bold shadow-lg transition-colors">
                                        Cerrar y Reiniciar Plataforma
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        
        // Render de la app principal y el footer
        root.render(
            <>
                <App />
                <div className="text-center text-slate-500 text-xs py-6 mt-auto border-t border-slate-800/50 bg-slate-900/90 w-full">
                    <p>© {new Date().getFullYear()} Todos los derechos reservados.</p>
                    <p className="mt-1">Un módulo de entrenamiento adaptativo impulsado por <strong className="text-blue-400 font-bold tracking-wider">LunaAcademy</strong>.</p>
                </div>
            </>
        );
    </script>
</body>
</html>
