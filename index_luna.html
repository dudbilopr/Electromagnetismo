                    { id: "A", text: "Obligatoriamente después de 3 llamados de atención documentados (Ley de los 3 strikes).", isCorrect: false, feedback: "Mito común. La ley no exige un número exacto de faltas previas." },

        // --- COMPONENTE PRINCIPAL APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(true); 
            const [view, setView] = useState('loading'); 
            const [studentInfo, setStudentInfo] = useState({ 
                name: '', email: '', role: '', experience: '', 
                bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false 
            });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [registeredUsers, setRegisteredUsers] = useState([]); 
            const [dbQuestions, setDbQuestions] = useState([]); 
            const [forumDoubts, setForumDoubts] = useState([]); 
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null, tipsUsed: 0, answers: [] });
            const [feedback, setFeedback] = useState(null);
            const [markedQuestions, setMarkedQuestions] = useState([]); 
            const [userDoubt, setUserDoubt] = useState("");
            const [doubtSubmitted, setDoubtSubmitted] = useState(false);
            const [surveyData, setSurveyData] = useState({ clarity: 0, relevance: 0, difficultyLevel: 0, uxui: 0, comments: '', submitted: false });
            
            // Admin State
            const [adminAuth, setAdminAuth] = useState({ isChecking: false, password: '', error: '' });
            const [adminTab, setAdminTab] = useState('dashboard'); // dashboard, builder, users

            const activeQuestionBank = dbQuestions.length > 0 ? dbQuestions : QUESTION_BANK;
            const currentQ = activeQuestionBank[currentQIndex];

            // FUNCIÓN DE VERIFICACIÓN DE ADMINISTRADOR MAESTRO DE FORMA ESTRICTA Y SEGURA
            const isMasterAdmin = () => {
                const storedEmail = (studentInfo?.email || "").toLowerCase().trim();
                const authEmail = (auth.currentUser?.email || "").toLowerCase().trim();
                return storedEmail === 'dudbilopr@gmail.com' || authEmail === 'dudbilopr@gmail.com';
            };

            // APLICAR TEMA
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark');
                }
            }, [isDarkMode]);

            // 1. AUTO-LOGIN Y AUTENTICACIÓN
            useEffect(() => {
                const savedProfile = localStorage.getItem('lunaAcademy_userProfile');
                if (savedProfile) { setStudentInfo(JSON.parse(savedProfile)); }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); } 
                            catch (e) { await signInAnonymously(auth).catch(() => {}); }
                        } else {
                            await signInAnonymously(auth).catch(() => {});
                        }
                    } catch (err) { console.warn("Modo fallback activo."); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) {
                        setUser(u || { uid: 'local_user' });
                        if (JSON.parse(savedProfile).role || JSON.parse(savedProfile).learningGoal) {
                            setView('intro');
                        } else { setView('profile'); }
                    } else {
                        setUser(u || { uid: 'guest_user' });
                        setView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Escucha de Telemetría y Colección de Usuarios
            useEffect(() => {
                const qLogs = collection(db, COLLECTION_PATH);
                const unsubLogs = onSnapshot(qLogs, (snap) => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                
                const dRef = collection(db, DOUBTS_PATH);
                const unsubDoubts = onSnapshot(dRef, (snap) => setForumDoubts(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});

                // ESCUCHAMOS A LOS USUARIOS ÚNICOS
                const uRef = collection(db, USERS_PATH);
                const unsubUsers = onSnapshot(uRef, (snap) => setRegisteredUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});

                const fetchQuestions = async () => {
                    try {
                        const snap = await getDocs(collection(db, QUESTIONS_PATH));
                        if (!snap.empty) { setDbQuestions(snap.docs.map(doc => doc.data())); }
                    } catch(e) { console.warn("Usando banco local."); }
                };
                fetchQuestions();

                return () => { unsubLogs(); unsubDoubts(); unsubUsers(); };
            }, []);

            useEffect(() => { setDoubtSubmitted(false); setUserDoubt(""); }, [currentQIndex]);

            // --- MANEJADORES ---
            const handleManualLogin = () => { localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo)); setView('profile'); };

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    const newInfo = { ...studentInfo, name: result.user.displayName, email: result.user.email };
                    setStudentInfo(newInfo);
                    localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(newInfo));
                    setUser(result.user);
                    setView('profile');
                } catch (error) {
                    if (error.code === 'auth/unauthorized-domain') setAuthError(`DOMINIO NO AUTORIZADO: Copia el dominio actual y autorízalo en Firebase.`);
                    else if (error.code !== 'auth/popup-closed-by-user') setAuthError(`Error: ${error.message}. Usa el registro manual.`);
                }
            };

            // AGREGADO: Guardar perfil en base de datos para que sea UN SOLO usuario por correo
            const saveProfile = async () => {
                localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo));
                
                if (user && user.uid) {
                    try {
                        // Cumple la regla docId == request.auth.uid para poder guardar en 'directory'
                        const userRef = doc(db, USERS_PATH, user.uid);
                        await setDoc(userRef, { ...studentInfo, email: studentInfo.email, lastAccess: serverTimestamp() }, { merge: true });
                    } catch(e) { console.warn("Aviso: El perfil se guardó localmente.", e); }
                }
                
                setView('intro'); 
            };

            const submitSurvey = async () => {
                try {
                    await addDoc(collection(db, SURVEYS_PATH), { ...surveyData, studentName: studentInfo.name, studentRole: studentInfo.role, score: score, timestamp: serverTimestamp() });
                    setSurveyData({...surveyData, submitted: true});
                } catch (e) { setSurveyData({...surveyData, submitted: true}); }
            };

            const handleDoubtSubmit = async () => {
                if(!userDoubt.trim()) return;
                try {
                    await addDoc(collection(db, DOUBTS_PATH), { qId: currentQ.id, theme: currentQ.theme, title: currentQ.title, doubt: userDoubt, timestamp: serverTimestamp() });
                } catch(e) {}
                setDoubtSubmitted(true); setUserDoubt("");
            };

            // INGRESO DIRECTO DE ADMINISTRADOR MAESTRO (100% BLINDADO Y SEGURO)
            const attemptAdminAccess = () => {
                if (isMasterAdmin()) { 
                    // Si el correo coincide exactamente, pasa directo
                    setView('dashboard'); 
                    setAdminTab('dashboard');
                } else { 
                    // Levanta el muro de contraseña
                    setAdminAuth({ isChecking: true, password: '', error: '' }); 
                }
            };

            const handleAdminLogin = () => {
                if(adminAuth.password === 'admin123') {
                    setView('dashboard');
                    setAdminTab('dashboard');
                    setAdminAuth({isChecking: false, password: '', error: ''});
                } else {
                    setAdminAuth({...adminAuth, error: 'Contraseña incorrecta. Acceso denegado.'});
                }
            };

            const markForLater = () => {
                if (!markedQuestions.includes(currentQ.id)) { setMarkedQuestions([...markedQuestions, currentQ.id]); }
                const answeredIds = sessionData.answers.map(a => a.qId);
                const unasked = activeQuestionBank.findIndex((q, i) => !answeredIds.includes(q.id) && i !== currentQIndex);
                if(unasked !== -1) {
                    setCurrentQIndex(unasked); setFeedback(null); setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                } else { alert("No hay más preguntas nuevas. Has marcado esta para revisar después."); }
            };

            // MOTOR ADAPTATIVO IRT
            const submitAnswer = async (isCorrect, usedTip = false) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e) / t_e) + (usedTip ? 0.5 : 0);
                const pointsEarned = isCorrect ? (100 * currentQ.difficulty) - (usedTip ? 15 : 0) : 0;
                const finalPoints = Math.max(0, pointsEarned);

                let neuroState = "Normal";
                if(timeSpent < (t_e * 0.3) && !isCorrect) neuroState = "Impulsividad";
                else if (timeSpent > (t_e * 1.5) && isCorrect) neuroState = "Duda / Hesitación";
                else if (timeSpent > (t_e * 1.5) && !isCorrect) neuroState = "Sobrecarga Cognitiva";
                else if (timeSpent <= t_e && isCorrect) neuroState = "Estado de Flujo";

                const answerData = { qId: currentQ.id, title: currentQ.title, isCorrect, timeSpent, points: finalPoints, difficulty: currentQ.difficulty, neuroState };

                // Este log es para TELEMETRÍA (Varias entradas por usuario, necesarias para las gráficas)
                const logEntry = {
                    studentName: studentInfo.name || 'Anónimo', 
                    studentRole: studentInfo.role || 'Estudiante Libre',
                    studentEmail: studentInfo.email || 'N/A',
                    questionId: currentQ.id, theme: currentQ.theme || "General", isCorrect, timeSpent, expectedTime: t_e,
                    usedTip, frustrationIndex: frustration, neuroState, points: finalPoints, timestamp: serverTimestamp()
                };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) {}

                const alreadyAnswered = sessionData.answers.some(a => a.qId === currentQ.id);
                if (!alreadyAnswered) {
                    setScore(prev => prev + finalPoints);
                    setSessionData(prev => ({ ...prev, tipsUsed: prev.tipsUsed + (usedTip ? 1 : 0), answers: [...prev.answers, answerData] }));
                }

                if (markedQuestions.includes(currentQ.id)) { setMarkedQuestions(markedQuestions.filter(id => id !== currentQ.id)); }
                setFeedback({ isCorrect, timeSpent, expectedTime: t_e, neuroState });

                setTimeout(() => {
                    setFeedback(null);
                    const answeredIds = [...sessionData.answers.map(a => a.qId)];
                    if(!alreadyAnswered) answeredIds.push(currentQ.id);

                    const unasked = activeQuestionBank.map((q, i) => ({q, i})).filter(item => !answeredIds.includes(item.q.id));

                    if (unasked.length > 0) {
                        let targetDiff = currentQ.difficulty + (isCorrect ? 0.15 : -0.15);
                        unasked.sort(() => Math.random() - 0.5); 
                        unasked.sort((a, b) => Math.abs(a.q.difficulty - targetDiff) - Math.abs(b.q.difficulty - targetDiff));
                        setCurrentQIndex(unasked[0].i);
                        setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { 
                        const markedAndUnanswered = markedQuestions.filter(id => !answeredIds.includes(id));
                        if(markedAndUnanswered.length > 0) {
                            const nextIdx = activeQuestionBank.findIndex(q => q.id === markedAndUnanswered[0]);
                            setCurrentQIndex(nextIdx);
                            setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                        } else { setView('results'); }
                    }
                }, 4000); 
            };

            const logout = () => {
                localStorage.removeItem('lunaAcademy_userProfile');
                setStudentInfo({ name: '', email: '', role: '', experience: '', bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false });

            const DashboardView = () => {

                const calculateMetrics = () => {
                    const metrics = {};
                    let neuroCounts = { "Impulsividad": 0, "Duda / Hesitación": 0, "Sobrecarga Cognitiva": 0, "Estado de Flujo": 0 };

                                        </div>
                                    </div>
                                    <div className="glass-panel p-8 rounded-3xl flex flex-col justify-center bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white flex items-center"><BookOpen className="w-6 h-6 mr-3 text-emerald-500"/> Fundamento</h3>
                                        <div className="space-y-4 text-sm text-gray-600 dark:text-slate-300">
                                            <div className="bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <strong className="text-emerald-600 dark:text-emerald-400 block mb-2 text-base">Georg Rasch (1960)</strong><p className="text-sm font-medium leading-relaxed">Modelo de 1 Parámetro (1PL).</p>
                                            </div>
                                            <div className="bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <strong className="text-brand-600 dark:text-brand-400 block mb-2 text-base">Lord & Birnbaum (1968)</strong><p className="text-sm font-medium leading-relaxed">Modelos 2PL y 3PL (Discriminación y Adivinación).</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* TABLA DETALLADA DE DIAGNÓSTICO */}
                                <div className="glass-panel p-8 rounded-3xl overflow-x-auto mt-12 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-sm">
                                    <h3 className="text-2xl font-bold mb-6 text-gray-900 dark:text-white flex items-center"><FileSignature className="w-7 h-7 mr-3 text-indigo-500"/> Matriz de Diagnóstico</h3>
                                    <table className="w-full text-left text-sm text-gray-700 dark:text-slate-300">
                                        <thead className="text-xs text-gray-500 dark:text-slate-400 uppercase bg-gray-100 dark:bg-slate-800/80 font-black tracking-wider">
                                            <tr>
                                                <th className="px-5 py-4 rounded-tl-xl">Módulo / Tema</th>
                                                <th className="px-5 py-4 text-center">Intentos</th>
                                                <th className="px-5 py-4 text-center">Dificultad</th>
                                                <th className="px-5 py-4 text-center">Frustración</th>
                                                <th className="px-5 py-4 rounded-tr-xl">Estado Pedagógico</th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-medium">
                                            {itemMetrics.map((row, i) => (
                                                <tr key={i} className="border-b border-gray-100 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors">
                                                    <td className="px-5 py-4 text-gray-900 dark:text-white">{row.theme}: <span className="font-normal text-gray-500 dark:text-slate-400 block mt-1">{row.title}</span></td>
                                                    <td className="px-5 py-4 text-center text-lg">{row.Nt}</td>
                                                    <td className="px-5 py-4 text-center text-brand-600 dark:text-brand-400 font-bold text-lg">{row.p}</td>
                                                    <td className="px-5 py-4 text-center text-red-500 dark:text-red-400 text-lg">{row.If}</td>
                                                    <td className="px-5 py-4">
                                                        <span className={`px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wide inline-block ${row.Nt === 0 ? 'bg-gray-200 text-gray-600 dark:bg-slate-700 dark:text-slate-300' : row.p < 0.4 ? 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300' : row.p > 0.7 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300' : 'bg-brand-100 text-brand-700 dark:bg-brand-900/50 dark:text-brand-300'}`}>
                                                            {row.diagnostico}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* CONSTRUCTOR DE PREGUNTAS (LMS) */}
                        {adminTab === 'builder' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="glass-panel p-8 sm:p-12 rounded-3xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-xl">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-gray-200 dark:border-slate-700 pb-6">
                                        <div>
                                            <h2 className="text-3xl font-bold text-gray-900 dark:text-white mb-2 flex items-center"><PlusCircle className="w-8 h-8 mr-3 text-indigo-500"/> Constructor LMS</h2>
                                            <p className="text-sm text-gray-500 dark:text-slate-400 font-medium">Agrega nuevas preguntas interactivas al banco de base de datos en Firebase.</p>
                                        </div>
                                        <button onClick={syncQuestionsToDB} className="mt-4 sm:mt-0 px-5 py-3 bg-brand-50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-300 font-bold border border-brand-200 dark:border-brand-500/50 rounded-xl hover:bg-brand-100 dark:hover:bg-brand-900/40 text-sm flex items-center transition-colors shadow-sm"><Database className="w-5 h-5 mr-2"/> Sincronizar Todo a DB</button>
                                    </div>
                                    
                                    <div className="space-y-8">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Tipo de Pregunta</label>
                                                <select value={newQuestion.type} onChange={e=>setNewQuestion({...newQuestion, type: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium">
                                                    <option value="adaptive_radio">Selección Múltiple (Radio)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Tema</label>
                                                <input type="text" value={newQuestion.theme} onChange={e=>setNewQuestion({...newQuestion, theme: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium" placeholder="Ej. Contratación"/>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Nivel (1-10)</label>
                                                <input type="number" value={newQuestion.level} onChange={e=>setNewQuestion({...newQuestion, level: Number(e.target.value)})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium"/>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Dificultad IRT (0.1 a 0.9)</label>
                                                <input type="number" step="0.1" value={newQuestion.difficulty} onChange={e=>setNewQuestion({...newQuestion, difficulty: Number(e.target.value)})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium"/>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Tiempo Esperado (segundos)</label>
                                                <input type="number" value={newQuestion.expectedTime} onChange={e=>setNewQuestion({...newQuestion, expectedTime: Number(e.target.value)})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium"/>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Título Corto</label>
                                            <input type="text" value={newQuestion.title} onChange={e=>setNewQuestion({...newQuestion, title: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-bold text-lg" placeholder="Ej. El Despido Indirecto"/>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Contexto (Caso Clínico)</label>
                                            <textarea value={newQuestion.context} onChange={e=>setNewQuestion({...newQuestion, context: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 h-28 font-medium leading-relaxed" placeholder="Describe la situación jurídica a resolver..."></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">La Pregunta Exacta</label>
                                            <input type="text" value={newQuestion.question} onChange={e=>setNewQuestion({...newQuestion, question: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-bold" placeholder="¿Qué debe hacer el empleado?"/>
                                        </div>
                                        
                                        <div className="bg-indigo-50 dark:bg-slate-900/50 p-6 rounded-2xl border border-indigo-100 dark:border-slate-700">
                                            <label className="block text-lg font-black text-indigo-900 dark:text-indigo-300 mb-6 flex justify-between items-center">
                                                Opciones de Respuesta
                                                <button onClick={() => setNewQuestion({...newQuestion, options: [...newQuestion.options, {id: String.fromCharCode(65+newQuestion.options.length), text:'', isCorrect: false, feedback: ''}]})} className="text-indigo-700 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300 flex items-center bg-indigo-100 dark:bg-indigo-900/40 px-3 py-2 rounded-lg text-sm transition-colors shadow-sm"><PlusCircle className="w-4 h-4 mr-2"/> Añadir Opción</button>
                                            </label>
                                            <div className="space-y-4">
                                                {newQuestion.options.map((opt, idx) => (
                                                    <div key={idx} className={`flex flex-col md:flex-row gap-4 p-5 bg-white dark:bg-slate-800 rounded-xl border-2 transition-colors ${opt.isCorrect ? 'border-emerald-500 shadow-sm' : 'border-gray-200 dark:border-slate-600'}`}>
                                                        <div className="flex items-center space-x-3 w-full md:w-auto mt-2">
                                                            <input type="radio" name="isCorrect" checked={opt.isCorrect} onChange={() => {
                                                                const newOpts = newQuestion.options.map((o, i) => ({...o, isCorrect: i === idx}));
                                                                setNewQuestion({...newQuestion, options: newOpts});
                                                            }} className="w-5 h-5 text-emerald-600 focus:ring-emerald-500"/>
                                                            <span className="font-black text-gray-800 dark:text-slate-300 text-lg">{opt.id}.</span>
                                                        </div>
                                                        <div className="flex-1 space-y-3">
                                                            <input type="text" value={opt.text} onChange={e=>{
                                                                const newOpts = [...newQuestion.options]; newOpts[idx].text = e.target.value;
                                                                setNewQuestion({...newQuestion, options: newOpts});
                                                            }} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg p-3 text-sm text-gray-900 dark:text-white font-medium outline-none focus:border-emerald-500" placeholder="Texto de la opción (Escribe la posible respuesta)..."/>
                                                            <input type="text" value={opt.feedback} onChange={e=>{
                                                                const newOpts = [...newQuestion.options]; newOpts[idx].feedback = e.target.value;
                                                                setNewQuestion({...newQuestion, options: newOpts});
                                                            }} className="w-full bg-emerald-50 dark:bg-slate-900/80 border border-emerald-200 dark:border-slate-700 rounded-lg p-3 text-sm text-gray-900 dark:text-emerald-100 font-medium outline-none focus:border-emerald-500" placeholder="Feedback legal a mostrar si eligen esta opción..."/>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Pista Jurídica (Tip Opcional)</label>
                                            <input type="text" value={newQuestion.tip} onChange={e=>setNewQuestion({...newQuestion, tip: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl p-4 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium" placeholder="Pista de ayuda que cuesta 15 puntos usar..."/>
                                        </div>

                                        <button onClick={handleSaveNewQuestion} className="w-full py-5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-xl flex justify-center items-center text-lg transition-transform transform hover:scale-[1.01]">
                                            <Save className="w-6 h-6 mr-3"/> Guardar Pregunta en Base de Datos (Firebase)
                                        </button>
                                    </div>
                                </div>

                                {/* LISTA DEL BANCO DE PREGUNTAS ACTUAL */}
                                <div className="glass-panel p-8 sm:p-12 rounded-3xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-xl mt-8">
                                    <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-6 flex items-center"><List className="w-7 h-7 mr-3 text-brand-500"/> Banco de Preguntas Actual</h3>
                                    <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                                        {activeQuestionBank.map((q, idx) => (
                                            <div key={idx} className="bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                <div>
                                                    <div className="flex items-center space-x-3 mb-2">
                                                        <span className="bg-brand-100 text-brand-800 dark:bg-brand-900/50 dark:text-brand-300 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">{q.theme}</span>
                                                        <span className="bg-purple-100 text-purple-800 dark:bg-purple-900/50 dark:text-purple-300 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">Nivel {q.level}</span>
                                                        <span className="text-gray-500 dark:text-slate-400 text-xs font-mono">ID: {q.id}</span>
                                                    </div>
                                                    <h4 className="text-lg font-bold text-gray-900 dark:text-white">{q.title}</h4>
                                                    <p className="text-sm text-gray-600 dark:text-slate-400 mt-1 line-clamp-1">{q.question}</p>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-sm font-bold text-gray-700 dark:text-slate-300">Tipo: <span className="font-medium">{q.type}</span></div>
                                                    <div className="text-sm font-bold text-gray-700 dark:text-slate-300">Dificultad IRT: <span className="text-brand-600 dark:text-brand-400">{q.difficulty}</span></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        
        // Render de la app principal y el footer
        root.render(
            <React.Fragment>
                <App />
                <div className="text-center text-gray-500 dark:text-slate-500 text-xs py-8 mt-auto border-t border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900/90 w-full transition-colors duration-500 z-50 relative">
                    <p className="font-bold uppercase tracking-widest mb-2">© {new Date().getFullYear()} Todos los derechos reservados.</p>
                    <p className="text-sm font-medium">Un módulo de entrenamiento adaptativo impulsado por <strong className="text-brand-600 dark:text-brand-400 font-bold tracking-wider">LunaAcademy</strong>.</p>
                </div>
            </React.Fragment>
        );
    </script>
</body>
</html>
