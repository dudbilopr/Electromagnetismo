<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexQuest: Procesos Disciplinarios Laborales</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Importmap para React, Lucide, Recharts y Firebase -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "recharts": "https://esm.sh/recharts@2.12.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hotspot-pulse { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 
                                70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 
                                100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Scale, BrainCircuit, ShieldAlert, CheckCircle, XCircle, HelpCircle, Lock, LayoutDashboard, ChevronRight, AlertTriangle, TrendingUp, Activity, Copy, Star, Users, Briefcase, FileSignature, Info } from 'lucide-react';
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, BarChart, Bar, ScatterChart, Scatter, ResponsiveContainer } from 'recharts';
        
        // --- FIREBASE INIT ---
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, writeBatch, doc } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk",
            authDomain: "lunaexplica-60035.firebaseapp.com",
            databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com",
            projectId: "lunaexplica-60035",
            storageBucket: "lunaexplica-60035.firebasestorage.app",
            messagingSenderId: "550469014323",
            appId: "1:550469014323:web:be79e10f33abc619432446",
            measurementId: "G-583N74HNVW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const APP_ID = 'lexquest-disciplinario-v2';
        const COLLECTION_PATH = `artifacts/${APP_ID}/public/data/telemetry`;
        const USERS_PATH = `artifacts/${APP_ID}/public/data/users`;

        // --- BANCO DE PREGUNTAS (ESPECIALIZADO EN PROCESOS DISCIPLINARIOS) ---
        const QUESTION_BANK = [
            {
                id: "q1_concepto",
                type: "adaptive_radio",
                level: 1,
                difficulty: 0.3,
                expectedTime: 45,
                title: "¿Qué es un proceso disciplinario?",
                context: "En el entorno laboral, las empresas tienen la facultad de sancionar a sus empleados, pero no de manera arbitraria.",
                question: "Define correctamente la naturaleza jurídica de un proceso disciplinario laboral:",
                options: [
                    { id: "A", text: "Es un castigo automático que el empleador aplica inmediatamente al notar una falla.", isCorrect: false, feedback: "Incorrecto. Los castigos automáticos violan el derecho a la defensa." },
                    { id: "B", text: "Es un procedimiento estructurado para investigar presuntas faltas y sancionarlas, garantizando siempre el debido proceso y la defensa del trabajador.", isCorrect: true, feedback: "¡Correcto! Es un mecanismo que equilibra el poder de subordinación con los derechos del empleado." },
                    { id: "C", text: "Es una etapa obligatoria antes de negociar la renuncia de un empleado.", isCorrect: false, feedback: "Incorrecto. Su fin no es coaccionar la renuncia, sino investigar hechos." }
                ],
                tip: "La clave está en los derechos constitucionales. Nadie puede ser juzgado sin ser escuchado."
            },
            {
                id: "q2_fundamentos",
                type: "adaptive_radio",
                level: 2,
                difficulty: 0.4,
                expectedTime: 50,
                title: "Fundamentos del Proceso",
                context: "Un supervisor decide suspender a un empleado porque 'le cae mal' y sospecha que no está trabajando bien.",
                question: "¿Cuáles son los únicos fundamentos válidos en los que se basa un empleador para iniciar un proceso disciplinario?",
                options: [
                    { id: "A", text: "Las sospechas del supervisor directo y el clima laboral.", isCorrect: false, feedback: "La subjetividad no es un fundamento jurídico válido." },
                    { id: "B", text: "Las reglas establecidas exclusivamente en el contrato verbal.", isCorrect: false, feedback: "Incompleto. Se requieren documentos formales que tipifiquen las faltas." },
                    { id: "C", text: "El Código Sustantivo del Trabajo, el Contrato de Trabajo y el Reglamento Interno de Trabajo.", isCorrect: true, feedback: "¡Exacto! El principio de legalidad exige que las faltas estén previamente escritas en estos documentos." }
                ],
                tip: "Principio de Legalidad: No hay sanción sin ley (o reglamento) previa."
            },
            {
                id: "q3_secuencia",
                type: "sequence_sorter",
                level: 3,
                difficulty: 0.6,
                expectedTime: 90,
                title: "Análisis del Proceso (Pasos)",
                context: "Eres el encargado de Recursos Humanos. Ha llegado el reporte de una falta grave.",
                question: "Arrastra y ordena cronológicamente los pasos obligatorios para ejecutar un proceso disciplinario legal.",
                items: [
                    { id: "s1", content: "Recepción de informe, queja o hallazgo." },
                    { id: "s2", content: "Citación formal a diligencia de descargos." },
                    { id: "s3", content: "Diligencia de descargos (escuchar al empleado)." },
                    { id: "s4", content: "Evaluación de pruebas y descargos." },
                    { id: "s5", content: "Notificación de la decisión (Sanción o Archivo)." }
                ],
                tip: "Primero te enteras, luego llamas, luego escuchas, luego piensas, y al final decides."
            },
            {
                id: "q4_sanciones",
                type: "image_hotspot",
                level: 4,
                difficulty: 0.7,
                expectedTime: 70,
                title: "Auditoría de Sanciones",
                imageUrl: "https://images.unsplash.com/photo-1555374018-1c4fa4782202?auto=format&fit=crop&q=80&w=800",
                context: "Revisando el Reglamento Interno de una empresa, encuentras la tabla de sanciones.",
                question: "Haz clic en la sanción que es ILEGAL según la ley laboral estándar (desproporcionada para una primera falta leve).",
                hotspots: [
                    { id: "h1", x: 25, y: 35, isCorrect: false, text: "Llamado de atención verbal con copia a la hoja de vida." },
                    { id: "h2", x: 65, y: 70, isCorrect: true, text: "Suspensión del contrato por 45 días en la primera llegada tarde." },
                    { id: "h3", x: 75, y: 15, isCorrect: false, text: "Multa equivalente a la 5ta parte de un día por retraso." }
                ],
                tip: "Las leyes laborales prohíben suspensiones mayores a 8 días por la primera vez que se comete una falta."
            },
            {
                id: "q5_hojavida",
                type: "adaptive_radio",
                level: 5,
                difficulty: 0.5,
                expectedTime: 40,
                title: "Impacto en la Hoja de Vida",
                context: "Juan fue sancionado con 2 días de suspensión. Está preocupado por su futuro laboral al buscar trabajo en otra empresa.",
                question: "¿Los procesos disciplinarios quedan registrados en la hoja de vida pública del trabajador?",
                options: [
                    { id: "A", text: "Sí, aparecen como antecedentes penales y disciplinarios públicos.", isCorrect: false, feedback: "Falso. Los procesos de empresas privadas no son antecedentes públicos del Estado." },
                    { id: "B", text: "No, pero quedan consignados en el expediente laboral interno de la empresa que lo sancionó.", isCorrect: true, feedback: "¡Correcto! Es un registro interno de la compañía, no un antecedente público." },
                    { id: "C", text: "No, las sanciones se borran automáticamente a los 30 días.", isCorrect: false, feedback: "Incorrecto. Permanecen en el expediente interno como historial del trabajador." }
                ],
                tip: "El sector privado maneja expedientes internos, no bases de datos nacionales públicas."
            },
            {
                id: "q6_terminacion",
                type: "adaptive_radio",
                level: 6,
                difficulty: 0.8,
                expectedTime: 60,
                title: "El Límite: Terminación del Contrato",
                context: "María cree que la empresa debe hacerle 3 llamados de atención escritos antes de poder despedirla por justa causa.",
                question: "¿Después de cuántos procesos disciplinarios el empleador puede terminar el contrato?",
                options: [
                    { id: "A", text: "Obligatoriamente después de 3 llamados de atención documentados (Ley de los 3 strikes).", isCorrect: false, feedback: "Mito común. La ley laboral no exige un número exacto de faltas previas." },
                    { id: "B", text: "Depende de la gravedad: Una sola falta calificada como 'grave' en el reglamento puede ser suficiente para el despido.", isCorrect: true, feedback: "¡Correcto! No es un tema de cantidad, sino de la gravedad tipificada de la falta." },
                    { id: "C", text: "Después de que el empleado acumula 15 días de suspensión en un año.", isCorrect: false, feedback: "No existe tal regla en la jurisprudencia estándar." }
                ],
                tip: "Robar a la empresa o agredir a un compañero es una falta gravísima que no requiere 'avisos previos'."
            }
        ];

        // --- COMPONENTE PRINCIPAL APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading'); // loading, login, profile, intro, assessment, results, dashboard
            const [studentInfo, setStudentInfo] = useState({ name: '', email: '', role: '', experience: '' });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null, tipsUsed: 0 });
            const [feedback, setFeedback] = useState(null);
            const [satisfaction, setSatisfaction] = useState(0);
            
            const currentQ = QUESTION_BANK[currentQIndex];

            // 1. AUTO-LOGIN Y AUTENTICACIÓN
            useEffect(() => {
                // Recuperar info local para auto-login
                const savedProfile = localStorage.getItem('lexQuest_userProfile');
                if (savedProfile) {
                    setStudentInfo(JSON.parse(savedProfile));
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); } 
                            catch (e) { await signInAnonymously(auth).catch(() => {}); }
                        } else {
                            await signInAnonymously(auth).catch(() => {});
                        }
                    } catch (err) { console.warn("Modo fallback activo."); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) {
                        setUser(u || { uid: 'local_user' });
                        // Si ya tiene rol, pasamos directo al intro
                        if (JSON.parse(savedProfile).role) {
                            setView('intro');
                        } else {
                            setView('profile');
                        }
                    } else {
                        setUser(u || { uid: 'guest_user' });
                        setView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Escucha de Telemetría (Para el Dashboard Docente)
            useEffect(() => {
                const qRef = collection(db, COLLECTION_PATH);
                const unsubscribe = onSnapshot(qRef, (snap) => {
                    setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.warn("Telemetría en modo memoria temporal."));
                return () => unsubscribe();
            }, []);

            // --- MANEJADORES DE EVENTOS ---
            const handleManualLogin = () => {
                localStorage.setItem('lexQuest_userProfile', JSON.stringify(studentInfo));
                setView('profile');
            };

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    const newInfo = { ...studentInfo, name: result.user.displayName, email: result.user.email };
                    setStudentInfo(newInfo);
                    localStorage.setItem('lexQuest_userProfile', JSON.stringify(newInfo));
                    setUser(result.user);
                    setView('profile');
                } catch (error) {
                    if (error.code === 'auth/unauthorized-domain') {
                        setAuthError(`DOMINIO NO AUTORIZADO: Copia el dominio actual y autorízalo en Firebase.`);
                    } else if (error.code !== 'auth/popup-closed-by-user') {
                        setAuthError(`Error: ${error.message}. Usa el registro manual.`);
                    }
                }
            };

            const saveProfile = () => {
                localStorage.setItem('lexQuest_userProfile', JSON.stringify(studentInfo));
                setView('intro');
            };

            const submitAnswer = async (isCorrect, usedTip = false) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e) / t_e) + (usedTip ? 0.5 : 0);
                const pointsEarned = isCorrect ? (100 * currentQ.difficulty) - (usedTip ? 15 : 0) : 0;
                const finalPoints = Math.max(0, pointsEarned);

                const logEntry = {
                    studentName: studentInfo.name || 'Anónimo',
                    studentRole: studentInfo.role || 'N/A',
                    questionId: currentQ.id,
                    isCorrect,
                    timeSpent,
                    expectedTime: t_e,
                    usedTip,
                    frustrationIndex: frustration,
                    points: finalPoints,
                    timestamp: serverTimestamp()
                };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) { console.warn("Guardado local."); }

                setScore(prev => prev + finalPoints);
                setSessionData(prev => ({ ...prev, tipsUsed: prev.tipsUsed + (usedTip ? 1 : 0) }));

                setTimeout(() => {
                    setFeedback(null);
                    if (currentQIndex < QUESTION_BANK.length - 1) {
                        setCurrentQIndex(prev => prev + 1);
                        setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { 
                        setView('results'); 
                    }
                }, 3000);
            };

            const adminBypass = () => setView('dashboard');
            const logout = () => {
                localStorage.removeItem('lexQuest_userProfile');
                setStudentInfo({ name: '', email: '', role: '', experience: '' });
                auth.signOut();
                setView('login');
            };

            // --- COMPONENTES INTERACTIVOS DE EVALUACIÓN ---

            const ProgressBar = () => {
                const progress = (currentQIndex / QUESTION_BANK.length) * 100;
                return (
                    <div className="w-full bg-slate-700 rounded-full h-3 mb-6 overflow-hidden border border-slate-600">
                        <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                    </div>
                );
            };

            const AdaptiveRadio = () => {
                const [selected, setSelected] = useState(null);
                const [tipRevealed, setTipRevealed] = useState(false);
                const handleCheck = () => {
                    const option = currentQ.options.find(o => o.id === selected);
                    setFeedback({ isCorrect: option.isCorrect, text: option.feedback });
                    submitAnswer(option.isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 italic mb-4 p-4 border-l-4 border-blue-500 bg-slate-800/50">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="space-y-3">
                            {currentQ.options.map(opt => (
                                <div key={opt.id} onClick={() => !feedback && setSelected(opt.id)}
                                     className={`p-4 rounded-lg border cursor-pointer transition-all flex items-start ${selected === opt.id ? 'border-blue-400 bg-blue-900/30' : 'border-slate-600 bg-slate-800 hover:bg-slate-700'} ${feedback ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                    <div className={`w-6 h-6 rounded-full border-2 mr-4 flex-shrink-0 flex items-center justify-center ${selected === opt.id ? 'border-blue-400' : 'border-slate-500'}`}>
                                        {selected === opt.id && <div className="w-3 h-3 bg-blue-400 rounded-full"></div>}
                                    </div>
                                    <span className="text-slate-200 leading-relaxed">{opt.text}</span>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                            {!tipRevealed ? (
                                <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Usar Pista Jurídica (-15 pts)</button>
                            ) : (<p className="text-sm text-yellow-400 bg-yellow-900/20 p-3 rounded-lg border border-yellow-700/50 flex items-center"><Info className="w-5 h-5 mr-2 flex-shrink-0"/> {currentQ.tip}</p>)}
                            <button onClick={handleCheck} disabled={!selected || feedback} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold disabled:opacity-50 transition-colors shadow-lg">Validar Análisis</button>
                        </div>
                    </div>
                );
            };

            const SequenceSorter = () => {
                const [items, setItems] = useState([...currentQ.items].sort(() => Math.random() - 0.5));
                const [tipRevealed, setTipRevealed] = useState(false);
                const moveItem = (index, dir) => {
                    const newItems = [...items];
                    if (dir === -1 && index > 0) [newItems[index], newItems[index-1]] = [newItems[index-1], newItems[index]];
                    else if (dir === 1 && index < items.length - 1) [newItems[index], newItems[index+1]] = [newItems[index+1], newItems[index]];
                    setItems(newItems);
                };
                const handleCheck = () => {
                    const isCorrect = items.every((item, idx) => item.id === currentQ.items[idx].id);
                    setFeedback({ isCorrect, text: isCorrect ? "Secuencia procesal garantista perfecta." : "Violación al debido proceso. Revisar el orden." });
                    submitAnswer(isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 mb-4 bg-slate-800/50 p-4 border-l-4 border-indigo-500 italic">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="space-y-3 bg-slate-900/50 p-5 rounded-xl border border-slate-700">
                            {items.map((item, idx) => (
                                <div key={item.id} className="flex items-center p-3 bg-slate-800 rounded-lg border border-slate-600 shadow-sm">
                                    <div className="font-bold text-slate-500 mr-4 w-6 text-center">{idx + 1}</div>
                                    <span className="font-medium flex-grow text-slate-200">{item.content}</span>
                                    <div className="flex space-x-2">
                                        <button onClick={() => moveItem(idx, -1)} disabled={idx === 0 || feedback} className="p-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30 transition-colors">▲</button>
                                        <button onClick={() => moveItem(idx, 1)} disabled={idx === items.length - 1 || feedback} className="p-2 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-30 transition-colors">▼</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                             {!tipRevealed ? <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Pista (-15 pts)</button> : <p className="text-sm text-yellow-400 bg-yellow-900/20 p-3 rounded-lg flex items-center"><Info className="w-5 h-5 mr-2 flex-shrink-0"/>{currentQ.tip}</p>}
                            <button onClick={handleCheck} disabled={feedback} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold disabled:opacity-50 shadow-lg">Sellar Expediente</button>
                        </div>
                    </div>
                );
            };

            const ImageHotspot = () => {
                const [tipRevealed, setTipRevealed] = useState(false);
                const handleHotspotClick = (hotspot) => {
                    if (feedback) return;
                    setFeedback({ isCorrect: hotspot.isCorrect, text: hotspot.isCorrect ? "¡Hallazgo correcto! Identificaste una sanción desproporcionada e ilegal." : "Error de auditoría. Esa sanción es válida dentro de ciertos parámetros." });
                    submitAnswer(hotspot.isCorrect, tipRevealed);
                };
                return (
                    <div className="space-y-4">
                        <p className="text-slate-300 bg-slate-800/50 p-4 border-l-4 border-blue-500 italic">{currentQ.context}</p>
                        <h3 className="text-xl font-semibold mb-4 text-white">{currentQ.question}</h3>
                        <div className="relative border-4 border-slate-700 rounded-xl overflow-hidden bg-slate-800 h-96 flex items-center justify-center shadow-inner">
                            <img src={currentQ.imageUrl} alt="Reglamento" className="object-cover w-full h-full opacity-30 grayscale blur-[1px]" />
                            <div className="absolute inset-0 p-8 flex flex-col justify-between font-serif text-slate-800 text-sm" style={{background: 'rgba(250,250,245,0.92)'}}>
                                <div className="text-center font-bold border-b-2 border-slate-800 pb-4 mb-4 text-lg tracking-widest">REGLAMENTO INTERNO DE TRABAJO<br/><span className="text-sm font-normal">Capítulo: Régimen Sancionatorio</span></div>
                                <div className="space-y-6 flex-grow">
                                    <p className="font-semibold text-red-800">TABLA DE SANCIONES APLICABLES:</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 50.</strong> Faltas leves (Ej. Retraso de 10 min):<br/> - Llamado de atención escrito con copia al expediente.</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 51.</strong> Retraso reiterado (Tercera vez):<br/> - Multa equivalente a la 5ta parte de un día de salario.</p>
                                    <p className="pl-4 border-l-2 border-slate-300"><strong>Art 52.</strong> Faltas graves (Ej. Ausencia injustificada 1 día):<br/> - Suspensión del contrato de trabajo por 45 días hábiles.</p>
                                </div>
                            </div>
                            {currentQ.hotspots.map(h => (
                                <button key={h.id} onClick={() => handleHotspotClick(h)} style={{ left: `${h.x}%`, top: `${h.y}%` }}
                                    className={`absolute w-12 h-12 -ml-6 -mt-6 rounded-full border-2 border-blue-600 bg-blue-500/30 hotspot-pulse hover:bg-blue-500/60 transition-colors z-10 ${feedback ? 'pointer-events-none opacity-0' : ''}`}
                                />
                            ))}
                        </div>
                        <div className="flex justify-between items-center pt-4">
                            {!tipRevealed && !feedback && <button onClick={() => setTipRevealed(true)} className="text-sm text-yellow-500 flex items-center hover:text-yellow-400"><HelpCircle className="w-4 h-4 mr-1"/> Pista Legal (-15 pts)</button>}
                            {tipRevealed && !feedback && <p className="text-sm text-yellow-400 bg-yellow-900/20 p-2 rounded flex items-center"><Info className="w-5 h-5 mr-2"/>{currentQ.tip}</p>}
                        </div>
                    </div>
                );
            };

            const renderCurrentInteraction = () => {
                switch(currentQ.type) {
                    case 'adaptive_radio': return <AdaptiveRadio />;
                    case 'sequence_sorter': return <SequenceSorter />;
                    case 'image_hotspot': return <ImageHotspot />;
                    default: return <div>Interacción en Construcción</div>;
                }
            };

            // --- PANEL ESTADÍSTICO DETALLADO (DOCENTE) ---
            const DashboardView = () => {
                const calculateMetrics = () => {
                    const metrics = {};
                    QUESTION_BANK.forEach(q => {
                        const qLogs = logs.filter(l => l.questionId === q.id);
                        const Nt = qLogs.length;
                        if (Nt === 0) return;
                        const Nc = qLogs.filter(l => l.isCorrect).length;
                        const p = parseFloat((Nc / Nt).toFixed(2)); // Índice de dificultad
                        const D = parseFloat(((p > 0.5) ? (p * 0.8) : (p * 1.2)).toFixed(2)); // Discriminación simulada
                        const avgFrust = parseFloat((qLogs.reduce((acc, curr) => acc + curr.frustrationIndex, 0) / Nt).toFixed(2));
                        
                        let diagnostico = "";
                        if (p < 0.3) diagnostico = "Muy difícil / Confusa";
                        else if (p > 0.8) diagnostico = "Muy fácil / Consolidación";
                        else if (D > 0.4) diagnostico = "Excelente discriminación";
                        else diagnostico = "Discriminación estándar";

                        metrics[q.id] = { id: q.id, title: q.title, p, D, If: avgFrust, Nt, diagnostico };
                    });
                    return Object.values(metrics);
                };
                const dataMetrics = calculateMetrics();

                return (
                    <div className="max-w-6xl mx-auto space-y-8 text-slate-200 animate-fade-in">
                        <div className="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                            <div>
                                <h1 className="text-3xl font-bold font-serif text-white">Análisis Completo Respuesta al Ítem (IRT)</h1>
                                <p className="text-slate-400">Panel de Administración y Psicométrica</p>
                            </div>
                            <button onClick={() => setView('intro')} className="px-4 py-2 bg-slate-800 border border-slate-600 rounded hover:bg-slate-700 text-sm">Volver a la App</button>
                        </div>

                        {logs.length > 0 ? (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="glass-panel p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 text-white">Dificultad vs Pregunta</h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={dataMetrics} layout="vertical" margin={{ left: 20 }}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis type="number" domain={[0, 1]} stroke="#94a3b8" />
                                                    <YAxis dataKey="title" type="category" stroke="#94a3b8" fontSize={10} width={120} />
                                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569' }} />
                                                    <Bar dataKey="p" fill="#3b82f6" name="Dificultad (p)" radius={[0, 4, 4, 0]} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 text-white">Mapa de Discriminación ($D$)</h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                    <XAxis type="number" dataKey="p" name="Dificultad" domain={[0, 1]} stroke="#94a3b8" />
                                                    <YAxis type="number" dataKey="D" name="Discriminación" domain={[0, 1]} stroke="#94a3b8" />
                                                    <Tooltip cursor={{strokeDasharray: '3 3'}} contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569' }} />
                                                    <Scatter name="Ítems" data={dataMetrics} fill="#a855f7" />
                                                </ScatterChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                {/* TABLA DETALLADA DE DIAGNÓSTICO */}
                                <div className="glass-panel p-6 rounded-xl overflow-x-auto">
                                    <h3 className="text-xl font-bold mb-4 text-white flex items-center"><FileSignature className="mr-2"/> Tabla Analítica de Ítems</h3>
                                    <table className="w-full text-left text-sm text-slate-300">
                                        <thead className="text-xs text-slate-400 uppercase bg-slate-800/50">
                                            <tr>
                                                <th className="px-4 py-3 rounded-tl-lg">Pregunta</th>
                                                <th className="px-4 py-3 text-center">Intentos (Nt)</th>
                                                <th className="px-4 py-3 text-center">Dificultad (p)</th>
                                                <th className="px-4 py-3 text-center">Discriminación (D)</th>
                                                <th className="px-4 py-3 text-center">Frustración (If)</th>
                                                <th className="px-4 py-3 rounded-tr-lg">Diagnóstico Pedagógico</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {dataMetrics.map((row, i) => (
                                                <tr key={i} className="border-b border-slate-700 hover:bg-slate-800/30">
                                                    <td className="px-4 py-3 font-medium text-white">{row.title}</td>
                                                    <td className="px-4 py-3 text-center">{row.Nt}</td>
                                                    <td className="px-4 py-3 text-center text-blue-400 font-bold">{row.p}</td>
                                                    <td className="px-4 py-3 text-center text-purple-400">{row.D}</td>
                                                    <td className="px-4 py-3 text-center text-red-400">{row.If}</td>
                                                    <td className="px-4 py-3">
                                                        <span className={`px-2 py-1 rounded text-xs font-semibold ${row.p < 0.4 ? 'bg-red-900/50 text-red-300' : row.p > 0.7 ? 'bg-emerald-900/50 text-emerald-300' : 'bg-blue-900/50 text-blue-300'}`}>
                                                            {row.diagnostico}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-20 text-slate-500 bg-slate-800/30 rounded-xl border border-dashed border-slate-600">
                                <Activity className="w-12 h-12 mx-auto mb-4 text-slate-600" />
                                Esperando datos reales de estudiantes para generar el análisis IRT...
                            </div>
                        )}
                    </div>
                );
            };

            if (view === 'loading') return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-blue-500"><Scale className="w-12 h-12 animate-pulse" /></div>;

            // --- RENDERIZADO PRINCIPAL ---
            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 p-4 sm:p-8 font-sans">
                    {/* Header Top */}
                    {view !== 'dashboard' && view !== 'login' && view !== 'profile' && (
                        <div className="max-w-4xl mx-auto flex justify-between items-center mb-8">
                            <div className="flex items-center space-x-3">
                                <Scale className="w-8 h-8 text-blue-500" />
                                <span className="text-2xl font-bold font-serif text-white tracking-wide">Lex<span className="text-blue-500">Quest</span></span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button onClick={logout} className="text-sm text-slate-400 hover:text-white transition-colors">Salir</button>
                                <button onClick={adminBypass} className="text-slate-500 hover:text-white transition-colors bg-slate-800 p-2 rounded-full" title="Panel Estadístico Docente">
                                    <LayoutDashboard className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto">
                        
                        {/* 1. LOGIN */}
                        {view === 'login' && (
                            <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in border-t-4 border-t-blue-500 max-w-md mx-auto mt-10 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                                <Scale className="w-16 h-16 text-blue-500 mx-auto mb-6 drop-shadow-lg" />
                                <h1 className="text-3xl font-bold text-center mb-2 font-serif text-white">LexQuest</h1>
                                <p className="text-center text-slate-400 mb-8 text-sm">Plataforma de capacitación jurídica</p>

                                <button onClick={handleGoogleLogin} className="w-full mb-6 py-3 bg-white text-slate-900 font-bold rounded-xl flex justify-center items-center shadow-lg hover:bg-slate-100 transition-transform transform hover:scale-105">
                                    <svg className="w-5 h-5 mr-3" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                                    Ingresar con Google
                                </button>

                                <div className="flex items-center mb-6 text-xs text-slate-500">
                                    <div className="flex-grow border-t border-slate-700"></div>
                                    <span className="px-3 uppercase tracking-wider">O Ingreso Manual</span>
                                    <div className="flex-grow border-t border-slate-700"></div>
                                </div>

                                <div className="space-y-4">
                                    <input type="text" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-slate-800 text-white transition-colors" placeholder="Nombre completo" />
                                    <input type="email" value={studentInfo.email} onChange={e => setStudentInfo({...studentInfo, email: e.target.value})} className="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-slate-800 text-white transition-colors" placeholder="Correo electrónico" />
                                    <button onClick={handleManualLogin} disabled={!studentInfo.name || !studentInfo.email} className="w-full py-4 bg-blue-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-blue-500 transition-colors shadow-lg">Continuar</button>
                                </div>
                            </div>
                        )}

                        {/* 2. COMPLETAR PERFIL */}
                        {view === 'profile' && (
                            <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in max-w-lg mx-auto mt-10 border-t-4 border-t-indigo-500">
                                <Briefcase className="w-12 h-12 text-indigo-500 mx-auto mb-4" />
                                <h2 className="text-2xl font-bold text-center text-white mb-2">Completa tu Perfil</h2>
                                <p className="text-center text-slate-400 mb-8 text-sm">Personalizaremos tu experiencia basada en tu rol.</p>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">¿Cuál es tu rol principal?</label>
                                        <select value={studentInfo.role} onChange={e => setStudentInfo({...studentInfo, role: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white outline-none focus:border-indigo-500 appearance-none">
                                            <option value="" disabled>Selecciona una opción</option>
                                            <option value="abogado">Abogado / Legal</option>
                                            <option value="rrhh">Recursos Humanos / Talento</option>
                                            <option value="lider">Líder / Supervisor de Área</option>
                                            <option value="empleado">Colaborador General</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Nivel de Experiencia Laboral</label>
                                        <select value={studentInfo.experience} onChange={e => setStudentInfo({...studentInfo, experience: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white outline-none focus:border-indigo-500 appearance-none">
                                            <option value="" disabled>Selecciona una opción</option>
                                            <option value="junior">0 - 2 años</option>
                                            <option value="mid">3 - 5 años</option>
                                            <option value="senior">Más de 5 años</option>
                                        </select>
                                    </div>
                                    <button onClick={saveProfile} disabled={!studentInfo.role || !studentInfo.experience} className="w-full mt-4 py-4 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-500 transition-colors shadow-lg flex justify-center items-center">
                                        Guardar y Comenzar <ChevronRight className="w-5 h-5 ml-2" />
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 3. INTRODUCCIÓN */}
                        {view === 'intro' && (
                            <div className="glass-panel rounded-3xl p-10 sm:p-16 text-center animate-fade-in shadow-2xl relative overflow-hidden">
                                <div className="absolute -top-24 -right-24 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl"></div>
                                <ShieldAlert className="w-20 h-20 text-blue-500 mx-auto mb-6 relative z-10" />
                                <h1 className="text-4xl sm:text-5xl font-bold mb-4 font-serif text-white relative z-10">Auditoría Disciplinaria</h1>
                                <p className="text-lg text-slate-400 mb-2 max-w-2xl mx-auto relative z-10">Hola, <span className="text-blue-400 font-bold">{studentInfo.name}</span>.</p>
                                <p className="text-slate-400 mb-10 max-w-2xl mx-auto relative z-10">Como perfil <strong className="text-white uppercase">{studentInfo.role}</strong>, pondremos a prueba tu criterio sobre el debido proceso laboral mediante una serie de simulaciones interactivas.</p>
                                <button onClick={() => { setView('assessment'); setSessionData({startTime: Date.now(), currentQStartTime: Date.now(), tipsUsed: 0}); }} className="px-12 py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full font-bold shadow-[0_0_40px_rgba(59,130,246,0.5)] hover:shadow-[0_0_60px_rgba(59,130,246,0.7)] transition-all text-white text-xl relative z-10 transform hover:-translate-y-1">
                                    Iniciar Evaluación
                                </button>
                            </div>
                        )}

                        {/* 4. EVALUACIÓN */}
                        {view === 'assessment' && (
                            <div className="animate-fade-in max-w-3xl mx-auto">
                                <ProgressBar />
                                <div className="flex justify-between items-center mb-6 text-sm text-slate-400 font-medium tracking-wide uppercase">
                                    <span>Módulo {currentQIndex + 1} de {QUESTION_BANK.length}</span>
                                    <span className="bg-slate-800 py-1 px-4 rounded-full border border-slate-700">Puntos: <strong className="text-blue-400 text-base ml-2">{score.toFixed(0)}</strong></span>
                                </div>
                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl border-t-4 border-t-blue-500 relative">
                                    {renderCurrentInteraction()}
                                    
                                    {feedback && (
                                        <div className={`mt-10 p-6 rounded-2xl flex items-start space-x-4 animate-fade-in border ${feedback.isCorrect ? 'bg-emerald-900/30 border-emerald-500/30' : 'bg-red-900/30 border-red-500/30'}`}>
                                            {feedback.isCorrect ? <CheckCircle className="w-10 h-10 text-emerald-400 shrink-0" /> : <XCircle className="w-10 h-10 text-red-400 shrink-0" />}
                                            <div>
                                                <p className={`font-bold text-xl mb-2 ${feedback.isCorrect ? 'text-emerald-400' : 'text-red-400'}`}>{feedback.isCorrect ? 'Veredicto: Correcto' : 'Veredicto: Incorrecto'}</p>
                                                <p className="text-slate-200 leading-relaxed">{feedback.text}</p>
                                                <div className="mt-4 flex items-center text-xs text-slate-500 animate-pulse font-mono uppercase tracking-widest">
                                                    <Activity className="w-3 h-3 mr-2"/> Calculando IRT... Avanzando...
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 5. RESULTADOS Y ENCUESTA */}
                        {view === 'results' && (
                            <div className="glass-panel rounded-3xl p-10 sm:p-16 text-center animate-fade-in border-t-4 border-t-emerald-500 shadow-2xl">
                                <CheckCircle className="w-24 h-24 text-emerald-500 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]" />
                                <h1 className="text-4xl sm:text-5xl font-bold text-white mb-4 font-serif">Simulación Concluida</h1>
                                <p className="text-slate-400 mb-10 text-lg">Has finalizado tu entrenamiento en debido proceso laboral.</p>
                                
                                <div className="bg-slate-900/80 rounded-2xl p-8 mb-10 border border-slate-700 shadow-inner">
                                    <div className="text-sm uppercase tracking-widest text-slate-500 mb-2">Puntuación Final</div>
                                    <div className="text-6xl font-black text-blue-400 mb-6 drop-shadow-lg">{score.toFixed(0)}</div>
                                    <div className="grid grid-cols-3 gap-4 text-sm text-slate-300 border-t border-slate-700 pt-6">
                                        <div><div className="text-slate-500 mb-1">Efectividad</div><strong className="text-white text-xl">{((score / (QUESTION_BANK.length * 100)) * 100).toFixed(0)}%</strong></div>
                                        <div><div className="text-slate-500 mb-1">Pistas Usadas</div><strong className="text-yellow-400 text-xl">{sessionData.tipsUsed}</strong></div>
                                        <div><div className="text-slate-500 mb-1">Tiempo</div><strong className="text-white text-xl">{Math.floor((Date.now() - sessionData.startTime)/1000)}s</strong></div>
                                    </div>
                                </div>

                                <div className="mb-10 p-8 bg-slate-800/40 rounded-2xl border border-slate-700/50">
                                    <h3 className="text-xl font-bold text-white mb-2">Califica esta experiencia</h3>
                                    <p className="text-sm text-slate-400 mb-6">¿Qué tan útiles fueron los escenarios presentados para tu rol de {studentInfo.role}?</p>
                                    <div className="flex justify-center space-x-3">
                                        {[1, 2, 3, 4, 5].map((star) => (
                                            <button key={star} onClick={() => setSatisfaction(star)} className={`p-2 transition-all transform hover:scale-125 focus:outline-none ${satisfaction >= star ? 'text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]' : 'text-slate-600'}`}>
                                                <Star className="w-12 h-12 fill-current" />
                                            </button>
                                        ))}
                                    </div>
                                    {satisfaction > 0 && <p className="text-emerald-400 mt-6 font-bold animate-fade-in">¡Gracias por tu feedback! Tus respuestas ayudan a mejorar el modelo.</p>}
                                </div>

                                <button onClick={() => window.location.reload()} className="px-10 py-4 bg-slate-700 hover:bg-slate-600 rounded-full text-white font-bold shadow-lg transition-colors">
                                    Volver al Inicio
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
