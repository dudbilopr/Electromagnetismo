                    { id: "B", text: "Impuso la sanción 'de plano', omitiendo el derecho de defensa, la citación a descargos y la controversia probatoria.", isCorrect: true, feedback: "¡Excelente! La jurisprudencia colombiana prohíbe las sanciones automáticas o 'de plano'. Siempre debe haber un proceso previo." },
                    { id: "C", text: "El memorando no fue avalado previamente por el Ministerio del Trabajo.", isCorrect: false, feedback: "El Ministerio no avala sanciones disciplinarias rutinarias del reglamento." }

            {

                theme: "Jurisprudencia",
                type: "adaptive_radio",
                level: 5,

                expectedTime: 80,
                title: "Principio de Inmediatez (SU-449/2020)",
                context: "El 15 de enero, Auditoría descubre con pruebas en video que un cajero hurtó dinero. Sin embargo, Recursos Humanos decide esperar hasta el 20 de agosto del mismo año para citarlo a descargos, argumentando 'alta carga laboral'.",
                question: "¿Qué ocurre jurídicamente con este proceso disciplinario bajo la ley laboral colombiana?",
                options: [
                    { id: "A", text: "Es totalmente válido, ya que las faltas laborales graves prescriben a los 3 años en Colombia.", isCorrect: false, feedback: "Confundes la prescripción de derechos laborales (salarios) con la facultad sancionatoria." },
                    { id: "B", text: "Se invalida por violar el 'Principio de Inmediatez'. El empleador perdonó tácitamente la falta al dejar pasar un tiempo irrazonable.", isCorrect: true, feedback: "¡Correcto! Debe existir una relación de cercanía temporal entre el conocimiento de la falta y el inicio del proceso (Corte Suprema y Constitucional)." },
                    { id: "C", text: "Se debe pagar una indemnización al empleado, pero la sanción o despido se mantiene firme.", isCorrect: false, feedback: "Si se viola la inmediatez, el despido se torna injusto, obligando a indemnizar y/o reintegrar." }

                context: "Para probar que una ejecutiva de cuentas está filtrando clientes a la competencia, el área de TI instala un software espía e intercepta las conversaciones de su WhatsApp personal sin orden judicial.",
                question: "¿Es válida esta prueba para sustentar un despido con justa causa en diligencia de descargos?",
                options: [
                    { id: "A", text: "Sí, siempre y cuando el Reglamento Interno advierta que la empresa puede vigilar las comunicaciones para proteger su patrimonio.", isCorrect: false, feedback: "Un reglamento interno jamás puede estar por encima de la Constitución Nacional." },
                    { id: "B", text: "Sí, porque el derecho de la empresa a la libre competencia y a evitar fraudes prima sobre la privacidad del empleado infractor.", isCorrect: false, feedback: "Falso. Los derechos fundamentales no se suspenden por la subordinación laboral." },
                    { id: "C", text: "No. Constituye una prueba ilícita obtenida con violación al derecho fundamental a la intimidad (Art. 15 Constitución), haciendo nulo el proceso.", isCorrect: true, feedback: "¡Preciso! Toda prueba obtenida violando derechos fundamentales es nula de pleno derecho e inutilizable procesalmente." }
                ],
                tip: "En Colombia (Art. 29 CN), es nula de pleno derecho la prueba obtenida con violación del debido proceso y la intimidad."

            {

                type: "image_hotspot",
                level: 8,

                hotspots: [

                ],

            },
            // PREGUNTAS RESTAURADAS
            {
                id: "q5_hojavida",
                theme: "Sanciones",
                type: "adaptive_radio",
                level: 9,
                difficulty: 0.5,
                expectedTime: 40,
                title: "Impacto en la Hoja de Vida",
                context: "Juan fue sancionado con 2 días de suspensión. Está preocupado por su futuro laboral al buscar trabajo en otra empresa.",
                question: "¿Los procesos disciplinarios quedan registrados en la hoja de vida pública del trabajador?",
                options: [
                    { id: "A", text: "Sí, aparecen como antecedentes penales y disciplinarios en la Procuraduría o Policía.", isCorrect: false, feedback: "Falso. La Procuraduría aplica para funcionarios públicos, no para empleados de empresas privadas." },
                    { id: "B", text: "No, pero quedan consignados permanentemente en el expediente laboral interno de la empresa privada que lo sancionó.", isCorrect: true, feedback: "¡Correcto! Es un registro netamente interno de la compañía." },
                    { id: "C", text: "No, el Ministerio del Trabajo ordena borrar las sanciones a los 30 días.", isCorrect: false, feedback: "Incorrecto. Permanecen en el expediente interno como historial del trabajador." }
                ],
                tip: "El sector privado maneja expedientes internos, no bases de datos nacionales públicas."
            },
            {
                id: "q6_terminacion",
                theme: "Sanciones Extrema",
                type: "adaptive_radio",
                level: 10,
                difficulty: 0.8,
                expectedTime: 60,
                title: "El Límite: Terminación del Contrato",
                context: "María cree que la empresa debe hacerle 3 memorandos escritos antes de poder despedirla por justa causa.",
                question: "¿Después de cuántos procesos disciplinarios el empleador puede terminar el contrato (Art 62. CST)?",
                options: [
                    { id: "A", text: "Obligatoriamente después de 3 llamados de atención documentados (Ley de los 3 strikes).", isCorrect: false, feedback: "Mito común. La ley laboral no exige un número exacto de faltas previas." },
                    { id: "B", text: "Depende de la gravedad: Una sola falta calificada convencionalmente como 'grave' puede ser suficiente para el despido.", isCorrect: true, feedback: "¡Correcto! No es un tema de cantidad. Hay faltas de tal magnitud que en la primera ocurrencia ameritan despido justificado." },
                    { id: "C", text: "Solo cuando un juez laboral lo autorice expresamente.", isCorrect: false, feedback: "El empleador tiene la potestad de despedir si se prueba la justa causa, sin pedir permiso previo al juez (salvo fueros especiales)." }
                ],
                tip: "Hurtar patrimonio de la empresa es una falta gravísima que no requiere 'avisos previos' para el despido."

        ];

        // --- COMPONENTE PRINCIPAL APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(true); // Tema Nivel Dios (Por defecto Oscuro)
            const [view, setView] = useState('loading'); 
            const [studentInfo, setStudentInfo] = useState({ 
                name: '', email: '', role: '', experience: '', 
                bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false 
            });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [dbQuestions, setDbQuestions] = useState([]); 
            const [forumDoubts, setForumDoubts] = useState([]); 
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null, tipsUsed: 0, answers: [] });
            const [feedback, setFeedback] = useState(null);
            const [markedQuestions, setMarkedQuestions] = useState([]); 
            const [userDoubt, setUserDoubt] = useState("");
            const [doubtSubmitted, setDoubtSubmitted] = useState(false);
            const [surveyData, setSurveyData] = useState({ clarity: 0, relevance: 0, difficultyLevel: 0, comments: '', submitted: false });
            
            // Admin State
            const [adminAuth, setAdminAuth] = useState({ isChecking: false, password: '', error: '' });
            const [adminTab, setAdminTab] = useState('dashboard'); // dashboard, forum, builder

            // El banco activo será el de la base de datos si existe, si no el local.
            const activeQuestionBank = dbQuestions.length > 0 ? dbQuestions : QUESTION_BANK;
            const currentQ = activeQuestionBank[currentQIndex];

            // APLICAR TEMA
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // 1. AUTO-LOGIN Y AUTENTICACIÓN
            useEffect(() => {
                const savedProfile = localStorage.getItem('lunaAcademy_userProfile');
                if (savedProfile) { setStudentInfo(JSON.parse(savedProfile)); }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); } 
                            catch (e) { await signInAnonymously(auth).catch(() => {}); }
                        } else {
                            await signInAnonymously(auth).catch(() => {});
                        }
                    } catch (err) { console.warn("Modo fallback activo."); }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) {
                        setUser(u || { uid: 'local_user' });
                        if (JSON.parse(savedProfile).role || JSON.parse(savedProfile).learningGoal) {
                            setView('intro');
                        } else { setView('profile'); }
                    } else {
                        setUser(u || { uid: 'guest_user' });
                        setView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Escucha de Telemetría
            useEffect(() => {
                const qLogs = collection(db, COLLECTION_PATH);
                const unsubLogs = onSnapshot(qLogs, (snap) => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                
                const dRef = collection(db, DOUBTS_PATH);
                const unsubDoubts = onSnapshot(dRef, (snap) => setForumDoubts(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});

                const fetchQuestions = async () => {
                    try {
                        const snap = await getDocs(collection(db, QUESTIONS_PATH));
                        if (!snap.empty) { setDbQuestions(snap.docs.map(doc => doc.data())); }
                    } catch(e) { console.warn("Usando banco local."); }
                };
                fetchQuestions();

                return () => { unsubLogs(); unsubDoubts(); };
            }, []);

            useEffect(() => { setDoubtSubmitted(false); setUserDoubt(""); }, [currentQIndex]);

            // --- MANEJADORES ---
            const handleManualLogin = () => { localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo)); setView('profile'); };

            const handleGoogleLogin = async () => {
                setAuthError(null);
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    const newInfo = { ...studentInfo, name: result.user.displayName, email: result.user.email };
                    setStudentInfo(newInfo);
                    localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(newInfo));
                    setUser(result.user);
                    setView('profile');
                } catch (error) {
                    if (error.code === 'auth/unauthorized-domain') setAuthError(`DOMINIO NO AUTORIZADO: Copia el dominio actual y autorízalo en Firebase.`);
                    else if (error.code !== 'auth/popup-closed-by-user') setAuthError(`Error: ${error.message}. Usa el registro manual.`);
                }
            };

            const saveProfile = () => { localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo)); setView('intro'); };

            const submitSurvey = async () => {
                try {
                    await addDoc(collection(db, SURVEYS_PATH), { ...surveyData, studentName: studentInfo.name, studentRole: studentInfo.role, score: score, timestamp: serverTimestamp() });
                    setSurveyData({...surveyData, submitted: true});
                } catch (e) { setSurveyData({...surveyData, submitted: true}); }
            };

            const handleDoubtSubmit = async () => {
                if(!userDoubt.trim()) return;
                try {
                    await addDoc(collection(db, DOUBTS_PATH), { qId: currentQ.id, theme: currentQ.theme, title: currentQ.title, doubt: userDoubt, timestamp: serverTimestamp() });
                } catch(e) {}
                setDoubtSubmitted(true); setUserDoubt("");
            };

            const attemptAdminAccess = () => {
                const activeEmail = studentInfo.email || (user && user.email) || "";
                if (activeEmail.toLowerCase() === 'dudbilopr@gmail.com') { setView('dashboard'); } 
                else { alert("Acceso Denegado: Privilegios de Administrador Maestro requeridos."); }
            };

            const markForLater = () => {
                if (!markedQuestions.includes(currentQ.id)) { setMarkedQuestions([...markedQuestions, currentQ.id]); }
                const answeredIds = sessionData.answers.map(a => a.qId);
                const unasked = activeQuestionBank.findIndex((q, i) => !answeredIds.includes(q.id) && i !== currentQIndex);
                if(unasked !== -1) {
                    setCurrentQIndex(unasked); setFeedback(null); setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                } else { alert("No hay más preguntas nuevas. Has marcado esta para revisar después."); }
            };

            // MOTOR ADAPTATIVO IRT
            const submitAnswer = async (isCorrect, usedTip = false) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e) / t_e) + (usedTip ? 0.5 : 0);
                const pointsEarned = isCorrect ? (100 * currentQ.difficulty) - (usedTip ? 15 : 0) : 0;
                const finalPoints = Math.max(0, pointsEarned);

                let neuroState = "Normal";
                if(timeSpent < (t_e * 0.3) && !isCorrect) neuroState = "Impulsividad";
                else if (timeSpent > (t_e * 1.5) && isCorrect) neuroState = "Duda / Hesitación";
                else if (timeSpent > (t_e * 1.5) && !isCorrect) neuroState = "Sobrecarga Cognitiva";
                else if (timeSpent <= t_e && isCorrect) neuroState = "Estado de Flujo";

                const answerData = { qId: currentQ.id, title: currentQ.title, isCorrect, timeSpent, points: finalPoints, difficulty: currentQ.difficulty, neuroState };

                const logEntry = {
                    studentName: studentInfo.name || 'Anónimo', studentRole: studentInfo.role || 'Estudiante Libre',
                    questionId: currentQ.id, theme: currentQ.theme || "General", isCorrect, timeSpent, expectedTime: t_e,
                    usedTip, frustrationIndex: frustration, neuroState, points: finalPoints, timestamp: serverTimestamp()
                };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) {}

                const alreadyAnswered = sessionData.answers.some(a => a.qId === currentQ.id);
                if (!alreadyAnswered) {
                    setScore(prev => prev + finalPoints);
                    setSessionData(prev => ({ ...prev, tipsUsed: prev.tipsUsed + (usedTip ? 1 : 0), answers: [...prev.answers, answerData] }));
                }

                if (markedQuestions.includes(currentQ.id)) { setMarkedQuestions(markedQuestions.filter(id => id !== currentQ.id)); }
                setFeedback({ isCorrect, timeSpent, expectedTime: t_e, neuroState });

                setTimeout(() => {
                    setFeedback(null);
                    const answeredIds = [...sessionData.answers.map(a => a.qId)];
                    if(!alreadyAnswered) answeredIds.push(currentQ.id);

                    const unasked = activeQuestionBank.map((q, i) => ({q, i})).filter(item => !answeredIds.includes(item.q.id));

                    if (unasked.length > 0) {
                        let targetDiff = currentQ.difficulty + (isCorrect ? 0.15 : -0.15);
                        unasked.sort(() => Math.random() - 0.5); 
                        unasked.sort((a, b) => Math.abs(a.q.difficulty - targetDiff) - Math.abs(b.q.difficulty - targetDiff));
                        setCurrentQIndex(unasked[0].i);
                        setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { 
                        const markedAndUnanswered = markedQuestions.filter(id => !answeredIds.includes(id));
                        if(markedAndUnanswered.length > 0) {
                            const nextIdx = activeQuestionBank.findIndex(q => q.id === markedAndUnanswered[0]);
                            setCurrentQIndex(nextIdx);
                            setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                        } else { setView('results'); }
                    }
                }, 4000); 
            };

            const logout = () => {
                localStorage.removeItem('lunaAcademy_userProfile');

            const SequenceSorter = () => {

                                <button onClick={handleCheck} disabled={feedback} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-bold disabled:opacity-50 shadow-lg text-white">Sellar Expediente</button>

                return (

                            <div className="flex space-x-2">

                                <button onClick={handleCheck} disabled={Object.keys(answers).length < currentQ.blanks.length || feedback} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-bold disabled:opacity-50 shadow-lg text-white">Completar Documento</button>

            const ImageHotspot = () => {
                const [tipRevealed, setTipRevealed] = useState(false);
                const handleHotspotClick = (hotspot) => {
                    if (feedback) return;
                    setFeedback({ isCorrect: hotspot.isCorrect, text: hotspot.isCorrect ? "¡Hallazgo correcto! Identificaste una sanción desproporcionada." : "Error de auditoría. Esa sanción es válida." });

                return (
                    <div className="space-y-4">

                            <div className="absolute inset-0 p-8 flex flex-col justify-between font-serif text-slate-800 text-sm" style={{background: 'rgba(250,250,245,0.92)'}}>

                            {tipRevealed && !feedback && <p className="text-sm text-yellow-800 dark:text-yellow-400 bg-yellow-100 dark:bg-yellow-900/20 p-2 rounded flex items-center w-full sm:w-1/2"><Info className="w-5 h-5 mr-2"/>{currentQ.tip}</p>}
                            <div className="flex space-x-2">
                                <button onClick={markForLater} disabled={feedback} className="px-4 py-3 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-lg font-bold text-gray-700 dark:text-yellow-400 transition-colors shadow-sm disabled:opacity-50">📌 Marcar</button>

            const renderCurrentInteraction = () => {
                if(!currentQ) return <div className="text-center p-10"><Activity className="animate-spin mx-auto w-10 h-10 text-blue-500"/></div>;
                switch(currentQ.type) {
                    case 'adaptive_radio': return <AdaptiveRadio />;

                    default: return <div>Interacción en Construcción</div>;

            };

            // --- PANEL ESTADÍSTICO Y MÓDULO LMS (ADMIN) ---
            const DashboardView = () => {
                // Constructor State
                const [newQuestion, setNewQuestion] = useState({
                    id: `q_new_${Date.now()}`, type: 'adaptive_radio', theme: 'General', level: 1, difficulty: 0.5, expectedTime: 60,
                    title: '', context: '', question: '', tip: '',
                    options: [{id: 'A', text: '', isCorrect: true, feedback: ''}, {id: 'B', text: '', isCorrect: false, feedback: ''}]
                });

                const calculateMetrics = () => {
                    const metrics = {};
                    let neuroCounts = { "Impulsividad": 0, "Duda / Hesitación": 0, "Sobrecarga Cognitiva": 0, "Estado de Flujo": 0 };
                    
                    activeQuestionBank.forEach(q => {
                        const qLogs = logs.filter(l => l.questionId === q.id);
                        const Nt = qLogs.length;
                        
                        // Si no hay datos, inicializamos todo en CERO para que se vean las gráficas
                        const Nc = Nt > 0 ? qLogs.filter(l => l.isCorrect).length : 0;
                        const p = Nt > 0 ? parseFloat((Nc / Nt).toFixed(2)) : 0;
                        const D = Nt > 0 ? parseFloat(((p > 0.5) ? (p * 0.8) : (p * 1.2)).toFixed(2)) : 0;
                        const avgFrust = Nt > 0 ? parseFloat((qLogs.reduce((acc, curr) => acc + curr.frustrationIndex, 0) / Nt).toFixed(2)) : 0;
                        
                        qLogs.forEach(l => { if(l.neuroState && neuroCounts[l.neuroState] !== undefined) neuroCounts[l.neuroState]++; });

                        let diagnostico = "Sin datos";
                        if (Nt > 0) {
                            if (p < 0.3) diagnostico = "Muy difícil / Confusa";
                            else if (p > 0.8) diagnostico = "Muy fácil / Consolidación";
                            else if (D > 0.4) diagnostico = "Excelente discriminación";
                            else diagnostico = "Discriminación estándar";
                        }

                        metrics[q.id] = { id: q.id, title: q.title, theme: q.theme, p, D, If: avgFrust, Nt, diagnostico };
                    });
                    
                    // Si no hay datos de neuroCounts, mostrar 0 para todos
                    const hasNeuroData = Object.values(neuroCounts).some(v => v > 0);
                    let neuroData = [];
                    if (hasNeuroData) {
                        neuroData = Object.keys(neuroCounts).map(k => ({ name: k, value: neuroCounts[k] }));
                    } else {
                        neuroData = Object.keys(neuroCounts).map(k => ({ name: k, value: 1 })); // Mostrar particiones iguales grises si vacío
                    }

                    return { itemMetrics: Object.values(metrics), neuroData, hasNeuroData };
                };
                
                const { itemMetrics, neuroData, hasNeuroData } = calculateMetrics();
                const COLORS = ['#ef4444', '#f59e0b', '#8b5cf6', '#10b981'];
                const EMPTY_COLORS = ['#cbd5e1', '#e2e8f0', '#f1f5f9', '#f8fafc'];

                const generateCCIData = () => {
                    const data = [];
                    for (let theta = -3; theta <= 3; theta += 0.5) {
                        data.push({
                            theta,
                            'Ítem Fácil (b=-1.5, a=1.2)': parseFloat((1 / (1 + Math.exp(-1.2 * (theta - (-1.5))))).toFixed(3)),
                            'Ítem Medio (b=0, a=1.0)': parseFloat((1 / (1 + Math.exp(-1.0 * (theta - 0)))).toFixed(3)),
                            'Ítem Difícil (b=1.5, a=1.5)': parseFloat((1 / (1 + Math.exp(-1.5 * (theta - 1.5)))).toFixed(3))
                        });
                    }
                    return data;
                };
                const cciData = generateCCIData();

                const handleSaveNewQuestion = async () => {
                    if (!newQuestion.title || !newQuestion.question) return alert("Completa título y pregunta");
                    try {
                        const docRef = doc(collection(db, QUESTIONS_PATH), newQuestion.id);
                        await setDoc(docRef, newQuestion);
                        alert("Pregunta agregada exitosamente a la base de datos.");
                        // Reset form
                        setNewQuestion({ ...newQuestion, id: `q_new_${Date.now()}`, title: '', context: '', question: '', tip: ''});
                    } catch (error) { alert("Error guardando en la DB: " + error.message); }
                };

                return (
                    <div className="max-w-7xl mx-auto space-y-8 text-gray-900 dark:text-slate-200 animate-fade-in pb-10">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-200 dark:border-slate-700 pb-4 gap-4">

                return { text: "Necesitas profundizar en el debido proceso. Te recomendamos aplicar el 'Método de Estudio de Casos Reales' y leer el Código Sustantivo del Trabajo.", class: "text-red-600 dark:text-red-400" };
            };

            return (

                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-gray-500 dark:text-yellow-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full transition-colors" title="Cambiar Tema">

                                </button>
                            </div>
                        </div>

                    <div className="max-w-4xl mx-auto">
                        
                        {/* 1. LOGIN */}
                        {view === 'login' && (

                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                                <div className="flex justify-end mb-4">
                                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-gray-400 dark:text-yellow-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full transition-colors">{isDarkMode ? <Sun className="w-5 h-5"/> : <Moon className="w-5 h-5"/>}</button>

                                <Scale className="w-16 h-16 text-blue-600 dark:text-blue-500 mx-auto mb-6 drop-shadow-lg" />

                                    <div className="flex-grow border-t border-gray-200 dark:border-slate-700"></div>
                                </div>

                                <div className="space-y-4">
                                    <input type="text" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800/50 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition-colors font-medium" placeholder="Nombre completo" />
                                    <input type="email" value={studentInfo.email} onChange={e => setStudentInfo({...studentInfo, email: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800/50 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition-colors font-medium" placeholder="Correo electrónico" />

                            </div>

                                            <input type="text" value={studentInfo.specialty} onChange={e => setStudentInfo({...studentInfo, specialty: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-3 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium" placeholder="Ej. Derecho Laboral, Psicología..." />
                                        </div>
                                    </div>
                                )}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 flex items-center"><LinkIcon className="w-4 h-4 mr-2 text-indigo-500"/> Link Académico (LinkedIn)</label>
                                            <input type="url" value={studentInfo.academicLink} onChange={e => setStudentInfo({...studentInfo, academicLink: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-3 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium" placeholder="https://" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2 flex items-center"><LinkIcon className="w-4 h-4 mr-2 text-indigo-500"/> Redes Sociales</label>
                                            <input type="url" value={studentInfo.socialLink} onChange={e => setStudentInfo({...studentInfo, socialLink: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-3 text-gray-900 dark:text-white outline-none focus:border-indigo-500 font-medium" placeholder="https://twitter.com/..." />
                                        </div>
                                    </div>
                                    <button onClick={saveProfile} disabled={!studentInfo.learningGoal && (!studentInfo.role || !studentInfo.experience)} className="w-full mt-6 py-4 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-lg flex justify-center items-center text-lg">
                                        Guardar Perfil y Continuar <ChevronRight className="w-6 h-6 ml-2" />
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 3. INTRODUCCIÓN */}
                        {view === 'intro' && (
                            <div className="glass-panel rounded-3xl p-10 sm:p-16 text-center animate-fade-in shadow-2xl relative overflow-hidden mt-6 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                <div className="absolute -top-24 -right-24 w-64 h-64 bg-blue-100 dark:bg-blue-600/20 rounded-full blur-3xl"></div>
                                <ShieldAlert className="w-20 h-20 text-blue-600 dark:text-blue-500 mx-auto mb-6 relative z-10" />
                                <h1 className="text-4xl sm:text-5xl font-bold mb-4 font-serif text-gray-900 dark:text-white relative z-10">Auditoría Disciplinaria (Col)</h1>
                                <p className="text-lg text-gray-600 dark:text-slate-400 mb-2 max-w-2xl mx-auto relative z-10 font-medium">Hola, <span className="text-blue-600 dark:text-blue-400 font-bold">{studentInfo.name}</span>.</p>
                                <p className="text-gray-500 dark:text-slate-400 mb-10 max-w-3xl mx-auto relative z-10 leading-relaxed">
                                    {studentInfo.learningGoal 
                                        ? "Bienvenido a tu entrenamiento libre. Pondremos a prueba tus conocimientos sobre el debido proceso laboral basándonos en el Código Sustantivo del Trabajo."
                                        : `Como perfil ${studentInfo.role.toUpperCase()}, pondremos a prueba tu criterio sobre el debido proceso laboral basándonos en la Jurisprudencia Constitucional Colombiana.`}
                                </p>
                                <button onClick={() => { setView('assessment'); setSessionData({startTime: Date.now(), currentQStartTime: Date.now(), tipsUsed: 0, answers: []}); setScore(0); setCurrentQIndex(0); setMarkedQuestions([]); }} className="px-12 py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full font-bold shadow-[0_0_40px_rgba(59,130,246,0.3)] dark:shadow-[0_0_40px_rgba(59,130,246,0.5)] hover:shadow-[0_0_60px_rgba(59,130,246,0.5)] dark:hover:shadow-[0_0_60px_rgba(59,130,246,0.7)] transition-all text-white text-xl relative z-10 transform hover:-translate-y-1">
                                    Iniciar Evaluación Legal
                                </button>
                            </div>
                        )}

                        {/* 4. EVALUACIÓN (Con Navegación Libre y Foro en Vivo) */}
                        {view === 'assessment' && (
                            <div className="animate-fade-in max-w-3xl mx-auto">
                                <AssessmentNavBar />
                                <div className="flex justify-between items-center mb-6 text-sm font-bold uppercase bg-white dark:bg-slate-800/80 p-4 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                    <div className="flex items-center text-indigo-600 dark:text-indigo-400">
                                        <Activity className="w-5 h-5 mr-2"/> Reto {currentQIndex + 1} de {activeQuestionBank.length} 
                                        <span className="hidden sm:inline ml-2 text-gray-400 dark:text-slate-500">({currentQ.theme})</span>
                                    </div>
                                    <span className="text-gray-600 dark:text-slate-300">Puntos: <strong className="text-blue-600 dark:text-blue-400 text-lg ml-2">{score.toFixed(0)}</strong></span>

                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl border-t-4 border-t-blue-500 relative bg-white dark:bg-slate-800 border-x border-b border-gray-200 dark:border-slate-700">
                                    {renderCurrentInteraction()}
                                    
                                    {feedback && (
                                        <div className={`mt-10 p-6 rounded-2xl flex items-start space-x-4 animate-fade-in border ${feedback.isCorrect ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-500/30' : 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-500/30'}`}>
                                            {feedback.isCorrect ? <CheckCircle className="w-10 h-10 text-emerald-600 dark:text-emerald-400 shrink-0" /> : <XCircle className="w-10 h-10 text-red-600 dark:text-red-400 shrink-0" />}
                                            <div className="flex-1">
                                                <p className={`font-bold text-xl mb-2 ${feedback.isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>{feedback.isCorrect ? 'Fallo: Válido' : 'Fallo: Error de Proceso'}</p>
                                                <p className="text-gray-800 dark:text-slate-200 leading-relaxed text-sm mb-4 font-medium">{feedback.text}</p>
                                                
                                                <div className="bg-white/60 dark:bg-slate-900/50 rounded-lg p-4 grid grid-cols-2 gap-3 text-xs text-gray-600 dark:text-slate-400 font-mono shadow-sm">

                                                        <BrainCircuit className="w-4 h-4 mr-2 text-indigo-600 dark:text-indigo-400"/> Estado: {feedback.neuroState}. {feedback.isCorrect ? 'Avanzando nivel...' : 'Ajustando consolidación...'}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                                </div>

                                <div className="glass-panel rounded-3xl p-8 border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/40 shadow-sm">
                                    <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-4 flex items-center"><MessageCircle className="w-7 h-7 mr-3 text-yellow-500"/> Inquietudes Frecuentes (Foro Anónimo)</h3>
                                    <p className="text-sm text-gray-600 dark:text-slate-400 mb-6 font-medium">Revisa lo que otros estudiantes han preguntado sobre los casos evaluados hoy. Los docentes analizan esto en tiempo real.</p>
                                    <div className="space-y-4 max-h-64 overflow-y-auto pr-2">
                                        {forumDoubts.filter(d => sessionData.answers.some(a => a.qId === d.qId)).slice(0, 10).map((d, i) => (
                                            <div key={i} className="bg-gray-50 dark:bg-slate-900/50 p-5 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">{d.theme}</span>
                                                    <span className="text-xs text-gray-400 dark:text-slate-500 font-medium">Reciente</span>
                                                </div>
                                                <p className="text-sm text-gray-800 dark:text-slate-200 mt-1 italic font-medium leading-relaxed">"{d.doubt}"</p>
                                            </div>
                                        ))}
                                        {forumDoubts.filter(d => sessionData.answers.some(a => a.qId === d.qId)).length === 0 && 
                                            <p className="text-gray-500 dark:text-slate-500 text-center py-6 bg-gray-50 dark:bg-slate-900/30 rounded-xl border border-dashed border-gray-300 dark:border-slate-600 font-medium">Aún no hay dudas registradas en el foro sobre estos módulos.</p>
                                        }
                                    </div>
                                </div>

                                {/* Tabla de Rendimiento por Ítem */}
                                <div className="glass-panel rounded-3xl p-8 overflow-x-auto bg-white dark:bg-slate-800 shadow-sm border border-gray-200 dark:border-slate-700">
                                    <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-6 flex items-center"><Activity className="w-7 h-7 mr-3 text-blue-600 dark:text-blue-400"/> Tu Rendimiento Detallado</h3>
                                    <table className="w-full text-left text-sm text-gray-700 dark:text-slate-300">
                                        <thead className="text-xs uppercase bg-gray-100 dark:bg-slate-800/80 text-gray-500 dark:text-slate-400 font-bold">
                                            <tr>
                                                <th className="px-4 py-4 rounded-tl-lg">Módulo Evaluado</th>
                                                <th className="px-4 py-4 text-center">Resultado</th>
                                                <th className="px-4 py-4 text-center">Tiempo</th>
                                                <th className="px-4 py-4 text-center rounded-tr-lg">Estado Cognitivo</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sessionData.answers.map((ans, i) => (
                                                <tr key={i} className="border-b border-gray-100 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors">
                                                    <td className="px-4 py-5 font-bold text-gray-900 dark:text-white">{ans.title}</td>
                                                    <td className="px-4 py-5 text-center">
                                                        {ans.isCorrect ? <span className="text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold"><CheckCircle className="w-5 h-5 mr-1"/> Correcto</span> : <span className="text-red-600 dark:text-red-400 flex items-center justify-center font-bold"><XCircle className="w-5 h-5 mr-1"/> Incorrecto</span>}
                                                    </td>
                                                    <td className="px-4 py-5 text-center font-mono font-bold text-gray-800 dark:text-slate-200">{ans.timeSpent}s</td>
                                                    <td className="px-4 py-5 text-center font-bold text-indigo-600 dark:text-indigo-300">{ans.neuroState}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* ENCUESTA DE SATISFACCIÓN MULTIDIMENSIONAL */}
                                {!surveyData.submitted ? (
                                    <div className="glass-panel rounded-3xl p-10 bg-white dark:bg-slate-800/60 border border-gray-200 dark:border-slate-600 shadow-xl">
                                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-2 text-center">Encuesta de Calidad Pedagógica</h3>
                                        <p className="text-sm text-gray-500 dark:text-slate-400 mb-8 text-center font-medium">Ayúdanos a mejorar evaluando las siguientes dimensiones de tu experiencia de aprendizaje.</p>
                                        
                                        <div className="space-y-6 max-w-2xl mx-auto">
                                            {/* Claridad */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <div className="mb-3 sm:mb-0">
                                                    <div className="font-bold text-gray-900 dark:text-white text-lg">Claridad de los Casos</div>
                                                    <div className="text-sm text-gray-500 dark:text-slate-400">¿Las preguntas y el contexto fueron fáciles de entender?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`clarity-${star}`} onClick={() => setSurveyData({...surveyData, clarity: star})} className={`p-1 focus:outline-none transition-transform hover:scale-125 ${surveyData.clarity >= star ? 'text-yellow-400 drop-shadow-sm' : 'text-gray-300 dark:text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Relevancia */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <div className="mb-3 sm:mb-0">
                                                    <div className="font-bold text-gray-900 dark:text-white text-lg">Relevancia Laboral</div>
                                                    <div className="text-sm text-gray-500 dark:text-slate-400">¿Sientes que lo aprendido es aplicable en un entorno real?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`rel-${star}`} onClick={() => setSurveyData({...surveyData, relevance: star})} className={`p-1 focus:outline-none transition-transform hover:scale-125 ${surveyData.relevance >= star ? 'text-yellow-400 drop-shadow-sm' : 'text-gray-300 dark:text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Dificultad Percibida */}
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                                <div className="mb-3 sm:mb-0">
                                                    <div className="font-bold text-gray-900 dark:text-white text-lg">Reto Cognitivo</div>
                                                    <div className="text-sm text-gray-500 dark:text-slate-400">¿Qué tan exigente sentiste la evaluación adaptativa?</div>
                                                </div>
                                                <div className="flex space-x-1">
                                                    {[1,2,3,4,5].map(star => (
                                                        <button key={`diff-${star}`} onClick={() => setSurveyData({...surveyData, difficultyLevel: star})} className={`p-1 focus:outline-none transition-transform hover:scale-125 ${surveyData.difficultyLevel >= star ? 'text-red-500 dark:text-red-400 drop-shadow-sm' : 'text-gray-300 dark:text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Comentarios */}
                                            <div className="pt-4">
                                                <label className="block text-sm font-bold text-gray-900 dark:text-white mb-2">Comentarios o Sugerencias (Opcional)</label>
                                                <textarea value={surveyData.comments} onChange={e => setSurveyData({...surveyData, comments: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-gray-900 dark:text-slate-200 outline-none focus:border-indigo-500 h-28 resize-none font-medium transition-colors" placeholder="Cuéntanos qué te gustó más o qué podríamos mejorar..."></textarea>
                                            </div>

                                            <button onClick={submitSurvey} disabled={!surveyData.clarity || !surveyData.relevance || !surveyData.difficultyLevel} className="w-full py-5 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-lg text-lg">
                                                Enviar Evaluación
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-panel rounded-3xl p-12 text-center bg-emerald-50 dark:bg-slate-800/40 border border-emerald-200 dark:border-emerald-500/30 shadow-sm">
                                        <CheckCircle className="w-16 h-16 text-emerald-500 mx-auto mb-4"/>
                                        <h3 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">¡Gracias por tu feedback!</h3>
                                        <p className="text-gray-600 dark:text-slate-400 font-medium">Tus respuestas nos ayudan a mejorar el modelo de aprendizaje de LunaAcademy.</p>
                                    </div>
                                )}

                                <div className="text-center pb-12 mt-8">
                                    <button onClick={() => window.location.reload()} className="px-12 py-5 bg-gray-800 dark:bg-slate-700 hover:bg-gray-900 dark:hover:bg-slate-600 rounded-full text-white font-bold shadow-xl transition-all transform hover:scale-105 text-lg">
                                        Cerrar Sesión y Reiniciar
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        
        // Render de la app principal y el footer
        root.render(
            <>
                <App />
                <div className="text-center text-gray-500 dark:text-slate-500 text-xs py-8 mt-auto border-t border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900/90 w-full transition-colors duration-500">
                    <p className="font-bold uppercase tracking-widest mb-2">© {new Date().getFullYear()} Todos los derechos reservados.</p>
                    <p className="text-sm font-medium">Un módulo de entrenamiento adaptativo impulsado por <strong className="text-blue-600 dark:text-blue-400 font-bold tracking-wider">LunaAcademy</strong>.</p>
                </div>
            </>
        );
    </script>
</body>
</html>
