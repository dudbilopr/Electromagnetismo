<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LunaAcademy | Pedagogía del Descargo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 500: '#0ea5e9' }, law: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }, animation: { 'fade-in': 'fadeIn 0.5s ease-out', 'slide-up': 'slideUp 0.6s ease-out' }, keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }, slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } } } } }
    </script>
    <script type="importmap">
        { "imports": { "react": "https://esm.sh/react@18.2.0", "react-dom": "https://esm.sh/react-dom@18.2.0", "react-dom/client": "https://esm.sh/react-dom@18.2.0/client", "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom", "lucide-react": "https://esm.sh/lucide-react@0.359.0?external=react", "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js", "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js" } }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .hotspot-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; background: #fff; color: #000; padding: 20px; border-radius: 8px; font-family: monospace; border: 1px solid #ccc; }
        .hotspot-zone { position: absolute; border: 2px dashed rgba(239, 68, 68, 0.5); cursor: pointer; transition: all 0.2s; background: rgba(239, 68, 68, 0.1); }
        .hotspot-zone:hover, .hotspot-zone.selected { border-color: rgba(239, 68, 68, 1); background: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, createContext, useContext, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { BookOpen, Scale, Shield, FileText, ChevronRight, ChevronLeft, LogOut, User, CheckCircle, AlertTriangle, Play, BrainCircuit, MessageSquare, Settings, HelpCircle, MapPin, Award, Search, Mail, Key } from 'lucide-react';
        import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, LineChart, Line } from 'recharts';
        
        // --- FIREBASE CONFIGURATION ---
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, getDocs, query, serverTimestamp, orderBy, limit } from 'firebase/firestore';

        const firebaseConfig = { apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk", authDomain: "lunaexplica-60035.firebaseapp.com", databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com", projectId: "lunaexplica-60035", storageBucket: "lunaexplica-60035.firebasestorage.app", messagingSenderId: "550469014323", appId: "1:550469014323:web:be79e10f33abc619432446", measurementId: "G-583N74HNVW" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        const APP_ID = 'luna_academy'; const ADMIN_EMAIL = 'dudbilopr@gmail.com'; const AppContext = createContext();

        // --- BANCO DE PREGUNTAS (Alto Nivel Investigativo) ---
        const DEFAULT_QUESTIONS = [
            { id: "q1", type: "adaptive_radio", category: "teoria_descargo", difficulty: 1, text: "Según la Pedagogía del Descargo, ¿cuál es el propósito principal de la citación a descargos además de garantizar el debido proceso?", options: [ { id: "o1", text: "Imponer una sanción ejemplarizante de manera expedita." }, { id: "o2", text: "Establecer un espacio dialógico para reducir la asimetría de conocimiento legal y esclarecer los hechos." }, { id: "o3", text: "Cumplir un mero requisito formal exigido por el Ministerio de Trabajo." }, { id: "o4", text: "Intimidar al trabajador para forzar una renuncia voluntaria." } ], correctOption: "o2" },
            { id: "q2", type: "sequence_sorter", category: "procedimiento", difficulty: 2, text: "Ordene lógicamente las etapas del Proceso Disciplinario Laboral garantista:", items: [ { id: "s1", text: "Citación formal y clara a descargos." }, { id: "s2", text: "Traslado y acceso a las pruebas del expediente." }, { id: "s3", text: "Audiencia de descargos (escucha activa y pedagógica)." }, { id: "s4", text: "Decisión motivada y proporcional." }, { id: "s5", text: "Notificación de la sanción y recursos de apelación." } ], correctSequence: ["s1", "s2", "s3", "s4", "s5"] },
            { id: "q3", type: "cloze_text", category: "analisis_caso", difficulty: 3, text: "En un caso de presunta falta grave, la empresa debe garantizar que el trabajador conozca las {1} en su contra antes de la audiencia. Si la sanción implica despido, esta debe ser {2} a la falta cometida, respetando el principio de {3}.", blanks: [ { id: "b1", options: ["sospechas", "pruebas", "decisiones"], correct: "pruebas" }, { id: "b2", options: ["anterior", "proporcional", "indiferente"], correct: "proporcional" }, { id: "b3", options: ["inmediatez", "favorabilidad", "culpabilidad"], correct: "inmediatez" } ] },
            { id: "q4", type: "image_hotspot", category: "analisis_documental", difficulty: 4, text: "Revise la simulación de Carta de Citación a Descargos. Haga clic en la sección que VULNERA el debido proceso por prejuzgamiento.", imageDoc: { header: "CARTA DE CITACIÓN A DESCARGOS", body: "Señor(a) Trabajador(a), se le cita a diligencia de descargos para mañana a las 8:00 AM.\n\nMotivo: Se le acusa de robo de inventario, por lo cual la empresa ya tomó la decisión de terminar su contrato, pero requerimos agotar el requisito de escucharlo.", footer: "Firma: RRHH" }, hotspots: [ { id: "h1", top: "20%", left: "10%", width: "80%", height: "20%", isCorrect: false }, { id: "h2", top: "50%", left: "10%", width: "80%", height: "30%", isCorrect: true } ] },
            { id: "q5", type: "adaptive_radio", category: "analisis_jurisprudencial", difficulty: 4, text: "Un trabajador omite un protocolo de seguridad causando un daño menor. En la audiencia demuestra que la empresa nunca le brindó la capacitación específica. Desde el enfoque pedagógico y legal (C.S.T), ¿qué acción procede?", options: [ { id: "o1", text: "Despido por justa causa basado en la presunción de mala fe." }, { id: "o2", text: "Sanción máxima pecuniaria para resarcir el daño." }, { id: "o3", text: "Abstención de sanción punitiva, ordenando una capacitación correctiva y un plan de mejora." }, { id: "o4", text: "Suspensión de 2 meses sin derecho a remuneración." } ], correctOption: "o3" },
            { id: "q6", type: "cloze_text", category: "principios_derecho", difficulty: 5, text: "La Corte Constitucional ha reiterado que en el proceso disciplinario rige el principio de {1}, que prohíbe sancionar dos veces por el mismo hecho (Non bis in idem). Asimismo, si hay dudas razonables sobre la culpabilidad, se debe aplicar el principio {2}.", blanks: [ { id: "b1", options: ["legalidad", "inmediatez", "tipicidad"], correct: "legalidad" }, { id: "b2", options: ["pacta sunt servanda", "in dubio pro operario", "solve et repete"], correct: "in dubio pro operario" } ] }
        ];

        // --- COMPONENTES UI COMPACTOS ---
        const GlassCard = ({ children, className = "" }) => <div className={`glass-panel rounded-2xl p-6 ${className}`}>{children}</div>;
        const Button = ({ children, variant = 'primary', onClick, className = "", disabled=false, icon: Icon }) => {
            const vars = { primary: "bg-law-600 hover:bg-law-500 text-white shadow-law-600/30", secondary: "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700", outline: "border border-law-500 text-law-500 hover:bg-law-500 hover:text-white" };
            return <button onClick={onClick} disabled={disabled} className={`flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-semibold transition-all duration-300 disabled:opacity-50 ${vars[variant]} ${className}`}>{Icon && <Icon size={18} />}{children}</button>;
        };
        const FormField = ({ label, type="text", value, onChange, options, placeholder, required=false, as="input" }) => (
            <div className="flex flex-col gap-1 mb-4 w-full">
                {label && <label className="text-sm text-slate-400 font-medium">{label}</label>}
                {as === "select" ? (
                    <select value={value} onChange={onChange} required={required} className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-law-500 outline-none">
                        <option value="" disabled>Seleccione...</option>{options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                    </select>
                ) : as === "textarea" ? (
                    <textarea value={value} onChange={onChange} placeholder={placeholder} required={required} className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-law-500 outline-none min-h-[100px]"></textarea>
                ) : (
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} className="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-law-500 outline-none" />
                )}
            </div>
        );

        // --- VISTAS ---
        const AuthView = () => {
            const { setUser, setView } = useContext(AppContext);
            const [mode, setMode] = useState('login'); // login | register
            const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false); const [error, setError] = useState("");

            const checkUserRecord = async (user) => {
                try {
                    if (user.email === ADMIN_EMAIL) { setUser({ ...user, role: 'admin', isMaster: true }); setView('dashboard'); return; }
                    const docSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data'));
                    if (docSnap.exists()) { setUser({ ...user, ...docSnap.data() }); setView('intro'); } 
                    else { setUser(user); setView('profile'); }
                } catch(e) { setUser(user); setView('profile'); }
            };

            const handleError = (err) => {
                if(err.message.includes('auth/operation-not-allowed') || err.message.includes('400')) {
                    setError("Error: Asegúrate de habilitar 'Correo/Contraseña' y 'Anónimo' en Firebase > Authentication.");
                } else if(err.message.includes('invalid-credential')) { setError("Credenciales incorrectas."); }
                else { setError(err.message); }
                setLoading(false);
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault(); setLoading(true); setError("");
                try {
                    const result = mode === 'login' ? await signInWithEmailAndPassword(auth, email, password) : await createUserWithEmailAndPassword(auth, email, password);
                    await checkUserRecord(result.user);
                } catch (err) { handleError(err); }
            };

            const handleGoogle = async () => {
                setLoading(true); setError("");
                try { await checkUserRecord((await signInWithPopup(auth, new GoogleAuthProvider())).user); } 
                catch (err) { handleError(err); }
            };

            const handleAnon = async () => {
                setLoading(true); setError("");
                try { await checkUserRecord((await signInAnonymously(auth)).user); } 
                catch (err) { handleError(err); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-law-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
                    <GlassCard className="w-full max-w-md text-center z-10 border-t-4 border-t-law-500">
                        <Shield size={48} className="text-law-500 mx-auto mb-4" />
                        <h1 className="text-3xl font-bold mb-2">LunaAcademy</h1>
                        <p className="text-slate-400 mb-6 text-sm">Plataforma de Investigación en Pedagogía del Descargo</p>
                        {error && <div className="mb-4 p-3 bg-red-500/20 text-red-400 rounded-lg text-xs">{error}</div>}
                        
                        <form onSubmit={handleEmailAuth} className="mb-6 text-left">
                            <FormField label="Correo Electrónico" type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
                            <FormField label="Contraseña" type="password" value={password} onChange={e=>setPassword(e.target.value)} required />
                            <Button type="submit" className="w-full mt-2" disabled={loading}>{mode === 'login' ? 'Ingresar' : 'Crear Cuenta'}</Button>
                        </form>
                        
                        <button onClick={()=>setMode(mode==='login'?'register':'login')} className="text-law-400 text-sm mb-6 hover:underline">
                            {mode === 'login' ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión'}
                        </button>

                        <div className="flex flex-col gap-3 border-t border-slate-700 pt-6">
                            <Button onClick={handleGoogle} variant="outline" disabled={loading}>Continuar con Google</Button>
                            <Button onClick={handleAnon} variant="secondary" disabled={loading}>Ingreso Libre (Anónimo)</Button>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        const ProfileView = () => {
            const { user, setUser, setView } = useContext(AppContext);
            const [formData, setFormData] = useState({ nombre: user?.displayName||'', rol: '', edad: '', genero: '', experiencia: '', sector: '', universidad_empresa: '', biografia: '' });
            const [saving, setSaving] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); setSaving(true);
                try {
                    const userData = { ...formData, role: formData.rol, email: user.email || 'anonimo', createdAt: serverTimestamp() };
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data'), userData, { merge: true });
                    setUser({ ...user, ...userData }); setView('intro');
                } catch (err) { alert("Error al guardar. Verifica permisos."); } 
                finally { setSaving(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 py-12">
                    <GlassCard className="w-full max-w-2xl">
                        <h2 className="text-2xl font-bold mb-2 text-center">Caracterización del Investigador</h2>
                        <p className="text-slate-400 text-sm text-center mb-6">Tus datos ayudarán a contextualizar los resultados pedagógicos.</p>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                            <div className="md:col-span-2"><FormField label="Nombre / Alias" value={formData.nombre} onChange={e=>setFormData({...formData, nombre: e.target.value})} required /></div>
                            <FormField label="Rol Principal" as="select" value={formData.rol} onChange={e=>setFormData({...formData, rol: e.target.value})} required options={[{value:'abogado',label:'Abogado/a'},{value:'rrhh',label:'RRHH'},{value:'estudiante',label:'Estudiante'},{value:'empleado',label:'Empleado'},{value:'lider',label:'Líder/Gerente'}]} />
                            <FormField label="Sector" as="select" value={formData.sector} onChange={e=>setFormData({...formData, sector: e.target.value})} required options={[{value:'publico',label:'Público'},{value:'privado',label:'Privado'},{value:'independiente',label:'Independiente'}]} />
                            <FormField label="Edad" type="number" value={formData.edad} onChange={e=>setFormData({...formData, edad: e.target.value})} required />
                            <FormField label="Años de Experiencia" type="number" value={formData.experiencia} onChange={e=>setFormData({...formData, experiencia: e.target.value})} required />
                            <FormField label="Género" as="select" value={formData.genero} onChange={e=>setFormData({...formData, genero: e.target.value})} required options={[{value:'f',label:'Femenino'},{value:'m',label:'Masculino'},{value:'o',label:'Otro / Prefiero no decir'}]} />
                            <FormField label="Organización/Universidad" value={formData.universidad_empresa} onChange={e=>setFormData({...formData, universidad_empresa: e.target.value})} />
                            <div className="md:col-span-2"><FormField label="Expectativas (Breve)" as="textarea" value={formData.biografia} onChange={e=>setFormData({...formData, biografia: e.target.value})} /></div>
                            <div className="md:col-span-2 mt-4"><Button type="submit" className="w-full" disabled={saving}>{saving ? "Guardando..." : "Comenzar"}</Button></div>
                        </form>
                    </GlassCard>
                </div>
            );
        };

        const TheoryView = () => {
            const { setView } = useContext(AppContext); const [step, setStep] = useState(0);
            const content = [
                { title: "El Problema Histórico", icon: Scale, text: "Tradicionalmente, el derecho laboral ha sido instrumentalizado como un mecanismo de control punitivo, alejándose de su propósito tuitivo (protector).", tip: "El proceso disciplinario se convirtió en un 'micro-juicio' donde el trabajador entra condenado." },
                { title: "La Asimetría de Poder", icon: BrainCircuit, text: "Existe una brecha gigante entre el conocimiento legal del empleador (RRHH/Abogados) y el trabajador, dejándolo en indefensión material.", tip: "La Pedagogía del Descargo busca nivelar esta cancha usando lenguaje claro y accesible." },
                { title: "Notificación: El Primer Pilar", icon: FileText, text: "La carta de citación debe ser educativa. Debe explicar los hechos precisos y los derechos, sin lenguaje oscuro ni amenazas implícitas.", tip: "Evitar el 'Prejuzgamiento'. Si la carta dice 'se tomó la decisión', el proceso ya es nulo." },
                { title: "Audiencia: Escucha Activa", icon: MessageSquare, text: "El empleador debe asumir un rol de 'docente-facilitador', no de inquisidor. Es el momento para escuchar el contexto del trabajador.", tip: "Muchos errores laborales nacen de fallas organizacionales o falta de capacitación, no de mala fe." },
                { title: "Decisión Proporcional", icon: Award, text: "La sanción debe ser la *última ratio* (último recurso). El objetivo principal debe ser corregir la conducta y educar, no castigar por castigar.", tip: "Aplica siempre el principio de favorabilidad y proporcionalidad al decidir." }
            ];
            const CIcon = content[step].icon;

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-4xl mx-auto">
                    <header className="flex justify-between items-center mb-8">
                        <h1 className="text-xl font-bold text-law-400">Módulo Teórico</h1>
                        <Button variant="outline" onClick={() => setView('evaluation')} className="py-1 px-3 text-xs">Saltar <ChevronRight size={14}/></Button>
                    </header>
                    <GlassCard className="flex-1 flex flex-col items-center justify-center text-center p-8 animate-fade-in relative">
                        <div className="p-4 bg-slate-800 rounded-2xl mb-6 text-law-400"><CIcon size={56} /></div>
                        <h2 className="text-3xl font-bold mb-4">{content[step].title}</h2>
                        <p className="text-lg text-slate-300 leading-relaxed mb-8">{content[step].text}</p>
                        <div className="w-full bg-law-900/40 border border-law-500/30 p-4 rounded-xl text-left flex gap-3">
                            <AlertTriangle className="text-yellow-400 shrink-0" />
                            <div><strong className="text-law-300 block mb-1">Reflexión Pedagógica:</strong><span className="text-sm text-slate-200">{content[step].tip}</span></div>
                        </div>
                        <div className="flex justify-between items-center w-full mt-12">
                            <Button variant="secondary" onClick={() => setStep(step-1)} disabled={step===0}><ChevronLeft size={16}/> Ant</Button>
                            <div className="flex gap-2">{content.map((_, i) => <div key={i} className={`h-2 rounded-full transition-all ${i===step?'bg-law-500 w-8':'bg-slate-700 w-2'}`}/>)}</div>
                            {step < content.length-1 ? <Button onClick={() => setStep(step+1)}>Sig <ChevronRight size={16}/></Button> : <Button onClick={() => setView('evaluation')}>Evaluar</Button>}
                        </div>
                    </GlassCard>
                </div>
            );
        };

        // --- SUBCOMPONENTES DE PREGUNTAS MANTENIDOS ---
        const AdaptiveRadio = ({ q, onAnswer, sel }) => <div className="flex flex-col gap-3 mt-6">{q.options.map(o => <button key={o.id} onClick={()=>onAnswer(o.id)} className={`text-left p-4 rounded-xl border flex gap-3 ${sel===o.id?'bg-law-600/20 border-law-500':'bg-slate-800/50 border-slate-700'}`}><div className={`mt-1 min-w-[16px] h-4 rounded-full border-2 flex items-center justify-center ${sel===o.id?'border-law-500':'border-slate-500'}`}>{sel===o.id && <div className="w-2 h-2 bg-law-500 rounded-full"/>}</div><span className="text-sm">{o.text}</span></button>)}</div>;
        const SequenceSorter = ({ q, onAnswer, sel }) => {
            const [items, setItems] = useState(sel || q.items);
            useEffect(()=>onAnswer(items.map(i=>i.id)), [items]);
            const move = (idx, dir) => { const n=[...items]; [n[idx], n[idx+dir]] = [n[idx+dir], n[idx]]; setItems(n); };
            return <div className="flex flex-col gap-2 mt-6">{items.map((it, i) => <div key={it.id} className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700"><div className="flex flex-col"><button onClick={()=>move(i,-1)} disabled={i===0} className="text-slate-400 disabled:opacity-30"><ChevronLeft className="rotate-90" size={16}/></button><button onClick={()=>move(i,1)} disabled={i===items.length-1} className="text-slate-400 disabled:opacity-30"><ChevronLeft className="-rotate-90" size={16}/></button></div><div className="text-law-400 font-bold">{i+1}</div><span className="text-sm">{it.text}</span></div>)}</div>;
        };
        const ClozeText = ({ q, onAnswer, sel={} }) => (
            <div className="mt-6 p-6 bg-slate-800/50 rounded-xl border border-slate-700 text-lg leading-loose">
                {q.text.split(/({[0-9]+})/g).map((pt, i) => {
                    const m = pt.match(/{([0-9]+)}/);
                    if(m) { const b = q.blanks[parseInt(m[1])-1]; return b ? <select key={i} value={sel[b.id]||""} onChange={e=>onAnswer({...sel, [b.id]: e.target.value})} className="mx-2 bg-slate-900 border-b-2 border-law-500 text-law-300 font-bold outline-none px-2 py-1"><option value="" disabled>_</option>{b.options.map(o=><option key={o} value={o}>{o}</option>)}</select> : null; }
                    return <span key={i}>{pt}</span>;
                })}
            </div>
        );
        const ImageHotspot = ({ q, onAnswer, sel }) => (
            <div className="mt-6"><div className="hotspot-container bg-slate-100 shadow-inner"><div className="font-bold text-center border-b pb-2 mb-4">{q.imageDoc.header}</div><div className="whitespace-pre-wrap text-sm text-gray-800 mb-8">{q.imageDoc.body}</div><div className="text-right text-xs italic border-t pt-2">{q.imageDoc.footer}</div>{q.hotspots.map(hs => <div key={hs.id} className={`hotspot-zone ${sel===hs.id?'selected':''}`} style={{top:hs.top,left:hs.left,width:hs.width,height:hs.height}} onClick={()=>onAnswer(hs.id)}/>)}</div></div>
        );

        const EvaluationView = () => {
            const { user, setView, setEvaluationData } = useContext(AppContext);
            const [qs, setQs] = useState([]); const [idx, setIdx] = useState(0); const [ans, setAns] = useState({});
            const [hints, setHints] = useState([]); const [msg, setMsg] = useState(""); const [start] = useState(Date.now());

            useEffect(() => {
                getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'question_bank'))
                .then(snap => { let d=[]; snap.forEach(doc=>d.push({id:doc.id,...doc.data()})); setQs(d.length ? d : DEFAULT_QUESTIONS); })
                .catch(() => setQs(DEFAULT_QUESTIONS));
            }, []);

            if(!qs.length) return <div className="text-center p-10">Cargando...</div>;
            const q = qs[idx];

            const finish = async () => {
                let score = 0, correct = 0, details = [];
                qs.forEach(quest => {
                    let isC = false, a = ans[quest.id];
                    if(quest.type==='adaptive_radio' && a===quest.correctOption) isC=true;
                    if(quest.type==='sequence_sorter' && JSON.stringify(a)===JSON.stringify(quest.correctSequence)) isC=true;
                    if(quest.type==='cloze_text') { isC = quest.blanks.every(b => a?.[b.id] === b.correct); }
                    if(quest.type==='image_hotspot') { isC = quest.hotspots.find(h=>h.id===a)?.isCorrect; }
                    let pts = isC ? quest.difficulty*10 : 0;
                    if(hints.includes(quest.id)) pts = Math.max(0, pts-5);
                    if(isC) correct++; score+=pts; details.push({qId: quest.id, isC, pts});
                });
                const max = qs.reduce((acc, quest) => acc + (quest.difficulty*10), 0);
                const payload = { userId: user.uid, role: user.role, score, perc: Math.round((score/max)*100)||0, time: Math.floor((Date.now()-start)/1000), hints: hints.length, details, timestamp: serverTimestamp() };
                try { await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_results'), payload); } catch(e){}
                setEvaluationData(payload); setView('results');
            };

            const sendDoubt = async () => {
                if(!msg.trim()) return;
                try { await addDoc(collection(db,'artifacts',APP_ID,'public','data','chat_doubts'), {text:msg, userId:user.uid, qId:q.id, ts:serverTimestamp()}); setMsg(""); alert("Duda enviada al foro."); } catch(e){}
            };

            return (
                <div className="min-h-screen p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
                    <div className="lg:col-span-2 flex flex-col">
                        <header className="flex justify-between items-center mb-6"><div className="font-medium text-slate-400">ANÁLISIS</div><div className="bg-slate-800 px-3 py-1 rounded-full text-xs">Pregunta {idx+1}/{qs.length}</div></header>
                        <GlassCard className="flex-1 flex flex-col">
                            <div className="flex justify-between mb-4"><span className="text-xs uppercase text-law-500">{q.category.replace('_',' ')}</span><button onClick={()=>!hints.includes(q.id)&&setHints([...hints, q.id])} className="text-yellow-500"><HelpCircle size={20}/></button></div>
                            <h2 className="text-xl font-semibold mb-2">{q.text}</h2>
                            {hints.includes(q.id) && <div className="text-xs text-yellow-300 bg-yellow-900/30 p-2 rounded mb-2">Pista: Usa la lógica protectora laboral.</div>}
                            <div className="flex-1">
                                {q.type==='adaptive_radio' && <AdaptiveRadio q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                {q.type==='sequence_sorter' && <SequenceSorter q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                {q.type==='cloze_text' && <ClozeText q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                {q.type==='image_hotspot' && <ImageHotspot q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                            </div>
                            <div className="mt-8 flex justify-end"><Button onClick={()=>idx<qs.length-1?setIdx(idx+1):finish()} disabled={!ans[q.id]||(q.type==='cloze_text'&&Object.keys(ans[q.id]).length<q.blanks.length)}>{idx===qs.length-1?'Finalizar':'Siguiente'}</Button></div>
                        </GlassCard>
                    </div>
                    <div className="lg:col-span-1 flex flex-col gap-6">
                        <GlassCard className="flex-1 flex flex-col"><h3 className="font-semibold mb-2 flex items-center gap-2"><MessageSquare size={18}/> Foro en Vivo</h3><p className="text-xs text-slate-400 mb-4">Escribe tus dudas anónimamente.</p><div className="flex-1"/><textarea value={msg} onChange={e=>setMsg(e.target.value)} className="bg-slate-800 rounded p-2 text-sm h-24 outline-none mb-2"/><Button onClick={sendDoubt} className="py-2">Enviar Duda</Button></GlassCard>
                    </div>
                </div>
            );
        };

        const ResultsView = () => {
            const { user, setView, evaluationData: data } = useContext(AppContext);
            const [survey, setSurvey] = useState({claridad:5, relevancia:5}); const [sent, setSent] = useState(false);
            
            const diag = data.perc >= 80 ? "Excelente enfoque garantista." : data.perc >= 50 ? "Nivel medio. Reforzar lógica dialógica." : "Sesgo punitivo tradicional detectado. Requiere repaso.";
            const sendSurvey = async () => { try { await addDoc(collection(db,'artifacts',APP_ID,'public','data','reviews'), {...survey, uid:user.uid, ts:serverTimestamp()}); setSent(true); } catch(e){} };

            return (
                <div className="min-h-screen p-8 max-w-4xl mx-auto text-center flex flex-col items-center">
                    <Award size={64} className="text-law-500 mb-4" />
                    <h1 className="text-4xl font-bold mb-8">Diagnóstico: {data.perc}%</h1>
                    <GlassCard className="w-full mb-8"><p className="text-lg">{diag}</p></GlassCard>
                    <GlassCard className="w-full max-w-md">
                        <h3 className="font-bold mb-4">Valora la Plataforma</h3>
                        {!sent ? <><div className="flex justify-between mb-4"><label>Claridad</label><input type="range" min="1" max="5" value={survey.claridad} onChange={e=>setSurvey({...survey, claridad:e.target.value})}/></div><Button onClick={sendSurvey}>Enviar</Button></> : <p className="text-green-400">¡Gracias!</p>}
                        <div className="mt-6 border-t border-slate-700 pt-4 flex justify-center gap-4">
                            {user.isMaster && <Button variant="outline" onClick={()=>setView('dashboard')}>Panel Admin</Button>}
                            <Button variant="secondary" onClick={()=>{auth.signOut();setView('login');}}>Salir</Button>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        const AdminDashboardView = () => {
            const { setView } = useContext(AppContext);
            const [res, setRes] = useState([]); const [dbt, setDbt] = useState([]);
            useEffect(() => {
                getDocs(query(collection(db,'artifacts',APP_ID,'public','data','chat_results'), orderBy('timestamp','desc'))).then(s=>{let d=[]; s.forEach(x=>d.push(x.data())); setRes(d);});
                getDocs(query(collection(db,'artifacts',APP_ID,'public','data','chat_doubts'), orderBy('ts','desc'), limit(20))).then(s=>{let d=[]; s.forEach(x=>d.push(x.data())); setDbt(d);});
            }, []);

            return (
                <div className="min-h-screen p-8 max-w-7xl mx-auto">
                    <header className="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                        <h1 className="text-2xl font-bold flex items-center gap-2"><Settings className="text-law-500"/> Panel Maestro Investigativo</h1>
                        <div className="flex gap-2">
                            <Button variant="outline" onClick={()=>setView('intro')} className="py-2 text-sm">Ver Plataforma</Button>
                            <Button variant="danger" onClick={()=>{auth.signOut();setView('login');}} className="py-2 text-sm">Salir</Button>
                        </div>
                    </header>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <GlassCard><h3 className="text-slate-400">Evaluaciones</h3><p className="text-3xl font-bold">{res.length}</p></GlassCard>
                        <GlassCard><h3 className="text-slate-400">Promedio CCI</h3><p className="text-3xl font-bold">{res.length?Math.round(res.reduce((a,b)=>a+b.perc,0)/res.length):0}%</p></GlassCard>
                        <GlassCard className="md:col-span-3">
                            <h3 className="font-bold mb-4">Dudas Recientes (Investigación Cualitativa)</h3>
                            {dbt.map((d,i)=><div key={i} className="bg-slate-800 p-3 rounded mb-2 text-sm"><span className="text-law-400 font-mono text-xs mr-2">[{d.qId}]</span>{d.text}</div>)}
                        </GlassCard>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login'); const [user, setUser] = useState(null); const [evalData, setEvaluationData] = useState(null);
            useEffect(() => {
                return onAuthStateChanged(auth, async (u) => {
                    if(!u) { setUser(null); setView('login'); return; }
                    if(u.email === ADMIN_EMAIL) { setUser({...u, role:'admin', isMaster:true}); setView('dashboard'); }
                    else if(view === 'login') {
                        try { const snap = await getDoc(doc(db,'artifacts',APP_ID,'users',u.uid,'profile','data'));
                            if(snap.exists()){ setUser({...u,...snap.data()}); setView('intro'); } else { setUser(u); setView('profile'); }
                        } catch(e) { setUser(u); setView('profile'); }
                    }
                });
            }, []);

            return (
                <AppContext.Provider value={{ user, setUser, setView, evaluationData: evalData, setEvaluationData }}>
                    <div className="min-h-screen text-slate-50 relative selection:bg-law-500/30">
                        {view==='login'&&<AuthView/>}{view==='profile'&&<ProfileView/>}{view==='intro'&&<div className="min-h-screen flex flex-col items-center justify-center text-center p-4 max-w-2xl mx-auto"><Shield size={64} className="text-law-500 mb-6"/><h1 className="text-4xl font-bold mb-4">Hola, Investigador</h1><p className="text-slate-400 mb-8">Inicia tu recorrido por la Pedagogía del Descargo.</p><Button onClick={()=>setView('theory')}>Comenzar</Button></div>}{view==='theory'&&<TheoryView/>}{view==='evaluation'&&<EvaluationView/>}{view==='results'&&<ResultsView/>}{view==='dashboard'&&<AdminDashboardView/>}
                    </div>
                </AppContext.Provider>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
