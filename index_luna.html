    <script type="text/babel" data-type="module">
        import React,{useState,useEffect,useRef,useMemo} from 'react'; import {createRoot} from 'react-dom/client';
        import {Scale,BrainCircuit,ShieldAlert,CheckCircle,XCircle,HelpCircle,Lock,LayoutDashboard,ChevronRight,AlertTriangle,TrendingUp,Activity,Copy,Star,Users,Briefcase,FileSignature,Info,User,Clock,BookOpen,Award,Link as LinkIcon,GraduationCap,Database,Brain,MessageCircle,MessageSquare,Sun,Moon,PlusCircle,Save,List,Zap,Crown} from 'lucide-react';
        import {LineChart,Line,XAxis,YAxis,CartesianGrid,Tooltip,Legend,BarChart,Bar,ScatterChart,Scatter,ResponsiveContainer,Cell,PieChart,Pie} from 'recharts';
        import {initializeApp} from 'firebase/app'; import {getAuth,signInAnonymously,onAuthStateChanged,signInWithCustomToken,GoogleAuthProvider,signInWithPopup} from 'firebase/auth'; import {getFirestore,collection,addDoc,onSnapshot,serverTimestamp,writeBatch,doc,getDocs,setDoc} from 'firebase/firestore';

        const app=initializeApp({apiKey:"AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk",authDomain:"lunaexplica-60035.firebaseapp.com",databaseURL:"https://lunaexplica-60035-default-rtdb.firebaseio.com",projectId:"lunaexplica-60035",storageBucket:"lunaexplica-60035.firebasestorage.app",messagingSenderId:"550469014323",appId:"1:550469014323:web:be79e10f33abc619432446",measurementId:"G-583N74HNVW"});
        const auth=getAuth(app); const db=getFirestore(app);
        
        const APP_ID='lunaacademy-procesos-disciplinarios-v1'; 
        const [COLLECTION_PATH,DOUBTS_PATH,SURVEYS_PATH,QUESTIONS_PATH,USERS_PATH]=[`artifacts/${APP_ID}/public/data/chat_telemetry`,`artifacts/${APP_ID}/public/data/chat_doubts`,`artifacts/${APP_ID}/public/data/reviews`,`artifacts/${APP_ID}/public/data/question_bank`,`artifacts/${APP_ID}/public/data/directory`];

        const QUESTION_BANK=[
            {id:"q1_concepto",theme:"Conceptos Básicos",type:"adaptive_radio",level:1,difficulty:0.3,expectedTime:45,title:"¿Qué es un proceso disciplinario?",context:"En el entorno laboral, las empresas pueden sancionar a sus empleados, pero no de manera arbitraria.",question:"Define la naturaleza jurídica de un proceso disciplinario laboral:",options:[{id:"A",text:"Es un castigo automático que el empleador aplica inmediatamente al notar una falla.",isCorrect:!1,feedback:"Los castigos automáticos violan el derecho a la defensa."},{id:"B",text:"Es un procedimiento estructurado para investigar presuntas faltas y sancionarlas garantizando el debido proceso.",isCorrect:!0,feedback:"Mecanismo que equilibra subordinación con derechos del empleado."},{id:"C",text:"Es una etapa obligatoria antes de negociar la renuncia de un empleado.",isCorrect:!1,feedback:"Su fin no es coaccionar renuncias."}],tip:"La clave está en los derechos constitucionales. Nadie puede ser juzgado sin ser escuchado."},
            {id:"q11_cloze",theme:"Conceptos Básicos",type:"cloze_text",level:2,difficulty:0.45,expectedTime:60,title:"Conceptos Fundamentales",context:"Es esencial distinguir acciones legítimas de prácticas prohibidas.",question:"Completa el párrafo conceptual:",codeTemplate:"La facultad del empleador de modificar las condiciones de trabajo se denomina [HUECO_1]. Si un superior ejerce conductas reiteradas para infundir miedo o inducir la renuncia, esto se clasifica como [HUECO_2], regulado en Colombia por la Ley [HUECO_3].",blanks:[{id:"HUECO_1",answer:"Ius Variandi",options:["Debido Proceso","Ius Variandi","Presunción de Inocencia"]},{id:"HUECO_2",answer:"Acoso Laboral",options:["Sanción Disciplinaria","Despido Justo","Acoso Laboral"]},{id:"HUECO_3",answer:"1010 de 2006",options:["100 de 1993","1010 de 2006","789 de 2002"]}],tip:"'Ius Variandi' es el derecho a variar condiciones. El acoso busca dañar."},
            {id:"q13_recursos",theme:"Recursos Legales",type:"adaptive_radio",level:3,difficulty:0.5,expectedTime:50,title:"Medios de Impugnación (Ley 1952)",context:"Una vez emitido un fallo disciplinario, el sujeto disciplinable tiene derecho a contradecir la decisión.",question:"Según la normatividad disciplinaria, ¿cuáles son los recursos procedentes contra las decisiones?",options:[{id:"A",text:"Únicamente la Acción de Tutela por violación al debido proceso.",isCorrect:!1,feedback:"La tutela es subsidiaria, se deben agotar primero los recursos ordinarios."},{id:"B",text:"Recurso de Reposición, Recurso de Apelación y Recurso de Queja.",isCorrect:!0,feedback:"¡Correcto! Son los 3 recursos estatuidos para impugnar y garantizar doble instancia."},{id:"C",text:"Casación laboral y Revisión.",isCorrect:!1,feedback:"Estos son recursos extraordinarios ante las Altas Cortes."}],tip:"Garantizan el principio de la doble instancia y la revisión por un superior jerárquico."},
            {id:"q14_etapas",theme:"Estructura Ley 1952/2094",type:"adaptive_radio",level:4,difficulty:0.6,expectedTime:60,title:"Separación de Etapas",context:"La reciente legislación disciplinaria colombiana exige evitar que quien investiga sea el mismo que juzga.",question:"¿Cuáles son las dos grandes etapas procedimentales que deben estar separadas para garantizar la imparcialidad?",options:[{id:"A",text:"La etapa de Indagación Previa y la etapa de Sanción Inmediata.",isCorrect:!1,feedback:"No existe la 'Sanción Inmediata' en el derecho disciplinario garantista."},{id:"B",text:"La etapa de Instrucción y la etapa de Juzgamiento.",isCorrect:!0,feedback:"¡Correcto! La instrucción investiga y acusa; el juzgamiento evalúa y decide."},{id:"C",text:"La etapa Verbal y la etapa Escrita.",isCorrect:!1,feedback:"La oralidad es un principio, no una etapa de separación funcional."}],tip:"Se dividen entre quien 'instruye' el caso (recauda pruebas) y quien 'juzga'."},
            {id:"q3_secuencia",theme:"Procedimiento",type:"sequence_sorter",level:5,difficulty:0.6,expectedTime:90,title:"Análisis del Proceso (Pasos)",context:"Teniendo en cuenta la separación de roles (Instrucción y Juzgamiento), organiza las etapas.",question:"Ordena cronológicamente los pasos para ejecutar un proceso disciplinario.",items:[{id:"s1",content:"Recepción de queja e Indagación Previa."},{id:"s2",content:"Apertura de Investigación y formulación de cargos."},{id:"s3",content:"Diligencia de descargos (Defensa)."},{id:"s4",content:"Evaluación objetiva (Juzgamiento)."},{id:"s5",content:"Fallo y procedencia de recursos."}],tip:"Primero te enteras, acusas, escuchas, juzgas y fallas."},
            {id:"q15_notifica",theme:"Notificaciones",type:"adaptive_radio",level:6,difficulty:0.65,expectedTime:50,title:"Tiempos de Notificación",context:"Es vital que las partes conozcan las decisiones del ente investigador. Se ordenó el archivo de unas diligencias.",question:"Según las directrices disciplinarias, ¿cómo se entiende cumplida la comunicación al quejoso de la decisión de archivo?",options:[{id:"A",text:"De manera inmediata al enviar un correo electrónico.",isCorrect:!1,feedback:"La ley otorga un margen temporal de presunción para garantizar el recibo."},{id:"B",text:"Cuando hayan transcurrido 5 días a partir del día siguiente a la fecha de entrega de la comunicación.",isCorrect:!0,feedback:"¡Exacto! Este es el término legal para presumir notificada la decisión."},{id:"C",text:"Solo mediante notificación personal y firma física.",isCorrect:!1,feedback:"Las decisiones de archivo se comunican, no requieren forzosamente comparecencia personal."}],tip:"La ley da un margen de 5 días hábiles."},
            {id:"q12_ia",theme:"Jurisprudencia (IA)",type:"adaptive_radio",level:7,difficulty:0.8,expectedTime:80,title:"IA en Procesos (Sentencia T-323/24)",context:"Un jefe de RRHH usa ChatGPT para redactar y decidir un fallo disciplinario, sin leer el expediente ni verificar.",question:"Según la Sentencia T-323 de 2024 de la Corte Constitucional, ¿es válido este proceder?",options:[{id:"A",text:"Sí, la IA es una herramienta técnica válida que agiliza la justicia disciplinaria.",isCorrect:!1,feedback:"Agiliza, pero no puede reemplazar el juicio humano autónomo."},{id:"B",text:"No, la IA es herramienta de síntesis, pero existe un alto riesgo si no se verifica. No reemplaza al funcionario.",isCorrect:!0,feedback:"¡Preciso! La autoridad tiene un estándar alto de verificación sobre los datos de la máquina."},{id:"C",text:"No, el uso de tecnología e internet está prohibido en fallos.",isCorrect:!1,feedback:"La tecnología es permitida, lo prohibido es la delegación total sin verificación."}],tip:"La máquina asiste, pero el humano juzga y asume la responsabilidad."},
            {id:"q4_sanciones",theme:"Sanciones",type:"image_hotspot",level:8,difficulty:0.7,expectedTime:70,title:"Auditoría de Sanciones",imageUrl:"https://images.unsplash.com/photo-1555374018-1c4fa4782202?auto=format&fit=crop&q=80&w=800",context:"Revisando el Reglamento Interno, encuentras la tabla de sanciones.",question:"Haz clic en la sanción ILEGAL según el Art. 112 del CST.",hotspots:[{id:"h1",x:25,y:35,isCorrect:!1,text:"Llamado verbal con copia."},{id:"h2",x:65,y:70,isCorrect:!0,text:"Suspensión por 45 días la primera vez."},{id:"h3",x:75,y:15,isCorrect:!1,text:"Multa de la 5ta parte del día."}],tip:"Las suspensiones no pueden superar los 8 días por primera vez."},
            {id:"q5_hojavida",theme:"Sanciones",type:"adaptive_radio",level:9,difficulty:0.5,expectedTime:40,title:"Impacto en la Hoja de Vida",context:"Juan fue sancionado y teme por su futuro al buscar otro empleo.",question:"¿Los procesos disciplinarios quedan en la hoja de vida pública?",options:[{id:"A",text:"Sí, aparecen como antecedentes penales.",isCorrect:!1,feedback:"Falso. Solo aplica a funcionarios públicos."},{id:"B",text:"No, quedan en el expediente laboral interno de la empresa.",isCorrect:!0,feedback:"¡Correcto! Es un registro interno de la compañía."},{id:"C",text:"No, el Ministerio ordena borrarlas a los 30 días.",isCorrect:!1,feedback:"Incorrecto. Quedan en el historial interno."}],tip:"El sector privado maneja expedientes internos."},
            {id:"q6_terminacion",theme:"Sanciones Extrema",type:"adaptive_radio",level:10,difficulty:0.8,expectedTime:60,title:"Terminación del Contrato",context:"María cree que se requieren 3 memorandos antes del despido.",question:"¿Tras cuántos procesos se puede terminar el contrato (Art 62 CST)?",options:[{id:"A",text:"Obligatoriamente después de 3 llamados de atención.",isCorrect:!1,feedback:"Mito común. No hay número exacto."},{id:"B",text:"Depende de la gravedad: Una sola falta grave puede ser suficiente.",isCorrect:!0,feedback:"¡Correcto! Depende de la magnitud tipificada de la falta."},{id:"C",text:"Solo cuando un juez lo autorice.",isCorrect:!1,feedback:"El empleador puede despedir si prueba justa causa."}],tip:"Robar a la empresa es falta gravísima sin avisos previos."}
        ];

        const App = () => {
            const [user, setUser] = useState(null); const [isDarkMode, setIsDarkMode] = useState(true); const [view, setView] = useState('loading');
            const [studentInfo, setStudentInfo] = useState({ name:'', email:'', role:'', experience:'', bio:'', academicLink:'', socialLink:'', specialty:'', university:'', learningGoal:!1 });
            const [currentQIndex, setCurrentQIndex] = useState(0); const [score, setScore] = useState(0); const [logs, setLogs] = useState([]);
            const [registeredUsers, setRegisteredUsers] = useState([]); const [dbQuestions, setDbQuestions] = useState([]); const [forumDoubts, setForumDoubts] = useState([]);
            const [authError, setAuthError] = useState(null); const [sessionData, setSessionData] = useState({ startTime:null, currentQStartTime:null, tipsUsed:0, answers:[] });
            const [feedback, setFeedback] = useState(null); const [markedQuestions, setMarkedQuestions] = useState([]);
            const [userDoubt, setUserDoubt] = useState(""); const [doubtSubmitted, setDoubtSubmitted] = useState(!1);
            const [surveyData, setSurveyData] = useState({ clarity:0, relevance:0, difficultyLevel:0, uxui:0, comments:'', submitted:!1 });
            const [adminAuth, setAdminAuth] = useState({ isChecking:!1, password:'', error:'' }); const [adminTab, setAdminTab] = useState('dashboard');
            
            const activeQuestionBank = dbQuestions.length > 0 ? dbQuestions : QUESTION_BANK; const currentQ = activeQuestionBank[currentQIndex];
            const isMasterAdmin = () => ['dudbilopr@gmail.com'].includes((studentInfo?.email||"").toLowerCase().trim()) || ['dudbilopr@gmail.com'].includes((auth.currentUser?.email||"").toLowerCase().trim());

            useEffect(() => { document.documentElement.classList.toggle('dark', isDarkMode); document.body.classList.toggle('dark', isDarkMode); }, [isDarkMode]);

            // AUTH INIT
            useEffect(() => {
                const savedProfile = localStorage.getItem('lunaAcademy_userProfile'); if (savedProfile) setStudentInfo(JSON.parse(savedProfile));
                const initAuth = async () => { try { if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } else { await signInAnonymously(auth).catch(()=>{}); } } catch(e){} };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) { setUser(u||{uid:'local_user'}); if(JSON.parse(savedProfile).role || JSON.parse(savedProfile).learningGoal) setView('intro'); else setView('profile'); }
                    else { setUser(u||{uid:'guest_user'}); setView('login'); }
                });
                return () => unsubscribe();
            }, []);

            // DATA FETCHING (Protegido por Autenticación)
            useEffect(() => {
                if (!user) return; // Guardia anti-errores de permisos
                const unsubLogs = onSnapshot(collection(db, COLLECTION_PATH), snap => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), ()=>{});
                const unsubDoubts = onSnapshot(collection(db, DOUBTS_PATH), snap => setForumDoubts(snap.docs.map(d => ({ id: d.id, ...d.data() }))), ()=>{});
                const unsubUsers = onSnapshot(collection(db, USERS_PATH), snap => setRegisteredUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))), ()=>{});
                (async () => { try { const snap = await getDocs(collection(db, QUESTIONS_PATH)); if (!snap.empty) setDbQuestions(snap.docs.map(doc => doc.data())); } catch(e) {} })();
                return () => { unsubLogs(); unsubDoubts(); unsubUsers(); };
            }, [user]);

            useEffect(() => { setDoubtSubmitted(!1); setUserDoubt(""); }, [currentQIndex]);

            // --- HANDLERS CENTRALIZADOS ---
            const handleManualLogin = () => { localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo)); setView('profile'); };
            const handleGoogleLogin = async () => {
                setAuthError(null); try {
                    const res = await signInWithPopup(auth, new GoogleAuthProvider()); const newInfo = {...studentInfo, name:res.user.displayName, email:res.user.email};
                    setStudentInfo(newInfo); localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(newInfo)); setUser(res.user); setView('profile');
                } catch (e) { setAuthError(e.code === 'auth/unauthorized-domain' ? `DOMINIO NO AUTORIZADO: Añádelo en Firebase.` : `Error: ${e.message}. Usa registro manual.`); }
            };
            const saveProfile = async () => {
                localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo));
                if (user?.uid && studentInfo.email) { try { await setDoc(doc(db, USERS_PATH, user.uid), {...studentInfo, email:studentInfo.email.toLowerCase().trim(), lastAccess: serverTimestamp()}, {merge:!0}); } catch(e){} }
                setView('intro');
            };
            const submitSurvey = async () => { try { await addDoc(collection(db, SURVEYS_PATH), {...surveyData, studentName: studentInfo.name, studentRole: studentInfo.role, score, timestamp: serverTimestamp()}); } catch(e){} setSurveyData({...surveyData, submitted:!0}); };
            const handleDoubtSubmit = async () => { if(!userDoubt.trim()) return; try { await addDoc(collection(db, DOUBTS_PATH), {qId: currentQ.id, theme: currentQ.theme, title: currentQ.title, doubt: userDoubt, timestamp: serverTimestamp()}); } catch(e){} setDoubtSubmitted(!0); setUserDoubt(""); };
            const attemptAdminAccess = () => { if(isMasterAdmin()) { setView('dashboard'); setAdminTab('dashboard'); } else { setAdminAuth({isChecking:!0, password:'', error:''}); } };
            const handleAdminLogin = () => { if(adminAuth.password==='admin123'){setView('dashboard'); setAdminTab('dashboard'); setAdminAuth({isChecking:!1, password:'', error:''});} else setAdminAuth({...adminAuth, error:'Clave incorrecta.'}); };
            const markForLater = () => {
                if(!markedQuestions.includes(currentQ.id)) setMarkedQuestions([...markedQuestions, currentQ.id]);
                const answeredIds = sessionData.answers.map(a=>a.qId); const unasked = activeQuestionBank.findIndex((q,i) => !answeredIds.includes(q.id) && i !== currentQIndex);
                if(unasked !== -1) { setCurrentQIndex(unasked); setFeedback(null); setSessionData(p => ({...p, currentQStartTime: Date.now()})); } else alert("No hay preguntas nuevas.");
            };
            
            const submitAnswer = async (isCorrect, usedTip = !1) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime)/1000); const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e)/t_e) + (usedTip ? 0.5 : 0); const finalPoints = Math.max(0, isCorrect ? (100*currentQ.difficulty)-(usedTip?15:0) : 0);
                let neuroState = "Normal"; if(timeSpent < (t_e*0.3) && !isCorrect) neuroState="Impulsividad"; else if(timeSpent>(t_e*1.5) && isCorrect) neuroState="Duda / Hesitación"; else if(timeSpent>(t_e*1.5) && !isCorrect) neuroState="Sobrecarga Cognitiva"; else if(timeSpent<=t_e && isCorrect) neuroState="Estado de Flujo";
                const ansData = { qId: currentQ.id, title: currentQ.title, isCorrect, timeSpent, points: finalPoints, difficulty: currentQ.difficulty, neuroState };
                try { await addDoc(collection(db, COLLECTION_PATH), { studentName: studentInfo.name||'Anon', studentRole: studentInfo.role||'Libre', studentEmail: studentInfo.email||'N/A', questionId: currentQ.id, theme: currentQ.theme||"General", isCorrect, timeSpent, expectedTime: t_e, usedTip, frustrationIndex: frustration, neuroState, points: finalPoints, timestamp: serverTimestamp() }); } catch(e){}
                const alreadyAns = sessionData.answers.some(a=>a.qId===currentQ.id);
                if (!alreadyAns) { setScore(p=>p+finalPoints); setSessionData(p=>({...p, tipsUsed: p.tipsUsed+(usedTip?1:0), answers: [...p.answers, ansData]})); }
                if (markedQuestions.includes(currentQ.id)) setMarkedQuestions(markedQuestions.filter(id=>id!==currentQ.id));
                setFeedback({ isCorrect, timeSpent, expectedTime: t_e, neuroState });
                setTimeout(() => {
                    setFeedback(null); const ansIds = [...sessionData.answers.map(a=>a.qId)]; if(!alreadyAns) ansIds.push(currentQ.id);
                    const unasked = activeQuestionBank.map((q,i)=>({q,i})).filter(it=>!ansIds.includes(it.q.id));
                    if (unasked.length > 0) {
                        let tDiff = currentQ.difficulty + (isCorrect ? 0.15 : -0.15);
                        unasked.sort(()=>Math.random()-0.5).sort((a,b)=>Math.abs(a.q.difficulty-tDiff)-Math.abs(b.q.difficulty-tDiff));
                        setCurrentQIndex(unasked[0].i); setSessionData(p=>({...p, currentQStartTime: Date.now()}));
                    } else {
                        const mAndU = markedQuestions.filter(id=>!ansIds.includes(id));
                        if(mAndU.length>0) { setCurrentQIndex(activeQuestionBank.findIndex(q=>q.id===mAndU[0])); setSessionData(p=>({...p, currentQStartTime: Date.now()})); } else setView('results');
                    }
                }, 3500); 
            };
            const logout = () => { localStorage.removeItem('lunaAcademy_userProfile'); setStudentInfo({name:'',email:'',role:'',experience:'',bio:'',academicLink:'',socialLink:'',specialty:'',university:'',learningGoal:!1}); auth.signOut(); setView('login'); };

            // COMPONENTES UI
            const AssessmentNavBar = () => (
                <div className="flex items-center space-x-3 mb-6 overflow-x-auto pb-3 scrollbar-hide">
                    {activeQuestionBank.map((q, idx) => {
                        const isAns = sessionData.answers.some(a=>a.qId===q.id); const isMark = markedQuestions.includes(q.id); const isCur = currentQIndex===idx;
                        let bg = "bg-gray-100 dark:bg-slate-800 text-gray-500 dark:text-slate-400 border-gray-200 dark:border-slate-700 hover:bg-gray-200 dark:hover:bg-slate-700";
                        if (isAns) bg = "bg-emerald-500 text-white border-emerald-600 dark:border-emerald-400 shadow-md"; else if (isMark) bg = "bg-yellow-400 text-yellow-900 border-yellow-500 shadow-md";
                        if (isCur) bg += " ring-4 ring-brand-500 dark:ring-white ring-offset-2 ring-offset-gray-50 dark:ring-offset-slate-900 transform scale-110 z-10 font-black";
                        return <button key={q.id} onClick={()=>{setCurrentQIndex(idx); setFeedback(null); setSessionData(p=>({...p, currentQStartTime:Date.now()}));}} className={`flex-shrink-0 w-11 h-11 rounded-xl font-bold transition-all duration-300 border-2 ${bg}`} title={q.theme}>{idx + 1}</button>;
                    })}
                </div>
            );

            const InteractiveBase = ({children, onCheck, checkDisabled, btnText, tip}) => {
                const [tipRev, setTipRev] = useState(!1);
                return (
                    <div className="space-y-6">
                        <div className="flex bg-brand-50 dark:bg-slate-800/60 rounded-2xl overflow-hidden border border-brand-100 dark:border-slate-700"><div className="w-1.5 bg-brand-500"></div><p className="text-gray-700 dark:text-slate-300 italic p-5 flex-1 leading-relaxed text-sm md:text-base">{currentQ.context}</p></div>
                        <h3 className="text-xl md:text-2xl font-bold text-gray-900 dark:text-white leading-snug">{currentQ.question}</h3>
                        {children}
                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mt-8 pt-6 border-t border-gray-200 dark:border-slate-700 gap-4">
                            {!tipRev ? <button onClick={()=>setTipRev(!0)} className="text-sm text-yellow-600 dark:text-yellow-500 flex items-center font-bold bg-yellow-50 dark:bg-yellow-900/20 px-4 py-2 rounded-lg transition-colors"><HelpCircle className="w-5 h-5 mr-2"/> Consultar Pista Jurídica (-15 pts)</button> : <div className="text-sm text-yellow-800 dark:text-yellow-300 bg-yellow-100 dark:bg-yellow-900/40 p-4 rounded-xl flex items-start w-full sm:w-1/2 shadow-sm"><Info className="w-5 h-5 mr-3 flex-shrink-0 mt-0.5"/><span className="leading-relaxed font-medium">{tip}</span></div>}
                            <div className="flex space-x-3 w-full sm:w-auto">
                                <button onClick={markForLater} disabled={feedback} className="flex-1 sm:flex-none px-5 py-3.5 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-xl font-bold text-gray-700 dark:text-yellow-400 transition-colors shadow-sm disabled:opacity-50 border border-gray-200 dark:border-slate-600">📌 <span className="ml-2 hidden sm:inline">Marcar</span></button>
                                <button onClick={()=>onCheck(tipRev)} disabled={checkDisabled || feedback} className="flex-2 sm:flex-none px-8 py-3.5 bg-brand-600 hover:bg-brand-700 rounded-xl font-bold disabled:opacity-50 transition-all shadow-lg shadow-brand-500/30 text-white flex items-center justify-center">{btnText} <ChevronRight className="w-5 h-5 ml-2"/></button>
                            </div>
                        </div>
                    </div>
                );
            };

            const AdaptiveRadio = () => {
                const [sel, setSel] = useState(null); const opts = useMemo(() => [...currentQ.options].sort(()=>Math.random()-0.5), [currentQ.id]);
                return <InteractiveBase tip={currentQ.tip} btnText="Validar Análisis" checkDisabled={!sel} onCheck={(usedTip)=>{const opt=opts.find(o=>o.id===sel); setFeedback({isCorrect:opt.isCorrect, text:opt.feedback}); submitAnswer(opt.isCorrect, usedTip);}}>
                    <div className="space-y-3">{opts.map(o => (
                        <div key={o.id} onClick={()=>!feedback&&setSel(o.id)} className={`p-4 md:p-5 rounded-2xl border-2 cursor-pointer transition-all flex items-start group ${sel===o.id?'border-brand-500 bg-brand-50 dark:bg-brand-900/30 shadow-[0_4px_20px_rgba(59,130,246,0.15)]':'border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/80 hover:border-brand-300 dark:hover:border-slate-500 hover:bg-gray-50 dark:hover:bg-slate-800'} ${feedback?'opacity-50 cursor-not-allowed':''}`}>
                            <div className={`w-6 h-6 rounded-full border-2 mr-4 flex-shrink-0 flex items-center justify-center mt-0.5 transition-colors ${sel===o.id?'border-brand-500':'border-gray-300 dark:border-slate-500'}`}>{sel===o.id&&<div className="w-3 h-3 bg-brand-500 rounded-full"></div>}</div>
                            <span className={`leading-relaxed font-medium ${sel===o.id?'text-brand-900 dark:text-white':'text-gray-700 dark:text-slate-300'}`}>{o.text}</span>
                        </div>
                    ))}</div>
                </InteractiveBase>;
            };

            const SequenceSorter = () => {
                const [its, setIts] = useState([...currentQ.items].sort(()=>Math.random()-0.5));
                const move = (idx, dir) => { const n=[...its]; if(dir===-1&&idx>0)[n[idx],n[idx-1]]=[n[idx-1],n[idx]]; else if(dir===1&&idx<its.length-1)[n[idx],n[idx+1]]=[n[idx+1],n[idx]]; setIts(n); };
                return <InteractiveBase tip={currentQ.tip} btnText="Sellar Expediente" checkDisabled={!1} onCheck={(uTip)=>{const isC=its.every((it,i)=>it.id===currentQ.items[i].id); setFeedback({isCorrect:isC, text:isC?"Secuencia perfecta.":"Error en orden procesal."}); submitAnswer(isC,uTip);}}>
                    <div className="space-y-3 bg-gray-50 dark:bg-slate-900/50 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-inner">{its.map((it, idx) => (
                        <div key={it.id} className="flex items-center p-4 bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-600 shadow-sm cursor-move hover:shadow-md group">
                            <div className="font-black text-indigo-500 bg-indigo-50 dark:bg-indigo-900/30 w-8 h-8 rounded-full flex items-center justify-center mr-4 flex-shrink-0">{idx+1}</div>
                            <span className="font-medium flex-grow text-gray-800 dark:text-slate-200">{it.content}</span>
                            <div className="flex space-x-2 ml-4"><button onClick={()=>move(idx,-1)} disabled={idx===0||feedback} className="p-2 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-lg disabled:opacity-30">▲</button><button onClick={()=>move(idx,1)} disabled={idx===its.length-1||feedback} className="p-2 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-lg disabled:opacity-30">▼</button></div>
                        </div>
                    ))}</div>
                </InteractiveBase>;
            };

            const ClozeText = () => {
                const [ans, setAns] = useState({});
                const renderText = () => currentQ.codeTemplate.split(/(\[HUECO_\d+\])/g).map((p, i) => {
                    const match = p.match(/\[(HUECO_\d+)\]/);
                    if (match) { const bl = currentQ.blanks.find(b=>b.id===match[1]); return <select key={i} value={ans[bl.id]||""} onChange={e=>setAns(pr=>({...pr, [bl.id]:e.target.value}))} disabled={feedback!==null} className="mx-2 my-1 bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 border-2 border-brand-200 dark:border-brand-500/50 px-3 py-1.5 outline-none font-bold rounded-lg shadow-sm cursor-pointer hover:bg-brand-50 dark:hover:bg-slate-700"><option value="" disabled>___ Seleccionar ___</option>{bl.options.map(o=><option key={o} value={o}>{o}</option>)}</select>; }
                    return <span key={i} className="leading-loose text-lg text-gray-800 dark:text-slate-200">{p}</span>;
                });
                return <InteractiveBase tip={currentQ.tip} btnText="Completar Documento" checkDisabled={Object.keys(ans).length < currentQ.blanks.length} onCheck={(uTip)=>{let ok=!0; currentQ.blanks.forEach(b=>{if(ans[b.id]!==b.answer)ok=!1;}); setFeedback({isCorrect:ok, text:ok?"Integración perfecta.":"Errores de concordancia legal."}); submitAnswer(ok, uTip);}}>
                    <div className="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-2xl p-8 shadow-sm">{renderText()}</div>
                </InteractiveBase>;
            };

            const ImageHotspot = () => {
                return <InteractiveBase tip={currentQ.tip} btnText="Selecciona en la imagen" checkDisabled={!0} onCheck={()=>{}}>
                    <div className="relative border-4 border-gray-300 dark:border-slate-700 rounded-2xl overflow-hidden bg-gray-100 dark:bg-slate-800 h-96 flex items-center justify-center shadow-inner">
                        <img src={currentQ.imageUrl} className="object-cover w-full h-full opacity-30 grayscale blur-[2px]" />
                        <div className="absolute inset-0 p-10 flex flex-col justify-between font-serif text-slate-800 text-sm shadow-2xl" style={{background:'rgba(250,250,245,0.92)'}}>
                            <div className="text-center font-bold border-b-2 border-slate-800 pb-4 mb-6 text-xl tracking-widest">REGLAMENTO INTERNO DE TRABAJO</div>
                            <div className="space-y-8 flex-grow text-base"><p className="font-bold text-red-800">SANCIONES APLICABLES:</p><p className="pl-5 border-l-4 border-slate-300"><strong>Art 50.</strong> Faltas leves:<br/> - Llamado de atención escrito.</p><p className="pl-5 border-l-4 border-slate-300"><strong>Art 51.</strong> Retraso reiterado:<br/> - Multa de la 5ta parte de un día.</p><p className="pl-5 border-l-4 border-slate-300"><strong>Art 52.</strong> Faltas graves:<br/> - Suspensión por 45 días hábiles.</p></div>
                        </div>
                        {currentQ.hotspots.map(h => <button key={h.id} onClick={()=>{if(feedback)return; setFeedback({isCorrect:h.isCorrect, text:h.isCorrect?"¡Hallazgo correcto!":"Sanción válida."}); submitAnswer(h.isCorrect, !1);}} style={{left:`${h.x}%`, top:`${h.y}%`}} className={`absolute w-14 h-14 -ml-7 -mt-7 rounded-full border-2 border-brand-600 bg-brand-500/20 hotspot-pulse hover:bg-brand-500/50 z-10 ${feedback?'pointer-events-none opacity-0':''}`} /> )}
                    </div>
                </InteractiveBase>;
            };

            const renderCurrentInteraction = () => {
                if(!currentQ) return <div className="text-center p-16"><Activity className="animate-spin mx-auto w-12 h-12 text-brand-500 mb-4"/><p className="text-gray-500 dark:text-slate-400 font-medium">Cargando expediente...</p></div>;
                switch(currentQ.type) { case 'adaptive_radio': return <AdaptiveRadio/>; case 'sequence_sorter': return <SequenceSorter/>; case 'image_hotspot': return <ImageHotspot/>; case 'cloze_text': return <ClozeText/>; default: return <div>Interacción no soportada.</div>; }
            };

            // --- PANEL ESTADÍSTICO ADMIN ---
            const DashboardView = () => {
                const [newQ, setNewQ] = useState({id:`q_new_${Date.now()}`, type:'adaptive_radio', theme:'General', level:1, difficulty:0.5, expectedTime:60, title:'', context:'', question:'', tip:'', options:[{id:'A',text:'',isCorrect:!0,feedback:''},{id:'B',text:'',isCorrect:!1,feedback:''}]});
                
                const {itemMetrics, neuroData, hasNeuroData} = useMemo(() => {
                    let metrics={}, nCounts={"Impulsividad":0, "Duda / Hesitación":0, "Sobrecarga Cognitiva":0, "Estado de Flujo":0};
                    activeQuestionBank.forEach(q => {
                        const qLogs = logs.filter(l=>l.questionId===q.id); const Nt = qLogs.length;
                        const Nc = Nt>0 ? qLogs.filter(l=>l.isCorrect).length : 0; const p = Nt>0 ? parseFloat((Nc/Nt).toFixed(2)) : 0; const D = Nt>0 ? parseFloat(((p>0.5)?(p*0.8):(p*1.2)).toFixed(2)) : 0;
                        const avgFrust = Nt>0 ? parseFloat((qLogs.reduce((acc, c)=>acc+c.frustrationIndex,0)/Nt).toFixed(2)) : 0;
                        qLogs.forEach(l => {if(l.neuroState && nCounts[l.neuroState]!==undefined) nCounts[l.neuroState]++;});
                        let diag="Sin datos"; if(Nt>0){if(p<0.3)diag="Muy difícil";else if(p>0.8)diag="Muy fácil";else if(D>0.4)diag="Excelente discriminación";else diag="Discriminación estándar";}
                        metrics[q.id]={id:q.id, title:q.title, theme:q.theme, p, D, If:avgFrust, Nt, diagnostico:diag};
                    });
                    const hasN = Object.values(nCounts).some(v=>v>0); const nData = hasN ? Object.keys(nCounts).map(k=>({name:k, value:nCounts[k]})) : Object.keys(nCounts).map(k=>({name:k, value:1}));
                    return {itemMetrics:Object.values(metrics), neuroData:nData, hasNeuroData:hasN};
                }, [logs, activeQuestionBank]);

                const cciData = useMemo(() => { const d=[]; for(let th=-3; th<=3; th+=0.5){d.push({theta:th, 'Fácil':parseFloat((1/(1+Math.exp(-1.2*(th+1.5)))).toFixed(3)), 'Medio':parseFloat((1/(1+Math.exp(-1.0*(th-0)))).toFixed(3)), 'Difícil':parseFloat((1/(1+Math.exp(-1.5*(th-1.5)))).toFixed(3))});} return d; }, []);
                const COLORS=['#ef4444','#f59e0b','#8b5cf6','#10b981']; const EMPTY_COLORS=isDarkMode?['#334155','#475569','#1e293b','#0f172a']:['#cbd5e1','#e2e8f0','#f1f5f9','#f8fafc'];

                const syncDB = async () => { if(confirm("¿Sincronizar a Firebase?")) { const b=writeBatch(db); QUESTION_BANK.forEach(q=>b.set(doc(collection(db,QUESTIONS_PATH),q.id),q)); try{await b.commit(); alert("Sincronizado.");}catch(e){alert(e.message);} } };
                const saveNewQ = async () => { if(!newQ.title||!newQ.question)return alert("Faltan datos."); try{await setDoc(doc(collection(db,QUESTIONS_PATH),newQ.id),newQ); alert("Guardada."); setNewQ({...newQ,id:`q_new_${Date.now()}`,title:'',context:'',question:'',tip:''});}catch(e){alert(e.message);} };
                
                const injectMock = async () => {
                    if(confirm("¿Inyectar 30 registros?")) { const b=writeBatch(db);
                        for(let i=0;i<30;i++){
                            const q=activeQuestionBank[Math.floor(Math.random()*activeQuestionBank.length)]; const isC=Math.random()>0.4; const tS=q.expectedTime*(0.5+Math.random());
                            b.set(doc(collection(db,COLLECTION_PATH)),{studentName:`Simulado ${i}`,studentRole:'rrhh',studentEmail:`al${i}@sim.com`,questionId:q.id,theme:q.theme||"Gen",isCorrect:isC,timeSpent:Math.floor(tS),expectedTime:q.expectedTime,usedTip:Math.random()>0.8,frustrationIndex:Math.max(0,(tS-q.expectedTime)/q.expectedTime),neuroState:['Estado de Flujo','Impulsividad','Sobrecarga Cognitiva','Duda / Hesitación'][Math.floor(Math.random()*4)],points:isC?100:0,timestamp:serverTimestamp()});
                            b.set(doc(db,USERS_PATH,`al${i}@sim.com`),{name:`Simulado ${i}`,email:`al${i}@sim.com`,role:'rrhh',university:'Virtual',lastAccess:serverTimestamp()});
                        } try{await b.commit(); alert("Inyectados.");}catch(e){}
                    }
                };

                return (
                    <div className="max-w-7xl mx-auto space-y-10 animate-fade-in pb-16 px-4 sm:px-8">
                        <div className="flex flex-col md:flex-row justify-between md:items-center mb-10 border-b border-gray-200 dark:border-slate-700 pb-6 gap-6">
                            <div><h1 className="text-4xl font-bold font-serif text-gray-900 dark:text-white flex items-center"><Brain className="w-10 h-10 mr-4 text-brand-600 dark:text-brand-400"/> Portal LMS Administrador</h1></div>
                            <div className="flex flex-wrap gap-2 bg-gray-100 dark:bg-slate-800/80 p-1.5 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
                                <button onClick={()=>setAdminTab('dashboard')} className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${adminTab==='dashboard'?'bg-white dark:bg-slate-600 shadow-md text-brand-600 dark:text-white':'text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-white'}`}>📈 Analítica</button>
                                <button onClick={()=>setAdminTab('users')} className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${adminTab==='users'?'bg-white dark:bg-slate-600 shadow-md text-emerald-600 dark:text-white':'text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-white'}`}>👥 Estudiantes</button>
                                <button onClick={()=>setAdminTab('builder')} className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${adminTab==='builder'?'bg-white dark:bg-slate-600 shadow-md text-indigo-600 dark:text-white':'text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-white'}`}>⚙️ Constructor</button>
                                <button onClick={()=>setIsDarkMode(!isDarkMode)} className="px-3 py-2.5 rounded-lg text-gray-500 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-slate-700"><Sun className="w-5 h-5"/></button>
                                <button onClick={()=>setView('intro')} className="px-5 py-2.5 text-sm font-bold text-gray-500 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400">Cerrar</button>
                            </div>
                        </div>

                        {adminTab === 'users' && (
                            <div className="glass-panel p-8 sm:p-12 rounded-3xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-xl">
                                <h2 className="text-3xl font-bold text-gray-900 dark:text-white mb-6 flex items-center"><Users className="w-8 h-8 mr-3 text-emerald-500"/> Registro Oficial de Estudiantes</h2>
                                <div className="overflow-x-auto"><table className="w-full text-left text-sm text-gray-700 dark:text-slate-300"><thead className="text-xs text-gray-500 dark:text-slate-400 uppercase bg-gray-100 dark:bg-slate-800/80 font-black"><tr><th className="px-5 py-4">Nombre</th><th className="px-5 py-4">Correo</th><th className="px-5 py-4">Rol</th><th className="px-5 py-4 text-right">Último Acceso</th></tr></thead><tbody className="font-medium">{registeredUsers.length===0&&<tr><td colSpan="4" className="text-center py-6 text-gray-500">Sin estudiantes.</td></tr>}{registeredUsers.map((u,i)=>(<tr key={i} className="border-b border-gray-100 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-800/30"><td className="px-5 py-4 font-bold text-gray-900 dark:text-white">{u.name}</td><td className="px-5 py-4">{u.email}</td><td className="px-5 py-4 uppercase text-xs text-emerald-600">{u.role}</td><td className="px-5 py-4 text-right text-gray-400">{u.lastAccess?.toDate?new Date(u.lastAccess.toDate()).toLocaleDateString():'-'}</td></tr>))}</tbody></table></div>
                            </div>
                        )}

                        {adminTab === 'dashboard' && (
                            <div className="space-y-10 animate-fade-in">
                                {logs.length === 0 && (
                                    <div className="bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-700/50 p-6 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4"><div className="flex items-start text-yellow-800 dark:text-yellow-400"><AlertTriangle className="w-8 h-8 mr-4 mt-0.5"/><div><h4 className="font-bold text-lg mb-1">Sin Interacciones</h4><p className="text-sm">Las gráficas están en cero. ¿Inyectar estudiantes virtuales?</p></div></div><button onClick={injectMock} className="px-6 py-3 bg-yellow-500 text-yellow-900 font-bold rounded-xl shadow-lg flex items-center whitespace-nowrap"><Zap className="w-5 h-5 mr-2"/> Simular Datos</button></div>
                                )}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-6">
                                    <div className="glass-panel p-8 rounded-3xl bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 overflow-x-auto shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Últimas dudas del foro</h3>
                                        <div className="space-y-4 max-h-[300px] overflow-y-auto pr-2">{forumDoubts.map((d,i)=>(<div key={i} className="bg-gray-50 dark:bg-slate-800/80 p-5 rounded-xl border border-gray-200 dark:border-slate-600"><span className="text-xs text-yellow-600 dark:text-yellow-400 font-black uppercase mb-2 block">{d.theme}</span><span className="text-sm text-brand-600 dark:text-brand-400 font-bold block">{d.title}</span><p className="text-sm text-gray-800 dark:text-white italic mt-2">"{d.doubt}"</p></div>))}{forumDoubts.length===0&&<p className="text-center text-gray-500">Vacío.</p>}</div>
                                    </div>
                                    <div className="glass-panel p-8 rounded-3xl bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Dificultad (IRT)</h3>
                                        <div className="h-72"><ResponsiveContainer width="100%" height="100%"><BarChart data={itemMetrics} layout="vertical" margin={{left:20}}><CartesianGrid strokeDasharray="3 3" stroke={isDarkMode?'#334155':'#e2e8f0'} horizontal={false}/><XAxis type="number" domain={[0,1]} stroke={isDarkMode?'#94a3b8':'#64748b'} axisLine={!1} tickLine={!1}/><YAxis dataKey="title" type="category" stroke={isDarkMode?'#94a3b8':'#64748b'} fontSize={10} width={120} axisLine={!1} tickLine={!1}/><Tooltip contentStyle={{backgroundColor:isDarkMode?'#1e293b':'#fff',borderRadius:'8px'}}/><Bar dataKey="p" fill="#3b82f6" radius={[0,6,6,0]} barSize={16}/></BarChart></ResponsiveContainer></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="glass-panel p-8 rounded-3xl col-span-1 bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Estados Mentales</h3>
                                        <div className="h-64 flex justify-center relative"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={neuroData} cx="50%" cy="50%" innerRadius={60} outerRadius={85} paddingAngle={5} dataKey="value" stroke="none">{neuroData.map((e,i)=><Cell key={i} fill={hasNeuroData?COLORS[i%COLORS.length]:EMPTY_COLORS[i%EMPTY_COLORS.length]}/>)}</Pie>{hasNeuroData&&<Tooltip contentStyle={{backgroundColor:isDarkMode?'#1e293b':'#fff',border:'none',borderRadius:'8px'}}/>}{hasNeuroData&&<Legend verticalAlign="bottom" height={36} iconType="circle"/>}</PieChart></ResponsiveContainer>{!hasNeuroData&&<div className="absolute inset-0 flex items-center justify-center text-sm font-bold text-gray-400">Esperando...</div>}</div>
                                    </div>
                                    <div className="glass-panel p-8 rounded-3xl col-span-2 bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Curvas Características del Ítem (CCI 2PL)</h3>
                                        <div className="h-64"><ResponsiveContainer width="100%" height="100%"><LineChart data={cciData} margin={{top:5,right:20,bottom:5,left:0}}><CartesianGrid strokeDasharray="3 3" stroke={isDarkMode?'#334155':'#e2e8f0'} vertical={false}/><XAxis dataKey="theta" stroke={isDarkMode?'#94a3b8':'#64748b'} tickFormatter={(val)=>`θ=${val}`} axisLine={!1} tickLine={!1}/><YAxis stroke={isDarkMode?'#94a3b8':'#64748b'} domain={[0,1]} axisLine={!1} tickLine={!1}/><Tooltip contentStyle={{backgroundColor:isDarkMode?'#1e293b':'#ffffff',borderRadius:'8px'}}/><Legend wrapperStyle={{fontSize:'13px',fontWeight:'bold'}} iconType="circle"/><Line type="monotone" dataKey="Fácil" stroke="#10b981" strokeWidth={3} dot={!1}/><Line type="monotone" dataKey="Medio" stroke="#3b82f6" strokeWidth={3} dot={!1}/><Line type="monotone" dataKey="Difícil" stroke="#ef4444" strokeWidth={3} dot={!1}/></LineChart></ResponsiveContainer></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminTab === 'builder' && (
                            <div className="glass-panel p-8 sm:p-12 rounded-3xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-xl animate-fade-in">
                                <div className="flex justify-between items-center mb-8 border-b border-gray-200 dark:border-slate-700 pb-6"><h2 className="text-3xl font-bold text-gray-900 dark:text-white flex items-center"><Database className="w-8 h-8 mr-3 text-indigo-500"/> Banco Nube</h2><button onClick={syncDB} className="px-5 py-3 bg-brand-50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-300 font-bold border border-brand-200 dark:border-brand-500/50 rounded-xl hover:bg-brand-100 shadow-sm">Sincronizar a DB</button></div>
                                <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">{activeQuestionBank.map((q, i) => (<div key={i} className="bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm flex justify-between items-center gap-4"><div><div className="flex space-x-3 mb-2"><span className="bg-brand-100 text-brand-800 dark:bg-brand-900/50 dark:text-brand-300 text-xs font-bold px-2 py-1 rounded">{q.theme}</span></div><h4 className="text-lg font-bold text-gray-900 dark:text-white mt-2">{q.title}</h4></div><div className="text-right text-sm font-bold text-gray-700 dark:text-slate-300">Nivel: {q.level} <br/> <span className="text-brand-600 dark:text-brand-400">Dif: {q.difficulty}</span></div></div>))}</div>
                            </div>
                        )}
                    </div>
                );
            };

            const getStudyRec = () => { const tPts = activeQuestionBank.reduce((a,q)=>a+(100*q.difficulty),0); const pct = tPts>0?(score/tPts)*100:0; if(pct>=85)return{text:"Excelente criterio jurídico avanzado.",c:"text-emerald-600 dark:text-emerald-400"}; if(pct>=60)return{text:"Buen desempeño. Repasa jurisprudencia.",c:"text-yellow-600 dark:text-yellow-400"}; return{text:"Necesitas profundizar en el debido proceso.",c:"text-red-600 dark:text-red-400"}; };

            // RENDERIZADO MAESTRO DE LA APLICACIÓN
            return (
                <div className="w-full">
                    {view !== 'dashboard' && view !== 'login' && view !== 'profile' && (
                        <div className="max-w-5xl mx-auto flex justify-between items-center mb-8 mt-4 bg-white/80 dark:bg-slate-800/50 p-4 rounded-2xl border border-gray-200 dark:border-slate-700/50 shadow-sm">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={()=>setView('intro')}><Scale className="w-8 h-8 text-blue-600 dark:text-blue-500" /><span className="text-xl sm:text-2xl font-bold font-serif text-gray-900 dark:text-white">Luna<span className="text-blue-600 dark:text-blue-500">Academy</span></span></div>
                            <div className="flex items-center space-x-2 sm:space-x-4">
                                {isMasterAdmin() && <span className="hidden sm:flex items-center text-xs font-bold text-yellow-600 dark:text-yellow-400 bg-yellow-100 dark:bg-yellow-900/30 px-3 py-1.5 rounded-full"><Crown className="w-4 h-4 mr-1"/> Admin</span>}
                                <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 text-gray-500 dark:text-yellow-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full">{isDarkMode?<Sun className="w-5 h-5"/>:<Moon className="w-5 h-5"/>}</button>
                                <button onClick={()=>setView('profile')} className="text-gray-600 dark:text-slate-300 hover:text-blue-600 bg-gray-100 dark:bg-slate-700/50 px-4 py-2 rounded-full font-semibold flex items-center"><User className="w-4 h-4 mr-2" /> {studentInfo.name.split(' ')[0]}</button>
                                <button onClick={attemptAdminAccess} className="text-gray-500 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-blue-400 bg-gray-100 dark:bg-slate-800 p-2 rounded-full"><LayoutDashboard className="w-5 h-5" /></button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto">
                        {adminAuth.isChecking && (
                            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur z-50 flex items-center justify-center">
                                <div className="bg-slate-800 p-8 rounded-2xl border border-slate-600 max-w-sm w-full shadow-2xl">
                                    <h3 className="text-2xl font-bold text-white mb-4 flex items-center"><Lock className="w-6 h-6 mr-2 text-indigo-400"/> Portal Seguro</h3>
                                    <input type="password" value={adminAuth.password} onChange={e=>setAdminAuth({...adminAuth, password:e.target.value})} placeholder="Contraseña..." className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-indigo-500 mb-2"/>
                                    {adminAuth.error && <p className="text-red-400 text-xs mb-4">{adminAuth.error}</p>}
                                    <div className="flex justify-end space-x-3 mt-6"><button onClick={()=>setAdminAuth({isChecking:!1, password:'', error:''})} className="px-4 py-2 text-slate-400 hover:text-white">Cancelar</button><button onClick={handleAdminLogin} className="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-lg">Autorizar</button></div>
                                </div>
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in border-t-4 border-t-blue-500 max-w-md mx-auto mt-10 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                                <div className="flex justify-end mb-4"><button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 text-gray-400 dark:text-yellow-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full">{isDarkMode?<Sun className="w-5 h-5"/>:<Moon className="w-5 h-5"/>}</button></div>
                                <Scale className="w-16 h-16 text-blue-600 dark:text-blue-500 mx-auto mb-6 drop-shadow-lg" />
                                <h1 className="text-3xl font-bold text-center mb-2 font-serif text-gray-900 dark:text-white">LunaAcademy</h1>
                                <p className="text-center text-gray-500 dark:text-slate-400 mb-8 font-medium">Capacitación jurídica laboral</p>
                                <button onClick={handleGoogleLogin} className="w-full mb-6 py-3 bg-white dark:bg-slate-100 border border-gray-200 text-slate-900 font-bold rounded-xl flex justify-center items-center shadow-md hover:bg-gray-50 transition-transform transform hover:scale-105"> Ingresar con Google </button>
                                <div className="space-y-4"><input type="email" value={studentInfo.email} onChange={e=>setStudentInfo({...studentInfo, email:e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800/50 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white font-medium" placeholder="Correo electrónico" /><button onClick={handleManualLogin} disabled={!studentInfo.email} className="w-full py-4 bg-blue-600 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg">Continuar al Perfil</button></div>
                            </div>
                        )}

                        {view === 'profile' && (
                            <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in max-w-3xl mx-auto mt-6 border-t-4 border-t-indigo-500 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                <div className="flex items-center justify-center mb-6"><User className="w-10 h-10 text-indigo-600 dark:text-indigo-500 mr-3" /><h2 className="text-3xl font-bold text-gray-900 dark:text-white">Tu Perfil</h2></div>
                                <div className="space-y-6">
                                    <input type="text" value={studentInfo.name} onChange={e=>setStudentInfo({...studentInfo, name:e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-gray-900 dark:text-white outline-none font-medium" placeholder="Nombre completo" />
                                    <select value={studentInfo.role} onChange={e=>setStudentInfo({...studentInfo, role:e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-gray-900 dark:text-white outline-none font-medium"><option value="" disabled>Selecciona tu rol...</option><option value="abogado">Abogado / Legal</option><option value="rrhh">Recursos Humanos</option><option value="empleado">Colaborador</option></select>
                                    <button onClick={saveProfile} disabled={!studentInfo.role || !studentInfo.name} className="w-full py-4 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg flex justify-center items-center text-lg">Guardar y Continuar <ChevronRight className="w-6 h-6 ml-2" /></button>
                                </div>
                            </div>
                        )}

                        {view === 'intro' && (
                            <div className="glass-panel rounded-3xl p-10 sm:p-16 text-center animate-fade-in shadow-2xl mt-6 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                <ShieldAlert className="w-20 h-20 text-blue-600 dark:text-blue-500 mx-auto mb-6" /><h1 className="text-4xl sm:text-5xl font-bold mb-4 font-serif text-gray-900 dark:text-white">Auditoría Disciplinaria</h1>
                                <p className="text-gray-500 dark:text-slate-400 mb-10 max-w-3xl mx-auto leading-relaxed">Como perfil {studentInfo.role.toUpperCase()}, pondremos a prueba tu criterio sobre el debido proceso basándonos en la Jurisprudencia.</p>
                                <button onClick={() => { setView('assessment'); setSessionData({startTime: Date.now(), currentQStartTime: Date.now(), tipsUsed: 0, answers: []}); setScore(0); setCurrentQIndex(0); setMarkedQuestions([]); }} className="px-12 py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full font-bold shadow-[0_0_40px_rgba(59,130,246,0.3)] text-white text-xl transform hover:-translate-y-1 transition-transform">Iniciar Evaluación Legal</button>
                            </div>
                        )}

                        {view === 'assessment' && (
                            <div className="animate-fade-in max-w-3xl mx-auto">
                                <AssessmentNavBar />
                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl border-t-4 border-t-blue-500 bg-white dark:bg-slate-800 border-x border-b border-gray-200 dark:border-slate-700">
                                    {renderCurrentInteraction()}
                                    {feedback && (
                                        <div className={`mt-10 p-6 rounded-2xl flex items-start space-x-4 border ${feedback.isCorrect ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-500/30' : 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-500/30'}`}>
                                            {feedback.isCorrect ? <CheckCircle className="w-10 h-10 text-emerald-600 dark:text-emerald-400 shrink-0" /> : <XCircle className="w-10 h-10 text-red-600 dark:text-red-400 shrink-0" />}
                                            <div className="flex-1"><p className={`font-bold text-xl mb-2 ${feedback.isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>{feedback.isCorrect ? 'Fallo: Válido' : 'Fallo: Error de Proceso'}</p><p className="text-gray-800 dark:text-slate-200 text-sm mb-4 font-medium">{feedback.text}</p></div>
                                        </div>
                                    )}
                                    <div className="mt-10 border-t border-gray-200 dark:border-slate-700 pt-6">
                                        <h4 className="text-sm font-bold text-gray-700 dark:text-slate-300 mb-3 flex items-center"><MessageSquare className="w-5 h-5 mr-2 text-yellow-500"/> Foro de Dudas (Anónimo)</h4>
                                        <div className="flex flex-col sm:flex-row gap-3"><textarea value={userDoubt} onChange={e=>setUserDoubt(e.target.value)} disabled={doubtSubmitted} className="w-full sm:flex-1 bg-gray-50 dark:bg-slate-900/80 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm text-gray-900 dark:text-white focus:border-indigo-500 outline-none resize-none h-24" placeholder="¿Algo no quedó claro? Deja tu inquietud..."/><button onClick={handleDoubtSubmit} disabled={!userDoubt.trim() || doubtSubmitted} className="px-6 py-3 bg-yellow-400 dark:bg-yellow-600/90 text-yellow-900 dark:text-slate-900 rounded-xl text-sm font-bold disabled:opacity-50 sm:h-24 shadow-md">{doubtSubmitted ? 'Registrado ✓' : 'Enviar Duda'}</button></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'results' && (
                            <div className="animate-fade-in max-w-4xl mx-auto space-y-8">
                                <div className="glass-panel rounded-3xl p-10 text-center border-t-4 border-t-emerald-500 shadow-2xl bg-white dark:bg-slate-800">
                                    <CheckCircle className="w-24 h-24 text-emerald-500 mx-auto mb-6" /><h1 className="text-4xl font-bold text-gray-900 dark:text-white mb-2 font-serif">Simulación Concluida</h1>
                                    <div className="bg-gray-50 dark:bg-slate-900/80 rounded-2xl p-8 border border-gray-200 dark:border-slate-700 shadow-inner mt-8"><div className="text-7xl font-black text-blue-600 dark:text-blue-400">{score.toFixed(0)} <span className="text-2xl text-gray-400 font-normal">pts</span></div></div>
                                </div>
                                <div className="glass-panel rounded-3xl p-8 border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 shadow-sm">
                                    <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-4 flex items-center"><GraduationCap className="w-7 h-7 mr-3 text-indigo-500"/> Diagnóstico y Plan de Estudio</h3>
                                    <p className={`text-lg font-bold mb-2 leading-relaxed ${getStudyRec().c}`}>{getStudyRec().text}</p>
                                </div>
                                {!surveyData.submitted ? (
                                    <div className="glass-panel rounded-3xl p-10 bg-white dark:bg-slate-800/60 border border-gray-200 dark:border-slate-600 shadow-xl">
                                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-8 text-center">Encuesta de Calidad Pedagógica (Likert)</h3>
                                        <div className="space-y-6 max-w-2xl mx-auto">
                                            {[{id:'clarity', t:'Claridad', d:'¿El caso fue fácil de entender?'}, {id:'relevance', t:'Relevancia', d:'¿Es aplicable en entorno real?'}, {id:'difficultyLevel', t:'Reto Cognitivo', d:'¿Exigencia de la prueba?'}, {id:'uxui', t:'Experiencia UI/UX', d:'¿Plataforma intuitiva?'}].map(dim => (
                                                <div key={dim.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700">
                                                    <div className="mb-3 sm:mb-0"><div className="font-bold text-gray-900 dark:text-white text-lg">{dim.t}</div><div className="text-sm text-gray-500 dark:text-slate-400">{dim.d}</div></div>
                                                    <div className="flex space-x-1">{[1,2,3,4,5].map(star => <button key={`${dim.id}-${star}`} onClick={()=>setSurveyData({...surveyData, [dim.id]: star})} className={`p-1 transition-transform hover:scale-125 ${surveyData[dim.id]>=star?'text-yellow-400':'text-gray-300 dark:text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>)}</div>
                                                </div>
                                            ))}
                                            <button onClick={submitSurvey} disabled={!surveyData.clarity||!surveyData.relevance||!surveyData.difficultyLevel||!surveyData.uxui} className="w-full py-5 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-lg text-lg mt-4">Enviar Evaluación</button>
                                        </div>
                                    </div>
                                ) : <div className="glass-panel rounded-3xl p-12 text-center bg-emerald-50 dark:bg-slate-800/40 border border-emerald-200 dark:border-emerald-500/30"><CheckCircle className="w-16 h-16 text-emerald-500 mx-auto mb-4"/><h3 className="text-3xl font-bold text-gray-900 dark:text-white">¡Gracias por tu feedback!</h3></div>}
                                <div className="text-center pb-12 mt-8"><button onClick={()=>{window.location.reload()}} className="px-12 py-5 bg-gray-800 dark:bg-slate-700 hover:bg-gray-900 rounded-full text-white font-bold shadow-xl">Cerrar y Reiniciar</button></div>
                            </div>
                        )}
                        {view === 'dashboard' && <DashboardView />}
                    </div>
                </div>
            );
        };

        const RootComponent = () => (
            <div className="flex flex-col min-h-screen w-full">
                <App />
                <footer className="text-center text-gray-500 dark:text-slate-500 text-xs py-6 mt-auto border-t border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900/90 z-50">
                    <p className="font-bold uppercase tracking-widest mb-1">© {new Date().getFullYear()} Todos los derechos reservados.</p>
                    <p className="font-medium">Módulo adaptativo impulsado por <strong className="text-brand-600 dark:text-brand-400">LunaAcademy</strong>.</p>
                </footer>
            </div>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<RootComponent />);
    </script>
</body>
</html>
