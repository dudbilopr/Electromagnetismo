    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, createContext, useContext, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            BookOpen, Scale, Shield, FileText, ChevronRight, ChevronLeft, ChevronDown, LogOut, User, CheckCircle, 
            AlertTriangle, Play, BrainCircuit, MessageSquare, Settings, HelpCircle, Award, Search,

        // SE AGREGÓ 'deleteDoc' PARA PERMITIR AL ADMINISTRADOR BORRAR REGISTROS
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, getDocs, query, serverTimestamp, orderBy, limit, deleteDoc } from 'firebase/firestore';

        const firebaseConfig = { 
            apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk", authDomain: "lunaexplica-60035.firebaseapp.com", databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com", 
            projectId: "lunaexplica-60035", storageBucket: "lunaexplica-60035.firebasestorage.app", messagingSenderId: "550469014323", appId: "1:550469014323:web:be79e10f33abc619432446", measurementId: "G-583N74HNVW" 
        };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        const APP_ID = 'luna_academy'; const ADMIN_EMAIL = 'dudbilopr@gmail.com'; const AppContext = createContext();

        // --- BANCO DE PREGUNTAS (15 PREGUNTAS) ---
        const DEFAULT_QUESTIONS = [
            { id: "q1", type: "adaptive_radio", category: "teoria_descargo", difficulty: 1, text: "Según la Pedagogía del Descargo, ¿cuál es el propósito principal de la citación a descargos además de garantizar el debido proceso?", options: [ { id: "o1", text: "Imponer una sanción ejemplarizante de manera expedita." }, { id: "o2", text: "Establecer un espacio dialógico para reducir la asimetría de conocimiento legal y esclarecer los hechos." }, { id: "o3", text: "Cumplir un mero requisito formal exigido por el Ministerio de Trabajo." }, { id: "o4", text: "Intimidar al trabajador para forzar una renuncia voluntaria." } ], correctOption: "o2" },
            { id: "q2", type: "sequence_sorter", category: "procedimiento", difficulty: 2, text: "Ordene lógicamente las etapas del Proceso Disciplinario Laboral garantista:", items: [ { id: "s1", text: "Citación formal y clara a descargos." }, { id: "s2", text: "Traslado y acceso a las pruebas del expediente." }, { id: "s3", text: "Audiencia de descargos (escucha activa y pedagógica)." }, { id: "s4", text: "Decisión motivada y proporcional." }, { id: "s5", text: "Notificación de la sanción y recursos de apelación." } ], correctSequence: ["s1", "s2", "s3", "s4", "s5"] },
            { id: "q3", type: "cloze_text", category: "analisis_caso", difficulty: 3, text: "En un caso de presunta falta grave, la empresa debe garantizar que el trabajador conozca las {1} en su contra antes de la audiencia. Si la sanción implica despido, esta debe ser {2} a la falta cometida, respetando el principio de {3}.", blanks: [ { id: "b1", options: ["sospechas", "pruebas", "decisiones"], correct: "pruebas" }, { id: "b2", options: ["anterior", "proporcional", "indiferente"], correct: "proporcional" }, { id: "b3", options: ["inmediatez", "favorabilidad", "culpabilidad"], correct: "inmediatez" } ] },
            { id: "q4", type: "image_hotspot", category: "analisis_documental", difficulty: 4, text: "Revise la simulación de Carta de Citación a Descargos. Haga clic en la sección que VULNERA el debido proceso por prejuzgamiento.", imageDoc: { header: "CARTA DE CITACIÓN A DESCARGOS", body: "Señor(a) Trabajador(a), se le cita a diligencia de descargos para mañana a las 8:00 AM.\n\nMotivo: Se le acusa de robo de inventario, por lo cual la empresa ya tomó la decisión de terminar su contrato, pero requerimos agotar el requisito de escucharlo.", footer: "Firma: RRHH" }, hotspots: [ { id: "h1", top: "20%", left: "10%", width: "80%", height: "20%", isCorrect: false }, { id: "h2", top: "50%", left: "10%", width: "80%", height: "30%", isCorrect: true } ] },
            { id: "q5", type: "adaptive_radio", category: "analisis_jurisprudencial", difficulty: 4, text: "Un trabajador omite un protocolo de seguridad causando un daño menor. En la audiencia demuestra que la empresa nunca le brindó la capacitación específica. Desde el enfoque pedagógico, ¿qué acción procede?", options: [ { id: "o1", text: "Despido por justa causa basado en la presunción de mala fe." }, { id: "o2", text: "Sanción máxima pecuniaria para resarcir el daño." }, { id: "o3", text: "Abstención de sanción punitiva, ordenando una capacitación correctiva y un plan de mejora." }, { id: "o4", text: "Suspensión de 2 meses sin derecho a remuneración." } ], correctOption: "o3" },
            { id: "q6", type: "cloze_text", category: "principios_derecho", difficulty: 5, text: "La Corte Constitucional ha reiterado que rige el principio de {1}, que prohíbe sancionar dos veces por el mismo hecho (Non bis in idem). Si hay dudas razonables sobre la culpabilidad, se debe aplicar el principio {2}.", blanks: [ { id: "b1", options: ["legalidad", "inmediatez", "tipicidad"], correct: "legalidad" }, { id: "b2", options: ["pacta sunt servanda", "in dubio pro operario", "solve et repete"], correct: "in dubio pro operario" } ] },
            { id: "q7", type: "adaptive_radio", category: "principios_derecho", difficulty: 3, text: "¿A quién corresponde fundamentalmente la 'Carga de la Prueba' dentro de un proceso disciplinario laboral para demostrar la comisión de la falta?", options: [ { id: "o1", text: "Al trabajador, quien debe demostrar su inocencia a toda costa." }, { id: "o2", text: "Al Ministerio de Trabajo, quien debe enviar un inspector." }, { id: "o3", text: "Al empleador, quien acusa y tiene el deber de aportar los medios probatorios que demuestren la falta." }, { id: "o4", text: "A los compañeros de trabajo del acusado." } ], correctOption: "o3" },
            // Salto explícito de la pregunta 8.
            { id: "q9", type: "sequence_sorter", category: "procedimiento", difficulty: 3, text: "Si un trabajador se niega a recibir o firmar la carta de citación a descargos, ¿cuál es el orden procesal correcto y garantista para actuar?", items: [ { id: "s1", text: "Intentar notificar de forma presencial explicando el contenido." }, { id: "s2", text: "Ante la negativa, llamar a dos testigos (preferiblemente compañeros)." }, { id: "s3", text: "Leer el documento frente a los testigos y el trabajador." }, { id: "s4", text: "Hacer que los testigos firmen como constancia de la negativa." } ], correctSequence: ["s1", "s2", "s3", "s4"] },
            { id: "q10", type: "adaptive_radio", category: "analisis_jurisprudencial", difficulty: 4, text: "¿Qué ocurre jurídicamente si un trabajador, debidamente notificado, no asiste a la audiencia de descargos sin justificación válida?", options: [ { id: "o1", text: "Se considera automáticamente como una confesión de culpabilidad." }, { id: "o2", text: "El proceso se anula y la empresa pierde el derecho a sancionar." }, { id: "o3", text: "Se deja constancia de la inasistencia y el empleador toma la decisión basándose únicamente en las pruebas aportadas al expediente." }, { id: "o4", text: "Se debe solicitar autorización a un juez laboral para continuar." } ], correctOption: "o3" },
            { id: "q11", type: "cloze_text", category: "principios_derecho", difficulty: 4, text: "Las sanciones disciplinarias no pueden consistir en penas corporales, ni en medidas lesivas de la {1} del trabajador. Según el Código Sustantivo del Trabajo, las suspensiones por primera vez no pueden exceder de {2} días.", blanks: [ { id: "b1", options: ["economía", "dignidad", "productividad"], correct: "dignidad" }, { id: "b2", options: ["ocho", "quince", "treinta"], correct: "ocho" } ] },
            { id: "q12", type: "adaptive_radio", category: "teoria_descargo", difficulty: 2, text: "Durante la audiencia de descargos, el trabajador solicita estar acompañado por dos miembros del sindicato o dos compañeros. ¿Es esto legalmente viable?", options: [ { id: "o1", text: "No, las audiencias son estrictamente confidenciales y privadas entre RRHH y el implicado." }, { id: "o2", text: "Solo si el trabajador paga por un abogado titulado." }, { id: "o3", text: "Sí, es un derecho fundamental a la defensa garantizado jurisprudencial y convencionalmente." }, { id: "o4", text: "Sí, pero los acompañantes no pueden escuchar lo que se dice, solo observar." } ], correctOption: "o3" },
            { id: "q13", type: "adaptive_radio", category: "analisis_caso", difficulty: 5, text: "La empresa descubre una falta grave mediante la instalación de una cámara oculta en los casilleros de los trabajadores (sin su consentimiento ni aviso previo). Esta prueba es:", options: [ { id: "o1", text: "Totalmente válida porque el fin justifica los medios en materia laboral." }, { id: "o2", text: "Ilícita, nula de pleno derecho por vulnerar el derecho a la intimidad, viciando el proceso." }, { id: "o3", text: "Válida solo si el robo supera los 10 salarios mínimos." }, { id: "o4", text: "Parcialmente válida, sirve para despedir pero no para denunciar penalmente." } ], correctOption: "o2" },
            { id: "q14", type: "cloze_text", category: "procedimiento", difficulty: 4, text: "El {1} de la diligencia de descargos no debe ser un interrogatorio policial. Al finalizar, el documento escrito debe ser {2} íntegramente por el trabajador, quien puede solicitar {3} antes de firmarlo.", blanks: [ { id: "b1", options: ["acta", "ambiente", "castigo"], correct: "ambiente" }, { id: "b2", options: ["ignorado", "leído", "destruido"], correct: "leído" }, { id: "b3", options: ["correcciones", "dinero", "permisos"], correct: "correcciones" } ] },
            { id: "q15", type: "adaptive_radio", category: "analisis_jurisprudencial", difficulty: 4, text: "Si un empleador vulnera flagrantemente el debido proceso laboral (ej. despidiendo sin escuchar a un trabajador aforado), ¿cuál es la vía legal constitucional más expedita para proteger los derechos?", options: [ { id: "o1", text: "Una demanda civil ordinaria por daños y perjuicios." }, { id: "o2", text: "Una carta de queja anónima en el buzón de la empresa." }, { id: "o3", text: "La Acción de Tutela, por vulneración al mínimo vital, debido proceso y derecho a la defensa." }, { id: "o4", text: "Declararse en huelga individual." } ], correctOption: "o3" },
            { id: "q16", type: "adaptive_radio", category: "teoria_descargo", difficulty: 3, text: "¿Cuál es la diferencia primordial entre una falta leve y una falta grave según la jurisprudencia laboral?", options: [ { id: "o1", text: "La falta leve se castiga con cárcel; la grave con despido." }, { id: "o2", text: "La calificación taxativa en el Reglamento Interno, el contrato o la ley, y el nivel de afectación al bien jurídico tutelado de la empresa." }, { id: "o3", text: "La falta leve la cometen los operarios; la grave los gerentes." }, { id: "o4", text: "No hay diferencia, cualquier error justifica un despido inmediato." } ], correctOption: "o2" }
        ];

        // --- COMPONENTES UI COMPACTOS Y ELEGANTES ---
        const GlassCard = ({ children, className = "" }) => <div className={`glass-panel rounded-2xl p-6 transition-all ${className}`}>{children}</div>;
        const Button = ({ children, variant = 'primary', onClick, className = "", disabled=false, icon: Icon }) => {
            const vars = { 
                primary: "bg-law-900 hover:bg-law-800 text-white shadow-lg shadow-law-900/20", 
                secondary: "bg-slate-200 hover:bg-slate-300 text-law-900 font-semibold", 
                outline: "border-2 border-law-800 text-law-800 hover:bg-law-800 hover:text-white",
                gold: "bg-gold-500 hover:bg-gold-600 text-white shadow-lg shadow-gold-500/30"
            };
            return <button onClick={onClick} disabled={disabled} className={`flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-semibold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed ${vars[variant]} ${className}`}>{Icon && <Icon size={18} />}{children}</button>;
        };
        const FormField = ({ label, type="text", value, onChange, options, placeholder, required=false, as="input" }) => (
            <div className="flex flex-col gap-1 mb-4 w-full">
                {label && <label className="text-sm text-slate-600 font-bold">{label}</label>}
                {as === "select" ? (
                    <select value={value} onChange={onChange} required={required} className="bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-law-500 outline-none shadow-sm">
                        <option value="" disabled>Seleccione...</option>{options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                    </select>
                ) : as === "textarea" ? (
                    <textarea value={value} onChange={onChange} placeholder={placeholder} required={required} className="bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-law-500 outline-none min-h-[100px] shadow-sm"></textarea>
                ) : (
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} className="bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-law-500 outline-none shadow-sm" />
                )}
            </div>
        );

        // --- SUBCOMPONENTES DE PREGUNTAS (RESTAURADOS PARA SOLUCIONAR EL ERROR) ---
        const AdaptiveRadio = ({ q, onAnswer, sel }) => <div className="flex flex-col gap-3 mt-6">{q.options.map(o => <button key={o.id} onClick={()=>onAnswer(o.id)} className={`text-left p-5 rounded-xl border-2 flex gap-4 transition-all ${sel===o.id?'bg-law-50 border-law-600 shadow-md':'bg-white border-slate-200 hover:border-law-300'}`}><div className={`mt-1 min-w-[20px] h-5 rounded-full border-2 flex items-center justify-center ${sel===o.id?'border-law-600':'border-slate-300'}`}>{sel===o.id && <div className="w-2.5 h-2.5 bg-law-600 rounded-full"/>}</div><span className={`text-[15px] ${sel===o.id?'text-law-900 font-medium':'text-slate-700'}`}>{o.text}</span></button>)}</div>;
        
        const SequenceSorter = ({ q, onAnswer, sel }) => {
            const [items, setItems] = useState(sel || q.items);
            useEffect(()=>onAnswer(items.map(i=>i.id)), [items]);
            const move = (idx, dir) => { const n=[...items]; [n[idx], n[idx+dir]] = [n[idx+dir], n[idx]]; setItems(n); };
            return <div className="flex flex-col gap-3 mt-6"><p className="text-sm text-slate-500 font-medium mb-2">Utiliza las flechas para ordenar cronológicamente:</p>{items.map((it, i) => <div key={it.id} className="flex items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><div className="flex flex-col gap-1"><button onClick={()=>move(i,-1)} disabled={i===0} className="text-slate-400 hover:text-law-600 disabled:opacity-20 transition-colors"><ChevronLeft className="rotate-90" size={20}/></button><button onClick={()=>move(i,1)} disabled={i===items.length-1} className="text-slate-400 hover:text-law-600 disabled:opacity-20 transition-colors"><ChevronLeft className="-rotate-90" size={20}/></button></div><div className="bg-law-100 text-law-800 w-8 h-8 flex items-center justify-center rounded-full font-bold">{i+1}</div><span className="text-slate-700">{it.text}</span></div>)}</div>;
        };
        
        const ClozeText = ({ q, onAnswer, sel={} }) => (
            <div className="mt-6 p-8 bg-slate-50 rounded-2xl border border-slate-200 text-lg leading-loose text-slate-700 shadow-inner">
                {q.text.split(/({[0-9]+})/g).map((pt, i) => {
                    const m = pt.match(/{([0-9]+)}/);
                    if(m) { const b = q.blanks[parseInt(m[1])-1]; return b ? <select key={i} value={sel[b.id]||""} onChange={e=>onAnswer({...sel, [b.id]: e.target.value})} className="mx-2 bg-white border-b-2 border-law-600 text-law-800 font-bold outline-none px-3 py-1 rounded shadow-sm focus:ring-2 focus:ring-law-400 appearance-none cursor-pointer"><option value="" disabled>_</option>{b.options.map(o=><option key={o} value={o}>{o}</option>)}</select> : null; }
                    return <span key={i}>{pt}</span>;
                })}
            </div>
        );
        
        const ImageHotspot = ({ q, onAnswer, sel }) => (
            <div className="mt-6"><div className="hotspot-container bg-white shadow-md"><div className="font-bold text-center border-b border-slate-200 pb-3 mb-5 text-law-900">{q.imageDoc.header}</div><div className="whitespace-pre-wrap text-slate-700 mb-8 leading-relaxed">{q.imageDoc.body}</div><div className="text-right text-xs italic border-t border-slate-200 pt-3 text-slate-500">{q.imageDoc.footer}</div>{q.hotspots.map(hs => <div key={hs.id} className={`hotspot-zone ${sel===hs.id?'selected':''}`} style={{top:hs.top,left:hs.left,width:hs.width,height:hs.height}} onClick={()=>onAnswer(hs.id)}/>)}</div></div>
        );

        // --- GLOBAL HEADER WITH PROFILE EDIT ---
        const Header = ({ title }) => {
            const { setView, view } = useContext(AppContext);
            return (
                <header className="flex justify-between items-center mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div className="flex items-center gap-3">
                        <Shield className="text-law-800" size={28} />
                        <h1 className="text-xl md:text-2xl font-serif font-bold text-slate-800 hidden md:block">{title}</h1>
                    </div>
                    <div className="flex gap-2">
                        <Button variant="outline" onClick={() => setView('profile')} className="py-2 px-4 text-sm" icon={Edit3}>Mi Perfil</Button>
                    </div>
                </header>
            );
        };

        // --- GLOBAL FOOTER ---
        const Footer = () => (
            <footer className="w-full py-6 mt-12 bg-slate-900 text-slate-400 text-center text-sm">
                <div className="max-w-4xl mx-auto px-4 flex flex-col items-center gap-2">
                    <p className="font-semibold text-slate-300">© 2026 LunaAcademy | Investigación en Pedagogía del Descargo</p>
                    <p>Todos los derechos reservados. Material académico de uso exclusivo.</p>
                    <div className="flex items-center justify-center gap-2 mt-2 px-4 py-1 bg-slate-800 rounded-full border border-slate-700 w-fit mx-auto text-xs text-gold-400">
                        <BrainCircuit size={14} /> Contenido enriquecido y potenciado por IA
                    </div>
                </div>
            </footer>
        );

        // --- VISTAS ---
        const AuthView = () => {
            const { setUser, setView } = useContext(AppContext);

            const checkUserRecord = async (user) => {
                try {
                    if (user.email === ADMIN_EMAIL) { setUser({ ...user, role: 'admin', isMaster: true }); setView('dashboard'); return; }
                    const docSnap = await getDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'profile', 'data'));
                    if (docSnap.exists()) { setUser({ ...user, ...docSnap.data() }); setView('intro'); } 
                    else { setUser(user); setView('profile'); }
                } catch(e) { setUser(user); setView('profile'); }
            };

            const handleError = (err) => {
                if(err.message.includes('auth/operation-not-allowed') || err.message.includes('400')) {
                    setError("Error: Asegúrate de habilitar 'Correo/Contraseña' y 'Anónimo' en Firebase > Authentication.");
                } else if(err.message.includes('invalid-credential')) { setError("Credenciales incorrectas."); }
                else { setError(err.message); }
                setLoading(false);
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault(); setLoading(true); setError("");
                try {
                    const result = mode === 'login' ? await signInWithEmailAndPassword(auth, email, password) : await createUserWithEmailAndPassword(auth, email, password);
                    await checkUserRecord(result.user);
                } catch (err) { handleError(err); }
            };

            const handleGoogle = async () => {
                setLoading(true); setError("");
                try { await checkUserRecord((await signInWithPopup(auth, new GoogleAuthProvider())).user); }

        const EvaluationView = () => {
            const { user, setView, setEvaluationData, theoryStats } = useContext(AppContext);
            
            // LÓGICA DE PERSISTENCIA (ANTI-CAÍDAS DE INTERNET)
            // Carga los datos desde localStorage si existen, o usa los valores por defecto
            const loadSaved = (key, defaultVal) => {
                const saved = localStorage.getItem(`luna_${key}_${user.uid}`);
                return saved ? JSON.parse(saved) : defaultVal;
            };

            const [qs, setQs] = useState([]); 
            const [idx, setIdx] = useState(() => loadSaved('idx', 0)); 
            const [ans, setAns] = useState(() => loadSaved('ans', {}));
            const [hints, setHints] = useState(() => loadSaved('hints', [])); 
            const [msg, setMsg] = useState(""); 
            const [start, setStart] = useState(() => loadSaved('start', Date.now()));

            // Efecto para autoguardar cada vez que el usuario avanza o responde
            useEffect(() => {
                if (qs.length > 0) {
                    localStorage.setItem(`luna_idx_${user.uid}`, JSON.stringify(idx));
                    localStorage.setItem(`luna_ans_${user.uid}`, JSON.stringify(ans));
                    localStorage.setItem(`luna_hints_${user.uid}`, JSON.stringify(hints));
                    localStorage.setItem(`luna_start_${user.uid}`, JSON.stringify(start));
                }
            }, [idx, ans, hints, start, user.uid, qs]);

            useEffect(() => {
                getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'question_bank'))
                .then(snap => { let d=[]; snap.forEach(doc=>d.push({id:doc.id,...doc.data()})); setQs(d.length ? d : DEFAULT_QUESTIONS); })
                .catch(() => setQs(DEFAULT_QUESTIONS));
            }, []);

            if(!qs.length) return <div className="min-h-screen flex items-center justify-center text-law-600 font-semibold text-xl">Cargando batería de preguntas...</div>;
            const q = qs[idx];

            const finish = async () => {
                let score = 0, correct = 0, details = [];
                let categoryScores = { 'teoria_descargo': {s:0, m:0}, 'procedimiento': {s:0, m:0}, 'analisis_caso': {s:0, m:0}, 'principios_derecho': {s:0, m:0}, 'analisis_jurisprudencial': {s:0, m:0}, 'analisis_documental':{s:0,m:0} };

                qs.forEach(quest => {
                    let isC = false, a = ans[quest.id];
                    if(quest.type==='adaptive_radio' && a===quest.correctOption) isC=true;
                    if(quest.type==='sequence_sorter' && JSON.stringify(a)===JSON.stringify(quest.correctSequence)) isC=true;
                    if(quest.type==='cloze_text') { isC = quest.blanks.every(b => a?.[b.id] === b.correct); }
                    if(quest.type==='image_hotspot') { isC = quest.hotspots.find(h=>h.id===a)?.isCorrect; }
                    
                    let pts = isC ? quest.difficulty*10 : 0;
                    if(hints.includes(quest.id)) pts = Math.max(0, pts-5);
                    
                    if(isC) correct++; 
                    score+=pts; 
                    details.push({qId: quest.id, isC, pts, cat: quest.category});

                    if(categoryScores[quest.category]) {
                        categoryScores[quest.category].s += pts;
                        categoryScores[quest.category].m += (quest.difficulty*10);
                    }
                });
                
                const max = qs.reduce((acc, quest) => acc + (quest.difficulty*10), 0);
                const radarData = Object.keys(categoryScores).map(k => ({
                    subject: k.replace('_', ' ').toUpperCase(),
                    A: categoryScores[k].m > 0 ? Math.round((categoryScores[k].s / categoryScores[k].m) * 100) : 0,
                    fullMark: 100
                })).filter(r => r.A > 0 || r.subject);

                const payload = { 
                    userId: user.uid, 
                    nombre: user.displayName || user.nombre || 'Anónimo',
                    role: user.role || 'No especificado', 
                    sector: user.sector || 'No especificado',
                    experiencia: user.experiencia || 0,
                    edad: user.edad || 0,
                    genero: user.genero || 'No especificado',
                    theoryTime: theoryStats?.timeSeconds || 0,
                    theoryNodesExplored: theoryStats?.nodesExplored || 0,
                    score, perc: Math.round((score/max)*100)||0, 
                    time: Math.floor((Date.now()-start)/1000), hints: hints.length, details, radarData, timestamp: serverTimestamp() 
                };
                
                try { 
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chat_results'), payload); 
                    
                    // LIMPIEZA DE PERSISTENCIA AL FINALIZAR CON ÉXITO
                    localStorage.removeItem(`luna_idx_${user.uid}`);
                    localStorage.removeItem(`luna_ans_${user.uid}`);
                    localStorage.removeItem(`luna_hints_${user.uid}`);
                    localStorage.removeItem(`luna_start_${user.uid}`);
                    
                } catch(e){ console.error("Error guardando resultados", e); }
                
                setEvaluationData(payload); setView('results');
            };

            const sendDoubt = async () => {
                if(!msg.trim()) return;
                try { await addDoc(collection(db,'artifacts',APP_ID,'public','data','chat_doubts'), {text:msg, userId:user.uid, qId:q.id, ts:serverTimestamp()}); setMsg(""); alert("Aporte cualitativo registrado exitosamente."); } catch(e){}
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 pb-24">

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 flex flex-col">
                                <header className="flex justify-between items-center mb-4">
                                    <div className="flex flex-col gap-1">

                                            Caso {idx+1} de {qs.length}
                                        </div>
                                        <div className="text-xs text-slate-500 font-semibold ml-2">
                                            {qs.length - (idx + 1)} casos restantes
                                        </div>
                                    </div>
                                    <div className="text-slate-500 text-sm font-bold flex gap-1">
                                        {qs.map((_, i) => <div key={i} className={`h-2 w-3 md:w-4 rounded-full ${i <= idx ? 'bg-law-600' : 'bg-slate-200'}`}></div>)}
                                    </div>
                                </header>

                                <GlassCard className="flex-1 flex flex-col shadow-xl">
                                    <div className="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                                        <span className="text-xs font-bold uppercase tracking-widest text-law-700 bg-law-50 px-3 py-1 rounded-md border border-law-200">
                                            {q.category.replace('_',' ')}
                                        </span>
                                        <button onClick={()=>!hints.includes(q.id)&&setHints([...hints, q.id])} className="text-gold-500 hover:bg-gold-50 p-2 rounded-lg transition-colors flex items-center gap-1 text-sm font-bold" title="Pedir Pista Conceptual (-5 pts)">
                                            <Lightbulb size={18}/> Pista
                                        </button>
                                    </div>

                                    <h2 className="text-xl md:text-2xl font-serif font-bold leading-relaxed mb-4 text-slate-800">
                                        {q.text}
                                    </h2>

                                    {hints.includes(q.id) && (
                                        <div className="mb-4 p-4 bg-gold-50 border border-gold-200 text-gold-800 rounded-xl text-sm flex items-start gap-3 animate-fade-in shadow-sm">
                                            <AlertTriangle size={20} className="mt-0.5 shrink-0"/>
                                            <span><strong>Ayuda Didáctica:</strong> Analiza el caso siempre desde la óptica protectora del derecho laboral (*in dubio pro operario*) y recuerda que la sanción es el último recurso.</span>
                                        </div>
                                    )}

                                    <div className="flex-1">
                                        {q.type==='adaptive_radio' && <AdaptiveRadio q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                        {q.type==='sequence_sorter' && <SequenceSorter q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                        {q.type==='cloze_text' && <ClozeText q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                        {q.type==='image_hotspot' && <ImageHotspot q={q} sel={ans[q.id]} onAnswer={v=>setAns({...ans,[q.id]:v})} />}
                                    </div>

                                    <div className="mt-10 pt-6 border-t border-slate-200 flex justify-between items-center">
                                        <div className="text-slate-400 text-sm font-bold flex items-center gap-1">Dificultad: <span className="text-gold-500">{Array(q.difficulty).fill('★').join('')}</span></div>
                                        <Button variant="primary" onClick={()=>idx<qs.length-1?setIdx(idx+1):finish()} disabled={!ans[q.id]||(q.type==='cloze_text'&&Object.keys(ans[q.id]).length<q.blanks.length)} icon={ChevronRight}>
                                            {idx===qs.length-1?'Generar Diagnóstico':'Siguiente Caso'}
                                        </Button>
                                    </div>
                                </GlassCard>
                            </div>

                            <div className="lg:col-span-1 flex flex-col gap-6">
                                <GlassCard className="flex-1 flex flex-col shadow-lg border-t-4 border-t-law-500 bg-white">
                                    <div className="flex items-center gap-2 mb-4 border-b border-slate-100 pb-4">
                                        <MessageSquare size={22} className="text-law-600" />
                                        <h3 className="font-bold text-lg text-slate-800">Foro de Investigación Cualitativa</h3>
                                    </div>
                                    <p className="text-sm text-slate-600 mb-4 leading-relaxed">

                                    </p>
                                    <div className="flex-1"/>
                                    <textarea value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Ej: En mi empresa, esto se maneja aplicando el reglamento interno artículo 14..." className="bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-4 text-sm h-32 outline-none focus:ring-2 focus:ring-law-400 mb-4 resize-none shadow-inner"/>

                                    <p className="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Tiempo de Inmersión</p>
                                    <p className="text-xl font-serif text-slate-800">{Math.floor((Date.now()-start)/60000)} min {Math.floor(((Date.now()-start)%60000)/1000)} seg</p>
                                </div>
                            </div>
                        </div>
                    </div>

            );

            const sendSurvey = async () => { try { await addDoc(collection(db,'artifacts',APP_ID,'public','data','reviews'), {...survey, uid:user.uid, ts:serverTimestamp()}); setSent(true); } catch(e){} };

            return (

                    <div className="text-center mb-10 mt-2">

                        </div>
                        <h1 className="text-4xl md:text-5xl font-serif font-bold text-law-900 mb-4">Reporte de Competencias</h1>

                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl mb-12">

                            <h3 className="text-lg font-bold text-slate-500 uppercase tracking-widest mb-4">Índice Global de Garantismo</h3>

                                {data.perc}%
                            </div>
                            <div className="bg-law-50 border border-law-100 p-4 rounded-xl">
                                <p className="text-law-900 text-sm leading-relaxed font-medium">{diag}</p>
                            </div>
                        </GlassCard>

                        <GlassCard className="bg-white shadow-2xl h-80 flex flex-col items-center">

                            <div className="w-full flex-1">
                                <ResponsiveContainer width="100%" height="100%">
                                    <RadarChart cx="50%" cy="50%" outerRadius="70%" data={data.radarData || []}>
                                        <PolarGrid stroke="#e2e8f0" />
                                        <PolarAngleAxis dataKey="subject" tick={{fill: '#475569', fontSize: 10, fontWeight: 'bold'}} />
                                        <PolarRadiusAxis angle={30} domain={[0, 100]} tick={false} axisLine={false} />

                                            <div className="text-center font-black text-law-600 mt-2 text-xl">{survey[item.k]}</div>

                                <p className="text-green-700 font-bold text-lg">¡Aporte registrado! Gracias por contribuir a la investigación.</p>
                            </div>

                        <div className="mt-10 pt-6 border-t border-slate-200 flex flex-wrap justify-center gap-4">

        const AdminDashboardView = () => {
            const { setView } = useContext(AppContext);
            const [res, setRes] = useState([]); const [dbt, setDbt] = useState([]);
            
            useEffect(() => {
                getDocs(query(collection(db,'artifacts',APP_ID,'public','data','chat_results'), orderBy('timestamp','desc'))).then(s=>{let d=[]; s.forEach(x=>d.push(x.data())); setRes(d);});
                getDocs(query(collection(db,'artifacts',APP_ID,'public','data','chat_doubts'), orderBy('ts','desc'), limit(50))).then(s=>{let d=[]; s.forEach(x=>d.push(x.data())); setDbt(d);});
            }, []);

            // 1. Usuarios Únicos
            const uniqueUsersCount = useMemo(() => new Set(res.map(r => r.userId)).size, [res]);

            // 2. Data de Roles
            const rolesData = useMemo(() => {
                const counts = res.reduce((acc, curr) => { acc[curr.role] = (acc[curr.role] || 0) + 1; return acc; }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value })).filter(x => x.name && x.name !== 'undefined');
            }, [res]);

            // 3. Data de Evolución (Trend)
            const trendData = useMemo(() => {
                return [...res].reverse().map((r, i) => ({ Evaluacion: `E${i+1}`, Puntaje: r.perc }));
            }, [res]);

            // 4. NUEVO: Data de Sectores Económicos (Para usar toda la data recolectada)
            const sectorData = useMemo(() => {
                const counts = res.reduce((acc, curr) => { 
                    const s = curr.sector && curr.sector !== 'No especificado' ? curr.sector : 'Otro';
                    acc[s] = (acc[s] || 0) + 1; 
                    return acc; 
                }, {});
                return Object.entries(counts).map(([name, value]) => ({ name: name.charAt(0).toUpperCase() + name.slice(1), value }));
            }, [res]);

            // 5. NUEVO: Data de Género
            const generoData = useMemo(() => {
                const counts = res.reduce((acc, curr) => {
                    let g = curr.genero === 'm' ? 'Masculino' : curr.genero === 'f' ? 'Femenino' : curr.genero === 'o' ? 'Otro' : 'No espec.';
                    acc[g] = (acc[g] || 0) + 1; 
                    return acc;
                }, {});
                return Object.entries(counts).map(([name, value]) => ({ name, value }));
            }, [res]);

            // 6. Estadísticas Rápidas Adicionales y Promedios (Modificado)
            const promediosPerfil = useMemo(() => {
                if(!res.length) return { edad: 0, exp: 0, theoryTime: 0, theoryExplored: 0 };
                const validEdades = res.filter(r => r.edad && r.edad > 0).map(r => Number(r.edad));
                const validExp = res.filter(r => r.experiencia && r.experiencia > 0).map(r => Number(r.experiencia));
                const validTime = res.filter(r => r.theoryTime !== undefined).map(r => Number(r.theoryTime));
                const validNodes = res.filter(r => r.theoryNodesExplored !== undefined).map(r => Number(r.theoryNodesExplored));
                
                const avgEdad = validEdades.length ? Math.round(validEdades.reduce((a,b)=>a+b,0) / validEdades.length) : 0;
                const avgExp = validExp.length ? Math.round(validExp.reduce((a,b)=>a+b,0) / validExp.length) : 0;
                const avgTime = validTime.length ? Math.round(validTime.reduce((a,b)=>a+b,0) / validTime.length) : 0;
                const avgNodes = validNodes.length ? (validNodes.reduce((a,b)=>a+b,0) / validNodes.length).toFixed(1) : 0;
                
                return { edad: avgEdad, exp: avgExp, theoryTime: avgTime, theoryExplored: avgNodes };
            }, [res]);

            const COLORS = ['#1e3a8a', '#d97706', '#047857', '#b91c1c', '#4f46e5', '#0f766e'];
            const SECTOR_COLORS = ['#3b82f6', '#8b5cf6', '#10b981', '#64748b'];
            const GENDER_COLORS = ['#eab308', '#ec4899', '#94a3b8', '#cbd5e1'];

            return (
                <div className="min-h-screen bg-slate-100 p-4 md:p-8 pb-24">

                            </div>
                        </header>

                        {/* KPIs Principales */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

                                    {res.length} Ev. Registradas
                                </div>
                            </GlassCard>
                            <GlassCard className="bg-white border-l-4 border-l-gold-500 shadow-md">
                                <h3 className="text-slate-500 text-sm font-bold uppercase tracking-wider">Índice Promedio</h3>
                                <p className="text-4xl font-black text-gold-600 mt-2">{res.length?Math.round(res.reduce((a,b)=>a+b.perc,0)/res.length):0}%</p>
                                <p className="text-xs text-slate-500 mt-2">Nivel de Garantismo Global</p>
                            </GlassCard>
                            <GlassCard className="bg-white border-l-4 border-l-green-600 shadow-md">

                            <GlassCard className="bg-white border-l-4 border-l-purple-600 shadow-md">
                                <h3 className="text-slate-500 text-sm font-bold uppercase tracking-wider">Aprobación (>80%)</h3>
                                <p className="text-4xl font-black text-purple-700 mt-2">{res.length?Math.round((res.filter(r=>r.perc>=80).length/res.length)*100):0}%</p>
                                <p className="text-xs text-slate-500 mt-2">Población con alto dominio</p>
                            </GlassCard>
                        </div>

                        {/* Fila 1 Gráficos: Evolución y Roles */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                            <GlassCard className="lg:col-span-2 h-96 bg-white shadow-md flex flex-col">
                                <h3 className="font-bold text-slate-800 mb-4 font-serif text-lg">Evolución Cronológica del Índice de Garantismo</h3>
                                <div className="flex-1 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={trendData} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                            <defs>
                                                <linearGradient id="colorPv" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#2563eb" stopOpacity={0.3}/>
                                                    <stop offset="95%" stopColor="#2563eb" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis dataKey="Evaluacion" tickLine={false} axisLine={false} tick={{fill: '#64748b', fontSize: 12}} />
                                            <YAxis domain={[0, 100]} tickLine={false} axisLine={false} tick={{fill: '#64748b', fontSize: 12}} />
                                            <RechartsTooltip contentStyle={{borderRadius: '8px', border:'none', boxShadow:'0 4px 15px rgba(0,0,0,0.1)'}} />
                                            <Area type="monotone" dataKey="Puntaje" stroke="#2563eb" strokeWidth={3} fillOpacity={1} fill="url(#colorPv)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </GlassCard>

                            <GlassCard className="lg:col-span-1 h-96 bg-white shadow-md flex flex-col">
                                <h3 className="font-bold text-slate-800 mb-4 font-serif text-lg">Distribución por Rol Profesional</h3>
                                <div className="flex-1 w-full">
                                    {rolesData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={rolesData} cx="50%" cy="50%" innerRadius={70} outerRadius={100} paddingAngle={5} dataKey="value">
                                                    {rolesData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                                </Pie>
                                                <RechartsTooltip contentStyle={{borderRadius: '8px', border:'none', boxShadow:'0 4px 6px rgba(0,0,0,0.1)'}} />
                                                <Legend verticalAlign="bottom" height={36} wrapperStyle={{fontSize: '11px', fontWeight: 'bold'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    ) : <div className="h-full flex items-center justify-center text-slate-400">Sin datos demográficos</div>}
                                </div>
                            </GlassCard>
                        </div>

                        {/* Fila 2 Gráficos: Data Sociodemográfica Profunda */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <GlassCard className="h-80 bg-white shadow-md flex flex-col">
                                <h3 className="font-bold text-slate-800 mb-4 font-serif text-lg">Sectores Económicos</h3>
                                <div className="flex-1 w-full">
                                    {sectorData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={sectorData} margin={{top: 20, right: 20, left: -20, bottom: 5}}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                                                <XAxis dataKey="name" tick={{fill: '#64748b', fontSize: 11}} tickLine={false} axisLine={false}/>
                                                <YAxis tick={{fill: '#64748b', fontSize: 11}} tickLine={false} axisLine={false}/>
                                                <RechartsTooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius: '8px', border:'none', boxShadow:'0 4px 6px rgba(0,0,0,0.1)'}}/>
                                                <Bar dataKey="value" radius={[4, 4, 0, 0]}>
                                                    {sectorData.map((entry, index) => <Cell key={`cell-${index}`} fill={SECTOR_COLORS[index % SECTOR_COLORS.length]} />)}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    ) : <div className="h-full flex items-center justify-center text-slate-400">Sin datos</div>}
                                </div>
                            </GlassCard>

                            <GlassCard className="h-80 bg-white shadow-md flex flex-col">
                                <h3 className="font-bold text-slate-800 mb-4 font-serif text-lg">Distribución de Género</h3>
                                <div className="flex-1 w-full">
                                    {generoData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={generoData} cx="50%" cy="50%" outerRadius={90} dataKey="value" label={({name, percent}) => `${name} ${(percent * 100).toFixed(0)}%`} labelLine={false}>
                                                    {generoData.map((entry, index) => <Cell key={`cell-${index}`} fill={GENDER_COLORS[index % GENDER_COLORS.length]} />)}
                                                </Pie>
                                                <RechartsTooltip contentStyle={{borderRadius: '8px', border:'none', boxShadow:'0 4px 6px rgba(0,0,0,0.1)'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    ) : <div className="h-full flex items-center justify-center text-slate-400">Sin datos</div>}
                                </div>
                            </GlassCard>

                            <GlassCard className="h-80 bg-white shadow-md flex flex-col items-center justify-center text-center">
                                <h3 className="font-bold text-slate-800 mb-6 font-serif text-lg w-full text-left">Perfil Demográfico Promedio</h3>
                                <div className="grid grid-cols-2 gap-4 w-full">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center justify-center">
                                        <p className="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Edad</p>
                                        <p className="text-2xl font-black text-slate-700">{promediosPerfil.edad > 0 ? `${promediosPerfil.edad} años` : 'N/A'}</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center justify-center">
                                        <p className="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Experiencia</p>
                                        <p className="text-2xl font-black text-law-700">{promediosPerfil.exp > 0 ? `${promediosPerfil.exp} años` : 'N/A'}</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center justify-center col-span-2">
                                        <p className="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Inmersión Teórica (Promedio)</p>
                                        <p className="text-lg font-black text-gold-600">
                                            {promediosPerfil.theoryExplored > 0 ? `${promediosPerfil.theoryExplored} de 6 Nodos (${Math.floor(promediosPerfil.theoryTime/60)}m ${promediosPerfil.theoryTime%60}s)` : 'Sin datos'}
                                        </p>
                                    </div>
                                </div>
                            </GlassCard>
                        </div>

                        {/* SECCIÓN NUEVA: GESTIÓN DE REGISTROS (LIMPIEZA DE DATOS) */}
                        <GlassCard className="bg-white shadow-md mb-8">
                            <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                                <h3 className="font-bold text-xl text-law-900 font-serif">
                                    Gestión de Evaluaciones (Limpieza Estadística)
                                </h3>
                            </div>
                            <p className="text-sm text-slate-500 mb-4">
                                Si necesitas eliminar pruebas fallidas o registros de prueba para no contaminar la estadística, puedes hacerlo aquí. Esta acción es irreversible.
                            </p>
                            
                            {res.length === 0 ? (
                                <p className="text-slate-500 italic text-center py-8">No hay evaluaciones registradas.</p>
                            ) : (
                                <div className="overflow-x-auto rounded-xl border border-slate-200 max-h-80 overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs uppercase bg-slate-50 text-slate-600 sticky top-0 border-b border-slate-200">
                                            <tr>
                                                <th className="px-6 py-4">Fecha</th>
                                                <th className="px-6 py-4">Investigador</th>
                                                <th className="px-6 py-4">Rol</th>
                                                <th className="px-6 py-4 text-center">Puntaje</th>
                                                <th className="px-6 py-4 text-center">Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {res.map((r, i) => (
                                                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap text-slate-600">
                                                        {r.timestamp?.toDate ? r.timestamp.toDate().toLocaleString() : 'Reciente'}
                                                    </td>
                                                    <td className="px-6 py-4 font-semibold text-slate-800">{r.nombre || r.userId.substring(0,8)+'...'}</td>
                                                    <td className="px-6 py-4 text-slate-600 capitalize">{r.role}</td>
                                                    <td className="px-6 py-4 text-center font-bold text-law-600">{r.perc}%</td>
                                                    <td className="px-6 py-4 text-center">
                                                        <button 
                                                            onClick={async () => {
                                                                if(window.confirm(`¿Estás seguro de eliminar el registro de ${r.nombre || 'este usuario'}? Esto recalculará las estadísticas.`)) {
                                                                    try {
                                                                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chat_results', r.id));
                                                                        // Actualizar estado local para reflejar cambios en gráficas de inmediato
                                                                        setRes(prev => prev.filter(item => item.id !== r.id));
                                                                        alert("Registro eliminado exitosamente.");
                                                                    } catch (error) {
                                                                        alert("Error al eliminar: " + error.message);
                                                                    }
                                                                }
                                                            }}
                                                            className="text-red-500 hover:text-white hover:bg-red-500 border border-red-200 hover:border-red-500 px-3 py-1 rounded-lg transition-colors text-xs font-bold"
                                                        >
                                                            Eliminar
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </GlassCard>

                        {/* Matriz Cualitativa */}
                        <GlassCard className="bg-white shadow-md">
                            <h3 className="font-bold text-xl text-law-900 mb-6 font-serif border-b border-slate-200 pb-4">
                                Matriz Analítica: Dudas y Aportes del Foro (Data Cruda)
                            </h3>
                            {dbt.length === 0 ? (
                                <p className="text-slate-500 italic text-center py-8">Aún no hay registros cualitativos.</p>
                            ) : (
                                <div className="overflow-x-auto rounded-xl border border-slate-200">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs uppercase bg-slate-50 text-slate-600 border-b border-slate-200">
                                            <tr>
                                                <th className="px-6 py-4">Contexto (Pregunta ID)</th>
                                                <th className="px-6 py-4">Aporte Registrado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {dbt.map((d, i) => (
                                                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 font-mono text-law-600 font-bold whitespace-nowrap">[{d.qId}]</td>
                                                    <td className="px-6 py-4 text-slate-700 leading-relaxed">{d.text}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </GlassCard>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null); 
            const [evalData, setEvaluationData] = useState(null);
            const [theoryStats, setTheoryStats] = useState({ timeSeconds: 0, nodesExplored: 0 });

            useEffect(() => {
                return onAuthStateChanged(auth, async (u) => {
                    if(!u) { setUser(null); setView('login'); return; }
                    if(u.email === ADMIN_EMAIL) { setUser({...u, role:'admin', isMaster:true}); setView('dashboard'); }
                    else if(view === 'login') {
                        try { const snap = await getDoc(doc(db,'artifacts',APP_ID,'users',u.uid,'profile','data'));
                            if(snap.exists()){ setUser({...u,...snap.data()}); setView('intro'); } else { setUser(u); setView('profile'); }
                        } catch(e) { setUser(u); setView('profile'); }
                    }
                });
            }, []);

            return (
                <AppContext.Provider value={{ user, setUser, setView, evaluationData: evalData, setEvaluationData, theoryStats, setTheoryStats }}>
                    <div className="min-h-screen relative selection:bg-law-200 selection:text-law-900 flex flex-col">
                        
                        <div className="flex-1">
                            {view==='login'&&<AuthView/>}
                            {view==='profile'&&<ProfileView/>}
                            {view==='intro'&&
                                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center text-center p-4">
                                    <div className="w-full max-w-4xl mb-6"><Header title="Bienvenido/a al Estudio Diagnóstico" /></div>
                                    <div className="max-w-3xl mx-auto bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-t-law-800">
                                        <Scale size={72} className="text-law-800 mb-6 mx-auto drop-shadow-md"/>
                                        <h1 className="text-4xl md:text-5xl font-serif font-black mb-6 text-slate-800">Hola, {user?.nombre || user?.displayName || 'Investigador'}</h1>
                                        <p className="text-lg text-slate-600 leading-relaxed mb-10 font-medium">
                                            A continuación iniciarás un recorrido inmersivo sobre la <strong>Pedagogía del Descargo</strong> aplicada al derecho laboral colombiano. Agradecemos tu rigor y honestidad en las respuestas.
                                        </p>
                                        <Button variant="primary" onClick={()=>setView('theory')} className="text-xl px-10 py-4 mx-auto w-full md:w-auto shadow-xl">
                                            Iniciar Trayecto Académico <ChevronRight size={24} className="ml-2"/>
                                        </Button>
                                    </div>
                                </div>
                            }
                            {view==='theory'&&<TheoryView/>}
                            {view==='evaluation'&&<EvaluationView/>}
                            {view==='results'&&<ResultsView/>}
                            {view==='dashboard'&&<AdminDashboardView/>}
                        </div>

                        {/* WhatsApp Floating Button */}
                        <a href="https://wa.me/573168648343?text=Hola,%20vengo%20de%20la%20plataforma%20LunaAcademy%20y%20me%20gustar%C3%ADa%20hacer%20una%20consulta%20sobre%20la%20Pedagog%C3%ADa%20del%20Descargo." target="_blank" rel="noopener noreferrer" className="float-wpp" title="Contacto por WhatsApp">
                            <Phone size={28} />
                        </a>

                        {/* Global Footer */}
                        {view !== 'login' && <Footer />}
                        
                    </div>
                </AppContext.Provider>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
