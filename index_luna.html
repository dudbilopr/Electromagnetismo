    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Scale, BrainCircuit, ShieldAlert, CheckCircle, XCircle, HelpCircle, Lock, LayoutDashboard, ChevronRight, AlertTriangle, TrendingUp, Activity, Copy, Star, Users, Briefcase, FileSignature, Info, User, Clock, BookOpen, Award, Link as LinkIcon, GraduationCap, Database, Brain, MessageCircle, MessageSquare, Sun, Moon, PlusCircle, Save, List, Zap } from 'lucide-react';
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, BarChart, Bar, ScatterChart, Scatter, ResponsiveContainer, Cell, PieChart, Pie } from 'recharts';
        
        // --- FIREBASE INIT ---
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, writeBatch, doc, getDocs, setDoc } from 'firebase/firestore';

        const app = initializeApp({
            apiKey: "AIzaSyDAhJNYS_XTcmKE9fZzVEX9_o0cJ1-dnUk", authDomain: "lunaexplica-60035.firebaseapp.com",
            databaseURL: "https://lunaexplica-60035-default-rtdb.firebaseio.com", projectId: "lunaexplica-60035",
            storageBucket: "lunaexplica-60035.firebasestorage.app", messagingSenderId: "550469014323",
            appId: "1:550469014323:web:be79e10f33abc619432446", measurementId: "G-583N74HNVW"
        });
        const auth = getAuth(app); const db = getFirestore(app);
        
        // RUTAS SEGURAS LUNA ACADEMY
        const APP_ID = 'lunaacademy-procesos-disciplinarios-v1'; 
        const [COLLECTION_PATH, DOUBTS_PATH, SURVEYS_PATH, QUESTIONS_PATH, USERS_PATH] = [
            `artifacts/${APP_ID}/public/data/chat_telemetry`, `artifacts/${APP_ID}/public/data/chat_doubts`, 
            `artifacts/${APP_ID}/public/data/reviews`, `artifacts/${APP_ID}/public/data/question_bank`, `artifacts/${APP_ID}/public/data/directory`
        ];

        // --- BANCO DE PREGUNTAS (Enriquecido con PDFs de Colombia) ---
        const QUESTION_BANK = [
            { id: "q1_concepto", theme: "Conceptos Básicos", type: "adaptive_radio", level: 1, difficulty: 0.3, expectedTime: 45, title: "¿Qué es un proceso disciplinario?", context: "En el entorno laboral, las empresas tienen la facultad de sancionar a sus empleados, pero no de manera arbitraria.", question: "Define correctamente la naturaleza jurídica de un proceso disciplinario laboral:", options: [ { id: "A", text: "Es un castigo automático que el empleador aplica inmediatamente al notar una falla.", isCorrect: false, feedback: "Incorrecto. Los castigos automáticos violan el derecho a la defensa." }, { id: "B", text: "Es un procedimiento estructurado para investigar presuntas faltas y sancionarlas, garantizando siempre el debido proceso.", isCorrect: true, feedback: "¡Correcto! Es un mecanismo que equilibra el poder de subordinación con los derechos del empleado." }, { id: "C", text: "Es una etapa obligatoria antes de negociar la renuncia de un empleado.", isCorrect: false, feedback: "Incorrecto. Su fin no es coaccionar la renuncia." } ], tip: "La clave está en los derechos constitucionales. Nadie puede ser juzgado sin ser escuchado." },
            { id: "q11_cloze_acoso", theme: "Conceptos Básicos", type: "cloze_text", level: 2, difficulty: 0.45, expectedTime: 60, title: "Ius Variandi vs Acoso Laboral", context: "Es esencial distinguir entre las acciones legítimas del empleador y las prácticas prohibidas por la ley.", question: "Completa el siguiente párrafo conceptual seleccionando los términos legales correctos:", codeTemplate: "La facultad del empleador de modificar las condiciones de trabajo se denomina [HUECO_1]. Sin embargo, si un superior ejerce conductas reiteradas orientadas a infundir miedo o inducir la renuncia, esto se clasifica como [HUECO_2], regulado en Colombia por la Ley [HUECO_3].", blanks: [ { id: "HUECO_1", answer: "Ius Variandi", options: ["Debido Proceso", "Ius Variandi", "Presunción de Inocencia"] }, { id: "HUECO_2", answer: "Acoso Laboral", options: ["Sanción Disciplinaria", "Despido Justo", "Acoso Laboral"] }, { id: "HUECO_3", answer: "1010 de 2006", options: ["100 de 1993", "1010 de 2006", "789 de 2002"] } ], tip: "El 'Ius Variandi' es el derecho a variar condiciones. El acoso busca dañar o infundir miedo." },
            { id: "q2_fundamentos", theme: "Normatividad", type: "adaptive_radio", level: 3, difficulty: 0.4, expectedTime: 50, title: "Fundamentos del Proceso", context: "Un supervisor decide suspender a un empleado porque 'le cae mal' y sospecha que no está trabajando bien.", question: "¿Cuáles son los únicos fundamentos válidos en los que se basa un empleador para iniciar un proceso disciplinario?", options: [ { id: "A", text: "Las sospechas del supervisor directo y el clima laboral.", isCorrect: false, feedback: "La subjetividad no es un fundamento jurídico válido." }, { id: "B", text: "Las reglas establecidas exclusivamente en el contrato verbal.", isCorrect: false, feedback: "Incompleto. Se requieren documentos formales que tipifiquen las faltas." }, { id: "C", text: "El Código Sustantivo del Trabajo, el Contrato de Trabajo y el Reglamento Interno de Trabajo.", isCorrect: true, feedback: "¡Exacto! El principio de legalidad exige que las faltas estén previamente escritas." } ], tip: "Principio de Legalidad: No hay sanción sin ley o reglamento previo." },
            { id: "q12_ia_disciplinario", theme: "Jurisprudencia (Nueva)", type: "adaptive_radio", level: 4, difficulty: 0.65, expectedTime: 65, title: "Inteligencia Artificial en el Proceso (Sentencia T-323/24)", context: "Un jefe de RRHH utiliza ChatGPT para redactar y decidir completamente el fallo disciplinario de un empleado, sin leer el expediente, firmando el documento generado por la IA.", question: "De acuerdo con la Sentencia T-323 de 2024, ¿es válido este proceder?", options: [ { id: "A", text: "Sí, la IA es una herramienta técnica válida que agiliza la administración de justicia disciplinaria.", isCorrect: false, feedback: "Incorrecto. Aunque agiliza, no puede reemplazar el juicio humano autónomo." }, { id: "B", text: "No, la IA puede usarse como herramienta de corrección y síntesis, pero existe un alto riesgo si no se verifica. No puede reemplazar al funcionario encargado de resolver de fondo.", isCorrect: true, feedback: "¡Preciso! La autoridad tiene un estándar alto de verificación sobre los datos de la máquina." }, { id: "C", text: "No, el uso de tecnología e internet está prohibido en la redacción de fallos sancionatorios.", isCorrect: false, feedback: "Falso. La tecnología es permitida, lo prohibido es la delegación total de la decisión a la máquina sin verificación." } ], tip: "La máquina asiste, pero el humano juzga y asume la responsabilidad." },
            { id: "q3_secuencia", theme: "Procedimiento (Ley 1952)", type: "sequence_sorter", level: 5, difficulty: 0.6, expectedTime: 90, title: "Análisis del Proceso (Pasos)", context: "Teniendo en cuenta la separación de roles (Instrucción y Juzgamiento), organiza las etapas procesales.", question: "Arrastra y ordena cronológicamente los pasos obligatorios para ejecutar un proceso disciplinario legal.", items: [ { id: "s1", content: "Recepción de queja e Indagación Previa." }, { id: "s2", content: "Apertura de Investigación Disciplinaria y pliego de cargos." }, { id: "s3", content: "Diligencia de descargos (Defensa del trabajador)." }, { id: "s4", content: "Evaluación objetiva (Juzgamiento)." }, { id: "s5", content: "Fallo y procedencia de recursos (Apelación)." } ], tip: "Primero te enteras (Indagación), luego acusas formalmente, luego escuchas, luego juzgas, y al final fallas." },
            { id: "q7_corte_constitucional", theme: "Jurisprudencia", type: "adaptive_radio", level: 6, difficulty: 0.75, expectedTime: 75, title: "El Debido Proceso (Sentencia C-593/14)", context: "Un gerente sorprende a un operario durmiendo. Redacta un memorando inmediato que dice: 'Queda usted suspendido por 8 días por falta grave. Firme el recibido'.", question: "Según la Corte Constitucional de Colombia, ¿cuál es el error insubsanable de este actuar?", options: [ { id: "A", text: "La suspensión máxima permitida por ley para la primera vez es de 5 días, no de 8.", isCorrect: false, feedback: "La ley permite hasta 8 días la primera vez. El error es de forma procedimental." }, { id: "B", text: "Impuso la sanción 'de plano', omitiendo el derecho de defensa y la citación a descargos.", isCorrect: true, feedback: "¡Excelente! Prohibidas las sanciones automáticas o 'de plano'." }, { id: "C", text: "El memorando no fue avalado por el Ministerio del Trabajo.", isCorrect: false, feedback: "El Ministerio no avala sanciones disciplinarias rutinarias." } ], tip: "Por más evidente que sea la falta (flagrancia), el derecho a defenderse es irrenunciable." },
            { id: "q4_sanciones", theme: "Sanciones (Art 112 CST)", type: "image_hotspot", level: 7, difficulty: 0.7, expectedTime: 70, title: "Auditoría de Sanciones", imageUrl: "https://images.unsplash.com/photo-1555374018-1c4fa4782202?auto=format&fit=crop&q=80&w=800", context: "Revisando el Reglamento Interno de una empresa, encuentras la tabla de sanciones.", question: "Haz clic en la sanción que es ILEGAL según el Art. 112 del Código Sustantivo del Trabajo.", hotspots: [ { id: "h1", x: 25, y: 35, isCorrect: false, text: "Llamado de atención verbal con copia a la hoja de vida." }, { id: "h2", x: 65, y: 70, isCorrect: true, text: "Suspensión del contrato por 45 días en la primera llegada tarde." }, { id: "h3", x: 75, y: 15, isCorrect: false, text: "Multa equivalente a la 5ta parte de un día por retraso." } ], tip: "Las leyes laborales prohíben suspensiones mayores a 8 días por la primera vez." },
            { id: "q6_terminacion", theme: "Sanciones Extremas", type: "adaptive_radio", level: 8, difficulty: 0.8, expectedTime: 60, title: "El Límite: Terminación del Contrato", context: "María cree que la empresa debe hacerle 3 memorandos escritos antes de poder despedirla.", question: "¿Después de cuántos procesos disciplinarios el empleador puede terminar el contrato (Art 62. CST)?", options: [ { id: "A", text: "Obligatoriamente después de 3 llamados de atención documentados.", isCorrect: false, feedback: "Mito común. La ley no exige un número exacto de faltas previas." }, { id: "B", text: "Depende de la gravedad: Una sola falta calificada convencionalmente como 'grave' puede ser suficiente.", isCorrect: true, feedback: "¡Correcto! No es un tema de cantidad, sino de magnitud de la falta." }, { id: "C", text: "Solo cuando un juez laboral lo autorice expresamente.", isCorrect: false, feedback: "El empleador tiene potestad de despedir si prueba justa causa." } ], tip: "Hurtar o agredir en la empresa es una falta gravísima que no requiere 'avisos previos'." }
        ];

        const App = () => {
            const [user, setUser] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(true); 
            const [view, setView] = useState('loading'); 
            const [studentInfo, setStudentInfo] = useState({ name: '', email: '', role: '', experience: '', bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false });
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [logs, setLogs] = useState([]);
            const [registeredUsers, setRegisteredUsers] = useState([]); 
            const [dbQuestions, setDbQuestions] = useState([]); 
            const [forumDoubts, setForumDoubts] = useState([]); 
            const [authError, setAuthError] = useState(null);
            const [sessionData, setSessionData] = useState({ startTime: null, currentQStartTime: null, tipsUsed: 0, answers: [] });
            const [feedback, setFeedback] = useState(null);
            const [markedQuestions, setMarkedQuestions] = useState([]); 
            const [userDoubt, setUserDoubt] = useState("");
            const [doubtSubmitted, setDoubtSubmitted] = useState(false);
            const [surveyData, setSurveyData] = useState({ clarity: 0, relevance: 0, difficultyLevel: 0, uxui: 0, comments: '', submitted: false });
            const [adminAuth, setAdminAuth] = useState({ isChecking: false, password: '', error: '' });
            const [adminTab, setAdminTab] = useState('dashboard');

            const activeQuestionBank = dbQuestions.length > 0 ? dbQuestions : QUESTION_BANK;
            const currentQ = activeQuestionBank[currentQIndex];

            const isMasterAdmin = () => {
                const storedEmail = (studentInfo?.email || "").toLowerCase().trim();
                const authEmail = (auth.currentUser?.email || "").toLowerCase().trim();
                return storedEmail === 'dudbilopr@gmail.com' || authEmail === 'dudbilopr@gmail.com';
            };

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); } 
                else { document.documentElement.classList.remove('dark'); document.body.classList.remove('dark'); }
            }, [isDarkMode]);

            // INIT AUTH
            useEffect(() => {
                const savedProfile = localStorage.getItem('lunaAcademy_userProfile');
                if (savedProfile) { setStudentInfo(JSON.parse(savedProfile)); }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth).catch(()=>{}); }
                        } else { await signInAnonymously(auth).catch(()=>{}); }
                    } catch (err) {}
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (savedProfile) {
                        setUser(u || { uid: 'local_user' });
                        if (JSON.parse(savedProfile).role || JSON.parse(savedProfile).learningGoal) setView('intro');
                        else setView('profile');
                    } else {
                        setUser(u || { uid: 'guest_user' }); setView('login');
                    }
                });
                return () => unsubscribe();
            }, []);

            // DATA FETCHING (Protegido por Autenticación)
            useEffect(() => {
                if (!user) return; // Guardia anti-errores de permisos
                const unsubLogs = onSnapshot(collection(db, COLLECTION_PATH), snap => setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                const unsubDoubts = onSnapshot(collection(db, DOUBTS_PATH), snap => setForumDoubts(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                const unsubUsers = onSnapshot(collection(db, USERS_PATH), snap => setRegisteredUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
                const fetchQuestions = async () => { try { const snap = await getDocs(collection(db, QUESTIONS_PATH)); if (!snap.empty) setDbQuestions(snap.docs.map(doc => doc.data())); } catch(e) {} };
                fetchQuestions();
                return () => { unsubLogs(); unsubDoubts(); unsubUsers(); };
            }, [user]); 

            useEffect(() => { setDoubtSubmitted(false); setUserDoubt(""); }, [currentQIndex]);

            // --- HANDLERS CENTRALIZADOS ---
            const handleManualLogin = () => { localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo)); setView('profile'); };
            const handleGoogleLogin = async () => {
                setAuthError(null);
                try {
                    const result = await signInWithPopup(auth, new GoogleAuthProvider());
                    const newInfo = { ...studentInfo, name: result.user.displayName, email: result.user.email };
                    setStudentInfo(newInfo); localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(newInfo)); setUser(result.user); setView('profile');
                } catch (error) {
                    if (error.code === 'auth/unauthorized-domain') setAuthError(`DOMINIO NO AUTORIZADO: Añádelo en Firebase Console.`);
                    else if (error.code !== 'auth/popup-closed-by-user') setAuthError(`Error: ${error.message}. Usa registro manual.`);
                }
            };

            const saveProfile = async () => {
                localStorage.setItem('lunaAcademy_userProfile', JSON.stringify(studentInfo));
                if (user && user.uid) {
                    try { await setDoc(doc(db, USERS_PATH, user.uid), { ...studentInfo, email: studentInfo.email, lastAccess: serverTimestamp() }, { merge: true }); } catch(e) {}
                }
                setView('intro'); 
            };

            const attemptAdminAccess = () => { if (isMasterAdmin()) { setView('dashboard'); setAdminTab('dashboard'); } else { setAdminAuth({ isChecking: true, password: '', error: '' }); } };
            const handleAdminLogin = () => {
                if(adminAuth.password === 'admin123') { setView('dashboard'); setAdminTab('dashboard'); setAdminAuth({isChecking: false, password: '', error: ''}); } 
                else { setAdminAuth({...adminAuth, error: 'Contraseña incorrecta. Acceso denegado.'}); }
            };

            const submitSurvey = async () => {
                try { await addDoc(collection(db, SURVEYS_PATH), { ...surveyData, studentName: studentInfo.name, studentRole: studentInfo.role, score: score, timestamp: serverTimestamp() }); } catch (e) {}
                setSurveyData({...surveyData, submitted: true});
            };

            const handleDoubtSubmit = async () => {
                if(!userDoubt.trim()) return;
                try { await addDoc(collection(db, DOUBTS_PATH), { qId: currentQ.id, theme: currentQ.theme, title: currentQ.title, doubt: userDoubt, timestamp: serverTimestamp() }); } catch(e) {}
                setDoubtSubmitted(true); setUserDoubt("");
            };

            const markForLater = () => {
                if (!markedQuestions.includes(currentQ.id)) setMarkedQuestions([...markedQuestions, currentQ.id]);
                const answeredIds = sessionData.answers.map(a => a.qId);
                const unasked = activeQuestionBank.findIndex((q, i) => !answeredIds.includes(q.id) && i !== currentQIndex);
                if(unasked !== -1) { setCurrentQIndex(unasked); setFeedback(null); setSessionData(prev => ({...prev, currentQStartTime: Date.now()})); } 
                else { alert("No hay más preguntas nuevas. Resuelve la actual o finaliza."); }
            };

            const submitAnswer = async (isCorrect, usedTip = false) => {
                const timeSpent = Math.floor((Date.now() - sessionData.currentQStartTime) / 1000);
                const t_e = currentQ.expectedTime;
                const frustration = Math.max(0, (timeSpent - t_e) / t_e) + (usedTip ? 0.5 : 0);
                const finalPoints = Math.max(0, isCorrect ? (100 * currentQ.difficulty) - (usedTip ? 15 : 0) : 0);

                let neuroState = "Normal";
                if(timeSpent < (t_e * 0.3) && !isCorrect) neuroState = "Impulsividad";
                else if (timeSpent > (t_e * 1.5) && isCorrect) neuroState = "Duda / Hesitación";
                else if (timeSpent > (t_e * 1.5) && !isCorrect) neuroState = "Sobrecarga Cognitiva";
                else if (timeSpent <= t_e && isCorrect) neuroState = "Estado de Flujo";

                const answerData = { qId: currentQ.id, title: currentQ.title, isCorrect, timeSpent, points: finalPoints, difficulty: currentQ.difficulty, neuroState };
                const logEntry = { studentName: studentInfo.name || 'Anónimo', studentRole: studentInfo.role || 'Libre', studentEmail: studentInfo.email || 'N/A', questionId: currentQ.id, theme: currentQ.theme || "General", isCorrect, timeSpent, expectedTime: t_e, usedTip, frustrationIndex: frustration, neuroState, points: finalPoints, timestamp: serverTimestamp() };

                try { await addDoc(collection(db, COLLECTION_PATH), logEntry); } catch (e) {}

                const alreadyAnswered = sessionData.answers.some(a => a.qId === currentQ.id);
                if (!alreadyAnswered) {
                    setScore(prev => prev + finalPoints);
                    setSessionData(prev => ({ ...prev, tipsUsed: prev.tipsUsed + (usedTip ? 1 : 0), answers: [...prev.answers, answerData] }));
                }

                if (markedQuestions.includes(currentQ.id)) setMarkedQuestions(markedQuestions.filter(id => id !== currentQ.id));
                setFeedback({ isCorrect, timeSpent, expectedTime: t_e, neuroState });

                setTimeout(() => {
                    setFeedback(null);
                    const answeredIds = [...sessionData.answers.map(a => a.qId)];
                    if(!alreadyAnswered) answeredIds.push(currentQ.id);
                    const unasked = activeQuestionBank.map((q, i) => ({q, i})).filter(item => !answeredIds.includes(item.q.id));

                    if (unasked.length > 0) {
                        let targetDiff = currentQ.difficulty + (isCorrect ? 0.15 : -0.15);
                        unasked.sort(() => Math.random() - 0.5).sort((a, b) => Math.abs(a.q.difficulty - targetDiff) - Math.abs(b.q.difficulty - targetDiff));
                        setCurrentQIndex(unasked[0].i); setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                    } else { 
                        const markedAndUnanswered = markedQuestions.filter(id => !answeredIds.includes(id));
                        if(markedAndUnanswered.length > 0) {
                            setCurrentQIndex(activeQuestionBank.findIndex(q => q.id === markedAndUnanswered[0]));
                            setSessionData(prev => ({...prev, currentQStartTime: Date.now()}));
                        } else { setView('results'); }
                    }
                }, 3500); 
            };

            const logout = () => { localStorage.removeItem('lunaAcademy_userProfile'); setStudentInfo({ name: '', email: '', role: '', experience: '', bio: '', academicLink: '', socialLink: '', specialty: '', university: '', learningGoal: false }); auth.signOut(); setView('login'); };

            // --- SUB-COMPONENTES DE UI ---
            const AssessmentNavBar = () => (
                <div className="flex items-center space-x-3 mb-6 overflow-x-auto pb-3 scrollbar-hide">
                    {activeQuestionBank.map((q, idx) => {
                        const isAnswered = sessionData.answers.some(a => a.qId === q.id);
                        const isMarked = markedQuestions.includes(q.id);
                        let bg = "bg-gray-100 dark:bg-slate-800 text-gray-500 dark:text-slate-400 border-gray-200 dark:border-slate-700 hover:bg-gray-200 dark:hover:bg-slate-700";
                        if (isAnswered) bg = "bg-emerald-500 text-white border-emerald-600 dark:border-emerald-400 shadow-md";

                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Estados Mentales</h3>
                                        <div className="h-64 flex justify-center relative">
                                            <ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={neuroData} cx="50%" cy="50%" innerRadius={60} outerRadius={85} paddingAngle={5} dataKey="value" stroke="none">{neuroData.map((e, i) => <Cell key={i} fill={hasNeuroData ? ['#ef4444', '#f59e0b', '#8b5cf6', '#10b981'][i%4] : (isDarkMode?'#334155':'#cbd5e1')} />)}</Pie>{hasNeuroData && <Tooltip contentStyle={{backgroundColor: isDarkMode?'#1e293b':'#fff', border:'none', borderRadius:'8px'}} />}{hasNeuroData && <Legend verticalAlign="bottom" height={36} iconType="circle" />}</PieChart></ResponsiveContainer>
                                            {!hasNeuroData && <div className="absolute inset-0 flex items-center justify-center text-sm font-bold text-gray-400 dark:text-slate-500 bg-white/50 dark:bg-slate-800/50 rounded-full">Esperando...</div>}
                                        </div>
                                    </div>
                                    <div className="glass-panel p-8 rounded-3xl col-span-2 bg-white dark:bg-slate-800/40 border border-gray-200 dark:border-slate-700 shadow-sm">
                                        <h3 className="text-xl font-bold mb-6 text-gray-900 dark:text-white">Dificultad (IRT)</h3>
                                        <div className="h-64"><ResponsiveContainer width="100%" height="100%"><BarChart data={itemMetrics} layout="vertical" margin={{ left: 20 }}><CartesianGrid strokeDasharray="3 3" stroke={isDarkMode?'#334155':'#e2e8f0'} horizontal={false}/><XAxis type="number" domain={[0, 1]} stroke={isDarkMode?'#94a3b8':'#64748b'} axisLine={false} tickLine={false}/><YAxis dataKey="title" type="category" stroke={isDarkMode?'#94a3b8':'#64748b'} fontSize={10} width={120} axisLine={false} tickLine={false}/><Tooltip contentStyle={{backgroundColor: isDarkMode?'#1e293b':'#fff', borderRadius:'8px'}}/><Bar dataKey="p" fill="#3b82f6" radius={[0, 6, 6, 0]} barSize={20}/></BarChart></ResponsiveContainer></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminTab === 'builder' && (
                            <div className="glass-panel p-8 sm:p-12 rounded-3xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-xl animate-fade-in">
                                <h2 className="text-3xl font-bold text-gray-900 dark:text-white mb-8 flex items-center"><Database className="w-8 h-8 mr-3 text-indigo-500"/> Banco de Preguntas Actualizado</h2>
                                <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                                    {activeQuestionBank.map((q, idx) => (
                                        <div key={idx} className="bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm flex justify-between items-center gap-4">
                                            <div>
                                                <div className="flex space-x-3 mb-2"><span className="bg-brand-100 text-brand-800 dark:bg-brand-900/50 dark:text-brand-300 text-xs font-bold px-2 py-1 rounded">{q.theme}</span></div>
                                                <h4 className="text-lg font-bold text-gray-900 dark:text-white">{q.title}</h4>
                                            </div>
                                            <div className="text-right text-sm font-bold text-gray-700 dark:text-slate-300">Dificultad: <span className="text-brand-600 dark:text-brand-400">{q.difficulty}</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const getStudyRecommendation = () => {
                const totalPoints = activeQuestionBank.reduce((acc, q) => acc + (100 * q.difficulty), 0);
                const pct = totalPoints > 0 ? (score / totalPoints) * 100 : 0;
                if (pct >= 85) return { text: "Excelente criterio jurídico.", class: "text-emerald-600 dark:text-emerald-400" };
                if (pct >= 60) return { text: "Buen desempeño, pero repasa la jurisprudencia.", class: "text-yellow-600 dark:text-yellow-400" };
                return { text: "Necesitas profundizar en el debido proceso (Ley 1952).", class: "text-red-600 dark:text-red-400" };
            };

            // RENDERIZADO MAESTRO DE LA APLICACIÓN
            return (
                <div className="flex flex-col min-h-screen">
                    <div className="flex-1 p-4 sm:p-8 font-sans">
                        {view !== 'dashboard' && view !== 'login' && view !== 'profile' && (
                            <div className="max-w-5xl mx-auto flex justify-between items-center mb-8 bg-white/80 dark:bg-slate-800/50 p-4 rounded-2xl border border-gray-200 dark:border-slate-700/50 shadow-sm">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('intro')}><Scale className="w-8 h-8 text-blue-600 dark:text-blue-500" /><span className="text-xl sm:text-2xl font-bold font-serif text-gray-900 dark:text-white">Luna<span className="text-blue-600 dark:text-blue-500">Academy</span></span></div>
                                <div className="flex items-center space-x-2 sm:space-x-4">
                                    {isMasterAdmin() && <span className="hidden sm:flex items-center text-xs font-bold text-yellow-600 dark:text-yellow-400 bg-yellow-100 dark:bg-yellow-900/30 px-3 py-1.5 rounded-full"><Crown className="w-4 h-4 mr-1"/> Admin Maestro</span>}
                                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-gray-500 dark:text-yellow-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full">{isDarkMode ? <Sun className="w-5 h-5"/> : <Moon className="w-5 h-5"/>}</button>
                                    <button onClick={() => setView('profile')} className="text-gray-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-white flex items-center bg-gray-100 dark:bg-slate-700/50 px-4 py-2 rounded-full font-semibold"><User className="w-4 h-4 mr-2" /> {studentInfo.name.split(' ')[0]}</button>
                                    <button onClick={attemptAdminAccess} className="text-gray-500 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-blue-400 bg-gray-100 dark:bg-slate-800 p-2 rounded-full"><LayoutDashboard className="w-5 h-5" /></button>
                                </div>
                            </div>
                        )}

                        <div className="max-w-4xl mx-auto">
                            {adminAuth.isChecking && (
                                <div className="fixed inset-0 bg-slate-900/90 backdrop-blur z-50 flex items-center justify-center">
                                    <div className="bg-slate-800 p-8 rounded-2xl border border-slate-600 max-w-sm w-full shadow-2xl">
                                        <h3 className="text-2xl font-bold text-white mb-4 flex items-center"><Lock className="w-6 h-6 mr-2 text-indigo-400"/> Portal Seguro</h3>
                                        <input type="password" value={adminAuth.password} onChange={e=>setAdminAuth({...adminAuth, password: e.target.value})} placeholder="Contraseña..." className="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white outline-none focus:border-indigo-500 mb-2"/>
                                        {adminAuth.error && <p className="text-red-400 text-xs mb-4">{adminAuth.error}</p>}
                                        <div className="flex justify-end space-x-3 mt-6"><button onClick={()=>setAdminAuth({isChecking:false, password:'', error:''})} className="px-4 py-2 text-slate-400 hover:text-white">Cancelar</button><button onClick={handleAdminLogin} className="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-lg">Autorizar</button></div>
                                    </div>
                                </div>
                            )}

                            {view === 'login' && (
                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in border-t-4 border-t-blue-500 max-w-md mx-auto mt-10 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                    <Scale className="w-16 h-16 text-blue-600 dark:text-blue-500 mx-auto mb-6" /><h1 className="text-3xl font-bold text-center mb-2 font-serif text-gray-900 dark:text-white">LunaAcademy</h1><p className="text-center text-gray-500 dark:text-slate-400 mb-8 font-medium">Plataforma de capacitación jurídica laboral</p>
                                    <button onClick={handleGoogleLogin} className="w-full mb-6 py-3 bg-white dark:bg-slate-100 border border-gray-200 text-slate-900 font-bold rounded-xl flex justify-center items-center shadow-md hover:bg-gray-50 transition-transform transform hover:scale-105"> Ingresar con Google </button>
                                    <div className="space-y-4"><input type="email" value={studentInfo.email} onChange={e => setStudentInfo({...studentInfo, email: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800/50 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white font-medium" placeholder="Correo electrónico" /><button onClick={handleManualLogin} disabled={!studentInfo.email} className="w-full py-4 bg-blue-600 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg">Continuar al Perfil</button></div>
                                </div>
                            )}

                            {view === 'profile' && (
                                <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl animate-fade-in max-w-3xl mx-auto mt-6 border-t-4 border-t-indigo-500 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                    <div className="flex items-center justify-center mb-6"><User className="w-10 h-10 text-indigo-600 dark:text-indigo-500 mr-3" /><h2 className="text-3xl font-bold text-gray-900 dark:text-white">Tu Perfil</h2></div>
                                    <div className="space-y-6">
                                        <input type="text" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-gray-900 dark:text-white outline-none font-medium" placeholder="Nombre completo" />
                                        <select value={studentInfo.role} onChange={e => setStudentInfo({...studentInfo, role: e.target.value})} className="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-gray-900 dark:text-white outline-none font-medium">
                                            <option value="" disabled>Selecciona tu rol...</option><option value="abogado">Abogado / Legal</option><option value="rrhh">Recursos Humanos</option><option value="empleado">Colaborador</option>
                                        </select>
                                        <button onClick={saveProfile} disabled={!studentInfo.role || !studentInfo.name} className="w-full py-4 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg flex justify-center items-center text-lg">Guardar y Continuar <ChevronRight className="w-6 h-6 ml-2" /></button>
                                    </div>
                                </div>
                            )}

                            {view === 'intro' && (
                                <div className="glass-panel rounded-3xl p-10 sm:p-16 text-center animate-fade-in shadow-2xl mt-6 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                                    <ShieldAlert className="w-20 h-20 text-blue-600 dark:text-blue-500 mx-auto mb-6" /><h1 className="text-4xl sm:text-5xl font-bold mb-4 font-serif text-gray-900 dark:text-white">Auditoría Disciplinaria</h1>
                                    <p className="text-gray-500 dark:text-slate-400 mb-10 max-w-3xl mx-auto leading-relaxed">Como perfil {studentInfo.role.toUpperCase()}, pondremos a prueba tu criterio sobre el debido proceso laboral basándonos en la Jurisprudencia Constitucional Colombiana.</p>
                                    <button onClick={() => { setView('assessment'); setSessionData({startTime: Date.now(), currentQStartTime: Date.now(), tipsUsed: 0, answers: []}); setScore(0); setCurrentQIndex(0); setMarkedQuestions([]); }} className="px-12 py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full font-bold shadow-[0_0_40px_rgba(59,130,246,0.5)] text-white text-xl transform hover:-translate-y-1 transition-transform">Iniciar Evaluación Legal</button>
                                </div>
                            )}

                            {view === 'assessment' && (
                                <div className="animate-fade-in max-w-3xl mx-auto">
                                    <AssessmentNavBar />
                                    <div className="glass-panel rounded-3xl p-8 sm:p-12 shadow-2xl border-t-4 border-t-blue-500 bg-white dark:bg-slate-800 border-x border-b border-gray-200 dark:border-slate-700">
                                        {renderCurrentInteraction()}
                                        {feedback && (
                                            <div className={`mt-10 p-6 rounded-2xl flex items-start space-x-4 border ${feedback.isCorrect ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-500/30' : 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-500/30'}`}>
                                                {feedback.isCorrect ? <CheckCircle className="w-10 h-10 text-emerald-600 dark:text-emerald-400 shrink-0" /> : <XCircle className="w-10 h-10 text-red-600 dark:text-red-400 shrink-0" />}
                                                <div className="flex-1">
                                                    <p className={`font-bold text-xl mb-2 ${feedback.isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>{feedback.isCorrect ? 'Fallo: Válido' : 'Fallo: Error de Proceso'}</p>
                                                    <p className="text-gray-800 dark:text-slate-200 text-sm mb-4 font-medium">{feedback.text}</p>
                                                </div>
                                            </div>
                                        )}
                                        <div className="mt-10 border-t border-gray-200 dark:border-slate-700 pt-6">
                                            <h4 className="text-sm font-bold text-gray-700 dark:text-slate-300 mb-3 flex items-center"><MessageSquare className="w-5 h-5 mr-2 text-yellow-500"/> Foro de Dudas (Anónimo)</h4>
                                            <div className="flex flex-col sm:flex-row gap-3"><textarea value={userDoubt} onChange={e=>setUserDoubt(e.target.value)} disabled={doubtSubmitted} className="w-full sm:flex-1 bg-gray-50 dark:bg-slate-900/80 border border-gray-300 dark:border-slate-700 rounded-xl p-4 text-sm text-gray-900 dark:text-white focus:border-indigo-500 outline-none resize-none h-24" placeholder="¿Algo no quedó claro? Deja tu inquietud..."/><button onClick={handleDoubtSubmit} disabled={!userDoubt.trim() || doubtSubmitted} className="px-6 py-3 bg-yellow-400 dark:bg-yellow-600/90 text-yellow-900 dark:text-slate-900 rounded-xl text-sm font-bold disabled:opacity-50 sm:h-24 shadow-md">{doubtSubmitted ? 'Registrado ✓' : 'Enviar Duda'}</button></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'results' && (
                                <div className="animate-fade-in max-w-4xl mx-auto space-y-8">
                                    <div className="glass-panel rounded-3xl p-10 text-center border-t-4 border-t-emerald-500 shadow-2xl bg-white dark:bg-slate-800">
                                        <CheckCircle className="w-24 h-24 text-emerald-500 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]" /><h1 className="text-4xl font-bold text-gray-900 dark:text-white mb-2 font-serif">Simulación Concluida</h1>
                                        <div className="bg-gray-50 dark:bg-slate-900/80 rounded-2xl p-8 border border-gray-200 dark:border-slate-700 shadow-inner mt-8">
                                            <div className="text-7xl font-black text-blue-600 dark:text-blue-400 mb-6 drop-shadow-sm">{score.toFixed(0)} <span className="text-2xl text-gray-400 font-normal">pts</span></div>
                                        </div>
                                    </div>
                                    <div className="glass-panel rounded-3xl p-8 border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 shadow-sm">
                                        <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-4 flex items-center"><GraduationCap className="w-7 h-7 mr-3 text-indigo-500"/> Diagnóstico y Plan de Estudio</h3>
                                        <p className={`text-lg font-bold mb-2 leading-relaxed ${getStudyRecommendation().class}`}>{getStudyRecommendation().text}</p>
                                    </div>

                                    {!surveyData.submitted ? (
                                        <div className="glass-panel rounded-3xl p-10 bg-white dark:bg-slate-800/60 border border-gray-200 dark:border-slate-600 shadow-xl">
                                            <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-8 text-center">Encuesta de Calidad Pedagógica (Matriz Likert)</h3>
                                            <div className="space-y-6 max-w-2xl mx-auto">
                                                {[{id:'clarity', title:'Claridad', desc:'¿El caso fue fácil de entender?'}, {id:'relevance', title:'Relevancia', desc:'¿Es aplicable en entorno real?'}, {id:'difficultyLevel', title:'Reto Cognitivo', desc:'¿Exigencia de la prueba?'}, {id:'uxui', title:'Experiencia UI/UX', desc:'¿Qué tan intuitiva fue la plataforma?'}].map(dim => (
                                                    <div key={dim.id} className="flex flex-col sm:flex-row sm:items-center justify-between bg-gray-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-gray-200 dark:border-slate-700">
                                                        <div className="mb-3 sm:mb-0"><div className="font-bold text-gray-900 dark:text-white text-lg">{dim.title}</div><div className="text-sm text-gray-500 dark:text-slate-400">{dim.desc}</div></div>
                                                        <div className="flex space-x-1">{[1,2,3,4,5].map(star => <button key={`${dim.id}-${star}`} onClick={() => setSurveyData({...surveyData, [dim.id]: star})} className={`p-1 transition-transform hover:scale-125 ${surveyData[dim.id] >= star ? 'text-yellow-400' : 'text-gray-300 dark:text-slate-600'}`}><Star className="w-8 h-8 fill-current" /></button>)}</div>
                                                    </div>
                                                ))}
                                                <button onClick={submitSurvey} disabled={!surveyData.clarity || !surveyData.relevance || !surveyData.difficultyLevel || !surveyData.uxui} className="w-full py-5 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-lg text-lg mt-4">Enviar Evaluación</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="glass-panel rounded-3xl p-12 text-center bg-emerald-50 dark:bg-slate-800/40 border border-emerald-200 dark:border-emerald-500/30 shadow-sm"><CheckCircle className="w-16 h-16 text-emerald-500 mx-auto mb-4"/><h3 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">¡Gracias por tu feedback!</h3></div>
                                    )}
                                    <div className="text-center pb-12 mt-8"><button onClick={() => window.location.reload()} className="px-12 py-5 bg-gray-800 dark:bg-slate-700 hover:bg-gray-900 dark:hover:bg-slate-600 rounded-full text-white font-bold shadow-xl transition-all transform hover:scale-105 text-lg">Cerrar Sesión y Reiniciar</button></div>
                                </div>
                            )}

                            {view === 'dashboard' && <DashboardView />}
                        </div>
                    </div>
                    {/* FOOTER MASTER DENTRO DEL APP PARA EVITAR ERROR DE BABEL FRAGMENT */}
                    <footer className="text-center text-gray-500 dark:text-slate-500 text-xs py-8 mt-auto border-t border-gray-200 dark:border-slate-800/50 bg-white dark:bg-slate-900/90 w-full transition-colors duration-500 z-50">
                        <p className="font-bold uppercase tracking-widest mb-2">© {new Date().getFullYear()} Todos los derechos reservados.</p>
                        <p className="text-sm font-medium">Un módulo de entrenamiento adaptativo impulsado por <strong className="text-brand-600 dark:text-brand-400 font-bold tracking-wider">LunaAcademy</strong>.</p>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
