        // --- 2. KATEX & THREE.JS HOOKS ---
        const useKaTeX = () => {
          useEffect(() => {
            if (!document.getElementById('katex-css')) {
              const link = document.createElement('link');
              link.id = 'katex-css'; link.rel = 'stylesheet';

        const useThreeJS = () => {
          const [loaded, setLoaded] = useState(false);
          useEffect(() => {
            if (window.THREE && window.THREE.OrbitControls) { setLoaded(true); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            script.onload = () => {
              const controls = document.createElement('script');
              controls.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
              controls.onload = () => setLoaded(true);
              document.head.appendChild(controls);
            };
            document.head.appendChild(script);
          }, []);
          return loaded;
        };

        // --- 3. COMPONENTS ---
        const Latex = ({ text, className = "", displayMode = false }) => {
          const containerRef = useRef(null);
          useEffect(() => {
            if (window.katex && containerRef.current && text) {
              try {
                if (displayMode) {
                   window.katex.render(text.toString(), containerRef.current, { displayMode: true, throwOnError: false });
                } else {
                  const html = text.toString()
                    .replace(/\$\$(.*?)\$\$/g, (m, eq) => window.katex.renderToString(eq, { displayMode: true, throwOnError: false }))
                    .replace(/\$(.*?)\$/g, (m, eq) => window.katex.renderToString(eq, { displayMode: false, throwOnError: false }));
                  containerRef.current.innerHTML = html;
                }
              } catch (e) { containerRef.current.innerText = text; }
            } else if (containerRef.current) {
                containerRef.current.innerText = text;
            }
          }, [text, displayMode]);
          
          if (displayMode) return <div ref={containerRef} className={`my-3 text-center overflow-x-auto custom-scrollbar ${className}`} />;
          return <span ref={containerRef} className={className} dangerouslySetInnerHTML={{__html: text}} />;
        };

        // 3D Ring Simulator for Q3
        const ThreeRingCanvas = () => {
          const mountRef = useRef(null);
          const isLoaded = useThreeJS();

          useEffect(() => {
            if (!isLoaded || !mountRef.current) return;
            const THREE = window.THREE;
            const width = mountRef.current.clientWidth;
            const height = mountRef.current.clientHeight;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#f8fafc'); 

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(5, 5, 8);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            mountRef.current.innerHTML = '';
            mountRef.current.appendChild(renderer.domElement);

            const controls = new window.THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Ring Geometry
            const ringGeo = new THREE.TorusGeometry(3, 0.15, 16, 100);
            const ringMat = new THREE.MeshPhysicalMaterial({ color: 0xd97706, roughness: 0.1, metalness: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.y = Math.PI / 2;
            scene.add(ring);

            // Point P
            const pointGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const pointMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
            const point = new THREE.Mesh(pointGeo, pointMat);
            point.position.set(4, 0, 0); // Axis Z (visually X here)
            scene.add(point);

            // Axis line
            const points = [];
            points.push(new THREE.Vector3(-2, 0, 0));
            points.push(new THREE.Vector3(6, 0, 0));
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineDashedMaterial({ color: 0x64748b, dashSize: 0.2, gapSize: 0.1 });
            const line = new THREE.Line(lineGeo, lineMat);
            line.computeLineDistances();
            scene.add(line);

            let animationId;
            const animate = () => {
              animationId = requestAnimationFrame(animate);
              controls.update();
              ring.rotation.z += 0.01;
              renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
              if(!mountRef.current) return;
              camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
            };
            window.addEventListener('resize', handleResize);

            return () => {
              cancelAnimationFrame(animationId);
              window.removeEventListener('resize', handleResize);
              renderer.dispose();
            };
          }, [isLoaded]);

          return (
            <div className="relative w-full aspect-square rounded-2xl overflow-hidden shadow-inner border-2 border-slate-200 cursor-move touch-none">
              <div ref={mountRef} className="w-full h-full" />
              <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-xl text-xs font-black text-slate-700 flex items-center gap-2 border border-slate-200 shadow-sm pointer-events-none uppercase tracking-widest">
                <Activity size={16} className="text-orange-500" />
                Simulador de Campo Vectorial 3D
              </div>
            </div>
          );
        };

        const InlineSelect = ({ id, value, onChange, options, points, width="w-auto", isSubmitted, expected }) => {

            document.addEventListener("mousedown", handleClickOutside);

          const isCorrect = value === expected;

              <div className="relative w-full">
                <button 
                  type="button" disabled={isSubmitted} onClick={() => setIsOpen(!isOpen)}
                  className={`w-full px-4 py-3 min-h-[46px] text-base font-bold border-2 ${bgClass} ${textClass} rounded-xl outline-none transition-all shadow-sm flex items-center justify-between cursor-pointer disabled:cursor-default`}

                  {!isSubmitted && <ChevronDown size={18} className={`text-slate-400 flex-shrink-0 transition-transform ml-2 ${isOpen ? 'rotate-180' : ''}`} />}
                </button>

                {isOpen && !isSubmitted && (

                    {options.map((o) => (

                        key={o.val} onClick={() => { onChange(id, o.val); setIsOpen(false); }}

        const MisionBox = ({ title, points, children }) => (

        // --- 5. SVG STATIC DIAGRAMS ---
        const SvgForceProblem = () => (
          <svg viewBox="-1.5 -1.5 4 3" className="w-full h-full max-h-[300px] drop-shadow-md overflow-visible bg-slate-50 rounded-xl border border-slate-200 p-4">
            {/* Grid & Axis */}
            <line x1="-1.5" y1="0" x2="2.5" y2="0" stroke="#cbd5e1" strokeWidth="0.02" markerEnd="url(#arrow-force)"/>
            <line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#cbd5e1" strokeWidth="0.02" markerEnd="url(#arrow-force)"/>
            <text x="2.3" y="-0.1" fontSize="0.15" fill="#64748b" fontWeight="bold">x (m)</text>

            {/* Charges */}

            <text x="-0.4" y="1.0" fontSize="0.15" fill="#64748b">y=1.0</text>
            
            <defs><marker id="arrow-force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
          </svg>
        );

        const SvgRingProblem = () => (
          <svg viewBox="-1 -2 5 4" className="w-full h-full max-h-[300px] drop-shadow-md overflow-visible bg-slate-50 rounded-xl border border-slate-200 p-4">
            {/* Axis */}
            <line x1="-1" y1="0" x2="4" y2="0" stroke="#94a3b8" strokeWidth="0.02" markerEnd="url(#arrow-ring)"/>
            <text x="3.5" y="-0.1" fontSize="0.2" fill="#64748b" fontWeight="bold">Eje x</text>
            {/* Ring */}
            <ellipse cx="0" cy="0" rx="0.4" ry="1.5" fill="none" stroke="#d97706" strokeWidth="0.08"/>
            <text x="-0.8" y="1.7" fontSize="0.2" fill="#d97706" fontWeight="bold">Anillo q = +2 nC</text>
            <line x1="0" y1="0" x2="0" y2="1.5" stroke="#334155" strokeWidth="0.03" strokeDasharray="0.1"/>
            <text x="0.1" y="0.8" fontSize="0.2" fill="#334155" fontWeight="bold">R = 4 cm</text>
            {/* Point P */}

            <line x1="0" y1="0" x2="2" y2="0" stroke="#334155" strokeWidth="0.04" strokeDasharray="0.1"/>
            <text x="1.0" y="-0.15" fontSize="0.2" textAnchor="middle" fill="#334155" fontWeight="bold">z = 3 cm</text>
            <defs><marker id="arrow-ring" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
          </svg>
        );

        // Histograma de Frecuencias (Data Science) ajustado a escala 5.0
        const ScoreHistogram = ({ attempts }) => {
            const bins = [0, 0, 0, 0]; // [0-1.5], [1.6-3.0], [3.1-4.0], [4.1-5.0]
            attempts.forEach(a => {
                if (a.score <= 1.5) bins[0]++;
                else if (a.score <= 3.0) bins[1]++;
                else if (a.score <= 4.0) bins[2]++;
                else bins[3]++;
            });
            const maxBin = Math.max(...bins, 1);

            return (
                <div className="flex items-end h-40 gap-4 mt-4">
                    {bins.map((val, idx) => {
                        const height = (val / maxBin) * 100;
                        const labels = ["0.0 - 1.5", "1.6 - 3.0", "3.1 - 4.0", "4.1 - 5.0"];
                        return (
                            <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                                <div className="absolute -top-8 bg-slate-800 text-white px-2 py-1 rounded text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity">{val} entregas</div>
                                <div className="w-full bg-orange-500 rounded-t-lg transition-all duration-1000 ease-out" style={{ height: `${height}%` }}></div>
                                <div className="mt-2 text-xs font-bold text-slate-500 text-center leading-tight">{labels[idx]}</div>
                            </div>
                        );
                    })}
                </div>
            )
        };

        // --- 6. MAIN APP COMPONENT ---
        function App() {
          useKaTeX();
          const [user, setUser] = useState(null);
          const [role, setRole] = useState(null); 
          const [view, setView] = useState('login'); 
          const [loading, setLoading] = useState(true);
          const [authError, setAuthError] = useState("");
          
          // Identity Profile State
          const [profile, setProfile] = useState({
              displayName: '', engineering: '', otherEngineering: '', institution: '',
              bio: '', photoUrl: '', academicLink1: ''
          });
          const [savingProfile, setSavingProfile] = useState(false);

          // Pagination State
          const [currentPage, setCurrentPage] = useState(1);
          const totalPages = 3;

          const [answers, setAnswers] = useState({});
          const [isSubmitted, setIsSubmitted] = useState(false);
          const [scoreData, setScoreData] = useState({ total: 0, details: {} });
          const [startTime, setStartTime] = useState(null);
          const [timeElapsed, setTimeElapsed] = useState(0);
          const [finalTime, setFinalTime] = useState(0);
          const [usedTips, setUsedTips] = useState([]);
          
          const [examConfig, setExamConfig] = useState(JSON.stringify({ 
              titulo: "Quiz Didáctico: Fuerza y Campo", 
              descripcion: "Conceptos Fundamentales, Ley de Coulomb y Campo de un Anillo.",
              puntajeMaximo: 5.0,
              tiempoEsperado: 1800 
          }, null, 2));
          const [configSaved, setConfigSaved] = useState(false);

          // Dashboard Real State & Real-time Views
          const [metrics, setMetrics] = useState({ views: 0, avgScore: 0, avgTime: 0, attempts: [], questionMetrics: [], frustrationIndex: 0, retention: 0 });
          const [realViews, setRealViews] = useState(0);
          
          // Reviews
          const [ratingStats, setRatingStats] = useState({ average: 0, count: 0 });
          const [survey, setSurvey] = useState({ platform: 0, graphics: 0, challenge: 0, comment: '' });
          const [hasRated, setHasRated] = useState(false);

          // Real-time Views & Reviews Listener
          useEffect(() => {
              if(!user) return; 
              
              const setupListeners = async () => {
                  try {
                      // Usamos la colección de directorio para leer vistas seguras sin faltar a las reglas de write
                      const dirRef = collection(db, 'artifacts', appId, 'public', 'data', 'directory');
                      onSnapshot(dirRef, (snap) => {
                          setRealViews(snap.size || 0);
                      }, (error) => console.log("Vistas:", error.message));
        
                      // Ruta corregida y segura para reviews
                      const reviewsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reviews'); 
                      onSnapshot(reviewsRef, (snap) => {
                          let sum = 0; let count = 0;
                          snap.forEach(doc => { 
                             const data = doc.data();
                             const avgReview = (data.platform + data.graphics + data.challenge) / 3;
                             if(!isNaN(avgReview)) { sum += avgReview; count++; }
                          });
                          if (count > 0) setRatingStats({ average: (sum/count).toFixed(1), count });
                      }, (error) => console.log("Reviews:", error.message));
                  } catch(e) { console.log(e); }
              };
              
              setupListeners();
          }, [user]);

          // Auth Handlers
          const handleGoogleLogin = async () => {
            setAuthError("");
            const provider = new GoogleAuthProvider();
            try {
              await signInWithPopup(auth, provider);
            } catch (error) {
              setAuthError("Error de autenticación con Google. Revisa consola.");
            }
          };

          const handleEmailLogin = async (e) => {
            e.preventDefault();
            setAuthError("");
            const email = e.target.email.value;
            const pass = e.target.password.value;
            try {
              await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
              if(error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                  try {
                      await createUserWithEmailAndPassword(auth, email, pass);
                  } catch (err2) {
                      setAuthError("Error al crear cuenta: " + err2.message);
                  }
              } else {
                  setAuthError("Credenciales incorrectas.");
              }

              <insignia.icon size={80} className={`mx-auto mb-8 drop-shadow-lg ${insignia.color}`} />
              <h2 className="text-4xl md:text-5xl font-black mb-4 uppercase tracking-tighter">Reporte de Misión</h2>
              <p className="text-slate-400 font-medium text-lg md:text-xl">Calificación procesada por el motor adaptativo neuronal.</p>

              <div className="my-16 flex flex-col md:flex-row items-center justify-center gap-12">
                <div className="relative w-64 h-64 flex items-center justify-center bg-slate-800 rounded-full shadow-[0_0_80px_rgba(234,88,12,0.3)] border-8 border-slate-700 shrink-0">
                  <div className="text-center">
                    <span className="text-7xl font-black bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400 drop-shadow-sm">{score}</span>
                    <span className="block text-base text-orange-400 mt-2 font-black tracking-widest">/ 5.0 PTS</span>
                  </div>
                </div>
                
                <div className="text-left bg-slate-800/50 p-8 rounded-3xl border border-slate-700 flex-grow w-full max-w-md">
                    <h3 className="font-black text-2xl mb-2 flex items-center gap-2 text-white"><Award size={24} className={insignia.color}/> Rango Obtenido:</h3>
                    <p className={`text-xl font-bold mb-6 ${insignia.color}`}>{insignia.title}</p>
                    
                    <div className="space-y-4">
                        <div>
                            <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-1"><span>Hoja 1: Conceptos Teóricos</span> <span>{Math.round((scoreData.details.s1 / 2.0)*100)}%</span></div>
                            <div className="w-full bg-slate-700 rounded-full h-2"><div className={`bg-emerald-500 h-2 rounded-full progress-bar-fill`} style={{width: `${(scoreData.details.s1 / 2.0)*100}%`}}></div></div>
                        </div>
                        <div>
                            <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-1"><span>Hoja 2: Fuerza Neta (2D)</span> <span>{Math.round((scoreData.details.s2 / 1.5)*100)}%</span></div>
                            <div className="w-full bg-slate-700 rounded-full h-2"><div className={`bg-blue-500 h-2 rounded-full progress-bar-fill`} style={{width: `${(scoreData.details.s2 / 1.5)*100}%`}}></div></div>
                        </div>
                        <div>
                            <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-1"><span>Hoja 3: Campo Eléctrico Anillo</span> <span>{Math.round((scoreData.details.s3 / 1.5)*100)}%</span></div>
                            <div className="w-full bg-slate-700 rounded-full h-2"><div className={`bg-violet-500 h-2 rounded-full progress-bar-fill`} style={{width: `${(scoreData.details.s3 / 1.5)*100}%`}}></div></div>
                        </div>
                    </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                  {/* Pedagogical Feedback */}
                  <div className={`p-8 rounded-3xl border-2 ${score >= 4.0 ? 'bg-emerald-900/40 border-emerald-500/50 text-emerald-100' : score >= 3.0 ? 'bg-blue-900/40 border-blue-500/50 text-blue-100' : 'bg-red-900/40 border-red-500/50 text-red-100'}`}>
                    <h3 className="font-black text-2xl mb-4 flex items-center gap-3">
                      <BrainCircuit size={28}/> Análisis Cognitivo
                    </h3>
                    <p className="leading-relaxed text-lg font-medium mb-4">
                      {score >= 4.0 ? "¡Excelente! Tu dominio teórico y tu capacidad para calcular fuerzas vectoriales y campos en el espacio es sólida." : 
                       score >= 3.0 ? "Buen trabajo analítico. Tienes la teoría base, pero necesitas afianzar la descomposición vectorial (senos y cosenos) para evitar perder puntos en problemas 2D." : 
                       "Anomalía detectada. El sistema detecta fallos en la estructura conceptual (Ley de Coulomb) y en el manejo de vectores. ¡Vuelve a intentarlo, la perseverancia es la clave de la física!"}
                    </p>
                    <p className="text-sm font-bold opacity-80 border-t border-current pt-4">
                        <Timer size={16} className="inline mr-2 -mt-1"/>
                        {timeMsg}
                    </p>
                  </div>

                  {/* IMPORTANCIA DE LOS APUNTES */}
                  <div className="p-8 rounded-3xl border-2 bg-amber-900/30 border-amber-500/50 text-amber-100 flex flex-col justify-center">
                      <h3 className="font-black text-2xl mb-4 flex items-center gap-3">
                        <BookOpenCheck size={28} className="text-amber-400"/> El Poder del Lápiz y Papel
                      </h3>
                      <p className="leading-relaxed text-base font-medium mb-4">
                        Recuerda que esta plataforma es un complemento interactivo. La verdadera ingeniería se forja tomando apuntes rigurosos y resolviendo ejercicios a mano. Las conexiones neuronales al escribir son irremplazables.
                      </p>
                      <ul className="text-sm font-bold opacity-90 space-y-2 list-disc list-inside ml-4">
                          <li>Dedica 30 min diarios a transcribir fórmulas.</li>
                          <li>Dibuja los vectores en tu cuaderno antes de calcular.</li>
                          <li>Tus apuntes organizados garantizan tu éxito profesional.</li>
                      </ul>
                  </div>
              </div>

              {/* RATING REAL SYSTEM */}
              <div className="mt-12 bg-slate-800/50 p-8 rounded-3xl border border-slate-700/50 backdrop-blur-sm shadow-lg max-w-4xl mx-auto">
                  <h3 className="text-white font-black mb-6 uppercase tracking-widest text-xl text-center flex items-center justify-center gap-3"><MessageSquare/> Encuesta de Calidad de la Plataforma</h3>
                  
                  {!hasRated ? (
                  <div className="space-y-6">
                      <div className="flex flex-col md:flex-row justify-between items-center bg-slate-900/50 p-4 rounded-xl">
                          <span className="font-bold text-slate-300">1. Usabilidad e Interfaz:</span>
                          <div className="flex gap-2 mt-2 md:mt-0">
                              {[1,2,3,4,5].map(star => (
                                  <button key={star} onClick={() => setSurvey({...survey, platform: star})} className={`hover:scale-125 transition-transform ${survey.platform >= star ? 'text-amber-400' : 'text-slate-600'}`}>
                                      <Star size={28} className={survey.platform >= star ? 'fill-current' : ''} />
                                  </button>
                              ))}
                          </div>
                      </div>
                      <div className="flex flex-col md:flex-row justify-between items-center bg-slate-900/50 p-4 rounded-xl">
                          <span className="font-bold text-slate-300">2. Calidad de Explicaciones y Gráficos:</span>
                          <div className="flex gap-2 mt-2 md:mt-0">
                              {[1,2,3,4,5].map(star => (
                                  <button key={star} onClick={() => setSurvey({...survey, graphics: star})} className={`hover:scale-125 transition-transform ${survey.graphics >= star ? 'text-amber-400' : 'text-slate-600'}`}>
                                      <Star size={28} className={survey.graphics >= star ? 'fill-current' : ''} />
                                  </button>
                              ))}
                          </div>
                      </div>
                      <div className="flex flex-col md:flex-row justify-between items-center bg-slate-900/50 p-4 rounded-xl">
                          <span className="font-bold text-slate-300">3. Nivel de Desafío del Examen:</span>
                          <div className="flex gap-2 mt-2 md:mt-0">
                              {[1,2,3,4,5].map(star => (
                                  <button key={star} onClick={() => setSurvey({...survey, challenge: star})} className={`hover:scale-125 transition-transform ${survey.challenge >= star ? 'text-amber-400' : 'text-slate-600'}`}>
                                      <Star size={28} className={survey.challenge >= star ? 'fill-current' : ''} />
                                  </button>
                              ))}
                          </div>
                      </div>
                      <div>
                          <label className="font-bold text-slate-300 block mb-2">Comentarios Adicionales (Opcional):</label>
                          <textarea value={survey.comment} onChange={e=>setSurvey({...survey, comment: e.target.value})} className="w-full bg-slate-900 text-white border border-slate-700 rounded-xl p-4 outline-none focus:border-orange-500" rows="3" placeholder="¿Qué mejorarías de esta evaluación?"></textarea>
                      </div>
                      <button onClick={submitRating} className="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-xl shadow-lg transition-colors uppercase tracking-widest">Enviar Feedback</button>
                  </div>
                  ) : (
                      <div className="text-center py-10">
                          <CheckCircle2 size={64} className="mx-auto text-emerald-500 mb-4" />
                          <p className="text-emerald-400 font-black text-2xl">¡Feedback Recibido!</p>
                          <p className="text-slate-400 font-medium mt-2">Tus respuestas ayudarán a mejorar el modelo de evaluación universitaria.</p>
                      </div>
                  )}
              </div>

              <div className="flex flex-col md:flex-row gap-6 justify-center mt-14">
                 <button onClick={() => { setView('exam'); setCurrentPage(1); window.scrollTo(0,0); }} className="bg-slate-800 hover:bg-slate-700 text-white font-black tracking-widest uppercase px-8 py-4 rounded-xl transition-all border border-slate-600 shadow-md hover:shadow-lg">
                  REVISAR CORRECCIONES EN LA HOJA
                </button>
                <button onClick={() => { setView('login'); setRole(null); signOut(auth); }} className="bg-white hover:bg-slate-100 text-slate-900 font-black tracking-widest uppercase px-8 py-4 rounded-xl transition-all shadow-md hover:shadow-lg">
                  FINALIZAR Y SALIR
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* VIEW: TEACHER DASHBOARD */}
      {view === 'dashboard' && role === 'teacher' && (
        <div className="max-w-[1200px] mx-auto mt-12 px-6 animate-in fade-in duration-500 pb-20 flex-grow">
          <div className="mb-10">
            <h2 className="text-4xl font-black text-slate-900 tracking-tighter mb-2">Centro de Mando Docente</h2>
            <p className="text-slate-500 font-bold text-lg">Analíticas reales calculadas directamente desde Firestore (Escala 5.0).</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-lg transition-shadow">
              <div className="flex justify-between items-start mb-4">
                <div className="p-4 bg-blue-50 text-blue-600 rounded-2xl"><Eye size={28}/></div>
                <span className="text-sm font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg">Real</span>
              </div>
              <h3 className="text-4xl font-black text-slate-800">{metrics.views}</h3>
              <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Estudiantes Reg.</p>
            </div>
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-lg transition-shadow">
              <div className="flex justify-between items-start mb-4">
                <div className="p-4 bg-violet-50 text-violet-600 rounded-2xl"><BarChart2 size={28}/></div>
              </div>
              <h3 className="text-4xl font-black text-slate-800">{metrics.avgScore} / 5.0</h3>
              <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Nota Promedio</p>
            </div>
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-lg transition-shadow">
              <div className="flex justify-between items-start mb-4">
                <div className="p-4 bg-amber-50 text-amber-600 rounded-2xl"><Clock size={28}/></div>
              </div>
              <h3 className="text-4xl font-black text-slate-800">{formatTime(metrics.avgTime)}</h3>
              <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">T. Medio Examen</p>
            </div>
            <div className="bg-slate-900 p-6 rounded-3xl shadow-xl border border-slate-800 text-white relative overflow-hidden group">
              <TrendingUp className="absolute -right-6 -bottom-6 text-slate-800 group-hover:scale-110 transition-transform duration-500" size={120} />
              <div className="relative z-10">
                <h3 className="text-xl font-black mb-2 text-orange-400">IA de Ajuste Pedagógico</h3>
                <p className="text-base text-slate-300 mb-6 font-medium leading-snug">Índice de Frustración: <span className="font-mono text-xl">{metrics.frustrationIndex}</span></p>
                <span className={`text-white text-sm font-black px-4 py-2 rounded-xl flex items-center gap-2 w-max shadow-md ${metrics.frustrationIndex > 5 ? 'bg-red-500' : 'bg-emerald-500'}`}>
                  {metrics.frustrationIndex > 5 ? <AlertTriangle size={16}/> : <Activity size={16}/>}
                  {metrics.frustrationIndex > 5 ? 'Alerta: Alta Frustración' : 'Monitoreo Activo Óptimo'}
                </span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div className="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="px-8 py-6 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h3 className="font-black text-slate-800 text-xl">Métricas por Nivel Simuladas</h3>
                <span className="text-xs text-slate-500 font-black uppercase tracking-widest bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm">Identificación Cuellos de botella</span>
              </div>
              <div className="p-6 border-b border-slate-100 bg-white">
                 <h4 className="font-bold text-slate-700 mb-2 uppercase text-sm tracking-widest">Campana de Notas (Frecuencia)</h4>
                 <ScoreHistogram attempts={metrics.attempts} />
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="text-xs uppercase tracking-widest text-slate-500 border-b-2 border-slate-100 bg-slate-50">
                      <th className="px-8 py-5 font-black">Misión Evaluada</th>
                      <th className="px-8 py-5 font-black">Nota Media</th>
                      <th className="px-8 py-5 font-black">T. Medio</th>
                      <th className="px-8 py-5 font-black">Estado del Grupo</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-base font-bold bg-white">
                    {metrics.questionMetrics.map(q => (
                      <tr key={q.id} className="hover:bg-slate-50 transition-colors group">
                        <td className="px-8 py-6 text-slate-800 flex items-center gap-4">
                          <div className={`w-3 h-3 rounded-full shadow-inner ${q.status === 'optimal' ? 'bg-emerald-500' : q.status === 'review' ? 'bg-amber-500' : 'bg-red-500'}`}></div>
                          {q.title}
                        </td>
                        <td className="px-8 py-6 font-mono text-slate-600 text-lg">{q.avgScore}</td>
                        <td className="px-8 py-6 font-mono text-slate-500 flex items-center gap-2"><Timer size={16} className="text-slate-400"/> {q.avgTime}s</td>
                        <td className="px-8 py-6">
                          {q.status === 'optimal' ? <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Óptimo</span> :
                           q.status === 'review' ? <span className="bg-amber-50 text-amber-700 border border-amber-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Revisar</span> :
                           <span className="bg-red-50 text-red-700 border border-red-200 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm">Crítico</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
              <div className="px-8 py-6 border-b border-slate-200 bg-slate-50">
                <h3 className="font-black text-slate-800 text-xl">Últimos Entregados (Real)</h3>
              </div>
              <div className="p-0 flex-grow bg-white overflow-y-auto max-h-[600px] custom-scrollbar">
                {metrics.attempts.length === 0 ? (
                  <div className="p-8 text-center text-slate-400 font-bold">No hay evaluaciones registradas en Firestore.</div>
                ) : (
                  metrics.attempts.map((a, idx) => (
                    <div key={idx} className="p-8 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                      <div className="flex justify-between items-center mb-3">
                        <span className="font-black text-slate-800 text-sm break-all" title={a.agent}>{a.agent.length > 20 ? a.agent.substring(0,18)+'...' : a.agent}</span>
                        <span className={`font-mono font-black text-base px-3 py-1.5 rounded-lg border flex-shrink-0 ${a.score > 3.0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm' : 'bg-red-50 text-red-700 border-red-200 shadow-sm'}`}>{a.score} pts</span>
                      </div>
                      <div className="flex justify-between items-center text-xs text-slate-500 font-bold uppercase tracking-wider mt-2">
                        <span>{a.date}</span>
                        <span className="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200"><Timer size={14}/> {formatTime(a.time)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER Nivel Producción */}
      <footer className="mt-auto py-8 bg-slate-900 border-t border-slate-800 text-center relative z-50">
          <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 gap-4">
              <div className="text-slate-400 font-medium text-sm">
                  &copy; 2026 <span className="font-black text-white">physics10.easy</span> - Todos los derechos reservados.
              </div>
              
              <div className="flex items-center gap-6">
                  <div className="flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow-inner">
                      {[1,2,3,4,5].map(star => (
                         <Star key={star} size={14} className={`text-orange-400 ${star <= Math.round(ratingStats.average) ? 'fill-current' : ''}`} />
                      ))}
                      <span className="ml-2 font-bold text-orange-100 text-xs">{ratingStats.average}/5 ({ratingStats.count})</span>
                  </div>
                  
                  <div className="flex items-center gap-2 text-xs font-bold text-blue-400">
                      <Eye size={14}/>
                      <span>{realViews} Vistas en tiempo real</span>
                  </div>
              </div>
          </div>
      </footer>

    </div>
  );
}
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
