<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Simposio - Ciencia de Datos UNAB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Motor 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; 
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body.bg-solid {
            background-color: #020617; 
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #toggle-bg-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        #toggle-bg-btn:hover {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.5);
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body class="relative min-h-screen bg-transparent" id="main-body">

    <!-- Botón Curvo Inferior Estilizado -->
    <button id="toggle-bg-btn" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-50 px-10 py-3 bg-cyan-950/80 hover:bg-cyan-800/95 border border-cyan-400/40 rounded-full text-cyan-50 text-[10px] font-black tracking-[0.2em] backdrop-blur-xl transition-all duration-300 uppercase">
        Modo de Fondo
    </button>

    <!-- Motor 3D -->
    <div id="canvas-container" class="cursor-grab active:cursor-grabbing"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const bodyEl = document.getElementById('main-body');
        const toggleBtn = document.getElementById('toggle-bg-btn');
        let isSolid = false;

        toggleBtn.addEventListener('click', () => {
            isSolid = !isSolid;
            bodyEl.classList.toggle('bg-solid', isSolid);
            toggleBtn.innerText = isSolid ? "Fondo Transparente" : "Fondo Sólido";
        });

        // --- 1. ESCENA Y CÁMARA ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 15, 240); 

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. CONTROLES ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 0.8; 
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 120;
        controls.maxDistance = 450;
        controls.target.set(0, -5, 0); 

        // --- 3. ATLAS DE TEXTURAS ---
        const atlasSize = 2048;
        const cols = 4;
        const rows = 8; 
        const cellW = atlasSize / cols;
        const cellH = atlasSize / rows;
        const canvas2d = document.createElement('canvas');
        canvas2d.width = atlasSize;
        canvas2d.height = atlasSize;
        const ctx = canvas2d.getContext('2d');

        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, atlasSize, atlasSize);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const formulas = [
            "I SIMPOSIO", "CIENCIA", "DE DATOS", "UNAB", 
            "I SIMPOSIO", "DATA", "SCIENCE", "UNAB",
            "∇J(θ)", "f(x)=wx+b", "σ(z)", "P(A|B)",
            "L=-∑ylog(ŷ)", "E[X]", "y=softmax", "θ=θ-α∇J",
            "ReLU(x)", "CNN", "LSTM", "GANs", 
            "μ, σ²", "R²", "W^T X", "01001", 
            "∫e^x", "dy/dx", "O(n²)", "Tensor",
            "A*", "Entropy", "Gini", "Vector"
        ];

        let fIndex = 0;
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const isText = formulas[fIndex].match(/[A-Z]/);
                ctx.font = isText ? 'bold 85px "Inter", sans-serif' : 'bold 75px "Fira Code", monospace';
                ctx.fillText(formulas[fIndex], j * cellW + cellW / 2, i * cellH + cellH / 2);
                fIndex++;
            }
        }

        const texture = new THREE.CanvasTexture(canvas2d);
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = true;

        // --- 4. MOTOR DE ESQUELETO 3D ---
        function sdCapsule(p, a, b, r) {
            let pa = [p[0]-a[0], p[1]-a[1], p[2]-a[2]];
            let ba = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
            let h = Math.max(0, Math.min(1, (pa[0]*ba[0] + pa[1]*ba[1] + pa[2]*ba[2]) / (ba[0]*ba[0] + ba[1]*ba[1] + ba[2]*ba[2])));
            let d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];
            return Math.sqrt(d[0]*d[0] + d[1]*d[1] + d[2]*d[2]) - r;
        }

        function smin(a, b, k) {
            let h = Math.max(k - Math.abs(a - b), 0.0) / k;
            return Math.min(a, b) - h * h * h * k * (1.0 / 6.0);
        }

        const partsSDF = {
            torso: (p) => {
                let d = sdCapsule(p, [0,12,0], [0,58,0], 12.5); 
                d = smin(d, sdCapsule(p, [0,-5,0], [0,12,0], 11.0), 10); 
                return d;
            },
            head: (p) => {
                let d = sdCapsule(p, [0,0,0], [0,8,0], 3.2); 
                d = smin(d, sdCapsule(p, [0,11,0], [0,22,2], 8.0), 4); 
                return d;
            },
            armL: (p) => {
                let d = sdCapsule(p, [0,0,0], [-4,-25,0], 4.2); 
                d = smin(d, sdCapsule(p, [-4,-25,0], [-6,-48,2], 3.2), 3); 
                return d;
            },
            armR: (p) => {
                let d = sdCapsule(p, [0,0,0], [4,-25,0], 4.2); 
                d = smin(d, sdCapsule(p, [4,-25,0], [6,-48,2], 3.2), 3); 
                return d;
            },
            legL: (p) => {
                let d = sdCapsule(p, [0,0,0], [-2,-45,0], 7.0); 
                d = smin(d, sdCapsule(p, [-2,-45,0], [-2,-85,0], 5.2), 5); 
                return d;
            },
            legR: (p) => {
                let d = sdCapsule(p, [0,0,0], [2,-45,0], 7.0); 
                d = smin(d, sdCapsule(p, [2,-45,0], [2,-85,0], 5.2), 5); 
                return d;
            },
            shoeL: (p) => {
                return sdCapsule(p, [-2,-85,-2], [-2,-89,10], 4.0);
            },
            shoeR: (p) => {
                return sdCapsule(p, [2,-85,-2], [2,-89,10], 4.0);
            }
        };

        function generatePartGeometry(sdfFunc, count, bounds, colorRGB) {
            const positions = new Float32Array(count * 3);
            const uvs = new Float32Array(count * 2);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const colors = new Float32Array(count * 3);
            
            let pIndex = 0;
            while(pIndex < count) {
                let px = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
                let py = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
                let pz = bounds.minZ + Math.random() * (bounds.maxZ - bounds.minZ);
                let dist = sdfFunc([px, py, pz]);
                if (dist < 0 && (dist > -2.8 || Math.random() < 0.25)) {
                    positions[pIndex * 3] = px;
                    positions[pIndex * 3 + 1] = py;
                    positions[pIndex * 3 + 2] = pz;
                    uvs[pIndex * 2] = Math.floor(Math.random() * cols);
                    uvs[pIndex * 2 + 1] = Math.floor(Math.random() * rows);
                    sizes[pIndex] = Math.random() * 10.0 + 6.0; 
                    opacities[pIndex] = Math.random() * 0.8 + 0.2;
                    colors[pIndex * 3] = colorRGB[0];
                    colors[pIndex * 3 + 1] = colorRGB[1];
                    colors[pIndex * 3 + 2] = colorRGB[2];
                    pIndex++;
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('uvOffset', new THREE.BufferAttribute(uvs, 2));
            geo.setAttribute('sizeBase', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('opacityBase', new THREE.BufferAttribute(opacities, 1));
            geo.setAttribute('partColor', new THREE.BufferAttribute(colors, 3));
            return geo;
        }

        // --- 5. SHADER ---
        const material = new THREE.ShaderMaterial({
            uniforms: { atlasTexture: { value: texture }, cols: { value: cols }, rows: { value: rows }, time: { value: 0.0 } },
            vertexShader: `
                attribute vec2 uvOffset; attribute float sizeBase; attribute float opacityBase; attribute vec3 partColor;
                varying vec2 vUvOffset; varying float vAlpha; varying vec3 vColor; varying vec3 vPos;
                uniform float time;
                void main() {
                    vUvOffset = uvOffset; vColor = partColor; vPos = position;
                    vec3 pos = position;
                    pos.x += sin(time * 10.0 + position.y) * 0.15;
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    float edge = abs(dot(normalize(pos.xy), vec2(0.0, 1.0)));
                    vAlpha = opacityBase * (0.8 + edge * 0.4);
                    gl_PointSize = sizeBase * (350.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D atlasTexture; uniform float cols; uniform float rows; uniform float time;
                varying vec2 vUvOffset; varying float vAlpha; varying vec3 vColor; varying vec3 vPos;
                void main() {
                    vec2 uv = vec2((vUvOffset.x + gl_PointCoord.x) / cols, (vUvOffset.y + (1.0 - gl_PointCoord.y)) / rows);
                    vec4 texColor = texture2D(atlasTexture, uv);
                    if (texColor.r < 0.15) discard;
                    float scan = smoothstep(0.9, 1.0, 1.0 - abs(sin(vPos.y * 0.05 - time * 1.5)));
                    vec3 finalColor = vColor + vec3(0.5) * texColor.r;
                    finalColor += vec3(0.0, 1.0, 1.0) * scan * 0.8;
                    gl_FragColor = vec4(finalColor, texColor.r * vAlpha * (0.9 + scan * 0.5));
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });

        // --- 6. ENSAMBLAJE ---
        const humanGroup = new THREE.Group();
        humanGroup.position.y = 15;
        const colorSkin = [0.3, 0.9, 1.0]; 
        const colorShirt = [1.0, 0.5, 0.0]; 
        const colorPants = [0.1, 0.4, 1.0]; 
        const colorShoes = [0.85, 0.85, 0.95]; // Plata / Blanco metálico

        humanGroup.add(new THREE.Points(generatePartGeometry(partsSDF.torso, 11000, {minX:-20, maxX:20, minY:-5, maxY:65, minZ:-15, maxZ:15}, colorShirt), material));
        const head = new THREE.Points(generatePartGeometry(partsSDF.head, 3500, {minX:-12, maxX:12, minY:-2, maxY:35, minZ:-12, maxZ:15}, colorSkin), material);
        head.position.set(0, 58, 0); humanGroup.add(head);
        const armL = new THREE.Points(generatePartGeometry(partsSDF.armL, 3000, {minX:-15, maxX:5, minY:-60, maxY:5, minZ:-10, maxZ:10}, colorShirt), material);
        armL.position.set(-16, 52, 0); humanGroup.add(armL);
        const armR = new THREE.Points(generatePartGeometry(partsSDF.armR, 3000, {minX:-5, maxX:15, minY:-60, maxY:5, minZ:-10, maxZ:10}, colorShirt), material);
        armR.position.set(16, 52, 0); humanGroup.add(armR);
        const legL = new THREE.Points(generatePartGeometry(partsSDF.legL, 5000, {minX:-15, maxX:10, minY:-100, maxY:5, minZ:-15, maxZ:15}, colorPants), material);
        legL.position.set(-10, 0, 0); humanGroup.add(legL);
        const legR = new THREE.Points(generatePartGeometry(partsSDF.legR, 5000, {minX:-10, maxX:15, minY:-100, maxY:5, minZ:-15, maxZ:15}, colorPants), material);
        legR.position.set(10, 0, 0); humanGroup.add(legR);

        // Añadir Zapatos
        const shoeL = new THREE.Points(generatePartGeometry(partsSDF.shoeL, 1200, {minX:-10, maxX:5, minY:-95, maxY:-80, minZ:-10, maxZ:15}, colorShoes), material);
        shoeL.position.set(-10, 0, 0); humanGroup.add(shoeL);
        const shoeR = new THREE.Points(generatePartGeometry(partsSDF.shoeR, 1200, {minX:-5, maxX:10, minY:-95, maxY:-80, minZ:-10, maxZ:15}, colorShoes), material);
        shoeR.position.set(10, 0, 0); humanGroup.add(shoeR);

        scene.add(humanGroup);

        // --- 7. BASE Y PARTÍCULAS ---
        const baseGroup = new THREE.Group();
        baseGroup.position.y = -95;
        scene.add(baseGroup);

        const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(60, 75, 8, 64), new THREE.MeshBasicMaterial({ color: 0x010814, transparent: true, opacity: 0.98 }));
        baseGroup.add(baseMesh);

        const rCanvas = document.createElement('canvas'); rCanvas.width = 4096; rCanvas.height = 256;
        const rCtx = rCanvas.getContext('2d'); rCtx.fillStyle = '#000000'; rCtx.fillRect(0, 0, rCanvas.width, rCanvas.height);
        rCtx.fillStyle = '#ffcc00'; rCtx.font = 'bold 95px "Inter", sans-serif'; rCtx.textAlign = 'center'; rCtx.textBaseline = 'middle';
        rCtx.shadowColor = '#ff6600'; rCtx.shadowBlur = 30;
        const fullText = "I SIMPOSIO DE CIENCIA DE DATOS UNAB     ✦     I SIMPOSIO DE CIENCIA DE DATOS UNAB     ✦     ";
        rCtx.fillText(fullText, rCanvas.width / 2, rCanvas.height / 2); rCtx.fillText(fullText, rCanvas.width / 2, rCanvas.height / 2);

        const ringMesh = new THREE.Mesh(new THREE.CylinderGeometry(61, 76, 16, 64, 1, true), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(rCanvas), transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
        ringMesh.material.map.wrapS = THREE.RepeatWrapping;
        baseGroup.add(ringMesh);

        // Bolitas en color BLANCO PLATEADO
        const risingGeo = new THREE.BufferGeometry();
        const risingCount = 200;
        const risingPos = new Float32Array(risingCount * 3);
        for(let i=0; i<risingCount; i++) {
            risingPos[i*3] = (Math.random()-0.5)*130;
            risingPos[i*3+1] = Math.random()*240 - 120;
            risingPos[i*3+2] = (Math.random()-0.5)*130;
        }
        risingGeo.setAttribute('position', new THREE.BufferAttribute(risingPos, 3));
        const risingPoints = new THREE.Points(risingGeo, new THREE.PointsMaterial({ 
            color: 0xffffff, // BLANCO PURO
            size: 2.0, 
            transparent: true, 
            opacity: 0.6, 
            blending: THREE.AdditiveBlending 
        }));
        scene.add(risingPoints);

        const clock = new THREE.Clock();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            material.uniforms.time.value = elapsedTime;
            controls.update();

            const walkSpeed = elapsedTime * 2.4; 
            const walkAmplitude = 0.35;
            
            // Animación sincrónica incluyendo los zapatos
            const swingX = Math.sin(walkSpeed);
            const swingXOpp = Math.sin(walkSpeed + Math.PI);

            legL.rotation.x = swingX * walkAmplitude;
            shoeL.rotation.x = swingX * walkAmplitude;
            
            legR.rotation.x = swingXOpp * walkAmplitude;
            shoeR.rotation.x = swingXOpp * walkAmplitude;

            armL.rotation.x = swingXOpp * 0.25;
            armR.rotation.x = swingX * 0.25;

            humanGroup.position.y = 15 + Math.abs(Math.sin(walkSpeed * 2)) * 2.5;
            baseGroup.rotation.y -= 0.005;

            const posArray = risingPoints.geometry.attributes.position.array;
            for(let i=0; i<risingCount; i++) {
                posArray[i*3+1] += 0.6;
                if(posArray[i*3+1] > 120) posArray[i*3+1] = -120;
            }
            risingPoints.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
