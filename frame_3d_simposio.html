<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Simposio - Ciencia de Datos UNAB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Motor 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls para interacción con el mouse -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; /* Fundo transparente para incorporar */
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.5s ease;
        }

        body.bg-solid {
            background-color: #020617; /* Fundo escuro sólido */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="relative min-h-screen bg-transparent" id="main-body">

    <!-- Botón para alternar el fondo (Curvo y posicionado abajo para frames verticales) -->
    <button id="toggle-bg-btn" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-50 px-8 py-3 bg-cyan-950/80 hover:bg-cyan-800/90 border border-cyan-500/50 rounded-full text-cyan-50 font-semibold tracking-wide backdrop-blur-md transition-all shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] whitespace-nowrap">
        Fondo Sólido
    </button>

    <!-- Motor 3D -->
    <div id="canvas-container" class="cursor-grab active:cursor-grabbing"></div>

    <script>
        const container = document.getElementById('canvas-container');

        // Lógica do botão de fundo
        const bodyEl = document.getElementById('main-body');
        const toggleBtn = document.getElementById('toggle-bg-btn');
        let isSolid = false;

        toggleBtn.addEventListener('click', () => {
            isSolid = !isSolid;
            if (isSolid) {
                bodyEl.classList.add('bg-solid');
                bodyEl.classList.remove('bg-transparent');
                toggleBtn.innerText = "Fondo Transparente";
            } else {
                bodyEl.classList.remove('bg-solid');
                bodyEl.classList.add('bg-transparent');
                toggleBtn.innerText = "Fondo Sólido";
            }
        });

        // --- 1. CONFIGURACIÓN DE ESCENA Y CÁMARA ---
        const scene = new THREE.Scene();
        // Fondo transparente, sin niebla para embeber perfectamente

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 15, 420); // Cámara más alejada y elevada para encajar en frame vertical

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. CONTROLES DEL MOUSE (OrbitControls) ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 1.0; 
        // Límite modificado: impide bajar la cámara hasta quedar a ras de suelo, asegurando que el texto siempre se vea
        controls.maxPolarAngle = Math.PI / 2 - 0.15; 
        controls.minDistance = 150;
        controls.maxDistance = 600;
        controls.target.set(0, -10, 0); 

        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // --- 3. ATLAS DE TEXTURAS (Alta Legibilidad con Anti-Aliasing) ---
        const atlasSize = 2048;
        const cols = 4;
        const rows = 8; 
        const cellW = atlasSize / cols;
        const cellH = atlasSize / rows;
        const canvas2d = document.createElement('canvas');
        canvas2d.width = atlasSize;
        canvas2d.height = atlasSize;
        const ctx = canvas2d.getContext('2d');

        // Fondo negro puro
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, atlasSize, atlasSize);
        
        // Configuración de texto
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Mezclamos el texto del simposio con fórmulas clave
        const formulas = [
            "I SIMPOSIO", "CIENCIA", "DE DATOS", "UNAB", 
            "I SIMPOSIO", "DATA", "SCIENCE", "UNAB",
            "∇J(θ)", "f(x)=wx+b", "σ(z)", "P(A|B)",
            "L=-∑ylog(ŷ)", "E[X]", "y=softmax", "θ=θ-α∇J",
            "ReLU(x)", "CNN", "LSTM", "GANs", 
            "μ, σ²", "R²", "W^T X", "01001", 
            "∫e^x", "dy/dx", "O(n²)", "Tensor",
            "K-Means", "Entropy", "Matrix", "Vector"
        ];

        let fIndex = 0;
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                // Usar fuente más gruesa y sans-serif para las palabras del simposio, monospace para fórmulas
                if (formulas[fIndex].includes("SIMPOSIO") || formulas[fIndex].includes("UNAB") || formulas[fIndex].includes("CIENCIA") || formulas[fIndex].includes("DATOS")) {
                    ctx.font = 'bold 75px "Inter", sans-serif';
                } else {
                    ctx.font = 'bold 70px "Fira Code", monospace';
                }
                ctx.fillText(formulas[fIndex], j * cellW + cellW / 2, i * cellH + cellH / 2);
                fIndex++;
            }
        }

        const texture = new THREE.CanvasTexture(canvas2d);
        // Filtros lineales para suavizar los bordes del texto (Anti-aliasing)
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = true;

        // --- 4. MOTOR DE ESQUELETO 3D (Proporciones Mejoradas) ---
        function sdCapsule(p, a, b, r) {
            let pa = [p[0]-a[0], p[1]-a[1], p[2]-a[2]];
            let ba = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
            let h = Math.max(0, Math.min(1, (pa[0]*ba[0] + pa[1]*ba[1] + pa[2]*ba[2]) / (ba[0]*ba[0] + ba[1]*ba[1] + ba[2]*ba[2])));
            let d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];
            return Math.sqrt(d[0]*d[0] + d[1]*d[1] + d[2]*d[2]) - r;
        }

        function smin(a, b, k) {
            let h = Math.max(k - Math.abs(a - b), 0.0) / k;
            return Math.min(a, b) - h * h * h * k * (1.0 / 6.0);
        }

        // Proporciones anatómicas ajustadas (más estéticas)
        const partsSDF = {
            torso: (p) => {
                let d = sdCapsule(p, [0,12,0], [0,50,0], 13.5); // Peito ajustado para perfeição
                d = smin(d, sdCapsule(p, [0,-2,0], [0,12,0], 12.0), 8); // Cintura
                return d;
            },
            head: (p) => {
                let d = sdCapsule(p, [0,0,0], [0,6,0], 3.2); // Pescoço mais natural
                d = smin(d, sdCapsule(p, [0,9,0], [0,18,2], 7.8), 3); // Cabeça mais arredondada
                return d;
            },
            armL: (p) => {
                let d = sdCapsule(p, [0,0,0], [-3,-22,0], 4.0); 
                d = smin(d, sdCapsule(p, [-3,-22,0], [-5,-43,2], 3.0), 2); 
                d = Math.min(d, sdCapsule(p, [-5,-43,2], [-6,-50,3], 2.2)); 
                return d;
            },
            armR: (p) => {
                let d = sdCapsule(p, [0,0,0], [3,-22,0], 4.0); 
                d = smin(d, sdCapsule(p, [3,-22,0], [5,-43,2], 3.0), 2); 
                d = Math.min(d, sdCapsule(p, [5,-43,2], [6,-50,3], 2.2)); 
                return d;
            },
            legL: (p) => {
                let d = sdCapsule(p, [0,0,0], [-1,-38,0], 7.0); 
                d = smin(d, sdCapsule(p, [-1,-38,0], [-1,-75,0], 5.0), 3); 
                d = smin(d, sdCapsule(p, [-1,-75,-2], [-1,-80,8], 3.0), 2); 
                return d;
            },
            legR: (p) => {
                let d = sdCapsule(p, [0,0,0], [1,-38,0], 7.0); 
                d = smin(d, sdCapsule(p, [1,-38,0], [1,-75,0], 5.0), 3); 
                d = smin(d, sdCapsule(p, [1,-75,-2], [1,-80,8], 3.0), 2); 
                return d;
            }
        };

        function generatePartGeometry(sdfFunc, count, bounds, colorRGB) {
            const positions = new Float32Array(count * 3);
            const uvs = new Float32Array(count * 2);
            const sizes = new Float32Array(count);
            const opacities = new Float32Array(count);
            const colors = new Float32Array(count * 3);
            
            let pIndex = 0;
            while(pIndex < count) {
                let px = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
                let py = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
                let pz = bounds.minZ + Math.random() * (bounds.maxZ - bounds.minZ);

                let dist = sdfFunc([px, py, pz]);

                // Mantener puntos en la superficie y algunos adentro para volumen
                if (dist < 0 && (dist > -2.5 || Math.random() < 0.2)) {
                    positions[pIndex * 3] = px;
                    positions[pIndex * 3 + 1] = py;
                    positions[pIndex * 3 + 2] = pz;
                    
                    uvs[pIndex * 2] = Math.floor(Math.random() * cols);
                    uvs[pIndex * 2 + 1] = Math.floor(Math.random() * rows);
                    
                    sizes[pIndex] = Math.random() * 8.0 + 6.0; // Textos ligeiramente mais nítidos
                    opacities[pIndex] = Math.random() * 0.9 + 0.1;
                    
                    colors[pIndex * 3] = colorRGB[0];
                    colors[pIndex * 3 + 1] = colorRGB[1];
                    colors[pIndex * 3 + 2] = colorRGB[2];

                    pIndex++;
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('uvOffset', new THREE.BufferAttribute(uvs, 2));
            geo.setAttribute('sizeBase', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('opacityBase', new THREE.BufferAttribute(opacities, 1));
            geo.setAttribute('partColor', new THREE.BufferAttribute(colors, 3));
            return geo;
        }

        // --- 5. SHADER HOLOGRÁFICO PREMIUM ---
        const material = new THREE.ShaderMaterial({
            uniforms: {
                atlasTexture: { value: texture },
                cols: { value: cols },
                rows: { value: rows },
                time: { value: 0.0 }
            },
            vertexShader: `
                attribute vec2 uvOffset;
                attribute float sizeBase;
                attribute float opacityBase;
                attribute vec3 partColor;
                varying vec2 vUvOffset;
                varying float vAlpha;
                varying vec3 vColor;
                varying vec3 vWorldPos;
                uniform float time;

                void main() {
                    vUvOffset = uvOffset;
                    vColor = partColor;
                    
                    // Pulso suave
                    float pulse = sin(time * 2.0 + position.y * 0.05) * 0.3 + 0.7;
                    vAlpha = opacityBase * pulse;

                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPosition.xyz;

                    vec4 mvPosition = viewMatrix * worldPosition;
                    
                    // Atenuación de tamaño por perspectiva
                    gl_PointSize = sizeBase * (350.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D atlasTexture;
                uniform float cols;
                uniform float rows;
                varying vec2 vUvOffset;
                varying float vAlpha;
                varying vec3 vColor;
                varying vec3 vWorldPos;

                void main() {
                    vec2 uv = vec2(
                        (vUvOffset.x + gl_PointCoord.x) / cols,
                        (vUvOffset.y + (1.0 - gl_PointCoord.y)) / rows
                    );
                    vec4 texColor = texture2D(atlasTexture, uv);
                    
                    // En lugar de "discard", usamos el canal rojo como alpha real para suavizado (Anti-aliasing)
                    float finalAlpha = texColor.r * vAlpha;
                    if (finalAlpha < 0.02) discard; // Descarte mínimo por rendimiento

                    // Color de la ropa/piel específico asignado en la geometría
                    vec3 finalColor = vColor;

                    // Añadir un núcleo brillante al texto
                    finalColor += vec3(0.4) * texColor.r;

                    gl_FragColor = vec4(finalColor, finalAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        // --- 6. ENSAMBLAJE DEL ESQUELETO 3D ---
        const humanGroup = new THREE.Group();
        humanGroup.position.y = 15;

        // Colores de la silueta holográfica
        const colorSkin = [0.2, 0.9, 1.0]; // Cyan brillante para la piel (cabeza)
        const colorShirt = [1.0, 0.4, 0.0]; // Naranja tecnológico para la camisa (torso y brazos)
        const colorPants = [0.1, 0.3, 1.0]; // Azul profundo para los pantalones (piernas)

        // Reduje un poco la cantidad de partículas para que se entienda mejor la forma y el texto
        const geoTorso = generatePartGeometry(partsSDF.torso, 9000, {minX:-20, maxX:20, minY:-5, maxY:60, minZ:-15, maxZ:15}, colorShirt);
        const torso = new THREE.Points(geoTorso, material);
        humanGroup.add(torso);

        const geoHead = generatePartGeometry(partsSDF.head, 3000, {minX:-10, maxX:10, minY:-2, maxY:30, minZ:-10, maxZ:15}, colorSkin);
        const head = new THREE.Points(geoHead, material);
        head.position.set(0, 50, 0); 
        torso.add(head);

        const geoArmL = generatePartGeometry(partsSDF.armL, 2500, {minX:-12, maxX:5, minY:-55, maxY:5, minZ:-10, maxZ:10}, colorShirt);
        const armL = new THREE.Points(geoArmL, material);
        armL.position.set(-15, 46, 0); 
        torso.add(armL);

        const geoArmR = generatePartGeometry(partsSDF.armR, 2500, {minX:-5, maxX:12, minY:-55, maxY:5, minZ:-10, maxZ:10}, colorShirt);
        const armR = new THREE.Points(geoArmR, material);
        armR.position.set(15, 46, 0); 
        torso.add(armR);

        const geoLegL = generatePartGeometry(partsSDF.legL, 3500, {minX:-12, maxX:8, minY:-85, maxY:5, minZ:-12, maxZ:12}, colorPants);
        const legL = new THREE.Points(geoLegL, material);
        legL.position.set(-8, 0, 0); 
        torso.add(legL);

        const geoLegR = generatePartGeometry(partsSDF.legR, 3500, {minX:-8, maxX:12, minY:-85, maxY:5, minZ:-12, maxZ:12}, colorPants);
        const legR = new THREE.Points(geoLegR, material);
        legR.position.set(8, 0, 0); 
        torso.add(legR);

        scene.add(humanGroup);

        // --- 7. BASE: "I SIMPOSIO DE CIENCIA DE DATOS UNAB" ---
        const baseGroup = new THREE.Group();
        baseGroup.position.y = -80;
        scene.add(baseGroup);

        // Pedestal sólido oscuro (Diseño cónico hacia afuera para que sea legible desde arriba)
        const baseGeo = new THREE.CylinderGeometry(55, 68, 6, 64);
        const baseMat = new THREE.MeshBasicMaterial({ 
            color: 0x010814, // Azul quase preto
            transparent: true, 
            opacity: 0.95, // Maior opacidade para renderização sólida
        });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseGroup.add(baseMesh);

        // Línea brillante interior
        const innerGlowGeo = new THREE.CylinderGeometry(48, 48, 6.2, 64, 1, true);
        const innerGlowMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff, // Cyan mais brilhante
            transparent: true,
            opacity: 0.25, // Aumentado para melhor visualização
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const innerGlowMesh = new THREE.Mesh(innerGlowGeo, innerGlowMat);
        baseGroup.add(innerGlowMesh);

        // Anillo de texto de Alta Resolución y Mayor Altura
        const rCanvas = document.createElement('canvas');
        rCanvas.width = 4096; // Doble resolución para nitidez perfecta
        rCanvas.height = 256; // Mayor altura en el lienzo para fuente más grande
        const rCtx = rCanvas.getContext('2d');
        rCtx.fillStyle = '#000000';
        rCtx.fillRect(0, 0, rCanvas.width, rCanvas.height);
        
        // Estilo del texto del simposio (Color resaltante dorado/amarillo brillante)
        rCtx.fillStyle = '#ffcc00'; // Dorado intenso que resalta contra el azul oscuro
        rCtx.font = 'bold 80px "Inter", sans-serif'; // Fuente ampliada casi al doble
        rCtx.textAlign = 'center';
        rCtx.textBaseline = 'middle';
        
        // Sombra paralela para efecto glow en 2D
        rCtx.shadowColor = '#ff8800'; // Resplandor naranja/dorado
        rCtx.shadowBlur = 25;

        const fullText = "I SIMPOSIO DE CIENCIA DE DATOS UNAB     ✦     I SIMPOSIO DE CIENCIA DE DATOS UNAB     ✦     ";
        rCtx.fillText(fullText, rCanvas.width / 2, rCanvas.height / 2);
        // Doble impresión para reforzar el núcleo brillante
        rCtx.fillText(fullText, rCanvas.width / 2, rCanvas.height / 2);

        const rTex = new THREE.CanvasTexture(rCanvas);
        rTex.wrapS = THREE.RepeatWrapping;
        rTex.anisotropy = renderer.capabilities.getMaxAnisotropy(); // Máxima nitidez en ángulos
        
        // Geometría cónica (radio superior menor que el inferior) para que el texto mire en diagonal hacia la cámara
        const ringGeo = new THREE.CylinderGeometry(56, 69, 12, 64, 1, true);
        const ringMat = new THREE.MeshBasicMaterial({
            map: rTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        baseGroup.add(ringMesh);

        // --- 8. ANIMACIÓN GLOBAL ---
        const clock = new THREE.Clock();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            material.uniforms.time.value = elapsedTime;

            controls.update();

            // Animación de caminata más suave y natural
            const walkSpeed = elapsedTime * 2.0; 
            const walkAmplitude = 0.35; 

            legL.rotation.x = Math.sin(walkSpeed) * walkAmplitude;
            legR.rotation.x = Math.sin(walkSpeed + Math.PI) * walkAmplitude;
            
            armL.rotation.x = Math.sin(walkSpeed + Math.PI) * (walkAmplitude * 0.7);
            armR.rotation.x = Math.sin(walkSpeed) * (walkAmplitude * 0.7);

            humanGroup.position.y = 15 + Math.abs(Math.sin(walkSpeed * 2)) * 2.0; 
            torso.rotation.y = Math.sin(walkSpeed) * 0.08; 
            head.rotation.y = Math.sin(walkSpeed + Math.PI) * 0.04; 

            // Rotación de la base completa
            baseGroup.rotation.y -= 0.003;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
